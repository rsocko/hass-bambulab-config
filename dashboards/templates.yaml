sensor:
  - name: "spoolman_tray_map"
    state: "ok"
    attributes:
      tray_map: >
        {% set trays = {
          'ams_1_tray_1': 'sensor.p1s_01p00c460102350_ams_1_tray_1',
          'ams_1_tray_2': 'sensor.p1s_01p00c460102350_ams_1_tray_2',
          'ams_1_tray_3': 'sensor.p1s_01p00c460102350_ams_1_tray_3',
          'ams_1_tray_4': 'sensor.p1s_01p00c460102350_ams_1_tray_4',

          'ams_2_tray_1': 'sensor.p1s_01p00c460102350_ams_2_tray_1',
          'ams_2_tray_2': 'sensor.p1s_01p00c460102350_ams_2_tray_2',
          'ams_2_tray_3': 'sensor.p1s_01p00c460102350_ams_2_tray_3',
          'ams_2_tray_4': 'sensor.p1s_01p00c460102350_ams_2_tray_4',

          'external_spool' : 'sensor.ntk_ryansoffice_3dprinter_external_spool'
        } %}

        {% set spool_entities = states.sensor
          | selectattr('entity_id', 'match', 'sensor\\.spoolman_spool_\\d+$')
          | rejectattr('attributes.extra_sealed', 'equalto', true)
          | list
        %}

        {% set EMPTY_UUID = '00000000000000000000000000000000' %}
        {% set EMPTY_COLOR = 'none' %}
        {% set empty_tray_result = {
          'spool_id': none,
          'name': 'Empty',
          'desiccant': none,
          'filled': none,
          'status': 'empty',
          'color': none,
          'reason': none
        } %}
        
        {% set ns = namespace(result={}) %}
        {% set now_ts = now().timestamp() %}

        {% for tray_name, tray_entity in trays.items() %}
          {% set tray_type = state_attr(tray_entity, 'type') %}
          {% set tray_uuid = state_attr(tray_entity, 'tray_uuid') %}
          {% set tray_color = state_attr(tray_entity, 'color') | lower %}
          
          {# --- EMPTY TRAY HANDLING --- #} 
          {% if tray_type == 'Empty' %}
            {% set ns.result = ns.result | combine({tray_name: empty_tray_result}) %}
            {% continue %}
          {% endif %}
          
          {# --- EMPTY EXTERNAL SPOOL HANDLING --- #}
          {# External spool doesn't have 'type' attribute like AMS trays do #}
          {# Detection signals: name='Empty', UUID=all zeros, color alpha=00 #}
          {% if tray_name == 'external_spool' %}
            {% set ext_name = state_attr(tray_entity, 'name') %}
            {% set has_zero_alpha = (tray_color | length >= 8 and tray_color[-2:] == '00') 
                  or (tray_color | replace('#','') | length == 8 and tray_color[-2:] == '00') %}
            {% set is_uuid_empty = (not tray_uuid or tray_uuid == '' or tray_uuid == EMPTY_UUID) %}
            {% set is_color_empty = (not tray_color or tray_color == '' or tray_color == EMPTY_COLOR or has_zero_alpha) %}
            {% if ext_name == 'Empty' or (is_uuid_empty and is_color_empty) %}
              {% set ns.result = ns.result | combine({tray_name: empty_tray_result}) %}
              {% continue %}
            {% endif %}
          {% endif %}
          {# -------------------------------- #}

          {# Normalize tray color: remove '#' and strip transparency characters if 8 hex digits #}
          {% if tray_color %}
            {% if tray_color.startswith('#') %}
              {% set tray_color = tray_color[1:] %}
            {% endif %}
            {% if tray_color | length == 8 %}
              {% set tray_color = tray_color[0:6] %}
            {% endif %}
          {% endif %}
          
          {% set match = none %}
          {% set spool_entity = none %}
          {% set match_reason = none %}

          {% if tray_uuid and tray_uuid != '' and tray_uuid != EMPTY_UUID %}
            {# Match by tray_uuid #}
            {% set match = spool_entities
              | selectattr('attributes.extra_spool_uuid', 'equalto', tray_uuid)
              | list
            %}
            {% if match | length > 1 %}
              {% set match_reason = 'Multiple spools with UUID ' ~ tray_uuid ~ ' - ensure UUIDs are unique' %}
              {% set match = [] %}
            {% elif match | length == 0 %}
              {% set match_reason = 'No unsealed spool with UUID ' ~ tray_uuid %}
            {% endif %}
          {% else %}
            {# Fallback: Match by color, exclude Bambu Lab filament #}
            {% set match = spool_entities
              | selectattr('attributes.filament_color_hex', 'equalto', tray_color)
              | rejectattr('attributes.filament_vendor_name', 'equalto', 'Bambu Lab')
              | list
            %}
            {% if match | length > 1 %}
              {% set match_reason = 'Multiple unsealed spools with color #' ~ tray_color %}
              {% set match = [] %}
            {% elif match | length == 0 %}
              {% set match_reason = 'No unsealed spool with color #' ~ tray_color %}
            {% endif %}
          {% endif %}

          {% if match %}
            {% set spool_entity = match[0] %}
            {% set spool_id = spool_entity.entity_id.split('_')[-1] %}
            {% set spool_name = spool_entity.attributes.friendly_name %}

            {% set desiccant = spool_entity.attributes.extra_desiccant_in_spool | default(None) %}
            {% set filled = spool_entity.attributes.extra_desiccant_filled | default(None) %}
            {% if filled is string
              and filled != ''
              and filled != 'unknown'
              and as_timestamp(filled | default(0)) is number
              and as_timestamp(filled | default(0)) > 0
              and as_timestamp(filled | default(0)) < now_ts %}

              {% set filled_ts = as_timestamp(filled) %}
            {% else %}
              {% set filled_ts = none %}
            {% endif %}

            
            {% if not desiccant or not filled_ts %}
              {% set status = 'undefined' %}
            {% else %}
              {% set age = (now_ts - filled_ts) / 86400 %}
              {% if age < 30 %}
                {% set status = 'green' %}
              {% elif age < 45 %}
                {% set status = 'yellow' %}
              {% elif age < 60 %}
                {% set status = 'orange' %}
              {% else %}
                {% set status = 'red' %}
              {% endif %}
            {% endif %}


            {% set ns.result = ns.result | combine({
              tray_name: {
                'spool_id': spool_id,
                'name': spool_name,
                'desiccant': desiccant,
                'filled': filled,
                'status': status,
                'color': tray_color,
                'reason': none
              }
            }) %}
          {% else %}
            {% set ns.result = ns.result | combine({
              tray_name: {
                'spool_id': none,
                'name': 'Unknown Filament',
                'desiccant': none,
                'filled': none,
                'status': 'undefined',
                'color': tray_color,
                'reason': match_reason
              }
            }) %}
          {% endif %}
        {% endfor %}

        {{ ns.result | tojson | from_json }}

  - name: "spoolman_filament_totals"
    state: "ok"
    attributes:
      totals: >
        {% set spool_entities = states.sensor
          | selectattr('entity_id', 'match', 'sensor\\.spoolman_spool_\\d+$')
          | list
        %}
        {% set ns = namespace(result={}) %}
        {% for spool in spool_entities %}
          {% set fid = spool.attributes.filament_id | string %}
          {% if fid and fid != 'None' %}
            {% set w = spool.attributes.remaining_weight | default(0) | float(0) %}
            {% set sid = spool.entity_id.split('_') | last %}
            {% set spool_entry = {
              'id': sid,
              'entity_id': spool.entity_id,
              'name': spool.attributes.friendly_name | default('Spool'),
              'location': spool.attributes.location | default('N/A'),
              'remaining': w
            } %}
            {% if ns.result[fid] is defined %}
              {% set existing = ns.result[fid] %}
              {% set ns.result = ns.result | combine({
                fid: {
                  'weight': existing.weight + w,
                  'count': existing.count + 1,
                  'spools': existing.spools + [spool_entry]
                }
              }) %}
            {% else %}
              {% set ns.result = ns.result | combine({
                fid: {
                  'weight': w,
                  'count': 1,
                  'spools': [spool_entry]
                }
              }) %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.result | tojson | from_json }}

  - name: "print_cost"
    unit_of_measurement: "$"
    state: >
      {#
        NOTE: HA template sensors evaluate state and attributes independently,
        so the tray_weight_keys mapping and pricing logic are intentionally
        repeated in the breakdown attribute below.
      #}

      {# Mapping: tray_map key → print_weight sensor attribute key #}
      {% set tray_weight_keys = {
        'ams_1_tray_1': 'AMS 1 Tray 1',
        'ams_1_tray_2': 'AMS 1 Tray 2',
        'ams_1_tray_3': 'AMS 1 Tray 3',
        'ams_1_tray_4': 'AMS 1 Tray 4',
        'ams_2_tray_1': 'AMS 2 Tray 1',
        'ams_2_tray_2': 'AMS 2 Tray 2',
        'ams_2_tray_3': 'AMS 2 Tray 3',
        'ams_2_tray_4': 'AMS 2 Tray 4',
        'external_spool': 'External Spool'
      } %}

      {% set tray_map = state_attr('sensor.spoolman_tray_map', 'tray_map') %}
      {% set weight_attrs = states.sensor.ntk_ryansoffice_3dprinter_print_weight.attributes %}
      {% set default_price_per_kg = states('input_number.print_cost_default_per_kg') | float(20.0) %}
      {# Default initial_weight 1000 g = standard 1 kg spool #}
      {% set default_spool_weight_g = 1000 %}
      {% set ns = namespace(total=0.0) %}

      {% if tray_map %}
        {% for tray_key, tray_data in tray_map.items() %}
          {% set weight_key = tray_weight_keys.get(tray_key) %}
          {% set print_weight = weight_attrs.get(weight_key, 0) | float(0) %}

          {% if print_weight > 0 and tray_data.spool_id is not none %}
            {% set spool_entity = 'sensor.spoolman_spool_' ~ tray_data.spool_id %}
            {# | float(-1) safely converts None/'None'/missing to -1, so >= 0 means a real price was set #}
            {% set spool_price = state_attr(spool_entity, 'price') | float(-1) %}
            {% set filament_price = state_attr(spool_entity, 'filament_price') | float(-1) %}
            {% set initial_weight = state_attr(spool_entity, 'initial_weight') | float(default_spool_weight_g) %}

            {# Determine price per gram: spool price → filament price → default #}
            {% if spool_price >= 0 %}
              {% set price_per_gram = spool_price / initial_weight %}
            {% elif filament_price >= 0 %}
              {% set price_per_gram = filament_price / initial_weight %}
            {% else %}
              {% set price_per_gram = default_price_per_kg / 1000 %}
            {% endif %}

            {% set ns.total = ns.total + (print_weight * price_per_gram) %}
          {% endif %}
        {% endfor %}
      {% endif %}

      {{ ns.total | round(2) }}

    attributes:
      breakdown: >
        {# Mapping: tray_map key → print_weight sensor attribute key #}
        {% set tray_weight_keys = {
          'ams_1_tray_1': 'AMS 1 Tray 1',
          'ams_1_tray_2': 'AMS 1 Tray 2',
          'ams_1_tray_3': 'AMS 1 Tray 3',
          'ams_1_tray_4': 'AMS 1 Tray 4',
          'ams_2_tray_1': 'AMS 2 Tray 1',
          'ams_2_tray_2': 'AMS 2 Tray 2',
          'ams_2_tray_3': 'AMS 2 Tray 3',
          'ams_2_tray_4': 'AMS 2 Tray 4',
          'external_spool': 'External Spool'
        } %}

        {% set tray_map = state_attr('sensor.spoolman_tray_map', 'tray_map') %}
        {% set weight_attrs = states.sensor.ntk_ryansoffice_3dprinter_print_weight.attributes %}
        {% set default_price_per_kg = states('input_number.print_cost_default_per_kg') | float(20.0) %}
        {# Default initial_weight 1000 g = standard 1 kg spool #}
        {% set default_spool_weight_g = 1000 %}
        {% set ns = namespace(result={}) %}

        {% if tray_map %}
          {% for tray_key, tray_data in tray_map.items() %}
            {% set weight_key = tray_weight_keys.get(tray_key) %}
            {% set print_weight = weight_attrs.get(weight_key, 0) | float(0) %}

            {% if print_weight > 0 and tray_data.spool_id is not none %}
              {% set spool_entity = 'sensor.spoolman_spool_' ~ tray_data.spool_id %}
              {# | float(-1) safely converts None/'None'/missing to -1, so >= 0 means a real price was set #}
              {% set spool_price = state_attr(spool_entity, 'price') | float(-1) %}
              {% set filament_price = state_attr(spool_entity, 'filament_price') | float(-1) %}
              {% set initial_weight = state_attr(spool_entity, 'initial_weight') | float(default_spool_weight_g) %}

              {# Determine price per gram: spool price → filament price → default #}
              {% if spool_price >= 0 %}
                {% set price_per_gram = spool_price / initial_weight %}
                {% set price_source = 'spool' %}
              {% elif filament_price >= 0 %}
                {% set price_per_gram = filament_price / initial_weight %}
                {% set price_source = 'filament' %}
              {% else %}
                {% set price_per_gram = default_price_per_kg / 1000 %}
                {% set price_source = 'default' %}
              {% endif %}

              {% set ns.result = ns.result | combine({
                weight_key: {
                  'cost': (print_weight * price_per_gram) | round(4),
                  'weight': print_weight,
                  'price_per_kg': (price_per_gram * 1000) | round(2),
                  'name': tray_data.name,
                  'color': tray_data.color,
                  'price_source': price_source
                }
              }) %}
            {% endif %}
          {% endfor %}
        {% endif %}

        {{ ns.result | tojson | from_json }}
