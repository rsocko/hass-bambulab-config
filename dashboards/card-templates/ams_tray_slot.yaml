# ams_tray_slot — Declutter-Card Template (Inline / No configuration.yaml Required)
#
# This file documents the declutter-card template that provides full AMS tray slot cards
# (label + detail + spool popup) without any entry in configuration.yaml.
#
# How it works
# ------------
# The declutter-card template (defined in the dashboard YAML decluttercard: section) embeds
# the complete card definitions inline. No button_card_templates global loading is needed.
# declutter-card handles variable substitution; button-card handles card rendering.
#
# The three card-template files in this directory document the individual card components
# that are embedded in the decluttercard: block:
#   ams_tray_label.yaml  — label card definition (slot name + active highlight)
#   ams_tray_detail.yaml — detail card definition (filament name, weight, desiccant)
#   ams_tray_popup.yaml  — popup tap_action definition (merged into detail card)
#
# Prerequisites
# -------------
# Install via HACS → Frontend:
#   - declutter-card  (provides custom:declutter-card)
#   - button-card     (provides custom:button-card — used inside the template)
#   - browser-mod     (required for the spool info popup)
# No changes to configuration.yaml are required.
#
# Setup
# -----
# Step 1. Copy the entire decluttercard: block from lovelace.3d_printing (everything
#         from "decluttercard:" down to but NOT including "views:") and paste it at
#         the top of your dashboard YAML, before the "views:" key.
#
#         The block is large (~770 lines) because it embeds the full button-card
#         definitions inline. This is intentional — it makes the template self-contained
#         and requires no external files or configuration.yaml changes.
#
# Step 2. Use the template in your dashboard with custom:declutter-card:
#
#   - type: custom:declutter-card
#     template: ams_tray_slot
#     variables:
#       - trayName: A1
#       - trayEntityId: sensor.YOUR_PRINTER_ams_1_tray_1
#       - tray: ams_1_tray_1
#       - trayLabel: AMS 1 · Slot 1
#       - printWeightKey: AMS 1 Tray 1
#
# Cross-Dashboard Reuse
# ---------------------
# Because the decluttercard: block is self-contained (no external dependencies), adding
# AMS tray cards to a second dashboard only requires:
#   1. Copy the decluttercard: block to the top of the new dashboard YAML.
#   2. Use custom:declutter-card with just the variables — all card logic is already embedded.
# No configuration.yaml changes, no file copies, no HA restart needed for the templates.
#
# Variables
# ---------
# trayName        Display label shown on the slot card (e.g. "A1", "B3", "External")
# trayEntityId    Entity ID of the AMS tray sensor (used for active-spool highlight
#                 and popup fallback display)
# tray            Tray key in the spoolman_tray_map (e.g. "ams_1_tray_1",
#                 "ams_2_tray_3", "external_spool")
# trayLabel       Human-readable label shown in the popup header
#                 (e.g. "AMS 1 · Slot 1", "External Spool")
# printWeightKey  Attribute key in sensor.ntk_ryansoffice_3dprinter_print_weight
#                 (e.g. "AMS 1 Tray 1", "AMS 2 Tray 3", "External")
#
# Sensor References (update to match your setup)
# -----------------------------------------------
# Inside the embedded card definitions, update these references as needed:
#   sensor.spoolman_tray_map            — Spoolman tray-to-spool mapping sensor
#   sensor.spoolman_filament_totals     — Filament weight totals sensor
#   sensor.ntk_ryansoffice_3dprinter_print_weight  — Active print weight sensor
#   SPOOLMAN_BASE_URL                   — Base URL for Spoolman web UI (in tap_action JS)
