# Issue #516 - Option 6
# Bottom bar with milestone ticks (25/50/75/100) and active milestone highlight.

type: horizontal-stack
cards:
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_current_layer
    triggers_update:
      - sensor.ntk_ryansoffice_3dprinter_total_layer_count
      - sensor.ntk_ryansoffice_3dprinter_print_status
      - sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[ 
          const currentLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_current_layer']?.state);
          const totalLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_total_layer_count']?.state);
          const hasLayerData = Number.isFinite(currentLayer) && Number.isFinite(totalLayer) && totalLayer > 0;
          const value = hasLayerData ? `${Math.round(currentLayer)}/${Math.round(totalLayer)}` : 'N/A';
          const pct = hasLayerData ? Math.max(0, Math.min(100, (currentLayer / totalLayer) * 100)) : 0;

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isActive = ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing';
          const isPaused = status === 'pause' || stage === 'pause';
          const color = isActive ? '#2196F3' : isPaused ? '#FF9800' : '#9E9E9E';

          const tick = (p) => {
            return `<span class="opt6-tick" style="left:${p}%;"></span>`;
          };

          return `<div class="opt6-wrap">
            <div class="opt6-value">${value}</div>
            <div class="opt6-footer">
              <span class="opt6-label">Layer Progress</span>
              <ha-icon icon="mdi:layers-triple" class="opt6-icon" style="color:${color};"></ha-icon>
            </div>
            <div class="opt6-track-wrap">
              <div class="opt6-track">
                <div class="opt6-fill" style="width:${pct}%; background:${color};"></div>
                ${tick(25)}${tick(50)}${tick(75)}${tick(100)}
              </div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 0
        - min-height: 104px
        - overflow: hidden
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
      custom_fields:
        body:
          - width: 100%
    extra_styles: |
      .opt6-wrap { display:flex; flex-direction:column; width:100%; min-height:104px; }
      .opt6-value { font-size:34px; font-weight:700; text-align:center; line-height:1; padding:8px 0; flex-grow:1; display:flex; align-items:center; justify-content:center; }
      .opt6-footer { display:grid; grid-template-columns:18px 1fr 18px; align-items:center; margin-bottom:8px; padding:0 12px; }
      .opt6-label { grid-column:2; text-align:center; font-size:11px; font-weight:500; opacity:0.75; }
      .opt6-icon { grid-column:3; justify-self:end; --mdc-icon-size:18px; }
      .opt6-track-wrap { padding: 0; }
      .opt6-track { position:relative; width:100%; height:5px; background:rgba(120,120,120,0.22); overflow:visible; }
      .opt6-fill { height:100%; transition: width 0.35s ease; }
      .opt6-tick { position:absolute; top:-2px; width:2px; height:9px; transform:translateX(-1px); background:rgba(255,255,255,0.85); border-radius:1px; z-index:1; }
    grid_options:
      columns: 6

  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_print_progress
    triggers_update:
      - sensor.ntk_ryansoffice_3dprinter_print_status
      - sensor.ntk_ryansoffice_3dprinter_current_stage
