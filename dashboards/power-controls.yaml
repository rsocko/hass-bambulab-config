        }
        ha-card:hover {
          background: {% if is_state('switch.tp_link_power_strip_ab64_3d_printer', 'on') %}rgba(244, 67, 54, 0.22){% else %}rgba(76, 175, 80, 0.22){% endif %};
        }

# ============================================================
# NOTES:
# ============================================================
# 1. Confirmation dialog:
#    Each button shows an "Are you sure?" dialog before toggling.
#    The dialog defaults to Cancel so accidental taps are safe.
#
# 2. Color coding:
#    RED  (on)  = device is currently powered ON  → tap to turn OFF
#    GREEN (off) = device is currently powered OFF → tap to turn ON
#
# 3. Placement:
#    Add this card below the fan controls row in your dashboard.
#
# 4. Entity IDs:
#    - switch.tp_link_power_strip_ab64_ams_heater         (3D Printer)
#    - switch.tp_link_power_strip_ab64_3d_printer_camera  (Front Camera)
#    - switch.tp_link_power_strip_ab64_3d_printer         (Filament Dryer)
# ============================================================
