          Turn {{ 'off' if is_state('switch.tp_link_power_strip_ab64_3d_printer_camera', 'on') else 'on' }} the Front Camera?
        exemptions: []
    hold_action:
      action: more-info
    card_mod:
      style: |
        ha-card {
          padding: 4px 8px !important;
          border-radius: 16px;
          background: {% if is_state('switch.tp_link_power_strip_ab64_3d_printer_camera', 'on') %}rgba(244, 67, 54, 0.12){% else %}rgba(76, 175, 80, 0.12){% endif %};
          border: 1px solid {% if is_state('switch.tp_link_power_strip_ab64_3d_printer_camera', 'on') %}rgba(244, 67, 54, 0.4){% else %}rgba(76, 175, 80, 0.4){% endif %};
          transition: background 0.2s, border 0.2s;
          --icon-size: 24px;
          --card-primary-font-size: 0.8rem;
          --card-primary-font-weight: 600;
          --card-secondary-font-size: 0rem;
        }
        ha-card:hover {
          background: {% if is_state('switch.tp_link_power_strip_ab64_3d_printer_camera', 'on') %}rgba(244, 67, 54, 0.22){% else %}rgba(76, 175, 80, 0.22){% endif %};
        }

  # ── FILAMENT DRYER ──────────────────────────────────────
  - type: custom:mushroom-template-card
    entity: switch.tp_link_power_strip_ab64_3d_printer
    primary: Filament Dryer
    secondary: ""
    icon: mdi:heat-wave
    icon_color: >-
      {% if is_state('switch.tp_link_power_strip_ab64_3d_printer', 'on') %}
        red
      {% else %}
        green
      {% endif %}
    tap_action:
      action: toggle
      confirmation:
        text: >-
          Turn {{ 'off' if is_state('switch.tp_link_power_strip_ab64_3d_printer', 'on') else 'on' }} the Filament Dryer?
        exemptions: []
    hold_action:
      action: more-info
    card_mod:
      style: |
        ha-card {
          padding: 4px 8px !important;
          border-radius: 16px;
          background: {% if is_state('switch.tp_link_power_strip_ab64_3d_printer', 'on') %}rgba(244, 67, 54, 0.12){% else %}rgba(76, 175, 80, 0.12){% endif %};
          border: 1px solid {% if is_state('switch.tp_link_power_strip_ab64_3d_printer', 'on') %}rgba(244, 67, 54, 0.4){% else %}rgba(76, 175, 80, 0.4){% endif %};
          transition: background 0.2s, border 0.2s;
          --icon-size: 24px;
