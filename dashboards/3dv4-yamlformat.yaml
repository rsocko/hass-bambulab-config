views:
  - title: Home
    sections:
      - type: grid
        cards:
          - type: conditional
            conditions:
              - entity: binary_sensor.ntk_ryansoffice_3dprinter_hms_errors
                state: 'on'
            card:
              type: vertical-stack
              cards:
                - type: custom:mushroom-template-card
                  primary: ⚠️ HMS ERROR ALERT
                  secondary: >-
                    {{
                    states('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors')
                    | title }} - {{
                    state_attr('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors',
                    'count') | int }} Error(s)
                  icon: mdi:alert-circle
                  icon_color: red
                  fill_container: false
                  tap_action:
                    action: more-info
                  card_mod:
                    style: |-
                      : |
                        ha-card {
                          background: rgba(244, 67, 54, 0.15);
                          border: 2px solid var(--red-color);
                          --card-mod-icon-color: red;
                        }
                - type: markdown
                  content: >-
                    {% set errors =
                    state_attr('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors',
                    'errors') %}

                    {% if errors %}

                    {% for error in errors %}

                    **Error {{ loop.index }}:** {{ error.attr }}


                    **Code:** {{ error.code }}


                    {{ error.text }}


                    ---

                    {% endfor %}

                    {% else %}

                    No error details available

                    {% endif %}
                  card_mod:
                    style: |-
                      : |
                        ha-card {
                          background: rgba(244, 67, 54, 0.08);
                          border-left: 4px solid var(--red-color);
                        }
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ntk_ryansoffice_3dprinter_print_status
            name: Print Status
            icon: mdi:rotate-3d
            show_state: true
            show_attribute: false
            tap_action:
              action: more-info
            styles: |2-

                            .bubble-button-card-container {
                              background: var(--ha-card-background);
                            }
                            .bubble-name {
                              font-size: 18px !important;
                              font-weight: 600;
                            }
                            .bubble-state {
                              font-size: 16px !important;
                            }
                          
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ntk_ryansoffice_3dprinter_current_stage
            name: Current Stage
            icon: mdi:printer-3d
            show_state: true
            show_attribute: false
            tap_action:
              action: more-info
            styles: |2-

                            .bubble-button-card-container {
                              background: var(--ha-card-background);
                            }
                            .bubble-name {
                              font-size: 18px !important;
                              font-weight: 600;
                            }
                            .bubble-state {
                              font-size: 16px !important;
                            }
                          
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.ntk_ryansoffice_3dprinter_task_name
            name: Task Name
            icon: mdi:cube-outline
            show_state: true
            show_attribute: false
            tap_action:
              action: more-info
            styles: |2-

                            .bubble-button-card-container {
                              background: var(--ha-card-background);
                            }
                            .bubble-name {
                              font-size: 18px !important;
                              font-weight: 600;
                            }
                            .bubble-state {
                              font-size: 16px !important;
                            }
                          
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: binary_sensor.ntk_ryansoffice_3dprinter_hms_errors
            name: HMS Errors
            show_state: true
            show_attribute: false
            tap_action:
              action: more-info
            styles: |2-

                            .bubble-button-card-container {
                              background: var(--ha-card-background);
                            }
                            .bubble-name {
                              font-size: 18px !important;
                              font-weight: 600;
                            }
                            .bubble-state {
                              font-size: 16px !important;
                            }
                          
          - type: custom:mushroom-template-card
            entity: sensor.print_layer_progress_formatted
            primary: Layer Progress
            secondary: '{{ states(''sensor.print_layer_progress_formatted'') }}'
            icon: fas:layer-group
            icon_color: blue
            layout: vertical
            tap_action:
              action: more-info
            card_mod:
              style: |2-

                                  ha-card {
                                    font-size: 16px;
                                  }
                                  .primary {
                                    font-size: 18px !important;
                                    font-weight: 600;
                                  }
                                  .secondary {
                                    font-size: 22px !important;
                                    font-weight: 700;
                                  }
                                
          - type: custom:mushroom-template-card
            entity: sensor.ntk_ryansoffice_3dprinter_print_progress
            primary: Print Progress
            secondary: '{{ states(''sensor.ntk_ryansoffice_3dprinter_print_progress'') }}'
            icon: mdi:progress-helper
            icon_color: green
            layout: vertical
            tap_action:
              action: more-info
            card_mod:
              style: |2-

                                  ha-card {
                                    font-size: 16px;
                                  }
                                  .primary {
                                    font-size: 18px !important;
                                    font-weight: 600;
                                  }
                                  .secondary {
                                    font-size: 22px !important;
                                    font-weight: 700;
                                  }
                                
          - type: custom:mushroom-template-card
            entity: sensor.print_time_remaining_formatted
            primary: Time Remaining
            secondary: '{{ states(''sensor.print_time_remaining_formatted'') }}'
            icon: mdi:progress-clock
            icon_color: orange
            layout: vertical
            tap_action:
              action: more-info
            card_mod:
              style: |2-

                                  ha-card {
                                    font-size: 16px;
                                  }
                                  .primary {
                                    font-size: 18px !important;
                                    font-weight: 600;
                                  }
                                  .secondary {
                                    font-size: 22px !important;
                                    font-weight: 700;
                                  }
                                
          - type: custom:config-template-card
            entities:
              - sensor.ntk_ryansoffice_3dprinter_end_time
            card:
              type: custom:mushroom-template-card
              entity: sensor.ntk_ryansoffice_3dprinter_end_time
              primary: Est. Completion
              secondary: >-
                {% set state =
                states('sensor.ntk_ryansoffice_3dprinter_end_time') %}{% if
                state not in ['unavailable', 'unknown'] and state is not none
                %}{{ as_timestamp(state) | timestamp_custom('%I:%M %p', true)
                }}{% else %}N/A{% endif %}
              icon: mdi:clock-end
              icon_color: purple
              layout: vertical
              tap_action:
                action: more-info
              card_mod:
                style: |2-

                                        ha-card {
                                          font-size: 16px;
                                        }
                                        .primary {
                                          font-size: 18px !important;
                                          font-weight: 600;
                                        }
                                        .secondary {
                                          font-size: 22px !important;
                                          font-weight: 700;
                                        }
                                      
          - type: picture-entity
            entity: camera.ntk_ryansoffice_3dprinter_camera
            name: Printer Camera
            show_name: true
            show_state: false
            tap_action:
              action: more-info
            camera_view: live
          - type: picture-entity
            entity: image.ntk_ryansoffice_3dprinter_cover_image
            name: Print Preview
            show_name: true
            show_state: false
            tap_action:
              action: more-info
        columns: 2
        square: false
      - type: grid
        cards:
          - type: custom:ha-bambulab-print_status-card
            printer: 210dfdfa64085e8cf073e50eae757d90
            style: simple
            custom_power: switch.sonoff_10018b4baf
          - type: custom:advanced-camera-card
            cameras:
              - camera_entity: camera.ntk_ryansoffice_3dprinter_camera
                live_provider: auto
                capabilities:
                  disable: []
                always_error_if_entity_unavailable: false
                image:
                  mode: camera
              - camera_entity: camera.3dprintertopcamera_hd_stream
            status_bar:
              items:
                engine:
                  enabled: true
                resolution:
                  enabled: true
              style: none
            performance:
              features:
                card_loading_effects: false
                animated_progress_indicator: true
                card_loading_indicator: true
              style:
                border_radius: true
            view:
              dim: false
              theme:
                themes:
                  - dark
              default_cycle_camera: false
            menu:
              buttons:
                iris:
                  enabled: false
                camera_ui:
                  enabled: false
                expand:
                  enabled: true
                display_mode:
                  enabled: true
                  alignment: opposing
                live:
                  enabled: false
                cameras:
                  enabled: false
                substreams:
                  enabled: false
                clips:
                  enabled: false
                snapshots:
                  enabled: false
                download:
                  enabled: false
                timeline:
                  enabled: false
                folders:
                  enabled: false
                media_player:
                  enabled: false
                image:
                  enabled: false
              style: overlay
              alignment: right
            live:
              draggable: true
              zoomable: true
              show_image_during_load: true
              controls:
                builtin: true
                wheel: true
              display: {}
            media_gallery:
              controls:
                thumbnails:
                  size: 228
      - type: grid
        cards:
          - type: custom:ha-bambulab-ams-card
            entity: ''
            header: ''
            subtitle: AMS 1
            style: vector
            ams: bb6d8ff7b5587a848196c105ca8920c3
            show_type: false
            show_info_bar: true
            custom_humidity: sensor.ntk_ryansoffice_3dprinterams1_humidity_temperature_humidity
            custom_temperature: >-
              sensor.ntk_ryansoffice_3dprinterams1_humidity_temperature_temperature
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    name: A1
                    show_icon: false
                    show_state: false
                    styles:
                      card:
                        - background: none
                        - box-shadow: none
                        - padding: 4px
                      name:
                        - font-size: 14px
                        - font-weight: bold
                        - justify-self: center
                  - type: custom:button-card
                    entity: |
                      [[[
                        const tray = 'ams_1_tray_1';
                        const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
                        const spoolId = map?.[tray]?.spool_id;

                        return spoolId
                          ? `sensor.spoolman_spool_${spoolId}`
                          : 'sensor.p1s_01p00c460102350_ams_1_tray_1';
                      ]]]
                    name: |
                      [[[
                        const tray = 'ams_1_tray_1';
                        const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
                        return map?.[tray]?.name ?? 'EMPTY';
                      ]]]
                    label: |
                      [[[
                        const tray = 'ams_1_tray_1';
                        const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
                        return map?.[tray]?.reason ?? '';
                      ]]]
                    show_state: false
                    show_icon: false
                    show_label: true
                    tap_action: |
                      [[[
                        const tray = 'ams_1_tray_1';
                        const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
                        const spoolId = map?.[tray]?.spool_id;

                        return spoolId
                          ? { action: 'more-info', entity: `sensor.spoolman_spool_${spoolId}` }
                          : { action: 'none' };
                      ]]]
                    custom_fields:
                      desiccant_icon: |
                        [[[
                          const tray = 'ams_1_tray_1';
                          const status = states['sensor.spoolman_tray_map']?.attributes?.tray_map?.[tray]?.status;

                          // Hide droplet for green OR empty trays
                          if (status === 'green' || status === 'empty') return '';

                          const colors = {
                            undefined: '#9e9e9e',
                            yellow: '#ffcc00',
                            orange: '#ff9900',
                            red: '#cc0000'
                          };
                          
                          const color = colors[status] || '#9e9e9e';
                          return `<ha-icon icon="mdi:water" style="--mdc-icon-size: 16px; color: ${color};"></ha-icon>`;
                        ]]]
                      remaining_weight: |
                        [[[
                          const tray = 'ams_1_tray_1';
                          const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
                          const spoolId = map?.[tray]?.spool_id;
                          
                          if (!spoolId) return '';
                          
                          const spoolentity = states[`sensor.spoolman_spool_${spoolId}`];
                          const weight = spoolentity?.attributes?.remaining_weight;
                          
                          if (weight === undefined || weight === null) return '';
                          
                          return `<span style="font-size: 10px; color: #888;">${Math.round(weight)}g</span>`;
                        ]]]
                      placeholder: |
                        [[[
                          return '';
                        ]]]
                    styles:
                      card:
                        - padding: 6px
                        - background: none
                        - box-shadow: none
                      grid:
                        - grid-template-areas: '"n n n" "l l l" "desiccant_icon . remaining_weight"'
