# Issue #516 - Option 2
# Variant of option 1 where the bar color shifts as completion approaches 100%.

type: horizontal-stack
cards:
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_current_layer
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[ 
          const currentLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_current_layer']?.state);
          const totalLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_total_layer_count']?.state);
          const hasLayerData = Number.isFinite(currentLayer) && Number.isFinite(totalLayer) && totalLayer > 0;
          const value = hasLayerData ? `${Math.round(currentLayer)}/${Math.round(totalLayer)}` : 'N/A';
          const pct = hasLayerData ? Math.max(0, Math.min(100, (currentLayer / totalLayer) * 100)) : 0;

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isPaused = status === 'pause' || stage === 'pause';
          const isIdle = !( ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing' ) && !isPaused;

          const progressColor = pct < 25 ? '#E53935' : pct < 50 ? '#FB8C00' : pct < 75 ? '#FDD835' : pct < 90 ? '#8BC34A' : '#43A047';
          const barColor = isPaused ? '#FF9800' : isIdle ? '#9E9E9E' : progressColor;

          return `<div class="opt-card-wrap">
            <div class="opt-card-value">${value}</div>
            <div class="opt-card-footer">
              <span class="opt-card-label">Layer Progress · Option 2</span>
              <ha-icon icon="mdi:layers-triple" class="opt-card-icon" style="color:${barColor};"></ha-icon>
            </div>
            <div class="opt-bottom-track">
              <div class="opt-bottom-fill" style="width:${pct}%; background:${barColor};"></div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 12px
        - min-height: 102px
      custom_fields:
        body:
          - width: 100%
    extra_styles: |
      .opt-card-wrap { display:flex; flex-direction:column; width:100%; min-height:78px; }
      .opt-card-value { font-size:34px; font-weight:700; text-align:center; line-height:1; padding:8px 0; flex-grow:1; display:flex; align-items:center; justify-content:center; }
      .opt-card-footer { display:grid; grid-template-columns:18px 1fr 18px; align-items:center; margin-bottom:8px; }
      .opt-card-label { grid-column:2; text-align:center; font-size:11px; font-weight:500; opacity:0.75; }
      .opt-card-icon { grid-column:3; justify-self:end; --mdc-icon-size:18px; }
      .opt-bottom-track { width:100%; height:4px; background:rgba(120,120,120,0.2); border-radius:999px; overflow:hidden; }
      .opt-bottom-fill { height:100%; border-radius:999px; transition: width 0.35s ease, background-color 0.35s ease; }
    grid_options:
      columns: 6

  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_print_progress
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[ 
          const progress = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_print_progress']?.state);
          const hasProgress = Number.isFinite(progress);
          const pct = hasProgress ? Math.max(0, Math.min(100, progress)) : 0;
          const value = hasProgress ? `${Math.round(pct)}%` : 'N/A';

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isPaused = status === 'pause' || stage === 'pause';
          const isIdle = !( ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing' ) && !isPaused;

          const progressColor = pct < 25 ? '#E53935' : pct < 50 ? '#FB8C00' : pct < 75 ? '#FDD835' : pct < 90 ? '#8BC34A' : '#43A047';
          const barColor = isPaused ? '#FF9800' : isIdle ? '#9E9E9E' : progressColor;

          return `<div class="opt-card-wrap">
            <div class="opt-card-value">${value}</div>
            <div class="opt-card-footer">
              <span class="opt-card-label">Print Progress · Option 2</span>
              <ha-icon icon="mdi:rotate-right" class="opt-card-icon" style="color:${barColor};"></ha-icon>
            </div>
            <div class="opt-bottom-track">
              <div class="opt-bottom-fill" style="width:${pct}%; background:${barColor};"></div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 12px
        - min-height: 102px
      custom_fields:
        body:
          - width: 100%
    extra_styles: |
      .opt-card-wrap { display:flex; flex-direction:column; width:100%; min-height:78px; }
      .opt-card-value { font-size:34px; font-weight:700; text-align:center; line-height:1; padding:8px 0; flex-grow:1; display:flex; align-items:center; justify-content:center; }
      .opt-card-footer { display:grid; grid-template-columns:18px 1fr 18px; align-items:center; margin-bottom:8px; }
      .opt-card-label { grid-column:2; text-align:center; font-size:11px; font-weight:500; opacity:0.75; }
      .opt-card-icon { grid-column:3; justify-self:end; --mdc-icon-size:18px; }
      .opt-bottom-track { width:100%; height:4px; background:rgba(120,120,120,0.2); border-radius:999px; overflow:hidden; }
      .opt-bottom-fill { height:100%; border-radius:999px; transition: width 0.35s ease, background-color 0.35s ease; }
    grid_options:
      columns: 6
