# Standalone AMS Tray Popup Card for Testing
# This card can be added to any dashboard to test the popup functionality
# Copy this entire configuration into the raw config editor

type: custom:button-card
entity: |
  [[[
  const tray = 'ams_1_tray_1';
  const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
  const spoolId = map?.[tray]?.spool_id;

  return spoolId
    ? `sensor.spoolman_spool_${spoolId}`
    : 'sensor.p1s_01p00c460102350_ams_1_tray_1';
  ]]]
name: |
  [[[
  const tray = 'ams_1_tray_1';
  const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
  return map?.[tray]?.name ?? 'EMPTY';
  ]]]
label: |
  [[[
  const tray = 'ams_1_tray_1';
  const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
  return map?.[tray]?.reason ?? '';
  ]]]
show_state: false
show_icon: false
show_label: true
tap_action: |
  [[[
  const tray = 'ams_1_tray_1';
  const trayEntity = 'sensor.p1s_01p00c460102350_ams_1_tray_1';
  const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
  const spoolId = map?.[tray]?.spool_id;
  const trayData = map?.[tray];

  return {
    action: 'fire-dom-event',
    browser_mod: {
      service: 'browser_mod.popup',
      data: {
        title: trayData?.name || 'AMS Tray Details',
        content: {
          type: 'vertical-stack',
          cards: [
            {
              type: 'custom:mushroom-template-card',
              primary: trayData?.name || 'No Spool Matched',
              secondary: spoolId ? `Spool ID: ${spoolId}` : `Tray: ${tray.replace('_', ' ').toUpperCase()}`,
              icon: 'mdi:printer-3d-nozzle',
              icon_color: trayData?.status === 'empty' ? 'disabled' : 'primary',
              fill_container: false,
              card_mod: {
                style: `
                  ha-card {
                    background: ${trayData?.color ? '#' + trayData.color + '20' : 'var(--ha-card-background)'};
                  }
                `
              }
            },
            spoolId ? {
              type: 'horizontal-stack',
              cards: [
                {
                  type: 'custom:mushroom-template-card',
                  primary: states['sensor.spoolman_spool_' + spoolId]?.attributes?.filament_material || 'Unknown',
                  secondary: 'Material',
                  icon: 'mdi:texture-box',
                  icon_color: 'orange',
                  fill_container: false
                },
                {
                  type: 'custom:mushroom-template-card',
                  primary: states['sensor.spoolman_spool_' + spoolId]?.attributes?.filament_vendor_name || 'Unknown',
                  secondary: 'Vendor',
                  icon: 'mdi:factory',
                  icon_color: 'purple',
                  fill_container: false
                }
              ]
            } : null,
            spoolId ? {
              type: 'horizontal-stack',
              cards: [
                {
                  type: 'custom:button-card',
                  name: 'Filament Color',
                  show_state: false,
                  show_icon: true,
                  icon: 'mdi:palette',
                  styles: {
                    card: [{
                      'background': trayData?.color ? '#' + trayData.color : '#cccccc',
                      'height': '80px'
                    }],
                    name: [{
                      'color': trayData?.color ? (parseInt(trayData.color.substring(0,2), 16) + parseInt(trayData.color.substring(2,4), 16) + parseInt(trayData.color.substring(4,6), 16)) / 3 > 128 ? '#000' : '#fff' : '#000'
                    }],
                    icon: [{
                      'color': trayData?.color ? (parseInt(trayData.color.substring(0,2), 16) + parseInt(trayData.color.substring(2,4), 16) + parseInt(trayData.color.substring(4,6), 16)) / 3 > 128 ? '#000' : '#fff' : '#000'
                    }]
                  }
                },
                {
                  type: 'custom:mushroom-template-card',
                  primary: `${states['sensor.spoolman_spool_' + spoolId]?.attributes?.remaining_weight || 'N/A'}g`,
                  secondary: 'Remaining',
                  icon: 'mdi:weight-gram',
                  icon_color: 'blue',
                  fill_container: false
                }
              ]
            } : null,
            spoolId && trayData?.desiccant ? {
              type: 'vertical-stack',
              cards: [
                {
                  type: 'custom:mushroom-template-card',
                  primary: 'Desiccant Status',
                  secondary: trayData?.filled ? `Filled: ${new Date(trayData.filled).toLocaleDateString()}` : 'Not Set',
                  icon: 'mdi:water',
                  icon_color: trayData?.status === 'green' ? 'green' : trayData?.status === 'yellow' ? 'yellow' : trayData?.status === 'orange' ? 'orange' : trayData?.status === 'red' ? 'red' : 'disabled',
                  fill_container: false
                },
                {
                  type: 'custom:button-card',
                  name: 'Reset Desiccant Date',
                  icon: 'mdi:update',
                  tap_action: {
                    action: 'call-service',
                    service: 'spoolman.patch_spool',
                    service_data: {
                      spool_id: spoolId,
                      extra: {
                        desiccant_filled: new Date().toISOString()
                      }
                    },
                    confirmation: {
                      text: 'Reset desiccant filled date to now?'
                    }
                  },
                  styles: {
                    card: [{ 'height': '50px' }]
                  }
                }
              ]
            } : null,
            spoolId ? {
              type: 'custom:button-card',
              name: 'Open in Spoolman',
              icon: 'mdi:open-in-new',
              tap_action: {
                action: 'url',
                url_path: `http://homeassistant.local:7912/spools/${spoolId}`
              },
              styles: {
                card: [{ 'height': '50px' }],
                name: [{ 'color': 'var(--primary-color)' }]
              }
            } : null,
            spoolId ? (() => {
              const spoolEntity = states['sensor.spoolman_spool_' + spoolId];
              const firstUsed = spoolEntity?.attributes?.first_used;
              let historyHours = 168;

              if (firstUsed) {
                const firstUsedDate = new Date(firstUsed);
                const now = new Date();
                const daysSinceOpened = Math.floor((now - firstUsedDate) / (1000 * 60 * 60 * 24));
                historyHours = daysSinceOpened * 24 || 24;
              }

              return {
                type: 'history-graph',
                title: firstUsed ? `Weight History (${Math.floor(historyHours / 24)} days)` : 'Weight History',
                entities: [
                  {
                    entity: `sensor.spoolman_spool_${spoolId}`,
                    name: 'Remaining Weight'
                  }
                ],
                hours_to_show: historyHours
              };
            })() : null,
            !spoolId ? {
              type: 'entities',
              title: 'AMS Tray Information',
              entities: [
                {
                  entity: trayEntity,
                  name: 'Tray Entity'
                }
              ]
            } : null,
            spoolId ? {
              type: 'custom:button-card',
              name: 'More Details',
              icon: 'mdi:information',
              tap_action: {
                action: 'more-info',
                entity: `sensor.spoolman_spool_${spoolId}`
              },
              styles: {
                card: [{ 'height': '50px' }]
              }
            } : null
          ].filter(card => card !== null)
        }
      }
    }
  };
  ]]]
custom_fields:
  desiccant_icon: |
    [[[
    const tray = 'ams_1_tray_1';
    const status = states['sensor.spoolman_tray_map']?.attributes?.tray_map?.[tray]?.status;

    if (status === 'green' || status === 'empty') return '';

    const colors = {
      undefined: '#9e9e9e',
      yellow: '#ffcc00',
      orange: '#ff9900',
      red: '#cc0000'
    };

    const color = colors[status] || '#9e9e9e';
    return `<ha-icon icon="mdi:water" style="--mdc-icon-size: 16px; color: ${color};"></ha-icon>`;
    ]]]
  remaining_weight: |
    [[[
    const tray = 'ams_1_tray_1';
    const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
    const spoolId = map?.[tray]?.spool_id;

    if (!spoolId) return '';

    const spoolentity = states[`sensor.spoolman_spool_${spoolId}`];
    const weight = spoolentity?.attributes?.remaining_weight;

    if (weight === undefined || weight === null) return '';

    return `<span style="font-size: 10px; color: #888;">${Math.round(weight)}g</span>`;
    ]]]
  print_weight: |
    [[[
    const tray = 'ams_1_tray_1';
    const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
    const spoolId = map?.[tray]?.spool_id;

    if (!spoolId) return '';

    const printWeightEntity = states['sensor.ntk_ryansoffice_3dprinter_print_weight'];
    const printWeight = printWeightEntity?.attributes?.['AMS 1 Tray 1'];

    if (!printWeight || printWeight === 0) return '';

    const spoolentity = states[`sensor.spoolman_spool_${spoolId}`];
    const remainingWeight = spoolentity?.attributes?.remaining_weight;

    let color = '#888';
    if (remainingWeight !== undefined && remainingWeight !== null) {
      if (remainingWeight < printWeight) {
        color = '#cc0000';
      } else if (remainingWeight < printWeight * 1.1) {
        color = '#ff9900';
      } else if (remainingWeight < printWeight * 1.2) {
        color = '#ffcc00';
      }
    }

    return `<span style="font-size: 10px; color: ${color}; font-weight: ${color !== '#888' ? '600' : '400'};">(−${printWeight.toFixed(1)}g)</span>`;
    ]]]
  placeholder: |
    [[[
    return '';
    ]]]
styles:
  card:
    - padding: 6px
    - background: none
    - box-shadow: none
  grid:
    - grid-template-areas: '"n n n" "l l l" "desiccant_icon . remaining_weight" ". . print_weight"'
    - grid-template-columns: auto 1fr auto
    - grid-template-rows: auto auto auto auto
  name:
    - font-size: 12px
    - white-space: normal
    - line-height: 1.2
    - justify-self: center
    - padding-bottom: 2px
  label:
    - font-size: 9px
    - color: '#888'
    - font-style: italic
    - white-space: normal
    - line-height: 1.1
    - justify-self: center
    - padding-bottom: 4px
  custom_fields:
    desiccant_icon:
      - justify-self: start
      - padding-left: 4px
    remaining_weight:
      - justify-self: end
      - padding-right: 4px
    print_weight:
      - justify-self: end
      - padding-right: 4px
