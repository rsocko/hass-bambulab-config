# ============================================================
# Fan Controls Dashboard Card (Compact Single-Section Layout)
# ============================================================
# Compact badge-style fan controls that fit in a single section.
# Each card shows:
#   - Dual icons: main type icon + badge fan indicator
#   - Speed value (large) on top
#   - Fan name (small, uppercase) below
#   - Hover tooltip with full entity name
#
# ICONS & ANIMATIONS:
#   Aux Fan     → mdi:fan (spins when on; faster at higher speed)
#   Chamber Fan → mdi:fan-chevron-up (spins when on; faster at higher speed)
#   Cooling Fan → mdi:snowflake (slow constant spin when on) + spinning badge fan
#   Bento Box   → mdi:air-filter (wavy translate animation when on) + spinning badge fan
#
# ANIMATION SPEEDS (Aux / Chamber fans):
#   0%       → no spin
#   1-29%    → slow spin (3s per rotation)
#   30-69%   → medium spin (1.5s per rotation)
#   70-100%  → fast spin (0.7s per rotation)
#
# REQUIRED CUSTOM CARDS:
# - mushroom (via HACS)
# - card-mod (via HACS) - for compact styling and animations
#
# SETUP:
# 1. Replace 'ntk_ryansoffice_3dprinter' with your printer name
# 2. Replace 'fan.3dprinter_controller_box_bento_box_fan'
#    with your ESP32 Bento Box fan entity
# 3. Paste into your dashboard
#
# ============================================================

type: horizontal-stack
cards:
  # ── AUX FAN ─────────────────────────────────────
  # Icon: Fan (spinning when on) + "A" badge | High-power auxiliary cooling
  - type: custom:mushroom-template-card
    entity: fan.ntk_ryansoffice_3dprinter_aux_fan
    primary: "{{ states('sensor.ntk_ryansoffice_3dprinter_aux_fan_speed') | int(0) }}%"
    secondary: Aux
    icon: mdi:fan
    badge_icon: mdi:alpha-a-circle
    badge_color: >-
      {% set s = states('sensor.ntk_ryansoffice_3dprinter_aux_fan_speed') |
      int(0) %} {% if s == 0 %}grey{% elif s < 30 %}blue{% elif s < 70 %}amber{%
      else %}red{% endif %}
    icon_color: >-
      {% set s = states('sensor.ntk_ryansoffice_3dprinter_aux_fan_speed') |
      int(0) %} {% if s == 0 %}grey{% elif s < 30 %}blue{% elif s < 70 %}amber{%
      else %}red{% endif %}
    layout: vertical
    fill: false
    multiline_secondary: false
    tap_action:
      action: more-info
      entity: fan.ntk_ryansoffice_3dprinter_aux_fan
    hold_action:
      action: more-info
      entity: sensor.ntk_ryansoffice_3dprinter_aux_fan_speed
    card_mod:
      style: |
        @keyframes fan-spin {
          100% { transform: rotate(360deg); }
        }
        ha-card {
          padding: 4px 4px !important;
          background: transparent;
          border-radius: 12px;
          transition: background 0.2s;
          --icon-size: 28px;
          --card-primary-font-size: 1.1rem;
          --card-primary-font-weight: bold;
          --card-secondary-font-size: 0.65rem;
        }
        ha-card:hover {
          background: rgba(var(--rgb-primary-text-color), 0.05);
        }
        mushroom-state-info {
          text-align: center;
          --card-secondary-letter-spacing: 0.5px;
        }
        mushroom-shape-icon {
          {% set s = states('sensor.ntk_ryansoffice_3dprinter_aux_fan_speed') | int(0) %}
          {% if s >= 70 %}
            animation: fan-spin 0.7s linear infinite;
          {% elif s >= 30 %}
            animation: fan-spin 1.5s linear infinite;
          {% elif s > 0 %}
            animation: fan-spin 3s linear infinite;
          {% else %}
            animation: none;
          {% endif %}
        }

  # ── CHAMBER FAN ─────────────────────────────────
  # Icon: Chamber fan (spinning when on) + cube badge | Circulates air in enclosure
  - type: custom:mushroom-template-card
    entity: fan.ntk_ryansoffice_3dprinter_chamber_fan
    primary: >-
      {{ states('sensor.ntk_ryansoffice_3dprinter_chamber_fan_speed') | int(0)
      }}%
    secondary: Chamber
    icon: mdi:fan-chevron-up
    badge_icon: mdi:cube-outline
    badge_color: >-
      {% set s = states('sensor.ntk_ryansoffice_3dprinter_chamber_fan_speed') |
      int(0) %} {% if s == 0 %}grey{% elif s < 30 %}blue{% elif s < 70 %}amber{%
      else %}red{% endif %}
    icon_color: >-
      {% set s = states('sensor.ntk_ryansoffice_3dprinter_chamber_fan_speed') |
      int(0) %} {% if s == 0 %}grey{% elif s < 30 %}blue{% elif s < 70 %}amber{%
      else %}red{% endif %}
    layout: vertical
    fill: false
    multiline_secondary: false
    tap_action:
      action: more-info
      entity: fan.ntk_ryansoffice_3dprinter_chamber_fan
    hold_action:
      action: more-info
      entity: sensor.ntk_ryansoffice_3dprinter_chamber_fan_speed
    card_mod:
      style: |
        @keyframes fan-spin {
          100% { transform: rotate(360deg); }
        }
        ha-card {
          padding: 4px 4px !important;
          background: transparent;
          border-radius: 12px;
          transition: background 0.2s;
          --icon-size: 28px;
          --card-primary-font-size: 1.1rem;
          --card-primary-font-weight: bold;
          --card-secondary-font-size: 0.65rem;
        }
        ha-card:hover {
          background: rgba(var(--rgb-primary-text-color), 0.05);
        }
        mushroom-state-info {
          text-align: center;
          --card-secondary-letter-spacing: 0.5px;
        }
        mushroom-shape-icon {
          {% set s = states('sensor.ntk_ryansoffice_3dprinter_chamber_fan_speed') | int(0) %}
          {% if s >= 70 %}
            animation: fan-spin 0.7s linear infinite;
          {% elif s >= 30 %}
            animation: fan-spin 1.5s linear infinite;
          {% elif s > 0 %}
            animation: fan-spin 3s linear infinite;
          {% else %}
            animation: none;
          {% endif %}
        }

  # ── COOLING FAN ─────────────────────────────────
  # Icon: Snowflake (slow constant spin when on) + spinning fan badge | Part cooling fan
  - type: custom:mushroom-template-card
    entity: fan.ntk_ryansoffice_3dprinter_cooling_fan
    primary: >-
      {{ states('sensor.ntk_ryansoffice_3dprinter_cooling_fan_speed') | int(0)
      }}%
    secondary: Cooling
    icon: mdi:snowflake
    badge_icon: mdi:fan
    badge_color: >-
      {% set s = states('sensor.ntk_ryansoffice_3dprinter_cooling_fan_speed') |
      int(0) %} {% if s == 0 %}grey{% elif s < 30 %}blue{% elif s < 70 %}cyan{%
      else %}light-blue{% endif %}
    icon_color: >-
      {% set s = states('sensor.ntk_ryansoffice_3dprinter_cooling_fan_speed') |
      int(0) %} {% if s == 0 %}grey{% elif s < 30 %}blue{% elif s < 70 %}cyan{%
      else %}light-blue{% endif %}
    layout: vertical
    fill: false
    multiline_secondary: false
    tap_action:
      action: more-info
      entity: fan.ntk_ryansoffice_3dprinter_cooling_fan
    hold_action:
      action: more-info
      entity: sensor.ntk_ryansoffice_3dprinter_cooling_fan_speed
    card_mod:
      style: |
        @keyframes snowflake-spin {
          100% { transform: rotate(360deg); }
        }
        @keyframes badge-spin {
          100% { transform: rotate(360deg); }
        }
        ha-card {
          padding: 4px 4px !important;
          background: transparent;
          border-radius: 12px;
          transition: background 0.2s;
          --icon-size: 28px;
          --card-primary-font-size: 1.1rem;
          --card-primary-font-weight: bold;
          --card-secondary-font-size: 0.65rem;
        }
        ha-card:hover {
          background: rgba(var(--rgb-primary-text-color), 0.05);
        }
        mushroom-state-info {
          text-align: center;
          --card-secondary-letter-spacing: 0.5px;
        }
        mushroom-shape-icon {
          {% set s = states('sensor.ntk_ryansoffice_3dprinter_cooling_fan_speed') | int(0) %}
          {% if s > 0 %}
            animation: snowflake-spin 4s linear infinite;
          {% else %}
            animation: none;
          {% endif %}
        }
        mushroom-badge-icon {
          {% set s = states('sensor.ntk_ryansoffice_3dprinter_cooling_fan_speed') | int(0) %}
          {% if s > 0 %}
            animation: badge-spin 1s linear infinite;
          {% else %}
            animation: none;
          {% endif %}
        }

  # ── BENTO BOX FAN (ESP32) ──────────────────────
  # Icon: Air filter (wavy translate animation when on) + spinning fan badge | HEPA filter fan
  # UPDATE ENTITY TO MATCH YOUR ESP32 FAN
  - type: custom:mushroom-template-card
    entity: fan.3dprinter_controller_box_bento_box_fan
    primary: |-
      {% if states('fan.3dprinter_controller_box_bento_box_fan') == 'on' %}
        {{ state_attr('fan.3dprinter_controller_box_bento_box_fan', 'percentage') | int(0) }}%
      {% elif states('fan.3dprinter_controller_box_bento_box_fan') == 'off' %}
        Off
      {% else %}
        N/A
      {% endif %}
    secondary: Bento
    icon: mdi:air-filter
    badge_icon: mdi:fan
    badge_color: |-
      {% set state = states('fan.3dprinter_controller_box_bento_box_fan') %}
      {% if state == 'off' or state in ['unavailable', 'unknown'] %}
        grey
      {% else %}
        {% set s = state_attr('fan.3dprinter_controller_box_bento_box_fan', 'percentage') | int(0) %}
        {% if s < 30 %}green{% elif s < 70 %}amber{% else %}orange{% endif %}
      {% endif %}
    icon_color: |-
      {% set state = states('fan.3dprinter_controller_box_bento_box_fan') %}
      {% if state == 'off' or state in ['unavailable', 'unknown'] %}
        grey
      {% else %}
        {% set s = state_attr('fan.3dprinter_controller_box_bento_box_fan', 'percentage') | int(0) %}
        {% if s < 30 %}green{% elif s < 70 %}amber{% else %}orange{% endif %}
      {% endif %}
    layout: vertical
    fill: false
    multiline_secondary: false
    tap_action:
      action: more-info
      entity: fan.3dprinter_controller_box_bento_box_fan
    hold_action:
      action: more-info
      entity: fan.3dprinter_controller_box_bento_box_fan
    card_mod:
      style: |
        @keyframes filter-wave {
          0%, 100% { transform: translateY(0); }
          33% { transform: translateY(-1.5px); }
          66% { transform: translateY(1px); }
        }
        @keyframes badge-spin {
          100% { transform: rotate(360deg); }
        }
        ha-card {
          padding: 4px 4px !important;
          background: transparent;
          border-radius: 12px;
          transition: background 0.2s;
          --icon-size: 28px;
          --card-primary-font-size: 1.1rem;
          --card-primary-font-weight: bold;
          --card-secondary-font-size: 0.65rem;
        }
        ha-card:hover {
          background: rgba(var(--rgb-primary-text-color), 0.05);
        }
        mushroom-state-info {
          text-align: center;
          --card-secondary-letter-spacing: 0.5px;
        }
        mushroom-shape-icon {
          {% if states('fan.3dprinter_controller_box_bento_box_fan') == 'on' %}
            animation: filter-wave 2.5s ease-in-out infinite;
          {% else %}
            animation: none;
          {% endif %}
        }
        mushroom-badge-icon {
          {% if states('fan.3dprinter_controller_box_bento_box_fan') == 'on' %}
            animation: badge-spin 1.5s linear infinite;
          {% else %}
            animation: none;
          {% endif %}
        }
