        {% set b4 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 2 Tray 4') | float(0) %}
        {% set ext = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'External Spool') | float(0) %}
        {% set total = a1 + a2 + a3 + a4 + b1 + b2 + b3 + b4 + ext %}
