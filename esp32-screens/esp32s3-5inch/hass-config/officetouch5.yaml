      "border_width": '{{ 10 if state_attr("sensor.p1s_01p00c460102350_ams_1_tray_1", "active") else 2 }}'
      "border_color": '{{ "#2097f3" if state_attr("sensor.p1s_01p00c460102350_ams_1_tray_1", "active") else "#1a1a1a" }}'
