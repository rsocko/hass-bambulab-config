objects:
  - obj: "p1b2" # Arc
    properties:
      "val": '{{ states("sensor.ntk_ryansoffice_3dprinter_print_progress")  }}'
  - obj: "p1b3" # Arc
    properties:
      "val": '{{ states("sensor.ntk_ryansoffice_3dprinter_current_layer")  }}'
      "max": '{{ states("sensor.ntk_ryansoffice_3dprinter_total_layer_count")  }}'
  - obj: "p1b4" # Arc
    properties:
      "val": '{{ states("sensor.ntk_ryansoffice_3dprinter_remaining_time")  }}'
      "max": '{{ states("sensor.total_estimated_print_time")  }}'
  - obj: "p1b5" # Label
    properties:
      "text": '{{ states("sensor.ntk_ryansoffice_3dprinter_print_progress")  }}%'
  - obj: "p1b7" # Label
    properties:
      "text": '{{ states("sensor.ntk_ryansoffice_3dprinter_current_layer")  }}/{{ states("sensor.ntk_ryansoffice_3dprinter_total_layer_count")  }}'
  - obj: "p1b14" # Label
    properties:
      "text": '{{ states("sensor.print_time_remaining_formatted")  }}'
  - obj: "p1b29" # Label of end time
    properties:
      "text": '{{ states("sensor.print_end_time_friendly")  }}'
  - obj: "p1b53" # Weight tab total label
    properties:
      "text": 'Total: {{ states("sensor.ntk_ryansoffice_3dprinter_print_weight") | float(0) | round(1) }}g'
  - obj: "p1b54" # Cost tab total label
