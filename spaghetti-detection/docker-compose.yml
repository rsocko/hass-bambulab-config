version: '3.8'

services:
  obico-ml-server:
    image: nberk/ha_bambu_lab_p1_spaghetti_detection_standalone:latest
    container_name: obico-ml-server
    restart: unless-stopped
    
    # Environment configuration
    environment:
      # API token for authentication - change this to a secure value
      - ML_API_TOKEN=obico_api_secret
      # Timezone configuration
      - TZ=America/New_York
    
    # Port mapping: host:container
    ports:
      - "3333:3333"
    
    # Resource limits for monitoring and preventing resource exhaustion
    deploy:
      resources:
        limits:
          # Maximum 3GB of RAM (Obico needs at least 4GB total system RAM available)
          memory: 3G
          # Maximum 2 CPU cores
          cpus: '2.0'
        reservations:
          # Minimum 1GB of RAM
          memory: 1G
          # Minimum 0.5 CPU cores
          cpus: '0.5'
    
    # Health check to ensure the service is running properly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Labels for monitoring and organization
    labels:
      - "com.docker.compose.project=hass-bambulab"
      - "service=obico-ml-server"
      - "monitoring=enabled"
      
    # Logging configuration for resource monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Network configuration (optional - for advanced setups)
networks:
  default:
    name: bambulab-network
