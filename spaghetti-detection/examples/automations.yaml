# Example Automations for Obico ML Server Monitoring
# Add these to your automations.yaml

# Alert when Obico ML Server goes offline
- id: obico_server_offline_alert
  alias: "Obico ML Server - Offline Alert"
  description: "Alert when the Obico ML server becomes unavailable"
  trigger:
    - platform: state
      entity_id: sensor.obico_ml_server_status
      to: "offline"
      for: "00:02:00"
  condition: []
  action:
    - service: notify.notify
      data:
        title: "🚨 Obico ML Server Offline"
        message: >
          The Obico ML server on server-mini is not responding.
          Spaghetti detection will not work until it's restored.
          
          Check status: ssh server-mini "docker compose ps"
        data:
          priority: high
          tag: obico_offline

# Alert on high memory usage
- id: obico_high_memory_alert
  alias: "Obico ML Server - High Memory Alert"
  description: "Alert when memory usage exceeds threshold"
  trigger:
    - platform: numeric_state
      entity_id: sensor.obico_memory_usage
      above: 2500  # 2.5GB
      for: "00:05:00"
  condition: []
  action:
    - service: notify.notify
      data:
        title: "⚠️ Obico ML Server High Memory"
        message: >
          Memory usage is {{ states('sensor.obico_memory_usage') }}MB.
          Consider restarting the container if this persists.
          
          Current usage: {{ states('sensor.obico_memory_usage') }}MB / 3GB limit
        data:
          tag: obico_memory

# Alert on high CPU usage
- id: obico_high_cpu_alert
  alias: "Obico ML Server - High CPU Alert"
  description: "Alert when CPU usage is sustained high"
  trigger:
    - platform: numeric_state
      entity_id: sensor.obico_cpu_usage
      above: 80
      for: "00:10:00"
  condition: []
  action:
    - service: notify.notify
      data:
        title: "⚠️ Obico ML Server High CPU"
        message: >
          CPU usage has been above 80% for 10 minutes.
          Current usage: {{ states('sensor.obico_cpu_usage') }}%
          
          This may impact detection performance.

# Alert when server comes back online
- id: obico_server_online_alert
  alias: "Obico ML Server - Online Alert"
  description: "Notify when server recovers"
  trigger:
    - platform: state
      entity_id: sensor.obico_ml_server_status
      from: "offline"
      to: "healthy"
  condition: []
  action:
    - service: notify.notify
      data:
        title: "✅ Obico ML Server Online"
        message: >
          The Obico ML server has recovered and is now online.
          Spaghetti detection is operational.
        data:
          tag: obico_offline

# Nightly health check
- id: obico_nightly_health_check
  alias: "Obico ML Server - Nightly Health Check"
  description: "Daily status report"
  trigger:
    - platform: time
      at: "09:00:00"
  condition:
    - condition: state
      entity_id: binary_sensor.obico_ml_server_healthy
      state: "on"
  action:
    - service: logbook.log
      data:
        name: "Obico ML Server"
        message: >
          Daily health check: Status {{ states('sensor.obico_ml_server_status') }},
          Memory: {{ states('sensor.obico_memory_usage') }}MB,
          CPU: {{ states('sensor.obico_cpu_usage') }}%

# Restart container if unhealthy (advanced - requires SSH and permissions)
- id: obico_auto_restart_unhealthy
  alias: "Obico ML Server - Auto Restart if Unhealthy"
  description: "Automatically restart container if it becomes unhealthy"
  trigger:
    - platform: state
      entity_id: sensor.obico_container_status
      to: "unhealthy"
      for: "00:05:00"
  condition: []
  action:
    - service: notify.notify
      data:
        title: "🔄 Obico ML Server - Auto Restart"
        message: "Container unhealthy for 5 minutes. Attempting automatic restart..."
    - service: shell_command.restart_obico_container
    - delay: "00:00:30"
    - service: notify.notify
      data:
        title: "Obico ML Server - Restart Attempted"
        message: "Container restart command sent. Check status in a few minutes."

# Alert when detection interval is too aggressive for resources
- id: obico_detection_throttle_warning
  alias: "Obico ML Server - Detection Throttle Warning"
  description: "Warn if detection frequency is causing performance issues"
  trigger:
    - platform: numeric_state
      entity_id: sensor.obico_cpu_usage
      above: 70
      for: "00:15:00"
  condition:
    - condition: state
      entity_id: sensor.ntk_ryansoffice_3dprinter_print_status
      state: "printing"
  action:
    - service: notify.notify
      data:
        title: "⚠️ Spaghetti Detection Performance"
        message: >
          High CPU usage detected during print monitoring.
          Consider increasing the detection interval in your automation
          to reduce resource usage.
          
          Current CPU: {{ states('sensor.obico_cpu_usage') }}%

# Shell command for restarting container (add to configuration.yaml)
# shell_command:
#   restart_obico_container: 'ssh user@server-mini "cd ~/bambulab/spaghetti-detection && docker compose restart"'
