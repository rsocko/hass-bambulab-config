<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Model Detail Popup Mockup - Collapsible Sections Layout</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0b1119;
    --shell: rgba(15, 22, 34, 0.96);
    --pane: rgba(255, 255, 255, 0.03);
    --pane-strong: rgba(255, 255, 255, 0.06);
    --line: rgba(148, 166, 189, 0.24);
    --line-strong: rgba(148, 166, 189, 0.42);
    --text: #edf4ff;
    --sub: #9fb3ce;
    --accent: #6edacb;
    --warn: #f0be62;
    --danger: #f18b8b;
    --ok: #7cd9aa;
    --radius: 16px;
    --pad: 12px;
    --mockup-width: 1480px;
    --thumb-size: 74px;
    --shadow: 0 26px 60px rgba(0, 0, 0, 0.56);
  }

  html, body {
    margin: 0;
    min-height: 100%;
    color: var(--text);
    background:
      radial-gradient(circle at 12% 14%, rgba(110, 218, 203, 0.18), transparent 38%),
      radial-gradient(circle at 86% 10%, rgba(139, 174, 255, 0.16), transparent 36%),
      var(--bg);
    font-family: "Segoe UI", "Inter", "Avenir Next", system-ui, sans-serif;
  }

  .popup {
    max-width: var(--mockup-width);
    margin: 20px auto;
    border: 1px solid var(--line-strong);
    border-radius: 22px;
    background: var(--shell);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: grid;
    grid-template-columns: 2fr 3fr; /* Hero section 2/5, files section 3/5 */
    grid-template-rows: auto 1fr;
  }

  .hero {
    grid-column: 1 / 2; /* Hero section spans the first 2/5 */
    grid-row: 1 / 3;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--pane);
    padding: var(--pad);
  }

  .hero img {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius);
  }

  .right {
    grid-column: 2 / 3; /* Files section spans the remaining 3/5 */
    grid-row: 1 / 3;
    padding: var(--pad);
    display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 10px;
  }

  .summary {
    padding: var(--pad);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--pane);
  }

  .model-files {
    padding: var(--pad);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--pane);
  }

  .lower {
    overflow-y: auto;
    padding: var(--pad);
    display: grid;
    gap: 10px;
  }

  .collapsible-section {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--pane);
  }

  .section-header {
    padding: var(--pad);
    background: var(--pane-strong);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .section-content {
    padding: var(--pad);
    display: grid;
    gap: 8px;
  }
</style>
</head>
<body>

<div class="popup">
  <div class="hero">
    <img src="example-image.jpg" alt="Hero Image" />
  </div>
  <div class="right">
    <div class="summary">
      <h2>Summary</h2>
      <p>Details about the model go here.</p>
    </div>
    <div class="model-files">
      <h3>Model Files</h3>
      <ul>
        <li>File 1</li>
        <li>File 2</li>
        <li>File 3</li>
      </ul>
    </div>
    <div class="lower">
      <div class="collapsible-section">
        <div class="section-header">
          <span class="title">Collapsible Section 1</span>
          <button class="toggle-btn">+</button>
        </div>
        <div class="section-content">
          <p>Content for section 1.</p>
        </div>
      </div>
      <div class="collapsible-section">
        <div class="section-header">
          <span class="title">Collapsible Section 2</span>
          <button class="toggle-btn">+</button>
        </div>
        <div class="section-content">
          <p>Content for section 2.</p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
