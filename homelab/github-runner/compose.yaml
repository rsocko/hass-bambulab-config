services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: ${RUNNER_CONTAINER_NAME:-github-runner-ha}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNER_SCOPE: ${RUNNER_SCOPE:-repo}
      REPO_URL: ${REPO_URL}
      ORG_NAME: ${ORG_NAME:-}
      RUNNER_NAME: ${RUNNER_NAME:-ha-dockhand-runner}
      LABELS: ${LABELS:-self-hosted,linux,docker,ha,homelab,dockhand}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-_work}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      DISABLE_AUTO_UPDATE: ${DISABLE_AUTO_UPDATE:-false}
      EPHEMERAL: ${EPHEMERAL:-false}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
    volumes:
      - ./runner-data:/runner
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true

  github-runner-build:
    image: myoung34/github-runner:latest
    container_name: ${BUILD_RUNNER_CONTAINER_NAME:-github-runner-build}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNER_SCOPE: ${BUILD_RUNNER_SCOPE:-${RUNNER_SCOPE:-repo}}
      REPO_URL: ${REPO_URL}
      ORG_NAME: ${BUILD_RUNNER_ORG_NAME:-${ORG_NAME:-}}
      RUNNER_NAME: ${BUILD_RUNNER_NAME:-ha-dockhand-build-runner}
      LABELS: ${BUILD_RUNNER_LABELS:-self-hosted,linux,docker,build,homelab,dockhand}
      RUNNER_WORKDIR: ${BUILD_RUNNER_WORKDIR:-_work_build}
      RUNNER_GROUP: ${BUILD_RUNNER_GROUP:-${RUNNER_GROUP:-Default}}
      DISABLE_AUTO_UPDATE: ${BUILD_RUNNER_DISABLE_AUTO_UPDATE:-${DISABLE_AUTO_UPDATE:-false}}
      EPHEMERAL: ${BUILD_RUNNER_EPHEMERAL:-${EPHEMERAL:-false}}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
    volumes:
      - ./runner-data-build:/runner
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
