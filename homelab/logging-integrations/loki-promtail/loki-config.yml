# Loki configuration file
# This configures how Loki stores and indexes logs

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

# Common configuration shared across components
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Schema configuration
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Limits and retention
limits_config:
  # Retention period (30 days)
  retention_period: 720h
  
  # Reject logs older than 24 hours
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  
  # Ingestion rate limits
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  
  # Query limits
  max_query_length: 721h
  max_query_parallelism: 16
  max_streams_per_user: 0
  max_entries_limit_per_query: 10000
  
  # Label limits
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 30

# Chunk store configuration
chunk_store_config:
  max_look_back_period: 0s

# Table manager for retention
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h

# Compactor for chunk management
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Ruler for alerting (optional)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true
