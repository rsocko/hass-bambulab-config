name: Build Model Catalog Image

on:
  workflow_dispatch:
    inputs:
      version_mode:
        description: How to determine the image tag
        required: true
        type: choice
        default: next_patch
        options:
          - explicit
          - next_major
          - next_minor
          - next_patch
      image_tag:
        description: Explicit Docker image tag to build when version_mode=explicit
        required: false
        default: ""
      registry:
        description: Registry/repository prefix
        required: true
        default: registry.socko.us/model-catalog
      push_image:
        description: Push built image to registry
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      push_latest:
        description: Also tag and push this image as latest
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: [self-hosted, linux, docker, homelab, dockhand]
    outputs:
      resolved_tag: ${{ steps.version.outputs.resolved_tag }}
      resolved_image: ${{ steps.version.outputs.resolved_image }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: version
        shell: bash
        env:
          REGISTRY_REPOSITORY: ${{ github.event.inputs.registry }}
          VERSION_MODE: ${{ github.event.inputs.version_mode }}
          EXPLICIT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_registry_version.py

      - name: Show resolved image target
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag }}"
          echo "Resolved image: $IMAGE"
          echo "Latest semantic tag in registry: ${{ steps.version.outputs.latest_tag || 'none' }}"

      - name: Publish version summary
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED_TAG='${{ steps.version.outputs.resolved_tag }}'
          RESOLVED_IMAGE='${{ steps.version.outputs.resolved_image }}'
          LATEST_TAG='${{ steps.version.outputs.latest_tag }}'
          PUSH_LATEST='${{ github.event.inputs.push_latest }}'
          {
            echo '## Model Catalog Image Version'
            echo
            echo "Resolved tag: \`$RESOLVED_TAG\`"
            echo
            echo "Resolved image: \`$RESOLVED_IMAGE\`"
            echo
            echo 'Compose update:'
            echo "\`MODEL_CATALOG_IMAGE_TAG=$RESOLVED_TAG\`"
            if [ "$PUSH_LATEST" = 'true' ]; then
              echo
              echo 'Mutable tag update:'
              echo "\`MODEL_CATALOG_IMAGE_TAG=latest\`"
            fi
            echo
            echo "Latest existing semantic tag: \`${LATEST_TAG:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Resolved model-catalog image::$RESOLVED_IMAGE"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag }}"
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            -f sidecars/model_catalog/Dockerfile \
            -t "$IMAGE" \
            --build-arg MODEL_CATALOG_IMAGE_TAG="${{ steps.version.outputs.resolved_tag }}" \
            --build-arg MODEL_CATALOG_IMAGE_VERSION="${{ steps.version.outputs.resolved_tag }}" \
            --build-arg MODEL_CATALOG_IMAGE_REVISION="${{ github.sha }}" \
            --build-arg MODEL_CATALOG_IMAGE_CREATED="$BUILD_CREATED" \
            .
          if [ "${{ github.event.inputs.push_latest }}" = 'true' ]; then
            docker tag "$IMAGE" "${{ github.event.inputs.registry }}:latest"
          fi
          echo "Built $IMAGE"

      - name: Push image
        if: ${{ github.event.inputs.push_image == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag }}"
          docker push "$IMAGE"
          if [ "${{ github.event.inputs.push_latest }}" = 'true' ]; then
            docker push "${{ github.event.inputs.registry }}:latest"
          fi
