name: Build Model Catalog Image

on:
  workflow_dispatch:
    inputs:
      version_mode:
        description: How to determine the image tag
        required: true
        type: choice
        default: next_patch
        options:
          - explicit
          - next_major
          - next_minor
          - next_patch
      image_tag:
        description: Explicit Docker image tag to build when version_mode=explicit
        required: false
        default: ""
      registry:
        description: Registry/repository prefix
        required: true
        default: registry.socko.us/model-catalog
      push_image:
        description: Push built image to registry
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      push_latest:
        description: Also tag and push this image as latest
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      ghcr_repository:
        description: "Optional GHCR repository override (default: ghcr.io/<owner>/model-catalog)"
        required: false
        default: ""
      push_ghcr_image:
        description: Also push this image to GHCR
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      push_ghcr_latest:
        description: Also tag and push the GHCR image as latest
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-model-catalog-${{ github.event.inputs.registry || 'registry.socko.us/model-catalog' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, docker, build, homelab, dockhand]
    outputs:
      resolved_tag: ${{ steps.version.outputs.resolved_tag }}
      resolved_image: ${{ steps.version.outputs.resolved_image }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve image tag
        id: version
        shell: bash
        env:
          REGISTRY_REPOSITORY: ${{ github.event.inputs.registry }}
          VERSION_MODE: ${{ github.event.inputs.version_mode }}
          EXPLICIT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_registry_version.py
          GHCR_REPOSITORY="${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/model-catalog', github.repository_owner) }}"
          echo "Resolved image: ${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag || 'pending' }}"
          echo "Resolved GHCR image: $GHCR_REPOSITORY:${{ steps.version.outputs.resolved_tag || 'pending' }}"

      - name: Publish version summary
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED_TAG='${{ steps.version.outputs.resolved_tag }}'
          RESOLVED_IMAGE='${{ steps.version.outputs.resolved_image }}'
          LATEST_TAG='${{ steps.version.outputs.latest_tag }}'
          PUSH_LATEST='${{ github.event.inputs.push_latest }}'
          GHCR_REPOSITORY='${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/model-catalog', github.repository_owner) }}'
          PUSH_GHCR_IMAGE='${{ github.event.inputs.push_ghcr_image }}'
          PUSH_GHCR_LATEST='${{ github.event.inputs.push_ghcr_latest }}'
          {
            echo '## Model Catalog Image Version'
            echo
            echo "Resolved tag: \`$RESOLVED_TAG\`"
            echo
            echo "Resolved image: \`$RESOLVED_IMAGE\`"
            echo
            echo 'Compose update:'
            echo "\`MODEL_CATALOG_IMAGE_TAG=$RESOLVED_TAG\`"
            if [ "$PUSH_LATEST" = 'true' ]; then
              echo
              echo 'Mutable tag update:'
              echo "\`MODEL_CATALOG_IMAGE_TAG=latest\`"
            fi
            if [ "$PUSH_GHCR_IMAGE" = 'true' ]; then
              echo
              echo 'GHCR publish:'
              echo "\`$GHCR_REPOSITORY:$RESOLVED_TAG\`"
              if [ "$PUSH_GHCR_LATEST" = 'true' ]; then
                echo
                echo 'GHCR mutable tag update:'
                echo "\`$GHCR_REPOSITORY:latest\`"
              fi
            fi
            echo
            echo "Latest existing semantic tag: \`${LATEST_TAG:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Resolved model-catalog image::$RESOLVED_IMAGE"

      - name: Login to GHCR
        if: ${{ github.event.inputs.push_ghcr_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate sidecar Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import os
          import py_compile
          import re
          import sys
          from pathlib import Path

          root = Path("sidecars/model_catalog/app")
          python_files = sorted(root.rglob("*.py"))
          failures = []

          for py_file in python_files:
            try:
              py_compile.compile(str(py_file), doraise=True)
            except py_compile.PyCompileError as exc:
              failures.append((py_file, str(exc.msg)))

          if not failures:
            print(f"Syntax check passed for {len(python_files)} files under {root}.")
            sys.exit(0)

          log_lines = []
          for idx, (py_file, message) in enumerate(failures, start=1):
            log_lines.append(f"[{idx}] {py_file}")
            log_lines.append(message.rstrip())
            log_lines.append("")

            line_match = re.search(r"line\s+(\d+)", message)
            if line_match:
              print(
                f"::error file={py_file},line={line_match.group(1)}::Python syntax error. See Copilot Debug Prompt in step summary."
              )
            else:
              print(f"::error file={py_file}::Python syntax error. See Copilot Debug Prompt in step summary.")

          error_text = "\n".join(log_lines).strip()

          copilot_prompt = "\n".join(
            [
              "I need help fixing Python syntax errors in this repo.",
              "Please propose a minimal patch.",
              "Compiler output:",
              "```text",
              error_text,
              "```",
            ]
          )

          print("Python syntax validation failed for model-catalog sidecar files.", file=sys.stderr)
          print(error_text, file=sys.stderr)
          print("\nCopilot Debug Prompt (copy/paste):\n", file=sys.stderr)
          print(copilot_prompt, file=sys.stderr)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
            with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Model Catalog Syntax Validation Failed\n\n")
              summary.write("### Copilot Debug Prompt (Copy/Paste)\n\n")
              summary.write(copilot_prompt)
              summary.write("\n")

          sys.exit(1)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          GHCR_IMAGE: ${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/model-catalog', github.repository_owner) }}
        with:
          context: .
          file: sidecars/model_catalog/Dockerfile
          push: ${{ github.event.inputs.push_image == 'true' }}
          tags: |
            ${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}:latest', github.event.inputs.registry) || '' }}
            ${{ github.event.inputs.push_ghcr_image == 'true' && format('{0}:{1}', env.GHCR_IMAGE, steps.version.outputs.resolved_tag) || '' }}
            ${{ github.event.inputs.push_ghcr_image == 'true' && github.event.inputs.push_ghcr_latest == 'true' && format('{0}:latest', env.GHCR_IMAGE) || '' }}
          build-args: |
            MODEL_CATALOG_IMAGE_TAG=${{ steps.version.outputs.resolved_tag }}
            MODEL_CATALOG_IMAGE_VERSION=${{ steps.version.outputs.resolved_tag }}
            MODEL_CATALOG_IMAGE_REVISION=${{ github.sha }}
            MODEL_CATALOG_IMAGE_CREATED=${{ github.event.repository.updated_at }}
          cache-from: type=registry,ref=${{ github.event.inputs.registry }}:buildcache
          cache-to: type=registry,ref=${{ github.event.inputs.registry }}:buildcache,mode=max

      - name: Push GHCR image
        if: ${{ github.event.inputs.push_ghcr_image == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          GHCR_IMAGE="${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/model-catalog', github.repository_owner) }}:${{ steps.version.outputs.resolved_tag }}"
          docker push "$GHCR_IMAGE"
          if [ "${{ github.event.inputs.push_ghcr_latest }}" = 'true' ]; then
            docker push "${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/model-catalog', github.repository_owner) }}:latest"
          fi
