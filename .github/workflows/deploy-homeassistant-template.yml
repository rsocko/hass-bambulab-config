name: Deploy Home Assistant Config (HAOS Template)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: preview only (true) or write changes (false)"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      delete_mode:
        description: "Delete behavior in target scope: safe=never delete, mirror=delete missing files"
        required: true
        type: choice
        default: "safe"
        options:
          - safe
          - mirror
      allowlist_profile:
        description: "Content profile: yaml_only/packages_only = package YAML only, packages_www = package YAML + www assets"
        required: true
        type: choice
        default: "packages_www"
        options:
          - yaml_only
          - packages_only
          - packages_www
      allowlist_file:
        description: "Advanced/legacy: custom allowlist file path (used for selected package generation context)"
        required: false
        default: ""
      package_scope:
        description: "Package scope: all packages or only selected package folders"
        required: true
        type: choice
        default: all
        options:
          - all
          - selected
      selected_packages:
        description: "Comma-separated packages when scope=selected (example: core,common)"
        required: false
        default: ""
      package_preset:
        description: "Optional preset when scope=selected and selected_packages is empty"
        required: true
        type: choice
        default: none
        options:
          - none
          - core_only
          - core_common
      include_www_for_selected:
        description: "When scope=selected, also deploy matching www/3d_printing/<package>/ assets"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      check_ui_name_conflicts:
        description: "Run best-effort UI/storage naming conflict check"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      fail_on_ui_conflict:
        description: "If conflicts are found, fail the workflow"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      post_deploy_action:
        description: "Action after deploy: none, reload domains, or restart core"
        required: true
        type: choice
        default: none
        options:
          - none
          - reload_domains
          - restart_core
      resource_safety_mode:
        description: "Safety behavior for Lovelace resource-related deploy changes: off, warn, fail"
        required: true
        type: choice
        default: fail
        options:
          - off
          - warn
          - fail
      feature_include_mode:
        description: "Feature loader include handling in configuration.yaml"
        required: true
        type: choice
        default: auto_update_include_file
        options:
          - off
          - check
          - auto_update
          - check_include_file
          - auto_update_include_file
      ha_configuration_yaml_path:
        description: "Path to Home Assistant configuration.yaml on target"
        required: true
        default: /config/configuration.yaml
      ha_feature_include_file_path:
        description: "Path to feature loader include map file on target (used by include_file modes)"
        required: true
        default: /config/packages/3d_printing/_feature_loaders.yaml

jobs:
  deploy:
    runs-on: [self-hosted, linux, docker, ha, homelab, dockhand]
    env:
      HA_HOST: ${{ vars.HA_HOST }}
      HA_SSH_PORT: ${{ vars.HA_SSH_PORT || '22' }}
      HA_SSH_USER: ${{ vars.HA_SSH_USER }}
      HA_CONFIG_PATH: ${{ vars.HA_CONFIG_PATH || '/config' }}
      SSH_KEY_PATH: ${{ vars.SSH_KEY_PATH || '/runner/.ssh/id_ed25519' }}
      HA_SSH_KNOWN_HOSTS: ${{ secrets.HA_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show changed files
        run: |
          git status --short

      - name: Resolve allowlist and package selection
        id: selection
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="./homeassistant"
          PROFILE="${{ github.event.inputs.allowlist_profile }}"
          CUSTOM_ALLOWLIST="${{ github.event.inputs.allowlist_file }}"
          PACKAGE_SCOPE="${{ github.event.inputs.package_scope }}"
          SELECTED_PACKAGES_INPUT="${{ github.event.inputs.selected_packages }}"
          PACKAGE_PRESET="${{ github.event.inputs.package_preset }}"
          INCLUDE_WWW_SELECTED="${{ github.event.inputs.include_www_for_selected }}"
          PACKAGES_ROOT="$SOURCE_ROOT/packages/3d_printing"

          if [ ! -d "$SOURCE_ROOT" ]; then
            echo "Missing source directory: $SOURCE_ROOT"
            exit 1
          fi

          if [ ! -d "$PACKAGES_ROOT" ]; then
            echo "Missing package directory: $PACKAGES_ROOT"
            exit 1
          fi

          if [ -n "$CUSTOM_ALLOWLIST" ]; then
            BASE_ALLOWLIST="$CUSTOM_ALLOWLIST"
          else
            case "$PROFILE" in
              yaml_only)
                BASE_ALLOWLIST=".github/deploy/rsync-allowlist-yaml-only.txt"
                ;;
              packages_only)
                BASE_ALLOWLIST=".github/deploy/rsync-allowlist-packages-only.txt"
                ;;
              packages_www)
                BASE_ALLOWLIST=".github/deploy/rsync-allowlist-packages-www.txt"
                ;;
              *)
                echo "Unknown allowlist_profile: $PROFILE"
                exit 1
                ;;
            esac
          fi

          if [ ! -f "$BASE_ALLOWLIST" ]; then
            echo "Missing allowlist file: $BASE_ALLOWLIST"
            exit 1
          fi

          EFFECTIVE_ALLOWLIST="$BASE_ALLOWLIST"
          SELECTED_PACKAGES_CSV="all"

          if [ "$PACKAGE_SCOPE" = "selected" ]; then
            SELECTED_PACKAGES_SOURCE="$SELECTED_PACKAGES_INPUT"

            if [ -z "$SELECTED_PACKAGES_SOURCE" ]; then
              case "$PACKAGE_PRESET" in
                none)
                  ;;
                core_only)
                  SELECTED_PACKAGES_SOURCE="core"
                  ;;
                core_common)
                  SELECTED_PACKAGES_SOURCE="core,common"
                  ;;
                *)
                  echo "Unknown package_preset: $PACKAGE_PRESET"
                  exit 1
                  ;;
              esac
            else
              if [ "$PACKAGE_PRESET" != "none" ]; then
                echo "selected_packages was provided and takes precedence over package_preset=$PACKAGE_PRESET"
              fi
            fi

            if [ -z "$SELECTED_PACKAGES_SOURCE" ]; then
              echo "When package_scope=selected, provide selected_packages or choose a package_preset other than none"
              exit 1
            fi

            declare -A valid_packages=()
            while IFS= read -r package_name; do
              [ -z "$package_name" ] && continue
              valid_packages["$package_name"]=1
            done < <(find "$PACKAGES_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

            declare -A seen_packages=()
            selected_list=()
            while IFS= read -r raw_package; do
              package_name="$(echo "$raw_package" | tr '[:upper:]' '[:lower:]' | xargs)"
              [ -z "$package_name" ] && continue

              if [ -z "${valid_packages[$package_name]+x}" ]; then
                echo "Unknown package: $package_name"
                echo "Available packages:"
                printf '  - %s\n' "${!valid_packages[@]}" | sort
                exit 1
              fi

              if [ -z "${seen_packages[$package_name]+x}" ]; then
                seen_packages["$package_name"]=1
                selected_list+=("$package_name")
              fi
            done < <(echo "$SELECTED_PACKAGES_SOURCE" | tr ',' '\n')

            if [ "${#selected_list[@]}" -eq 0 ]; then
              echo "No valid package names were provided in selected_packages"
              exit 1
            fi

            IFS=',' read -r -a sorted_selected <<< "$(printf '%s\n' "${selected_list[@]}" | sort | paste -sd ',' -)"
            SELECTED_PACKAGES_CSV="${sorted_selected[*]}"

            EFFECTIVE_ALLOWLIST="$RUNNER_TEMP/rsync-allowlist-selected.txt"
            {
              echo "# Generated at runtime for selected package deployment"
              echo "*/"
              echo "packages/"
              echo "packages/**/"

              for package_name in $(echo "$SELECTED_PACKAGES_CSV" | tr ',' ' '); do
                echo "packages/3d_printing/$package_name/"
                echo "packages/3d_printing/$package_name/**/"
                echo "packages/3d_printing/$package_name/**/*.yaml"
                echo "packages/3d_printing/$package_name/**/*.yml"
                if [ "$INCLUDE_WWW_SELECTED" = "true" ]; then
                  echo "www/3d_printing/$package_name/***"
                fi
              done
            } > "$EFFECTIVE_ALLOWLIST"
          fi

          echo "selected_packages=$SELECTED_PACKAGES_CSV" >> "$GITHUB_OUTPUT"
          echo "effective_allowlist=$EFFECTIVE_ALLOWLIST" >> "$GITHUB_OUTPUT"

          echo "Resolved package scope: $PACKAGE_SCOPE"
          echo "Resolved selected packages: $SELECTED_PACKAGES_CSV"
          echo "Resolved package preset: $PACKAGE_PRESET"
          echo "Resolved allowlist file: $EFFECTIVE_ALLOWLIST"

      - name: Show effective allowlist
        shell: bash
        run: |
          set -euo pipefail
          echo "Using allowlist: ${{ steps.selection.outputs.effective_allowlist }}"
          cat "${{ steps.selection.outputs.effective_allowlist }}"

      - name: Lovelace resource deploy safety check
        shell: bash
        run: |
          set -euo pipefail

          SAFETY_MODE="${{ github.event.inputs.resource_safety_mode }}"
          [ "$SAFETY_MODE" = "off" ] && { echo "Resource safety check disabled (resource_safety_mode=off)."; exit 0; }

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true

          CHANGED_FILES=""
          if git rev-parse --verify "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
            CHANGED_FILES="$(git diff --name-only "origin/$DEFAULT_BRANCH...HEAD" || true)"
          fi
          if [ -z "$CHANGED_FILES" ]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              CHANGED_FILES="$(git diff --name-only HEAD~1..HEAD || true)"
            fi
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No comparable git diff range found; skipping resource safety checks."
            exit 0
          fi

          RESOURCE_RELATED_CHANGED=false
          RESOURCE_RELATED_IN_SCOPE=false
          PACKAGE_SCOPE="${{ github.event.inputs.package_scope }}"
          SELECTED_PACKAGES="${{ steps.selection.outputs.selected_packages }}"

          package_is_selected() {
            local pkg="$1"
            [ "$PACKAGE_SCOPE" = "all" ] && return 0
            [ "$SELECTED_PACKAGES" = "all" ] && return 0
            echo ",$SELECTED_PACKAGES," | grep -q ",$pkg,"
          }

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              homeassistant/packages/3d_printing/common/common_loader.yaml|\
              homeassistant/packages/3d_printing/common/dashboards/_resources.yaml)
                RESOURCE_RELATED_CHANGED=true
                if package_is_selected "common"; then
                  RESOURCE_RELATED_IN_SCOPE=true
                fi
                ;;
              homeassistant/www/3d_printing/*)
                RESOURCE_RELATED_CHANGED=true
                path_tail="${f#homeassistant/www/3d_printing/}"
                www_pkg="${path_tail%%/*}"
                if [ -n "$www_pkg" ] && package_is_selected "$www_pkg"; then
                  RESOURCE_RELATED_IN_SCOPE=true
                fi
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$RESOURCE_RELATED_CHANGED" != "true" ]; then
            echo "No Lovelace resource-related changes detected in diff range."
            exit 0
          fi

          if [ "$RESOURCE_RELATED_IN_SCOPE" != "true" ]; then
            echo "Resource-related changes detected, but not in selected deploy scope; skipping resource safety enforcement."
            exit 0
          fi

          ISSUES=0
          issue() {
            local msg="$1"
            ISSUES=$((ISSUES + 1))
            if [ "$SAFETY_MODE" = "warn" ]; then
              echo "::warning::$msg"
            else
              echo "$msg"
            fi
          }

          ALLOWLIST_PROFILE="${{ github.event.inputs.allowlist_profile }}"
          INCLUDE_WWW_SELECTED="${{ github.event.inputs.include_www_for_selected }}"
          POST_DEPLOY_ACTION="${{ github.event.inputs.post_deploy_action }}"

          if [ "$PACKAGE_SCOPE" = "all" ]; then
            if [ "$ALLOWLIST_PROFILE" != "packages_www" ]; then
              issue "Resource-related changes detected, but allowlist_profile=$ALLOWLIST_PROFILE will not deploy /www assets. Use allowlist_profile=packages_www."
            fi
          else
            if [ "$INCLUDE_WWW_SELECTED" != "true" ]; then
              issue "Resource-related changes detected with package_scope=selected, but include_www_for_selected is false. Set include_www_for_selected=true."
            fi
          fi

          if [ "$POST_DEPLOY_ACTION" != "restart_core" ]; then
            issue "Resource-related changes detected, but post_deploy_action=$POST_DEPLOY_ACTION. Use post_deploy_action=restart_core so Lovelace resource changes are reliably reloaded."
          fi

          if [ "$ISSUES" -gt 0 ]; then
            echo "Resource safety check found $ISSUES issue(s)."
            if [ "$SAFETY_MODE" = "fail" ]; then
              exit 1
            fi
          else
            echo "Resource safety check passed."
          fi

      - name: Preflight (HAOS SSH + tools)
        run: |
          set -euo pipefail

          command -v rsync >/dev/null 2>&1 || { echo "rsync is required"; exit 1; }
          command -v ssh >/dev/null 2>&1 || { echo "ssh client is required"; exit 1; }

          [ -n "$HA_HOST" ] || { echo "Missing HA_HOST (set GitHub Variable HA_HOST)"; exit 1; }
          [ -n "$HA_SSH_USER" ] || { echo "Missing HA_SSH_USER (set GitHub Variable HA_SSH_USER)"; exit 1; }
          [ -n "$HA_SSH_PORT" ] || { echo "Missing HA_SSH_PORT (set GitHub Variable HA_SSH_PORT)"; exit 1; }
          [ -n "$SSH_KEY_PATH" ] || { echo "Missing SSH_KEY_PATH (set GitHub Variable SSH_KEY_PATH)"; exit 1; }
          [ -n "$HA_CONFIG_PATH" ] || { echo "Missing HA_CONFIG_PATH (set GitHub Variable HA_CONFIG_PATH)"; exit 1; }

          if [ ! -f "$SSH_KEY_PATH" ]; then
            echo "SSH key not found at $SSH_KEY_PATH"
            exit 1
          fi

      - name: Prepare SSH host key policy
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$HA_SSH_KNOWN_HOSTS" ]; then
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            printf '%s\n' "$HA_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            echo "SSH_STRICT_MODE=yes" >> "$GITHUB_ENV"
            echo "Configured strict host key checking using secret HA_SSH_KNOWN_HOSTS"
          else
            echo "SSH_STRICT_MODE=accept-new" >> "$GITHUB_ENV"
            echo "HA_SSH_KNOWN_HOSTS not set; using StrictHostKeyChecking=accept-new"
          fi

      - name: Best-effort UI/storage name conflict check
        if: ${{ github.event.inputs.check_ui_name_conflicts == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/check_ui_name_conflicts.py \
            --ha-host "$HA_HOST" \
            --ha-port "$HA_SSH_PORT" \
            --ha-user "$HA_SSH_USER" \
            --ssh-key "$SSH_KEY_PATH" \
            --selected-packages "${{ steps.selection.outputs.selected_packages }}" \
            --strict "${{ github.event.inputs.fail_on_ui_conflict }}"

      - name: Check/update feature includes (dry-run pre-sync)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        shell: bash
        env:
          FEATURE_INCLUDE_MODE: ${{ github.event.inputs.feature_include_mode }}
          DRY_RUN_MODE: ${{ github.event.inputs.dry_run }}
          HA_CONFIGURATION_YAML_PATH: ${{ github.event.inputs.ha_configuration_yaml_path }}
          HA_FEATURE_INCLUDE_FILE_PATH: ${{ github.event.inputs.ha_feature_include_file_path }}
          PACKAGE_SCOPE: ${{ github.event.inputs.package_scope }}
          SELECTED_PACKAGES: ${{ steps.selection.outputs.selected_packages }}
          SOURCE_ROOT: ./homeassistant
          PACKAGES_ROOT: ./homeassistant/packages/3d_printing
        run: |
          bash .github/scripts/manage_feature_includes.sh

      - name: Deploy sync to HAOS /config (SSH add-on)
        run: |
          set -euo pipefail

          SOURCE_ROOT="./homeassistant"

          SSH_OPTS="-i $SSH_KEY_PATH -p $HA_SSH_PORT -o StrictHostKeyChecking=$SSH_STRICT_MODE"
          if [ "$SSH_STRICT_MODE" = "yes" ]; then
            SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          fi

          if [ ! -d "$SOURCE_ROOT" ]; then
            echo "Missing source directory: $SOURCE_ROOT"
            exit 1
          fi

          PACKAGE_SCOPE="${{ github.event.inputs.package_scope }}"
          ALLOWLIST_PROFILE="${{ github.event.inputs.allowlist_profile }}"
          INCLUDE_WWW_SELECTED="${{ github.event.inputs.include_www_for_selected }}"
          DELETE_MODE="${{ github.event.inputs.delete_mode }}"
          SELECTED_PACKAGES="${{ steps.selection.outputs.selected_packages }}"

          PACKAGES_ROOT_SRC="$SOURCE_ROOT/packages/3d_printing"
          WWW_ROOT_SRC="$SOURCE_ROOT/www/3d_printing"
          FEATURE_INCLUDE_FILE_SRC="$PACKAGES_ROOT_SRC/_feature_loaders.yaml"

          PACKAGES_ROOT_REMOTE="$HA_CONFIG_PATH/packages/3d_printing"
          WWW_ROOT_REMOTE="$HA_CONFIG_PATH/www/3d_printing"
          FEATURE_INCLUDE_FILE_REMOTE="$PACKAGES_ROOT_REMOTE/_feature_loaders.yaml"

          PACKAGES_ROOT_DST="$HA_SSH_USER@$HA_HOST:$HA_CONFIG_PATH/packages/3d_printing/"
          WWW_ROOT_DST="$HA_SSH_USER@$HA_HOST:$HA_CONFIG_PATH/www/3d_printing/"
          FEATURE_INCLUDE_FILE_DST="$HA_SSH_USER@$HA_HOST:$FEATURE_INCLUDE_FILE_REMOTE"

          RSYNC_FLAGS="-rvh"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            RSYNC_FLAGS="-rvhn"
          fi

          RSYNC_METADATA_FLAGS="--no-owner --no-group --no-perms --omit-dir-times --no-times"

          RSYNC_DELETE_FLAG=""
          case "$DELETE_MODE" in
            mirror)
              RSYNC_DELETE_FLAG="--delete"
              ;;
            safe)
              RSYNC_DELETE_FLAG=""
              ;;
            *)
              echo "Unknown delete_mode: $DELETE_MODE"
              exit 1
              ;;
          esac

              REMOTE_RSYNC_PATH="rsync"

          sync_yaml_only() {
            local src="$1"
            local dst="$2"

            if [ ! -d "$src" ]; then
              echo "Skipping missing source directory: $src"
              return 0
            fi

            set +e
            rsync $RSYNC_FLAGS $RSYNC_DELETE_FLAG \
              $RSYNC_METADATA_FLAGS \
              --rsync-path="$REMOTE_RSYNC_PATH" \
              --include='*/' \
              --include='*.yaml' \
              --include='*.yml' \
              --exclude='*' \
              -e "ssh $SSH_OPTS" \
              "$src/" "$dst"
            rsync_exit=$?
            set -e

            if [ $rsync_exit -ne 0 ] && [ "$REMOTE_RSYNC_PATH" != "sudo -n rsync" ]; then
              echo "Initial rsync failed (exit $rsync_exit); retrying with --rsync-path='sudo -n rsync'"
              REMOTE_RSYNC_PATH="sudo -n rsync"
              rsync $RSYNC_FLAGS $RSYNC_DELETE_FLAG \
                $RSYNC_METADATA_FLAGS \
                --rsync-path="$REMOTE_RSYNC_PATH" \
                --include='*/' \
                --include='*.yaml' \
                --include='*.yml' \
                --exclude='*' \
                -e "ssh $SSH_OPTS" \
                "$src/" "$dst"
            elif [ $rsync_exit -ne 0 ]; then
              return $rsync_exit
            fi
          }

          sync_all_files() {
            local src="$1"
            local dst="$2"

            if [ ! -d "$src" ]; then
              echo "Skipping missing source directory: $src"
              return 0
            fi

            set +e
            rsync $RSYNC_FLAGS $RSYNC_DELETE_FLAG \
              $RSYNC_METADATA_FLAGS \
              --rsync-path="$REMOTE_RSYNC_PATH" \
              -e "ssh $SSH_OPTS" \
              "$src/" "$dst"
            rsync_exit=$?
            set -e

            if [ $rsync_exit -ne 0 ] && [ "$REMOTE_RSYNC_PATH" != "sudo -n rsync" ]; then
              echo "Initial rsync failed (exit $rsync_exit); retrying with --rsync-path='sudo -n rsync'"
              REMOTE_RSYNC_PATH="sudo -n rsync"
              rsync $RSYNC_FLAGS $RSYNC_DELETE_FLAG \
                $RSYNC_METADATA_FLAGS \
                --rsync-path="$REMOTE_RSYNC_PATH" \
                -e "ssh $SSH_OPTS" \
                "$src/" "$dst"
            elif [ $rsync_exit -ne 0 ]; then
              return $rsync_exit
            fi
          }

          sync_single_yaml_file() {
            local src="$1"
            local dst="$2"

            if [ ! -f "$src" ]; then
              echo "Skipping missing source file: $src"
              return 0
            fi

            set +e
            rsync $RSYNC_FLAGS \
              $RSYNC_METADATA_FLAGS \
              --rsync-path="$REMOTE_RSYNC_PATH" \
              -e "ssh $SSH_OPTS" \
              "$src" "$dst"
            rsync_exit=$?
            set -e

            if [ $rsync_exit -ne 0 ] && [ "$REMOTE_RSYNC_PATH" != "sudo -n rsync" ]; then
              echo "Initial rsync failed (exit $rsync_exit); retrying with --rsync-path='sudo -n rsync'"
              REMOTE_RSYNC_PATH="sudo -n rsync"
              rsync $RSYNC_FLAGS \
                $RSYNC_METADATA_FLAGS \
                --rsync-path="$REMOTE_RSYNC_PATH" \
                -e "ssh $SSH_OPTS" \
                "$src" "$dst"
            elif [ $rsync_exit -ne 0 ]; then
              return $rsync_exit
            fi
          }

          # Validate HAOS SSH connectivity first.
          ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "echo connected"

          ensure_remote_dir() {
            local remote_dir="$1"

            if ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "mkdir -p \"$remote_dir\""; then
              return 0
            fi

            if ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "sudo -n mkdir -p \"$remote_dir\""; then
              REMOTE_RSYNC_PATH="sudo -n rsync"
              echo "Remote mkdir required sudo; using --rsync-path='sudo -n rsync'"
              return 0
            fi

            echo "Failed to create remote directory: $remote_dir"
            echo "SSH user '$HA_SSH_USER' does not have permission (and passwordless sudo is unavailable)."
            echo "Recommended fixes:"
            echo "  1) Use HA_SSH_USER=root for the SSH add-on, or"
            echo "  2) grant this user write access to $HA_CONFIG_PATH, or"
            echo "  3) disable Protection mode in the SSH add-on if it is blocking /config writes."
            exit 1
          }

          log_remote_targets() {
            echo "Remote sync plan:"
            echo "  host: $HA_SSH_USER@$HA_HOST:$HA_CONFIG_PATH"
            echo "  package_scope: $PACKAGE_SCOPE"
            echo "  delete_mode: $DELETE_MODE"
            echo "  dry_run: ${{ github.event.inputs.dry_run }}"
            echo "  packages root: $PACKAGES_ROOT_REMOTE"

            if [ "$PACKAGE_SCOPE" = "selected" ]; then
              echo "  selected_packages: $SELECTED_PACKAGES"
              for package_name in $(echo "$SELECTED_PACKAGES" | tr ',' ' '); do
                package_name="$(echo "$package_name" | xargs)"
                [ -z "$package_name" ] && continue
                echo "  - package dir: $PACKAGES_ROOT_REMOTE/$package_name"
                if [ "$INCLUDE_WWW_SELECTED" = "true" ]; then
                  echo "  - www dir: $WWW_ROOT_REMOTE/$package_name"
                fi
              done
            else
              echo "  - package dir: $PACKAGES_ROOT_REMOTE"
              echo "  - feature include file: $FEATURE_INCLUDE_FILE_REMOTE"
              if [ "$ALLOWLIST_PROFILE" = "packages_www" ]; then
                echo "  - www dir: $WWW_ROOT_REMOTE"
              fi
            fi
          }

          log_remote_targets

          ensure_remote_dir "$PACKAGES_ROOT_REMOTE"
          sync_single_yaml_file "$FEATURE_INCLUDE_FILE_SRC" "$FEATURE_INCLUDE_FILE_DST"

          if [ "$PACKAGE_SCOPE" = "selected" ]; then
            if [ "$SELECTED_PACKAGES" = "all" ] || [ -z "$SELECTED_PACKAGES" ]; then
              echo "selected package scope requested, but selected_packages resolved to: $SELECTED_PACKAGES"
              exit 1
            fi

            for package_name in $(echo "$SELECTED_PACKAGES" | tr ',' ' '); do
              package_name="$(echo "$package_name" | xargs)"
              [ -z "$package_name" ] && continue

              ensure_remote_dir "$PACKAGES_ROOT_REMOTE/$package_name"

              sync_yaml_only "$PACKAGES_ROOT_SRC/$package_name" "$PACKAGES_ROOT_DST$package_name/"

              if [ "$INCLUDE_WWW_SELECTED" = "true" ]; then
                ensure_remote_dir "$WWW_ROOT_REMOTE/$package_name"
                sync_all_files "$WWW_ROOT_SRC/$package_name" "$WWW_ROOT_DST$package_name/"
              fi
            done
          else
            sync_yaml_only "$PACKAGES_ROOT_SRC" "$PACKAGES_ROOT_DST"

            if [ "$ALLOWLIST_PROFILE" = "packages_www" ]; then
              ensure_remote_dir "$WWW_ROOT_REMOTE"
              sync_all_files "$WWW_ROOT_SRC" "$WWW_ROOT_DST"
            fi
          fi

      - name: Check/update feature includes (post-sync)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        env:
          FEATURE_INCLUDE_MODE: ${{ github.event.inputs.feature_include_mode }}
          DRY_RUN_MODE: ${{ github.event.inputs.dry_run }}
          HA_CONFIGURATION_YAML_PATH: ${{ github.event.inputs.ha_configuration_yaml_path }}
          HA_FEATURE_INCLUDE_FILE_PATH: ${{ github.event.inputs.ha_feature_include_file_path }}
          PACKAGE_SCOPE: ${{ github.event.inputs.package_scope }}
          SELECTED_PACKAGES: ${{ steps.selection.outputs.selected_packages }}
          SOURCE_ROOT: ./homeassistant
          PACKAGES_ROOT: ./homeassistant/packages/3d_printing
        run: |
          bash .github/scripts/manage_feature_includes.sh

      - name: Validate Home Assistant config (post-sync)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail

          HA_SUPERVISOR_TOKEN_INPUT="${{ secrets.HA_SUPERVISOR_TOKEN }}"

          SSH_OPTS="-i $SSH_KEY_PATH -p $HA_SSH_PORT -o StrictHostKeyChecking=$SSH_STRICT_MODE"
          if [ "$SSH_STRICT_MODE" = "yes" ]; then
            SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          fi

          set +e
          CHECK_OUTPUT="$(ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "bash -s -- \"$HA_SUPERVISOR_TOKEN_INPUT\"" <<'REMOTE_CHECK'
          set -euo pipefail

          input_token="${1:-}"

          if [ -n "$input_token" ]; then
            export SUPERVISOR_TOKEN="$input_token"
            echo "Using SUPERVISOR_TOKEN from GitHub secret."
          fi

          if [ -z "${SUPERVISOR_TOKEN:-}" ]; then
            for token_file in \
              /run/s6/container_environment/SUPERVISOR_TOKEN \
              /run/secrets/supervisor_token \
              /data/supervisor_token
            do
              if [ -r "$token_file" ]; then
                export SUPERVISOR_TOKEN="$(cat "$token_file" 2>/dev/null || true)"
                if [ -n "${SUPERVISOR_TOKEN:-}" ]; then
                  echo "Using SUPERVISOR_TOKEN from $token_file"
                  break
                fi
              fi
            done
          fi

          if [ -z "${SUPERVISOR_TOKEN:-}" ]; then
            echo "No SUPERVISOR_TOKEN available in this SSH session."
          fi

          ha core check
          REMOTE_CHECK
          2>&1)"
          CHECK_EXIT=$?
          set -e

          if [ $CHECK_EXIT -eq 0 ]; then
            echo "$CHECK_OUTPUT"
            exit 0
          fi

          echo "$CHECK_OUTPUT"

          if echo "$CHECK_OUTPUT" | grep -qi "missing or invalid API token"; then
            set +e
            SUDO_CHECK_OUTPUT="$(ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "sudo -n bash -lc 'ha core check'" 2>&1)"
            SUDO_CHECK_EXIT=$?
            set -e

            if [ $SUDO_CHECK_EXIT -eq 0 ]; then
              echo "Retried with sudo after auth error and succeeded:"
              echo "$SUDO_CHECK_OUTPUT"
              exit 0
            fi

            echo "sudo retry also failed:"
            echo "$SUDO_CHECK_OUTPUT"
            echo "WARNING: Skipping hard failure for 'ha core check' due to SSH add-on auth context."
            echo "This deploy completed, but config validation could not run under current SSH user/session."
            echo "Recommended: use SSH user 'root' (or a shell context with Supervisor token) for this step."
            exit 0
          fi

          echo "ERROR: 'ha core check' failed for a reason other than auth context."
          exit $CHECK_EXIT

      - name: Dry-run validation note
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry-run mode skips 'ha core check' to avoid validating the currently deployed config instead of candidate changes."
          echo "Dry-run still validates selection logic, allowlist generation, SSH connectivity, and rsync candidate file set."

      - name: Sync Lovelace resources to HA storage
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event.inputs.allowlist_profile == 'packages_www' || github.event.inputs.include_www_for_selected == 'true') }}
        shell: bash
        env:
          RESOURCES_MANIFEST: ./homeassistant/packages/3d_printing/common/dashboards/_resources.yaml
          HA_SUPERVISOR_TOKEN: ${{ secrets.HA_SUPERVISOR_TOKEN }}
        run: |
          set -euo pipefail

          SSH_OPTS="-i $SSH_KEY_PATH -p $HA_SSH_PORT -o StrictHostKeyChecking=$SSH_STRICT_MODE"
          if [ "$SSH_STRICT_MODE" = "yes" ]; then
            SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          fi

          export SSH_OPTS
          bash .github/scripts/sync_lovelace_resources.sh

      - name: Sync Lovelace resources (dry-run preview)
        if: ${{ github.event.inputs.dry_run == 'true' && (github.event.inputs.allowlist_profile == 'packages_www' || github.event.inputs.include_www_for_selected == 'true') }}
        shell: bash
        env:
          RESOURCES_MANIFEST: ./homeassistant/packages/3d_printing/common/dashboards/_resources.yaml
          HA_SUPERVISOR_TOKEN: ${{ secrets.HA_SUPERVISOR_TOKEN }}
        run: |
          set -euo pipefail

          SSH_OPTS="-i $SSH_KEY_PATH -p $HA_SSH_PORT -o StrictHostKeyChecking=$SSH_STRICT_MODE"
          if [ "$SSH_STRICT_MODE" = "yes" ]; then
            SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          fi

          export SSH_OPTS
          bash .github/scripts/sync_lovelace_resources.sh --dry-run

      - name: Execute post-deploy action
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail

          POST_DEPLOY_ACTION="${{ github.event.inputs.post_deploy_action }}"
          HA_SUPERVISOR_TOKEN_INPUT="${{ secrets.HA_SUPERVISOR_TOKEN }}"

          SSH_OPTS="-i $SSH_KEY_PATH -p $HA_SSH_PORT -o StrictHostKeyChecking=$SSH_STRICT_MODE"
          if [ "$SSH_STRICT_MODE" = "yes" ]; then
            SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          fi

          echo "Selected post_deploy_action: $POST_DEPLOY_ACTION"

          case "$POST_DEPLOY_ACTION" in
            none)
              echo "No post-deploy action selected."
              exit 0
              ;;
            reload_domains)
              REMOTE_COMMAND="ha core api post --raw-json '{}' /api/services/automation/reload; ha core api post --raw-json '{}' /api/services/script/reload; ha core api post --raw-json '{}' /api/services/template/reload"
              echo "Executing domain reloads: automation, script, template"
              ;;
            restart_core)
              REMOTE_COMMAND="ha core restart"
              echo "Executing Home Assistant Core restart"
              ;;
            *)
              echo "Unknown post_deploy_action: $POST_DEPLOY_ACTION"
              exit 1
              ;;
          esac

          set +e
          ACTION_OUTPUT="$(ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "bash -s -- \"$HA_SUPERVISOR_TOKEN_INPUT\" \"$REMOTE_COMMAND\"" <<'REMOTE_ACTION'
          set -euo pipefail

          input_token="${1:-}"
          command_to_run="${2:-}"

          if [ -n "$input_token" ]; then
            export SUPERVISOR_TOKEN="$input_token"
          fi

          if [ -z "${SUPERVISOR_TOKEN:-}" ]; then
            for token_file in \
              /run/s6/container_environment/SUPERVISOR_TOKEN \
              /run/secrets/supervisor_token \
              /data/supervisor_token
            do
              if [ -r "$token_file" ]; then
                export SUPERVISOR_TOKEN="$(cat "$token_file" 2>/dev/null || true)"
                [ -n "${SUPERVISOR_TOKEN:-}" ] && break
              fi
            done
          fi

          bash -lc "$command_to_run"
          REMOTE_ACTION
          2>&1)"
          ACTION_EXIT=$?
          set -e

          if [ $ACTION_EXIT -eq 0 ]; then
            echo "$ACTION_OUTPUT"
            echo "Post-deploy action completed: $POST_DEPLOY_ACTION"
            exit 0
          fi

          echo "$ACTION_OUTPUT"

          if echo "$ACTION_OUTPUT" | grep -qi "missing or invalid API token"; then
            set +e
            SUDO_ACTION_OUTPUT="$(ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "sudo -n bash -lc '$REMOTE_COMMAND'" 2>&1)"
            SUDO_ACTION_EXIT=$?
            set -e

            if [ $SUDO_ACTION_EXIT -eq 0 ]; then
              echo "$SUDO_ACTION_OUTPUT"
              echo "Post-deploy action completed with sudo fallback: $POST_DEPLOY_ACTION"
              exit 0
            fi

            echo "$SUDO_ACTION_OUTPUT"
            echo "ERROR: Post-deploy action failed due to auth context and sudo fallback did not succeed."
            exit 1
          fi

          echo "ERROR: Post-deploy action failed."
          exit $ACTION_EXIT

      - name: Post-deploy reminder
        run: |
          echo "Selected post_deploy_action: ${{ github.event.inputs.post_deploy_action }}"
          echo "Reminder: Depending on what changed, you may still need a domain reload or Core restart."
          echo "This reminder is shown regardless of post_deploy_action selection."
