name: Deploy Home Assistant Config (HAOS Template)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set true to preview without writing"
        required: true
        default: "true"
      allowlist_profile:
        description: "Allowlist profile"
        required: true
        default: "packages_www"
      allowlist_file:
        description: "Optional custom allowlist path (overrides profile)"
        required: false
        default: ""
      package_scope:
        description: "Deploy scope: all packages from allowlist profile, or selected package folders only"
        required: true
        type: choice
        default: all
        options:
          - all
          - selected
      selected_packages:
        description: "Comma-separated package names when package_scope=selected (for example: core,common or common,humidity)"
        required: false
        default: ""
      package_preset:
        description: "Optional preset when package_scope=selected and selected_packages is empty"
        required: true
        type: choice
        default: none
        options:
          - none
          - core_only
          - core_common
      include_www_for_selected:
        description: "When package_scope=selected, also deploy matching www/3d_printing/<package>/ assets"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      check_ui_name_conflicts:
        description: "Best-effort check for potential UI/storage naming overlaps with selected packages"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      fail_on_ui_conflict:
        description: "Fail workflow when potential UI/storage naming overlaps are detected"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: [self-hosted, linux, docker, ha, homelab, dockhand]
    env:
      HA_HOST: ${{ vars.HA_HOST }}
      HA_SSH_PORT: ${{ vars.HA_SSH_PORT || '22' }}
      HA_SSH_USER: ${{ vars.HA_SSH_USER }}
      HA_CONFIG_PATH: ${{ vars.HA_CONFIG_PATH || '/config' }}
      SSH_KEY_PATH: ${{ vars.SSH_KEY_PATH || '/runner/.ssh/id_ed25519' }}
      HA_SSH_KNOWN_HOSTS: ${{ secrets.HA_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show changed files
        run: |
          git status --short

      - name: Resolve allowlist and package selection
        id: selection
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="./homeassistant"
          PROFILE="${{ github.event.inputs.allowlist_profile }}"
          CUSTOM_ALLOWLIST="${{ github.event.inputs.allowlist_file }}"
          PACKAGE_SCOPE="${{ github.event.inputs.package_scope }}"
          SELECTED_PACKAGES_INPUT="${{ github.event.inputs.selected_packages }}"
          PACKAGE_PRESET="${{ github.event.inputs.package_preset }}"
          INCLUDE_WWW_SELECTED="${{ github.event.inputs.include_www_for_selected }}"
          PACKAGES_ROOT="$SOURCE_ROOT/packages/3d_printing"

          if [ ! -d "$SOURCE_ROOT" ]; then
            echo "Missing source directory: $SOURCE_ROOT"
            exit 1
          fi

          if [ ! -d "$PACKAGES_ROOT" ]; then
            echo "Missing package directory: $PACKAGES_ROOT"
            exit 1
          fi

          if [ -n "$CUSTOM_ALLOWLIST" ]; then
            BASE_ALLOWLIST="$CUSTOM_ALLOWLIST"
          else
            case "$PROFILE" in
              yaml_only)
                BASE_ALLOWLIST=".github/deploy/rsync-allowlist-yaml-only.txt"
                ;;
              packages_only)
                BASE_ALLOWLIST=".github/deploy/rsync-allowlist-packages-only.txt"
                ;;
              packages_www)
                BASE_ALLOWLIST=".github/deploy/rsync-allowlist-packages-www.txt"
                ;;
              *)
                echo "Unknown allowlist_profile: $PROFILE"
                exit 1
                ;;
            esac
          fi

          if [ ! -f "$BASE_ALLOWLIST" ]; then
            echo "Missing allowlist file: $BASE_ALLOWLIST"
            exit 1
          fi

          EFFECTIVE_ALLOWLIST="$BASE_ALLOWLIST"
          SELECTED_PACKAGES_CSV="all"

          if [ "$PACKAGE_SCOPE" = "selected" ]; then
            SELECTED_PACKAGES_SOURCE="$SELECTED_PACKAGES_INPUT"

            if [ -z "$SELECTED_PACKAGES_SOURCE" ]; then
              case "$PACKAGE_PRESET" in
                none)
                  ;;
                core_only)
                  SELECTED_PACKAGES_SOURCE="core"
                  ;;
                core_common)
                  SELECTED_PACKAGES_SOURCE="core,common"
                  ;;
                *)
                  echo "Unknown package_preset: $PACKAGE_PRESET"
                  exit 1
                  ;;
              esac
            else
              if [ "$PACKAGE_PRESET" != "none" ]; then
                echo "selected_packages was provided and takes precedence over package_preset=$PACKAGE_PRESET"
              fi
            fi

            if [ -z "$SELECTED_PACKAGES_SOURCE" ]; then
              echo "When package_scope=selected, provide selected_packages or choose a package_preset other than none"
              exit 1
            fi

            declare -A valid_packages=()
            while IFS= read -r package_name; do
              [ -z "$package_name" ] && continue
              valid_packages["$package_name"]=1
            done < <(find "$PACKAGES_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

            declare -A seen_packages=()
            selected_list=()
            while IFS= read -r raw_package; do
              package_name="$(echo "$raw_package" | tr '[:upper:]' '[:lower:]' | xargs)"
              [ -z "$package_name" ] && continue

              if [ -z "${valid_packages[$package_name]+x}" ]; then
                echo "Unknown package: $package_name"
                echo "Available packages:"
                printf '  - %s\n' "${!valid_packages[@]}" | sort
                exit 1
              fi

              if [ -z "${seen_packages[$package_name]+x}" ]; then
                seen_packages["$package_name"]=1
                selected_list+=("$package_name")
              fi
            done < <(echo "$SELECTED_PACKAGES_SOURCE" | tr ',' '\n')

            if [ "${#selected_list[@]}" -eq 0 ]; then
              echo "No valid package names were provided in selected_packages"
              exit 1
            fi

            IFS=',' read -r -a sorted_selected <<< "$(printf '%s\n' "${selected_list[@]}" | sort | paste -sd ',' -)"
            SELECTED_PACKAGES_CSV="${sorted_selected[*]}"

            EFFECTIVE_ALLOWLIST="$RUNNER_TEMP/rsync-allowlist-selected.txt"
            {
              echo "# Generated at runtime for selected package deployment"
              echo "*/"
              echo "packages/"
              echo "packages/**/"

              for package_name in $(echo "$SELECTED_PACKAGES_CSV" | tr ',' ' '); do
                echo "packages/3d_printing/$package_name/"
                echo "packages/3d_printing/$package_name/**/"
                echo "packages/3d_printing/$package_name/**/*.yaml"
                echo "packages/3d_printing/$package_name/**/*.yml"
                if [ "$INCLUDE_WWW_SELECTED" = "true" ]; then
                  echo "www/3d_printing/$package_name/***"
                fi
              done
            } > "$EFFECTIVE_ALLOWLIST"
          fi

          echo "selected_packages=$SELECTED_PACKAGES_CSV" >> "$GITHUB_OUTPUT"
          echo "effective_allowlist=$EFFECTIVE_ALLOWLIST" >> "$GITHUB_OUTPUT"

          echo "Resolved package scope: $PACKAGE_SCOPE"
          echo "Resolved selected packages: $SELECTED_PACKAGES_CSV"
          echo "Resolved package preset: $PACKAGE_PRESET"
          echo "Resolved allowlist file: $EFFECTIVE_ALLOWLIST"

      - name: Show effective allowlist
        shell: bash
        run: |
          set -euo pipefail
          echo "Using allowlist: ${{ steps.selection.outputs.effective_allowlist }}"
          cat "${{ steps.selection.outputs.effective_allowlist }}"

      - name: Preflight (HAOS SSH + tools)
        run: |
          set -euo pipefail

          command -v rsync >/dev/null 2>&1 || { echo "rsync is required"; exit 1; }
          command -v ssh >/dev/null 2>&1 || { echo "ssh client is required"; exit 1; }

          [ -n "$HA_HOST" ] || { echo "Missing HA_HOST (set GitHub Variable HA_HOST)"; exit 1; }
          [ -n "$HA_SSH_USER" ] || { echo "Missing HA_SSH_USER (set GitHub Variable HA_SSH_USER)"; exit 1; }
          [ -n "$HA_SSH_PORT" ] || { echo "Missing HA_SSH_PORT (set GitHub Variable HA_SSH_PORT)"; exit 1; }
          [ -n "$SSH_KEY_PATH" ] || { echo "Missing SSH_KEY_PATH (set GitHub Variable SSH_KEY_PATH)"; exit 1; }
          [ -n "$HA_CONFIG_PATH" ] || { echo "Missing HA_CONFIG_PATH (set GitHub Variable HA_CONFIG_PATH)"; exit 1; }

          if [ ! -f "$SSH_KEY_PATH" ]; then
            echo "SSH key not found at $SSH_KEY_PATH"
            exit 1
          fi

      - name: Prepare SSH host key policy
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$HA_SSH_KNOWN_HOSTS" ]; then
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            printf '%s\n' "$HA_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            echo "SSH_STRICT_MODE=yes" >> "$GITHUB_ENV"
            echo "Configured strict host key checking using secret HA_SSH_KNOWN_HOSTS"
          else
            echo "SSH_STRICT_MODE=accept-new" >> "$GITHUB_ENV"
            echo "HA_SSH_KNOWN_HOSTS not set; using StrictHostKeyChecking=accept-new"
          fi

      - name: Best-effort UI/storage name conflict check
        if: ${{ github.event.inputs.check_ui_name_conflicts == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/check_ui_name_conflicts.py \
            --ha-host "$HA_HOST" \
            --ha-port "$HA_SSH_PORT" \
            --ha-user "$HA_SSH_USER" \
            --ssh-key "$SSH_KEY_PATH" \
            --selected-packages "${{ steps.selection.outputs.selected_packages }}" \
            --strict "${{ github.event.inputs.fail_on_ui_conflict }}"

      - name: Deploy sync to HAOS /config (SSH add-on)
        run: |
          set -euo pipefail

          SOURCE_ROOT="./homeassistant/"

          SSH_OPTS="-i $SSH_KEY_PATH -p $HA_SSH_PORT -o StrictHostKeyChecking=$SSH_STRICT_MODE"
          if [ "$SSH_STRICT_MODE" = "yes" ]; then
            SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          fi
          ALLOWLIST_FILE="${{ steps.selection.outputs.effective_allowlist }}"

          if [ ! -f "$ALLOWLIST_FILE" ]; then
            echo "Missing allowlist file: $ALLOWLIST_FILE"
            exit 1
          fi

          if [ ! -d "$SOURCE_ROOT" ]; then
            echo "Missing source directory: $SOURCE_ROOT"
            exit 1
          fi

          # Validate HAOS SSH connectivity first.
          ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "echo connected"

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            rsync -avhn --delete \
              --include-from="$ALLOWLIST_FILE" \
              --exclude='*' \
              -e "ssh $SSH_OPTS" \
              "$SOURCE_ROOT" "$HA_SSH_USER@$HA_HOST:$HA_CONFIG_PATH/"
          else
            rsync -avh --delete \
              --include-from="$ALLOWLIST_FILE" \
              --exclude='*' \
              -e "ssh $SSH_OPTS" \
              "$SOURCE_ROOT" "$HA_SSH_USER@$HA_HOST:$HA_CONFIG_PATH/"
          fi

      - name: Validate Home Assistant config (post-sync)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail

          SSH_OPTS="-i $SSH_KEY_PATH -p $HA_SSH_PORT -o StrictHostKeyChecking=$SSH_STRICT_MODE"
          if [ "$SSH_STRICT_MODE" = "yes" ]; then
            SSH_OPTS="$SSH_OPTS -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          fi

          # Requires HA CLI availability in the SSH shell.
          ssh $SSH_OPTS "$HA_SSH_USER@$HA_HOST" "ha core check"

      - name: Dry-run validation note
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry-run mode skips 'ha core check' to avoid validating the currently deployed config instead of candidate changes."
          echo "Dry-run still validates selection logic, allowlist generation, SSH connectivity, and rsync candidate file set."

      - name: Reload note
        run: |
          echo "After config check, reload target domains (template/automation/script) or restart Core if needed."
