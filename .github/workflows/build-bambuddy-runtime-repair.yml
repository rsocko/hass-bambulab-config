name: Build Bambuddy Runtime Repair Image

on:
  workflow_dispatch:
    inputs:
      version_mode:
        description: How to determine the image tag
        required: true
        type: choice
        default: next_patch
        options:
          - explicit
          - next_major
          - next_minor
          - next_patch
      image_tag:
        description: Explicit Docker image tag to build when version_mode=explicit
        required: false
        default: ""
      registry:
        description: Registry/repository prefix
        required: true
        default: registry.socko.us/bambuddy-runtime-repair
      push_image:
        description: Push built image to registry
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      push_latest:
        description: Also tag and push this image as latest
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      ghcr_repository:
        description: "Optional GHCR repository override (default: ghcr.io/<owner>/bambuddy-runtime-repair)"
        required: false
        default: ""
      push_ghcr_image:
        description: Also push this image to GHCR
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      push_ghcr_latest:
        description: Also tag and push the GHCR image as latest
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-bambuddy-runtime-repair-${{ github.event.inputs.registry || 'registry.socko.us/bambuddy-runtime-repair' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, docker, build, homelab, dockhand]
    outputs:
      resolved_tag: ${{ steps.version.outputs.resolved_tag }}
      resolved_image: ${{ steps.version.outputs.resolved_image }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    steps:
      - name: Pre-clean workspace (self-hosted)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Resolve image tag
        id: version
        shell: bash
        env:
          REGISTRY_REPOSITORY: ${{ github.event.inputs.registry }}
          VERSION_MODE: ${{ github.event.inputs.version_mode }}
          EXPLICIT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_registry_version.py

      - name: Show resolved image target
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag }}"
          GHCR_REPOSITORY="${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambuddy-runtime-repair', github.repository_owner) }}"
          echo "Resolved image: $IMAGE"
          echo "Resolved GHCR image: $GHCR_REPOSITORY:${{ steps.version.outputs.resolved_tag }}"
          echo "Latest semantic tag in registry: ${{ steps.version.outputs.latest_tag || 'none' }}"

      - name: Publish version summary
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED_TAG='${{ steps.version.outputs.resolved_tag }}'
          RESOLVED_IMAGE='${{ steps.version.outputs.resolved_image }}'
          LATEST_TAG='${{ steps.version.outputs.latest_tag }}'
          PUSH_LATEST='${{ github.event.inputs.push_latest }}'
          GHCR_REPOSITORY='${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambuddy-runtime-repair', github.repository_owner) }}'
          PUSH_GHCR_IMAGE='${{ github.event.inputs.push_ghcr_image }}'
          PUSH_GHCR_LATEST='${{ github.event.inputs.push_ghcr_latest }}'
          {
            echo '## Bambuddy Runtime Repair Image Version'
            echo
            echo "Resolved tag: \`$RESOLVED_TAG\`"
            echo
            echo "Resolved image: \`$RESOLVED_IMAGE\`"
            echo
            echo 'Compose update:'
            echo "\`BAMBUDDY_RUNTIME_REPAIR_IMAGE_TAG=$RESOLVED_TAG\`"
            if [ "$PUSH_LATEST" = 'true' ]; then
              echo
              echo 'Mutable tag update:'
              echo "\`BAMBUDDY_RUNTIME_REPAIR_IMAGE_TAG=latest\`"
            fi
            if [ "$PUSH_GHCR_IMAGE" = 'true' ]; then
              echo
              echo 'GHCR publish:'
              echo "\`$GHCR_REPOSITORY:$RESOLVED_TAG\`"
              if [ "$PUSH_GHCR_LATEST" = 'true' ]; then
                echo
                echo 'GHCR mutable tag update:'
                echo "\`$GHCR_REPOSITORY:latest\`"
              fi
            fi
            echo
            echo "Latest existing semantic tag: \`${LATEST_TAG:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Resolved Bambuddy sidecar image::$RESOLVED_IMAGE"

      - name: Login to GHCR
        if: ${{ github.event.inputs.push_ghcr_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate sidecar Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          FAILED=()
          while IFS= read -r -d '' f; do
            if ! python3 -m py_compile "$f" 2>/tmp/py_err; then
              echo "::error file=$f::$(cat /tmp/py_err)"
              FAILED+=("$f")
            fi
          done < <(find sidecars/bambuddy-runtime-repair/app -name '*.py' -print0 | sort -z)
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "=========================================="
            echo "  Copilot Debug Prompt (copy/paste)"
            echo "=========================================="
            echo "The following Python files in sidecars/bambuddy-runtime-repair/app/ have syntax errors. Please fix them:"
            for f in "${FAILED[@]}"; do echo "  - $f"; done
            echo ""
            echo "Run locally: python3 -m py_compile <file>"
            echo "=========================================="
            {
              echo "## Syntax Gate Failed"
              echo ""
              echo "The following files have Python syntax errors:"
              for f in "${FAILED[@]}"; do echo "- \`$f\`"; done
              echo ""
              echo "Fix locally with: \`python3 -m py_compile <file>\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "syntax_ok"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag }}"
          GHCR_IMAGE="${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambuddy-runtime-repair', github.repository_owner) }}:${{ steps.version.outputs.resolved_tag }}"
          docker build -f sidecars/bambuddy-runtime-repair/Dockerfile -t "$IMAGE" .
          if [ "${{ github.event.inputs.push_latest }}" = 'true' ]; then
            docker tag "$IMAGE" "${{ github.event.inputs.registry }}:latest"
          fi
          if [ "${{ github.event.inputs.push_ghcr_image }}" = 'true' ]; then
            docker tag "$IMAGE" "$GHCR_IMAGE"
            if [ "${{ github.event.inputs.push_ghcr_latest }}" = 'true' ]; then
              docker tag "$IMAGE" "${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambuddy-runtime-repair', github.repository_owner) }}:latest"
            fi
          fi
          echo "Built $IMAGE"

      - name: Push image
        if: ${{ github.event.inputs.push_image == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag }}"
          docker push "$IMAGE"
          if [ "${{ github.event.inputs.push_latest }}" = 'true' ]; then
            docker push "${{ github.event.inputs.registry }}:latest"
          fi

      - name: Push GHCR image
        if: ${{ github.event.inputs.push_ghcr_image == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          GHCR_IMAGE="${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambuddy-runtime-repair', github.repository_owner) }}:${{ steps.version.outputs.resolved_tag }}"
          docker push "$GHCR_IMAGE"
          if [ "${{ github.event.inputs.push_ghcr_latest }}" = 'true' ]; then
            docker push "${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambuddy-runtime-repair', github.repository_owner) }}:latest"
          fi
