name: Python Pytest

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sidecars:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run sidecars pytest subset
        run: >-
          python -m pytest
          tests/sidecars/test_bambuddy_restore_from.py
          tests/sidecars/test_print_history_browser_core.py

  print_history:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run print history pytest subset
        run: >-
          python -m pytest
          tests/print_history/test_bambuddy_variant3_store.py
          tests/print_history/test_bambuddy_variant3_services_smoke.py