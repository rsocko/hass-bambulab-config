name: Build Bambu Studio API Image

on:
  workflow_dispatch:
    inputs:
      bambu_version:
        description: BambuStudio version to embed in the image
        required: true
        default: "02.07.01.57"
      version_mode:
        description: How to determine the image tag
        required: true
        type: choice
        default: explicit
        options:
          - explicit
          - next_major
          - next_minor
          - next_patch
      image_tag:
        description: Explicit Docker image tag to build when version_mode=explicit (default derives from bambu_version)
        required: false
        default: ""
      registry:
        description: Registry/repository prefix
        required: true
        default: registry.socko.us/bambu-studio-api
      push_image:
        description: Push built image to registry
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      push_latest:
        description: Also tag and push this image as latest
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      ghcr_repository:
        description: "Optional GHCR repository override (default: ghcr.io/<owner>/bambu-studio-api)"
        required: false
        default: ""
      push_ghcr_image:
        description: Also push this image to GHCR
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      push_ghcr_latest:
        description: Also tag and push the GHCR image as latest
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-bambu-studio-api-${{ github.event.inputs.registry || 'registry.socko.us/bambu-studio-api' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, docker, build, homelab, dockhand]
    outputs:
      resolved_tag: ${{ steps.version.outputs.resolved_tag }}
      resolved_image: ${{ steps.version.outputs.resolved_image }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    steps:
      - name: Checkout (for version-resolution script)
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve image tag
        id: version
        shell: bash
        env:
          REGISTRY_REPOSITORY: ${{ github.event.inputs.registry }}
          VERSION_MODE: ${{ github.event.inputs.version_mode }}
          EXPLICIT_TAG: ${{ github.event.inputs.image_tag || format('bambu{0}', github.event.inputs.bambu_version) }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_registry_version.py
          GHCR_REPOSITORY="${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambu-studio-api', github.repository_owner) }}"
          echo "Resolved image: ${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag || 'pending' }}"
          echo "Resolved GHCR image: $GHCR_REPOSITORY:${{ steps.version.outputs.resolved_tag || 'pending' }}"
          echo "BambuStudio version: ${{ github.event.inputs.bambu_version }}"

      - name: Publish version summary
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED_TAG='${{ steps.version.outputs.resolved_tag }}'
          RESOLVED_IMAGE='${{ steps.version.outputs.resolved_image }}'
          LATEST_TAG='${{ steps.version.outputs.latest_tag }}'
          PUSH_LATEST='${{ github.event.inputs.push_latest }}'
          BAMBU_VERSION='${{ github.event.inputs.bambu_version }}'
          GHCR_REPOSITORY='${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambu-studio-api', github.repository_owner) }}'
          PUSH_GHCR_IMAGE='${{ github.event.inputs.push_ghcr_image }}'
          PUSH_GHCR_LATEST='${{ github.event.inputs.push_ghcr_latest }}'
          {
            echo '## Bambu Studio API Image Version'
            echo
            echo "Resolved tag: \`$RESOLVED_TAG\`"
            echo
            echo "Resolved image: \`$RESOLVED_IMAGE\`"
            echo
            echo "BambuStudio version: \`$BAMBU_VERSION\`"
            echo
            echo 'Compose update:'
            echo "\`BAMBU_STUDIO_API_IMAGE_TAG=$RESOLVED_TAG\`"
            if [ "$PUSH_LATEST" = 'true' ]; then
              echo
              echo 'Mutable tag update:'
              echo "\`BAMBU_STUDIO_API_IMAGE_TAG=latest\`"
            fi
            if [ "$PUSH_GHCR_IMAGE" = 'true' ]; then
              echo
              echo 'GHCR publish:'
              echo "\`$GHCR_REPOSITORY:$RESOLVED_TAG\`"
              if [ "$PUSH_GHCR_LATEST" = 'true' ]; then
                echo
                echo 'GHCR mutable tag update:'
                echo "\`$GHCR_REPOSITORY:latest\`"
              fi
            fi
            echo
            echo "Latest existing semantic tag: \`${LATEST_TAG:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Resolved bambu-studio-api image::$RESOLVED_IMAGE"

      - name: Login to GHCR
        if: ${{ github.event.inputs.push_ghcr_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache slicer-api source
        id: cache-slicer
        uses: actions/cache@v4
        with:
          path: _slicer-api-src
          key: slicer-api-bambuddy-profile-resolver-${{ github.run_id }}
          restore-keys: |
            slicer-api-bambuddy-profile-resolver-

      - name: Clone maziggy fork (profile-resolver branch)
        if: steps.cache-slicer.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _slicer-api-src
          git clone --depth 1 --branch bambuddy/profile-resolver \
            https://github.com/maziggy/orca-slicer-api.git \
            _slicer-api-src

      - name: Update cached slicer-api source
        if: steps.cache-slicer.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd _slicer-api-src
          git fetch --depth 1 origin bambuddy/profile-resolver
          git reset --hard FETCH_HEAD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          GHCR_IMAGE: ${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambu-studio-api', github.repository_owner) }}
        with:
          context: _slicer-api-src
          file: _slicer-api-src/Dockerfile.bambu-studio
          push: ${{ github.event.inputs.push_image == 'true' }}
          tags: |
            ${{ github.event.inputs.registry }}:${{ steps.version.outputs.resolved_tag }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}:latest', github.event.inputs.registry) || '' }}
            ${{ github.event.inputs.push_ghcr_image == 'true' && format('{0}:{1}', env.GHCR_IMAGE, steps.version.outputs.resolved_tag) || '' }}
            ${{ github.event.inputs.push_ghcr_image == 'true' && github.event.inputs.push_ghcr_latest == 'true' && format('{0}:latest', env.GHCR_IMAGE) || '' }}
          build-args: |
            BAMBU_VERSION=${{ github.event.inputs.bambu_version }}
          cache-from: type=registry,ref=${{ github.event.inputs.registry }}:buildcache
          cache-to: type=registry,ref=${{ github.event.inputs.registry }}:buildcache,mode=max

      - name: Push GHCR image
        if: ${{ github.event.inputs.push_ghcr_image == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          GHCR_IMAGE="${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambu-studio-api', github.repository_owner) }}:${{ steps.version.outputs.resolved_tag }}"
          docker push "$GHCR_IMAGE"
          if [ "${{ github.event.inputs.push_ghcr_latest }}" = 'true' ]; then
            docker push "${{ github.event.inputs.ghcr_repository || format('ghcr.io/{0}/bambu-studio-api', github.repository_owner) }}:latest"
          fi
