appdaemon:
  latitude: !env_var APPDAEMON_LATITUDE
  longitude: !env_var APPDAEMON_LONGITUDE
  elevation: !env_var APPDAEMON_ELEVATION
  time_zone: !env_var APPDAEMON_TIME_ZONE
  plugins:
    HASS:
      type: hass
      ha_url: !env_var HA_URL
      token: !env_var HA_TOKEN
      ws_max_msg_size: 16777216
      plugin_startup_conditions:
        event:
          event_type: homeassistant_started

http:
  url: http://0.0.0.0:5050

admin:

api:

logs:
  main_log:
    level: !env_var APPDAEMON_LOG_LEVEL
