services:
  model-catalog:
    image: registry.socko.us/model-catalog:${MODEL_CATALOG_IMAGE_TAG:-0.1.0}
    container_name: model-catalog
    environment:
      MANYFOLD_BASE_URL: http://manyfold:3214
      MANYFOLD_MODELS_PATH: /models
      
      MANYFOLD_OAUTH_TOKEN_PATH: /oauth/token
      MANYFOLD_CLIENT_ID: ${MANYFOLD_CLIENT_ID:-}
      MANYFOLD_CLIENT_SECRET: ${MANYFOLD_CLIENT_SECRET:-}
      MANYFOLD_OAUTH_SCOPES: ${MANYFOLD_OAUTH_SCOPES:-public read write delete}
      MANYFOLD_SESSION_EMAIL: ${MANYFOLD_SESSION_EMAIL:-}
      MANYFOLD_SESSION_PASSWORD: ${MANYFOLD_SESSION_PASSWORD:-}

      MODEL_CATALOG_DB_PATH: /data/model_catalog.db
      MODEL_CATALOG_REFRESH_TTL_SECONDS: 900
      MODEL_CATALOG_HOST: 0.0.0.0
      MODEL_CATALOG_PORT: 8314

      # Important: container paths, not host paths.
      MODEL_CATALOG_CURATED_ASSETS_ROOT: /assets/Model Catalog
      MODEL_CATALOG_INTAKE_ROOTS: /assets/Model Inbox,/assets/Validation
      MODEL_CATALOG_WORKING_FILES_ROOT: /assets/Model Working Files
      SOURCE_FILESYSTEM_ROOTS: ""

    volumes:
      - model_catalog_data:/data
      - /mnt/c/.../3D Printing:/assets
    ports:
      - "127.0.0.1:8314:8314"
    restart: unless-stopped

  model-catalog-datasette:
    image: datasetteproject/datasette:latest
    container_name: model-catalog-datasette
    networks:
      - traefik
    command:
      - datasette
      - /data/model_catalog.db
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --immutable
      - /data/model_catalog.db
      - --setting
      - default_page_size
      - "50"
      - --setting
      - sql_time_limit_ms
      - "5000"
    volumes:
      - model_catalog_data:/data:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog-datasette.rule=Host(`model-catalog-datasette.socko.us`)"
      - "traefik.http.routers.model-catalog-datasette.entrypoints=web"
      - "traefik.http.routers.model-catalog-datasette.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog-datasette.loadbalancer.server.port=8001"
      - "traefik.docker.network=traefik"
    # ports:
    #   - "127.0.0.1:8401:8001"
    restart: unless-stopped
    depends_on:
      - model-catalog

  model-catalog-chartdb:
    image: ghcr.io/chartdb/chartdb:latest
    container_name: model-catalog-chartdb
    networks:
      - traefik
    environment:
      HIDE_CHARTDB_CLOUD: "true"
      DISABLE_ANALYTICS: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog-chartdb.rule=Host(`model-catalog-chartdb.socko.us`)"
      - "traefik.http.routers.model-catalog-chartdb.entrypoints=web"
      - "traefik.http.routers.model-catalog-chartdb.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog-chartdb.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    # ports:
    #   - "127.0.0.1:8402:80"
    restart: unless-stopped
    depends_on:
      - model-catalog

  model-catalog-sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: model-catalog-sqlite-web
    networks:
      - traefik
    command:
      - model_catalog.db
      - --read-only
      - --rows-per-page
      - "100"
      - --query-rows-per-page
      - "2000"
    volumes:
      - model_catalog_data:/data:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog-sqlite-web.rule=Host(`model-catalog-sqlite-web.socko.us`)"
      - "traefik.http.routers.model-catalog-sqlite-web.entrypoints=web"
      - "traefik.http.routers.model-catalog-sqlite-web.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog-sqlite-web.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"
    # ports:
    #   - "127.0.0.1:8403:8080"
    restart: unless-stopped
    depends_on:
      - model-catalog

volumes:
  model_catalog_data:

networks:
  traefik:
    external: true

