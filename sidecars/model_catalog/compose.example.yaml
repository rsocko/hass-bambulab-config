services:
  model-catalog:
    image: registry.socko.us/model-catalog:${MODEL_CATALOG_IMAGE_TAG:-0.1.0}
    container_name: model-catalog
    environment:
      MANYFOLD_BASE_URL: http://manyfold:3214
      MANYFOLD_MODELS_PATH: /models
      
      MANYFOLD_OAUTH_TOKEN_PATH: /oauth/token
      MANYFOLD_CLIENT_ID: ${MANYFOLD_CLIENT_ID:-}
      MANYFOLD_CLIENT_SECRET: ${MANYFOLD_CLIENT_SECRET:-}
      MANYFOLD_OAUTH_SCOPES: ${MANYFOLD_OAUTH_SCOPES:-public read write delete}
      MANYFOLD_SESSION_EMAIL: ${MANYFOLD_SESSION_EMAIL:-}
      MANYFOLD_SESSION_PASSWORD: ${MANYFOLD_SESSION_PASSWORD:-}

      MODEL_CATALOG_DB_PATH: /data/model_catalog.db
      MODEL_CATALOG_REFRESH_TTL_SECONDS: 900
      MODEL_CATALOG_HOST: 0.0.0.0
      MODEL_CATALOG_PORT: 8314

      # Important: container paths, not host paths.
      SOURCE_FILESYSTEM_ROOTS: /imports/intake,/imports/validation

    volumes:
      - model_catalog_data:/data
      - /mnt/c/.../3D Printing/Model Inbox:/imports/intake
      - /mnt/c/.../3D Printing/Validation:/imports/validation
    ports:
      - "127.0.0.1:8314:8314"
    restart: unless-stopped

  model-catalog-datasette:
    image: datasetteproject/datasette:latest
    container_name: model-catalog-datasette
    networks:
      - traefik
    command:
      - datasette
      - /data/model_catalog.db
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --immutable
      - /data/model_catalog.db
      - --setting
      - default_page_size
      - "50"
      - --setting
      - sql_time_limit_ms
      - "5000"
    volumes:
      - model_catalog_data:/data:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog-datasette.rule=Host(`model-catalog-datasette.socko.us`)"
      - "traefik.http.routers.model-catalog-datasette.entrypoints=web"
      - "traefik.http.routers.model-catalog-datasette.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog-datasette.loadbalancer.server.port=8001"
      - "traefik.docker.network=traefik"
    # ports:
    #   - "127.0.0.1:8401:8001"
    restart: unless-stopped
    depends_on:
      - model-catalog

  model-catalog-schema-crawler:
    image: schemacrawler/schemacrawler:latest
    container_name: model-catalog-schema-crawler
    entrypoint:
      - /bin/sh
      - -c
    command: >
      while true; do
        schemacrawler
        --server=sqlite
        --database=/data/model_catalog.db
        --info-level=maximum
        --command=schema
        --output-format=html
        --output-file=/output/index.html;
        sleep 21600;
      done
    volumes:
      - model_catalog_data:/data:ro
      - ./diagnostics/schema:/output
    restart: unless-stopped
    depends_on:
      - model-catalog

  model-catalog-schema-viewer:
    image: nginx:alpine
    container_name: model-catalog-schema-viewer
    networks:
      - traefik
    volumes:
      - ./diagnostics/schema:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog-schema-viewer.rule=Host(`model-catalog-schema-crawler.socko.us`)"
      - "traefik.http.routers.model-catalog-schema-viewer.entrypoints=web"
      - "traefik.http.routers.model-catalog-schema-viewer.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog-schema-viewer.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    # ports:
    #   - "127.0.0.1:8402:80"
    restart: unless-stopped
    depends_on:
      - model-catalog-schema-crawler

volumes:
  model_catalog_data:

networks:
  traefik:
    external: true

