# Independent Model Catalog Stack
# This stack runs independently as a local-authority catalog service.
#
# Storage Architecture:
# - /data          → Named volume (service-owned database)
# - /assets        → Bind mount to host (model files, working groups, intake)
# - Traefik        → External shared network for reverse proxy

services:
  model-catalog:
    image: registry.socko.us/model-catalog:${MODEL_CATALOG_IMAGE_TAG:-0.1.0}
    container_name: model-catalog
    
    networks:
      - traefik
    
    environment:
      # Service Configuration
      MODEL_CATALOG_DB_PATH: /data/model_catalog.db
      # Test DB path (auto-derived as /data/model_catalog_test.db if not set).
      # Switch the active profile at runtime via POST /api/admin/db-profile/switch
      # or by setting MODEL_CATALOG_DB_PROFILE=test and restarting.
      MODEL_CATALOG_DB_PATH_TEST: ${MODEL_CATALOG_DB_PATH_TEST:-/data/model_catalog_test.db}
      MODEL_CATALOG_DB_PROFILE: ${MODEL_CATALOG_DB_PROFILE:-prod}
      # Bootstrap schema on both prod and test DBs at startup.
      MODEL_CATALOG_DB_BOOTSTRAP_ALL_PROFILES: ${MODEL_CATALOG_DB_BOOTSTRAP_ALL_PROFILES:-true}
      # Seed test DB from prod on startup (off by default — use only for intentional test resets).
      MODEL_CATALOG_DB_SEED_TEST_FROM_PROD_ON_START: ${MODEL_CATALOG_DB_SEED_TEST_FROM_PROD_ON_START:-false}
      MODEL_CATALOG_DB_SEED_TEST_OVERWRITE: ${MODEL_CATALOG_DB_SEED_TEST_OVERWRITE:-false}
      MODEL_CATALOG_REFRESH_TTL_SECONDS: ${MODEL_CATALOG_REFRESH_TTL_SECONDS:-900}
      MODEL_CATALOG_AUTHORITY_MODE: ${MODEL_CATALOG_AUTHORITY_MODE:-local}
      MODEL_CATALOG_HOST: 0.0.0.0
      MODEL_CATALOG_PORT: 8314
      
      # Curated storage root for service-owned published assets.
      MODEL_CATALOG_CURATED_ASSETS_ROOT: ${MODEL_CATALOG_CURATED_ASSETS_ROOT:-/assets/Model Catalog}

      # Intake browse/select roots. Keep this limited to staging areas rather than the
      # full /assets tree so catalog storage is not offered as an intake source.
      MODEL_CATALOG_INTAKE_ROOTS: ${MODEL_CATALOG_INTAKE_ROOTS:-/assets/Model Inbox}

      # Working Files explorer/reindex root.
      MODEL_CATALOG_WORKING_FILES_ROOT: ${MODEL_CATALOG_WORKING_FILES_ROOT:-/assets/Model Working Files}

      # Host bind source used for launch/explorer path mapping diagnostics.
      # Required by Working Files actions that translate /assets paths to host paths.
      ASSETS_ROOT_HOST: ${ASSETS_ROOT_HOST:-}
      
      # Local authority is the default mode.
      MODEL_CATALOG_STANDALONE_MODE: ${MODEL_CATALOG_STANDALONE_MODE:-true}
    
    volumes:
      # Named volume for service-owned database and ephemeral cache
      - model_catalog_data:/data
      
      # Bind mount for model assets, working groups, and inbox
      # Point this to your host directory (e.g., Windows OneDrive, NAS, local path)
      # Example: ${ASSETS_ROOT_HOST}:/assets
      # On Windows with OneDrive: /mnt/c/OneDrive/ModelAssets:/assets
      - "${ASSETS_ROOT_HOST:?Error: ASSETS_ROOT_HOST not set in .env}:/assets"
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog.rule=Host(`${MODEL_CATALOG_HOSTNAME:-model-catalog.socko.us}`)"
      - "traefik.http.routers.model-catalog.entrypoints=web"
      - "traefik.http.routers.model-catalog.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog.loadbalancer.server.port=8314"
      - "traefik.docker.network=traefik"
    
    ports:
      # Local debugging access (localhost only)
      - "127.0.0.1:8314:8314"
    
    restart: unless-stopped

  model-catalog-datasette:
    image: datasetteproject/datasette:latest
    container_name: model-catalog-datasette

    networks:
      - traefik

    # NOTE: Datasette always targets the PROD database (/data/model_catalog.db).
    # It does not follow MODEL_CATALOG_DB_PROFILE. If you need to inspect the test
    # database, connect to the container directly:
    #   docker exec -it model-catalog-datasette datasette /data/model_catalog_test.db
    command:
      - datasette
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --immutable
      - /data/model_catalog.db
      - --setting
      - default_page_size
      - "50"
      - --setting
      - sql_time_limit_ms
      - "5000"

    volumes:
      - model_catalog_data:/data:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog-datasette.rule=Host(`model-catalog-datasette.socko.us`)"
      - "traefik.http.routers.model-catalog-datasette.entrypoints=web"
      - "traefik.http.routers.model-catalog-datasette.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog-datasette.loadbalancer.server.port=8001"
      - "traefik.docker.network=traefik"

    # Local debugging access can be re-enabled if you want host-only exposure too.
    # ports:
    #   - "127.0.0.1:8401:8001"

    restart: unless-stopped

    depends_on:
      - model-catalog

  model-catalog-chartdb:
    image: ghcr.io/chartdb/chartdb:latest
    container_name: model-catalog-chartdb

    networks:
      - traefik

    environment:
      HIDE_CHARTDB_CLOUD: "true"
      DISABLE_ANALYTICS: "true"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog-chartdb.rule=Host(`${MODEL_CATALOG_CHARTDB_HOSTNAME:-model-catalog-chartdb.socko.us}`)"
      - "traefik.http.routers.model-catalog-chartdb.entrypoints=web"
      - "traefik.http.routers.model-catalog-chartdb.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog-chartdb.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

    # Local debugging access can be re-enabled if you want host-only exposure too.
    # ports:
    #   - "127.0.0.1:8402:80"

    restart: unless-stopped

    depends_on:
      - model-catalog

  model-catalog-sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: model-catalog-sqlite-web

    networks:
      - traefik

    # NOTE: sqlite-web always targets the PROD database (model_catalog.db).
    # It does not follow MODEL_CATALOG_DB_PROFILE. To inspect the test database,
    # override this service's command to target model_catalog_test.db instead.
    command:
      - model_catalog.db
      - --read-only
      - --rows-per-page
      - "100"
      - --query-rows-per-page
      - "2000"

    volumes:
      - model_catalog_data:/data:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.model-catalog-sqlite-web.rule=Host(`${MODEL_CATALOG_SQLITE_WEB_HOSTNAME:-model-catalog-sqlite-web.socko.us}`)"
      - "traefik.http.routers.model-catalog-sqlite-web.entrypoints=web"
      - "traefik.http.routers.model-catalog-sqlite-web.middlewares=compression@file,security-headers@file"
      - "traefik.http.services.model-catalog-sqlite-web.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"

    # Local debugging access can be re-enabled if you want host-only exposure too.
    # ports:
    #   - "127.0.0.1:8403:8080"

    restart: unless-stopped

    depends_on:
      - model-catalog

volumes:
  model_catalog_data:
    # Named volume stores:
    # - model_catalog.db        (SQLite database, primary durable state)
    # - cache/                  (ephemeral: generated previews, geometry analysis)
    # 
    # This volume is service-owned and opaque to the host.
    # Backup this volume separately using Docker volume backup procedures.
    #
    # Diagnostics tools also mount this volume read-only:
    # - model-catalog-datasette for browser inspection and ad-hoc SELECT queries
    # - model-catalog-sqlite-web for schema browsing and read-only query exploration

networks:
  traefik:
    # External shared network for reverse proxy
    # Must exist before bringing up this stack:
    # docker network create traefik
    external: true
