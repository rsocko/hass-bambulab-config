services:
  bambuddy-runtime-repair:
    image: registry.socko.us/bambuddy-runtime-repair:${BAMBUDDY_RUNTIME_REPAIR_IMAGE_TAG:-0.1.3}
    container_name: bambuddy-runtime-repair
    # Default access path: localhost-only port bind.
    # Optional Traefik example is included below as commented config.
    # Uncomment the networks and labels blocks, then comment out ports if you want Traefik-only access.
    #networks:
    #  - traefik
    environment:
      BAMBUDDY_DB_PATH: /data/bambuddy.db
      REPAIR_API_TOKEN: ${REPAIR_API_TOKEN}
      BAMBUDDY_API_BASE_URL: ${BAMBUDDY_API_BASE_URL}
      BAMBUDDY_API_KEY: ${BAMBUDDY_API_KEY}
      HOME_ASSISTANT_BASE_URL: ${HOME_ASSISTANT_BASE_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      LOG_LEVEL: INFO
    volumes:
      - bambuddy_data:/data
    #labels:
    #  - "traefik.enable=true"
    #  - "traefik.http.routers.bambuddy-runtime-repair.rule=Host(`bambuddy-runtime-repair.example.com`)"
    #  - "traefik.http.routers.bambuddy-runtime-repair.entrypoints=web"
    #  - "traefik.http.routers.bambuddy-runtime-repair.middlewares=compression@file,security-headers@file"
    #  - "traefik.http.services.bambuddy-runtime-repair.loadbalancer.server.port=8080"
    #  - "traefik.docker.network=traefik"
    # Keep the localhost bind for simple internal/operator access.
    # Comment this out if you switch to Traefik-only routing.
    ports:
      - "127.0.0.1:8818:8080"
    restart: unless-stopped

#networks:
#  traefik:
#    external: true

volumes:
  bambuddy_data: