alias: Print Complete - Notification with Snapshot
description: >
  Sends a notification with camera snapshot when a print completes successfully.
  Optionally enables a light for better photo quality and supports TTS announcements.
triggers:
  - device_id: 210dfdfa64085e8cf073e50eae757d90
    domain: bambu_lab
    type: event_print_finished
    trigger: device

conditions:
  - condition: state
    entity_id: input_boolean.printer_notifications_enabled
    state: "on"

actions:
  - variables:
      printer_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_printer_name') }}"
      task_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}"
      print_weight: "{{ states('sensor.ntk_ryansoffice_3dprinter_print_weight') }}"
      camera_entity: "camera.ntk_ryansoffice_3dprinter_camera"
      snapshot_light: "{{ states('input_text.printer_snapshot_light') }}"
      notification_service: "{{ states('input_text.printer_notification_service') }}"
      success_message_template: "{{ states('input_text.printer_success_message') }}"

  # Turn on snapshot light if configured
  - if:
      - condition: template
        value_template: "{{ snapshot_light != '' and snapshot_light != 'unavailable' }}"
    then:
      - action: light.turn_on
        target:
          entity_id: "{{ snapshot_light }}"
        data:
          brightness_pct: "{{ states('input_number.printer_snapshot_light_brightness') | int }}"
      
      # Wait for light to reach full brightness
      - delay:
          seconds: 1

  # Capture camera snapshot
  - action: camera.snapshot
    target:
      entity_id: "{{ camera_entity }}"
    data:
      filename: "/config/www/printer_snapshots/{{ now().strftime('%Y%m%d_%H%M%S') }}_{{ task_name | replace(' ', '_') }}.jpg"

  # Restore light state if it was turned on
  - if:
      - condition: template
        value_template: "{{ snapshot_light != '' and snapshot_light != 'unavailable' }}"
    then:
      - delay:
          seconds: 1
      - action: light.turn_off
        target:
          entity_id: "{{ snapshot_light }}"

  # Build notification message with template support
  - variables:
      notification_message: >
        {% set msg = success_message_template %}
        {% set msg = msg | replace('{{printer_name}}', printer_name) %}
        {% set msg = msg | replace('{{task_name}}', task_name) %}
        {% set msg = msg | replace('{{print_weight}}', print_weight) %}
        {{ msg }}

  # Send mobile notification with snapshot
  - action: "{{ notification_service }}"
    data:
      title: "Print Complete ✓"
      message: "{{ notification_message }}"
      data:
        image: "/local/printer_snapshots/{{ now().strftime('%Y%m%d_%H%M%S') }}_{{ task_name | replace(' ', '_') }}.jpg"
        push:
          interruption-level: "{{ 'critical' if is_state('input_boolean.printer_critical_notifications', 'on') else 'active' }}"
        actions:
          - action: "URI"
            title: "View Printer"
            uri: "/lovelace/3d-printing"

  # Log completion
  - action: logbook.log
    data:
      name: Print Notification
      message: "Sent completion notification for {{ task_name }}. Weight: {{ print_weight }}g"

  # TTS announcement if enabled and not in quiet hours
  - if:
      - condition: state
        entity_id: input_boolean.printer_tts_enabled
        state: "on"
      - condition: template
        value_template: >
          {% set now_time = now().time() %}
          {% set quiet_start = state_attr('input_datetime.printer_quiet_hours_start', 'timestamp') | int %}
          {% set quiet_end = state_attr('input_datetime.printer_quiet_hours_end', 'timestamp') | int %}
          {% set current_seconds = now_time.hour * 3600 + now_time.minute * 60 + now_time.second %}
          {% if quiet_start < quiet_end %}
            {{ current_seconds < quiet_start or current_seconds > quiet_end }}
          {% else %}
            {{ current_seconds < quiet_start and current_seconds > quiet_end }}
          {% endif %}
      - condition: template
        value_template: "{{ states('input_text.printer_tts_media_player') != '' }}"
    then:
      - action: tts.speak
        target:
          entity_id: "{{ states('input_text.printer_tts_media_player') }}"
        data:
          message: "{{ notification_message }}"
          options:
            volume_level: "{{ states('input_number.printer_tts_volume') | float / 100 }}"

mode: single
