alias: Print Complete - Update Filament Usage (Enhanced)
description: >
  Updates Spoolman with filament usage when print completes.
  Includes fallback to backed-up print_weight attributes if HA restarted during print.
triggers:
  - device_id: 210dfdfa64085e8cf073e50eae757d90
    domain: bambu_lab
    type: event_print_finished
    trigger: device
conditions: []
actions:
  # First, determine if we need to use backup data
  - variables:
      current_print_weight: "{{ states('sensor.ntk_ryansoffice_3dprinter_print_weight') }}"
      backup_available: >
        {{ states('input_text.print_weight_backup') | length > 2 }}
      current_has_attributes: >
        {{ state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 1') is not none
           or state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 2') is not none
           or state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 3') is not none
           or state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 4') is not none
           or state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'External Spool') is not none }}
  
  # Log what data source we're using
  - action: logbook.log
    metadata: {}
    data:
      name: Print Weight Data Source
      message: >
        Print complete for: {{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}.
        Current sensor has attributes: {{ current_has_attributes }}.
        Backup available: {{ backup_available }}.
        Will use {{ 'backup data' if (not current_has_attributes and backup_available) else 'current sensor data' }}.
  
  # Extract attributes from either current sensor or backup
  - variables:
      print_weight_attributes: >
        {% if current_has_attributes %}
          {{ states.sensor.ntk_ryansoffice_3dprinter_print_weight.attributes }}
        {% elif backup_available %}
          {{ states('input_text.print_weight_backup') | from_json }}
        {% else %}
          {}
        {% endif %}
  
  # Validate we have data
  - condition: template
    value_template: "{{ print_weight_attributes | length > 0 }}"
    alias: Ensure we have print weight data
  
  # Extract AMS tray usage into a list
  - variables:
      ams_trays_string: >
        {% set ns = namespace(result='') %}
        {% for key, value in print_weight_attributes.items() %}
          {% if key.startswith('AMS') or key == 'External Spool' %}
            {% set ns.result = ns.result ~ key ~ ':' ~ value ~ ',' %}
          {% endif %}
        {% endfor %}
        {{ ns.result }}
      ams_tray_list: >
        {{ ams_trays_string.rstrip(',').split(',') | list }}
  
  # Log what we found
  - action: logbook.log
    metadata: {}
    data:
      name: Print Weight Processing
      message: >
        Processing {{ ams_tray_list | length }} tray(s) for filament usage update.
        Data source: {{ 'Backup' if (not current_has_attributes and backup_available) else 'Current' }}.
  
  # Process each tray that was used
  - repeat:
      sequence:
        - variables:
            tray_info: "{{ repeat.item.strip() }}"
            tray_name: "{{ tray_info.split(':')[0].strip() }}"
            tray_print_weight: "{{ tray_info.split(':')[1] | int }}"
        
        # Skip if weight is 0 or tray_name is empty
        - condition: template
          value_template: "{{ tray_print_weight > 0 and tray_name | length > 0 }}"
        
        # Determine tray entity ID
        - variables:
            tray_number: >
              {% if 'External Spool' in tray_name %}
                external
              {% else %}
                {{ tray_name.split(' ')[3] }}
              {% endif %}
            tray_entity_id: >
              {% if tray_number == 'external' %}
                sensor.ntk_ryansoffice_3dprinter_external_spool
              {% else %}
                sensor.p1s_01p00c460102350_ams_1_tray_{{ tray_number }}
              {% endif %}
        
        # Get tray details
        - variables:
            selected_tray:
              uuid: "{{ state_attr(tray_entity_id, 'tray_uuid') }}"
              type: "{{ state_attr(tray_entity_id, 'type') }}"
              color: "{{ state_attr(tray_entity_id, 'color') | replace('#', '') }}"
        
        # Find matching spool in Spoolman
        - action: script.find_matching_spool_in_spoolman
          metadata: {}
          data:
            parameters:
              target_color_hex: "{{ selected_tray.color }}"
              target_type: "{{ selected_tray.type }}"
              target_uuid: "{{ selected_tray.uuid }}"
          response_variable: find_spool_response
        
        # Update Spoolman if spool was found
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ find_spool_response.success == true }}"
                  alias: Spool found
              sequence:
                - action: spoolman.use_spool_filament
                  metadata: {}
                  data:
                    id: "{{ find_spool_response.spool.id }}"
                    use_weight: "{{ tray_print_weight }}"
                
                - action: logbook.log
                  metadata: {}
                  data:
                    name: Spoolman {{ tray_name }}
                    message: >
                      Print Job complete - {{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}.
                      Updated Filament Usage for {{ tray_name }}.
                      Spool ID {{ find_spool_response.spool.id }} ({{ find_spool_response.spool.filament.name }}).
                      Used {{ tray_print_weight }} grams.
                
                - action: persistent_notification.create
                  metadata: {}
                  data:
                    title: >
                      Print Job {{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }} Finished
                    message: >
                      Print Job complete - **{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}**
                      
                      Updated Filament Usage for {{ tray_name }}.
                      Spool ID {{ find_spool_response.spool.id }} ({{ find_spool_response.spool.filament.name }}).
                      
                      Used {{ tray_print_weight }} grams.
          default:
            - action: persistent_notification.create
              metadata: {}
              data:
                title: "Spoolman Update Error: Cannot Find Spool"
                message: >
                  Cannot update Spoolman with print weight usage information
                  for {{ tray_name }} due to issue finding the correct spool.
                  Error message: "{{ find_spool_response.Message }}"
            
            - action: system_log
              data:
                message: >
                  Spoolman spool not found for {{ tray_name }}.
                  UUID: {{ selected_tray.uuid }}, Type: {{ selected_tray.type }}, Color: {{ selected_tray.color }}.
                  Weight would have been: {{ tray_print_weight }}g.
                level: warning
      
      for_each: "{{ ams_tray_list }}"
  
  # Clear the backup after successful processing
  - action: input_text.set_value
    target:
      entity_id: input_text.print_weight_backup
    data:
      value: ""
  
  - action: input_text.set_value
    target:
      entity_id: input_text.print_metadata_backup
    data:
      value: ""
  
  - action: logbook.log
    metadata: {}
    data:
      name: Print Weight Backup Cleared
      message: Print weight backup cleared after successful processing.

mode: single
