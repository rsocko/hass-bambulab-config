sequence:
  # Parse the last error details
  - variables:
      error_parts: "{{ states('input_text.spoolman_sync_last_error').split('|') }}"
      has_error: "{{ error_parts | length >= 7 }}"
      
  # Check if there's an error to process
  - if:
      - condition: template
        value_template: "{{ not has_error }}"
    then:
      - action: persistent_notification.create
        data:
          title: No Error to Process
          message: >-
            No spoolman sync error found in storage. The error log may be empty
            or already cleared.
      - stop: No error data available
        
  # Extract error details
  - variables:
      error_timestamp: "{{ error_parts[0] }}"
      tray_name: "{{ error_parts[1] }}"
      error_message: "{{ error_parts[2] }}"
      print_weight: "{{ error_parts[3] | int }}"
      tray_uuid: "{{ error_parts[4] }}"
      tray_color: "{{ error_parts[5] }}"
      tray_type: "{{ error_parts[6] }}"
      spool_id: "{{ spool_id | default(0) }}"
      
  # Validate spool ID was provided
  - if:
      - condition: template
        value_template: "{{ spool_id == 0 or spool_id is none }}"
    then:
      - action: persistent_notification.create
        data:
          title: Manual Recovery - Spool ID Required
          message: >-
            **Error from:** {{ error_timestamp }}
            
            **Tray:** {{ tray_name }}
            
            **Weight to deduct:** {{ print_weight }}g
            
            **Original error:** {{ error_message }}
            
            
            **Tray details:**
            
            - UUID: `{{ tray_uuid }}`
            
            - Color: `{{ tray_color }}`
            
            - Type: `{{ tray_type }}`
            
            
            Please manually find the matching spool in Spoolman and provide its ID
            to this script using the "spool_id" parameter.
      - stop: Spool ID required
        
  # Attempt to update the spool
  - action: spoolman.use_spool_filament
    data:
      id: "{{ spool_id }}"
      use_weight: "{{ print_weight }}"
      
  # Log success
  - action: logbook.log
    data:
      name: Spoolman Manual Recovery
      message: >-
        Successfully applied manual recovery. Reduced spool {{ spool_id }}
        by {{ print_weight }}g for {{ tray_name }} from error at {{ error_timestamp }}.
        
  # Clear the error flag if this was the last error
  - action: input_boolean.turn_off
    data:
      entity_id: input_boolean.spoolman_sync_error_active
      
  # Success notification
  - action: persistent_notification.create
    data:
      notification_id: spoolman_manual_recovery_success
      title: Manual Recovery Successful
      message: >-
        Successfully updated spool {{ spool_id }} with {{ print_weight }}g usage
        from {{ tray_name }}.
        
        Original error from {{ error_timestamp }} has been resolved.

alias: Manual Spoolman Recovery
description: >-
  Manually apply a stored spoolman sync error to update filament usage.
  Requires the spool_id parameter to identify which spool to update.
fields:
  spool_id:
    selector:
      number:
        min: 1
        max: 10000
        mode: box
    name: Spool ID
    description: The Spoolman spool ID to update with the stored print weight
    required: true
icon: mdi:tools
