# Print Weight Persistence Configuration
# This file contains input helpers AND a template sensor to store
# print_weight sensor attributes across Home Assistant restarts.
#
# ── Recommended installation ────────────────────────────────────────────────
# 1. Copy this file to:
#      /config/packages/bambulab/print_weight_persistence.yaml
#
# 2. Add the following to your configuration.yaml
#    (create the homeassistant.packages block if it does not already exist):
#
#      homeassistant:
#        packages:
#          bambulab_print_weight: !include packages/bambulab/print_weight_persistence.yaml
#
# 3. Restart Home Assistant (or reload the configuration).
#
# NOTE: Do NOT use `input_text: !include ...` or `template: !include ...`
# separately — this file contains both `input_text:` and `template:` top-level
# keys and must be loaded as a package so Home Assistant can merge all sections
# correctly.
# ────────────────────────────────────────────────────────────────────────────

# Input text helper to store print weight attributes JSON
# Note: max 255 is the HA hard limit for input_text.
# With a single AMS (4 trays), the JSON is ~100 chars — well within 255.
# For multi-AMS setups (2+ AMS units), consider using a trigger-based
# template sensor instead (see print_job_tracking_helpers.yaml for examples).
input_text:
  print_weight_backup:
    name: "Print Weight Backup"
    max: 255
    icon: mdi:weight

  print_metadata_backup:
    name: "Print Metadata Backup"
    max: 255
    icon: mdi:information

# Template sensor to make stored data easily accessible
template:
  - sensor:
      - name: "Print Weight Data Status"
        unique_id: print_weight_data_status
        state: >
          {% if states('input_text.print_weight_backup') | length > 0 %}
            stored
          {% else %}
            empty
          {% endif %}
        attributes:
          last_stored_at: >
            {{ state_attr('input_text.print_metadata_backup', 'last_update') }}
          task_name: >
            {% set metadata = states('input_text.print_metadata_backup') %}
            {% if metadata and metadata != 'unknown' %}
              {{ metadata.split('|')[0] if '|' in metadata else '' }}
            {% else %}
              unavailable
            {% endif %}
          print_start_time: >
            {% set metadata = states('input_text.print_metadata_backup') %}
            {% if metadata and metadata != 'unknown' %}
              {{ metadata.split('|')[1] if '|' in metadata and metadata.count('|') >= 1 else '' }}
            {% else %}
              unavailable
            {% endif %}
          total_weight: >
            {% set metadata = states('input_text.print_metadata_backup') %}
            {% if metadata and metadata != 'unknown' %}
              {{ metadata.split('|')[2] if '|' in metadata and metadata.count('|') >= 2 else '' }}
            {% else %}
              unavailable
            {% endif %}
