# Helpers for calculating the cost of the current print.
# The default price is applied when a spool has no price set in Spoolman
# (neither on the spool itself nor on the filament type).
#
# To use: add these helpers via the Home Assistant UI (Settings → Devices &
# Services → Helpers) or by including this file in your configuration.yaml:
#
#   homeassistant:
#     packages:
#       print_cost: !include spoolman-sync/print_cost_helpers.yaml

input_number:
  print_cost_default_per_kg:
    name: Default Filament Cost (per kg)
    min: 0
    max: 500
    step: 0.50
    initial: 20.00
    unit_of_measurement: "$"
    icon: mdi:currency-usd
    mode: box
