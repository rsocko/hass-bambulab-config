# Input helpers for tracking print job data and spoolman sync errors.
# These helpers provide persistent storage for print data and error information,
# allowing manual recovery when spoolman sync automation fails.
#
# ── Recommended installation ────────────────────────────────────────────────
# 1. Copy this file to:
#      /config/packages/bambulab/print_job_tracking_helpers.yaml
#
# 2. Add the following to your configuration.yaml
#    (create the homeassistant.packages block if it does not already exist):
#
#      homeassistant:
#        packages:
#          bambulab_print_job_tracking: !include packages/bambulab/print_job_tracking_helpers.yaml
#
# 3. Restart Home Assistant (or reload the configuration).
#
# NOTE: Do NOT use separate `input_text: !include ...`, `input_boolean: !include ...`,
# etc. entries — this file contains multiple top-level keys and must be loaded as
# a package so Home Assistant can merge all sections correctly.
# ────────────────────────────────────────────────────────────────────────────

input_text:
  # Stores the current/last print job information
  # Format: "task_name|start_time|total_weight"
  print_job_current:
    name: Current Print Job Info
    max: 255
    initial: ""
    icon: mdi:printer-3d

  # Stores AMS tray configuration at print start as JSON
  # This allows manual recovery if spool lookup fails after print completes
  # Format: JSON array with tray data: [{"tray": 1, "uuid": "...", "color": "...", "type": "...", "name": "..."}]
  print_job_ams_trays:
    name: Print Job AMS Tray Data
    max: 1000
    initial: "[]"
    icon: mdi:file-cabinet

  # Stores the last spoolman sync error details
  # Format: "timestamp|tray_name|error_message|print_weight|tray_uuid|tray_color|tray_type"
  spoolman_sync_last_error:
    name: Last Spoolman Sync Error
    max: 500
    initial: ""
    icon: mdi:alert-circle

  # Stores a log of recent sync errors (up to ~10 entries)
  # Each entry on a new line: "timestamp|tray|error|weight|uuid"
  # This provides a short history for troubleshooting recurring issues
  spoolman_sync_error_log:
    name: Spoolman Sync Error Log
    max: 2000
    initial: ""
    icon: mdi:text-box-multiple

input_boolean:
  # Flag indicating if there's an unresolved spoolman sync error
  # Can be used to display warnings on dashboard or trigger reminders
  spoolman_sync_error_active:
    name: Spoolman Sync Error Active
    initial: false
    icon: mdi:alert

input_datetime:
  # Timestamp of the last spoolman sync error
  spoolman_sync_last_error_time:
    name: Last Sync Error Time
    has_date: true
    has_time: true
    icon: mdi:clock-alert
