<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <title>xtouch 2.8" Temperature Screen (Numpad Edit Mode)</title>
  <desc>Reconstructed from LVGL source: ui_comp_temperaturecomponent.c - Sidebar hidden, nozzle selected (green border), numpad keyboard visible</desc>

  <!-- Screen background -->
  <rect width="640" height="480" fill="#000000"/>

  <!-- NO SIDEBAR - hidden when numpad is active -->

  <!-- ==================== CONTENT AREA (full 320px * 2 = 640px) ==================== -->
  <rect x="0" y="0" width="640" height="480" fill="#444444"/>

  <!-- Layout: Temps panel (flex-grow:3) + Keyboard (flex-grow:7) -->
  <!-- Total 10 parts. Temps = 3/10 * (640-16) ~= 187px. Keyboard = 7/10 * (640-16) ~= 437px -->

  <!-- ==================== TEMPS PANEL (left, narrower) ==================== -->

  <!-- Nozzle Temperature Panel (SELECTED - green border) -->
  <rect x="8" y="8" width="180" height="226" rx="4" fill="#555555" stroke="#2AFF00" stroke-width="4"/>
  <!-- Nozzle icon -->
  <text x="98" y="55" text-anchor="middle" fill="#FF682A" font-family="Arial, sans-serif" font-size="36">🔥</text>
  <!-- Current nozzle temp -->
  <text x="98" y="115" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="44" font-weight="bold">220</text>
  <!-- Input field (being edited - shows cursor) -->
  <rect x="20" y="140" width="156" height="46" rx="2" fill="transparent" stroke="#2AFF00" stroke-width="1"/>
  <text x="98" y="172" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="40" font-weight="bold">22_</text>

  <!-- Bed Temperature Panel (DISABLED - dimmed) -->
  <rect x="8" y="242" width="180" height="230" rx="4" fill="#555555" opacity="0.5"/>
  <!-- Bed icon (dimmed) -->
  <text x="98" y="302" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="36">🛏</text>
  <!-- Bed temp (dimmed) -->
  <text x="98" y="370" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="44" font-weight="bold">60</text>
  <!-- Target placeholder -->
  <text x="98" y="420" text-anchor="middle" fill="#555555" font-family="Arial, sans-serif" font-size="36" font-weight="bold">60</text>

  <!-- ==================== NUMPAD KEYBOARD (right, larger) ==================== -->
  <!-- Keyboard: flex-row-wrap, flex-grow:7, 4 rows x 3 columns -->
  <!-- Available: x=196, width=436, height=480 -->
  <!-- Each key: flex-grow:1, so 3 per row. Key size ~= (436-8pad-8gap*2)/3 = ~137px wide -->
  <!-- 4 rows: (480-8pad-12gap)/4 = ~112px tall -->

  <!-- Row 1: 1, 2, 3 -->
  <rect x="200" y="8" width="137" height="108" rx="12" fill="#555555"/>
  <text x="268" y="78" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">1</text>

  <rect x="345" y="8" width="137" height="108" rx="12" fill="#555555"/>
  <text x="413" y="78" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">2</text>

  <rect x="490" y="8" width="137" height="108" rx="12" fill="#555555"/>
  <text x="558" y="78" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">3</text>

  <!-- Row 2: 4, 5, 6 -->
  <rect x="200" y="124" width="137" height="108" rx="12" fill="#555555"/>
  <text x="268" y="194" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">4</text>

  <rect x="345" y="124" width="137" height="108" rx="12" fill="#555555"/>
  <text x="413" y="194" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">5</text>

  <rect x="490" y="124" width="137" height="108" rx="12" fill="#555555"/>
  <text x="558" y="194" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">6</text>

  <!-- Row 3: 7, 8, 9 -->
  <rect x="200" y="240" width="137" height="108" rx="12" fill="#555555"/>
  <text x="268" y="310" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">7</text>

  <rect x="345" y="240" width="137" height="108" rx="12" fill="#555555"/>
  <text x="413" y="310" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">8</text>

  <rect x="490" y="240" width="137" height="108" rx="12" fill="#555555"/>
  <text x="558" y="310" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">9</text>

  <!-- Row 4: 0, Back (✕), OK (↵) -->
  <rect x="200" y="356" width="137" height="108" rx="12" fill="#555555"/>
  <text x="268" y="426" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">0</text>

  <rect x="345" y="356" width="137" height="108" rx="12" fill="#555555"/>
  <text x="413" y="426" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">⌫</text>

  <rect x="490" y="356" width="137" height="108" rx="12" fill="#555555"/>
  <text x="558" y="426" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">↵</text>

  <!-- ==================== ANNOTATIONS ==================== -->
  <text x="320" y="476" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="11">xtouch 2.8" — Temperature Numpad (sidebar hidden, editing nozzle target)</text>
</svg>