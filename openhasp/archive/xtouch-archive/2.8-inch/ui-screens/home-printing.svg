<?xml version="1.0" encoding="UTF-8"?>
<!--
  xTouch 2.8" Home Screen - Printing State
  Reconstructed from LVGL source code: ui_comp_homecomponent.c, ui_comp_sidebarcomponent.c
  Display: ILI9341 320x240 (landscape), ESP32-2432S028R
  Source: https://github.com/xperiments-in/xtouch
  Scale: 2x (640x480 rendered)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <style>
      .sidebar-bg { fill: #222222; }
      .content-bg { fill: #444444; }
      .panel-bg { fill: #555555; }
      .accent { fill: #2AFF00; }
      .text-white { fill: #FFFFFF; font-family: 'Segoe UI', Arial, sans-serif; }
      .text-grey { fill: #CCCCCC; font-family: 'Segoe UI', Arial, sans-serif; }
      .text-accent { fill: #2AFF00; font-family: 'Segoe UI', Arial, sans-serif; }
      .text-dim { fill: #888888; font-family: 'Segoe UI', Arial, sans-serif; }
      .icon { font-family: 'Segoe UI Symbol', 'Apple Color Emoji', sans-serif; }
      .btn-border { stroke: #888888; stroke-width: 2; fill: none; }
      .light-border-active { stroke: #2AFF00; stroke-width: 6; fill: none; }
      .progress-bg { fill: #444444; }
      .progress-fill { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Screen Background -->
  <rect width="640" height="480" fill="#000000"/>

  <!-- ==================== SIDEBAR (48px wide = 96px at 2x) ==================== -->
  <rect x="0" y="0" width="96" height="480" class="sidebar-bg"/>

  <!-- Sidebar Button: Home (active) -->
  <g transform="translate(48, 48)">
    <text text-anchor="middle" dominant-baseline="central" font-size="40" class="text-accent icon">⌂</text>
  </g>

  <!-- Sidebar Button: Temperature -->
  <g transform="translate(48, 144)">
    <text text-anchor="middle" dominant-baseline="central" font-size="40" class="text-white icon">🌡</text>
  </g>

  <!-- Sidebar Button: Control -->
  <g transform="translate(48, 240)">
    <text text-anchor="middle" dominant-baseline="central" font-size="36" class="text-white icon">✛</text>
  </g>

  <!-- Sidebar Button: Filament/Nozzle -->
  <g transform="translate(48, 336)">
    <text text-anchor="middle" dominant-baseline="central" font-size="36" class="text-white icon">▽</text>
  </g>

  <!-- Sidebar Button: Settings -->
  <g transform="translate(48, 432)">
    <text text-anchor="middle" dominant-baseline="central" font-size="36" class="text-white icon">⚙</text>
  </g>

  <!-- Sidebar divider line (subtle) -->
  <line x1="96" y1="0" x2="96" y2="480" stroke="#333333" stroke-width="1"/>

  <!-- ==================== HOME CONTENT AREA ==================== -->
  <!-- Main container: 272px = 544px at 2x, starting at x=96 -->
  <!-- Split into Left (200px=400px) and Right (72px=144px) -->

  <!-- LEFT COLUMN background -->
  <rect x="96" y="0" width="400" height="480" class="content-bg"/>

  <!-- RIGHT COLUMN background -->
  <rect x="496" y="0" width="144" height="480" class="content-bg"/>

  <!-- ===== LEFT COLUMN ===== -->

  <!-- Status Bar (28px = 56px at 2x) -->
  <rect x="104" y="8" width="384" height="56" rx="0" class="panel-bg"/>

  <!-- WiFi Icon -->
  <text x="128" y="40" font-size="22" class="text-accent icon">📶</text>

  <!-- Camera Icon -->
  <text x="162" y="41" font-size="20" class="text-accent icon">📷</text>

  <!-- AMS Color Slots (4 small colored rectangles) -->
  <rect x="280" y="20" width="24" height="30" rx="4" fill="#FFFFFF"/>
  <rect x="308" y="20" width="24" height="30" rx="4" fill="#FF0000"/>
  <rect x="336" y="20" width="24" height="30" rx="4" fill="#00FF00"/>
  <rect x="364" y="20" width="24" height="30" rx="4" fill="#0000FF"/>

  <!-- ===== PLAYER SECTION (visible during printing) ===== -->
  <rect x="104" y="70" width="384" height="280" rx="0" class="panel-bg"/>

  <!-- Player Controller Row: Nozzle Icon + Play/Pause + Stop -->
  <!-- Nozzle printing indicator icon -->
  <text x="120" y="115" font-size="32" class="text-white icon">◉</text>

  <!-- Play/Pause Button -->
  <rect x="168" y="86" width="148" height="50" rx="8" class="btn-border"/>
  <text x="242" y="116" text-anchor="middle" font-size="28" class="text-white">⏸</text>

  <!-- Stop Button -->
  <rect x="324" y="86" width="148" height="50" rx="8" class="btn-border"/>
  <text x="398" y="116" text-anchor="middle" font-size="28" class="text-white">⏹</text>

  <!-- Progress Bar -->
  <rect x="120" y="154" width="352" height="28" rx="4" class="progress-bg"/>
  <rect x="120" y="154" width="211" height="28" rx="4" class="progress-fill"/>
  <!-- 60% fill -->

  <!-- Time Left Row -->
  <text x="120" y="210" font-size="20" class="text-white icon">🕐</text>
  <text x="146" y="210" font-size="22" class="text-white">60% -- 1h 23m</text>

  <!-- Layer Row -->
  <text x="120" y="244" font-size="20" class="text-white icon">☰</text>
  <text x="146" y="244" font-size="22" class="text-white">100/255</text>

  <!-- ===== SPEED SECTION ===== -->
  <rect x="104" y="356" width="384" height="56" rx="0" class="panel-bg"/>

  <!-- Speed icon -->
  <text x="128" y="390" font-size="22" class="text-white icon">⚡</text>

  <!-- Speed Dropdown -->
  <rect x="162" y="364" width="300" height="40" rx="4" fill="#444444"/>
  <text x="180" y="390" font-size="22" class="text-white">Standard</text>
  <text x="434" y="390" font-size="18" class="text-white">▾</text>

  <!-- ===== RIGHT COLUMN ===== -->

  <!-- Light Button (top of right column) -->
  <rect x="504" y="8" width="128" height="80" rx="0" class="panel-bg"/>
  <rect x="504" y="8" width="128" height="80" rx="0" class="light-border-active"/>
  <text x="568" y="56" text-anchor="middle" font-size="36" class="text-accent icon">💡</text>

  <!-- Temperature Section -->
  <rect x="504" y="96" width="128" height="376" rx="0" class="panel-bg"/>

  <!-- Nozzle Temp -->
  <g transform="translate(568, 152)">
    <text text-anchor="middle" y="-20" font-size="22" class="text-grey icon">🔥</text>
    <text text-anchor="middle" y="0" font-size="16" class="text-grey">NOZZLE</text>
    <text text-anchor="middle" y="34" font-size="40" font-weight="bold" class="text-white" font-family="'Segoe UI', Arial, sans-serif">220</text>
  </g>

  <!-- Bed Temp -->
  <g transform="translate(568, 280)">
    <text text-anchor="middle" y="-20" font-size="22" class="text-grey icon">▦</text>
    <text text-anchor="middle" y="0" font-size="16" class="text-grey">BED</text>
    <text text-anchor="middle" y="34" font-size="40" font-weight="bold" class="text-white" font-family="'Segoe UI', Arial, sans-serif">60</text>
  </g>

  <!-- Chamber Temp -->
  <g transform="translate(568, 408)">
    <text text-anchor="middle" y="-20" font-size="22" class="text-grey icon">☐</text>
    <text text-anchor="middle" y="0" font-size="16" class="text-grey">CHAMBER</text>
    <text text-anchor="middle" y="34" font-size="40" font-weight="bold" class="text-white" font-family="'Segoe UI', Arial, sans-serif">38</text>
  </g>

  <!-- Screen outline -->
  <rect x="0" y="0" width="640" height="480" fill="none" stroke="#333333" stroke-width="2"/>

  <!-- Label -->
  <text x="320" y="472" text-anchor="middle" font-size="11" fill="#555555" font-family="monospace">xTouch 2.8" — Home Screen (Printing) — 320×240 @ 2x</text>
</svg>
