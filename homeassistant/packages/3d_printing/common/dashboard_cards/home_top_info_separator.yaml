# Docs: docs/features/printer_dashboards/README.md
# Home view top info separator with inline system chips and Bambu Lab logo.
# CRITICAL FIX: Removed config-template-card wrapper (was causing re-evaluation on every state change for 18+ entities)

type: custom:bubble-card
card_type: separator
entity: sensor.3d_printer_name_display
name: '3D Printer'
icon: mdi:printer-3d
sub_button:
  - entity: input_boolean.screenshot_mode
    sub_button_type: default
    name: Screenshot Mode
    icon: mdi:eye-off
    show_name: false
    show_state: true
    show_icon: true
    show_background: true
    state_background: false
    state_color: false
    fill_width: false
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: none
  - entity: sensor.3d_printer_ip_address_display
    sub_button_type: default
    name: IP Address
    icon: mdi:ip-network
    show_name: false
    show_state: true
    show_icon: true
    show_background: true
    state_background: false
    state_color: false
    fill_width: false
    tap_action:
      action: more-info
  - entity: sensor.ntk_ryansoffice_3dprinter_mqtt_connection_mode
    sub_button_type: default
    name: MQTT Mode
    icon: mdi:connection
    show_name: true
    show_state: true
    show_icon: true
    show_background: true
    state_background: false
    state_color: false
    fill_width: false
    tap_action:
      action: more-info
  - entity: sensor.3d_printer_sd_card_status
    sub_button_type: default
    name: SD Card Status
    icon: mdi:sd
    show_name: true
    show_state: true
    show_icon: true
    show_background: true
    state_background: false
    state_color: false
    fill_width: false
    tap_action:
      action: more-info
  - entity: sensor.3d_printer_serial_number_display
    sub_button_type: default
    name: Serial Number
    icon: mdi:barcode
    show_name: true
    show_state: true
    show_icon: true
    show_background: true
    state_background: false
    state_color: false
    fill_width: false
    tap_action:
      action: more-info
  - entity: sensor.ntk_ryansoffice_3dprinter_total_usage
    sub_button_type: default
    name: Total Usage
    icon: mdi:timer
    show_name: true
    show_state: true
    show_icon: true
    show_background: true
    state_background: false
    state_color: false
    fill_width: false
    tap_action:
      action: more-info
  - entity: sensor.ntk_ryansoffice_3dprinter_wifi_signal
    sub_button_type: default
    name: Wi-Fi Signal
    icon: mdi:wifi
    show_name: true
    show_state: true
    show_icon: true
    show_background: true
    state_background: false
    state_color: false
    fill_width: false
    tap_action:
      action: more-info
  - entity: binary_sensor.ntk_ryansoffice_3dprinter_recording_timelapse
    sub_button_type: default
    name: Timelapse
    icon: mdi:video
    show_name: true
    show_state: true
    show_icon: true
    show_background: true
    state_background: false
    state_color: false
    fill_width: false
    tap_action:
      action: more-info