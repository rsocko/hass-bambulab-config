# Docs: docs/features/printer_dashboards/README.md
# Home view top info separator with inline system chips and Bambu Lab logo.

type: custom:config-template-card
entities:
  - input_boolean.screenshot_mode
  - sensor.3d_printer_name_display
  - sensor.3d_printer_ip_address_display
  - sensor.ntk_ryansoffice_3dprinter_mqtt_connection_mode
  - sensor.3d_printer_sd_card_status
  - sensor.3d_printer_serial_number_display
  - sensor.ntk_ryansoffice_3dprinter_total_usage
  - sensor.ntk_ryansoffice_3dprinter_wifi_signal
  - binary_sensor.ntk_ryansoffice_3dprinter_recording_timelapse
card:
  type: custom:bubble-card
  card_type: separator
  entity: sensor.3d_printer_name_display
  name: >-
    ${states['sensor.3d_printer_name_display']?.state || '3D Printer'}
  icon: mdi:printer-3d
  sub_button:
    - entity: input_boolean.screenshot_mode
      sub_button_type: default
      name: Screenshot Mode
      icon: mdi:eye-off
      show_name: false
      show_state: true
      show_icon: true
      show_background: true
      fill_width: false
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      double_tap_action:
        action: none
    - entity: sensor.3d_printer_ip_address_display
      sub_button_type: default
      name: IP Address
      icon: mdi:ip-network
      show_name: false
      show_state: true
      show_icon: true
      show_background: true
      fill_width: false
      tap_action:
        action: more-info
    - entity: sensor.ntk_ryansoffice_3dprinter_mqtt_connection_mode
      sub_button_type: default
      name: MQTT Mode
      icon: mdi:connection
      show_name: true
      show_state: true
      show_icon: true
      show_background: true
      fill_width: false
      tap_action:
        action: more-info
    - entity: sensor.3d_printer_sd_card_status
      sub_button_type: default
      name: SD Card Status
      icon: mdi:sd
      show_name: true
      show_state: true
      show_icon: true
      show_background: true
      fill_width: false
      tap_action:
        action: more-info
    - entity: sensor.3d_printer_serial_number_display
      sub_button_type: default
      name: Serial Number
      icon: mdi:barcode
      show_name: true
      show_state: true
      show_icon: true
      show_background: true
      fill_width: false
      tap_action:
        action: more-info
    - entity: sensor.ntk_ryansoffice_3dprinter_total_usage
      sub_button_type: default
      name: Total Usage
      icon: mdi:timer
      show_name: true
      show_state: true
      show_icon: true
      show_background: true
      fill_width: false
      tap_action:
        action: more-info
    - entity: sensor.ntk_ryansoffice_3dprinter_wifi_signal
      sub_button_type: default
      name: Wi-Fi Signal
      icon: mdi:wifi
      show_name: true
      show_state: true
      show_icon: true
      show_background: true
      fill_width: false
      tap_action:
        action: more-info
    - entity: binary_sensor.ntk_ryansoffice_3dprinter_recording_timelapse
      sub_button_type: default
      name: Timelapse
      icon: mdi:video
      show_name: true
      show_state: true
      show_icon: true
      show_background: true
      fill_width: false
      tap_action:
        action: more-info
  styles: >-
    ${(() => {
      return `
        .bubble-container {
          align-items: center !important;
        }
        .bubble-icon {
          opacity: 0 !important;
          width: 0 !important;
          min-width: 0 !important;
          height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        .bubble-name {
          display: inline-flex !important;
          align-items: center !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
          line-height: 1.2 !important;
          font-size: 15px !important;
          font-weight: 700 !important;
          min-height: 34px !important;
          padding-left: 118px !important;
          background: left center / 108px 34px no-repeat url('/local/3d_printing/common/trace%20(14).svg') !important;
        }
        .bubble-line {
          opacity: 0.75;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 6px !important;
        }
        .bubble-sub-button {
          min-height: 30px !important;
        }
        .bubble-sub-button-state,
        .bubble-sub-button-name {
          white-space: nowrap !important;
        }
      `;
    })()}