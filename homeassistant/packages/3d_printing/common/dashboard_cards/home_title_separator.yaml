# Docs: docs/features/printer_dashboards/README.md
# Home view separator header with inline printer detail chips and Bambu Lab logo.

type: custom:config-template-card
entities:
  - sensor.ntk_ryansoffice_3dprinter_task_name
  - sensor.3d_printer_printable_objects
  - sensor.3d_printer_skipped_objects
  - sensor.ntk_ryansoffice_3dprinter_nozzle_size
  - sensor.ntk_ryansoffice_3dprinter_nozzle_type
  - sensor.ntk_ryansoffice_3dprinter_print_bed_type
  - sensor.ntk_ryansoffice_3dprinter_print_type
card:
  type: custom:bubble-card
  card_type: separator
  entity: sensor.ntk_ryansoffice_3dprinter_task_name
  name: >-
    ${(() => {
      const taskName = states['sensor.ntk_ryansoffice_3dprinter_task_name']?.state || '';
      return ['unknown', 'unavailable', ''].includes(taskName) ? 'No Active Print' : taskName;
    })()}
  icon: mdi:printer-3d
  sub_button:
    - entity: sensor.ntk_ryansoffice_3dprinter_task_name
      sub_button_type: default
      name: >-
        ${(() => {
          const plate = parseInt(states['sensor.ntk_ryansoffice_3dprinter_task_name']?.attributes?.plate_num, 10);
          return Number.isFinite(plate) && plate > 0 ? `Plate ${plate}` : 'No plate';
        })()}
      icon: mdi:layers-outline
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: more-info
      visibility:
        - condition: numeric_state
          entity: sensor.ntk_ryansoffice_3dprinter_task_name
          attribute: plate_num
          above: 0
    - entity: sensor.3d_printer_printable_objects
      sub_button_type: default
      name: >-
        ${`${states['sensor.3d_printer_printable_objects']?.state || '0'} objects`}
      icon: mdi:shape-outline
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
      visibility:
        - condition: numeric_state
          entity: sensor.3d_printer_printable_objects
          above: 1
    - entity: sensor.3d_printer_skipped_objects
      sub_button_type: default
      name: >-
        ${`${states['sensor.3d_printer_skipped_objects']?.state || '0'} skipped`}
      icon: mdi:close-circle-outline
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      state_background: true
      state_color: true
      fill_width: false
      tap_action:
        action: none
      styles: '.bubble-sub-button-3 { background: rgba(255, 152, 0, 0.18) !important; color: #f57c00 !important; } .bubble-sub-button-3 ha-icon { color: #f57c00 !important; }'
      visibility:
        - condition: numeric_state
          entity: sensor.3d_printer_skipped_objects
          above: 0
    - entity: sensor.ntk_ryansoffice_3dprinter_nozzle_size
      sub_button_type: default
      name: >-
        ${(() => {
          const nozzleSizeRaw = states['sensor.ntk_ryansoffice_3dprinter_nozzle_size']?.state;
          const nozzleType = states['sensor.ntk_ryansoffice_3dprinter_nozzle_type']?.state;
          const valid = (value) => value !== null && value !== undefined && value !== '' && value !== 'unknown' && value !== 'unavailable';
          if (!valid(nozzleSizeRaw)) return 'Nozzle';
          const nozzleMm = (parseFloat(nozzleSizeRaw) * 25.4).toFixed(1);
          const typeLabel = valid(nozzleType)
            ? ` · ${String(nozzleType).replace(/_/g, ' ').replace(/\b\w/g, (char) => char.toUpperCase())}`
            : '';
          return `${nozzleMm}mm${typeLabel}`;
        })()}
      icon: mdi:printer-3d-nozzle
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
      visibility:
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_nozzle_size
          state_not: unavailable
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_nozzle_size
          state_not: unknown
    - entity: sensor.ntk_ryansoffice_3dprinter_print_bed_type
      sub_button_type: default
      name: >-
        ${(() => {
          const value = states['sensor.ntk_ryansoffice_3dprinter_print_bed_type']?.state || '';
          return String(value).replace(/_/g, ' ').replace(/\b\w/g, (char) => char.toUpperCase());
        })()}
      icon: mdi:table-furniture
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
      visibility:
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_print_bed_type
          state_not: unavailable
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_print_bed_type
          state_not: unknown
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_print_bed_type
          state_not: ""
    - entity: sensor.ntk_ryansoffice_3dprinter_print_type
      sub_button_type: default
      name: >-
        ${String(states['sensor.ntk_ryansoffice_3dprinter_print_type']?.state || '').toUpperCase()}
      icon: mdi:layers-triple-outline
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
      visibility:
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_print_type
          state_not: idle
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_print_type
          state_not: unavailable
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_print_type
          state_not: unknown
        - condition: state
          entity: sensor.ntk_ryansoffice_3dprinter_print_type
          state_not: ""
  styles: >-
    ${(() => {
      const darkMode = typeof hass !== 'undefined'
        ? Boolean(hass?.themes?.darkMode)
        : Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const logoUrl = darkMode
        ? '/local/3d_printing/common/bambu-lab-logo-horizontal-light.svg'
        : '/local/3d_printing/common/bambu-lab-logo-horizontal-dark.svg';
      return `
        .bubble-icon-container {
          width: 108px !important;
          min-width: 108px !important;
          height: 34px !important;
          min-height: 34px !important;
          border-radius: 0 !important;
          background: center / contain no-repeat url('${logoUrl}') !important;
          box-shadow: none !important;
        }
        .bubble-icon {
          opacity: 0 !important;
          width: 0 !important;
          margin: 0 !important;
        }
        .bubble-name {
          white-space: normal !important;
          overflow: visible !important;
          text-overflow: unset !important;
          line-height: 1.3 !important;
          font-size: 13px !important;
          font-weight: 600 !important;
        }
        .bubble-line {
          opacity: 0.75;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 6px !important;
        }
        .bubble-sub-button {
          min-height: 30px !important;
        }
        .bubble-sub-button-name {
          white-space: nowrap !important;
        }
      `;
    })()}