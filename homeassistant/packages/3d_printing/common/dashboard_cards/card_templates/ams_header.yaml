# ams_header.yaml
# Pure button-card template for AMS unit header separators.
# Renders icon, title, separator line, and humidity/temperature pills
# entirely via button-card custom HTML — no nested bubble-card needed.
#
# Humidity color thresholds (Bambu Lab 1-5 rating mapped to percentages):
#   Level 1 - Optimal  (<20%):  Green        mdi:water-outline
#   Level 2 - Good     (20-40%): Light Green  mdi:water-minus
#   Level 3 - Monitor  (40-60%): Amber        mdi:water
#   Level 4 - Concern  (60-70%): Orange       mdi:water-plus
#   Level 5 - Critical (>70%):  Red           mdi:water-alert
#
# Temperature color thresholds:
#   <20°C:   Blue   (Cool)
#   20-25°C: Green  (Ideal)
#   25-30°C: Amber  (Warm)
#   30-35°C: Orange (Hot)
#   >35°C:   Red    (Too hot)
#
# Variables:
#   amsName           - Display name (e.g., "AMS 1", "AMS 2 Pro")
#   amsIcon           - Header icon (default: "fapro:filament-2")
#   humidityEntity    - Humidity sensor entity ID (percentage-based)
#   temperatureEntity - Temperature sensor entity ID (°C)
#
# Usage:
#   - type: custom:button-card
#     template: ams_header
#     variables:
#       amsName: AMS 1
#       amsIcon: fapro:filament-2
#       humidityEntity: sensor.my_ams_humidity
#       temperatureEntity: sensor.my_ams_temperature

ams_header:
  type: custom:button-card
  entity: '[[[ return variables.humidityEntity; ]]]'
  show_icon: false
  show_name: false
  show_state: false
  styles:
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 6px 0
      - margin: 0
      - width: 100%
    grid:
      - display: contents
    custom_fields:
      header:
        - width: 100%
        - padding: 0
        - margin: 0
  custom_fields:
    header: |
      [[[
        const amsName = variables.amsName || 'AMS';
        const amsIcon = variables.amsIcon || 'fapro:filament-2';
        const hEntity = variables.humidityEntity;
        const tEntity = variables.temperatureEntity;
        const hVal = parseFloat(states[hEntity]?.state) || 0;
        const tVal = parseFloat(states[tEntity]?.state) || 0;
        const hState = states[hEntity]?.state || '0';
        const tState = states[tEntity]?.state || '0';
        const hUnit = states[hEntity]?.attributes?.unit_of_measurement || '%';
        const tUnit = states[tEntity]?.attributes?.unit_of_measurement || '°C';
        let hIcon;
        if (hVal >= 70) hIcon = 'mdi:water-alert';
        else if (hVal >= 60) hIcon = 'mdi:water-plus';
        else if (hVal >= 40) hIcon = 'mdi:water';
        else if (hVal >= 20) hIcon = 'mdi:water-minus';
        else hIcon = 'mdi:water-outline';
        let hColor, hBg;
        if (hVal < 20) { hColor = '#4CAF50'; hBg = 'rgba(76,175,80,0.2)'; }
        else if (hVal < 40) { hColor = '#8BC34A'; hBg = 'rgba(139,195,74,0.2)'; }
        else if (hVal < 60) { hColor = '#FFC107'; hBg = 'rgba(255,193,7,0.25)'; }
        else if (hVal < 70) { hColor = '#FF9800'; hBg = 'rgba(255,152,0,0.25)'; }
        else { hColor = '#F44336'; hBg = 'rgba(244,67,54,0.25)'; }
        let tColor, tBg;
        if (tVal < 20) { tColor = '#42A5F5'; tBg = 'rgba(66,165,245,0.2)'; }
        else if (tVal < 25) { tColor = '#4CAF50'; tBg = 'rgba(76,175,80,0.2)'; }
        else if (tVal < 30) { tColor = '#FFC107'; tBg = 'rgba(255,193,7,0.25)'; }
        else if (tVal < 35) { tColor = '#FF9800'; tBg = 'rgba(255,152,0,0.25)'; }
        else { tColor = '#F44336'; tBg = 'rgba(244,67,54,0.25)'; }
        return `
          <div style="display:flex; align-items:center; width:100%; padding:0 12px; box-sizing:border-box;">
            <ha-icon icon="${amsIcon}" style="--mdc-icon-size:20px; color:var(--primary-text-color); flex-shrink:0;"></ha-icon>
            <span style="font-size:14px; font-weight:600; color:var(--primary-text-color); white-space:nowrap; flex-shrink:0; margin-left:4px;">${amsName}</span>
            <div style="flex:1; height:3px; background:rgba(255,255,255,0.12); margin:0 12px 0 8px; border-radius:1.5px; min-width:10px;"></div>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <div style="display:flex; align-items:center; gap:4px; background:${hBg}; border-radius:20px; padding:4px 10px 4px 6px;">
                <ha-icon icon="${hIcon}" style="--mdc-icon-size:16px; color:${hColor};"></ha-icon>
                <span style="font-size:12px; font-weight:600; color:${hColor}; white-space:nowrap;">${hState}${hUnit}</span>
              </div>
              <div style="display:flex; align-items:center; gap:4px; background:${tBg}; border-radius:20px; padding:4px 10px 4px 6px;">
                <ha-icon icon="mdi:thermometer" style="--mdc-icon-size:16px; color:${tColor};"></ha-icon>
                <span style="font-size:12px; font-weight:600; color:${tColor}; white-space:nowrap;">${tState} ${tUnit}</span>
              </div>
            </div>
          </div>
        `;
      ]]]
