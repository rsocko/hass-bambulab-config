# Docs: docs/features/printer_dashboards/README.md
# ams_header.yaml
# Pure button-card template for AMS unit header separators.
# Renders icon, title, separator line, and humidity/temperature pills
# entirely via button-card custom HTML — no nested bubble-card needed.
#
# Humidity color thresholds (higher is riskier):
#   <30%:    Green
#   30-39%:  Yellow
#   40-49%:  Orange
#   >=50%:   Red
#
# Temperature color thresholds are unit-aware.
#   Fahrenheit comfort band: 67-75°F (Green)
#   Celsius comfort band:    19.4-23.9°C (Green)
#
# Variables:
#   amsName           - Display name (e.g., "AMS 1", "AMS 2 Pro")
#   amsIcon           - Header icon (default: "fapro:filament-2")
#   amsTrays          - Optional tray keys to source color accents from
#                       (e.g., ["ams_1_tray_1", "ams_1_tray_2", ...])
#   humidityEntity    - Humidity sensor entity ID (percentage-based)
#   temperatureEntity - Temperature sensor entity ID (°C)
#   showPills         - Optional boolean, set false to hide humidity/temp pills
#
# Usage:
#   - type: custom:button-card
#     template: ams_header
#     variables:
#       amsName: AMS 1
#       amsIcon: fapro:filament-2
#       humidityEntity: sensor.my_ams_humidity
#       temperatureEntity: sensor.my_ams_temperature

ams_header:
  type: custom:button-card
  entity: '[[[ return variables.humidityEntity || variables.temperatureEntity || "sensor.spoolman_tray_map"; ]]]'
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 6px 0
      - margin: 0
    grid:
      - grid-template-areas: |
          [[[
            return variables.showPills === false ? '"header"' : '"header hpill tpill"';
          ]]]
      - grid-template-columns: |
          [[[
            return variables.showPills === false ? '1fr' : '1fr auto auto';
          ]]]
      - grid-template-rows: auto
      - width: 100%
      - align-items: center
      - column-gap: 6px
      - padding: 0 12px
      - box-sizing: border-box
    custom_fields:
      header:
        - padding: 0
        - margin: 0
      hpill:
        - display: |
            [[[
              return variables.showPills === false ? 'none' : 'block';
            ]]]
        - padding: 0
        - margin: 0
      tpill:
        - display: |
            [[[
              return variables.showPills === false ? 'none' : 'block';
            ]]]
        - padding: 0
        - margin: 0
  custom_fields:
    header: |
      [[[
        const amsName = variables.amsName || 'AMS';
        const amsIcon = variables.amsIcon || 'fapro:filament-2';
        const normalizeHexColor = (value) => {
          if (value === undefined || value === null) return '';
          let normalized = String(value).trim().replace(/^#/, '');
          if (normalized.length === 8) normalized = normalized.slice(0, 6);
          if (!/^[0-9a-fA-F]{6}$/.test(normalized)) return '';
          return normalized.toLowerCase();
        };
        const trayMap = states['sensor.spoolman_tray_map']?.attributes?.tray_map || {};
        const configuredTrays = Array.isArray(variables.amsTrays)
          ? variables.amsTrays
          : (typeof variables.amsTrays === 'string' ? variables.amsTrays.split(',') : []);
        const trayKeys = configuredTrays
          .map((v) => String(v || '').trim())
          .filter((v) => !!v);
        const trayColors = trayKeys
          .map((trayKey) => {
            const trayData = trayMap?.[trayKey] || {};
            const spoolId = trayData?.spool_id;
            const spoolEntity = spoolId ? states[`sensor.spoolman_spool_${spoolId}`] : null;
            const spoolColor = normalizeHexColor(spoolEntity?.attributes?.filament_color_hex);
            const trayColor = normalizeHexColor(trayData?.color);
            return spoolColor || trayColor;
          })
          .filter((color) => !!color);
        const accentColors = trayColors.length > 0 ? trayColors.map((hex) => `#${hex}`) : ['#6b7280'];
        const iconColor = accentColors[0];
        const separatorBackground = accentColors.length > 1
          ? `linear-gradient(90deg, ${accentColors.join(', ')})`
          : accentColors[0];
        return `
          <div style="display:flex; align-items:center; width:100%;">
            <ha-icon icon="${amsIcon}" style="--mdc-icon-size:20px; color:${iconColor}; flex-shrink:0;"></ha-icon>
            <span style="font-size:14px; font-weight:600; color:var(--primary-text-color); white-space:nowrap; flex-shrink:0; margin-left:4px;">${amsName}</span>
            <div style="flex:1; height:3px; background:${separatorBackground}; margin-left:8px; border-radius:1.5px; min-width:10px;"></div>
          </div>
        `;
      ]]]
    hpill:
      card:
        type: custom:button-card
        entity: '[[[ return variables.humidityEntity || "sensor.spoolman_tray_map"; ]]]'
        tap_action:
          action: more-info
        show_icon: false
        show_name: false
        show_state: false
        styles:
          card:
            - background: none
            - border: none
            - box-shadow: none
            - padding: 0
            - margin: 0
          grid:
            - display: contents
          custom_fields:
            pill:
              - padding: 0
              - margin: 0
        custom_fields:
          pill: |
            [[[
              const hEntity = variables?.humidityEntity;
              const val = hEntity ? (parseFloat(states[hEntity]?.state) || 0) : (parseFloat(entity?.state) || 0);
              const state = Math.round(val);
              const unit = hEntity ? (states[hEntity]?.attributes?.unit_of_measurement || '%') : (entity?.attributes?.unit_of_measurement || '%');
              let icon;
              if (val >= 50) icon = 'mdi:water-alert';
              else if (val >= 40) icon = 'mdi:water-plus';
              else if (val >= 30) icon = 'mdi:water';
              else icon = 'mdi:water-outline';
              let color, bg;
              if (val < 30) { color = '#4CAF50'; bg = 'rgba(76,175,80,0.2)'; }
              else if (val < 40) { color = '#FBC02D'; bg = 'rgba(251,192,45,0.24)'; }
              else if (val < 50) { color = '#F57C00'; bg = 'rgba(245,124,0,0.24)'; }
              else { color = '#F44336'; bg = 'rgba(244,67,54,0.25)'; }
              return `
                <div style="display:inline-flex; align-items:center; gap:4px; background:${bg}; border-radius:20px; padding:5px 10px 5px 6px; line-height:1; cursor:pointer;">
                  <ha-icon icon="${icon}" style="--mdc-icon-size:16px; color:${color}; display:flex;"></ha-icon>
                  <span style="font-size:12px; font-weight:600; color:var(--primary-text-color); white-space:nowrap; line-height:16px;">${state}${unit}</span>
                </div>
              `;
            ]]]
    tpill:
      card:
        type: custom:button-card
        entity: '[[[ return variables.temperatureEntity || "sensor.spoolman_tray_map"; ]]]'
        tap_action:
          action: more-info
        show_icon: false
        show_name: false
        show_state: false
        styles:
          card:
            - background: none
            - border: none
            - box-shadow: none
            - padding: 0
            - margin: 0
          grid:
            - display: contents
          custom_fields:
            pill:
              - padding: 0
              - margin: 0
        custom_fields:
          pill: |
            [[[
              const tEntity = variables?.temperatureEntity;
              const val = tEntity ? (parseFloat(states[tEntity]?.state) || 0) : (parseFloat(entity?.state) || 0);
              const state = Math.round(val);
              const unit = tEntity ? (states[tEntity]?.attributes?.unit_of_measurement || '°C') : (entity?.attributes?.unit_of_measurement || '°C');
              const isF = String(unit).includes('F');
              const toF = (c) => (c * 9 / 5) + 32;
              const valueF = isF ? val : toF(val);
              let color, bg;
              if (valueF < 59) { color = '#F44336'; bg = 'rgba(244,67,54,0.25)'; }
              else if (valueF < 63) { color = '#F57C00'; bg = 'rgba(245,124,0,0.24)'; }
              else if (valueF < 67) { color = '#FBC02D'; bg = 'rgba(251,192,45,0.24)'; }
              else if (valueF <= 75) { color = '#4CAF50'; bg = 'rgba(76,175,80,0.2)'; }
              else if (valueF <= 80) { color = '#FBC02D'; bg = 'rgba(251,192,45,0.24)'; }
              else if (valueF <= 85) { color = '#F57C00'; bg = 'rgba(245,124,0,0.24)'; }
              else { color = '#F44336'; bg = 'rgba(244,67,54,0.25)'; }
              return `
                <div style="display:inline-flex; align-items:center; gap:4px; background:${bg}; border-radius:20px; padding:5px 10px 5px 6px; line-height:1; cursor:pointer;">
                  <ha-icon icon="mdi:thermometer" style="--mdc-icon-size:16px; color:${color}; display:flex;"></ha-icon>
                  <span style="font-size:12px; font-weight:600; color:var(--primary-text-color); white-space:nowrap; line-height:16px;">${state} ${unit}</span>
                </div>
              `;
            ]]]
