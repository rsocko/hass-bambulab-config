# catalog_filament_card.yaml
# Hybrid catalog card for filament entities that currently have zero spools.
# Uses the filament entity as the server-side-backed catalog source while
# keeping the main view on the existing single auto-entities grid.

catalog_filament_card:
  template:
    - catalog_filament_popup
  type: custom:button-card
  show_entity_picture: true
  show_icon: false
  show_name: true
  show_state: false
  show_label: true
  name: |
    [[[
      return entity?.attributes?.name || entity?.attributes?.friendly_name || 'Unknown Filament';
    ]]]
  label: |
    [[[
      const material = entity?.attributes?.material || '';
      const vendor = entity?.attributes?.vendor_name || '';
      const typeRaw = entity?.attributes?.extra_type_details || [];
      const typeList = Array.isArray(typeRaw)
        ? typeRaw
        : String(typeRaw || '').replace(/[\[\]"]/g, '').split(',').map((item) => item.trim()).filter(Boolean);
      const front = [material, ...typeList].filter(Boolean).join(' · ');
      return front + (front && vendor ? ' - ' : '') + vendor;
    ]]]
  custom_fields:
    remaining_weight: |
      [[[
        const currentWeight = Number.parseFloat(entity?.state);
        const text = Number.isFinite(currentWeight) ? currentWeight.toFixed(0) + 'g' : '0g';
        return `<span style="font-size:11px; font-weight:700; color:#f44336;">${text}</span>`;
      ]]]
    zero_spools: |
      [[[
        return '<span style="display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:999px;background:rgba(244,67,54,0.16);color:#f44336;font-size:10px;font-weight:700;letter-spacing:0.04em;">ZERO SPOOLS</span>';
      ]]]
    location_label: |
      [[[
        return '<span style="font-size:11px; font-weight:500; color:var(--primary-text-color); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">No Spools</span>';
      ]]]
    purchase_qty: |
      [[[
        const qty = parseInt(entity?.attributes?.extra_purchase_qty, 10) || 0;
        if (qty <= 0) return '';
        return `<span style="display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; color:var(--accent-color); white-space:nowrap;"><ha-icon icon="mdi:cart-plus" style="--mdc-icon-size:13px; color:var(--accent-color);"></ha-icon><span>${qty}</span></span>`;
      ]]]
  styles:
    card:
      - padding: 6px 8px
      - border-radius: 8px
      - overflow: hidden
      - border-left: 3px solid #f44336
      - box-shadow: inset 0 0 0 1px rgba(244,67,54,0.28)
      - background: |
          [[[
            const singleHex = (entity?.attributes?.color_hex || '888888').replace('#', '');
            const r = parseInt(singleHex.substring(0, 2), 16) || 128;
            const g = parseInt(singleHex.substring(2, 4), 16) || 128;
            const b = parseInt(singleHex.substring(4, 6), 16) || 128;
            return `rgba(${r},${g},${b},0.18)`;
          ]]]
    grid:
      - grid-template-areas: |
          [[[ 
            const qty = parseInt(entity?.attributes?.extra_purchase_qty, 10) || 0;
            if (qty > 0) {
              return '"i n remaining_weight remaining_weight" "i l l l" "i zero_spools zero_spools zero_spools" "location_label location_label purchase_qty purchase_qty"';
            }
            return '"i n remaining_weight remaining_weight" "i l l l" "i zero_spools zero_spools zero_spools" "location_label location_label location_label location_label"';
          ]]]
      - grid-template-columns: 44px minmax(0, 1fr) auto auto
      - grid-template-rows: auto auto auto auto
      - align-items: center
      - gap: 2px 6px
    entity_picture:
      - width: 36px
      - height: 36px
      - border-radius: 50%
      - border: |
          [[[
            const hex = (entity?.attributes?.color_hex || '888888').replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16) || 128;
            const g = parseInt(hex.substring(2, 4), 16) || 128;
            const b = parseInt(hex.substring(4, 6), 16) || 128;
            return `2px solid rgba(${r},${g},${b},0.6)`;
          ]]]
    name:
      - font-size: 12px
      - font-weight: 600
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - color: var(--primary-text-color)
      - justify-self: start
    label:
      - font-size: 10px
      - color: var(--primary-text-color)
      - opacity: 0.55
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - justify-self: start
    custom_fields:
      remaining_weight:
        - justify-self: end
      zero_spools:
        - justify-self: start
      location_label:
        - justify-self: start
        - padding-top: 1px
      purchase_qty:
        - justify-self: end
        - padding-top: 1px