ams_tray_detail:
  type: custom:button-card
  template:
    - ams_tray_popup
  entity: |
    [[[
      const tray = variables.tray;
      const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
      const spoolId = map?.[tray]?.spool_id;

      return spoolId
        ? `sensor.spoolman_spool_${spoolId}`
        : variables.trayEntityId;
    ]]]
  name: |
    [[[
      const tray = variables.tray;
      const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
      return map?.[tray]?.name ?? 'EMPTY';
    ]]]
  label: |
    [[[
      const tray = variables.tray;
      const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
      const trayData = map?.[tray] || {};
      if (trayData.reason) return trayData.reason;

      if (trayData.pin_active && trayData.pin_applied) {
        return 'Pinned spool #' + trayData.pin_spool_id;
      }

      if (trayData.pin_active && trayData.match_strategy === 'uuid') {
        return 'Pin set for spool #' + trayData.pin_spool_id + ' (UUID active)';
      }

      if (trayData.match_state === 'ambiguous' && Array.isArray(trayData.candidate_spool_ids) && trayData.candidate_spool_ids.length > 0) {
        return 'Ambiguous: candidates ' + trayData.candidate_spool_ids.join(', ');
      }

      const strategy = trayData.match_strategy || '';
      const strategyLabel = {
        manual_pin: 'Matched by manual pin',
        color_type: 'Matched by single-color exact',
        color_type_ams_preference: 'Single-color exact (AMS preference)',
        multicolor_first_hex: 'Matched by multi-color first hex',
        multicolor_first_hex_ams_preference: 'Matched by multi-color first hex (AMS preference)',
        multicolor_any_hex: 'Matched by multi-color any hex',
        multicolor_any_hex_ams_preference: 'Matched by multi-color any hex (AMS preference)'
      };

      return strategyLabel[strategy] || '';
    ]]]
  show_state: false
  show_icon: false
  show_label: true
  custom_fields:
    desiccant_icon: |
      [[[
        const tray = variables.tray;
        const status = states['sensor.spoolman_tray_map']?.attributes?.tray_map?.[tray]?.status;

        // Hide droplet for green OR empty trays
        if (status === 'green' || status === 'empty') return '';

        const colors = {
          undefined: '#9e9e9e',
          yellow: '#ffcc00',
          orange: '#ff9900',
          red: '#cc0000'
        };
        
        const color = colors[status] || '#9e9e9e';
        return `<ha-icon icon="mdi:water" style="--mdc-icon-size: 16px; color: ${color};"></ha-icon>`;
      ]]]
    remaining_weight: |
      [[[
        const tray = variables.tray;
        const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
        const spoolId = map?.[tray]?.spool_id;
        const trayEntity = states[variables.trayEntityId];
        const mismatchThresholdPercent = 15;
        const mismatchColor = '#d946ef';
        
        if (!spoolId) return '';
        
        const spoolEntity = states[`sensor.spoolman_spool_${spoolId}`];
        const weight = spoolEntity?.attributes?.remaining_weight;
        const readPositiveNumber = (...values) => {
          for (const value of values) {
            const numeric = Number(value);
            if (Number.isFinite(numeric) && numeric > 0) return numeric;
          }
          return null;
        };
        const initialWeight = readPositiveNumber(
          spoolEntity?.attributes?.initial_weight,
          spoolEntity?.attributes?.filament_weight
        );
        const amsRemainPercentRaw = Number(trayEntity?.attributes?.remain);
        const amsRemainPercent = Number.isFinite(amsRemainPercentRaw) && amsRemainPercentRaw >= 0 && amsRemainPercentRaw <= 100
          ? amsRemainPercentRaw
          : null;
        const spoolRemainPercent = initialWeight !== null && Number.isFinite(Number(weight))
          ? Math.max(0, Math.min(100, (Number(weight) / initialWeight) * 100))
          : null;
        const mismatchPercent = amsRemainPercent !== null && spoolRemainPercent !== null
          ? Math.abs(amsRemainPercent - spoolRemainPercent)
          : null;
        const showMismatchWarning = mismatchPercent !== null && mismatchPercent >= mismatchThresholdPercent;
        
        if (weight === undefined || weight === null) return '';

        const mismatchTooltip = showMismatchWarning
          ? `Spool weight and AMS calculated weight differ by > ${mismatchThresholdPercent}% - please review and update manual spool weight if needed. You can ignore this if the AMS is reporting inaccurately. AMS ${Math.round(amsRemainPercent)}% vs Spoolman ${Math.round(spoolRemainPercent)}%.`
          : '';
        const warningMarker = showMismatchWarning
          ? `<span title="${mismatchTooltip}" style="font-size: 12px; line-height: 1; color: ${mismatchColor}; font-weight: 700; cursor: help;">?</span>`
          : '';
        
        return `<div style="display: flex; align-items: center; justify-content: flex-end; gap: 2px;"><span style="font-size: 12px; color: #888;">${weight.toFixed(1)}g</span>${warningMarker}<ha-icon icon="fapro:filament-2" style="--mdc-icon-size: 12px; color: #888;"></ha-icon></div>`;
      ]]]
    print_weight: |
      [[[
        const tray = variables.tray;
        const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
        const spoolId = map?.[tray]?.spool_id;

        // Only show if tray has a spool mapped
        if (!spoolId) return '';

        const normalizedWeightKeys = [variables.printWeightKey];
        if (variables.printWeightKey === 'External') normalizedWeightKeys.push('External Spool');
        if (variables.printWeightKey === 'External Spool') normalizedWeightKeys.push('External');

        const backupRaw = states['input_text.print_weight_backup']?.state;
        let backupWeights = null;
        if (backupRaw && !['unknown', 'unavailable', 'none', 'null', ''].includes(String(backupRaw).toLowerCase())) {
          try {
            const parsed = JSON.parse(backupRaw);
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
              backupWeights = parsed;
            }
          } catch (e) {
            backupWeights = null;
          }
        }

        const readNumericWeight = (source) => {
          if (!source) return null;
          for (const key of normalizedWeightKeys) {
            const raw = source[key];
            if (raw === undefined || raw === null || raw === '') continue;
            const numeric = Number(raw);
            if (!Number.isNaN(numeric)) return numeric;
          }
          return null;
        };

        // Prefer live print-weight attributes, then backup helper payload.
        const printWeightEntity = states['sensor.ntk_ryansoffice_3dprinter_print_weight'];
        const livePrintWeight = readNumericWeight(printWeightEntity?.attributes);
        const backupPrintWeight = readNumericWeight(backupWeights);
        const printWeight = livePrintWeight !== null ? livePrintWeight : backupPrintWeight;

        if (!printWeight || printWeight === 0) return '';

        // Get remaining weight for color coding
        const spoolEntity = states[`sensor.spoolman_spool_${spoolId}`];
        const remainingWeight = spoolEntity?.attributes?.remaining_weight;

        // Determine color based on remaining vs print weight
        let color = '#888'; // default
        if (remainingWeight !== undefined && remainingWeight !== null) {
          if (remainingWeight < printWeight) {
            color = '#cc0000'; // red - will run out
          } else if (remainingWeight < printWeight * 1.1) {
            color = '#ff9900'; // orange - close
          } else if (remainingWeight < printWeight * 1.2) {
            color = '#ffcc00'; // yellow - approaching
          }
        }

        const nozzleIcon = (remainingWeight !== undefined && remainingWeight !== null && remainingWeight < printWeight) ? 'mdi:printer-3d-nozzle-alert' : 'mdi:printer-3d-nozzle';
        return `<div style="display: flex; align-items: center; justify-content: flex-end; gap: 2px;"><span style="font-size: 12px; color: ${color}; font-weight: ${color !== '#888' ? '600' : '400'};">−${printWeight.toFixed(1)}g</span><ha-icon icon="${nozzleIcon}" style="--mdc-icon-size: 12px; color: ${color};"></ha-icon></div>`;
      ]]]
    placeholder: |
      [[[
        return '';
      ]]]
  styles:
    card:
      - padding: 6px
      - background: none
      - border-radius: 8px
      - overflow: hidden
      - box-shadow: |
          [[[
            const active = states[variables.trayEntityId]?.attributes?.active;
            return active ? 'inset 0 0 0 4px var(--primary-color)' : 'none';
          ]]]
      - height: 100%
      - min-height: 80px
    grid:
      - grid-template-areas: '"n n n" "l l l" "desiccant_icon . remaining_weight" ". . print_weight"'
      - grid-template-columns: auto 1fr auto
      - grid-template-rows: auto auto auto auto
      - align-content: end
    name:
      - font-size: 12px
      - white-space: normal
      - line-height: 1.2
      - justify-self: center
      - padding-bottom: 2px
    label:
      - font-size: 9px
      - color: '#888'
      - font-style: italic
      - white-space: normal
      - line-height: 1.1
      - justify-self: center
      - padding-bottom: 4px
    custom_fields:
      desiccant_icon:
        - justify-self: start
        - padding-left: 4px
      remaining_weight:
        - justify-self: end
        - padding-right: 4px
        - line-height: '1'
        - padding-bottom: '0'
      print_weight:
        - justify-self: end
        - padding-right: 4px
        - line-height: '1'
        - padding-top: '0'
