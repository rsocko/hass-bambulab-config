# catalog_filament_popup.yaml
# Lightweight popup trigger for zero-spool filament entries in the hybrid catalog.

catalog_filament_popup:
  tap_action: |
    [[[
      const filamentId = entity?.attributes?.id;
      if (!filamentId) return { action: 'more-info' };

      const eid = entity.entity_id;
      const filamentIdInt = parseInt(filamentId, 10);
      const filamentName = entity?.attributes?.friendly_name || entity?.attributes?.name || 'Unknown Filament';
      const mergedFilamentExtra = Object.entries(entity?.attributes || {})
        .filter((entry) => entry[0].startsWith('extra_'))
        .reduce((acc, entry) => {
          acc[entry[0].replace('extra_', '')] = entry[1];
          return acc;
        }, {});
      const inventoryRuleHelperEntity = 'input_select.spoolman_filament_inventory_rule';
      const filamentEditorFilamentIdEntity = 'input_text.spoolman_filament_editor_filament_id';
      const filamentEditorSpoolEntityIdEntity = 'input_text.spoolman_filament_editor_spool_entity_id';
      const inventoryRuleOptions = ['Not Defined', 'Keep In Stock', 'Maintain Backup Spool', 'Max Inventory', 'As Needed', 'Do Not Stock'];
      const normalizeInventoryRule = function(value) {
        const raw = value === undefined || value === null ? '' : String(value).trim().replace(/^"|"$/g, '');
        const normalized = raw.toLowerCase();
        const aliases = {
          'not defined': 'Not Defined',
          'keep in stock': 'Keep In Stock',
          'maintain backup spool': 'Maintain Backup Spool',
          'max inventory': 'Max Inventory',
          'as needed': 'As Needed',
          'do not stock': 'Do Not Stock'
        };
        const resolved = aliases[normalized] || '';
        return inventoryRuleOptions.includes(resolved) ? resolved : 'Not Defined';
      };
      const currentInventoryRule = normalizeInventoryRule(mergedFilamentExtra.inventory_rule);
      const rawQtyToOrder = entity?.attributes?.extra_purchase_qty;
      const parsedQtyToOrder = Number.parseInt(rawQtyToOrder, 10);
      const qtyToOrder = Number.isFinite(parsedQtyToOrder) && parsedQtyToOrder > 0 ? parsedQtyToOrder : 0;
      const currentWeight = Number.parseFloat(entity?.state);
      const totalWeightText = Number.isFinite(currentWeight) ? currentWeight.toFixed(1) + ' g' : '0.0 g';
      const totalSpoolsSecondary = 'Current Spools';
      const nominalWeight = Number(entity?.attributes?.weight || 1000);
      const price = entity?.attributes?.price;
      const costPerG = price && nominalWeight > 0 ? (Number(price) / nominalWeight) : null;
      const costPerGText = costPerG !== null ? '$' + costPerG.toFixed(3) + '/g' : 'N/A';

      const buildQtyToOrderAction = function(nextQty) {
        const normalizedQty = Math.max(0, Number.parseInt(nextQty, 10) || 0);
        const nextFilamentExtra = {
          ...mergedFilamentExtra,
          purchase_qty: String(normalizedQty)
        };
        return {
          action: 'fire-dom-event',
          browser_mod: {
            service: 'browser_mod.sequence',
            data: {
              sequence: [
                {
                  service: 'rest_command.spoolman_patch_filament_extra',
                  data: {
                    filament_id: filamentIdInt,
                    extra: nextFilamentExtra
                  }
                },
                {
                  service: 'homeassistant.update_entity',
                  data: { entity_id: eid }
                }
              ]
            }
          }
        };
      };

      const increaseQtyToOrderAction = buildQtyToOrderAction(qtyToOrder + 1);
      const decreaseQtyToOrderAction = qtyToOrder > 0 ? buildQtyToOrderAction(qtyToOrder - 1) : { action: 'none' };
      const toolbarBtn = (n, ico, act, bg) => ({
        type: 'custom:button-card', name: n, icon: ico, show_icon: true, show_name: true, show_state: false, tap_action: act,
        styles: { card: [{ 'background-color': bg || 'var(--primary-color)' }, { 'border-radius': '12px' }, { padding: '12px 4px 8px' }, { cursor: 'pointer' }, { '--mdc-icon-size': '24px' }, { transition: 'filter 0.2s' }, { height: '68px' }, { 'box-sizing': 'border-box' }, { display: 'flex' }, { 'flex-direction': 'column' }, { 'align-items': 'center' }, { 'justify-content': 'center' }], icon: [{ color: 'white' }], name: [{ color: 'white' }, { 'font-size': '11px' }, { 'font-weight': '500' }, { 'margin-top': '4px' }] },
        card_mod: { style: 'ha-card { transition: filter 0.2s; } ha-card:hover { filter: brightness(1.3); } ha-card:active { filter: brightness(0.8); }' }
      });

      return {
        action: 'fire-dom-event',
        browser_mod: {
          service: 'browser_mod.sequence',
          data: {
            sequence: [
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: filamentEditorFilamentIdEntity,
                  value: Number.isFinite(filamentIdInt) ? String(filamentIdInt) : ''
                }
              },
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: filamentEditorSpoolEntityIdEntity,
                  value: ''
                }
              },
              {
                service: 'input_select.select_option',
                data: {
                  entity_id: inventoryRuleHelperEntity,
                  option: currentInventoryRule
                }
              },
              {
                service: 'browser_mod.popup',
                data: {
                  title: filamentName,
                  size: 'normal',
                  content: {
                    type: 'vertical-stack',
                    cards: [
                      {
                        type: 'custom:button-card',
                        entity: eid,
                        template: 'catalog_filament_popup_content',
                        tap_action: { action: 'none' },
                        triggers_update: eid
                      },
                      {
                        type: 'grid',
                        columns: 2,
                        square: false,
                        card_mod: {
                          style: '#root { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr) !important; align-items: stretch !important; }'
                        },
                        cards: [
                          {
                            type: 'vertical-stack',
                            cards: [
                              {
                                type: 'horizontal-stack',
                                cards: [
                                  {
                                    type: 'custom:mushroom-template-card',
                                    primary: totalWeightText,
                                    secondary: 'Aggregate Weight',
                                    icon: 'mdi:weight-gram',
                                    icon_color: 'red',
                                    layout: 'vertical',
                                    fill_container: true
                                  },
                                  {
                                    type: 'custom:mushroom-template-card',
                                    primary: '0',
                                    secondary: totalSpoolsSecondary,
                                    icon: 'mdi:alert-circle-outline',
                                    icon_color: 'red',
                                    layout: 'vertical',
                                    fill_container: true
                                  },
                                  {
                                    type: 'custom:mushroom-template-card',
                                    primary: costPerGText,
                                    secondary: 'Cost per g',
                                    icon: 'mdi:currency-usd',
                                    icon_color: 'green',
                                    layout: 'vertical',
                                    fill_container: true
                                  }
                                ]
                              },
                              {
                                type: 'custom:bubble-card',
                                card_type: 'sub-buttons',
                                entity: inventoryRuleHelperEntity,
                                hide_main_background: true,
                                rows: 1,
                                styles: 'ha-card { padding: 0 !important; background: transparent !important; box-shadow: none !important; border: 0 !important; } .bubble-sub-button-container, .bubble-sub-buttons-container { gap: 0 !important; } .bubble-sub-button { min-height: 30px !important; }',
                                sub_button: {
                                  main: [],
                                  bottom: [
                                    {
                                      entity: inventoryRuleHelperEntity,
                                      sub_button_type: 'select',
                                      name: 'Inventory Rule',
                                      icon: 'mdi:playlist-check',
                                      show_name: true,
                                      show_state: true,
                                      show_background: true,
                                      state_background: currentInventoryRule !== 'Not Defined',
                                      state_color: currentInventoryRule !== 'Not Defined',
                                      fill_width: true
                                    }
                                  ]
                                }
                              }
                            ]
                          },
                          {
                            type: 'vertical-stack',
                            cards: [
                              {
                                type: 'custom:mushroom-template-card',
                                primary: 'Qty to Order',
                                secondary: String(qtyToOrder),
                                icon: 'mdi:cart-plus',
                                icon_color: 'accent',
                                layout: 'vertical',
                                fill_container: true,
                                tap_action: { action: 'none' }
                              },
                              {
                                type: 'horizontal-stack',
                                card_mod: {
                                  style: '#root { justify-content: center !important; gap: 6px !important; } #root > * { flex: 0 0 auto !important; }'
                                },
                                cards: [
                                  {
                                    type: 'custom:button-card',
                                    icon: 'mdi:minus',
                                    show_name: false,
                                    tap_action: decreaseQtyToOrderAction,
                                    styles: {
                                      grid: [{ 'grid-template-areas': '"i"' }, { 'justify-items': 'center' }, { 'align-items': 'center' }],
                                      img_cell: [{ 'justify-content': 'center' }, { 'align-items': 'center' }],
                                      card: [{ background: qtyToOrder > 0 ? 'var(--primary-color)' : 'var(--secondary-background-color)' }, { 'box-shadow': 'none' }, { 'border-radius': '999px' }, { width: '44px' }, { height: '30px' }, { padding: '0' }, { opacity: qtyToOrder > 0 ? '1' : '0.6' }, { cursor: qtyToOrder > 0 ? 'pointer' : 'default' }, { transition: 'filter 0.2s ease' }],
                                      icon: [{ color: qtyToOrder > 0 ? 'white' : 'var(--primary-text-color)' }, { width: '17px' }, { height: '17px' }]
                                    }
                                  },
                                  {
                                    type: 'custom:button-card',
                                    icon: 'mdi:plus',
                                    show_name: false,
                                    tap_action: increaseQtyToOrderAction,
                                    styles: {
                                      grid: [{ 'grid-template-areas': '"i"' }, { 'justify-items': 'center' }, { 'align-items': 'center' }],
                                      img_cell: [{ 'justify-content': 'center' }, { 'align-items': 'center' }],
                                      card: [{ background: 'var(--primary-color)' }, { 'box-shadow': 'none' }, { 'border-radius': '999px' }, { width: '44px' }, { height: '30px' }, { padding: '0' }, { cursor: 'pointer' }, { transition: 'filter 0.2s ease' }],
                                      icon: [{ color: 'white' }, { width: '17px' }, { height: '17px' }]
                                    }
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      },
                      {
                        type: 'grid',
                        columns: 2,
                        square: false,
                        cards: [
                          toolbarBtn('Reload', 'mdi:refresh', { action: 'fire-dom-event', browser_mod: { service: 'browser_mod.sequence', data: { sequence: [{ service: 'homeassistant.update_entity', data: { entity_id: eid } }, { service: 'browser_mod.delay', data: { time: 750 } }, { service: 'browser_mod.close_popup' }] } } }),
                          toolbarBtn('Close', 'mdi:close-circle-outline', { action: 'fire-dom-event', browser_mod: { service: 'browser_mod.close_popup' } }, 'var(--secondary-text-color)')
                        ]
                      }
                    ]
                  }
                }
              }
            ]
          }
        }
      };
    ]]]