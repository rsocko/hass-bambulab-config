# spool_replace_wizard_step2.yaml
# Step 2: Select Replacement Spool
# Shows source spool summary, sealed candidate picker dropdown.
# Candidates are pre-populated by script.spool_replace_populate_candidates.
# Nav: Continue (syncs target ID) → Step 3, Cancel.
#
# Docs: docs/features/spoolman_sync/spool-replace-refill-design.md

spool_replace_wizard_step2:
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - box-shadow: none
      - padding: 0
      - text-align: left
      - overflow: hidden
    grid:
      - grid-template-areas: '"header" "picker" "nav"'
      - grid-template-columns: minmax(0, 1fr)
      - grid-template-rows: auto auto auto
    custom_fields:
      header:
        - padding: 0
        - text-align: left
        - justify-self: start
        - width: 100%
        - min-width: 0
        - overflow: hidden
      picker:
        - padding: 4px 0
        - min-width: 0
        - overflow: hidden
      nav:
        - padding: 8px 0 0 0
  custom_fields:
    header: |
      [[[
        const srcId = states['input_text.spool_replace_source_spool_id']?.state;
        const srcEntity = (srcId && srcId !== '') ? states['sensor.spoolman_spool_' + srcId] : null;
        const name = srcEntity?.attributes?.friendly_name || 'Unknown';
        const filamentName = srcEntity?.attributes?.filament_name || 'this filament';
        const vendor = srcEntity?.attributes?.filament_vendor_name || '';
        const rawColor = (srcEntity?.attributes?.filament_color_hex || '888888').replace('#', '');
        const colorHex = '#' + rawColor;
        const entityPicture = srcEntity?.attributes?.entity_picture || '';
        const subtitle = vendor ? filamentName + ' (' + vendor + ')' : filamentName;
        const srcImgHtml = entityPicture
          ? '<img src="' + entityPicture + '" style="width:24px;height:24px;border-radius:50%;border:2px solid ' + colorHex + ';vertical-align:middle;margin-right:6px;object-fit:cover;">'
          : '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:' + colorHex + ';vertical-align:middle;margin-right:6px;border:1px solid var(--divider-color);"></span>';

        return '<div style="text-align:left;width:100%;">'
          + '<div style="display:inline-flex;align-items:center;gap:10px;margin-bottom:8px;">'
          + '<ha-icon icon="mdi:swap-horizontal" style="color:var(--info-color);--mdc-icon-size:28px;width:28px;height:28px;flex:0 0 28px;display:inline-flex;"></ha-icon>'
          + '<div style="min-width:0;overflow:hidden;">'
          + '<div style="font-weight:600;">Select a replacement spool</div>'
          + '<div style="font-size:0.9em;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Showing sealed spools of ' + subtitle + '</div>'
          + '</div></div>'
          + '<div style="display:flex;align-items:center;padding:8px 12px;border-radius:8px;background:var(--card-background-color);border:1px solid var(--divider-color);font-size:0.9em;box-sizing:border-box;min-width:0;overflow:hidden;">'
          + srcImgHtml
          + '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">'
          + 'Replacing:&nbsp; <strong>' + name + '</strong>&nbsp; #' + srcId
          + '</span></div>'
          + '</div>';
      ]]]
    picker:
      card:
        type: entities
        card_mod:
          style: |
            ha-card {
              overflow: hidden;
            }
            .card-content {
              padding: 8px 12px;
            }
        entities:
          - entity: input_select.spool_replace_target_picker
            name: Replacement Spool
            card_mod:
              style: |
                :host {
                  overflow: hidden;
                }
                hui-generic-entity-row {
                  overflow: hidden;
                }
                state-badge {
                  flex-shrink: 0;
                }
                .info, .text-content {
                  min-width: 0;
                  overflow: hidden;
                  text-overflow: ellipsis;
                }
    nav:
      card:
        type: vertical-stack
        cards:
          # Informational banner when no sealed candidates exist
          - type: conditional
            conditions:
              - entity: input_select.spool_replace_target_picker
                state: "No sealed spools found"
            card:
              type: markdown
              content: >-
                ⚠️ **No sealed replacement spools found for this filament.**

                You can archive the empty spool directly — this will set its weight to 0 and archive it in Spoolman.
              card_mod:
                style: |
                  ha-card {
                    background: var(--warning-color, #ff9800);
                    color: #000;
                    border-radius: 8px;
                    padding: 0;
                    box-shadow: none;
                    font-size: 0.9em;
                  }
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                name: Cancel
                icon: mdi:close
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.close_popup
                styles:
                  grid:
                    - grid-template-areas: '"i" "n"'
                    - grid-template-rows: min-content min-content
                    - justify-items: center
                    - align-items: center
                  card:
                    - background: "var(--primary-color)"
                    - box-shadow: none
                    - border-radius: 6px
                    - padding: 6px
                  name:
                    - color: white
                    - font-weight: 500
                    - font-size: 12px
                  icon:
                    - color: white
                    - width: 20px
                    - height: 20px
                    - margin-bottom: 2px
              - type: custom:button-card
                name: |
                  [[[
                    const picker = states['input_select.spool_replace_target_picker']?.state;
                    return (picker === 'No sealed spools found') ? 'Archive Empty Spool' : 'Continue to Step 3';
                  ]]]
                icon: |
                  [[[
                    const picker = states['input_select.spool_replace_target_picker']?.state;
                    return (picker === 'No sealed spools found') ? 'mdi:archive-arrow-down' : 'mdi:arrow-right';
                  ]]]
                tap_action:
                  action: |
                    [[[
                      const picker = states['input_select.spool_replace_target_picker']?.state;
                      return (picker === 'No sealed spools found') ? 'call-service' : 'fire-dom-event';
                    ]]]
                  service: |
                    [[[
                      const picker = states['input_select.spool_replace_target_picker']?.state;
                      return (picker === 'No sealed spools found') ? 'browser_mod.sequence' : '';
                    ]]]
                  data:
                    sequence:
                      - service: spoolman.patch_spool
                        data:
                          id: "[[[ return states['input_text.spool_replace_source_spool_id']?.state; ]]]"
                          remaining_weight: 0
                      - service: spoolman.patch_spool
                        data:
                          id: "[[[ return states['input_text.spool_replace_source_spool_id']?.state; ]]]"
                          archived: true
                      - service: system_log.write
                        data:
                          message: "[[[ return 'Spool Replace: Archived empty spool #' + states['input_text.spool_replace_source_spool_id']?.state + ' (no sealed candidates available)'; ]]]"
                          level: warning
                          logger: homeassistant.components.bambulab.spool_replace
                      - service: browser_mod.close_popup
                  browser_mod:
                    service: browser_mod.sequence
                    data:
                      sequence:
                        - service: script.spool_replace_sync_target_from_picker
                        - service: browser_mod.close_popup
                        - service: browser_mod.delay
                          data:
                            time: 500
                        - service: browser_mod.popup
                          data:
                            title: "♻ Replace Spool — Step 3 of 4"
                            size: normal
                            content:
                              type: custom:button-card
                              template: spool_replace_wizard_step3
                              tap_action:
                                action: none
                styles:
                  grid:
                    - grid-template-areas: '"i" "n"'
                    - grid-template-rows: min-content min-content
                    - justify-items: center
                    - align-items: center
                  card:
                    - background: |
                        [[[
                          const picker = states['input_select.spool_replace_target_picker']?.state;
                          return (picker === 'No sealed spools found') ? 'var(--error-color, #db4437)' : 'var(--primary-color)';
                        ]]]
                    - box-shadow: none
                    - border-radius: 6px
                    - padding: 6px
                  name:
                    - color: white
                    - font-weight: 500
                    - font-size: 12px
                  icon:
                    - color: white
                    - width: 20px
                    - height: 20px
                    - margin-bottom: 2px
