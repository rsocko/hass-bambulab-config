print_history_archive_popup_favorite_button:
  entity: sensor.bambuddy_print_history_browser_activity
  triggers_update:
    - sensor.bambuddy_print_history_browser_activity
  show_name: true
  show_icon: true
  show_state: false
  name: Favorite
  icon: |
    [[[ 
      let snapshotArchive = {};
      try {
        snapshotArchive = JSON.parse(variables?.archive_json || '{}');
      } catch (_error) {
        snapshotArchive = {};
      }
      const archiveId = variables?.archive_id || snapshotArchive?.id;
      let archive = snapshotArchive;
      try {
        const archiveCacheRaw = states['sensor.bambuddy_print_history_browser_activity']?.attributes?.archives_json || '[]';
        const archiveCache = typeof archiveCacheRaw === 'string' ? JSON.parse(archiveCacheRaw || '[]') : archiveCacheRaw;
        if (Array.isArray(archiveCache) && archiveId !== undefined && archiveId !== null) {
          archive = archiveCache.find((item) => String(item?.id) === String(archiveId)) || snapshotArchive;
        }
      } catch (_error) {
        archive = snapshotArchive;
      }
      return archive?.is_favorite ? 'mdi:star' : 'mdi:star-outline';
    ]]]
  tap_action:
    action: call-service
    service: script.toggle_print_history_archive_favorite
    data:
      archive_id: |
        [[[ 
          let snapshotArchive = {};
          try {
            snapshotArchive = JSON.parse(variables?.archive_json || '{}');
          } catch (_error) {
            snapshotArchive = {};
          }
          return String(variables?.archive_id || snapshotArchive?.id || '');
        ]]]
  hold_action:
    action: none
  styles:
    card:
      - padding: 12px 10px
      - border-radius: 16px
      - box-shadow: none
      - border: 1px solid rgba(255,255,255,0.08)
      - background: |
          [[[ 
            let snapshotArchive = {};
            try {
              snapshotArchive = JSON.parse(variables?.archive_json || '{}');
            } catch (_error) {
              snapshotArchive = {};
            }
            const archiveId = variables?.archive_id || snapshotArchive?.id;
            let archive = snapshotArchive;
            try {
              const archiveCacheRaw = states['sensor.bambuddy_print_history_browser_activity']?.attributes?.archives_json || '[]';
              const archiveCache = typeof archiveCacheRaw === 'string' ? JSON.parse(archiveCacheRaw || '[]') : archiveCacheRaw;
              if (Array.isArray(archiveCache) && archiveId !== undefined && archiveId !== null) {
                archive = archiveCache.find((item) => String(item?.id) === String(archiveId)) || snapshotArchive;
              }
            } catch (_error) {
              archive = snapshotArchive;
            }
            return archive?.is_favorite ? 'rgba(245,194,66,0.18)' : 'rgba(255,255,255,0.04)';
          ]]]
    grid:
      - grid-template-areas: '"i" "n"'
      - grid-template-columns: 1fr
      - justify-items: center
      - gap: 6px
    icon:
      - align-self: center
      - justify-self: center
      - line-height: 1
      - width: 22px
      - height: 22px
      - color: |
          [[[ 
            let snapshotArchive = {};
            try {
              snapshotArchive = JSON.parse(variables?.archive_json || '{}');
            } catch (_error) {
              snapshotArchive = {};
            }
            const archiveId = variables?.archive_id || snapshotArchive?.id;
            let archive = snapshotArchive;
            try {
              const archiveCacheRaw = states['sensor.bambuddy_print_history_browser_activity']?.attributes?.archives_json || '[]';
              const archiveCache = typeof archiveCacheRaw === 'string' ? JSON.parse(archiveCacheRaw || '[]') : archiveCacheRaw;
              if (Array.isArray(archiveCache) && archiveId !== undefined && archiveId !== null) {
                archive = archiveCache.find((item) => String(item?.id) === String(archiveId)) || snapshotArchive;
              }
            } catch (_error) {
              archive = snapshotArchive;
            }
            return archive?.is_favorite ? '#f5c242' : 'var(--primary-text-color)';
          ]]]
    name:
      - font-size: 12px
      - font-weight: 600
      - color: var(--primary-text-color)