print_history_archive_popup:
  tap_action: |
    [[[ 
      let snapshotArchive = {};
      try {
        snapshotArchive = JSON.parse(variables?.archive_json || '{}');
      } catch (_error) {
        snapshotArchive = {};
      }
      const snapshotArchiveId = snapshotArchive?.id;
      let archive = snapshotArchive;
      try {
        const pageArchivesRaw = states['sensor.print_history_browser_page_archives']?.attributes?.archives || '[]';
        const pageArchives = typeof pageArchivesRaw === 'string' ? JSON.parse(pageArchivesRaw || '[]') : pageArchivesRaw;
        if (Array.isArray(pageArchives) && snapshotArchiveId !== undefined && snapshotArchiveId !== null) {
          archive = pageArchives.find((item) => String(item?.id) === String(snapshotArchiveId)) || snapshotArchive;
        }
      } catch (_error) {
        archive = snapshotArchive;
      }

      const archiveId = archive?.id;
      if (!archiveId) {
        return { action: 'none' };
      }

      const archiveName = archive?.print_name || `Archive ${archiveId}`;
      const ENRICHMENT_MARKER = '+>';
      const RECOVERY_MARKER = '[RECOVERY_AUDIT_V1]';
      const parseTags = (value) => String(value || '')
        .split(',')
        .map((tag) => tag.trim())
        .filter(Boolean);
      const systemTagPrefixes = ['f:', 's:', 'spoolman:', 'vendor:', 'material:', 'cost:', 'status:', 'ha enrichment:', 'ha_enrichment:'];
      const systemTagValues = ['ha_enriched:true'];
      const isSystemTag = (tag) => {
        const normalized = String(tag || '').trim().toLowerCase();
        return systemTagValues.includes(normalized)
          || systemTagPrefixes.some((prefix) => normalized.startsWith(prefix));
      };
      const splitArchiveNotes = (value) => {
        const raw = String(value || '');
        const markerIndex = raw.indexOf(ENRICHMENT_MARKER);
        const recoveryIndex = raw.indexOf(RECOVERY_MARKER);
        const indexes = [markerIndex, recoveryIndex].filter((index) => index >= 0);
        if (!indexes.length) {
          return { userNotes: raw.trimEnd(), payload: null };
        }
        const cutoff = Math.min(...indexes);
        const userNotes = raw.slice(0, cutoff).replace(/\n+$/u, '');
        const payloadRaw = markerIndex >= 0 ? raw.slice(markerIndex + ENRICHMENT_MARKER.length).trim() : '';
        try {
          return {
            userNotes,
            payload: payloadRaw ? JSON.parse(payloadRaw) : null
          };
        } catch (_error) {
          return { userNotes, payload: null };
        }
      };
      const archivePrintName = String(archive?.print_name || '');
      const archiveUserTags = parseTags(archive?.tags).filter((tag) => !isSystemTag(tag));
      const archiveNotesInfo = splitArchiveNotes(archive?.notes);
      const archiveTags = archiveUserTags.join(', ');
      const archiveNotes = String(archiveNotesInfo.userNotes || '');
      const archiveFailureReason = String(archive?.failure_reason || '').trim();
      const normalizeStatusOption = (status) => {
        const raw = String(status || '').toLowerCase().trim();
        if (raw === 'success') return 'completed';
        if (raw === 'cancelled' || raw === 'aborted' || raw === 'stopped') return 'cancelled';
        return raw;
      };
      const formatStatusOption = (status) => {
        const normalized = normalizeStatusOption(status);
        return normalized ? normalized.charAt(0).toUpperCase() + normalized.slice(1) : '';
      };
      const archiveStatus = normalizeStatusOption(archive?.status);
      const fixedStatusOptions = ['completed', 'failed', 'cancelled', 'printing'];
      const statusOptions = fixedStatusOptions.map((status) => formatStatusOption(status));
      const archiveStatusOption = formatStatusOption(archiveStatus);
      if (archiveStatusOption && !statusOptions.includes(archiveStatusOption)) {
        statusOptions.push(archiveStatusOption);
      }
      const fixedFailureReasonOptions = [
        'Unspecified',
        'Adhesion failure',
        'Spaghetti / Detached',
        'Layer shift',
        'Clogged nozzle',
        'Filament runout',
        'Warping',
        'Stringing',
        'Under-extrusion',
        'Power failure',
        'User cancelled',
        'Other'
      ];
      const failureReasonOptions = fixedFailureReasonOptions.slice();
      const hasCustomFailureReason = archiveFailureReason && !failureReasonOptions.includes(archiveFailureReason);
      if (hasCustomFailureReason) {
        failureReasonOptions.push(archiveFailureReason);
      }
      const selectedFailureReason = archiveFailureReason || 'Unspecified';
      const editorNameLimit = 255;
      const editorTagLimit = 255;
      const editorNotesLimit = 255;
      const editablePrintName = archivePrintName.slice(0, editorNameLimit);
      const editableTags = archiveTags.slice(0, editorTagLimit);
      const editableNotes = archiveNotes.slice(0, editorNotesLimit);
      const printNameWasTrimmed = archivePrintName.length > editorNameLimit;
      const notesWereTrimmed = archiveNotes.length > editorNotesLimit;
      const tagsWereTrimmed = archiveTags.length > editorTagLimit;
      const isFavorite = !!archive?.is_favorite;
      const buttonCard = (name, icon, background, tapAction) => ({
        type: 'custom:button-card',
        name,
        icon,
        show_name: true,
        show_icon: true,
        show_state: false,
        tap_action: tapAction,
        hold_action: { action: 'none' },
        styles: {
          card: [
            { padding: '12px 10px' },
            { 'border-radius': '16px' },
            { 'box-shadow': 'none' },
            { border: '1px solid rgba(255,255,255,0.08)' },
            { background }
          ],
          grid: [
            { 'grid-template-areas': '"i" "n"' },
            { 'grid-template-columns': '1fr' },
            { 'justify-items': 'center' },
            { gap: '6px' }
          ],
          icon: [
            { width: '22px' },
            { height: '22px' },
            { color: 'var(--primary-text-color)' }
          ],
          name: [
            { 'font-size': '12px' },
            { 'font-weight': '600' },
            { color: 'var(--primary-text-color)' }
          ]
        }
      });
      const actionCards = [
        ...(archiveStatus === 'printing' ? [] : [buttonCard(
          'Re-Enrich',
          'mdi:refresh-circle',
          'rgba(46,125,50,0.18)',
          {
            action: 'call-service',
            service: 'script.reenrich_print_history_archive',
            data: {
              archive_id: String(archiveId)
            }
          }
        )]),
        {
          type: 'custom:button-card',
          template: 'print_history_archive_popup_favorite_button',
          variables: {
            archive_json: variables?.archive_json || '{}',
            archive_id: String(archiveId)
          }
        },
        buttonCard(
          'Save',
          'mdi:content-save-outline',
          'rgba(21,101,192,0.18)',
          {
            action: 'call-service',
            service: 'script.save_print_history_archive_popup_edits'
          }
        ),
        buttonCard(
          'Close',
          'mdi:close',
          'rgba(255,255,255,0.04)',
          {
              action: 'fire-dom-event',
              browser_mod: {
                service: 'browser_mod.close_popup'
              }
          }
        )
      ];
      const cards = [
        {
          type: 'custom:print-history-photo-gallery-card',
          archive_json: variables?.archive_json || '{}',
          archive_entity: 'sensor.print_history_browser_page_archives',
          detail_entity: 'sensor.print_history_popup_archive_detail',
          api_base_entity: 'input_text.bambuddy_api_base_url',
          visibility_entity: 'input_boolean.print_history_show_images',
          include_thumbnail: true
        },
        {
          type: 'custom:button-card',
          template: 'print_history_archive_popup_content',
          entity: 'sensor.print_history_browser_page_archives',
          triggers_update: ['sensor.print_history_browser_page_archives'],
          variables: {
            archive_json: variables?.archive_json || '{}'
          },
          tap_action: { action: 'none' },
          hold_action: { action: 'none' }
        },
        {
          type: 'custom:print-history-tag-editor-card',
          entity: 'input_text.print_history_popup_tags',
          suggestions_entity: 'input_select.print_history_filter_tag',
          title: 'Tags',
          placeholder: 'Add a tag and press Enter',
          helper: 'Reuse an existing tag or create a new one. Press Enter or comma to add.'
        },
        {
          type: 'entities',
          show_header_toggle: false,
          entities: [
            {
              entity: 'input_text.print_history_popup_print_name',
              name: 'Print Name',
              icon: 'mdi:printer-3d'
            },
            {
              entity: 'input_select.print_history_popup_status',
              name: 'Status',
              icon: 'mdi:list-status'
            },
            {
              type: 'conditional',
              conditions: [
                {
                  condition: 'or',
                  conditions: [
                    {
                      condition: 'state',
                      entity: 'input_select.print_history_popup_status',
                      state: 'Failed'
                    },
                    {
                      condition: 'state',
                      entity: 'input_select.print_history_popup_status',
                      state: 'Cancelled'
                    }
                  ]
                }
              ],
              row: {
                entity: 'input_select.print_history_popup_failure_reason',
                name: 'Failure Reason',
                icon: 'mdi:alert-circle-outline'
              }
            },
            {
              entity: 'input_text.print_history_popup_notes',
              name: 'Notes',
              icon: 'mdi:text-box-outline'
            }
          ]
        },
        ...((printNameWasTrimmed || notesWereTrimmed || tagsWereTrimmed || hasCustomFailureReason) ? [{
          type: 'markdown',
          content: `${printNameWasTrimmed ? '- Print name was trimmed to the first 255 characters for editing.\n' : ''}${tagsWereTrimmed ? '- Tags were trimmed to the first 255 characters for editing.\n' : ''}${notesWereTrimmed ? '- Notes were trimmed to the first 255 characters for editing.\n' : ''}${hasCustomFailureReason ? '- A non-standard failure reason was preserved as an extra dropdown option because Bambuddy\'s API accepts arbitrary strings even though its UI uses a fixed list.\n' : ''}${(printNameWasTrimmed || tagsWereTrimmed || notesWereTrimmed) ? 'Home Assistant input_text helpers currently cap inline edits at 255 characters.' : ''}`
        }] : []),
        {
          type: 'grid',
          columns: archiveStatus === 'printing' ? 3 : 4,
          square: false,
          cards: actionCards
        }
      ];

      return {
        action: 'fire-dom-event',
        browser_mod: {
          service: 'browser_mod.sequence',
          data: {
            sequence: [
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: 'input_text.print_history_popup_archive_id',
                  value: String(archiveId)
                }
              },
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: 'input_text.print_history_popup_print_name',
                  value: editablePrintName
                }
              },
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: 'input_text.print_history_popup_tags',
                  value: editableTags
                }
              },
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: 'input_text.print_history_popup_notes',
                  value: editableNotes
                }
              },
              {
                service: 'input_select.set_options',
                data: {
                  entity_id: 'input_select.print_history_popup_status',
                  options: statusOptions
                }
              },
              {
                service: 'input_select.select_option',
                data: {
                  entity_id: 'input_select.print_history_popup_status',
                  option: formatStatusOption(archiveStatus || 'completed')
                }
              },
              {
                service: 'input_select.set_options',
                data: {
                  entity_id: 'input_select.print_history_popup_failure_reason',
                  options: failureReasonOptions
                }
              },
              {
                service: 'input_select.select_option',
                data: {
                  entity_id: 'input_select.print_history_popup_failure_reason',
                  option: selectedFailureReason
                }
              },
              {
                service: 'browser_mod.popup',
                data: {
                  title: archiveName,
                  size: 'normal',
                  content: {
                    type: 'vertical-stack',
                    cards
                  }
                }
              }
            ]
          }
        }
      };
    ]]]