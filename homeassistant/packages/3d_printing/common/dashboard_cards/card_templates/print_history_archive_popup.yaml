print_history_archive_popup:
  tap_action: |
    [[[ 
      let snapshotArchive = {};
      try {
        snapshotArchive = JSON.parse(variables?.archive_json || '{}');
      } catch (_error) {
        snapshotArchive = {};
      }
      const snapshotArchiveId = snapshotArchive?.id;
      let archive = snapshotArchive;
      try {
        const pageArchivesRaw = states['sensor.print_history_page_archives']?.attributes?.archives || '[]';
        const pageArchives = typeof pageArchivesRaw === 'string' ? JSON.parse(pageArchivesRaw || '[]') : pageArchivesRaw;
        if (Array.isArray(pageArchives) && snapshotArchiveId !== undefined && snapshotArchiveId !== null) {
          archive = pageArchives.find((item) => String(item?.id) === String(snapshotArchiveId)) || snapshotArchive;
        }
      } catch (_error) {
        archive = snapshotArchive;
      }

      const archiveId = archive?.id;
      if (!archiveId) {
        return { action: 'none' };
      }

      const archiveName = archive?.print_name || `Archive ${archiveId}`;
      const archiveTags = String(archive?.tags || '');
      const archiveNotes = String(archive?.notes || '');
      const editorTagLimit = 255;
      const editorNotesLimit = 255;
      const editableTags = archiveTags.slice(0, editorTagLimit);
      const editableNotes = archiveNotes.slice(0, editorNotesLimit);
      const notesWereTrimmed = archiveNotes.length > editorNotesLimit;
      const tagsWereTrimmed = archiveTags.length > editorTagLimit;
      const isFavorite = !!archive?.is_favorite;
      const liveArchiveResolver = `
        let snapshotArchive = {};
        try {
          snapshotArchive = JSON.parse(variables?.archive_json || '{}');
        } catch (_error) {
          snapshotArchive = {};
        }
        const resolvedArchiveId = variables?.archive_id || snapshotArchive?.id;
        let archive = snapshotArchive;
        try {
          const archiveCacheRaw = states['sensor.print_history_archives']?.attributes?.archives_json || '[]';
          const archiveCache = typeof archiveCacheRaw === 'string' ? JSON.parse(archiveCacheRaw || '[]') : archiveCacheRaw;
          if (Array.isArray(archiveCache) && resolvedArchiveId !== undefined && resolvedArchiveId !== null) {
            archive = archiveCache.find((item) => String(item?.id) === String(resolvedArchiveId)) || snapshotArchive;
          }
        } catch (_error) {
          archive = snapshotArchive;
        }
      `;
      const favoriteButtonCard = {
        type: 'custom:button-card',
        entity: 'sensor.print_history_archives',
        triggers_update: ['sensor.print_history_archives'],
        variables: {
          archive_json: variables?.archive_json || '{}',
          archive_id: String(archiveId)
        },
        name: 'Favorite',
        icon: `[[[ ${liveArchiveResolver} return archive?.is_favorite ? 'mdi:star' : 'mdi:star-outline'; ]]]`,
        show_name: true,
        show_icon: true,
        show_state: false,
        tap_action: {
          action: 'call-service',
          service: 'script.toggle_print_history_archive_favorite',
          data: {
            archive_id: String(archiveId)
          }
        },
        hold_action: { action: 'none' },
        styles: {
          card: [
            { padding: '12px 10px' },
            { 'border-radius': '16px' },
            { 'box-shadow': 'none' },
            { border: '1px solid rgba(255,255,255,0.08)' },
            { background: `[[[ ${liveArchiveResolver} return archive?.is_favorite ? 'rgba(245,194,66,0.18)' : 'rgba(255,255,255,0.04)'; ]]]` }
          ],
          grid: [
            { 'grid-template-areas': '"i" "n"' },
            { 'grid-template-columns': '1fr' },
            { 'justify-items': 'center' },
            { gap: '6px' }
          ],
          icon: [
            { width: '22px' },
            { height: '22px' },
            { color: `[[[ ${liveArchiveResolver} return archive?.is_favorite ? '#f5c242' : 'var(--primary-text-color)'; ]]]` }
          ],
          name: [
            { 'font-size': '12px' },
            { 'font-weight': '600' },
            { color: 'var(--primary-text-color)' }
          ]
        }
      };
      const buttonCard = (name, icon, background, tapAction) => ({
        type: 'custom:button-card',
        name,
        icon,
        show_name: true,
        show_icon: true,
        show_state: false,
        tap_action: tapAction,
        hold_action: { action: 'none' },
        styles: {
          card: [
            { padding: '12px 10px' },
            { 'border-radius': '16px' },
            { 'box-shadow': 'none' },
            { border: '1px solid rgba(255,255,255,0.08)' },
            { background }
          ],
          grid: [
            { 'grid-template-areas': '"i" "n"' },
            { 'grid-template-columns': '1fr' },
            { 'justify-items': 'center' },
            { gap: '6px' }
          ],
          icon: [
            { width: '22px' },
            { height: '22px' },
            { color: 'var(--primary-text-color)' }
          ],
          name: [
            { 'font-size': '12px' },
            { 'font-weight': '600' },
            { color: 'var(--primary-text-color)' }
          ]
        }
      });
      const cards = [
        {
          type: 'custom:button-card',
          template: 'print_history_archive_popup_content',
          entity: 'sensor.print_history_archives',
          triggers_update: ['sensor.print_history_archives'],
          variables: {
            archive_json: variables?.archive_json || '{}'
          },
          tap_action: { action: 'none' },
          hold_action: { action: 'none' }
        },
        {
          type: 'entities',
          title: 'Edit Tags & Notes',
          show_header_toggle: false,
          entities: [
            {
              entity: 'input_text.print_history_popup_tags',
              name: 'Tags',
              icon: 'mdi:tag-multiple-outline'
            },
            {
              entity: 'input_text.print_history_popup_notes',
              name: 'Notes',
              icon: 'mdi:text-box-outline'
            }
          ]
        },
        ...((notesWereTrimmed || tagsWereTrimmed) ? [{
          type: 'markdown',
          content: `${tagsWereTrimmed ? '- Tags were trimmed to the first 255 characters for editing.\n' : ''}${notesWereTrimmed ? '- Notes were trimmed to the first 255 characters for editing.\n' : ''}Home Assistant input_text helpers currently cap inline edits at 255 characters.`
        }] : []),
        {
          type: 'grid',
          columns: 3,
          square: false,
          cards: [
            favoriteButtonCard,
            buttonCard(
              'Save',
              'mdi:content-save-outline',
              'rgba(21,101,192,0.18)',
              {
                action: 'call-service',
                service: 'script.save_print_history_archive_popup_edits'
              }
            ),
            buttonCard(
              'Close',
              'mdi:close',
              'rgba(255,255,255,0.04)',
              {
                action: 'call-service',
                service: 'browser_mod.close_popup'
              }
            )
          ]
        }
      ];

      return {
        action: 'fire-dom-event',
        browser_mod: {
          service: 'browser_mod.sequence',
          data: {
            sequence: [
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: 'input_text.print_history_popup_archive_id',
                  value: String(archiveId)
                }
              },
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: 'input_text.print_history_popup_tags',
                  value: editableTags
                }
              },
              {
                service: 'input_text.set_value',
                data: {
                  entity_id: 'input_text.print_history_popup_notes',
                  value: editableNotes
                }
              },
              {
                service: 'browser_mod.popup',
                data: {
                  title: archiveName,
                  size: 'normal',
                  content: {
                    type: 'vertical-stack',
                    cards
                  }
                }
              }
            ]
          }
        }
      };
    ]]]