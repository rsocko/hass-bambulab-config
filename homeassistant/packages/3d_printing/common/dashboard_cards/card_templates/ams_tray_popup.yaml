                // --- Action toolbar (icon-above-text grid, app-style command bar) ---
                {
                  type: 'grid',
                  columns: 3 + (matchState === 'matched' ? 1 : 0) + (resetTrayAction ? 1 : 0),
                  square: false,
                  cards: [
                    // --- Replace Spool button (Phase 2) — only when tray has matched spool ---
                    ...(matchState === 'matched' ? [toolbarBtn('Replace', 'mdi:recycle-variant', {
                      action: 'fire-dom-event',
                      browser_mod: {
                        service: 'browser_mod.sequence',
                        data: {
                          sequence: [
                            { service: 'input_text.set_value', data: { entity_id: 'input_text.spool_replace_source_spool_id', value: String(spoolIdInt) } },
                            { service: 'input_text.set_value', data: { entity_id: 'input_text.spool_replace_target_spool_id', value: '' } },
                            { service: 'input_boolean.turn_on', data: { entity_id: 'input_boolean.spool_replace_copy_spool_type' } },
                            { service: 'input_boolean.turn_on', data: { entity_id: 'input_boolean.spool_replace_copy_clip_type' } },
                            { service: 'input_boolean.turn_on', data: { entity_id: 'input_boolean.spool_replace_copy_desiccant_present' } },
                            { service: 'input_boolean.turn_on', data: { entity_id: 'input_boolean.spool_replace_copy_location' } },
                            { service: 'input_boolean.turn_off', data: { entity_id: 'input_boolean.spool_replace_mark_used' } },
                            { service: 'input_boolean.turn_on', data: { entity_id: 'input_boolean.spool_replace_archive_source' } },
                            { service: 'input_select.select_option', data: { entity_id: 'input_select.spool_replace_desiccant_mode', option: 'Reset to today' } },
                            { service: 'input_number.set_value', data: { entity_id: 'input_number.spool_replace_wizard_step', value: 1 } },
                            { service: 'script.spool_replace_populate_candidates', data: { filament_id: String(filamentId) } },
                            { service: 'browser_mod.close_popup' },
                            { service: 'browser_mod.delay', data: { time: 500 } },
                            { service: 'browser_mod.popup', data: {
                              title: '♻ Replace Spool',
                              size: 'normal',
                              content: {
                                type: 'custom:button-card',
                                template: 'spool_replace_wizard',
                                tap_action: { action: 'none' }
                              }
                            }}
                          ]
                        }
                      }
                    })] : []),
                    toolbarBtn('Spoolman', 'fapro:filament-2', { action: 'url', url_path: SPOOLMAN_BASE_URL + '/' + spoolId }),
                    toolbarBtn('Reload', 'mdi:refresh', { action: 'fire-dom-event', browser_mod: { service: 'browser_mod.sequence', data: { sequence: [{ service: 'homeassistant.update_entity', data: { entity_id: spoolEntityId } }, { service: 'browser_mod.delay', data: { time: 1500 } }, { service: 'browser_mod.close_popup' }] } } }),
                    ...(resetTrayAction ? [toolbarBtn('Reset', 'mdi:delete-sweep', resetTrayAction, '#c62828')] : []),
                    toolbarBtn('Close', 'mdi:close-circle-outline', { action: 'fire-dom-event', browser_mod: { service: 'browser_mod.close_popup' } })
                  ]
                }
              ]
            }
                }
              }
            ]
          }
        }
      };
    ]]]
