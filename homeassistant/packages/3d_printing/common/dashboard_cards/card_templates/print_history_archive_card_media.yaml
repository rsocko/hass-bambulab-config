print_history_archive_card_media:
  template:
    - print_history_archive_popup
  type: custom:button-card
  triggers_update:
    - sensor.bambuddy_print_history_browser_page_archives
  show_icon: true
  show_name: false
  show_state: false
  show_label: false
  icon: |
    [[[ 
      let snapshotArchive = {};
      try {
        snapshotArchive = JSON.parse(variables?.archive_json || '{}');
      } catch (_error) {
        snapshotArchive = {};
      }
      const archiveId = snapshotArchive?.id;
      let archive = snapshotArchive;
      try {
        const pageArchivesRaw = states['sensor.bambuddy_print_history_browser_page_archives']?.attributes?.archives || '[]';
        const pageArchives = typeof pageArchivesRaw === 'string' ? JSON.parse(pageArchivesRaw || '[]') : pageArchivesRaw;
        if (Array.isArray(pageArchives) && archiveId !== undefined && archiveId !== null) {
          archive = pageArchives.find((item) => String(item?.id) === String(archiveId)) || snapshotArchive;
        }
      } catch (_error) {
        archive = snapshotArchive;
      }
      return archive?.is_favorite ? 'mdi:star' : 'mdi:star-outline';
    ]]]
  icon_tap_action:
    action: call-service
    service: script.toggle_print_history_archive_favorite
    data:
      archive_id: |
        [[[ 
          let archive = {};
          try {
            archive = JSON.parse(variables?.archive_json || '{}');
          } catch (_error) {
            archive = {};
          }
          return archive?.id ? String(archive.id) : '';
        ]]]
  custom_fields:
    body: |
      [[[ 
        let snapshotArchive = {};
        try {
          snapshotArchive = JSON.parse(variables?.archive_json || '{}');
        } catch (_error) {
          snapshotArchive = {};
        }
        const snapshotArchiveId = snapshotArchive?.id;
        let archive = snapshotArchive;
        try {
          const pageArchivesRaw = states['sensor.bambuddy_print_history_browser_page_archives']?.attributes?.archives || '[]';
          const pageArchives = typeof pageArchivesRaw === 'string' ? JSON.parse(pageArchivesRaw || '[]') : pageArchivesRaw;
          if (Array.isArray(pageArchives) && snapshotArchiveId !== undefined && snapshotArchiveId !== null) {
            archive = pageArchives.find((item) => String(item?.id) === String(snapshotArchiveId)) || snapshotArchive;
          }
        } catch (_error) {
          archive = snapshotArchive;
        }

        const normalizeStatus = (status) => {
          const raw = String(status || '').toLowerCase();
          if (raw === 'completed' || raw === 'success') return 'completed';
          if (raw === 'cancelled' || raw === 'aborted' || raw === 'stopped') return 'cancelled';
          return raw;
        };
        const status = normalizeStatus(archive?.status);
        const statusLabel = status === 'completed' ? 'Completed' : status === 'failed' ? 'Failed' : status === 'cancelled' ? 'Cancelled' : status === 'printing' ? 'Printing' : 'Unknown';
        const statusColor = status === 'completed' ? '#2E7D32' : status === 'failed' ? '#C62828' : status === 'cancelled' ? '#EF6C00' : status === 'printing' ? '#1565C0' : '#546E7A';
        const statusIcon = status === 'completed' ? '✅' : status === 'failed' ? '❌' : status === 'cancelled' ? '⛔' : status === 'printing' ? '🖨️' : '⏳';
        const ENRICHMENT_MARKER = '+>';
        const describeEnrichmentAmbiguity = (value) => {
          const normalized = String(value || '').trim();
          return ({
            a_tc: 'Multiple archived AMS trays matched type+color',
            a_fb: 'Multiple archived AMS trays matched archive-level fallback',
            s_uuid: 'Multiple Spoolman spools matched archived tray UUID',
            s_tc: 'Multiple Spoolman spools matched type+color'
          })[normalized] || normalized;
        };
        const normalizeHex = (value) => {
          const raw = String(value || '').trim().replace(/^#/, '').replace(/"/g, '');
          if (!raw) return '';
          const trimmed = raw.length === 8 ? raw.slice(0, 6) : raw;
          return /^[0-9a-fA-F]{6}$/.test(trimmed) ? `#${trimmed.toUpperCase()}` : '';
        };
        const splitArchiveNotes = (value) => {
          const raw = String(value || '');
          const markerIndex = raw.indexOf(ENRICHMENT_MARKER);
          if (markerIndex < 0) {
            return { payload: null };
          }
          const payloadRaw = raw.slice(markerIndex + ENRICHMENT_MARKER.length).trim();
          try {
            return {
              payload: payloadRaw ? JSON.parse(payloadRaw) : null
            };
          } catch (_error) {
            return { payload: null };
          }
        };
        const escapeHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
        const tagColorHelper = window.PrintHistoryTagColors;
        const tagColor = (tag) => tagColorHelper && typeof tagColorHelper.colorForTag === 'function'
          ? tagColorHelper.colorForTag(tag)
          : '#86EFAC';
        const formatDate = (value) => {
          if (!value) return 'Unknown';
          const raw = String(value);
          const normalized = /(?:Z|[+-]\d{2}:\d{2})$/.test(raw) ? raw : `${raw}Z`;
          const parsed = new Date(normalized);
          if (Number.isNaN(parsed.getTime())) return 'Unknown';
          return parsed.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        };
        const formatDuration = (secondsValue) => {
          const seconds = Number(secondsValue || 0);
          if (!seconds) return '-';
          if (seconds >= 3600) return `${Math.round((seconds / 3600) * 10) / 10}h`;
          return `${Math.round(seconds / 60)}m`;
        };
        const formatNumber = (value, digits = 1, suffix = '') => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `${numeric.toFixed(digits).replace(/\.0$/, '')}${suffix}`;
        };
        const formatCurrency = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `$${numeric.toFixed(2)}`;
        };
        const baseUrlRaw = states['input_text.bambuddy_api_base_url']?.state || '';
        const baseUrl = String(baseUrlRaw).replace(/\/$/, '');
        const systemTagPrefixes = ['f:', 's:', 'spoolman:', 'vendor:', 'material:', 'cost:', 'status:'];
        const systemTagValues = [];
        const isSystemTag = (tag) => {
          const normalized = String(tag || '').trim().toLowerCase();
          return systemTagValues.includes(normalized) || systemTagPrefixes.some((prefix) => normalized.startsWith(prefix));
        };
        const notesInfo = splitArchiveNotes(archive?.notes);
        const enrichmentPayload = notesInfo.payload;
        const enrichmentRows = Array.isArray(enrichmentPayload?.F) ? enrichmentPayload.F : [];
        const colors = String(archive?.filament_color || '').split(',').map((value) => normalizeHex(value)).filter(Boolean);
        const filamentChips = enrichmentRows.length
          ? enrichmentRows.map((item, index) => {
              const name = String(item?.n || '').trim() || `Filament ${index + 1}`;
              const tray = String(item?.t || '').trim();
              const hex = normalizeHex(item?.h);
              const ambiguity = describeEnrichmentAmbiguity(item?.am);
              return {
                dotColor: hex || 'rgba(255,255,255,0.2)',
                tooltip: [tray ? `${name} (${tray})` : name, hex, ambiguity].filter(Boolean).join(' | ') || name
              };
            })
          : colors.map((hex) => ({
              dotColor: hex,
              tooltip: hex
            }));
        const tags = String(archive?.tags || '').split(',').map((value) => value.trim()).filter(Boolean).filter((tag) => !isSystemTag(tag)).slice(0, 4);
        const showImages = states['input_boolean.print_history_show_images']?.state !== 'off';
        const thumbnailUrl = showImages && baseUrl && snapshotArchiveId ? `${baseUrl}/api/v1/archives/${snapshotArchiveId}/thumbnail` : '';
        const metadata = [archive?.filament_type || 'Unknown material', archive?.layer_height ? `${archive.layer_height}mm` : '', archive?.designer || ''].filter(Boolean).join(' · ');

        return `
          <div style="display:flex;flex-direction:column;gap:0;">
            <div style="display:grid;grid-template-columns:${thumbnailUrl ? 'minmax(148px, 188px) minmax(0, 1fr)' : 'minmax(0, 1fr)'};gap:16px 18px;align-items:flex-start;width:100%;min-width:0;">
              ${thumbnailUrl ? `<div style="min-width:0;width:100%;"><img src="${escapeHtml(thumbnailUrl)}" style="width:100%;height:132px;object-fit:cover;border-radius:16px;display:block;" alt="${escapeHtml(archive?.print_name || 'Archive thumbnail')}"></div>` : ''}
              <div style="padding:16px 2px 2px 0;display:flex;flex-direction:column;gap:10px;min-width:0;">
              <div style="display:flex;justify-content:space-between;gap:10px;row-gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0;">
                <div style="min-width:0;flex:1 1 220px;max-width:100%;">
                  <div style="font-weight:700;font-size:18px;line-height:1.2;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:100%;">${escapeHtml(archive?.print_name || 'Unnamed')}</div>
                  <div style="font-size:12px;color:var(--secondary-text-color);">${escapeHtml(formatDate(archive?.started_at || archive?.created_at))}</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;max-width:100%;margin-left:auto;">
                  <span style="background:${statusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">${statusIcon} ${escapeHtml(statusLabel)}</span>
                </div>
              </div>
              <div style="font-size:13px;color:var(--secondary-text-color);overflow-wrap:anywhere;">${escapeHtml(metadata || 'No additional metadata')}</div>
              <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;">
                <span>Duration: <strong>${escapeHtml(formatDuration(archive?.actual_time_seconds || archive?.print_time_seconds))}</strong></span>
                <span>Filament: <strong>${escapeHtml(formatNumber(archive?.filament_used_grams, 1, 'g'))}</strong></span>
                <span>Cost: <strong>${escapeHtml(formatCurrency(archive?.cost))}</strong></span>
              </div>
              ${filamentChips.length ? `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${filamentChips.slice(0, 6).map((chip) => `<span title="${escapeHtml(chip.tooltip)}" style="width:14px;height:14px;border-radius:999px;background:${escapeHtml(chip.dotColor)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span>`).join('')}</div>` : ''}
              ${tags.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">${tags.map((tag) => `<span style="background:${tagColor(tag)};color:#243242;border-radius:999px;padding:3px 8px;font-size:10px;box-shadow:inset 0 0 0 1px rgba(36,50,66,0.14);">${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
              ${archive?.failure_reason ? `<div style="font-size:12px;color:#ffb4ab;line-height:1.4;">${escapeHtml(archive.failure_reason)}</div>` : ''}
              </div>
            </div>
          </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"body i"'
      - grid-template-columns: minmax(0, 1fr) auto
      - align-items: start
    card:
      - width: 100%
      - min-width: 0
      - border: 1px solid var(--divider-color)
      - border-radius: 22px
      - background: var(--ha-card-background)
      - padding: 18px
      - box-sizing: border-box
      - overflow: hidden
      - justify-self: stretch
    img_cell:
      - align-self: start
      - justify-self: end
      - width: 28px
      - height: 28px
      - border-radius: 999px
      - overflow: hidden
      - padding-top: 2px
      - margin-left: 12px
    icon:
      - width: 22px
      - height: 22px
      - color: |
          [[[ 
            let snapshotArchive = {};
            try {
              snapshotArchive = JSON.parse(variables?.archive_json || '{}');
            } catch (_error) {
              snapshotArchive = {};
            }
            const archiveId = snapshotArchive?.id;
            let archive = snapshotArchive;
            try {
              const pageArchivesRaw = states['sensor.bambuddy_print_history_browser_page_archives']?.attributes?.archives || '[]';
              const pageArchives = typeof pageArchivesRaw === 'string' ? JSON.parse(pageArchivesRaw || '[]') : pageArchivesRaw;
              if (Array.isArray(pageArchives) && archiveId !== undefined && archiveId !== null) {
                archive = pageArchives.find((item) => String(item?.id) === String(archiveId)) || snapshotArchive;
              }
            } catch (_error) {
              archive = snapshotArchive;
            }
            return archive?.is_favorite ? '#f5c242' : 'var(--secondary-text-color)';
          ]]]
    custom_fields:
      body:
        - display: block
        - width: 100%
        - text-align: left