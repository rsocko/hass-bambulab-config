# catalog_filament_card_compact.yaml
# Compact hybrid catalog card for filament summary entries.

catalog_filament_card_compact:
  template:
    - catalog_filament_popup
  type: custom:button-card
  show_entity_picture: true
  show_icon: false
  show_name: true
  show_state: false
  show_label: true
  name: |
    [[[
      return entity?.attributes?.name || entity?.attributes?.friendly_name || 'Unknown Filament';
    ]]]
  label: |
    [[[
      const material = entity?.attributes?.material || '';
      const vendor = entity?.attributes?.vendor_name || '';
      return [material, vendor].filter(Boolean).join(' - ');
    ]]]
  custom_fields:
    zero_spools: |
      [[[
        const spoolCount = Number(states['sensor.spoolman_filament_totals']?.attributes?.totals?.[String(entity?.attributes?.id)]?.count || 0);
        const isZero = spoolCount === 0;
        const label = isZero ? 'ZERO SPOOLS' : `${spoolCount} ${spoolCount === 1 ? 'SPOOL' : 'SPOOLS'}`;
        const bg = isZero ? 'rgba(244,67,54,0.16)' : 'rgba(66,165,245,0.16)';
        const color = isZero ? '#f44336' : '#1E88E5';
        return `<span style="display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:999px;background:${bg};color:${color};font-size:10px;font-weight:700;letter-spacing:0.04em;">${label}</span>`;
      ]]]
    weight_status: |
      [[[
        const currentWeight = Number.parseFloat(entity?.state);
        const text = Number.isFinite(currentWeight) ? currentWeight.toFixed(0) + 'g' : '0g';
        const stockThreshold = parseFloat(states['input_number.filament_catalog_stock_threshold']?.state) || 150;
        const qty = parseInt(entity?.attributes?.extra_purchase_qty, 10) || 0;
        const spoolCount = Number(states['sensor.spoolman_filament_totals']?.attributes?.totals?.[String(entity?.attributes?.id)]?.count || 0);
        const aliases = {
          'not defined': 'Not Defined',
          'keep in stock': 'Keep In Stock',
          'maintain backup spool': 'Maintain Backup Spool',
          'max inventory': 'Max Inventory',
          'as needed': 'As Needed',
          'do not stock': 'Do Not Stock'
        };
        const rule = aliases[String(entity?.attributes?.extra_inventory_rule || '').trim().replace(/^"|"$/g, '').toLowerCase()] || 'Not Defined';
        const purchaseNeed = qty > 0 || ((rule === 'Keep In Stock' || rule === 'Not Defined') && (spoolCount < 1 || currentWeight < stockThreshold)) || (rule === 'Maintain Backup Spool' && (spoolCount < 2 || currentWeight < stockThreshold));
        return `<div style="display:flex;align-items:center;justify-content:center;gap:4px;"><span style="font-size:12px; font-weight:700; color:${purchaseNeed ? '#f44336' : 'var(--primary-text-color)'};">${text}</span></div>`;
      ]]]
    location_label: |
      [[[
        const spoolCount = Number(states['sensor.spoolman_filament_totals']?.attributes?.totals?.[String(entity?.attributes?.id)]?.count || 0);
        return `<span style="font-size:10px; color:var(--primary-text-color); opacity:0.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${spoolCount === 0 ? 'No Spools' : 'Filament Summary'}</span>`;
      ]]]
    purchase_status: |
      [[[
        const qty = parseInt(entity?.attributes?.extra_purchase_qty, 10) || 0;
        const stockThreshold = parseFloat(states['input_number.filament_catalog_stock_threshold']?.state) || 150;
        const spoolCount = Number(states['sensor.spoolman_filament_totals']?.attributes?.totals?.[String(entity?.attributes?.id)]?.count || 0);
        const currentWeight = Number.parseFloat(entity?.state) || 0;
        const aliases = {
          'not defined': 'Not Defined',
          'keep in stock': 'Keep In Stock',
          'maintain backup spool': 'Maintain Backup Spool',
          'max inventory': 'Max Inventory',
          'as needed': 'As Needed',
          'do not stock': 'Do Not Stock'
        };
        const rule = aliases[String(entity?.attributes?.extra_inventory_rule || '').trim().replace(/^"|"$/g, '').toLowerCase()] || 'Not Defined';
        const ruleShortage = ((rule === 'Keep In Stock' || rule === 'Not Defined') && (spoolCount < 1 || currentWeight < stockThreshold)) || (rule === 'Maintain Backup Spool' && (spoolCount < 2 || currentWeight < stockThreshold));
        const purchaseNeed = qty > 0 || ruleShortage;
        if (!purchaseNeed) return '';
        const color = ruleShortage ? '#C62828' : 'var(--accent-color)';
        const label = qty > 0 ? `Buy ${qty}` : (rule === 'Maintain Backup Spool' ? 'Backup Low' : 'Needs Purchase');
        return `<span style="font-size:10px; font-weight:700; color:${color}; white-space:nowrap;">${label}</span>`;
      ]]]
  styles:
    card:
      - padding: 8px 6px
      - border-radius: 8px
      - overflow: hidden
      - border-left: |
          [[[ 
            const qty = parseInt(entity?.attributes?.extra_purchase_qty, 10) || 0;
            const stockThreshold = parseFloat(states['input_number.filament_catalog_stock_threshold']?.state) || 150;
            const spoolCount = Number(states['sensor.spoolman_filament_totals']?.attributes?.totals?.[String(entity?.attributes?.id)]?.count || 0);
            const currentWeight = Number.parseFloat(entity?.state) || 0;
            const aliases = {
              'not defined': 'Not Defined',
              'keep in stock': 'Keep In Stock',
              'maintain backup spool': 'Maintain Backup Spool',
              'max inventory': 'Max Inventory',
              'as needed': 'As Needed',
              'do not stock': 'Do Not Stock'
            };
            const rule = aliases[String(entity?.attributes?.extra_inventory_rule || '').trim().replace(/^"|"$/g, '').toLowerCase()] || 'Not Defined';
            const ruleShortage = ((rule === 'Keep In Stock' || rule === 'Not Defined') && (spoolCount < 1 || currentWeight < stockThreshold)) || (rule === 'Maintain Backup Spool' && (spoolCount < 2 || currentWeight < stockThreshold));
            if (ruleShortage) return '3px solid #f44336';
            if (qty > 0) return '3px solid var(--accent-color)';
            if (spoolCount === 0) return '3px solid #f44336';
            return '3px solid transparent';
          ]]]
      - box-shadow: |
          [[[ 
            const qty = parseInt(entity?.attributes?.extra_purchase_qty, 10) || 0;
            const stockThreshold = parseFloat(states['input_number.filament_catalog_stock_threshold']?.state) || 150;
            const spoolCount = Number(states['sensor.spoolman_filament_totals']?.attributes?.totals?.[String(entity?.attributes?.id)]?.count || 0);
            const currentWeight = Number.parseFloat(entity?.state) || 0;
            const aliases = {
              'not defined': 'Not Defined',
              'keep in stock': 'Keep In Stock',
              'maintain backup spool': 'Maintain Backup Spool',
              'max inventory': 'Max Inventory',
              'as needed': 'As Needed',
              'do not stock': 'Do Not Stock'
            };
            const rule = aliases[String(entity?.attributes?.extra_inventory_rule || '').trim().replace(/^"|"$/g, '').toLowerCase()] || 'Not Defined';
            const purchaseNeed = qty > 0 || ((rule === 'Keep In Stock' || rule === 'Not Defined') && (spoolCount < 1 || currentWeight < stockThreshold)) || (rule === 'Maintain Backup Spool' && (spoolCount < 2 || currentWeight < stockThreshold));
            return purchaseNeed ? 'inset 0 0 0 1px rgba(244,67,54,0.28)' : 'none';
          ]]]
      - background: |
          [[[
            const singleHex = (entity?.attributes?.color_hex || '888888').replace('#', '');
            const r = parseInt(singleHex.substring(0, 2), 16) || 128;
            const g = parseInt(singleHex.substring(2, 4), 16) || 128;
            const b = parseInt(singleHex.substring(4, 6), 16) || 128;
            return `rgba(${r},${g},${b},0.18)`;
          ]]]
    grid:
      - grid-template-areas: |
          [[[ 
            const qty = parseInt(entity?.attributes?.extra_purchase_qty, 10) || 0;
            const stockThreshold = parseFloat(states['input_number.filament_catalog_stock_threshold']?.state) || 150;
            const spoolCount = Number(states['sensor.spoolman_filament_totals']?.attributes?.totals?.[String(entity?.attributes?.id)]?.count || 0);
            const currentWeight = Number.parseFloat(entity?.state) || 0;
            const aliases = {
              'not defined': 'Not Defined',
              'keep in stock': 'Keep In Stock',
              'maintain backup spool': 'Maintain Backup Spool',
              'max inventory': 'Max Inventory',
              'as needed': 'As Needed',
              'do not stock': 'Do Not Stock'
            };
            const rule = aliases[String(entity?.attributes?.extra_inventory_rule || '').trim().replace(/^"|"$/g, '').toLowerCase()] || 'Not Defined';
            const purchaseNeed = qty > 0 || ((rule === 'Keep In Stock' || rule === 'Not Defined') && (spoolCount < 1 || currentWeight < stockThreshold)) || (rule === 'Maintain Backup Spool' && (spoolCount < 2 || currentWeight < stockThreshold));
            return purchaseNeed ? '"n" "i" "l" "zero_spools" "weight_status" "location_label" "purchase_status"' : '"n" "i" "l" "zero_spools" "weight_status" "location_label"';
          ]]]
      - grid-template-columns: 1fr
      - grid-template-rows: auto auto auto auto auto auto auto
      - justify-items: center
      - gap: 4px 0
    entity_picture:
      - width: 48px
      - height: 48px
      - border-radius: 50%
      - border: |
          [[[
            const hex = (entity?.attributes?.color_hex || '888888').replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16) || 128;
            const g = parseInt(hex.substring(2, 4), 16) || 128;
            const b = parseInt(hex.substring(4, 6), 16) || 128;
            return `2px solid rgba(${r},${g},${b},0.6)`;
          ]]]
    name:
      - font-size: 12px
      - font-weight: 600
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - text-align: center
      - color: var(--primary-text-color)
    label:
      - font-size: 10px
      - color: var(--primary-text-color)
      - opacity: 0.55
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - text-align: center
    custom_fields:
      zero_spools:
        - text-align: center
      weight_status:
        - text-align: center
      location_label:
        - text-align: center
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis
      purchase_status:
        - text-align: center