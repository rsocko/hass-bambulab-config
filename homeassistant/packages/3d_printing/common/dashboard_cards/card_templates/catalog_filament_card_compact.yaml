# catalog_filament_card_compact.yaml
# Compact hybrid catalog card for filament entities that currently have zero spools.

catalog_filament_card_compact:
  template:
    - catalog_filament_popup
  type: custom:button-card
  show_entity_picture: true
  show_icon: false
  show_name: true
  show_state: false
  show_label: true
  name: |
    [[[
      return entity?.attributes?.name || entity?.attributes?.friendly_name || 'Unknown Filament';
    ]]]
  label: |
    [[[
      const material = entity?.attributes?.material || '';
      const vendor = entity?.attributes?.vendor_name || '';
      return [material, vendor].filter(Boolean).join(' - ');
    ]]]
  custom_fields:
    zero_spools: |
      [[[
        return '<span style="display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:999px;background:rgba(244,67,54,0.16);color:#f44336;font-size:10px;font-weight:700;letter-spacing:0.04em;">ZERO SPOOLS</span>';
      ]]]
    weight_status: |
      [[[
        const currentWeight = Number.parseFloat(entity?.state);
        const text = Number.isFinite(currentWeight) ? currentWeight.toFixed(0) + 'g' : '0g';
        return `<div style="display:flex;align-items:center;justify-content:center;gap:4px;"><span style="font-size:12px; font-weight:700; color:#f44336;">${text}</span></div>`;
      ]]]
    location_label: |
      [[[
        return '<span style="font-size:10px; color:var(--primary-text-color); opacity:0.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">No Spools</span>';
      ]]]
  styles:
    card:
      - padding: 8px 6px
      - border-radius: 8px
      - overflow: hidden
      - border-left: 3px solid #f44336
      - box-shadow: inset 0 0 0 1px rgba(244,67,54,0.28)
      - background: |
          [[[
            const singleHex = (entity?.attributes?.color_hex || '888888').replace('#', '');
            const r = parseInt(singleHex.substring(0, 2), 16) || 128;
            const g = parseInt(singleHex.substring(2, 4), 16) || 128;
            const b = parseInt(singleHex.substring(4, 6), 16) || 128;
            return `rgba(${r},${g},${b},0.18)`;
          ]]]
    grid:
      - grid-template-areas: '"n" "i" "l" "zero_spools" "weight_status" "location_label"'
      - grid-template-columns: 1fr
      - grid-template-rows: auto auto auto auto auto auto
      - justify-items: center
      - gap: 4px 0
    entity_picture:
      - width: 48px
      - height: 48px
      - border-radius: 50%
      - border: |
          [[[
            const hex = (entity?.attributes?.color_hex || '888888').replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16) || 128;
            const g = parseInt(hex.substring(2, 4), 16) || 128;
            const b = parseInt(hex.substring(4, 6), 16) || 128;
            return `2px solid rgba(${r},${g},${b},0.6)`;
          ]]]
    name:
      - font-size: 12px
      - font-weight: 600
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - text-align: center
      - color: var(--primary-text-color)
    label:
      - font-size: 10px
      - color: var(--primary-text-color)
      - opacity: 0.55
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - text-align: center
    custom_fields:
      zero_spools:
        - text-align: center
      weight_status:
        - text-align: center
      location_label:
        - text-align: center
        - max-width: 100%
        - overflow: hidden
        - text-overflow: ellipsis