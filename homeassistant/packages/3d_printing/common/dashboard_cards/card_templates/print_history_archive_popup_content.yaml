                  <span class="print-history-popup-timeline-tooltip-wrap print-history-popup-timeline-legend-wrap" tabindex="0" aria-label="Timeline color legend">
                    <span class="print-history-popup-timeline-legend"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:16px;color:var(--secondary-text-color);"></ha-icon></span>
                    <span class="print-history-popup-timeline-tooltip print-history-popup-timeline-legend-tooltip">${timelineLegendMarkup}</span>
                  </span>
                </div>
                <div class="print-history-popup-timeline-main">
                  <div class="print-history-popup-timeline-track">
                    <span style="position:absolute;left:${timelineStartPosition}%;right:${100 - timelineEndPosition}%;top:50%;height:2px;border-radius:999px;background:rgba(255,255,255,0.18);transform:translateY(-50%);"></span>
                    ${beforeOverflowMarkup}
                    ${startTimelineMarkup}
                    ${timelineDotMarkup}
                    ${endTimelineMarkup}
                    ${afterOverflowMarkup}
                  </div>
                </div>
                <div class="print-history-popup-timeline-side print-history-popup-timeline-side--end">
                  <div class="print-history-popup-timeline-label">End</div>
                  <div class="print-history-popup-timeline-value">${escapeHtml(completedDisplay)}</div>
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${summaryRowChips}</div>
              ${metricChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${metricChips}</div>` : ''}
              ${printerDetailChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${printerDetailChips}</div>` : ''}
              ${duplicateDetailChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${duplicateDetailChips}</div>` : ''}
              ${duplicateState.hasDuplicateContext ? `<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:14px;background:${duplicateState.panelBackground};border:1px solid ${duplicateState.panelBorder};"><ha-icon icon="${escapeHtml(duplicateState.icon)}" style="--mdc-icon-size:16px;color:${duplicateState.panelIconColor};margin-top:1px;"></ha-icon><div style="font-size:12px;line-height:1.45;color:#E0F2F1;overflow-wrap:anywhere;">${escapeHtml(duplicateState.summary)}</div></div>` : ''}
              ${archiveError.hasArchiveError ? `<div style="display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:16px;background:${archiveError.background};border:1px solid ${archiveError.border};"><div style="display:flex;align-items:flex-start;gap:10px;"><ha-icon icon="mdi:alert-circle-outline" style="--mdc-icon-size:18px;color:${archiveError.color};margin-top:1px;"></ha-icon><div style="display:flex;flex-direction:column;gap:4px;min-width:0;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:${archiveError.color};">Archive Issue</div><div style="font-size:13px;line-height:1.5;color:${archiveError.color};overflow-wrap:anywhere;">${escapeHtml(archiveError.summary)}</div></div></div>${archiveError.chips.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;">${archiveError.chips.map((chip) => `<span style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);font-size:12px;font-weight:600;color:${archiveError.color};">${escapeHtml(chip)}</span>`).join('')}</div>` : ''}</div>` : ''}
            </div>
                  ${!hasEnrichmentPayload && filamentChips.length ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Filament Colors</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${filamentChips.map((chip) => `<span title="${escapeHtml(chip.tooltip)}" style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);padding:6px 10px;border-radius:999px;"><span style="width:14px;height:14px;border-radius:999px;background:${escapeHtml(chip.dotColor)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span><span style="font-size:12px;">${escapeHtml(chip.label)}</span></span>`).join('')}</div></div>` : ''}
                ${hasEnrichmentPayload || hasEnrichmentData ? `<div style="display:flex;flex-direction:column;gap:10px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Enrichment</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">${enrichmentSourceLabel ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(21,101,192,0.16);color:#BBDEFB;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentSourceLabel)}</span>` : ''}<span style="background:${enrichmentStatusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentStatusLabel)}</span>${enrichmentRows.length ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);color:var(--secondary-text-color);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(String(enrichmentRows.length))} row${enrichmentRows.length === 1 ? '' : 's'}</span>` : ''}</div></div>${enrichmentReason ? `<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:14px;background:${enrichmentStatus === 'complete' ? 'rgba(21,101,192,0.12)' : 'rgba(239,108,0,0.12)'};border:1px solid ${enrichmentStatus === 'complete' ? 'rgba(21,101,192,0.28)' : 'rgba(239,108,0,0.28)'};"><ha-icon icon="${enrichmentStatus === 'complete' ? 'mdi:information-outline' : 'mdi:alert-outline'}" style="--mdc-icon-size:16px;color:${enrichmentStatus === 'complete' ? '#90CAF9' : '#FFCC80'};margin-top:1px;"></ha-icon><div style="font-size:12px;line-height:1.45;color:${enrichmentStatus === 'complete' ? '#E3F2FD' : '#FFE0B2'};overflow-wrap:anywhere;">${escapeHtml(enrichmentReason)}</div></div>` : ''}</div>` : ''}
                ${archiveUserNotes ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Notes</div><div style="font-size:14px;line-height:1.5;overflow-wrap:anywhere;">${escapeHtml(archiveUserNotes)}</div></div>` : ''}
            ${archive?.failure_reason ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Failure Reason</div><div style="font-size:14px;line-height:1.5;color:#ffb4ab;overflow-wrap:anywhere;">${escapeHtml(archive.failure_reason)}</div></div>` : ''}
          </div>`;
      ]]]