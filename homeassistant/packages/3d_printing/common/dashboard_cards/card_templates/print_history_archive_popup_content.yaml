        const archivedAmsJson = stringifyJsonPreview(archivedAmsDisclosureUsesRawBlob ? archivedRawAms : archivedAmsTrayRows);
        const archivedAmsDisclosureLabel = 'Archived AMS evidence JSON';
        const enrichmentDetailToggleHandler = 'event.preventDefault();event.stopPropagation();const shell=this.closest(".print-history-popup-enrichment-shell");if(shell){const isOpen=shell.classList.toggle("is-open");this.setAttribute("aria-expanded",isOpen?"true":"false");const label=this.querySelector(".print-history-popup-enrichment-toggle-label");if(label){label.textContent=isOpen?"Hide Details":"Show Details";}const rowCount=Number(this.dataset.rowCount||"0");this.setAttribute("title",`${isOpen?"Hide details":"Show details"}${rowCount>0?` (${rowCount} row${rowCount===1?"":"s"})`:""}`);}return false;';
        const renderJsonDisclosure = (label, content) => `<div class="print-history-popup-json-disclosure"><button class="print-history-popup-json-toggle" type="button" aria-expanded="false" onclick='${escapeHtml(disclosureToggleHandler)}'><span class="print-history-popup-json-toggle-icon" aria-hidden="true">▸</span><span class="print-history-popup-json-toggle-label">${escapeHtml(label)}</span></button><pre>${escapeHtml(content || '[]')}</pre></div>`;
        const enrichmentEvidenceMarkup = enrichmentRowsWithState.length
          ? `<div class="print-history-popup-match-grid">${enrichmentRowsWithState.map(({ item, provenanceRow, storedWhy, reviewReasons, filamentHex }) => {
              const name = String(item?.n || 'Unknown filament').trim();
              const tray = String(item?.t || '').trim();
              const spoolLabel = hasResolvedEntityId(item?.s) ? `Spool #${String(item.s).trim()}` : 'Spool unresolved';
              const filamentLabel = hasResolvedEntityId(item?.f) ? `Filament #${String(item.f).trim()}` : 'Filament unresolved';
              const weightLabel = formatNumber(item?.w, 1, 'g');
              const markers = [
                provenanceRow?.spool_match_method || item?.sm ? `sm:${String(provenanceRow?.spool_match_method || item?.sm).trim()}` : '',
                provenanceRow?.filament_match_method || item?.fm ? `fm:${String(provenanceRow?.filament_match_method || item?.fm).trim()}` : '',
                provenanceRow?.provenance_marker || item?.pm ? `pm:${String(provenanceRow?.provenance_marker || item?.pm).trim()}` : '',
                provenanceRow?.ambiguity_code || item?.am ? `am:${String(provenanceRow?.ambiguity_code || item?.am).trim()}` : ''
              ].filter(Boolean);
              return `<div class="print-history-popup-match-card" style="background:${filamentHex ? rgbaFromHex(filamentHex, 0.12, 'rgba(255,255,255,0.04)') : 'rgba(255,255,255,0.04)'};border-color:${filamentHex ? rgbaFromHex(filamentHex, 0.45, 'rgba(255,255,255,0.12)') : 'rgba(255,255,255,0.12)'};"><div class="print-history-popup-match-card-header"><div class="print-history-popup-match-card-title-wrap"><div class="print-history-popup-match-card-title">${escapeHtml(tray ? `${name} [${tray}]` : name)}</div><div class="print-history-popup-match-card-meta">${escapeHtml([weightLabel, spoolLabel, filamentLabel].filter(Boolean).join(' • '))}</div></div>${markers.length ? `<div class="print-history-popup-match-markers">${markers.map((marker) => `<span class="print-history-popup-match-marker">${escapeHtml(marker)}</span>`).join('')}</div>` : ''}</div><div class="print-history-popup-match-card-body">${storedWhy.map((line) => `<div class="print-history-popup-match-copy">${escapeHtml(line)}</div>`).join('')}${reviewReasons.length ? `<div class="print-history-popup-match-review">Needs review: ${escapeHtml(reviewReasons.join(' • '))}</div>` : ''}</div></div>`;
            }).join('')}</div>`
          : '';
        const colors = String(archive?.filament_color || '')
          .split(',')
