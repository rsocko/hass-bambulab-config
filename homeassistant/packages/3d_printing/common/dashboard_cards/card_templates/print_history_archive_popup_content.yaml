print_history_archive_popup_content:
  entity: sensor.print_history_archives
  triggers_update:
    - sensor.print_history_archives
  show_icon: false
  show_name: false
  show_state: false
  styles:
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0
      - margin: 0
    grid:
      - grid-template-areas: '"content"'
      - grid-template-columns: 1fr
    custom_fields:
      content:
        - padding: 0
        - margin: 0
  custom_fields:
    content: |
      [[[ 
        let snapshotArchive = {};
        try {
          snapshotArchive = JSON.parse(variables?.archive_json || '{}');
        } catch (_error) {
          snapshotArchive = {};
        }
        const snapshotArchiveId = snapshotArchive?.id;
        let archive = snapshotArchive;
        try {
          const archiveCacheRaw = states['sensor.print_history_archives']?.attributes?.archives_json || '[]';
          const archiveCache = typeof archiveCacheRaw === 'string' ? JSON.parse(archiveCacheRaw || '[]') : archiveCacheRaw;
          if (Array.isArray(archiveCache) && snapshotArchiveId !== undefined && snapshotArchiveId !== null) {
            archive = archiveCache.find((item) => String(item?.id) === String(snapshotArchiveId)) || snapshotArchive;
          }
        } catch (_error) {
          archive = snapshotArchive;
        }

        const baseUrlRaw = states['input_text.bambuddy_api_base_url']?.state || '';
        const baseUrl = String(baseUrlRaw).replace(/\/$/, '');
        const archiveId = archive?.id;
        const ENRICHMENT_MARKER = '[HA_ENRICHMENT_V1]';
        const LEGACY_MARKER = '--- HA Enrichment ---';
        const normalizeStatus = (status) => {
          const raw = String(status || '').toLowerCase();
          if (raw === 'completed' || raw === 'success') return 'completed';
          if (raw === 'cancelled' || raw === 'aborted' || raw === 'stopped') return 'cancelled';
          return raw;
        };
        const splitArchiveNotes = (value) => {
          const raw = String(value || '');
          const markerIndex = raw.indexOf(ENRICHMENT_MARKER);
          const legacyIndex = raw.indexOf(LEGACY_MARKER);
          const indexes = [markerIndex, legacyIndex].filter((index) => index >= 0);
          if (!indexes.length) {
            return { userNotes: raw.trimEnd(), payload: null };
          }
          const cutoff = Math.min(...indexes);
          const userNotes = raw.slice(0, cutoff).replace(/\n+$/u, '');
          if (cutoff !== markerIndex) {
            return { userNotes, payload: null };
          }
          const payloadRaw = raw.slice(markerIndex + ENRICHMENT_MARKER.length).trim();
          try {
            return {
              userNotes,
              payload: payloadRaw ? JSON.parse(payloadRaw) : null
            };
          } catch (_error) {
            return { userNotes, payload: null };
          }
        };
        const status = normalizeStatus(archive?.status);
        const statusLabel = status === 'completed'
          ? 'Completed'
          : status === 'cancelled'
            ? 'Cancelled'
          : status === 'failed'
            ? 'Failed'
            : status === 'printing'
                ? 'Printing'
                : (status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Unknown');
        const statusColor = status === 'completed'
          ? '#2E7D32'
          : status === 'cancelled'
            ? '#EF6C00'
          : status === 'failed'
            ? '#C62828'
            : status === 'printing'
                ? '#1565C0'
                : '#546E7A';
        const statusIcon = status === 'completed'
          ? '✅'
          : status === 'cancelled'
            ? '⛔'
          : status === 'failed'
            ? '❌'
            : status === 'printing'
                ? '🖨️'
                : '⏳';
        const escapeHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
        const formatDate = (value) => {
          if (!value) return '-';
          const parsed = new Date(value);
          if (Number.isNaN(parsed.getTime())) return '-';
          return parsed.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        };
        const formatDuration = (secondsValue) => {
          const seconds = Number(secondsValue || 0);
          if (!seconds) return '-';
          if (seconds >= 3600) return `${Math.round((seconds / 3600) * 10) / 10}h`;
          return `${Math.round(seconds / 60)}m`;
        };
        const formatNumber = (value, digits = 1, suffix = '') => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `${numeric.toFixed(digits).replace(/\.0$/, '')}${suffix}`;
        };
        const formatCurrency = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `$${numeric.toFixed(2)}`;
        };
        const parseTags = (value) => String(value || '')
          .split(',')
          .map((tag) => tag.trim())
          .filter(Boolean);
        const isSystemTag = (tag) => {
          const value = String(tag || '');
          return value.startsWith('Filament:')
            || value.startsWith('Spool:')
            || value === 'ha_enriched:true'
            || value.startsWith('spoolman:')
            || value.startsWith('vendor:')
            || value.startsWith('material:')
            || value.startsWith('status:')
            || value.startsWith('cost:');
        };

        const thumbnailUrl = baseUrl && archiveId
          ? `${baseUrl}/api/v1/archives/${archiveId}/thumbnail`
          : '';
        const metadataRows = [
          ['Started', formatDate(archive?.started_at)],
          ['Completed', formatDate(archive?.completed_at)],
          ['Duration', formatDuration(archive?.actual_time_seconds || archive?.print_time_seconds)],
          ['Filament', formatNumber(archive?.filament_used_grams, 1, 'g')],
          ['Cost', formatCurrency(archive?.cost)],
          ['Objects', archive?.object_count || '-'],
          ['Material', archive?.filament_type || '-'],
          ['Layer Height', archive?.layer_height ? `${archive.layer_height} mm` : '-'],
          ['Nozzle', archive?.nozzle_diameter ? `${archive.nozzle_diameter} mm` : '-'],
          ['Total Layers', archive?.total_layers || '-'],
          ['Printer', archive?.printer_id || '-'],
          ['Designer', archive?.designer || '-']
        ];
        const notesInfo = splitArchiveNotes(archive?.notes);
        const enrichmentPayload = notesInfo.payload;
        const enrichmentRows = Array.isArray(enrichmentPayload?.Filaments) ? enrichmentPayload.Filaments : [];
        const enrichmentStatusRaw = String(enrichmentPayload?.status || '').toLowerCase();
        const enrichmentStatusLabel = enrichmentStatusRaw
          ? enrichmentStatusRaw.charAt(0).toUpperCase() + enrichmentStatusRaw.slice(1)
          : 'Unavailable';
        const enrichmentStatusColor = enrichmentStatusRaw === 'complete'
          ? '#2E7D32'
          : enrichmentStatusRaw === 'partial'
            ? '#EF6C00'
            : '#546E7A';
        const tags = parseTags(archive?.tags).filter((tag) => !isSystemTag(tag));
        const colors = String(archive?.filament_color || '')
          .split(',')
          .map((value) => value.trim())
          .filter(Boolean);

        return `
          <div style="display:flex;flex-direction:column;gap:14px;">
            ${thumbnailUrl ? `<img src="${escapeHtml(thumbnailUrl)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:16px;display:block;" alt="${escapeHtml(archive?.print_name || 'Archive thumbnail')}">` : ''}
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
              <span style="background:${statusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">${statusIcon} ${escapeHtml(statusLabel)}</span>
              <span style="display:inline-flex;align-items:center;gap:6px;color:${archive?.is_favorite ? '#f5c242' : 'var(--secondary-text-color)'};font-size:13px;font-weight:700;">
                <ha-icon icon="${archive?.is_favorite ? 'mdi:star' : 'mdi:star-outline'}" style="--mdc-icon-size:16px;"></ha-icon>
                ${archive?.is_favorite ? 'Favorite' : ''}
              </span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;">
              ${metadataRows.map(([label, value]) => `
                <div style="padding:12px 14px;border-radius:14px;background:rgba(255,255,255,0.04);">
                  <div style="color:var(--secondary-text-color);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">${escapeHtml(label)}</div>
                  <div style="font-size:14px;line-height:1.4;overflow-wrap:anywhere;">${escapeHtml(String(value))}</div>
                </div>`).join('')}
            </div>
            ${colors.length ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Filament Colors</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${colors.map((hex) => `<span style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);padding:6px 10px;border-radius:999px;"><span style="width:14px;height:14px;border-radius:999px;background:${escapeHtml(hex)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span><span style="font-size:12px;">${escapeHtml(hex)}</span></span>`).join('')}</div></div>` : ''}
            ${enrichmentRows.length || enrichmentPayload ? `<div style="display:flex;flex-direction:column;gap:10px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Enrichment</div><span style="background:${enrichmentStatusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentStatusLabel)}</span></div>${enrichmentRows.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">${enrichmentRows.map((item) => `<div style="padding:12px 14px;border-radius:14px;background:rgba(255,255,255,0.04);display:flex;flex-direction:column;gap:8px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><div style="font-size:14px;font-weight:700;overflow-wrap:anywhere;">${escapeHtml(item?.name || 'Unknown Filament')}</div><div style="font-size:12px;color:var(--secondary-text-color);">${escapeHtml(String(item?.tray || '-'))}</div></div><div style="display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--secondary-text-color);"><span>${escapeHtml(formatNumber(item?.weight, 1, 'g'))}</span><span>${item?.s != null ? `Spool #${escapeHtml(String(item.s))}` : 'Spool unresolved'}</span><span>${item?.f != null ? `Filament #${escapeHtml(String(item.f))}` : 'Filament unresolved'}</span></div>${item?.h ? `<div style="display:inline-flex;align-items:center;gap:8px;width:max-content;background:rgba(255,255,255,0.04);padding:4px 8px;border-radius:999px;"><span style="width:12px;height:12px;border-radius:999px;background:${escapeHtml(String(item.h))};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span><span style="font-size:12px;">${escapeHtml(String(item.h))}</span></div>` : ''}</div>`).join('')}</div>` : `<div style="font-size:13px;color:var(--secondary-text-color);">No structured filament rows were preserved for this archive.</div>`}</div>` : ''}
            ${tags.length ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Tags</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${tags.map((tag) => `<span style="background:#1565C0;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;">${escapeHtml(tag)}</span>`).join('')}</div></div>` : ''}
            ${notesInfo.userNotes ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Notes</div><div style="font-size:14px;line-height:1.5;overflow-wrap:anywhere;">${escapeHtml(notesInfo.userNotes)}</div></div>` : ''}
            ${archive?.failure_reason ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Failure Reason</div><div style="font-size:14px;line-height:1.5;color:#ffb4ab;overflow-wrap:anywhere;">${escapeHtml(archive.failure_reason)}</div></div>` : ''}
          </div>`;
      ]]]