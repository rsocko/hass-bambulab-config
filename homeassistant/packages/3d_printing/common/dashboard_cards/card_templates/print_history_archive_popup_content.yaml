print_history_archive_popup_content:
  entity: sensor.print_history_archives
  triggers_update:
    - sensor.print_history_archives
  show_icon: false
  show_name: false
  show_state: false
  styles:
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0
      - margin: 0
    grid:
      - grid-template-areas: '"content"'
      - grid-template-columns: 1fr
    custom_fields:
      content:
        - padding: 0
        - margin: 0
  custom_fields:
    content: |
      [[[ 
        let snapshotArchive = {};
        try {
          snapshotArchive = JSON.parse(variables?.archive_json || '{}');
        } catch (_error) {
          snapshotArchive = {};
        }
        const snapshotArchiveId = snapshotArchive?.id;
        let archive = snapshotArchive;
        try {
          const archiveCacheRaw = states['sensor.print_history_archives']?.attributes?.archives_json || '[]';
          const archiveCache = typeof archiveCacheRaw === 'string' ? JSON.parse(archiveCacheRaw || '[]') : archiveCacheRaw;
          if (Array.isArray(archiveCache) && snapshotArchiveId !== undefined && snapshotArchiveId !== null) {
            archive = archiveCache.find((item) => String(item?.id) === String(snapshotArchiveId)) || snapshotArchive;
          }
        } catch (_error) {
          archive = snapshotArchive;
        }

        const baseUrlRaw = states['input_text.bambuddy_api_base_url']?.state || '';
        const baseUrl = String(baseUrlRaw).replace(/\/$/, '');
        const archiveId = archive?.id;
        const ENRICHMENT_MARKER = '+>';
        const RECOVERY_MARKER = '[RECOVERY_AUDIT_V1]';
        const describeEnrichmentAmbiguity = (value) => {
          const normalized = String(value || '').trim();
          return ({
            a_tc: 'Multiple archived AMS trays matched type+color',
            a_fb: 'Multiple archived AMS trays matched archive-level fallback',
            s_uuid: 'Multiple Spoolman spools matched archived tray UUID',
            s_tc: 'Multiple Spoolman spools matched type+color'
          })[normalized] || normalized;
        };
        const normalizeStatus = (status) => {
          const raw = String(status || '').toLowerCase();
          if (raw === 'completed' || raw === 'success') return 'completed';
          if (raw === 'cancelled' || raw === 'aborted' || raw === 'stopped') return 'cancelled';
          return raw;
        };
        const normalizeHex = (value) => {
          const raw = String(value || '').trim().replace(/^#/, '').replace(/"/g, '');
          if (!raw) return '';
          const trimmed = raw.length === 8 ? raw.slice(0, 6) : raw;
          return /^[0-9a-fA-F]{6}$/.test(trimmed) ? `#${trimmed.toUpperCase()}` : '';
        };
        const hexToRgb = (value) => {
          const normalized = normalizeHex(value);
          if (!normalized) return null;
          const raw = normalized.slice(1);
          return {
            r: parseInt(raw.slice(0, 2), 16),
            g: parseInt(raw.slice(2, 4), 16),
            b: parseInt(raw.slice(4, 6), 16)
          };
        };
        const rgbaFromHex = (value, alpha, fallback) => {
          const rgb = hexToRgb(value);
          if (!rgb) return fallback;
          return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
        };
        const splitArchiveNotes = (value) => {
          const raw = String(value || '');
          const markerIndex = raw.indexOf(ENRICHMENT_MARKER);
          const recoveryIndex = raw.indexOf(RECOVERY_MARKER);
          const indexes = [markerIndex, recoveryIndex].filter((index) => index >= 0);
          if (!indexes.length) {
            return { userNotes: raw.trimEnd(), payload: null };
          }
          const cutoff = Math.min(...indexes);
          const userNotes = raw.slice(0, cutoff).replace(/\n+$/u, '');
          const payloadRaw = markerIndex >= 0 ? raw.slice(markerIndex + ENRICHMENT_MARKER.length).trim() : '';
          try {
            return {
              userNotes,
              payload: payloadRaw ? JSON.parse(payloadRaw) : null
            };
          } catch (_error) {
            return { userNotes, payload: null };
          }
        };
        const status = normalizeStatus(archive?.status);
        const statusLabel = status === 'completed'
          ? 'Completed'
          : status === 'cancelled'
            ? 'Cancelled'
          : status === 'failed'
            ? 'Failed'
            : status === 'printing'
                ? 'Printing'
                : (status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Unknown');
        const statusColor = status === 'completed'
          ? '#2E7D32'
          : status === 'cancelled'
            ? '#EF6C00'
          : status === 'failed'
            ? '#C62828'
            : status === 'printing'
                ? '#1565C0'
                : '#546E7A';
        const statusIcon = status === 'completed'
          ? '✅'
          : status === 'cancelled'
            ? '⛔'
          : status === 'failed'
            ? '❌'
            : status === 'printing'
                ? '🖨️'
                : '⏳';
        const escapeHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
        const formatDate = (value) => {
          if (!value) return '-';
          const raw = String(value);
          const normalized = /(?:Z|[+-]\d{2}:\d{2})$/.test(raw) ? raw : `${raw}Z`;
          const parsed = new Date(normalized);
          if (Number.isNaN(parsed.getTime())) return '-';
          return parsed.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        };
          const formatTimelineDate = (value) => {
            if (!value) return '-';
            const raw = String(value);
            const normalized = /(?:Z|[+-]\d{2}:\d{2})$/.test(raw) ? raw : `${raw}Z`;
            const parsed = new Date(normalized);
            if (Number.isNaN(parsed.getTime())) return '-';
            return parsed.toLocaleString('en-US', {
              month: 'short',
              day: 'numeric',
              hour: 'numeric',
              minute: '2-digit'
            });
          };
        const formatDuration = (secondsValue) => {
          const seconds = Number(secondsValue || 0);
          if (!seconds) return '-';
          if (seconds >= 3600) return `${Math.round((seconds / 3600) * 10) / 10}h`;
          return `${Math.round(seconds / 60)}m`;
        };
          const formatTimelineDuration = (secondsValue) => {
            const seconds = Number(secondsValue || 0);
            if (!Number.isFinite(seconds) || seconds <= 0) return '-';
            const totalMinutes = Math.max(1, Math.round(seconds / 60));
            const days = Math.floor(totalMinutes / 1440);
            const hours = Math.floor((totalMinutes % 1440) / 60);
            const minutes = totalMinutes % 60;
            const parts = [];
            if (days) parts.push(`${days}D`);
            if (hours || days) parts.push(`${hours}H`);
            if (minutes || (!days && !hours)) parts.push(`${minutes}M`);
            return parts.join(' ');
          };
        const formatNumber = (value, digits = 1, suffix = '') => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `${numeric.toFixed(digits).replace(/\.0$/, '')}${suffix}`;
        };
        const formatCurrency = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `$${numeric.toFixed(2)}`;
        };
          const formatCurrencyValue = (value) => {
            const numeric = Number(value);
            if (!Number.isFinite(numeric) || numeric <= 0) return '-';
            return numeric.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
          };
          const renderInfoChip = (icon, value, options = {}) => {
            if (!hasMeaningfulValue(value)) return '';
            const background = options.background || 'rgba(255,255,255,0.05)';
            const border = options.border || '1px solid rgba(255,255,255,0.08)';
            const color = options.color || 'var(--primary-text-color)';
            const fontWeight = options.fontWeight || 600;
            const title = options.title ? ` title="${escapeHtml(options.title)}"` : '';
            return `<span${title} style="display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:${background};border:${border};color:${color};font-size:12px;font-weight:${fontWeight};line-height:1.2;max-width:100%;min-width:0;"><ha-icon icon="${icon}" style="--mdc-icon-size:15px;flex:0 0 auto;color:${color};"></ha-icon><span style="min-width:0;overflow-wrap:anywhere;word-break:break-word;">${escapeHtml(String(value))}</span></span>`;
        };
        const hasMeaningfulValue = (value) => {
          if (value === null || value === undefined) return false;
          const normalized = String(value).trim().toLowerCase();
          return !['', 'none', 'null', 'unknown', 'unavailable'].includes(normalized);
        };
        const hasResolvedEntityId = (value) => {
          if (value === null || value === undefined) return false;
          const normalized = String(value).trim().toLowerCase();
          return normalized !== '' && normalized !== 'null' && normalized !== 'none';
        };
        const getEnrichmentReviewReasons = (item) => {
          const reviewReasons = [];
          if (!hasMeaningfulValue(item?.t)) reviewReasons.push('Tray unresolved');
          if (!hasResolvedEntityId(item?.s)) reviewReasons.push('Spool unresolved');
          if (!hasResolvedEntityId(item?.f)) reviewReasons.push('Filament unresolved');
          if (String(item?.am || '').trim()) reviewReasons.push(describeEnrichmentAmbiguity(item?.am));
          return reviewReasons;
        };

        const startedDisplay = formatTimelineDate(archive?.started_at || archive?.created_at);
        const completedDisplay = archive?.completed_at
          ? formatTimelineDate(archive.completed_at)
          : (status === 'printing' ? 'In progress' : '-');
        const timelineDuration = formatTimelineDuration(archive?.actual_time_seconds || archive?.print_time_seconds);
        const timelineStartColor = '#1565C0';
        const timelineEndColor = status === 'completed'
          ? '#2E7D32'
          : (status === 'failed' || status === 'cancelled')
            ? '#C62828'
            : '#78909C';
        const favoriteChip = `<span title="${archive?.is_favorite ? 'Favorite archive' : 'Not marked as favorite'}" style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:${archive?.is_favorite ? 'rgba(245,194,66,0.18)' : 'rgba(255,255,255,0.05)'};border:1px solid ${archive?.is_favorite ? 'rgba(245,194,66,0.35)' : 'rgba(255,255,255,0.08)'};flex:0 0 auto;"><ha-icon icon="${archive?.is_favorite ? 'mdi:star' : 'mdi:star-outline'}" style="--mdc-icon-size:18px;color:${archive?.is_favorite ? '#f5c242' : 'var(--secondary-text-color)'};"></ha-icon></span>`;
        const summaryRowChips = [
          `<span style="background:${statusColor};color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;line-height:1.2;"><span>${statusIcon}</span><span>${escapeHtml(statusLabel)}</span></span>`,
          renderInfoChip('mdi:palette-swatch-outline', archive?.designer, { fontWeight: 500 }),
          favoriteChip
        ].filter(Boolean).join('');
        const metricChips = [
          renderInfoChip('mdi:weight-gram', formatNumber(archive?.filament_used_grams, 1, 'g')),
          Number(archive?.object_count || 0) > 1 ? renderInfoChip('mdi:shape-outline', `${archive.object_count} objects`) : '',
          renderInfoChip('mdi:currency-usd', formatCurrencyValue(archive?.cost)),
          renderInfoChip('mdi:flask-outline', archive?.filament_type)
        ].filter(Boolean).join('');
        const printerDetailChips = [
          renderInfoChip('mdi:printer-3d', archive?.printer_name || archive?.printer_id),
          renderInfoChip('mdi:printer-3d-nozzle', archive?.nozzle_diameter ? `${archive.nozzle_diameter} mm` : ''),
          renderInfoChip('mdi:layers-outline', archive?.total_layers || ''),
          renderInfoChip('mdi:arrow-expand-vertical', archive?.layer_height ? `${archive.layer_height} mm` : '')
        ].filter(Boolean).join('');
        const notesInfo = splitArchiveNotes(archive?.notes);
        const archiveUserNotes = String(archive?.user_notes || notesInfo.userNotes || '').trim();
        const enrichmentRows = Array.isArray(archive?.enrichment_filaments)
          ? archive.enrichment_filaments
          : Array.isArray(notesInfo.payload?.F)
            ? notesInfo.payload.F
            : [];
        const enrichmentStatusCode = String(archive?.enrichment_status || notesInfo.payload?.s || '').toLowerCase();
        const enrichmentStatusRaw = ({ c: 'complete', p: 'partial', u: 'unavailable' })[enrichmentStatusCode] || '';
        const enrichmentReason = String(archive?.enrichment_reason || notesInfo.payload?.reason || '').trim();
        const enrichmentSource = String(archive?.enrichment_source || notesInfo.payload?.src || '').trim();
        const hasEnrichmentPayload = Boolean(notesInfo.payload)
          || Array.isArray(archive?.enrichment_filaments)
          || Boolean(String(archive?.enrichment_status || archive?.enrichment_reason || archive?.enrichment_source || '').trim());
        const enrichmentRowsWithState = enrichmentRows.map((item) => {
          const reviewReasons = getEnrichmentReviewReasons(item);
          const filamentHex = normalizeHex(item?.h);
          const needsReview = reviewReasons.length > 0;
          return {
            item,
            reviewReasons,
            needsReview,
            filamentHex,
            cardBackground: filamentHex
              ? rgbaFromHex(filamentHex, 0.18, 'rgba(255,255,255,0.04)')
              : 'rgba(255,255,255,0.04)',
            cardBorder: filamentHex
              ? rgbaFromHex(filamentHex, 0.72, 'rgba(255,255,255,0.14)')
              : 'rgba(255,255,255,0.14)',
            railColor: needsReview
              ? 'rgba(245,124,0,0.92)'
              : 'transparent'
          };
        });
        const hasEnrichmentData = enrichmentRows.length > 0;
        const enrichmentStatus = (() => {
          if (enrichmentStatusRaw === 'complete' || enrichmentStatusRaw === 'partial') return enrichmentStatusRaw;
          if (enrichmentStatusRaw === 'unavailable' && hasEnrichmentData) return 'partial';
          if (enrichmentStatusRaw === 'unavailable') return 'unavailable';
          if (!hasEnrichmentData) return 'unavailable';
          return enrichmentRowsWithState.some((row) => row.needsReview) ? 'partial' : 'complete';
        })();
        const enrichmentStatusLabel = enrichmentStatus === 'complete'
          ? 'Complete'
          : enrichmentStatus === 'partial'
            ? 'Partial'
            : 'Unavailable';
        const enrichmentStatusColor = enrichmentStatus === 'complete'
          ? '#2E7D32'
          : enrichmentStatus === 'partial'
            ? '#F57C00'
            : '#546E7A';
        const enrichmentSourceLabel = enrichmentSource === 'at1'
          ? 'Archive-level fallback'
          : enrichmentSource === 'afs'
            ? 'Archived slot rows'
            : '';
        const colors = String(archive?.filament_color || '')
          .split(',')
          .map((value) => normalizeHex(value))
          .filter(Boolean);
        const filamentChips = enrichmentRows.length
          ? enrichmentRows.map((item, index) => {
              const name = String(item?.n || '').trim() || `Filament ${index + 1}`;
              const tray = String(item?.t || '').trim();
              const hex = normalizeHex(item?.h);
              const ambiguity = describeEnrichmentAmbiguity(item?.am);
              return {
                key: `${name}-${tray || index}`,
                label: tray ? `${name} (${tray})` : name,
                dotColor: hex || 'rgba(255,255,255,0.2)',
                tooltip: [hex, ambiguity].filter(Boolean).join(' | ')
              };
            })
          : colors.map((hex, index) => ({
              key: `fallback-${hex}-${index}`,
              label: hex,
              dotColor: hex,
              tooltip: hex
            }));

        return `
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);">
              <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px) minmax(0,1fr);gap:12px;align-items:center;min-width:0;">
                <div style="min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;">
                  <div style="font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--secondary-text-color);">Start</div>
                  <div style="font-size:13px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;">${escapeHtml(startedDisplay)}</div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;gap:8px;min-width:220px;">
                  <div style="position:relative;width:100%;height:18px;">
                    <span style="position:absolute;left:4px;right:4px;top:50%;height:2px;border-radius:999px;background:rgba(255,255,255,0.18);transform:translateY(-50%);"></span>
                    <span style="position:absolute;left:0;top:50%;width:10px;height:10px;border-radius:999px;background:${timelineStartColor};transform:translateY(-50%);box-shadow:0 0 0 4px rgba(21,101,192,0.12);"></span>
                    <span style="position:absolute;right:0;top:50%;width:10px;height:10px;border-radius:999px;background:${timelineEndColor};transform:translateY(-50%);box-shadow:0 0 0 4px rgba(255,255,255,0.08);"></span>
                  </div>
                  <span style="display:inline-flex;align-items:center;justify-content:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.08);font-size:12px;font-weight:700;letter-spacing:0.04em;">${escapeHtml(timelineDuration)}</span>
                </div>
                <div style="min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;">
                  <div style="font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--secondary-text-color);">End</div>
                  <div style="font-size:13px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;">${escapeHtml(completedDisplay)}</div>
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${summaryRowChips}</div>
              ${metricChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${metricChips}</div>` : ''}
              ${printerDetailChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${printerDetailChips}</div>` : ''}
            </div>
                  ${!hasEnrichmentPayload && filamentChips.length ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Filament Colors</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${filamentChips.map((chip) => `<span title="${escapeHtml(chip.tooltip)}" style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);padding:6px 10px;border-radius:999px;"><span style="width:14px;height:14px;border-radius:999px;background:${escapeHtml(chip.dotColor)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span><span style="font-size:12px;">${escapeHtml(chip.label)}</span></span>`).join('')}</div></div>` : ''}
                ${hasEnrichmentPayload || hasEnrichmentData ? `<div style="display:flex;flex-direction:column;gap:10px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Enrichment</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">${enrichmentSourceLabel ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(21,101,192,0.16);color:#BBDEFB;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentSourceLabel)}</span>` : ''}<span style="background:${enrichmentStatusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentStatusLabel)}</span></div></div>${enrichmentReason ? `<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:14px;background:${enrichmentStatus === 'complete' ? 'rgba(21,101,192,0.12)' : 'rgba(239,108,0,0.12)'};border:1px solid ${enrichmentStatus === 'complete' ? 'rgba(21,101,192,0.28)' : 'rgba(239,108,0,0.28)'};"><ha-icon icon="${enrichmentStatus === 'complete' ? 'mdi:information-outline' : 'mdi:alert-outline'}" style="--mdc-icon-size:16px;color:${enrichmentStatus === 'complete' ? '#90CAF9' : '#FFCC80'};margin-top:1px;"></ha-icon><div style="font-size:12px;line-height:1.45;color:${enrichmentStatus === 'complete' ? '#E3F2FD' : '#FFE0B2'};overflow-wrap:anywhere;">${escapeHtml(enrichmentReason)}</div></div>` : ''}${enrichmentRowsWithState.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">${enrichmentRowsWithState.map(({ item, reviewReasons, needsReview, filamentHex, cardBackground, cardBorder, railColor }) => `<div style="padding:12px 14px 12px 16px;border-radius:14px;background:${cardBackground};border:1px solid ${cardBorder};box-shadow:${needsReview ? `inset 4px 0 0 ${railColor}` : 'none'};display:flex;flex-direction:column;gap:8px;"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;"><div style="font-size:14px;font-weight:700;overflow-wrap:anywhere;">${escapeHtml(item?.n || 'Unknown Filament')}</div><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">${hasMeaningfulValue(item?.t) ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);color:var(--secondary-text-color);padding:4px 8px;border-radius:999px;font-size:12px;">${escapeHtml(String(item.t))}</span>` : ''}${needsReview ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(245,124,0,0.18);color:#FFCC80;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;"><ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:14px;"></ha-icon><span>Needs Review</span></span>` : ''}</div></div><div style="display:flex;flex-wrap:wrap;gap:8px;font-size:12px;"><span style="color:var(--secondary-text-color);">${escapeHtml(formatNumber(item?.w, 1, 'g'))}</span>${hasResolvedEntityId(item?.s) ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);color:var(--secondary-text-color);padding:4px 8px;border-radius:999px;">Spool #${escapeHtml(String(item.s))}</span>` : `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(245,124,0,0.18);color:#FFCC80;padding:4px 8px;border-radius:999px;font-weight:700;"><ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:14px;"></ha-icon><span>Spool unresolved</span></span>`}${hasResolvedEntityId(item?.f) ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);color:var(--secondary-text-color);padding:4px 8px;border-radius:999px;">Filament #${escapeHtml(String(item.f))}</span>` : `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(245,124,0,0.18);color:#FFCC80;padding:4px 8px;border-radius:999px;font-weight:700;"><ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:14px;"></ha-icon><span>Filament unresolved</span></span>`}</div>${filamentHex ? `<div style="display:inline-flex;align-items:center;gap:8px;width:max-content;background:rgba(255,255,255,0.08);padding:4px 8px;border-radius:999px;"><span style="width:12px;height:12px;border-radius:999px;background:${escapeHtml(filamentHex)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span><span style="font-size:12px;">${escapeHtml(filamentHex)}</span></div>` : ''}${item?.am ? `<div style="display:inline-flex;align-items:center;gap:8px;width:max-content;background:rgba(239,108,0,0.16);color:#FFCC80;padding:4px 8px;border-radius:999px;font-size:12px;"><ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:14px;"></ha-icon><span>${escapeHtml(describeEnrichmentAmbiguity(item?.am))}</span></div>` : ''}${reviewReasons.length ? `<div style="font-size:12px;line-height:1.4;color:var(--secondary-text-color);overflow-wrap:anywhere;">${escapeHtml(reviewReasons.join(' • '))}</div>` : ''}</div>`).join('')}</div>` : `<div style="font-size:13px;color:var(--secondary-text-color);">${escapeHtml(enrichmentReason || 'No structured filament rows were preserved for this archive.')}</div>`}</div>` : ''}
                ${archiveUserNotes ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Notes</div><div style="font-size:14px;line-height:1.5;overflow-wrap:anywhere;">${escapeHtml(archiveUserNotes)}</div></div>` : ''}
            ${archive?.failure_reason ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Failure Reason</div><div style="font-size:14px;line-height:1.5;color:#ffb4ab;overflow-wrap:anywhere;">${escapeHtml(archive.failure_reason)}</div></div>` : ''}
          </div>`;
      ]]]