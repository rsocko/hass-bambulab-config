print_history_archive_popup_content:
  entity: sensor.print_history_archives
  triggers_update:
    - sensor.print_history_archives
  show_icon: false
  show_name: false
  show_state: false
  styles:
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0
      - margin: 0
    grid:
      - grid-template-areas: '"content"'
      - grid-template-columns: 1fr
    custom_fields:
      content:
        - padding: 0
        - margin: 0
  custom_fields:
    content: |
      [[[ 
        let snapshotArchive = {};
        try {
          snapshotArchive = JSON.parse(variables?.archive_json || '{}');
        } catch (_error) {
          snapshotArchive = {};
        }
        const snapshotArchiveId = snapshotArchive?.id;
        let archive = snapshotArchive;
        try {
          const archiveCacheRaw = states['sensor.print_history_archives']?.attributes?.archives_json || '[]';
          const archiveCache = typeof archiveCacheRaw === 'string' ? JSON.parse(archiveCacheRaw || '[]') : archiveCacheRaw;
          if (Array.isArray(archiveCache) && snapshotArchiveId !== undefined && snapshotArchiveId !== null) {
            archive = archiveCache.find((item) => String(item?.id) === String(snapshotArchiveId)) || snapshotArchive;
          }
        } catch (_error) {
          archive = snapshotArchive;
        }

        const baseUrlRaw = states['input_text.bambuddy_api_base_url']?.state || '';
        const baseUrl = String(baseUrlRaw).replace(/\/$/, '');
        const archiveId = archive?.id;
        const ENRICHMENT_MARKER = '+>';
        const RECOVERY_MARKER = '[RECOVERY_AUDIT_V1]';
        const describeEnrichmentAmbiguity = (value) => {
          const normalized = String(value || '').trim();
          return ({
            a_tc: 'Multiple archived AMS trays matched type+color',
            a_fb: 'Multiple archived AMS trays matched archive-level fallback',
            s_uuid: 'Multiple Spoolman spools matched archived tray UUID',
            s_tc: 'Multiple Spoolman spools matched type+color'
          })[normalized] || normalized;
        };
        const normalizeStatus = (status) => {
          const raw = String(status || '').toLowerCase();
          if (raw === 'completed' || raw === 'success') return 'completed';
          if (raw === 'cancelled' || raw === 'aborted' || raw === 'stopped') return 'cancelled';
          return raw;
        };
        const normalizeHex = (value) => {
          const raw = String(value || '').trim().replace(/^#/, '').replace(/"/g, '');
          if (!raw) return '';
          const trimmed = raw.length === 8 ? raw.slice(0, 6) : raw;
          return /^[0-9a-fA-F]{6}$/.test(trimmed) ? `#${trimmed.toUpperCase()}` : '';
        };
        const splitArchiveNotes = (value) => {
          const raw = String(value || '');
          const markerIndex = raw.indexOf(ENRICHMENT_MARKER);
          const recoveryIndex = raw.indexOf(RECOVERY_MARKER);
          const indexes = [markerIndex, recoveryIndex].filter((index) => index >= 0);
          if (!indexes.length) {
            return { userNotes: raw.trimEnd(), payload: null };
          }
          const cutoff = Math.min(...indexes);
          const userNotes = raw.slice(0, cutoff).replace(/\n+$/u, '');
          const payloadRaw = markerIndex >= 0 ? raw.slice(markerIndex + ENRICHMENT_MARKER.length).trim() : '';
          try {
            return {
              userNotes,
              payload: payloadRaw ? JSON.parse(payloadRaw) : null
            };
          } catch (_error) {
            return { userNotes, payload: null };
          }
        };
        const status = normalizeStatus(archive?.status);
        const statusLabel = status === 'completed'
          ? 'Completed'
          : status === 'cancelled'
            ? 'Cancelled'
          : status === 'failed'
            ? 'Failed'
            : status === 'printing'
                ? 'Printing'
                : (status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Unknown');
        const statusColor = status === 'completed'
          ? '#2E7D32'
          : status === 'cancelled'
            ? '#EF6C00'
          : status === 'failed'
            ? '#C62828'
            : status === 'printing'
                ? '#1565C0'
                : '#546E7A';
        const statusIcon = status === 'completed'
          ? '✅'
          : status === 'cancelled'
            ? '⛔'
          : status === 'failed'
            ? '❌'
            : status === 'printing'
                ? '🖨️'
                : '⏳';
        const escapeHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
        const formatDate = (value) => {
          if (!value) return '-';
          const raw = String(value);
          const normalized = /(?:Z|[+-]\d{2}:\d{2})$/.test(raw) ? raw : `${raw}Z`;
          const parsed = new Date(normalized);
          if (Number.isNaN(parsed.getTime())) return '-';
          return parsed.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        };
        const formatDuration = (secondsValue) => {
          const seconds = Number(secondsValue || 0);
          if (!seconds) return '-';
          if (seconds >= 3600) return `${Math.round((seconds / 3600) * 10) / 10}h`;
          return `${Math.round(seconds / 60)}m`;
        };
        const formatNumber = (value, digits = 1, suffix = '') => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `${numeric.toFixed(digits).replace(/\.0$/, '')}${suffix}`;
        };
        const formatCurrency = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `$${numeric.toFixed(2)}`;
        };
        const parseTags = (value) => String(value || '')
          .split(',')
          .map((tag) => tag.trim())
          .filter(Boolean);
        const systemTagPrefixes = ['f:', 's:', 'spoolman:', 'vendor:', 'material:', 'cost:', 'status:'];
        const systemTagValues = [];
        const isSystemTag = (tag) => {
          const normalized = String(tag || '').trim().toLowerCase();
          return systemTagValues.includes(normalized) || systemTagPrefixes.some((prefix) => normalized.startsWith(prefix));
        };
        const tagPalette = ['#86EFAC', '#93C5FD', '#F9A8D4', '#7DD3FC', '#C4B5FD', '#FCD34D', '#4ADE80', '#60A5FA', '#EC4899', '#38BDF8', '#A78BFA', '#F59E0B'];
        const tagColor = (tag) => {
          const normalized = String(tag || '').trim().toLowerCase();
          if (!normalized) return tagPalette[0];
          let hash = 0;
          for (let index = 0; index < normalized.length; index += 1) {
            hash = ((hash << 5) - hash + normalized.charCodeAt(index)) >>> 0;
          }
          return tagPalette[hash % tagPalette.length];
        };
        const hasMeaningfulValue = (value) => {
          if (value === null || value === undefined) return false;
          const normalized = String(value).trim().toLowerCase();
          return !['', 'none', 'null', 'unknown', 'unavailable'].includes(normalized);
        };
        const hasResolvedEntityId = (value) => {
          if (value === null || value === undefined) return false;
          const normalized = String(value).trim().toLowerCase();
          return normalized !== '' && normalized !== 'null' && normalized !== 'none';
        };
        const getEnrichmentReviewReasons = (item) => {
          const reviewReasons = [];
          if (!hasMeaningfulValue(item?.t)) reviewReasons.push('Tray unresolved');
          if (!hasResolvedEntityId(item?.s)) reviewReasons.push('Spool unresolved');
          if (!hasResolvedEntityId(item?.f)) reviewReasons.push('Filament unresolved');
          if (String(item?.am || '').trim()) reviewReasons.push(describeEnrichmentAmbiguity(item?.am));
          return reviewReasons;
        };

        const thumbnailUrl = baseUrl && archiveId
          ? `${baseUrl}/api/v1/archives/${archiveId}/thumbnail`
          : '';
        const metadataRows = [
          ['Started', formatDate(archive?.started_at)],
          ['Completed', formatDate(archive?.completed_at)],
          ['Duration', formatDuration(archive?.actual_time_seconds || archive?.print_time_seconds)],
          ['Filament', formatNumber(archive?.filament_used_grams, 1, 'g')],
          ['Cost', formatCurrency(archive?.cost)],
          ['Objects', archive?.object_count || '-'],
          ['Material', archive?.filament_type || '-'],
          ['Layer Height', archive?.layer_height ? `${archive.layer_height} mm` : '-'],
          ['Nozzle', archive?.nozzle_diameter ? `${archive.nozzle_diameter} mm` : '-'],
          ['Total Layers', archive?.total_layers || '-'],
          ['Printer', archive?.printer_id || '-'],
          ['Designer', archive?.designer || '-']
        ];
        const notesInfo = splitArchiveNotes(archive?.notes);
        const archiveUserNotes = String(archive?.user_notes || notesInfo.userNotes || '').trim();
        const enrichmentRows = Array.isArray(archive?.enrichment_filaments)
          ? archive.enrichment_filaments
          : Array.isArray(notesInfo.payload?.F)
            ? notesInfo.payload.F
            : [];
        const enrichmentStatusCode = String(archive?.enrichment_status || notesInfo.payload?.s || '').toLowerCase();
        const enrichmentStatusRaw = ({ c: 'complete', p: 'partial', u: 'unavailable' })[enrichmentStatusCode] || '';
        const enrichmentReason = String(archive?.enrichment_reason || notesInfo.payload?.reason || '').trim();
        const enrichmentSource = String(archive?.enrichment_source || notesInfo.payload?.src || '').trim();
        const hasEnrichmentPayload = Boolean(notesInfo.payload)
          || Array.isArray(archive?.enrichment_filaments)
          || Boolean(String(archive?.enrichment_status || archive?.enrichment_reason || archive?.enrichment_source || '').trim());
        const enrichmentRowsWithState = enrichmentRows.map((item) => {
          const reviewReasons = getEnrichmentReviewReasons(item);
          return {
            item,
            reviewReasons,
            needsReview: reviewReasons.length > 0
          };
        });
        const hasEnrichmentData = enrichmentRows.length > 0;
        const enrichmentStatus = (() => {
          if (enrichmentStatusRaw === 'complete' || enrichmentStatusRaw === 'partial') return enrichmentStatusRaw;
          if (enrichmentStatusRaw === 'unavailable' && hasEnrichmentData) return 'partial';
          if (enrichmentStatusRaw === 'unavailable') return 'unavailable';
          if (!hasEnrichmentData) return 'unavailable';
          return enrichmentRowsWithState.some((row) => row.needsReview) ? 'partial' : 'complete';
        })();
        const enrichmentStatusLabel = enrichmentStatus === 'complete'
          ? 'Complete'
          : enrichmentStatus === 'partial'
            ? 'Partial'
            : 'Unavailable';
        const enrichmentStatusColor = enrichmentStatus === 'complete'
          ? '#2E7D32'
          : enrichmentStatus === 'partial'
            ? '#F57C00'
            : '#546E7A';
        const enrichmentSourceLabel = enrichmentSource === 'at1'
          ? 'Archive-level fallback'
          : enrichmentSource === 'afs'
            ? 'Archived slot rows'
            : '';
        const tags = parseTags(archive?.tags).filter((tag) => !isSystemTag(tag));
        const colors = String(archive?.filament_color || '')
          .split(',')
          .map((value) => normalizeHex(value))
          .filter(Boolean);
        const filamentChips = enrichmentRows.length
          ? enrichmentRows.map((item, index) => {
              const name = String(item?.n || '').trim() || `Filament ${index + 1}`;
              const tray = String(item?.t || '').trim();
              const hex = normalizeHex(item?.h);
              const ambiguity = describeEnrichmentAmbiguity(item?.am);
              return {
                key: `${name}-${tray || index}`,
                label: tray ? `${name} (${tray})` : name,
                dotColor: hex || 'rgba(255,255,255,0.2)',
                tooltip: [hex, ambiguity].filter(Boolean).join(' | ')
              };
            })
          : colors.map((hex, index) => ({
              key: `fallback-${hex}-${index}`,
              label: hex,
              dotColor: hex,
              tooltip: hex
            }));

        return `
          <div style="display:flex;flex-direction:column;gap:14px;">
            ${thumbnailUrl ? `<img src="${escapeHtml(thumbnailUrl)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:16px;display:block;" alt="${escapeHtml(archive?.print_name || 'Archive thumbnail')}">` : ''}
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
              <span style="background:${statusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">${statusIcon} ${escapeHtml(statusLabel)}</span>
              <span style="display:inline-flex;align-items:center;gap:6px;color:${archive?.is_favorite ? '#f5c242' : 'var(--secondary-text-color)'};font-size:13px;font-weight:700;">
                <ha-icon icon="${archive?.is_favorite ? 'mdi:star' : 'mdi:star-outline'}" style="--mdc-icon-size:16px;"></ha-icon>
                ${archive?.is_favorite ? 'Favorite' : ''}
              </span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;">
              ${metadataRows.map(([label, value]) => `
                <div style="padding:12px 14px;border-radius:14px;background:rgba(255,255,255,0.04);">
                  <div style="color:var(--secondary-text-color);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">${escapeHtml(label)}</div>
                  <div style="font-size:14px;line-height:1.4;overflow-wrap:anywhere;">${escapeHtml(String(value))}</div>
                </div>`).join('')}
            </div>
                  ${!hasEnrichmentPayload && filamentChips.length ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Filament Colors</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${filamentChips.map((chip) => `<span title="${escapeHtml(chip.tooltip)}" style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);padding:6px 10px;border-radius:999px;"><span style="width:14px;height:14px;border-radius:999px;background:${escapeHtml(chip.dotColor)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span><span style="font-size:12px;">${escapeHtml(chip.label)}</span></span>`).join('')}</div></div>` : ''}
                ${hasEnrichmentPayload || hasEnrichmentData ? `<div style="display:flex;flex-direction:column;gap:10px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Enrichment</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">${enrichmentSourceLabel ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(21,101,192,0.16);color:#BBDEFB;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentSourceLabel)}</span>` : ''}<span style="background:${enrichmentStatusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentStatusLabel)}</span></div></div>${enrichmentReason ? `<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:14px;background:${enrichmentStatus === 'complete' ? 'rgba(21,101,192,0.12)' : 'rgba(239,108,0,0.12)'};border:1px solid ${enrichmentStatus === 'complete' ? 'rgba(21,101,192,0.28)' : 'rgba(239,108,0,0.28)'};"><ha-icon icon="${enrichmentStatus === 'complete' ? 'mdi:information-outline' : 'mdi:alert-outline'}" style="--mdc-icon-size:16px;color:${enrichmentStatus === 'complete' ? '#90CAF9' : '#FFCC80'};margin-top:1px;"></ha-icon><div style="font-size:12px;line-height:1.45;color:${enrichmentStatus === 'complete' ? '#E3F2FD' : '#FFE0B2'};overflow-wrap:anywhere;">${escapeHtml(enrichmentReason)}</div></div>` : ''}${enrichmentRowsWithState.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">${enrichmentRowsWithState.map(({ item, reviewReasons, needsReview }) => `<div style="padding:12px 14px;border-radius:14px;background:${needsReview ? 'rgba(239,108,0,0.10)' : 'rgba(255,255,255,0.04)'};border:${needsReview ? '1px solid rgba(245,124,0,0.35)' : '1px solid transparent'};display:flex;flex-direction:column;gap:8px;"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;"><div style="font-size:14px;font-weight:700;overflow-wrap:anywhere;">${escapeHtml(item?.n || 'Unknown Filament')}</div><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">${hasMeaningfulValue(item?.t) ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);color:var(--secondary-text-color);padding:4px 8px;border-radius:999px;font-size:12px;">${escapeHtml(String(item.t))}</span>` : ''}${needsReview ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(245,124,0,0.18);color:#FFCC80;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;"><ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:14px;"></ha-icon><span>Needs Review</span></span>` : ''}</div></div><div style="display:flex;flex-wrap:wrap;gap:8px;font-size:12px;"><span style="color:var(--secondary-text-color);">${escapeHtml(formatNumber(item?.w, 1, 'g'))}</span>${hasResolvedEntityId(item?.s) ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);color:var(--secondary-text-color);padding:4px 8px;border-radius:999px;">Spool #${escapeHtml(String(item.s))}</span>` : `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(245,124,0,0.18);color:#FFCC80;padding:4px 8px;border-radius:999px;font-weight:700;"><ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:14px;"></ha-icon><span>Spool unresolved</span></span>`}${hasResolvedEntityId(item?.f) ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);color:var(--secondary-text-color);padding:4px 8px;border-radius:999px;">Filament #${escapeHtml(String(item.f))}</span>` : `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(245,124,0,0.18);color:#FFCC80;padding:4px 8px;border-radius:999px;font-weight:700;"><ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:14px;"></ha-icon><span>Filament unresolved</span></span>`}</div>${normalizeHex(item?.h) ? `<div style="display:inline-flex;align-items:center;gap:8px;width:max-content;background:rgba(255,255,255,0.04);padding:4px 8px;border-radius:999px;"><span style="width:12px;height:12px;border-radius:999px;background:${escapeHtml(normalizeHex(item?.h))};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span><span style="font-size:12px;">${escapeHtml(normalizeHex(item?.h))}</span></div>` : ''}${item?.am ? `<div style="display:inline-flex;align-items:center;gap:8px;width:max-content;background:rgba(239,108,0,0.16);color:#FFCC80;padding:4px 8px;border-radius:999px;font-size:12px;"><ha-icon icon="mdi:alert-outline" style="--mdc-icon-size:14px;"></ha-icon><span>${escapeHtml(describeEnrichmentAmbiguity(item?.am))}</span></div>` : ''}${reviewReasons.length ? `<div style="font-size:12px;line-height:1.4;color:${needsReview ? '#FFE0B2' : 'var(--secondary-text-color)'};overflow-wrap:anywhere;">${escapeHtml(reviewReasons.join(' • '))}</div>` : ''}</div>`).join('')}</div>` : `<div style="font-size:13px;color:var(--secondary-text-color);">${escapeHtml(enrichmentReason || 'No structured filament rows were preserved for this archive.')}</div>`}</div>` : ''}
                ${tags.length ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Tags</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${tags.map((tag) => `<span style="background:${tagColor(tag)};color:#243242;border-radius:999px;padding:4px 10px;font-size:11px;box-shadow:inset 0 0 0 1px rgba(36,50,66,0.14);">${escapeHtml(tag)}</span>`).join('')}</div></div>` : ''}
                ${archiveUserNotes ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Notes</div><div style="font-size:14px;line-height:1.5;overflow-wrap:anywhere;">${escapeHtml(archiveUserNotes)}</div></div>` : ''}
            ${archive?.failure_reason ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Failure Reason</div><div style="font-size:14px;line-height:1.5;color:#ffb4ab;overflow-wrap:anywhere;">${escapeHtml(archive.failure_reason)}</div></div>` : ''}
          </div>`;
      ]]]