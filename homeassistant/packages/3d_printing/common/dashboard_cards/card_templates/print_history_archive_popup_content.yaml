ow-wrap:anywhere;word-break:break-word;text-align:left;">${escapeHtml(enrichmentReason)}</div></div>` : ''}${hasEnrichmentPayload || hasEnrichmentData ? `<div style="display:flex;flex-direction:column;gap:10px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);text-align:left;">Match Evidence</div><div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(21,101,192,0.10);border:1px solid rgba(21,101,192,0.22);text-align:left;min-width:0;"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:16px;color:#90CAF9;margin-top:1px;flex:0 0 auto;"></ha-icon><div style="min-width:0;max-width:100%;font-size:12px;line-height:1.45;color:#E3F2FD;white-space:normal !important;overflow-wrap:anywhere;word-break:break-word;text-align:left;">The compact payload preserves ambiguity markers <strong>am</strong>, filament-family markers <strong>fm</strong>, spool match markers <strong>sm</strong>, and time-window provenance <strong>pm</strong>. The local SQLite store also keeps a derived provenance table so the popup can explain which archive-source row and AMS evidence were present when the detail cache was built.</div></div>${enrichmentEvidenceMarkup}</div>` : ''}${(archivedFilamentSlots.length || archivedAmsTrayRows.length || archivedRawAms.length || hasEnrichmentPayload || hasEnrichmentData) ? `<div class="print-history-popup-json-shell"><div class="print-history-popup-json-header"><div class="print-history-popup-json-title">Archive Source Evidence</div>${archiveEvidenceSummaryChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${archiveEvidenceSummaryChips}</div>` : ''}<div class="print-history-popup-json-description">These are the archive-detail fragments the manual re-enrich flow inspects when rebuilding lineage. They help explain whether the source record had archived filament slot rows, archived AMS tray data, and non-z