print_history_archive_popup_content:
  entity: sensor.print_history_popup_archive_detail
  triggers_update:
    - sensor.print_history_popup_archive_detail
    - input_boolean.print_history_popup_is_favorite
  show_icon: false
  show_name: false
  show_state: false
  styles:
    card:
      - background: none
      - border: none
      - box-shadow: none
      - padding: 0
      - margin: 0
    grid:
      - grid-template-areas: '"content"'
      - grid-template-columns: 1fr
    custom_fields:
      content:
        - padding: 0
        - margin: 0
        - pointer-events: auto
  custom_fields:
    content: |
      [[[ 
        let snapshotArchive = {};
        try {
          snapshotArchive = JSON.parse(variables?.archive_json || '{}');
        } catch (_error) {
          snapshotArchive = {};
        }
        const snapshotArchiveId = snapshotArchive?.id;
        const popupArchiveId = states['input_text.print_history_popup_archive_id']?.state || '';
        const popupFavoriteState = states['input_boolean.print_history_popup_is_favorite']?.state || 'off';
        let archive = snapshotArchive;
        let detailEventTimeline = [];
        const detailState = states['sensor.print_history_popup_archive_detail'];
        if (detailState && String(detailState.state || '') === String(snapshotArchiveId || '')) {
          try {
            const detailRaw = detailState.attributes?.archive_json || '{}';
            const detailArchive = typeof detailRaw === 'string' ? JSON.parse(detailRaw || '{}') : detailRaw;
            if (detailArchive && typeof detailArchive === 'object') {
              archive = { ...archive, ...detailArchive };
            }
            const timelineRaw = detailState.attributes?.event_timeline_json || '[]';
            const parsedTimeline = typeof timelineRaw === 'string' ? JSON.parse(timelineRaw || '[]') : timelineRaw;
            detailEventTimeline = Array.isArray(parsedTimeline) ? parsedTimeline : [];
          } catch (_error) {
            archive = snapshotArchive;
            detailEventTimeline = [];
          }
        }

        const baseUrlRaw = states['input_text.bambuddy_api_base_url']?.state || '';
        const baseUrl = String(baseUrlRaw).replace(/\/$/, '');
        const archiveId = archive?.id;
          const isPopupArchive = String(popupArchiveId || '') === String(archiveId || snapshotArchiveId || '');
          const isFavorite = isPopupArchive ? popupFavoriteState === 'on' : !!archive?.is_favorite;
        const ENRICHMENT_MARKER = '+>';
        const RECOVERY_MARKER = '[RECOVERY_AUDIT_V1]';
        const describeEnrichmentAmbiguity = (value) => {
          const normalized = String(value || '').trim();
          return ({
            a_tc: 'Multiple archived AMS trays matched type+color',
            a_fb: 'Multiple archived AMS trays matched archive-level fallback',
            s_uuid: 'Multiple Spoolman spools matched archived tray UUID',
            s_tc: 'Multiple Spoolman spools matched type+color'
          })[normalized] || normalized;
        };
        const normalizeStatus = (status) => {
          const raw = String(status || '').toLowerCase();
          if (raw === 'completed' || raw === 'success') return 'completed';
          if (raw === 'archived') return 'archived';
          if (raw === 'cancelled' || raw === 'aborted' || raw === 'stopped') return 'cancelled';
          return raw;
        };
        const normalizeHex = (value) => {
          const raw = String(value || '').trim().replace(/^#/, '').replace(/"/g, '');
          if (!raw) return '';
          const trimmed = raw.length === 8 ? raw.slice(0, 6) : raw;
          return /^[0-9a-fA-F]{6}$/.test(trimmed) ? `#${trimmed.toUpperCase()}` : '';
        };
        const hexToRgb = (value) => {
          const normalized = normalizeHex(value);
          if (!normalized) return null;
          const raw = normalized.slice(1);
          return {
            r: parseInt(raw.slice(0, 2), 16),
            g: parseInt(raw.slice(2, 4), 16),
            b: parseInt(raw.slice(4, 6), 16)
          };
        };
        const rgbaFromHex = (value, alpha, fallback) => {
          const rgb = hexToRgb(value);
          if (!rgb) return fallback;
          return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
        };
        const splitArchiveNotes = (value) => {
          const raw = String(value || '');
          const markerIndex = raw.indexOf(ENRICHMENT_MARKER);
          const recoveryIndex = raw.indexOf(RECOVERY_MARKER);
          const indexes = [markerIndex, recoveryIndex].filter((index) => index >= 0);
          if (!indexes.length) {
            return { userNotes: raw.trimEnd(), payload: null };
          }
          const cutoff = Math.min(...indexes);
          const userNotes = raw.slice(0, cutoff).replace(/\n+$/u, '');
          const payloadRaw = markerIndex >= 0 ? raw.slice(markerIndex + ENRICHMENT_MARKER.length).trim() : '';
          try {
            return {
              userNotes,
              payload: payloadRaw ? JSON.parse(payloadRaw) : null
            };
          } catch (_error) {
            return { userNotes, payload: null };
          }
        };
        const status = normalizeStatus(archive?.status);
        const statusLabel = status === 'completed'
          ? 'Completed'
          : status === 'archived'
            ? 'Archived'
          : status === 'cancelled'
            ? 'Cancelled'
          : status === 'failed'
            ? 'Failed'
            : status === 'printing'
                ? 'Printing'
                : (status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Unknown');
        const statusColor = status === 'completed'
          ? '#2E7D32'
          : status === 'archived'
            ? '#546E7A'
          : status === 'cancelled'
            ? '#EF6C00'
          : status === 'failed'
            ? '#C62828'
            : status === 'printing'
                ? '#1565C0'
                : '#546E7A';
        const statusIcon = status === 'completed'
          ? '✅'
          : status === 'archived'
            ? '📦'
          : status === 'cancelled'
            ? '⛔'
          : status === 'failed'
            ? '❌'
            : status === 'printing'
                ? '🖨️'
                : '⏳';
        const escapeHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
        const haTimeZone = hass?.config?.time_zone ? String(hass.config.time_zone) : undefined;
        const parseDateValue = (value) => {
          if (!value) return null;
          const raw = String(value);
          const normalized = /(?:Z|[+-]\d{2}:\d{2})$/.test(raw) ? raw : `${raw}Z`;
          const parsed = new Date(normalized);
          return Number.isNaN(parsed.getTime()) ? null : parsed;
        };
        const formatDateYear = (value) => new Intl.DateTimeFormat('en-US', {
          year: 'numeric',
          timeZone: haTimeZone
        }).format(value);
        const formatDateLabel = (value, options = {}) => {
          const parsed = parseDateValue(value);
          if (!parsed) return '-';
          const formatOptions = {
            month: 'short',
            day: 'numeric',
            timeZone: haTimeZone
          };
          if (options.includeTime !== false) {
            formatOptions.hour = 'numeric';
            formatOptions.minute = '2-digit';
          }
          if (options.includeYearWhenNotCurrent === true && formatDateYear(parsed) !== formatDateYear(new Date())) {
            formatOptions.year = 'numeric';
          }
          return new Intl.DateTimeFormat('en-US', formatOptions).format(parsed);
        };
        const formatDate = (value) => formatDateLabel(value, { includeTime: true, includeYearWhenNotCurrent: true });
          const formatTimelineDate = (value) => formatDateLabel(value, { includeTime: true, includeYearWhenNotCurrent: true });
          const parseDateMs = (value) => {
            const parsed = parseDateValue(value);
            return parsed ? parsed.getTime() : null;
          };
        const formatDuration = (secondsValue) => {
          const seconds = Number(secondsValue || 0);
          if (!seconds) return '-';
          if (seconds >= 3600) return `${Math.round((seconds / 3600) * 10) / 10}h`;
          return `${Math.round(seconds / 60)}m`;
        };
          const formatTimelineDuration = (secondsValue) => {
            const seconds = Number(secondsValue || 0);
            if (!Number.isFinite(seconds) || seconds <= 0) return '-';
            const totalMinutes = Math.max(1, Math.round(seconds / 60));
            const days = Math.floor(totalMinutes / 1440);
            const hours = Math.floor((totalMinutes % 1440) / 60);
            const minutes = totalMinutes % 60;
            const parts = [];
            if (days) parts.push(`${days}d`);
            if (hours || days) parts.push(`${hours}h`);
            if (minutes || (!days && !hours)) parts.push(`${minutes}m`);
            return parts.join(' ');
          };
        const formatNumber = (value, digits = 1, suffix = '') => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `${numeric.toFixed(digits).replace(/\.0$/, '')}${suffix}`;
        };
        const formatCurrency = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `$${numeric.toFixed(2)}`;
        };
          const formatCurrencyValue = (value) => {
            const numeric = Number(value);
            if (!Number.isFinite(numeric) || numeric <= 0) return '-';
            return numeric.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
          };
          const renderInfoChip = (icon, value, options = {}) => {
            if (!hasMeaningfulValue(value)) return '';
            const background = options.background || 'rgba(255,255,255,0.05)';
            const border = options.border || '1px solid rgba(255,255,255,0.08)';
            const color = options.color || 'var(--primary-text-color)';
            const fontWeight = options.fontWeight || 600;
            const title = options.title ? ` title="${escapeHtml(options.title)}"` : '';
            return `<span${title} style="display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:${background};border:${border};color:${color};font-size:12px;font-weight:${fontWeight};line-height:1.2;max-width:100%;min-width:0;"><ha-icon icon="${icon}" style="--mdc-icon-size:15px;flex:0 0 auto;color:${color};"></ha-icon><span style="min-width:0;overflow-wrap:anywhere;word-break:break-word;">${escapeHtml(String(value))}</span></span>`;
        };
        const hasMeaningfulValue = (value) => {
          if (value === null || value === undefined) return false;
          const normalized = String(value).trim().toLowerCase();
          return !['', 'none', 'null', 'unknown', 'unavailable'].includes(normalized);
        };
        const hasResolvedEntityId = (value) => {
          if (value === null || value === undefined) return false;
          const normalized = String(value).trim().toLowerCase();
          return normalized !== '' && normalized !== 'null' && normalized !== 'none';
        };
        const getEnrichmentReviewReasons = (item) => {
          const reviewReasons = [];
          if (!hasMeaningfulValue(item?.t)) reviewReasons.push('Tray unresolved');
          if (!hasResolvedEntityId(item?.s)) reviewReasons.push('Spool unresolved');
          if (!hasResolvedEntityId(item?.f)) reviewReasons.push('Filament unresolved');
          if (String(item?.am || item?.a || '').trim()) reviewReasons.push(describeEnrichmentAmbiguity(item?.am || item?.a));
          return reviewReasons;
        };
        const buildArchiveErrorState = (currentArchive) => {
          const filePath = String(currentArchive?.file_path || '').trim();
          const thumbnailPath = String(currentArchive?.thumbnail_path || '').trim();
          const source3mfPath = String(currentArchive?.source_3mf_path || '').trim();
          const hasProjectedArchiveState = Boolean(
            currentArchive
            && (
              Object.prototype.hasOwnProperty.call(currentArchive, 'has_archive_error')
              || Object.prototype.hasOwnProperty.call(currentArchive, 'missing_core_3mf')
              || Object.prototype.hasOwnProperty.call(currentArchive, 'missing_thumbnail')
              || Object.prototype.hasOwnProperty.call(currentArchive, 'has_source_only')
            )
          );
          let missingCore3mf = Boolean(currentArchive?.missing_core_3mf);
          let hasSourceOnly = Boolean(currentArchive?.has_source_only);
          let missingThumbnail = Boolean(currentArchive?.missing_thumbnail);

          if (!hasProjectedArchiveState && !missingCore3mf && !missingThumbnail) {
            missingCore3mf = Boolean(currentArchive?.no_3mf_available || !filePath);
            hasSourceOnly = Boolean(missingCore3mf && source3mfPath);
            missingThumbnail = Boolean(!missingCore3mf && !thumbnailPath);
          }

          if (hasSourceOnly) {
            return {
              hasArchiveError: true,
              severity: 'error',
              label: String(currentArchive?.archive_error_label || 'Source 3MF Only'),
              summary: String(currentArchive?.archive_error_summary || 'Primary archive missing; source 3MF is attached separately.'),
              background: 'rgba(198,40,40,0.14)',
              border: 'rgba(198,40,40,0.34)',
              color: '#FFCDD2',
              chips: ['Primary 3MF missing', 'Source 3MF attached'],
            };
          }
          if (missingCore3mf) {
            return {
              hasArchiveError: true,
              severity: 'error',
              label: String(currentArchive?.archive_error_label || 'Archive Incomplete'),
              summary: String(currentArchive?.archive_error_summary || 'Primary archived 3MF is missing and needs repair.'),
              background: 'rgba(198,40,40,0.14)',
              border: 'rgba(198,40,40,0.34)',
              color: '#FFCDD2',
              chips: ['Primary 3MF missing'],
            };
          }
          if (missingThumbnail) {
            return {
              hasArchiveError: true,
              severity: 'warning',
              label: String(currentArchive?.archive_error_label || 'Thumbnail Missing'),
              summary: String(currentArchive?.archive_error_summary || 'Thumbnail preview is unavailable for this archive.'),
              background: 'rgba(239,108,0,0.14)',
              border: 'rgba(239,108,0,0.34)',
              color: '#FFE0B2',
              chips: ['Thumbnail unavailable'],
            };
          }
          return {
            hasArchiveError: false,
            severity: '',
            label: '',
            summary: '',
            background: '',
            border: '',
            color: '',
            chips: [],
          };
        };

        const startedDisplay = formatTimelineDate(archive?.started_at || archive?.created_at);
        const completedDisplay = archive?.completed_at
          ? formatTimelineDate(archive.completed_at)
          : (status === 'printing' ? 'In progress' : '-');
        const timelineDuration = formatTimelineDuration(
          archive?.effective_duration_seconds ?? archive?.actual_time_seconds ?? archive?.print_time_seconds
        );
        const timelineStartColor = '#1565C0';
        const timelineEndColor = status === 'completed'
          ? '#2E7D32'
          : (status === 'failed' || status === 'cancelled')
            ? '#C62828'
            : '#78909C';
        const timelineColorForKey = (colorKey) => ({
          start: '#1565C0',
          pause: '#FB8C00',
          resume: '#00ACC1',
          success: '#2E7D32',
          failure: '#C62828',
          media: '#0277BD',
          enrichment: '#7B1FA2',
          repair: '#8E24AA',
          neutral: '#78909C'
        })[String(colorKey || '').trim()] || '#78909C';
        const timelineLegendItems = [
          { color: timelineColorForKey('start'), label: 'Print started' },
          { color: timelineColorForKey('pause'), label: 'Print paused' },
          { color: timelineColorForKey('resume'), label: 'Print resumed' },
          { color: timelineColorForKey('success'), label: 'Print finished' },
          { color: timelineColorForKey('failure'), label: 'Print failed or stopped' },
          { color: timelineColorForKey('media'), label: 'Photo captured' },
          { color: timelineColorForKey('enrichment'), label: 'Enrichment applied' },
          { color: timelineColorForKey('repair'), label: 'Repair applied' }
        ];
        const timelineLegendMarkup = [
          '<div style="font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:rgba(245,247,250,0.72);margin-bottom:8px;">Timeline colors</div>',
          ...timelineLegendItems.map((item) => `<div class="print-history-popup-timeline-legend-item"><span class="print-history-popup-timeline-legend-dot" style="background:${item.color};box-shadow:0 0 0 3px ${rgbaFromHex(item.color, 0.22, 'rgba(255,255,255,0.12)')};"></span><span>${escapeHtml(item.label)}</span></div>`)
        ].join('');
        const anchorEventTypes = new Set(['print_started', 'print_finished', 'print_failed', 'print_stopped']);
        const rawTimelineStartTime = parseDateMs(archive?.started_at || archive?.created_at);
        const rawTimelineEvents = Array.isArray(detailEventTimeline) ? detailEventTimeline : [];
        const timelineEventTimes = rawTimelineEvents
          .map((item) => parseDateMs(item?.time))
          .filter((value) => value !== null);
        const rawTimelineEndTime = parseDateMs(archive?.completed_at)
          ?? (timelineEventTimes.length ? Math.max(...timelineEventTimes) : null);
        const buildTimelineDots = () => {
          if (rawTimelineStartTime === null || rawTimelineEndTime === null || rawTimelineEndTime <= rawTimelineStartTime) {
            return [];
          }
          const trackMin = 6;
          const trackMax = 94;
          const minGap = 4;
          const projected = rawTimelineEvents
            .filter((item) => item && typeof item === 'object' && !anchorEventTypes.has(String(item.type || '').trim()))
            .map((item) => {
              const eventTimeMs = parseDateMs(item.time);
              if (eventTimeMs === null) return null;
              const clampedMs = Math.min(rawTimelineEndTime, Math.max(rawTimelineStartTime, eventTimeMs));
              const rawPosition = trackMin + (((clampedMs - rawTimelineStartTime) / Math.max(1, rawTimelineEndTime - rawTimelineStartTime)) * (trackMax - trackMin));
              const color = timelineColorForKey(item.color_key);
              return {
                type: String(item.type || '').trim(),
                time: item.time,
                label: String(item.label || String(item.type || '').replace(/_/g, ' ').trim()),
                color,
                ringColor: rgbaFromHex(color, 0.22, 'rgba(255,255,255,0.12)'),
                position: Math.min(trackMax, Math.max(trackMin, rawPosition))
              };
            })
            .filter(Boolean)
            .sort((left, right) => parseDateMs(left.time) - parseDateMs(right.time));
          if (!projected.length) return [];
          const adjusted = projected.map((item) => ({ ...item }));
          for (let index = 1; index < adjusted.length; index += 1) {
            adjusted[index].position = Math.max(adjusted[index].position, adjusted[index - 1].position + minGap);
          }
          for (let index = adjusted.length - 1; index >= 0; index -= 1) {
            const maxPosition = trackMax - ((adjusted.length - 1 - index) * minGap);
            adjusted[index].position = Math.min(adjusted[index].position, maxPosition);
            if (index < adjusted.length - 1) {
              adjusted[index].position = Math.min(adjusted[index].position, adjusted[index + 1].position - minGap);
            }
            adjusted[index].position = Math.max(trackMin + (index * minGap), adjusted[index].position);
          }
          return adjusted;
        };
        const timelineDots = buildTimelineDots();
        const timelineDotMarkup = timelineDots.map((item) => `<span title="${escapeHtml(`${item.label} | ${formatTimelineDate(item.time)}`)}" style="position:absolute;left:${item.position}%;top:50%;width:8px;height:8px;border-radius:999px;background:${item.color};transform:translate(-50%, -50%);box-shadow:0 0 0 3px ${item.ringColor};"></span>`).join('');
        const startTimelineTitle = `Print started | ${formatTimelineDate(archive?.started_at || archive?.created_at)}`;
        const endTimelineLabel = status === 'completed' ? 'Print finished' : (status === 'failed' ? 'Print failed' : (status === 'cancelled' ? 'Print stopped' : statusLabel));
        const endTimelineTitle = `${endTimelineLabel} | ${formatTimelineDate(archive?.completed_at)}`;
        const archiveError = buildArchiveErrorState(archive);
        const buildDuplicateState = (currentArchive) => {
          const archiveId = Math.max(0, Number(currentArchive?.id || 0));
          const duplicateCount = Math.max(0, Number(currentArchive?.duplicate_count || 0));
          const duplicateSequence = Math.max(0, Number(currentArchive?.duplicate_sequence || 0));
          const originalArchiveId = Math.max(0, Number(currentArchive?.original_archive_id || 0));
          const isSource = duplicateSequence === 0 && originalArchiveId > 0 && originalArchiveId === archiveId;
          const isDuplicate = !isSource && (originalArchiveId > 0 || duplicateSequence > 0);
          const isOriginal = duplicateCount > 0 && (isSource || !isDuplicate);
          const groupSize = duplicateCount > 0 ? duplicateCount + 1 : 0;
          if (!isDuplicate && !isOriginal) {
            return {
              hasDuplicateContext: false,
              roleLabel: '',
              chipLabel: '',
              chipColor: '',
              summary: '',
              groupSize: 0,
              sequenceLabel: '',
              originalLabel: '',
            };
          }
          if (isDuplicate) {
            const duplicatePosition = groupSize > 0 ? Math.min(groupSize, Math.max(1, duplicateSequence + 1)) : Math.max(1, duplicateSequence + 1);
            return {
              hasDuplicateContext: true,
              roleLabel: 'Duplicate Copy',
              chipLabel: originalArchiveId > 0 ? `Dup of #${originalArchiveId}` : (groupSize > 1 ? `Duplicate ${duplicatePosition}/${groupSize}` : 'Duplicate'),
              chipColor: '#00897B',
              summary: originalArchiveId > 0
                ? `This archive is a duplicate copy derived from original archive #${originalArchiveId}.`
                : 'This archive is part of a duplicate print set.',
              groupSize,
              sequenceLabel: groupSize > 1 ? `${duplicatePosition} of ${groupSize}` : `${duplicatePosition}`,
              originalLabel: originalArchiveId > 0 ? `Source #${originalArchiveId}` : '',
            };
          }
          return {
            hasDuplicateContext: true,
            roleLabel: 'Original Source',
            chipLabel: groupSize > 1 ? `Source · ${groupSize} prints` : 'Source',
            chipColor: '#1565C0',
            summary: groupSize > 1
              ? `This archive is the original source for a duplicate set of ${groupSize} prints.`
              : 'This archive is the original source in a duplicate set.',
            groupSize,
            sequenceLabel: groupSize > 1 ? `1 of ${groupSize}` : '1',
            originalLabel: '',
          };
        };
        const duplicateState = buildDuplicateState(archive);
        const favoriteChip = `<span title="${isFavorite ? 'Favorite archive' : 'Not marked as favorite'}" style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:${isFavorite ? 'rgba(245,194,66,0.18)' : 'rgba(255,255,255,0.05)'};border:1px solid ${isFavorite ? 'rgba(245,194,66,0.35)' : 'rgba(255,255,255,0.08)'};flex:0 0 auto;"><ha-icon icon="${isFavorite ? 'mdi:star' : 'mdi:star-outline'}" style="--mdc-icon-size:18px;color:${isFavorite ? '#f5c242' : 'var(--secondary-text-color)'};"></ha-icon></span>`;
        const summaryRowChips = [
          `<span style="background:${statusColor};color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;line-height:1.2;"><span>${statusIcon}</span><span>${escapeHtml(statusLabel)}</span></span>`,
          archiveError.hasArchiveError ? `<span style="background:${archiveError.severity === 'error' ? '#C62828' : '#EF6C00'};color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;line-height:1.2;"><ha-icon icon="mdi:alert-circle-outline" style="--mdc-icon-size:15px;color:#fff;"></ha-icon><span>${escapeHtml(archiveError.label)}</span></span>` : '',
          duplicateState.hasDuplicateContext ? `<span style="background:${duplicateState.chipColor};color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;line-height:1.2;"><ha-icon icon="mdi:content-copy" style="--mdc-icon-size:15px;color:#fff;"></ha-icon><span>${escapeHtml(duplicateState.chipLabel)}</span></span>` : '',
          renderInfoChip('mdi:palette-swatch-outline', archive?.designer, { fontWeight: 500 }),
          favoriteChip
        ].filter(Boolean).join('');
        const metricChips = [
          renderInfoChip('mdi:weight-gram', formatNumber(archive?.filament_used_grams, 1, 'g')),
          Number(archive?.object_count || 0) > 1 ? renderInfoChip('mdi:shape-outline', `${archive.object_count} objects`) : '',
          renderInfoChip('mdi:currency-usd', formatCurrencyValue(archive?.cost)),
          renderInfoChip('mdi:flask-outline', archive?.filament_type)
        ].filter(Boolean).join('');
        const printerDetailChips = [
          renderInfoChip('mdi:printer-3d', archive?.printer_name || archive?.printer_id),
          renderInfoChip('mdi:printer-3d-nozzle', archive?.nozzle_diameter ? `${archive.nozzle_diameter} mm` : ''),
          renderInfoChip('mdi:layers-outline', archive?.total_layers || ''),
          renderInfoChip('mdi:arrow-expand-vertical', archive?.layer_height ? `${archive.layer_height} mm` : '')
        ].filter(Boolean).join('');
        const duplicateDetailChips = [
          duplicateState.hasDuplicateContext ? renderInfoChip('mdi:content-copy', duplicateState.roleLabel) : '',
          duplicateState.groupSize > 1 ? renderInfoChip('mdi:counter', `${duplicateState.groupSize} prints`) : '',
          duplicateState.sequenceLabel ? renderInfoChip('mdi:format-list-numbered', duplicateState.sequenceLabel) : '',
          duplicateState.originalLabel ? renderInfoChip('mdi:identifier', duplicateState.originalLabel) : ''
        ].filter(Boolean).join('');
        const notesInfo = splitArchiveNotes(archive?.notes);
        const archiveUserNotes = String(archive?.user_notes || notesInfo.userNotes || '').trim();
        const enrichmentRows = Array.isArray(archive?.enrichment_filaments)
          ? archive.enrichment_filaments
          : Array.isArray(notesInfo.payload?.F)
            ? notesInfo.payload.F
            : [];
        const enrichmentStatusCode = String(archive?.enrichment_status || notesInfo.payload?.s || '').toLowerCase();
        const enrichmentStatusRaw = ({ c: 'complete', p: 'partial', u: 'unavailable' })[enrichmentStatusCode] || '';
        const enrichmentReason = String(archive?.enrichment_reason || notesInfo.payload?.reason || '').trim();
        const enrichmentSource = String(archive?.enrichment_source || notesInfo.payload?.src || '').trim();
        const hasEnrichmentPayload = Boolean(notesInfo.payload)
          || Array.isArray(archive?.enrichment_filaments)
          || Boolean(String(archive?.enrichment_status || archive?.enrichment_reason || archive?.enrichment_source || '').trim());
        const enrichmentRowsWithState = enrichmentRows.map((item) => {
          const reviewReasons = getEnrichmentReviewReasons(item);
          const filamentHex = normalizeHex(item?.h);
          const needsReview = reviewReasons.length > 0;
          return {
            item,
            reviewReasons,
            needsReview,
            filamentHex,
            cardBackground: filamentHex
              ? rgbaFromHex(filamentHex, 0.18, 'rgba(255,255,255,0.04)')
              : 'rgba(255,255,255,0.04)',
            cardBorder: filamentHex
              ? rgbaFromHex(filamentHex, 0.72, 'rgba(255,255,255,0.14)')
              : 'rgba(255,255,255,0.14)',
            railColor: needsReview
              ? 'rgba(245,124,0,0.92)'
              : 'transparent'
          };
        });
        const hasEnrichmentData = enrichmentRows.length > 0;
        const enrichmentStatus = (() => {
          if (enrichmentStatusRaw === 'complete' || enrichmentStatusRaw === 'partial') return enrichmentStatusRaw;
          if (enrichmentStatusRaw === 'unavailable' && hasEnrichmentData) return 'partial';
          if (enrichmentStatusRaw === 'unavailable') return 'unavailable';
          if (!hasEnrichmentData) return 'unavailable';
          return enrichmentRowsWithState.some((row) => row.needsReview) ? 'partial' : 'complete';
        })();
        const enrichmentStatusLabel = enrichmentStatus === 'complete'
          ? 'Complete'
          : enrichmentStatus === 'partial'
            ? 'Partial'
            : 'Unavailable';
        const enrichmentStatusColor = enrichmentStatus === 'complete'
          ? '#2E7D32'
          : enrichmentStatus === 'partial'
            ? '#F57C00'
            : '#546E7A';
        const enrichmentSourceLabel = enrichmentSource === 'at1'
          ? 'Archive-level fallback'
          : enrichmentSource === 'afs'
            ? 'Archived slot rows'
            : '';
        const colors = String(archive?.filament_color || '')
          .split(',')
          .map((value) => normalizeHex(value))
          .filter(Boolean);
        const filamentChips = enrichmentRows.length
          ? enrichmentRows.map((item, index) => {
              const name = String(item?.n || '').trim() || `Filament ${index + 1}`;
              const tray = String(item?.t || '').trim();
              const hex = normalizeHex(item?.h);
              const ambiguity = describeEnrichmentAmbiguity(item?.am);
              return {
                key: `${name}-${tray || index}`,
                label: tray ? `${name} (${tray})` : name,
                dotColor: hex || 'rgba(255,255,255,0.2)',
                tooltip: [hex, ambiguity].filter(Boolean).join(' | ')
              };
            })
          : colors.map((hex, index) => ({
              key: `fallback-${hex}-${index}`,
              label: hex,
              dotColor: hex,
              tooltip: hex
            }));

        return `
          <style>
            .print-history-popup-content{display:flex;flex-direction:column;gap:14px;overflow:visible;}
            .print-history-popup-hero{display:flex;flex-direction:column;gap:12px;padding:14px 16px 18px;border-radius:18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);overflow:visible;}
            .print-history-popup-timeline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"start duration end" "track track track";column-gap:16px;row-gap:10px;align-items:start;min-width:0;overflow:visible;}
            .print-history-popup-timeline-side{min-width:0;display:flex;flex-direction:column;gap:4px;}
            .print-history-popup-timeline-side--start{grid-area:start;align-items:flex-start;text-align:left;}
            .print-history-popup-timeline-side--end{grid-area:end;align-items:flex-end;text-align:right;}
            .print-history-popup-timeline-label{font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--secondary-text-color);}
            .print-history-popup-timeline-value{font-size:13px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;word-break:break-word;}
            .print-history-popup-timeline-main{grid-area:track;display:flex;align-items:center;min-width:0;width:100%;}
            .print-history-popup-timeline-track{position:relative;width:100%;height:18px;}
            .print-history-popup-timeline-duration-wrap{grid-area:duration;align-self:center;justify-self:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%;overflow:visible;z-index:5;}
            .print-history-popup-timeline-duration{display:inline-flex;align-items:center;justify-content:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.08);font-size:12px;font-weight:700;letter-spacing:0.04em;max-width:100%;white-space:nowrap;}
            .print-history-popup-timeline-legend-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;pointer-events:auto;}
            .print-history-popup-timeline-legend{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:var(--secondary-text-color);cursor:help;pointer-events:auto;}
            .print-history-popup-timeline-legend-tooltip{position:absolute;left:50%;top:calc(100% + 10px);transform:translate(-50%, -6px);width:min(260px, 72vw);padding:10px 12px;border-radius:12px;background:rgba(18,22,28,0.96);border:1px solid rgba(255,255,255,0.1);box-shadow:0 16px 30px rgba(0,0,0,0.28);color:#F5F7FA;font-size:12px;line-height:1.45;white-space:normal;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 160ms ease, transform 160ms ease;z-index:40;}
            .print-history-popup-timeline-legend-tooltip::after{content:'';position:absolute;left:50%;bottom:100%;transform:translateX(-50%);border-width:0 6px 6px 6px;border-style:solid;border-color:transparent transparent rgba(18,22,28,0.96) transparent;}
            .print-history-popup-timeline-legend-item{display:flex;align-items:center;gap:10px;}
            .print-history-popup-timeline-legend-item + .print-history-popup-timeline-legend-item{margin-top:7px;}
            .print-history-popup-timeline-legend-dot{display:inline-block;width:9px;height:9px;border-radius:999px;flex:0 0 auto;}
            .print-history-popup-timeline-legend-wrap:hover .print-history-popup-timeline-legend-tooltip,
            .print-history-popup-timeline-legend-wrap:focus-within .print-history-popup-timeline-legend-tooltip{opacity:1;visibility:visible;transform:translate(-50%, 0);}
            @media (max-width: 640px) {
              .print-history-popup-timeline{column-gap:10px;row-gap:8px;}
            }
          </style>
          <div class="print-history-popup-content">
            <div class="print-history-popup-hero">
              <div class="print-history-popup-timeline">
                <div class="print-history-popup-timeline-side print-history-popup-timeline-side--start">
                  <div class="print-history-popup-timeline-label">Start</div>
                  <div class="print-history-popup-timeline-value">${escapeHtml(startedDisplay)}</div>
                </div>
                <div class="print-history-popup-timeline-duration-wrap">
                  <span class="print-history-popup-timeline-duration">${escapeHtml(timelineDuration)}</span>
                  <span class="print-history-popup-timeline-legend-wrap">
                    <span class="print-history-popup-timeline-legend" tabindex="0" aria-label="Timeline color legend"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:16px;color:var(--secondary-text-color);"></ha-icon></span>
                    <span class="print-history-popup-timeline-legend-tooltip">${timelineLegendMarkup}</span>
                  </span>
                </div>
                <div class="print-history-popup-timeline-main">
                  <div class="print-history-popup-timeline-track">
                    <span style="position:absolute;left:4px;right:4px;top:50%;height:2px;border-radius:999px;background:rgba(255,255,255,0.18);transform:translateY(-50%);"></span>
                    <span title="${escapeHtml(startTimelineTitle)}" style="position:absolute;left:0;top:50%;width:10px;height:10px;border-radius:999px;background:${timelineStartColor};transform:translateY(-50%);box-shadow:0 0 0 4px rgba(21,101,192,0.12);"></span>
                    ${timelineDotMarkup}
                    <span title="${escapeHtml(endTimelineTitle)}" style="position:absolute;right:0;top:50%;width:10px;height:10px;border-radius:999px;background:${timelineEndColor};transform:translateY(-50%);box-shadow:0 0 0 4px rgba(255,255,255,0.08);"></span>
                  </div>
                </div>
                <div class="print-history-popup-timeline-side print-history-popup-timeline-side--end">
                  <div class="print-history-popup-timeline-label">End</div>
                  <div class="print-history-popup-timeline-value">${escapeHtml(completedDisplay)}</div>
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${summaryRowChips}</div>
              ${metricChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${metricChips}</div>` : ''}
              ${printerDetailChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${printerDetailChips}</div>` : ''}
              ${duplicateDetailChips ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">${duplicateDetailChips}</div>` : ''}
              ${duplicateState.hasDuplicateContext ? `<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(0,137,123,0.12);border:1px solid rgba(0,137,123,0.28);"><ha-icon icon="mdi:content-copy" style="--mdc-icon-size:16px;color:#80CBC4;margin-top:1px;"></ha-icon><div style="font-size:12px;line-height:1.45;color:#E0F2F1;overflow-wrap:anywhere;">${escapeHtml(duplicateState.summary)}</div></div>` : ''}
              ${archiveError.hasArchiveError ? `<div style="display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:16px;background:${archiveError.background};border:1px solid ${archiveError.border};"><div style="display:flex;align-items:flex-start;gap:10px;"><ha-icon icon="mdi:alert-circle-outline" style="--mdc-icon-size:18px;color:${archiveError.color};margin-top:1px;"></ha-icon><div style="display:flex;flex-direction:column;gap:4px;min-width:0;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:${archiveError.color};">Archive Issue</div><div style="font-size:13px;line-height:1.5;color:${archiveError.color};overflow-wrap:anywhere;">${escapeHtml(archiveError.summary)}</div></div></div>${archiveError.chips.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;">${archiveError.chips.map((chip) => `<span style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);font-size:12px;font-weight:600;color:${archiveError.color};">${escapeHtml(chip)}</span>`).join('')}</div>` : ''}</div>` : ''}
            </div>
                  ${!hasEnrichmentPayload && filamentChips.length ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Filament Colors</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${filamentChips.map((chip) => `<span title="${escapeHtml(chip.tooltip)}" style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);padding:6px 10px;border-radius:999px;"><span style="width:14px;height:14px;border-radius:999px;background:${escapeHtml(chip.dotColor)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span><span style="font-size:12px;">${escapeHtml(chip.label)}</span></span>`).join('')}</div></div>` : ''}
                ${hasEnrichmentPayload || hasEnrichmentData ? `<div style="display:flex;flex-direction:column;gap:10px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Enrichment</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">${enrichmentSourceLabel ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(21,101,192,0.16);color:#BBDEFB;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentSourceLabel)}</span>` : ''}<span style="background:${enrichmentStatusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(enrichmentStatusLabel)}</span>${enrichmentRows.length ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);color:var(--secondary-text-color);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;">${escapeHtml(String(enrichmentRows.length))} row${enrichmentRows.length === 1 ? '' : 's'}</span>` : ''}</div></div>${enrichmentReason ? `<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:14px;background:${enrichmentStatus === 'complete' ? 'rgba(21,101,192,0.12)' : 'rgba(239,108,0,0.12)'};border:1px solid ${enrichmentStatus === 'complete' ? 'rgba(21,101,192,0.28)' : 'rgba(239,108,0,0.28)'};"><ha-icon icon="${enrichmentStatus === 'complete' ? 'mdi:information-outline' : 'mdi:alert-outline'}" style="--mdc-icon-size:16px;color:${enrichmentStatus === 'complete' ? '#90CAF9' : '#FFCC80'};margin-top:1px;"></ha-icon><div style="font-size:12px;line-height:1.45;color:${enrichmentStatus === 'complete' ? '#E3F2FD' : '#FFE0B2'};overflow-wrap:anywhere;">${escapeHtml(enrichmentReason)}</div></div>` : ''}</div>` : ''}
                ${archiveUserNotes ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Notes</div><div style="font-size:14px;line-height:1.5;overflow-wrap:anywhere;">${escapeHtml(archiveUserNotes)}</div></div>` : ''}
            ${archive?.failure_reason ? `<div style="display:flex;flex-direction:column;gap:8px;"><div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--secondary-text-color);">Failure Reason</div><div style="font-size:14px;line-height:1.5;color:#ffb4ab;overflow-wrap:anywhere;">${escapeHtml(archive.failure_reason)}</div></div>` : ''}
          </div>`;
      ]]]