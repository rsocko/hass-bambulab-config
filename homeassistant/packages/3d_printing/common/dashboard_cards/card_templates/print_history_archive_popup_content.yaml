          const ambiguityExplanation = describeEnrichmentAmbiguity(provenanceRow?.ambiguity_code || item?.am || item?.a);
          const provenanceEvidence = provenanceRow?.evidence && typeof provenanceRow.evidence === 'object' ? provenanceRow.evidence : {};
          if (filamentMatchExplanation) storedWhy.push(filamentMatchExplanation);
          if (spoolMatchExplanation) storedWhy.push(spoolMatchExplanation);
          if (provenanceExplanation) storedWhy.push(provenanceExplanation);
          if (ambiguityExplanation) storedWhy.push(ambiguityExplanation);
          if (Number.isFinite(Number(provenanceEvidence?.matching_archived_ams_tray_count)) && Number(provenanceEvidence.matching_archived_ams_tray_count) > 0) {
            const trayCodes = Array.isArray(provenanceEvidence?.matching_archived_ams_tray_codes)
              ? provenanceEvidence.matching_archived_ams_tray_codes.filter(Boolean)
              : [];
            storedWhy.push(`Archive evidence contained ${Number(provenanceEvidence.matching_archived_ams_tray_count)} matching AMS tray row${Number(provenanceEvidence.matching_archived_ams_tray_count) === 1 ? '' : 's'}${trayCodes.length ? ` (${trayCodes.join(', ')})` : ''}.`);
          }
          if (provenanceEvidence?.source_slot_present) {
            const sourceSlot = provenanceEvidence?.source_slot && typeof provenanceEvidence.source_slot === 'object' ? provenanceEvidence.source_slot : {};
            const sourceTray = String(sourceSlot?.tray || '').trim();
            const sourceWeight = Number.isFinite(Number(sourceSlot?.used_grams)) ? `${Number(sourceSlot.used_grams).toFixed(1)}g` : '';
            const sourceLabel = [sourceTray, sourceWeight].filter(Boolean).join(' • ');
            storedWhy.push(`Archive source row was preserved${sourceLabel ? ` (${sourceLabel})` : ''}.`);
          }
          if (!storedWhy.length && (hasResolvedEntityId(item?.s) || hasResolvedEntityId(item?.f))) {
            storedWhy.push('This row resolved cleanly, but the compact payload does not preserve the exact internal branch used for the final spool selection.');
          }
          if (!storedWhy.length) {
            storedWhy.push('No detailed provenance markers were preserved for this row.');
          }
          return {
            item,
            provenanceRow,
            reviewReasons,
            needsReview,
            storedWhy,
            filamentHex,
            cardBackground: filamentHex
              ? rgbaFromHex(filamentHex, 0.18, 'rgba(255,255,255,0.04)')
              : 'rgba(255,255,255,0.04)',
            cardBorder: filamentHex
              ? rgbaFromHex(filamentHex, 0.72, 'rgba(255,255,255,0.14)')
              : 'rgba(255,255,255,0.14)',
            railColor: needsReview
              ? 'rgba(245,124,0,0.92)'
              : 'transparent'
          };
        });
        const hasEnrichmentData = enrichmentRows.length > 0;
        const enrichmentStatus = (() => {
          if (!hasEnrichmentData) return enrichmentStatusRaw === 'unavailable' ? 'unavailable' : 'unavailable';
          if (enrichmentRows.some((item) => item?.f === null || item?.f === undefined || String(item?.f || '').trim() === '')) return 'partially complete';
          if (enrichmentRows.some((item) => item?.s === null || item?.s === undefined || String(item?.s || '').trim() === '')) return 'mostly complete';
          if (enrichmentRows.some((item) => item?.t === null || item?.t === undefined || String(item?.t || '').trim() === '')) return 'near complete';
          return 'complete';
        })();
        const enrichmentStatusLabel = enrichmentStatus === 'complete'
          ? 'Complete'
          : enrichmentStatus === 'near complete'
            ? 'Near Complete'
          : enrichmentStatus === 'mostly complete'
            ? 'Mostly Complete'
          : enrichmentStatus === 'partially complete'
            ? 'Partially Complete'
            : 'Unavailable';
        const enrichmentStatusColor = enrichmentStatus === 'complete'
          ? '#2E7D32'
          : enrichmentStatus === 'near complete'
            ? '#1565C0'
          : enrichmentStatus === 'mostly complete'
            ? '#6A1B9A'
          : enrichmentStatus === 'partially complete'
            ? '#F57C00'
            : '#546E7A';
        const enrichmentSourceLabel = enrichmentSource === 'at1'
          ? 'Archive-level fallback'
          : enrichmentSource === 'afs'
            ? 'Archived slot rows'
            : '';
        const archiveEvidenceSummaryChips = [
          enrichmentSourceLabel ? renderInfoChip('mdi:source-branch', enrichmentSourceLabel) : '',
