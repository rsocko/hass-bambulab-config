# spool_replace_wizard_step3.yaml
# Step 3: Configure Transfer Options
# Shows transfer option toggles (input_boolean) and desiccant mode (input_select).
# All options are read live from helper entities.
# Nav: Review & Execute → Step 4, Cancel.
#
# Docs: docs/features/spoolman_sync/spool-replace-refill-design.md

spool_replace_wizard_step3:
  show_icon: false
  show_name: false
  show_state: false
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - box-shadow: none
      - padding: 0
      - text-align: left
    grid:
      - grid-template-areas: '"header" "options" "nav"'
      - grid-template-columns: 1fr
      - grid-template-rows: auto auto auto
    custom_fields:
      header:
        - padding: 0
        - text-align: left
        - justify-self: start
        - width: 100%
      options:
        - padding: 4px 0
      nav:
        - padding: 8px 0 0 0
  custom_fields:
    header: |
      [[[
        const srcId = states['input_text.spool_replace_source_spool_id']?.state;
        const tgtId = states['input_text.spool_replace_target_spool_id']?.state;
        const srcEntity = (srcId && srcId !== '') ? states['sensor.spoolman_spool_' + srcId] : null;
        const tgtEntity = (tgtId && tgtId !== '') ? states['sensor.spoolman_spool_' + tgtId] : null;
        const srcName = srcEntity?.attributes?.friendly_name || 'Unknown';
        const tgtName = tgtEntity?.attributes?.friendly_name || 'Unknown';
        const srcColor = '#' + (srcEntity?.attributes?.filament_color_hex || '888888').replace('#', '');
        const tgtColor = '#' + (tgtEntity?.attributes?.filament_color_hex || '888888').replace('#', '');
        const srcPic = srcEntity?.attributes?.entity_picture || '';
        const tgtPic = tgtEntity?.attributes?.entity_picture || '';
        const srcLocation = srcEntity?.attributes?.location || 'Unknown';
        const tgtLocation = tgtEntity?.attributes?.location || 'Unknown';
        const mkImg = function(pic, color) {
          return pic
            ? '<img src="' + pic + '" style="width:24px;height:24px;border-radius:50%;border:2px solid ' + color + ';flex-shrink:0;object-fit:cover;">'
            : '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:' + color + ';border:1px solid var(--divider-color);flex-shrink:0;"></span>';
        };

        return '<div style="text-align:left;width:100%;">'
          + '<div style="display:inline-flex;align-items:center;gap:10px;margin-bottom:12px;">'
          + '<ha-icon icon="mdi:cog-transfer" style="color:var(--warning-color);--mdc-icon-size:28px;width:28px;height:28px;flex:0 0 28px;display:inline-flex;"></ha-icon>'
          + '<div>'
          + '<div style="font-weight:600;">Configure Transfer Options</div>'
          + '<div style="font-size:0.9em;color:var(--secondary-text-color);">Choose what to copy from the old spool to the new one.</div>'
          + '</div></div>'
          + '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--card-background-color);border:1px solid var(--divider-color);font-size:0.9em;">'
          + mkImg(srcPic, srcColor)
          + '<div style="min-width:0;flex:1;">'
          + '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + srcName + '</div>'
          + '<div style="font-size:0.85em;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">#' + srcId + ' · 📍 ' + srcLocation + '</div>'
          + '</div>'
          + '<ha-icon icon="mdi:arrow-right" style="--mdc-icon-size:18px;color:var(--secondary-text-color);flex-shrink:0;"></ha-icon>'
          + mkImg(tgtPic, tgtColor)
          + '<div style="min-width:0;flex:1;">'
          + '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + tgtName + '</div>'
          + '<div style="font-size:0.85em;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">#' + tgtId + ' · 📍 ' + tgtLocation + '</div>'
          + '</div>'
          + '</div>'
          + '</div>';
      ]]]
    options:
      card:
        type: vertical-stack
        cards:
          - type: custom:button-card
            template: checkbox_row
            entity: input_boolean.spool_replace_copy_spool_type
            name: |
              [[[
                const srcId = states['input_text.spool_replace_source_spool_id']?.state;
                const e = states['sensor.spoolman_spool_' + srcId];
                const val = e?.attributes?.extra_spool_type || '(not set)';
                return 'Copy Spool Type: <span style="font-size:0.88em;color:var(--secondary-text-color);">' + val + '</span>';
              ]]]
          - type: custom:button-card
            template: checkbox_row
            entity: input_boolean.spool_replace_copy_clip_type
            name: |
              [[[
                const srcId = states['input_text.spool_replace_source_spool_id']?.state;
                const e = states['sensor.spoolman_spool_' + srcId];
                const val = e?.attributes?.extra_clip_type || '(not set)';
                return 'Copy Clip Type: <span style="font-size:0.88em;color:var(--secondary-text-color);">' + val + '</span>';
              ]]]
          - type: entities
            card_mod:
              style: |
                .card-content {
                  text-align: left;
                }
                hui-generic-entity-row {
                  text-align: left;
                }
                ha-select {
                  text-align: left;
                  --ha-select-min-width: 0;
                }
            entities:
              - entity: input_select.spool_replace_desiccant_mode
                name: Desiccant Fill Date
          - type: custom:button-card
            template: checkbox_row
            entity: input_boolean.spool_replace_copy_desiccant_present
            name: |
              [[[
                const srcId = states['input_text.spool_replace_source_spool_id']?.state;
                const e = states['sensor.spoolman_spool_' + srcId];
                const raw = e?.attributes?.extra_desiccant_in_spool;
                const val = (raw === 'true' || raw === true || raw === 'yes') ? 'Yes' : 'No';
                return 'Copy Desiccant Present: <span style="font-size:0.88em;color:var(--secondary-text-color);">' + val + '</span>';
              ]]]
          - type: custom:button-card
            template: checkbox_row
            entity: input_boolean.spool_replace_copy_location
            name: |
              [[[
                const srcId = states['input_text.spool_replace_source_spool_id']?.state;
                const e = states['sensor.spoolman_spool_' + srcId];
                const val = e?.attributes?.location || '(not set)';
                return 'Copy Location: <span style="font-size:0.88em;color:var(--secondary-text-color);">' + val + '</span>';
              ]]]
          - type: custom:button-card
            template: checkbox_row
            entity: input_boolean.spool_replace_mark_used
            name: Mark as Used Now
          - type: custom:button-card
            template: checkbox_row
            entity: input_boolean.spool_replace_archive_source
            name: Archive Empty Spool
    nav:
      card:
        type: horizontal-stack
        cards:
          - type: custom:button-card
            name: Cancel
            icon: mdi:close
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.close_popup
            styles:
              grid:
                - grid-template-areas: '"i" "n"'
                - grid-template-rows: min-content min-content
                - justify-items: center
                - align-items: center
              card:
                - background: "var(--primary-color)"
                - box-shadow: none
                - border-radius: 6px
                - padding: 6px
              name:
                - color: white
                - font-weight: 500
                - font-size: 12px
              icon:
                - color: white
                - width: 20px
                - height: 20px
                - margin-bottom: 2px
          - type: custom:button-card
            name: Review & Execute
            icon: mdi:arrow-right
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.sequence
                data:
                  sequence:
                    - service: browser_mod.close_popup
                    - service: browser_mod.delay
                      data:
                        time: 500
                    - service: browser_mod.popup
                      data:
                        title: "♻ Replace Spool — Step 4 of 4"
                        size: normal
                        content:
                          type: custom:button-card
                          template: spool_replace_wizard_step4
                          tap_action:
                            action: none
            styles:
              grid:
                - grid-template-areas: '"i" "n"'
                - grid-template-rows: min-content min-content
                - justify-items: center
                - align-items: center
              card:
                - background: "var(--primary-color)"
                - box-shadow: none
                - border-radius: 6px
                - padding: 6px
              name:
                - color: white
                - font-weight: 500
                - font-size: 12px
              icon:
                - color: white
                - width: 20px
                - height: 20px
                - margin-bottom: 2px
