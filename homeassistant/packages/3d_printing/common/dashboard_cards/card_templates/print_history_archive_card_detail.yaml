print_history_archive_card_detail:
  template:
    - print_history_archive_popup
  type: custom:button-card
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  custom_fields:
    body: |
      [[[ 
        let archive = {};
        try {
          archive = JSON.parse(variables?.archive_json || '{}');
        } catch (_error) {
          archive = {};
        }

        const baseUrlRaw = states['input_text.bambuddy_api_base_url']?.state || '';
        const baseUrl = String(baseUrlRaw).replace(/\/$/, '');
        const archiveId = archive?.id;
        const normalizeStatus = (status) => {
          const raw = String(status || '').toLowerCase();
          if (raw === 'completed' || raw === 'success') return 'completed';
          if (raw === 'cancelled' || raw === 'aborted') return 'failed';
          return raw;
        };
        const status = normalizeStatus(archive?.status);
        const statusLabel = status === 'completed' ? 'Completed' : status === 'failed' ? 'Failed' : status === 'stopped' ? 'Stopped' : status === 'printing' ? 'Printing' : 'Unknown';
        const statusColor = status === 'completed' ? '#2E7D32' : status === 'failed' ? '#C62828' : status === 'stopped' ? '#EF6C00' : status === 'printing' ? '#1565C0' : '#546E7A';
        const statusIcon = status === 'completed' ? '✅' : status === 'failed' ? '❌' : status === 'stopped' ? '⛔' : status === 'printing' ? '🖨️' : '⏳';
        const escapeHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
        const formatDate = (value) => {
          if (!value) return 'Unknown';
          const parsed = new Date(value);
          if (Number.isNaN(parsed.getTime())) return 'Unknown';
          return parsed.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        };
        const formatDuration = (secondsValue) => {
          const seconds = Number(secondsValue || 0);
          if (!seconds) return '-';
          if (seconds >= 3600) return `${Math.round((seconds / 3600) * 10) / 10}h`;
          return `${Math.round(seconds / 60)}m`;
        };
        const formatNumber = (value, digits = 1, suffix = '') => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `${numeric.toFixed(digits).replace(/\.0$/, '')}${suffix}`;
        };
        const formatCurrency = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `$${numeric.toFixed(2)}`;
        };
        const colors = String(archive?.filament_color || '').split(',').map((value) => value.trim()).filter(Boolean);
        const tags = String(archive?.tags || '').split(',').map((value) => value.trim()).filter(Boolean).slice(0, 6);
        const facts = [archive?.filament_type || 'Unknown material', archive?.layer_height ? `${archive.layer_height}mm layer` : '', archive?.nozzle_diameter ? `${archive.nozzle_diameter}mm nozzle` : '', archive?.object_count ? `${archive.object_count} object${Number(archive.object_count) === 1 ? '' : 's'}` : '', archive?.designer ? `Designer: ${archive.designer}` : ''].filter(Boolean);
        const metadata = [archive?.filament_type || 'Unknown material', archive?.layer_height ? `${archive.layer_height}mm` : '', archive?.designer || ''].filter(Boolean).join(' · ');
        const thumbnailUrl = baseUrl && archiveId ? `${baseUrl}/api/v1/archives/${archiveId}/thumbnail` : '';

        return `
          <div style="display:grid;grid-template-columns:${thumbnailUrl ? '220px minmax(0, 1fr)' : 'minmax(0, 1fr)'};gap:18px;align-items:start;">
            ${thumbnailUrl ? `<div><img src="${escapeHtml(thumbnailUrl)}" style="width:100%;height:156px;object-fit:cover;border-radius:16px;display:block;" alt="${escapeHtml(archive?.print_name || 'Archive thumbnail')}"></div>` : ''}
            <div style="min-width:0;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,0.95fr);grid-template-areas:'main stats' 'extras extras';gap:14px 18px;align-items:start;">
              <div style="grid-area:main;min-width:0;display:flex;flex-direction:column;gap:10px;">
                <div style="display:flex;justify-content:space-between;gap:12px;row-gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0;">
                  <div style="min-width:0;flex:1 1 320px;max-width:100%;">
                    <div style="font-weight:700;font-size:19px;line-height:1.15;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:100%;">${escapeHtml(archive?.print_name || 'Unnamed')}</div>
                    <div style="font-size:12px;color:var(--secondary-text-color);margin-top:4px;">${escapeHtml(formatDate(archive?.started_at || archive?.created_at))}</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;max-width:100%;margin-left:auto;">
                    ${archive?.is_favorite ? '<span style="font-size:18px;color:#f5c242;">★</span>' : ''}
                    <span style="background:${statusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">${statusIcon} ${escapeHtml(statusLabel)}</span>
                  </div>
                </div>
                ${facts.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;">${facts.map((fact) => `<span style="display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,0.05);color:var(--primary-text-color);font-size:11px;line-height:1.2;">${escapeHtml(fact)}</span>`).join('')}</div>` : ''}
                <div style="font-size:13px;color:var(--secondary-text-color);overflow-wrap:anywhere;">${escapeHtml(metadata || 'No additional metadata')}</div>
                ${archive?.failure_reason ? `<div style="font-size:12px;color:#ffb4ab;line-height:1.4;">${escapeHtml(archive.failure_reason)}</div>` : ''}
              </div>
              <div style="grid-area:stats;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">
                <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);"><div style="color:var(--secondary-text-color);font-size:11px;line-height:1.2;margin-bottom:4px;">Duration</div><div style="font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(formatDuration(archive?.actual_time_seconds || archive?.print_time_seconds))}</div></div>
                <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);"><div style="color:var(--secondary-text-color);font-size:11px;line-height:1.2;margin-bottom:4px;">Filament</div><div style="font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(formatNumber(archive?.filament_used_grams, 1, 'g'))}</div></div>
                <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);"><div style="color:var(--secondary-text-color);font-size:11px;line-height:1.2;margin-bottom:4px;">Cost</div><div style="font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(formatCurrency(archive?.cost))}</div></div>
                <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);"><div style="color:var(--secondary-text-color);font-size:11px;line-height:1.2;margin-bottom:4px;">Objects</div><div style="font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(String(archive?.object_count || 1))}</div></div>
              </div>
              ${(colors.length || tags.length) ? `<div style="grid-area:extras;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;min-width:0;">${colors.length ? `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${colors.slice(0, 6).map((hex) => `<span style="width:14px;height:14px;border-radius:999px;background:${escapeHtml(hex)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span>`).join('')}</div>` : ''}${tags.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">${tags.map((tag) => `<span style="background:#1565C0;color:#fff;border-radius:999px;padding:3px 8px;font-size:10px;">${escapeHtml(tag)}</span>`).join('')}</div>` : ''}</div>` : ''}
            </div>
          </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: minmax(0, 1fr)
    card:
      - width: 100%
      - border: 1px solid var(--divider-color)
      - border-radius: 24px
      - background: var(--ha-card-background)
      - padding: 18px 20px
      - box-sizing: border-box
    custom_fields:
      body:
        - display: block
        - width: 100%
        - text-align: left