print_history_archive_card_detail:
  template:
    - print_history_archive_popup
  type: custom:button-card
  triggers_update:
    - sensor.print_history_page_archives
  show_icon: true
  show_name: false
  show_state: false
  show_label: false
  icon: |
    [[[ 
      let snapshotArchive = {};
      try {
        snapshotArchive = JSON.parse(variables?.archive_json || '{}');
      } catch (_error) {
        snapshotArchive = {};
      }
      const archiveId = snapshotArchive?.id;
      let archive = snapshotArchive;
      try {
        const pageArchivesRaw = states['sensor.print_history_page_archives']?.attributes?.archives || '[]';
        const pageArchives = typeof pageArchivesRaw === 'string' ? JSON.parse(pageArchivesRaw || '[]') : pageArchivesRaw;
        if (Array.isArray(pageArchives) && archiveId !== undefined && archiveId !== null) {
          archive = pageArchives.find((item) => String(item?.id) === String(archiveId)) || snapshotArchive;
        }
      } catch (_error) {
        archive = snapshotArchive;
      }
      return archive?.is_favorite ? 'mdi:star' : 'mdi:star-outline';
    ]]]
  icon_tap_action:
    action: call-service
    service: script.toggle_print_history_archive_favorite
    data:
      archive_id: |
        [[[ 
          let archive = {};
          try {
            archive = JSON.parse(variables?.archive_json || '{}');
          } catch (_error) {
            archive = {};
          }
          return archive?.id ? String(archive.id) : '';
        ]]]
  custom_fields:
    body: |
      [[[ 
        let snapshotArchive = {};
        try {
          snapshotArchive = JSON.parse(variables?.archive_json || '{}');
        } catch (_error) {
          snapshotArchive = {};
        }
        const snapshotArchiveId = snapshotArchive?.id;
        let archive = snapshotArchive;
        try {
          const pageArchivesRaw = states['sensor.print_history_page_archives']?.attributes?.archives || '[]';
          const pageArchives = typeof pageArchivesRaw === 'string' ? JSON.parse(pageArchivesRaw || '[]') : pageArchivesRaw;
          if (Array.isArray(pageArchives) && snapshotArchiveId !== undefined && snapshotArchiveId !== null) {
            archive = pageArchives.find((item) => String(item?.id) === String(snapshotArchiveId)) || snapshotArchive;
          }
        } catch (_error) {
          archive = snapshotArchive;
        }

        const baseUrlRaw = states['input_text.bambuddy_api_base_url']?.state || '';
        const baseUrl = String(baseUrlRaw).replace(/\/$/, '');
        const archiveId = archive?.id;
        const normalizeStatus = (status) => {
          const raw = String(status || '').toLowerCase();
          if (raw === 'completed' || raw === 'success') return 'completed';
          if (raw === 'cancelled' || raw === 'aborted' || raw === 'stopped') return 'cancelled';
          return raw;
        };
        const status = normalizeStatus(archive?.status);
        const statusLabel = status === 'completed' ? 'Completed' : status === 'failed' ? 'Failed' : status === 'cancelled' ? 'Cancelled' : status === 'printing' ? 'Printing' : 'Unknown';
        const statusColor = status === 'completed' ? '#2E7D32' : status === 'failed' ? '#C62828' : status === 'cancelled' ? '#EF6C00' : status === 'printing' ? '#1565C0' : '#546E7A';
        const statusIcon = status === 'completed' ? '✅' : status === 'failed' ? '❌' : status === 'cancelled' ? '⛔' : status === 'printing' ? '🖨️' : '⏳';
        const escapeHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
          const tagPalette = ['#DCFCE7', '#DBEAFE', '#FCE7F3', '#E0F2FE', '#EDE9FE', '#FEF3C7', '#BBF7D0', '#BFDBFE', '#FBCFE8', '#BAE6FD', '#DDD6FE', '#FED7AA'];
          const tagColor = (tag) => {
            const normalized = String(tag || '').trim().toLowerCase();
            if (!normalized) return tagPalette[0];
            let hash = 0;
            for (let index = 0; index < normalized.length; index += 1) {
              hash = ((hash << 5) - hash + normalized.charCodeAt(index)) >>> 0;
            }
            return tagPalette[hash % tagPalette.length];
          };
        const formatDate = (value) => {
          if (!value) return 'Unknown';
          const parsed = new Date(value);
          if (Number.isNaN(parsed.getTime())) return 'Unknown';
          return parsed.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        };
        const formatDuration = (secondsValue) => {
          const seconds = Number(secondsValue || 0);
          if (!seconds) return '-';
          if (seconds >= 3600) return `${Math.round((seconds / 3600) * 10) / 10}h`;
          return `${Math.round(seconds / 60)}m`;
        };
        const formatNumber = (value, digits = 1, suffix = '') => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `${numeric.toFixed(digits).replace(/\.0$/, '')}${suffix}`;
        };
        const formatCurrency = (value) => {
          const numeric = Number(value);
          if (!Number.isFinite(numeric) || numeric <= 0) return '-';
          return `$${numeric.toFixed(2)}`;
        };
        const systemTagPrefixes = ['filament:', 'spool:', 'spoolman:', 'vendor:', 'material:', 'cost:', 'status:', 'ha enrichment:', 'ha_enrichment:'];
        const systemTagValues = ['ha_enriched:true'];
        const isSystemTag = (tag) => {
          const normalized = String(tag || '').trim().toLowerCase();
          return systemTagValues.includes(normalized) || systemTagPrefixes.some((prefix) => normalized.startsWith(prefix));
        };
        const colors = String(archive?.filament_color || '').split(',').map((value) => value.trim()).filter(Boolean);
        const tags = String(archive?.tags || '').split(',').map((value) => value.trim()).filter(Boolean).filter((tag) => !isSystemTag(tag)).slice(0, 6);
        const facts = [archive?.filament_type || 'Unknown material', archive?.layer_height ? `${archive.layer_height}mm layer` : '', archive?.nozzle_diameter ? `${archive.nozzle_diameter}mm nozzle` : '', archive?.object_count ? `${archive.object_count} object${Number(archive.object_count) === 1 ? '' : 's'}` : '', archive?.designer ? `Designer: ${archive.designer}` : ''].filter(Boolean);
        const metadata = [archive?.filament_type || 'Unknown material', archive?.layer_height ? `${archive.layer_height}mm` : '', archive?.designer || ''].filter(Boolean).join(' · ');
        const showImages = states['input_boolean.print_history_show_images']?.state !== 'off';
        const thumbnailUrl = showImages && baseUrl && archiveId ? `${baseUrl}/api/v1/archives/${archiveId}/thumbnail` : '';

        return `
          <div style="display:grid;grid-template-columns:${thumbnailUrl ? 'minmax(148px, 188px) minmax(0, 1fr)' : 'minmax(0, 1fr)'};gap:16px 18px;align-items:flex-start;width:100%;min-width:0;">
            ${thumbnailUrl ? `<div style="min-width:0;width:100%;"><img src="${escapeHtml(thumbnailUrl)}" style="width:100%;height:132px;object-fit:cover;border-radius:16px;display:block;" alt="${escapeHtml(archive?.print_name || 'Archive thumbnail')}"></div>` : ''}
            <div style="min-width:0;width:100%;display:flex;flex-direction:column;gap:12px;align-self:stretch;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;row-gap:10px;flex-wrap:wrap;min-width:0;width:100%;">
                <div style="flex:1 1 320px;min-width:0;max-width:100%;">
                  <div style="font-weight:700;font-size:19px;line-height:1.15;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:100%;">${escapeHtml(archive?.print_name || 'Unnamed')}</div>
                  <div style="font-size:12px;color:var(--secondary-text-color);margin-top:4px;overflow-wrap:anywhere;">${escapeHtml(formatDate(archive?.started_at || archive?.created_at))}</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex:0 1 auto;flex-wrap:wrap;max-width:100%;margin-left:auto;">
                  <span style="background:${statusColor};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;">${statusIcon} ${escapeHtml(statusLabel)}</span>
                </div>
              </div>
              ${facts.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;min-width:0;">${facts.map((fact) => `<span style="display:inline-flex;align-items:center;max-width:100%;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,0.05);color:var(--primary-text-color);font-size:11px;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(fact)}</span>`).join('')}</div>` : ''}
              <div style="font-size:13px;color:var(--secondary-text-color);overflow-wrap:anywhere;">${escapeHtml(metadata || 'No additional metadata')}</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:10px;width:100%;min-width:0;">
                <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);min-width:0;"><div style="color:var(--secondary-text-color);font-size:11px;line-height:1.2;margin-bottom:4px;">Duration</div><div style="font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(formatDuration(archive?.actual_time_seconds || archive?.print_time_seconds))}</div></div>
                <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);min-width:0;"><div style="color:var(--secondary-text-color);font-size:11px;line-height:1.2;margin-bottom:4px;">Filament</div><div style="font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(formatNumber(archive?.filament_used_grams, 1, 'g'))}</div></div>
                <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);min-width:0;"><div style="color:var(--secondary-text-color);font-size:11px;line-height:1.2;margin-bottom:4px;">Cost</div><div style="font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(formatCurrency(archive?.cost))}</div></div>
                <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,0.04);min-width:0;"><div style="color:var(--secondary-text-color);font-size:11px;line-height:1.2;margin-bottom:4px;">Objects</div><div style="font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;">${escapeHtml(String(archive?.object_count || 1))}</div></div>
              </div>
              ${(colors.length || tags.length || archive?.failure_reason) ? `<div style="display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;min-width:0;width:100%;">${colors.length ? `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;">${colors.slice(0, 6).map((hex) => `<span style="width:14px;height:14px;border-radius:999px;background:${escapeHtml(hex)};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);"></span>`).join('')}</div>` : ''}${tags.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;max-width:100%;">${tags.map((tag) => `<span style="background:${tagColor(tag)};color:#243242;border-radius:999px;padding:3px 8px;font-size:10px;max-width:100%;overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px rgba(36,50,66,0.14);">${escapeHtml(tag)}</span>`).join('')}</div>` : ''}${archive?.failure_reason ? `<div style="flex:1 1 220px;font-size:12px;color:#ffb4ab;line-height:1.4;overflow-wrap:anywhere;">${escapeHtml(archive.failure_reason)}</div>` : ''}</div>` : ''}
            </div>
          </div>`;
      ]]]
  styles:
    grid:
      - grid-template-areas: '"body i"'
      - grid-template-columns: minmax(0, 1fr) auto
      - align-items: start
    card:
      - width: 100%
      - min-width: 0
      - border: 1px solid var(--divider-color)
      - border-radius: 24px
      - background: var(--ha-card-background)
      - padding: 18px 20px
      - box-sizing: border-box
      - justify-self: stretch
    img_cell:
      - align-self: start
      - justify-self: end
      - width: 28px
      - height: 28px
      - border-radius: 999px
      - overflow: hidden
      - padding-top: 2px
      - margin-left: 12px
    icon:
      - width: 22px
      - height: 22px
      - color: |
          [[[ 
            let snapshotArchive = {};
            try {
              snapshotArchive = JSON.parse(variables?.archive_json || '{}');
            } catch (_error) {
              snapshotArchive = {};
            }
            const archiveId = snapshotArchive?.id;
            let archive = snapshotArchive;
            try {
              const pageArchivesRaw = states['sensor.print_history_page_archives']?.attributes?.archives || '[]';
              const pageArchives = typeof pageArchivesRaw === 'string' ? JSON.parse(pageArchivesRaw || '[]') : pageArchivesRaw;
              if (Array.isArray(pageArchives) && archiveId !== undefined && archiveId !== null) {
                archive = pageArchives.find((item) => String(item?.id) === String(archiveId)) || snapshotArchive;
              }
            } catch (_error) {
              archive = snapshotArchive;
            }
            return archive?.is_favorite ? '#f5c242' : 'var(--secondary-text-color)';
          ]]]
    custom_fields:
      body:
        - display: block
        - width: 100%
        - justify-self: stretch
        - text-align: left
  extra_styles: |
    :host {
      display: block;
      width: 100%;
    }
    #container {
      width: 100% !important;
      grid-template-columns: minmax(0, 1fr) auto !important;
      justify-items: stretch !important;
      align-items: start !important;
    }
    #container > * {
      min-width: 0;
    }
    #container > #body {
      width: 100% !important;
      justify-self: stretch !important;
    }
