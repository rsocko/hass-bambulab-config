ams_tray_label:
  type: custom:button-card
  name: '[[[ return variables.trayName; ]]]'
  show_icon: false
  show_state: false
  custom_fields:
    weight_bar: |
      [[[
        const tray = variables.tray;
        if (!tray) return '';
        const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
        const spoolId = map?.[tray]?.spool_id;
        if (!spoolId) return '';
        const spoolEntity = states[`sensor.spoolman_spool_${spoolId}`];
        const remaining = spoolEntity?.attributes?.remaining_weight;
        const initial = spoolEntity?.attributes?.initial_weight || 1000;
        if (remaining === undefined || remaining === null) return '';
        const pct = Math.min(Math.max(remaining / initial * 100, 0), 100);
        let barColor;
        if (pct > 50) barColor = '#4CAF50';
        else if (pct > 25) barColor = '#FFC107';
        else if (pct > 10) barColor = '#FF9800';
        else barColor = '#f44336';
        return `<div style="width:100%;height:3px;background:rgba(128,128,128,0.2);border-radius:2px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${barColor};border-radius:2px;"></div></div>`;
      ]]]
  styles:
    card:
      - background: |
          [[[
            const tray = variables.tray;
            if (!tray) return 'none';
            const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
            const spoolId = map?.[tray]?.spool_id;
            if (!spoolId) return 'none';
            const colorHex = map?.[tray]?.color;
            if (!colorHex) return 'none';
            const spoolEntity = states[`sensor.spoolman_spool_${spoolId}`];
            const remaining = spoolEntity?.attributes?.remaining_weight;
            const initial = spoolEntity?.attributes?.initial_weight || 1000;
            if (remaining === undefined || remaining === null) return 'none';
            const pct = Math.min(Math.max(remaining / initial * 100, 0), 100);
            const r = parseInt(colorHex.substring(0,2), 16);
            const g = parseInt(colorHex.substring(2,4), 16);
            const b = parseInt(colorHex.substring(4,6), 16);
            return `linear-gradient(to right, rgb(${r},${g},${b}) ${pct}%, rgba(${r},${g},${b},0.25) ${pct}%)`;
          ]]]
      - padding: 4px
      - border-radius: 8px
      - overflow: hidden
      - box-shadow: |
          [[[
            const active = states[variables.trayEntityId]?.attributes?.active;
            return active ? 'inset 0 0 0 4px var(--primary-color)' : 'none';
          ]]]
    grid:
      - grid-template-areas: '"n" "weight_bar"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr auto
    name:
      - font-size: 14px
      - font-weight: bold
      - justify-self: center
      - color: |
          [[[
            const tray = variables.tray;
            if (!tray) return 'var(--primary-text-color)';
            const map = states['sensor.spoolman_tray_map']?.attributes?.tray_map;
            const spoolId = map?.[tray]?.spool_id;
            if (!spoolId) return 'var(--primary-text-color)';
            const colorHex = map?.[tray]?.color;
            if (!colorHex) return 'var(--primary-text-color)';
            const r = parseInt(colorHex.substring(0,2), 16);
            const g = parseInt(colorHex.substring(2,4), 16);
            const b = parseInt(colorHex.substring(4,6), 16);
            const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
            return luminance > 0.5 ? '#000000' : '#ffffff';
          ]]]
    custom_fields:
      weight_bar:
        - width: 100%
        - padding: 0 2px 2px 2px
        - box-sizing: border-box
