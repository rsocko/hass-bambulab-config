# ──────────────────────────────────────────────────────────────
# Print Detail Chips  —  inline chip row for the main dashboard
# ──────────────────────────────────────────────────────────────
#
# Chip visibility logic (all chips only appear when the underlying
# entity state is valid — i.e. not null/undefined/empty/unknown/unavailable):
#
#   Chip              Entity                                                   Extra condition
#   ────              ──────                                                   ───────────────
#   Printable Objects sensor.3d_printer_printable_objects                       value > 1  (single-object prints are obvious)
#   Skipped Objects   sensor.3d_printer_skipped_objects                         value >= 1 (only shown when objects were skipped)
#   Nozzle            sensor.ntk_ryansoffice_3dprinter_nozzle_size (+_type)     always shown when size is valid; type appended if available
#   Plate Type        sensor.ntk_ryansoffice_3dprinter_print_bed_type          always shown when valid
#   Print Type        sensor.ntk_ryansoffice_3dprinter_print_type              hidden when value is 'idle'
#
# The nozzle_size entity reports in inches (HA unit system conversion).
# We convert to mm (× 25.4) for display.
# ──────────────────────────────────────────────────────────────
type: custom:button-card
entity: sensor.ntk_ryansoffice_3dprinter_task_name
show_name: false
show_state: false
show_icon: false
tap_action:
  action: none
custom_fields:
  chips: |
    [[[
      const chips = [];
      const toTitleCase = s => s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      const validState = v => v !== null && v !== undefined && v !== '' && v !== 'unknown' && v !== 'unavailable';

      /* ── Printable Objects  (only when multi-object print) ── */
      const numObjects = states['sensor.3d_printer_printable_objects']?.state;
      if (validState(numObjects) && parseInt(numObjects, 10) > 1) {
        chips.push(`<span class="chip"><ha-icon icon="mdi:shape-outline" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${numObjects} objects</span>`);
      }

      /* ── Skipped Objects  (only when >= 1) ── */
      const skipped = states['sensor.3d_printer_skipped_objects']?.state;
      if (validState(skipped) && parseInt(skipped, 10) >= 1) {
        chips.push(`<span class="chip chip-warn"><ha-icon icon="mdi:close-circle-outline" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${skipped} skipped</span>`);
      }

      /* ── Nozzle Size & Type  (size entity reports inches → convert to mm) ── */
      const nozzleSizeRaw = states['sensor.ntk_ryansoffice_3dprinter_nozzle_size']?.state;
      const nozzleType    = states['sensor.ntk_ryansoffice_3dprinter_nozzle_type']?.state;
      if (validState(nozzleSizeRaw)) {
        const nozzleMm = (parseFloat(nozzleSizeRaw) * 25.4).toFixed(1);
        const typeLabel = validState(nozzleType) ? ` · ${toTitleCase(nozzleType)}` : '';
        chips.push(`<span class="chip"><ha-icon icon="mdi:printer-3d-nozzle" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${nozzleMm}mm${typeLabel}</span>`);
      }

      /* ── Plate / Bed Type  (always shown when valid) ── */
      const bedType = states['sensor.ntk_ryansoffice_3dprinter_print_bed_type']?.state;
      if (validState(bedType)) {
        chips.push(`<span class="chip"><ha-icon icon="mdi:table-furniture" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${toTitleCase(bedType)}</span>`);
      }

      /* ── Print Type  (hidden when idle) ── */
      const printType = states['sensor.ntk_ryansoffice_3dprinter_print_type']?.state;
      if (validState(printType) && printType !== 'idle') {
        chips.push(`<span class="chip"><ha-icon icon="mdi:layers-outline" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${String(printType).toUpperCase()}</span>`);
      }

      if (chips.length === 0) return `<div></div>`;
      return `<div class="chips-row">${chips.join('')}</div>`;
    ]]]
styles:
  card:
    - padding: 4px 8px
    - background: transparent
    - box-shadow: none
    - border: none
  custom_fields:
    chips:
      - width: 100%
      - text-align: left
extra_styles: |
  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 2px 0;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px 7px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    background: rgba(128, 128, 128, 0.15);
    color: var(--primary-text-color);
    white-space: nowrap;
  }
  .chip-warn {
    background: rgba(255, 152, 0, 0.2);
    color: #f57c00;
  }
