type: sections
max_columns: 3
title: Deploy Validation
path: deploy-validation
icon: mdi:test-tube
sections:
  - type: grid
    cards:
      - type: heading
        heading: Deployment Validation
        heading_style: title
      - type: markdown
        content: |
          This view is a deployment smoke test for the split dashboard setup.

          If you can see this tab and these cards after deploy, then:
          - dashboard registration loaded
          - dashboard file loaded
          - view include file loaded
      - type: entities
        title: Sample Printer Entities
        entities:
          - entity: sensor.ntk_ryansoffice_3dprinter_print_status
          - entity: sensor.ntk_ryansoffice_3dprinter_current_stage
          - entity: sensor.ntk_ryansoffice_3dprinter_print_progress
      - type: entities
        title: Error Alert Test Controls
        entities:
          - entity: input_boolean.error_alert_test_mode
          - entity: input_select.error_alert_test_scenario
          - entity: binary_sensor.error_alert_display_wrapper
          - entity: binary_sensor.ntk_ryansoffice_3dprinter_hms_errors
          - entity: binary_sensor.ntk_ryansoffice_3dprinter_print_error
      - type: markdown
        title: Action Button Test Guide
        content: |
          **AMS Filament Runout (Spool Empty):**
          Enable test mode → select **AMS Filament Runout (Spool Empty)**.
          Expected: 🔄 Retry, ✅ Done, ✕ Dismiss buttons visible.
          Check `has_ams_error`: {{ state_attr('binary_sensor.error_alert_display_wrapper', 'has_ams_error') }}

          **Single Print Error — User Pause:**
          Expected: ▶ Resume Print, ⏹ Cancel Print buttons visible.
          Check `is_paused`: {{ state_attr('binary_sensor.error_alert_display_wrapper', 'is_paused') }}

          **Single Serious Error (HMS runout):**
          Expected: 🔄 Retry, ✅ Done, ✕ Dismiss buttons (same as AMS).
        visibility:
          - condition: state
            entity: input_boolean.error_alert_test_mode
            state: "on"
    column_span: 2

  - type: grid
    cards:
      - type: tile
        entity: input_boolean.show_printer_controls
        name: Show Printer Controls
        tap_action:
          action: toggle
      - type: tile
        entity: binary_sensor.ntk_ryansoffice_3dprinter_hms_errors
        name: HMS Errors
      - type: tile
        entity: binary_sensor.ntk_ryansoffice_3dprinter_print_error
        name: Print Error
      - type: tile
        entity: binary_sensor.error_alert_display_wrapper
        name: Error Alert Wrapper
      - type: tile
        entity: camera.ntk_ryansoffice_3dprinter_camera
        name: Printer Camera
    column_span: 1

cards: []
