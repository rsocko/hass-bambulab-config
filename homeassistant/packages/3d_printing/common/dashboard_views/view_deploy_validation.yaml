type: sections
max_columns: 3
title: Deploy Validation
path: deploy-validation
icon: mdi:test-tube
sections:
  - type: grid
    cards:
      - type: heading
        heading: Deployment Validation
        heading_style: title
      - type: markdown
        content: |
          This view is a deployment smoke test for the split dashboard setup.

          If you can see this tab and these cards after deploy, then:
          - dashboard registration loaded
          - dashboard file loaded
          - view include file loaded
      - type: entities
        title: Sample Printer Entities
        entities:
          - entity: sensor.ntk_ryansoffice_3dprinter_print_status
          - entity: sensor.ntk_ryansoffice_3dprinter_current_stage
          - entity: sensor.ntk_ryansoffice_3dprinter_print_progress
      - type: entities
        title: Error Alert Test Controls
        entities:
          - entity: input_boolean.error_alert_test_mode
          - entity: input_select.error_alert_test_scenario
          - entity: input_text.error_alert_test_spool_id
          - entity: binary_sensor.error_alert_display_wrapper
          - entity: binary_sensor.ntk_ryansoffice_3dprinter_hms_errors
          - entity: binary_sensor.ntk_ryansoffice_3dprinter_print_error
          - entity: input_text.spool_replace_source_spool_id
      - type: markdown
        title: Action Button Test Guide
        content: |
          **AMS Filament Runout (Spool Empty):**
          1. Enter a valid Spoolman spool ID in **Error Alert Test Spool ID**
          2. Enable test mode → select **AMS Filament Runout (Spool Empty)**
          3. Tap **Activate Spool Replace** below to populate the wizard
          4. Expected on error alert card (main dashboard):
             - 🔄 Retry, ✅ Done, ✕ Dismiss buttons (AMS controls)
             - ♻ Replace Spool Now button (spool replace wizard entry)
          5. Tap "Replace Spool Now" to launch the 4-step wizard
          6. When done testing, tap **Clear Spool Replace** to reset

          `has_ams_error`: {{ state_attr('binary_sensor.error_alert_display_wrapper', 'has_ams_error') }}
          `spool_replace_source`: {{ states('input_text.spool_replace_source_spool_id') }}

          **Single Print Error — User Pause:**
          Expected: ▶ Resume Print, ⏹ Cancel Print buttons visible.
          `is_paused`: {{ state_attr('binary_sensor.error_alert_display_wrapper', 'is_paused') }}

          **Single Serious Error (HMS runout):**
          Expected: 🔄 Retry, ✅ Done, ✕ Dismiss buttons (same as AMS).
        visibility:
          - condition: state
            entity: input_boolean.error_alert_test_mode
            state: "on"
      # ── Spool Replace test action buttons ────────────────────
      - type: horizontal-stack
        visibility:
          - condition: state
            entity: input_boolean.error_alert_test_mode
            state: "on"
          - condition: state
            entity: input_select.error_alert_test_scenario
            state: "AMS Filament Runout (Spool Empty)"
        cards:
          - type: button
            name: Activate Spool Replace
            icon: mdi:swap-horizontal
            icon_height: 30px
            tap_action:
              action: perform-action
              perform_action: input_text.set_value
              target:
                entity_id: input_text.spool_replace_source_spool_id
              data:
                value: "{{ states('input_text.error_alert_test_spool_id') }}"
            card_mod:
              style: |
                ha-card {
                  background: rgba(76,175,80,0.12);
                  border: 1px solid rgba(76,175,80,0.5);
                }
          - type: button
            name: Clear Spool Replace
            icon: mdi:close-circle-outline
            icon_height: 30px
            tap_action:
              action: perform-action
              perform_action: input_text.set_value
              target:
                entity_id: input_text.spool_replace_source_spool_id
              data:
                value: ""
            card_mod:
              style: |
                ha-card {
                  background: rgba(158,158,158,0.12);
                  border: 1px solid rgba(158,158,158,0.4);
                }
    column_span: 2

  - type: grid
    cards:
      - type: tile
        entity: input_boolean.show_printer_controls
        name: Show Printer Controls
        tap_action:
          action: toggle
      - type: tile
        entity: binary_sensor.ntk_ryansoffice_3dprinter_hms_errors
        name: HMS Errors
      - type: tile
        entity: binary_sensor.ntk_ryansoffice_3dprinter_print_error
        name: Print Error
      - type: tile
        entity: binary_sensor.error_alert_display_wrapper
        name: Error Alert Wrapper
      - type: tile
        entity: camera.ntk_ryansoffice_3dprinter_camera
        name: Printer Camera
    column_span: 1

cards: []
