title: Home
# Keep at 3 so HMS sections with column_span: 3 always render full-width
max_columns: 3
sections:
- !include ../../hms_alert/dashboard_cards/hms-error-alert-section.yaml
- type: grid
  cards:
    - type: horizontal-stack
      cards:
        - type: picture-entity
          entity: image.ntk_ryansoffice_3dprinter_cover_image
          show_name: false
          show_state: false
          tap_action:
            action: more-info
          card_mod:
            style: |
              ha-card {
                border-radius: 8px !important;
                padding: 8px !important;
                overflow: hidden;
              }
              img {
                object-fit: contain !important;
                border-radius: 4px !important;
              }
        - type: vertical-stack
          cards:
            - type: custom:mushroom-template-card
              entity: sensor.ntk_ryansoffice_3dprinter_smart_status
              primary: >-
                {{ states('sensor.ntk_ryansoffice_3dprinter_smart_status') }}
              secondary: >-
                {{ state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'detail') }}
              icon: >-
                {% set status_class = state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'status_class') %}
                {% set hms = states('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors') %}
                {% if hms == 'on' %}mdi:alert-circle
                {% elif status_class in ['unmapped', 'failed'] %}mdi:alert-octagon
                {% elif status_class == 'finished' %}mdi:check-circle
                {% elif status_class == 'paused' %}mdi:pause-circle
                {% elif status_class == 'printing' %}mdi:printer-3d-nozzle
                {% elif status_class == 'heating' %}mdi:thermometer-lines
                {% elif status_class == 'leveling' %}mdi:grid
                {% elif status_class == 'offline' %}mdi:lan-disconnect
                {% elif status_class == 'idle' %}mdi:printer-3d
                {% else %}mdi:rotate-3d{% endif %}
              icon_color: >-
                {% set hms = states('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors') %}
                {% set status_class = state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'status_class') %}
                {% if hms == 'on' %}red
                {% elif status_class in ['unmapped', 'failed'] %}red
                {% elif status_class == 'finished' %}green
                {% elif status_class == 'paused' %}orange
                {% elif status_class == 'printing' %}blue
                {% elif status_class in ['idle', 'offline'] %}grey
                {% else %}green{% endif %}
              tap_action:
                action: more-info
              card_mod:
                style: >
                  {% set status_class = state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'status_class') %}
                  {% if status_class in ['printing', 'preparing'] %}
                  @keyframes printer-pulse {
                    0%, 100% { opacity: 1; }
                    50% { opacity: 0.5; }
                  }
                  mushroom-shape-icon {
                    animation: printer-pulse 1.5s ease-in-out infinite;
                  }
                  {% endif %}
            - type: custom:mushroom-template-card
              entity: sensor.ntk_ryansoffice_3dprinter_task_name
              primary: >-
                {% set name = states('sensor.ntk_ryansoffice_3dprinter_task_name') %}
                {% if name in ['unknown', 'unavailable', ''] %}No Active Print
                {% else %}{{ name }}{% endif %}
              secondary: >-
                {% set plate = state_attr('sensor.ntk_ryansoffice_3dprinter_task_name', 'plate_num') %}
                {% if plate is not none and plate | int(0) > 0 %}Plate {{ plate }}{% endif %}
              icon: mdi:cube-outline
              icon_color: >-
                {% if states('sensor.ntk_ryansoffice_3dprinter_task_name') in ['unknown', 'unavailable', ''] %}grey{% else %}blue{% endif %}
              tap_action:
                action: more-info
              card_mod:
                style: |
                  .primary {
                    white-space: normal !important;
                    overflow: visible !important;
                    text-overflow: unset !important;
                    font-size: 12px !important;
                    line-height: 1.3 !important;
                    word-break: break-word !important;
                  }
            - type: custom:button-card
              entity: sensor.ntk_ryansoffice_3dprinter_task_name
              show_name: false
              show_state: false
              show_icon: false
              tap_action:
                action: none
              custom_fields:
                chips: |
                  [[[
                    const chips = [];
                    const toTitleCase = s => s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
                    const validState = v => v !== null && v !== undefined && v !== '' && v !== 'unknown' && v !== 'unavailable';
                    const numObjects = states['sensor.ntk_ryansoffice_3dprinter_printable_objects']?.state;
                    if (validState(numObjects) && parseInt(numObjects, 10) > 1) {
                      chips.push(`<span class="chip"><ha-icon icon="mdi:shape-outline" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${numObjects} objects</span>`);
                    }
                    const skipped = states['sensor.ntk_ryansoffice_3dprinter_skipped_objects']?.state;
                    if (validState(skipped) && parseInt(skipped, 10) >= 1) {
                      chips.push(`<span class="chip chip-warn"><ha-icon icon="mdi:close-circle-outline" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${skipped} skipped</span>`);
                    }
                    const nozzleSize = states['sensor.ntk_ryansoffice_3dprinter_nozzle_diameter']?.state;
                    const nozzleType = states['sensor.ntk_ryansoffice_3dprinter_nozzle_type']?.state;
                    if (validState(nozzleSize)) {
                      const typeLabel = validState(nozzleType) ? ` · ${toTitleCase(nozzleType)}` : '';
                      chips.push(`<span class="chip"><ha-icon icon="mdi:printer-3d-nozzle" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${nozzleSize}mm${typeLabel}</span>`);
                    }
                    const bedType = states['sensor.ntk_ryansoffice_3dprinter_print_bed_type']?.state;
                    if (validState(bedType)) {
                      chips.push(`<span class="chip"><ha-icon icon="mdi:table-furniture" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${toTitleCase(bedType)}</span>`);
                    }
                    const printType = states['sensor.ntk_ryansoffice_3dprinter_print_type']?.state;
                    if (validState(printType) && printType !== 'idle') {
                      chips.push(`<span class="chip"><ha-icon icon="mdi:layers-outline" style="--mdc-icon-size:13px;vertical-align:middle;"></ha-icon>&nbsp;${String(printType).toUpperCase()}</span>`);
                    }
                    if (chips.length === 0) return `<div></div>`;
                    return `<div class="chips-row">${chips.join('')}</div>`;
                  ]]]
              styles:
                card:
                  - padding: 4px 8px
                  - background: transparent
                  - box-shadow: none
                  - border: none
                custom_fields:
                  chips:
                    - width: 100%
                    - text-align: left
              extra_styles: |
                .chips-row {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 4px;
                  padding: 2px 0;
                }
                .chip {
                  display: inline-flex;
                  align-items: center;
                  gap: 2px;
                  padding: 2px 7px;
                  border-radius: 12px;
                  font-size: 11px;
                  font-weight: 500;
                  background: rgba(128, 128, 128, 0.15);
                  color: var(--primary-text-color);
                  white-space: nowrap;
                }
                .chip-warn {
                  background: rgba(255, 152, 0, 0.2);
                  color: #f57c00;
                }
      grid_options:
        columns: full
        rows: auto
    - !include ../../print_progress/dashboard_cards/print-progress-kpi-option-15-sweep-hold-chase.yaml
    - type: horizontal-stack
      cards:
        - !include ../../print_progress/dashboard_cards/time-remaining.yaml
        - !include ../../print_progress/dashboard_cards/estimated-completion-time.yaml
    - !include ../../printer_controls/dashboard_cards/printer-control-with-power.yaml
    #- !include ../../printer_controls/dashboard_cards/printer-movement-controls-with-toggle.yaml
    - !include ../../print_weight_and_cost/dashboard_cards/print-weight-and-cost-tabs.yaml
  columns: 2
  square: false
- type: grid
  cards:
    - !include ../../printer_led/dashboard_cards/printer-led-controls.yaml
    - type: conditional
      conditions:
        - condition: state
          entity: input_boolean.show_printer_controls
          state: "on"
      card:
        type: custom:ha-bambulab-print_status-card
        printer: 210dfdfa64085e8cf073e50eae757d90
        style: simple
        custom_power: switch.sonoff_10018b4baf
    - type: custom:advanced-camera-card
      cameras:
        - camera_entity: camera.ntk_ryansoffice_3dprinter_camera
          live_provider: auto
          capabilities:
            disable: []
          always_error_if_entity_unavailable: false
          image:
            mode: camera
            # mode: url with a custom image replaces the default "flowers"
            # screensaver shown while the live stream is loading.
            # Place your image at /config/www/bambu-printer.jpg in HA.
            #mode: url
            #url: /local/bambu-printer.jpg
        - camera_entity: camera.3dprintertopcamera_hd_stream
          #image:
            # mode: url with a custom image replaces the default "flowers"
            # screensaver shown while the live stream is loading.
            # Place your image at /config/www/bambu-printer.jpg in HA.
            #mode: url
            #url: /local/bambu-printer.jpg
      status_bar:
        items:
          engine:
            enabled: true
          resolution:
            enabled: true
        style: none
      performance:
        features:
          card_loading_effects: false
          animated_progress_indicator: true
          card_loading_indicator: true
        style:
          border_radius: true
      view:
        dim: false
        theme:
          themes:
            - dark
        default_cycle_camera: false
      menu:
        buttons:
          iris:
            enabled: false
          camera_ui:
            enabled: false
          expand:
            enabled: true
          display_mode:
            enabled: true
            alignment: opposing
          live:
            enabled: false
          cameras:
            enabled: false
          substreams:
            enabled: false
          clips:
            enabled: false
          snapshots:
            enabled: false
          download:
            enabled: false
          timeline:
            enabled: false
          folders:
            enabled: false
          media_player:
            enabled: false
          image:
            enabled: false
        style: overlay
        alignment: right
      live:
        draggable: true
        zoomable: true
        show_image_during_load: true
        controls:
          builtin: true
          wheel: true
        display: {}
      media_gallery:
        controls:
          thumbnails:
            size: 228
    - !include ../../printer_temps/dashboard_cards/printer-temps.yaml
    - !include ../../printer_controls/dashboard_cards/fan_controls_v2.yaml
