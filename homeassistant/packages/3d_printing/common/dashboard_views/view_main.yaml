# Docs: docs/features/printer_dashboards/README.md
title: Home
# Keep at 3 so error-alert sections with column_span: 3 always render full-width
max_columns: 3
sections:
- !include ../../error_alerts/dashboard_cards/error-alert-section.yaml
- type: grid
  cards:
    - type: vertical-stack
      cards:
        - !include ../../common/dashboard_cards/home_top_info_separator.yaml
      grid_options:
        columns: full
  column_span: 3
- type: grid
  cards:
    - type: horizontal-stack
      cards:
        - type: picture-entity
          entity: image.ntk_ryansoffice_3dprinter_cover_image
          show_name: false
          show_state: false
          tap_action:
            action: more-info
          card_mod:
            style: |
              ha-card {
                border-radius: 8px !important;
                padding: 8px !important;
                overflow: hidden;
              }
              img {
                object-fit: contain !important;
                border-radius: 4px !important;
              }
        - type: vertical-stack
          cards:
            - type: custom:mushroom-template-card
              entity: sensor.ntk_ryansoffice_3dprinter_smart_status
              primary: >-
                {{ states('sensor.ntk_ryansoffice_3dprinter_smart_status') }}
              secondary: >-
                {{ state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'detail') }}
              icon: >-
                {% set status_class = state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'status_class') %}
                {% set hms = states('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors') %}
                {% if hms == 'on' %}mdi:alert-circle
                {% elif status_class in ['unmapped', 'failed'] %}mdi:alert-octagon
                {% elif status_class == 'finished' %}mdi:check-circle
                {% elif status_class == 'paused' %}mdi:pause-circle
                {% elif status_class == 'printing' %}mdi:printer-3d-nozzle
                {% elif status_class == 'heating' %}mdi:thermometer-lines
                {% elif status_class == 'leveling' %}mdi:grid
                {% elif status_class == 'offline' %}mdi:lan-disconnect
                {% elif status_class == 'idle' %}mdi:printer-3d
                {% else %}mdi:rotate-3d{% endif %}
              icon_color: >-
                {% set hms = states('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors') %}
                {% set status_class = state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'status_class') %}
                {% if hms == 'on' %}red
                {% elif status_class in ['unmapped', 'failed'] %}red
                {% elif status_class == 'finished' %}green
                {% elif status_class == 'paused' %}orange
                {% elif status_class == 'printing' %}blue
                {% elif status_class in ['idle', 'offline'] %}grey
                {% else %}green{% endif %}
              tap_action:
                action: more-info
              card_mod:
                style: >
                  {% set status_class = state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'status_class') %}
                  {% if status_class in ['printing', 'preparing'] %}
                  @keyframes printer-pulse {
                    0%, 100% { opacity: 1; }
                    50% { opacity: 0.5; }
                  }
                  mushroom-shape-icon {
                    animation: printer-pulse 1.5s ease-in-out infinite;
                  }
                  {% endif %}
            - type: custom:mushroom-template-card
              entity: sensor.active_print_display_name
              primary: >-
                {% set name = states('sensor.active_print_display_name') %}
                {% if name in ['unknown', 'unavailable', ''] %}No Active Print
                {% else %}{{ name }}{% endif %}
              secondary: >-
                {{ state_attr('sensor.active_print_display_name', 'secondary_label') | default('', true) }}
              icon: mdi:cube-outline
              icon_color: >-
                {% if states('sensor.active_print_display_name') in ['unknown', 'unavailable', '', 'No Active Print'] %}grey{% else %}blue{% endif %}
              tap_action:
                action: more-info
              card_mod:
                style: |
                  ha-card {
                    overflow: visible !important;
                    --card-primary-font-size: 0.88rem;
                    --card-primary-line-height: 1.25rem;
                  }
                  mushroom-state-info {
                    overflow: visible !important;
                    align-self: flex-start;
                  }
                  .primary {
                    white-space: normal !important;
                    display: -webkit-box !important;
                    -webkit-box-orient: vertical !important;
                    -webkit-line-clamp: 2 !important;
                    overflow: hidden !important;
                    text-overflow: ellipsis !important;
                    word-break: break-word !important;
                    overflow-wrap: anywhere !important;
                    line-height: 1.25 !important;
                  }
            - !include ../../common/dashboard_cards/print-detail-chips.yaml
      grid_options:
        columns: full
        rows: auto
    - !include ../../print_progress/dashboard_cards/print-progress-kpi-option-15-sweep-hold-chase.yaml
    - type: horizontal-stack
      cards:
        - !include ../../print_progress/dashboard_cards/time-remaining.yaml
        - !include ../../print_progress/dashboard_cards/estimated-completion-time.yaml
    - !include ../../printer_controls/dashboard_cards/printer-control-with-power.yaml
    - !include ../../print_weight_and_cost/dashboard_cards/print-weight-and-cost-tabs.yaml
    - !include ../../power_monitoring/dashboard_cards/power-usage-card.yaml
  columns: 2
  square: false
- type: grid
  cards:
    - !include ../../printer_led/dashboard_cards/printer-led-controls.yaml
    - type: conditional
      conditions:
        - condition: state
          entity: input_boolean.show_printer_controls
          state: "on"
      card:
        type: custom:ha-bambulab-print_status-card
        printer: 210dfdfa64085e8cf073e50eae757d90
        style: simple
        custom_power: switch.sonoff_10018b4baf
    - type: custom:advanced-camera-card
      cameras:
        - camera_entity: camera.ntk_ryansoffice_3dprinter_camera
          live_provider: auto
          capabilities:
            disable: []
          always_error_if_entity_unavailable: false
          image:
            mode: camera
            # mode: url with a custom image replaces the default "flowers"
            # screensaver shown while the live stream is loading.
            # Place your image at /config/www/bambu-printer.jpg in HA.
            #mode: url
            #url: /local/bambu-printer.jpg
        - camera_entity: camera.3dprintertopcamera_hd_stream
          #image:
            # mode: url with a custom image replaces the default "flowers"
            # screensaver shown while the live stream is loading.
            # Place your image at /config/www/bambu-printer.jpg in HA.
            #mode: url
            #url: /local/bambu-printer.jpg
        - camera_entity: camera.3d_printer_top_tapo_c110_hd_stream
      status_bar:
        items:
          engine:
            enabled: true
          resolution:
            enabled: true
        style: none
      performance:
        features:
          card_loading_effects: false
          animated_progress_indicator: true
          card_loading_indicator: true
        style:
          border_radius: true
      view:
        dim: false
        theme:
          themes:
            - dark
        default_cycle_camera: false
      menu:
        buttons:
          iris:
            enabled: false
          camera_ui:
            enabled: false
          expand:
            enabled: true
          display_mode:
            enabled: true
            alignment: opposing
          live:
            enabled: false
          cameras:
            enabled: false
          substreams:
            enabled: false
          clips:
            enabled: false
          snapshots:
            enabled: false
          download:
            enabled: false
          timeline:
            enabled: false
          folders:
            enabled: false
          media_player:
            enabled: false
          image:
            enabled: false
        style: overlay
        alignment: right
      live:
        draggable: true
        zoomable: true
        show_image_during_load: true
        controls:
          builtin: true
          wheel: true
        display: {}
      media_gallery:
        controls:
          thumbnails:
            size: 228
    - !include ../../printer_temps/dashboard_cards/printer-temps.yaml
    - !include ../../printer_controls/dashboard_cards/fan_controls_v2.yaml
    - !include ../../air_quality/dashboard_cards/air-quality-cards.yaml
    - !include ../../air_quality/dashboard_cards/bento-box-filter-cards.yaml
