type: custom:vertical-layout
path: spool
icon: fapro:filament-2
cards:
- type: custom:bubble-card
  card_type: separator
  sub_button:
    main: []
    bottom: []
  name: Spool Information
  icon: fapro:filament-2
  card_layout: large
- type: custom:config-template-card
  variables:
    selected_entity: "states['sensor.selected_spool'] && states[states['sensor.selected_spool'].state] ? states['sensor.selected_spool'].state : 'sensor.selected_spool'"
    has_spool: "states['sensor.selected_spool'] && states[states['sensor.selected_spool'].state]"
  entities:
    - sensor.selected_spool
  card:
    type: custom:bubble-card
    card_type: button
    button_type: "${ has_spool ? 'state' : 'name' }"
    entity: ${selected_entity}
    icon: ''
    name: "${ has_spool ? '' : 'No spool selected' }"
    show_icon: true
    show_attribute: false
    show_state: false
    tap_action:
      action: "${ has_spool ? 'more-info' : 'none' }"
    scrolling_effect: true
    rows: 1.719
    styles: |
      /* Global bump */ 
      * { 
        font-size: 18px !important; 
      } 

      /* Main entity name */ 
      .bubble-name { 
        font-size: 22px !important; 
        font-weight: 700; 
      } 

      /* Top location attribute */ 
      .bubble-sub-button-main .bubble-sub-button-text { 
        font-size: 22px !important; 
        font-weight: 600; 
      } 

      /* Bottom ID label */ 
      .bubble-sub-button-bottom .bubble-sub-button-text, .bubble-state { 
        font-size: 16px !important; 
        font-weight: 600; 
      }
    sub_button:
      main: []
      bottom:
        - entity: ${selected_entity}
          icon: fas:location-dot
          tap_action:
            action: "${ has_spool ? 'more-info' : 'none' }"
          show_background: true
          state_background: false
          show_icon: true
          show_attribute: ${ has_spool }
          attribute: location
        - entity: ${selected_entity}
          icon: mdi:weight-gram
          tap_action:
            action: "${ has_spool ? 'more-info' : 'none' }"
          state_background: false
          show_state: ${ has_spool }
- type: custom:bubble-card
  card_type: separator
  sub_button:
    main: []
    bottom: []
  name: Change Location
  icon: mdi:map-marker-distance
  card_layout: large
- type: custom:config-template-card
  entities:
    - sensor.selected_spool
  variables:
    selected_entity: "states['sensor.selected_spool'] && states[states['sensor.selected_spool'].state] ? states['sensor.selected_spool'].state : 'sensor.selected_spool'"
    spool_id: "states['sensor.selected_spool'] && states[states['sensor.selected_spool'].state] ? states[states['sensor.selected_spool'].state].attributes.id : ''"
  card:
    type: custom:bubble-card
    card_type: sub-buttons
    entity: ${selected_entity}
    hide_main_background: false
    rows: 0.938
    sub_button:
      main: []
      bottom:
        - tap_action:
            action: "${ spool_id ? 'perform-action' : 'none' }"
            perform_action: script.update_spool_location
            target: {}
            data:
              spool_id: ${ spool_id }
              location: AMS
          name: AMS
          show_name: true
          icon: fas:arrow-right-to-bracket
          show_state: false
          state_background: false
        - tap_action:
            action: "${ spool_id ? 'perform-action' : 'none' }"
            perform_action: script.update_spool_location
            target: {}
            data:
              spool_id: ${ spool_id }
              location: AMS 2
          name: AMS 2
          show_name: true
          icon: fas:arrow-right-to-bracket
          show_state: false
          state_background: false
- type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-template-columns: 1fr auto
    grid-gap: 12px
  cards:
    - type: entities
      entities:
        - entity: input_select.spool_location_choice
          name: 'Move to:'
          secondary_info: none
      theme: Metro Blue
      card_mod:
        style: |
          ha-card {
            font-size: 1.4rem;
          }
    - show_name: false
      show_icon: true
      type: button
      icon: mdi:refresh-circle
      name: ''
      tap_action:
        action: perform-action
        perform_action: automation.trigger
        target:
          entity_id: automation.spoolman_location_sync
        data:
          skip_condition: true
      show_state: false
      theme: Metro Blue
      card_mod:
        style: |
          ha-card {
            width: 70px;       /* icon-sized */
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          ha-icon {
            width: 48px;
            height: 48px;
          }
- type: custom:config-template-card
  entities:
    - sensor.selected_spool
    - input_select.spool_location_choice
  variables:
    selected_entity: "states['sensor.selected_spool'] && states[states['sensor.selected_spool'].state] ? states['sensor.selected_spool'].state : 'sensor.selected_spool'"
    spool_id: "states['sensor.selected_spool'] && states[states['sensor.selected_spool'].state] ? states[states['sensor.selected_spool'].state].attributes.id : ''"
    new_location: states['input_select.spool_location_choice'].state
  card:
    type: custom:bubble-card
    card_type: button
    button_type: name
    name: ${new_location}
    icon: mdi:tray-arrow-down
    show_icon: true
    tap_action:
      action: "${spool_id ? 'perform-action' : 'none'}"
      perform_action: script.update_spool_location
      target: {}
      data:
        spool_id: ${spool_id}
        location: ${new_location}
- type: custom:bubble-card
  card_type: separator
  sub_button:
    main: []
    bottom: []
  name: Desiccant Container
  icon: mdi:water-circle
  rows: '2'
- type: horizontal-stack
  cards:
    - type: custom:button-card
      show_icon: true
      show_name: false
      show_label: true
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      icon: mdi:water
      label: |
        [[[
          const selected_entity = states['sensor.selected_spool']?.state;
          const spool_entity = selected_entity ? states[selected_entity] : null;
          if (!spool_entity) return 'No spool selected';

          const date = spool_entity?.attributes?.extra_desiccant_filled;
          if (!date) return '—';

          const filled = new Date(date);
          const now = new Date();
          const days = Math.floor((now - filled) / 86400000);

          let ago;
          if (days < 7) ago = `${days}d ago`;
          else if (days < 30) ago = `${Math.floor(days / 7)}w ago`;
          else ago = `${Math.floor(days / 30)}mo ago`;

          return `${filled.toLocaleDateString('en-US')} (${ago})`;
        ]]]
      styles:
        grid:
          - grid-template-areas: '"i" "l"'
          - grid-template-rows: min-content min-content
          - justify-items: center
          - align-items: center
        card:
          - background: none
          - box-shadow: none
          - padding: 4px
        icon:
          - width: 25px
          - height: 25px
          - margin-bottom: 2px
          - color: |
              [[[
                const selected_entity = states['sensor.selected_spool']?.state;
                const spool_entity = selected_entity ? states[selected_entity] : null;
                if (!spool_entity) return 'gray';

                const date = spool_entity?.attributes?.extra_desiccant_filled;
                if (!date) return 'gray';

                const months = ((Date.now() - new Date(date)) / 86400000) / 30.437;
                if (months > 2.5) return 'red';
                if (months > 2.0) return 'orange';
                if (months > 1.5) return 'yellow';
                return 'green';
              ]]]
        label:
          - font-size: 14px
          - text-align: center
          - white-space: nowrap
    - type: custom:button-card
      icon: mdi:clock-check-outline
      label: |
        [[[
          const selected_entity = states['sensor.selected_spool']?.state;
          const spool_entity = selected_entity ? states[selected_entity] : null;
          return spool_entity?.attributes?.id ? 'Mark as refilled' : 'Select spool first';
        ]]]
      show_icon: true
      show_name: false
      show_label: true
      triggers_update: all
      tap_action:
        action: |
          [[[
            const selected_entity = states['sensor.selected_spool']?.state;
            const spool_entity = selected_entity ? states[selected_entity] : null;
            return spool_entity?.attributes?.id ? 'call-service' : 'none';
          ]]]
        service: script.refill_desiccant_update_date
        service_data:
          spool_id: |
            [[[
              const selected_entity = states['sensor.selected_spool']?.state;
              const spool_entity = selected_entity ? states[selected_entity] : null;
              return spool_entity?.attributes?.id || '';
            ]]]
      styles:
        grid:
          - grid-template-areas: '"i" "l"'
          - grid-template-rows: min-content min-content
          - justify-items: center
          - align-items: center
        card:
          - border: 1px solid rgba(0,0,0,0.15)
          - box-shadow: none
          - padding: 4px
          - opacity: |
              [[[
                const selected_entity = states['sensor.selected_spool']?.state;
                const spool_entity = selected_entity ? states[selected_entity] : null;
                return spool_entity?.attributes?.id ? '1' : '0.45';
              ]]]
        icon:
          - width: 25px
          - height: 25px
          - margin-bottom: 2px
        label:
          - font-size: 14px
          - font-weight: bold
          - text-align: center
          - white-space: nowrap
- type: horizontal-stack
  cards:
    - type: custom:button-card
      show_icon: true
      show_name: false
      show_label: true
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      icon: mdi:heat-wave
      label: |
        [[[
          const selected_entity = states['sensor.selected_spool']?.state;
          const spool_entity = selected_entity ? states[selected_entity] : null;
          if (!spool_entity) return 'No spool selected';

          const date = spool_entity?.attributes?.extra_last_dried;
          if (!date) return '—';

          const dried = new Date(date);
          const now = new Date();
          const days = Math.floor((now - dried) / 86400000);

          let ago;
          if (days < 7) ago = `${days}d ago`;
          else if (days < 30) ago = `${Math.floor(days / 7)}w ago`;
          else ago = `${Math.floor(days / 30)}mo ago`;

          return `${dried.toLocaleDateString('en-US')} (${ago})`;
        ]]]
      styles:
        grid:
          - grid-template-areas: '"i" "l"'
          - grid-template-rows: min-content min-content
          - justify-items: center
          - align-items: center
        card:
          - background: none
          - box-shadow: none
          - padding: 4px
        icon:
          - width: 25px
          - height: 25px
          - margin-bottom: 2px
          - color: |
              [[[
                const selected_entity = states['sensor.selected_spool']?.state;
                const spool_entity = selected_entity ? states[selected_entity] : null;
                if (!spool_entity) return 'gray';

                const date = spool_entity?.attributes?.extra_last_dried;
                if (!date) return 'gray';

                const months = ((Date.now() - new Date(date)) / 86400000) / 30.437;
                if (months > 6) return 'red';
                if (months > 3) return 'orange';
                return 'green';
              ]]]
        label:
          - font-size: 14px
          - text-align: center
          - white-space: nowrap
    - type: custom:button-card
      icon: mdi:heat-wave
      label: |
        [[[
          const selected_entity = states['sensor.selected_spool']?.state;
          const spool_entity = selected_entity ? states[selected_entity] : null;
          return spool_entity?.attributes?.id ? 'Mark as Dried' : 'Select spool first';
        ]]]
      show_icon: true
      show_name: false
      show_label: true
      triggers_update: all
      tap_action:
        action: |
          [[[
            const selected_entity = states['sensor.selected_spool']?.state;
            const spool_entity = selected_entity ? states[selected_entity] : null;
            return spool_entity?.attributes?.id ? 'call-service' : 'none';
          ]]]
        service: script.mark_spool_as_dried_in_spoolman
        service_data:
          spool_id: |
            [[[
              const selected_entity = states['sensor.selected_spool']?.state;
              const spool_entity = selected_entity ? states[selected_entity] : null;
              return spool_entity?.attributes?.id || '';
            ]]]
      styles:
        grid:
          - grid-template-areas: '"i" "l"'
          - grid-template-rows: min-content min-content
          - justify-items: center
          - align-items: center
        card:
          - border: 1px solid rgba(0,0,0,0.15)
          - box-shadow: none
          - padding: 4px
          - opacity: |
              [[[
                const selected_entity = states['sensor.selected_spool']?.state;
                const spool_entity = selected_entity ? states[selected_entity] : null;
                return spool_entity?.attributes?.id ? '1' : '0.45';
              ]]]
        icon:
          - width: 25px
          - height: 25px
          - margin-bottom: 2px
        label:
          - font-size: 14px
          - font-weight: bold
          - text-align: center
          - white-space: nowrap
- type: custom:bubble-card
  card_type: separator
  sub_button:
    main: []
    bottom: []
  name: Other Actions
  icon: mdi:gesture-tap
- type: custom:config-template-card
  entities: []
  variables:
    filament_id: new URLSearchParams(location.search).get("filament_id")
  card:
    type: custom:bubble-card
    card_type: button
    name: Load from Query String
    icon: mdi:download
    tap_action:
      action: perform-action
      perform_action: input_text.set_value
      target:
        entity_id: input_text.filament_id
      data:
        value: "${ filament_id || '' }"
    button_type: name
    sub_button:
      main: []
      bottom: []
    card_layout: large
