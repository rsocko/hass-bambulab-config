alias: Print Complete - Keep Purifier Running
id: print_complete_continue_purifier
description: >
  Keeps the air purifier running for 30 minutes after a print completes to continue
  filtering any residual particles and VOCs. After 30 minutes, if air quality is good,
  the purifier is turned off or reduced to low speed.
  
  This automation also manages the Bento Box fan to help with air circulation
  during the post-print period.

triggers:
  # Trigger when print completes
  - device_id: YOUR_PRINTER_DEVICE_ID_HERE
    domain: bambu_lab
    type: event_print_finished
    trigger: device

conditions: []

actions:
  # Calculate post-print gear based on air quality
  - variables:
      post_print_gear: >
        {% set pm25 = states('sensor.i_9psl_pm2_5') | float(0) %}
        {% set co2 = states('sensor.i_9psl_carbon_dioxide') | int(0) %}
        {% set voc = states('sensor.i_9psl_voc_index') | int(0) %}
        {% if pm25 >= 35 or co2 >= 1200 or voc >= 200 %}
          3
        {% else %}
          2
        {% endif %}
  
  # Ensure purifier is on and set gear
  - action: switch.turn_on
    target:
      entity_id: switch.ryans_office_air_power_switch
  
  - action: select.select_option
    target:
      entity_id: select.ryans_office_air_mode
    data:
      option: gearMode
  
  - action: number.set_value
    target:
      entity_id: number.ryans_office_air_gearmode
    data:
      value: "{{ post_print_gear }}"
  
  # Note: Bento Box fan is now controlled by dedicated automation
  # (bento_box_fan_auto_control.yaml) based on air quality and filament type
  
  # Log the action
  - action: logbook.log
    data:
      name: Post-Print Air Purification
      message: >
        Print completed: {{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}.
        Air purifier will run for 30 minutes to filter residual particles.
        Initial gear: {{ states('number.ryans_office_air_gearmode') }}.
  
  # Send notification
  - action: notify.notify
    data:
      title: "🖨️ Print Complete - Air Filtering"
      message: >
        Print completed: {{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}
        
        Air purifier will continue running for 30 minutes.
        Current gear: {{ states('number.ryans_office_air_gearmode') }}
        
        PM2.5: {{ states('sensor.i_9psl_pm2_5') | round(1) }} µg/m³
        VOC: {{ states('sensor.i_9psl_voc_index') }} ppb
      data:
        notification_id: print_complete_air
        tag: print_control
  
  # Wait 30 minutes
  - delay:
      minutes: 30
  
  # Check air quality and adjust or turn off purifier
  - choose:
      # If air quality is still poor, keep running at current speed
      - conditions:
          - condition: template
            value_template: >
              {% set pm25 = states('sensor.i_9psl_pm2_5') | float(0) %}
              {% set co2 = states('sensor.i_9psl_carbon_dioxide') | int(0) %}
              {% set voc = states('sensor.i_9psl_voc_index') | int(0) %}
              {{ pm25 >= 35 or co2 >= 1200 or voc >= 200 }}
        sequence:
          - action: logbook.log
            data:
              name: Air Purification Extended
              message: >
                Air quality still poor after 30 minutes. Keeping purifier running.
                PM2.5: {{ states('sensor.i_9psl_pm2_5') | round(1) }} µg/m³,
                CO2: {{ states('sensor.i_9psl_carbon_dioxide') }} ppm,
                VOC: {{ states('sensor.i_9psl_voc_index') }} ppb
          
          - action: notify.notify
            data:
              title: "Air Purification Extended"
              message: >
                Air quality is still elevated after 30 minutes of filtering.
                
                Keeping purifier running.
                
                PM2.5: {{ states('sensor.i_9psl_pm2_5') | round(1) }} µg/m³
                CO2: {{ states('sensor.i_9psl_carbon_dioxide') }} ppm
                VOC: {{ states('sensor.i_9psl_voc_index') }} ppb
              data:
                notification_id: purification_extended
                tag: air_quality
      
      # If air quality is moderate, reduce to low speed
      - conditions:
          - condition: template
            value_template: >
              {% set pm25 = states('sensor.i_9psl_pm2_5') | float(0) %}
              {% set co2 = states('sensor.i_9psl_carbon_dioxide') | int(0) %}
              {% set voc = states('sensor.i_9psl_voc_index') | int(0) %}
              {{ pm25 >= 12 or co2 >= 800 or voc >= 100 }}
        sequence:
          - action: number.set_value
            target:
              entity_id: number.ryans_office_air_gearmode
            data:
              value: 1
          
          - action: logbook.log
            data:
              name: Air Purifier Reduced
              message: >
                Air quality moderate after 30 minutes. Reduced purifier to gear 1.
                PM2.5: {{ states('sensor.i_9psl_pm2_5') | round(1) }} µg/m³
                Note: Bento Box fan controlled by separate automation.
    
    # Default: Air quality is good, turn off purifier
    default:
      - action: switch.turn_off
        target:
          entity_id: switch.ryans_office_air_power_switch
      
      - action: logbook.log
        data:
          name: Air Purification Complete
          message: >
            Air quality good after 30 minutes. Turned off purifier.
            PM2.5: {{ states('sensor.i_9psl_pm2_5') | round(1) }} µg/m³,
            CO2: {{ states('sensor.i_9psl_carbon_dioxide') }} ppm,
            VOC: {{ states('sensor.i_9psl_voc_index') }} ppb
            Note: Bento Box fan controlled by separate automation.
      
      - action: notify.notify
        data:
          title: "✅ Air Purification Complete"
          message: >
            Air quality has returned to good levels.
            
            Purifier turned off.
            
            PM2.5: {{ states('sensor.i_9psl_pm2_5') | round(1) }} µg/m³
            CO2: {{ states('sensor.i_9psl_carbon_dioxide') }} ppm
            VOC: {{ states('sensor.i_9psl_voc_index') }} ppb
          data:
            notification_id: purification_complete
            tag: air_quality

mode: restart
