# ============================================================
# CUSTOMIZATION TIPS:
# ============================================================
# 1. Entity Names:
#    - Replace 'airgradient_xxxx' with your Air Gradient sensor entity names
#    - Replace 'govee_air_purifier' with your actual Govee fan entity name
#    - Check entity IDs in Home Assistant Developer Tools > States
#
# 2. Air Quality Thresholds:
#    PM2.5 (µg/m³):
#      - Good: 0-12
#      - Moderate: 12-35
#      - Unhealthy: 35-55
#      - Very Unhealthy: 55+
#    
#    CO2 (ppm):
#      - Good: <800
#      - Moderate: 800-1200
#      - Poor: 1200-2000
#      - Very Poor: 2000+
#    
#    VOC (ppb or index):
#      - Good: <100
#      - Moderate: 100-200
#      - Poor: 200-300
#      - Very Poor: 300+
#
# 3. Colors:
#    - Green: Good air quality
#    - Yellow: Moderate, starting to degrade
#    - Orange: Poor, action recommended
#    - Red: Very poor, immediate action needed
#    - Grey: Off or unavailable
#
# 4. Fan Speed Presets:
#    - Low: 33% (quiet operation)
#    - Medium: 66% (balanced)
#    - High: 100% (maximum purification)
#    - Adjust percentages based on your Govee model
#
# 5. Alternative Integrations:
#    If using ESPHome instead of Air Gradient integration:
#    - Entity names might be: sensor.esphome_airgradient_pm25
#    - Check your ESPHome device configuration
#
#    If using different Govee integration:
#    - Entity might be: fan.goveelife_air_purifier_lite
#    - Some Govee models use preset_mode instead of percentage
#
# 6. Additional Sensors:
#    Some Air Gradient models also provide:
#    - PM1.0 and PM10 particulate matter
#    - NOx (Nitrogen Oxides)
#    - Atmospheric pressure
#    Add additional cards following the same pattern
#
# ============================================================
