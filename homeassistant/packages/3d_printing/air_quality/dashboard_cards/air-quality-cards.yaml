# ============================================================
# Air Quality Monitoring and Control Cards
# ============================================================
# Consolidated air quality display with improved text visibility.
# Sensors split across two rows (3 per row) for readability.
# Govee purifier speed controls moved to a browser_mod popup.
#
# REQUIRED CUSTOM CARDS:
# - mushroom (via HACS)
# - card-mod (via HACS)
# - browser-mod (via HACS) - for purifier speed popup
#
# REQUIRED INTEGRATIONS:
# - Air Gradient (or ESPHome for Air Gradient DIY)
# - Govee (via HACS or official integration)
# ============================================================

type: vertical-stack
cards:
  # ── Overall Air Quality Status (consolidated header) ────────
  - type: custom:mushroom-template-card
    primary: Air Quality
    secondary: |-
      {% set pm25 = states('sensor.i_9psl_pm2_5') | float(0) %}
      {% set co2 = states('sensor.i_9psl_carbon_dioxide') | int(0) %}
      {% set voc = states('sensor.i_9psl_voc_index') | int(0) %}
      {% if pm25 >= 55 or co2 >= 2000 or voc >= 300 %}
        Very Poor — Purifier Recommended
      {% elif pm25 >= 35 or co2 >= 1200 or voc >= 200 %}
        Poor — Consider Purifier
      {% elif pm25 >= 12 or co2 >= 800 or voc >= 100 %}
        Moderate
      {% else %}
        Good
      {% endif %}
    icon: mdi:weather-windy
    icon_color: |-
      {% set pm25 = states('sensor.i_9psl_pm2_5') | float(0) %}
      {% set co2 = states('sensor.i_9psl_carbon_dioxide') | int(0) %}
      {% set voc = states('sensor.i_9psl_voc_index') | int(0) %}
      {% if pm25 >= 55 or co2 >= 2000 or voc >= 300 %}
        red
      {% elif pm25 >= 35 or co2 >= 1200 or voc >= 200 %}
        orange
      {% elif pm25 >= 12 or co2 >= 800 or voc >= 100 %}
        yellow
      {% else %}
        green
      {% endif %}
    tap_action:
      action: none
    card_mod:
      style: |
        ha-card {
          --card-primary-font-size: 16px;
          --card-secondary-font-size: 14px;
        }

  # ── Sensor Row 1: PM2.5 · CO2 · VOC ────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: PM2.5
        secondary: |-
          {% set pm25 = states('sensor.i_9psl_pm2_5') | float(0) %}
          {{ pm25 | round(1) }} µg/m³
        icon: mdi:air-filter
        icon_color: |-
          {% set pm25 = states('sensor.i_9psl_pm2_5') | float(0) %}
          {% if pm25 < 12 %}green
          {% elif pm25 < 35 %}yellow
          {% elif pm25 < 55 %}orange
          {% else %}red{% endif %}
        tap_action:
          action: more-info
          entity: sensor.i_9psl_pm2_5

      - type: custom:mushroom-template-card
        primary: CO2
        secondary: |-
          {% set co2 = states('sensor.i_9psl_carbon_dioxide') | int(0) %}
          {{ co2 }} ppm
        icon: mdi:molecule-co2
        icon_color: |-
          {% set co2 = states('sensor.i_9psl_carbon_dioxide') | int(0) %}
          {% if co2 < 800 %}green
          {% elif co2 < 1200 %}yellow
          {% elif co2 < 2000 %}orange
          {% else %}red{% endif %}
        tap_action:
          action: more-info
          entity: sensor.i_9psl_carbon_dioxide

      - type: custom:mushroom-template-card
        primary: VOC
        secondary: |-
          {% set voc = states('sensor.i_9psl_voc_index') | int(0) %}
          {{ voc }} ppb
        icon: mdi:chemical-weapon
        icon_color: |-
          {% set voc = states('sensor.i_9psl_voc_index') | int(0) %}
          {% if voc < 100 %}green
          {% elif voc < 200 %}yellow
          {% elif voc < 300 %}orange
          {% else %}red{% endif %}
        tap_action:
          action: more-info
          entity: sensor.i_9psl_voc_index

  # ── Sensor Row 2: Temp · Humidity · Purifier ────────────────
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Temp
        secondary: |-
          {% set temp = states('sensor.i_9psl_temperature') | float(0) %}
          {{ temp | round(1) }}°{{ state_attr('sensor.i_9psl_temperature', 'unit_of_measurement') or 'C' }}
        icon: mdi:thermometer
        icon_color: |-
          {% set temp = states('sensor.i_9psl_temperature') | float(0) %}
          {% if temp < 18 %}blue
          {% elif temp < 24 %}green
          {% elif temp < 28 %}amber
          {% else %}red{% endif %}
        tap_action:
          action: more-info
          entity: sensor.i_9psl_temperature

      - type: custom:mushroom-template-card
        primary: Humidity
        secondary: |-
          {% set humidity = states('sensor.i_9psl_humidity') | float(0) %}
          {{ humidity | round(0) }}%
        icon: mdi:water-percent
        icon_color: |-
          {% set humidity = states('sensor.i_9psl_humidity') | float(0) %}
          {% if humidity < 30 %}red
          {% elif humidity < 40 %}amber
          {% elif humidity < 60 %}green
          {% elif humidity < 70 %}amber
          {% else %}blue{% endif %}
        tap_action:
          action: more-info
          entity: sensor.i_9psl_humidity

      # Purifier — tap opens popup with speed controls
      - type: custom:mushroom-template-card
        primary: Purifier
        secondary: |-
          {% if is_state('switch.ryans_office_air_power_switch', 'on') %}
            On · Gear {{ states('number.ryans_office_air_gearmode') | int(0) }}
          {% elif is_state('switch.ryans_office_air_power_switch', 'off') %}
            Off
          {% else %}
            Unavailable
          {% endif %}
        icon: mdi:air-purifier
        icon_color: |-
          {% set state = states('switch.ryans_office_air_power_switch') %}
          {% if state == 'off' or state in ['unavailable', 'unknown'] %}
            grey
          {% else %}
            {% set gear = states('number.ryans_office_air_gearmode') | int(0) %}
            {% if gear <= 1 %}green
            {% elif gear == 2 %}amber
            {% else %}red{% endif %}
          {% endif %}
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Air Purifier Controls
              content:
                type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Govee Air Purifier
                    secondary: |-
                      {% if is_state('switch.ryans_office_air_power_switch', 'on') %}
                        On · Gear {{ states('number.ryans_office_air_gearmode') | int(0) }}
                      {% else %}
                        Off
                      {% endif %}
                    icon: mdi:air-purifier
                    icon_color: |-
                      {% if is_state('switch.ryans_office_air_power_switch', 'on') %}green{% else %}grey{% endif %}
                    tap_action:
                      action: call-service
                      service: switch.toggle
                      target:
                        entity_id: switch.ryans_office_air_power_switch
                  - type: horizontal-stack
                    cards:
                      - type: custom:mushroom-template-card
                        primary: Low
                        icon: mdi:fan-speed-1
                        icon_color: |-
                          {% if states('number.ryans_office_air_gearmode') | int(0) == 1 and is_state('switch.ryans_office_air_power_switch', 'on') %}green{% else %}grey{% endif %}
                        tap_action:
                          action: call-service
                          service: number.set_value
                          target:
                            entity_id: number.ryans_office_air_gearmode
                          data:
                            value: 1
                      - type: custom:mushroom-template-card
                        primary: Medium
                        icon: mdi:fan-speed-2
                        icon_color: |-
                          {% if states('number.ryans_office_air_gearmode') | int(0) == 2 and is_state('switch.ryans_office_air_power_switch', 'on') %}amber{% else %}grey{% endif %}
                        tap_action:
                          action: call-service
                          service: number.set_value
                          target:
                            entity_id: number.ryans_office_air_gearmode
                          data:
                            value: 2
                      - type: custom:mushroom-template-card
                        primary: High
                        icon: mdi:fan-speed-3
                        icon_color: |-
                          {% if states('number.ryans_office_air_gearmode') | int(0) >= 3 and is_state('switch.ryans_office_air_power_switch', 'on') %}red{% else %}grey{% endif %}
                        tap_action:
                          action: call-service
                          service: number.set_value
                          target:
                            entity_id: number.ryans_office_air_gearmode
                          data:
                            value: 3
