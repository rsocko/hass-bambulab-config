# ============================================================
# Bento Box Filter Status — Compact Card with Popup Detail
# ============================================================
# Shows a single compact status card on the main dashboard.
# Tapping opens a browser_mod popup with full filter health,
# runtime tracking, fan speed control, and reset buttons.
#
# REQUIRED CUSTOM CARDS:
# - mushroom (via HACS)
# - card-mod (via HACS)
# - browser-mod (via HACS) - for popup
#
# REQUIRED: air_quality package deployed (helpers + template sensors)
# ============================================================

type: custom:mushroom-template-card
primary: Bento Box
secondary: |-
  {% set status = states('sensor.bento_box_filter_status') %}
  {% set hepa = states('sensor.bento_box_hepa_filter_usage') | float(0) | round(0) %}
  {% set carbon = states('sensor.bento_box_carbon_filter_usage') | float(0) | round(0) %}
  {{ status }} · HEPA {{ hepa }}% · Carbon {{ carbon }}%
icon: |-
  {% set status = states('sensor.bento_box_filter_status') %}
  {% if status == 'Replace Now' %}
    mdi:alert-circle
  {% elif status == 'Replace Soon' %}
    mdi:alert
  {% elif status == 'Monitor' %}
    mdi:information
  {% else %}
    mdi:check-circle
  {% endif %}
icon_color: |-
  {% set status = states('sensor.bento_box_filter_status') %}
  {% if status == 'Replace Now' %}
    red
  {% elif status == 'Replace Soon' %}
    orange
  {% elif status == 'Monitor' %}
    yellow
  {% else %}
    green
  {% endif %}
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: Bento Box Filters
      content:
        type: vertical-stack
        cards:
          # ── Overall status header ──────────────────────
          - type: custom:mushroom-template-card
            primary: Filter Status
            secondary: "{{ states('sensor.bento_box_filter_status') }}"
            icon: "{{ state_attr('sensor.bento_box_filter_status', 'icon') }}"
            icon_color: |-
              {% set s = states('sensor.bento_box_filter_status') %}
              {% if s == 'Replace Now' %}red
              {% elif s == 'Replace Soon' %}orange
              {% elif s == 'Monitor' %}yellow
              {% else %}green{% endif %}
            tap_action:
              action: none

          # ── HEPA Filter detail ─────────────────────────
          - type: custom:mushroom-template-card
            primary: HEPA Filter
            secondary: >-
              {% set usage = states('sensor.bento_box_hepa_filter_usage') | float(0) %}
              {% set hours = states('input_number.bento_box_hepa_runtime_hours') | float(0) | round(0) %}
              {% set remaining = state_attr('sensor.bento_box_hepa_filter_usage', 'remaining_hours') | float(0) | round(0) %}
              {% set days = state_attr('sensor.bento_box_hepa_filter_usage', 'days_since_replacement') %}
              {{ usage | round(0) }}% used · {{ hours }}h runtime · {{ remaining }}h remaining
              {% if days and days != 'unknown' %} · Replaced {{ days }}d ago{% endif %}
            multiline_secondary: true
            icon: mdi:air-filter
            icon_color: |-
              {% set usage = states('sensor.bento_box_hepa_filter_usage') | float(0) %}
              {% if usage >= 100 %}red
              {% elif usage >= 90 %}orange
              {% elif usage >= 75 %}yellow
              {% else %}green{% endif %}
            badge_icon: |-
              {% set status = state_attr('sensor.bento_box_hepa_filter_usage', 'status') %}
              {% if status == 'overdue' %}mdi:alert-circle
              {% elif status == 'replace_soon' %}mdi:alert
              {% elif status == 'warning' %}mdi:information
              {% else %}mdi:check-circle{% endif %}
            badge_color: |-
              {% set status = state_attr('sensor.bento_box_hepa_filter_usage', 'status') %}
              {% if status == 'overdue' %}red
              {% elif status == 'replace_soon' %}orange
              {% elif status == 'warning' %}yellow
              {% else %}green{% endif %}
            tap_action:
              action: more-info
              entity: sensor.bento_box_hepa_filter_usage

          # ── Carbon Filter detail ───────────────────────
          - type: custom:mushroom-template-card
            primary: Carbon Filter
            secondary: >-
              {% set usage = states('sensor.bento_box_carbon_filter_usage') | float(0) %}
              {% set hours = states('input_number.bento_box_carbon_runtime_hours') | float(0) | round(0) %}
              {% set remaining = state_attr('sensor.bento_box_carbon_filter_usage', 'remaining_hours') | float(0) | round(0) %}
              {% set days = state_attr('sensor.bento_box_carbon_filter_usage', 'days_since_replacement') %}
              {{ usage | round(0) }}% used · {{ hours }}h runtime · {{ remaining }}h remaining
              {% if days and days != 'unknown' %} · Replaced {{ days }}d ago{% endif %}
            multiline_secondary: true
            icon: mdi:air-filter
            icon_color: |-
              {% set usage = states('sensor.bento_box_carbon_filter_usage') | float(0) %}
              {% if usage >= 100 %}red
              {% elif usage >= 90 %}orange
              {% elif usage >= 75 %}yellow
              {% else %}green{% endif %}
            badge_icon: |-
              {% set status = state_attr('sensor.bento_box_carbon_filter_usage', 'status') %}
              {% if status == 'overdue' %}mdi:alert-circle
              {% elif status == 'replace_soon' %}mdi:alert
              {% elif status == 'warning' %}mdi:information
              {% else %}mdi:check-circle{% endif %}
            badge_color: |-
              {% set status = state_attr('sensor.bento_box_carbon_filter_usage', 'status') %}
              {% if status == 'overdue' %}red
              {% elif status == 'replace_soon' %}orange
              {% elif status == 'warning' %}yellow
              {% else %}green{% endif %}
            tap_action:
              action: more-info
              entity: sensor.bento_box_carbon_filter_usage

          # ── Fan speed control ──────────────────────────
          - type: custom:mushroom-fan-card
            entity: fan.bento_box_fan
            name: Bento Box Fan
            show_percentage_control: true

          # ── Reset buttons (compact, side by side) ──────
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Reset HEPA
                icon: mdi:restart
                icon_color: blue
                tap_action:
                  action: call-service
                  service: script.turn_on
                  target:
                    entity_id: script.reset_bento_box_hepa_filter
              - type: custom:mushroom-template-card
                primary: Reset Carbon
                icon: mdi:restart
                icon_color: purple
                tap_action:
                  action: call-service
                  service: script.turn_on
                  target:
                    entity_id: script.reset_bento_box_carbon_filter
card_mod:
  style: |
    ha-card {
      --card-primary-font-size: 14px;
      --card-secondary-font-size: 13px;
    }
