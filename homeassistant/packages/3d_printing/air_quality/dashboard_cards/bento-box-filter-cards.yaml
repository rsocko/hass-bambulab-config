# ============================================================
# Bento Box Filter Monitoring Dashboard Cards
# ============================================================
# Displays filter usage, runtime, and replacement controls for
# Bento Box HEPA and carbon filters.
#
# REQUIRED CUSTOM CARDS:
# - mushroom (via HACS)
# - card-mod (via HACS) - optional, for styling
#
# REQUIRED: air_quality package deployed (helpers + template sensors)
# ============================================================

type: vertical-stack
cards:
  # Overall Filter Status
  - type: custom:mushroom-template-card
    primary: Bento Box Filters
    secondary: "{{ states('sensor.bento_box_filter_status') }}"
    icon: "{{ state_attr('sensor.bento_box_filter_status', 'icon') }}"
    icon_color: |-
      {% set state = states('sensor.bento_box_filter_status') %}
      {% if state == 'Replace Now' %}
        red
      {% elif state == 'Replace Soon' %}
        orange
      {% elif state == 'Monitor' %}
        yellow
      {% else %}
        green
      {% endif %}
    tap_action:
      action: none
    card_mod:
      style: |
        ha-card {
          background: rgba(76, 175, 80, 0.05);
        }

  # Compact filter status - side by side
  - type: horizontal-stack
    cards:
      # HEPA Filter Status Card
      - type: custom:mushroom-template-card
        primary: HEPA Filter
        secondary: |-
          {% set usage = states('sensor.bento_box_hepa_filter_usage') | float(0) %}
          {% set hours = states('input_number.bento_box_hepa_runtime_hours') | round(0) %}
          {{ usage | round(0) }}% · {{ hours }}h
        icon: mdi:air-filter
        icon_color: |-
          {% set usage = states('sensor.bento_box_hepa_filter_usage') | float(0) %}
          {% if usage >= 100 %}
            red
          {% elif usage >= 90 %}
            orange
          {% elif usage >= 75 %}
            yellow
          {% else %}
            green
          {% endif %}
        badge_icon: |-
          {% set status = state_attr('sensor.bento_box_hepa_filter_usage', 'status') %}
          {% if status == 'overdue' %}
            mdi:alert-circle
          {% elif status == 'replace_soon' %}
            mdi:alert
          {% elif status == 'warning' %}
            mdi:information
          {% else %}
            mdi:check-circle
          {% endif %}
        badge_color: |-
          {% set status = state_attr('sensor.bento_box_hepa_filter_usage', 'status') %}
          {% if status == 'overdue' %}
            red
          {% elif status == 'replace_soon' %}
            orange
          {% elif status == 'warning' %}
            yellow
          {% else %}
            green
          {% endif %}
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: |
            ha-card {
              background: rgba(33, 150, 243, 0.05);
            }
            ha-card:hover {
              background: rgba(33, 150, 243, 0.1);
            }

      # Carbon Filter Status Card
      - type: custom:mushroom-template-card
        primary: Carbon Filter
        secondary: |-
          {% set usage = states('sensor.bento_box_carbon_filter_usage') | float(0) %}
          {% set hours = states('input_number.bento_box_carbon_runtime_hours') | round(0) %}
          {{ usage | round(0) }}% · {{ hours }}h
        icon: mdi:air-filter
        icon_color: |-
          {% set usage = states('sensor.bento_box_carbon_filter_usage') | float(0) %}
          {% if usage >= 100 %}
            red
          {% elif usage >= 90 %}
            orange
          {% elif usage >= 75 %}
            yellow
          {% else %}
            green
          {% endif %}
        badge_icon: |-
          {% set status = state_attr('sensor.bento_box_carbon_filter_usage', 'status') %}
          {% if status == 'overdue' %}
            mdi:alert-circle
          {% elif status == 'replace_soon' %}
            mdi:alert
          {% elif status == 'warning' %}
            mdi:information
          {% else %}
            mdi:check-circle
          {% endif %}
        badge_color: |-
          {% set status = state_attr('sensor.bento_box_carbon_filter_usage', 'status') %}
          {% if status == 'overdue' %}
            red
          {% elif status == 'replace_soon' %}
            orange
          {% elif status == 'warning' %}
            yellow
          {% else %}
            green
          {% endif %}
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: |
            ha-card {
              background: rgba(156, 39, 176, 0.05);
            }
            ha-card:hover {
              background: rgba(156, 39, 176, 0.1);
            }

  # Reset Buttons
  - type: horizontal-stack
    cards:
      # Reset HEPA Filter
      - type: button
        name: Reset HEPA
        icon: mdi:restart
        tap_action:
          action: call-service
          service: script.turn_on
          target:
            entity_id: script.reset_bento_box_hepa_filter
        hold_action:
          action: none

      # Reset Carbon Filter
      - type: button
        name: Reset Carbon
        icon: mdi:restart
        tap_action:
          action: call-service
          service: script.turn_on
          target:
            entity_id: script.reset_bento_box_carbon_filter
        hold_action:
          action: none

