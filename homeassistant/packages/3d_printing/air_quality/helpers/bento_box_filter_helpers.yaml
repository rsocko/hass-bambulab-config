# ============================================================
# Bento Box Filter Tracking - Input Helpers
# ============================================================
# This file contains input helpers to track HEPA and carbon filter
# usage and replacement schedules for the Bento Box enclosure fan.
#
# Copy this entire file content to your Home Assistant configuration
# (configuration.yaml or a separate file included from configuration.yaml)
#
# After adding, restart Home Assistant or reload input helpers via:
# Developer Tools > YAML > Input Helpers
# ============================================================

input_number:
  # HEPA filter runtime tracking
  bento_box_hepa_runtime_hours:
    name: "Bento Box HEPA Filter Runtime"
    min: 0
    max: 10000
    step: 0.1
    unit_of_measurement: "h"
    icon: mdi:air-filter
    mode: box
  
  # Carbon filter runtime tracking
  bento_box_carbon_runtime_hours:
    name: "Bento Box Carbon Filter Runtime"
    min: 0
    max: 10000
    step: 0.1
    unit_of_measurement: "h"
    icon: mdi:air-filter
    mode: box
  
  # HEPA filter replacement threshold (hours)
  bento_box_hepa_max_hours:
    name: "Bento Box HEPA Filter Max Hours"
    min: 100
    max: 10000
    step: 50
    initial: 2000
    unit_of_measurement: "h"
    icon: mdi:clock-outline
    mode: box
  
  # Carbon filter replacement threshold (hours)
  bento_box_carbon_max_hours:
    name: "Bento Box Carbon Filter Max Hours"
    min: 100
    max: 10000
    step: 50
    initial: 1000
    unit_of_measurement: "h"
    icon: mdi:clock-outline
    mode: box

input_datetime:
  # Last HEPA filter replacement date
  bento_box_hepa_last_replaced:
    name: "Bento Box HEPA Filter Last Replaced"
    has_date: true
    has_time: true
    icon: mdi:calendar-check
  
  # Last carbon filter replacement date
  bento_box_carbon_last_replaced:
    name: "Bento Box Carbon Filter Last Replaced"
    has_date: true
    has_time: true
    icon: mdi:calendar-check

input_boolean:
  # Enable/disable filter tracking
  bento_box_filter_tracking_enabled:
    name: "Bento Box Filter Tracking Enabled"
    icon: mdi:toggle-switch
    initial: true

# ============================================================
# Template Sensors for Filter Status
# ============================================================
# These sensors calculate filter usage percentages and status

template:
  - sensor:
      # HEPA filter usage percentage
      - name: "Bento Box HEPA Filter Usage"
        unique_id: bento_box_hepa_filter_usage
        state: >
          {% set runtime = states('input_number.bento_box_hepa_runtime_hours') | float(0) %}
          {% set max_hours = states('input_number.bento_box_hepa_max_hours') | float(2000) %}
          {{ ((runtime / max_hours) * 100) | round(1) }}
        unit_of_measurement: "%"
        icon: >
          {% set usage = ((states('input_number.bento_box_hepa_runtime_hours') | float(0) / states('input_number.bento_box_hepa_max_hours') | float(2000)) * 100) | round(1) %}
          {% if usage < 75 %}
            mdi:air-filter
          {% elif usage < 90 %}
            mdi:air-filter-remove
          {% else %}
            mdi:alert-circle
          {% endif %}
        attributes:
          runtime_hours: "{{ states('input_number.bento_box_hepa_runtime_hours') | float(0) | round(1) }}"
          max_hours: "{{ states('input_number.bento_box_hepa_max_hours') | float(2000) | round(0) }}"
          remaining_hours: >
            {% set runtime = states('input_number.bento_box_hepa_runtime_hours') | float(0) %}
            {% set max_hours = states('input_number.bento_box_hepa_max_hours') | float(2000) %}
            {{ (max_hours - runtime) | round(1) }}
          status: >
            {% set usage = ((states('input_number.bento_box_hepa_runtime_hours') | float(0) / states('input_number.bento_box_hepa_max_hours') | float(2000)) * 100) | round(1) %}
            {% if usage >= 100 %}
              overdue
            {% elif usage >= 90 %}
              replace_soon
            {% elif usage >= 75 %}
              warning
            {% else %}
              good
            {% endif %}
          days_since_replacement: >
            {% set last_replaced = states('input_datetime.bento_box_hepa_last_replaced') %}
            {% if last_replaced not in ['unknown', 'unavailable', ''] %}
              {{ ((as_timestamp(now()) - as_timestamp(last_replaced)) / 86400) | round(0) }}
            {% else %}
              unknown
            {% endif %}
      
      # Carbon filter usage percentage
      - name: "Bento Box Carbon Filter Usage"
        unique_id: bento_box_carbon_filter_usage
        state: >
          {% set runtime = states('input_number.bento_box_carbon_runtime_hours') | float(0) %}
          {% set max_hours = states('input_number.bento_box_carbon_max_hours') | float(1000) %}
          {{ ((runtime / max_hours) * 100) | round(1) }}
        unit_of_measurement: "%"
        icon: >
          {% set usage = ((states('input_number.bento_box_carbon_runtime_hours') | float(0) / states('input_number.bento_box_carbon_max_hours') | float(1000)) * 100) | round(1) %}
          {% if usage < 75 %}
            mdi:air-filter
          {% elif usage < 90 %}
            mdi:air-filter-remove
          {% else %}
            mdi:alert-circle
          {% endif %}
        attributes:
          runtime_hours: "{{ states('input_number.bento_box_carbon_runtime_hours') | float(0) | round(1) }}"
          max_hours: "{{ states('input_number.bento_box_carbon_max_hours') | float(1000) | round(0) }}"
          remaining_hours: >
            {% set runtime = states('input_number.bento_box_carbon_runtime_hours') | float(0) %}
            {% set max_hours = states('input_number.bento_box_carbon_max_hours') | float(1000) %}
            {{ (max_hours - runtime) | round(1) }}
          status: >
            {% set usage = ((states('input_number.bento_box_carbon_runtime_hours') | float(0) / states('input_number.bento_box_carbon_max_hours') | float(1000)) * 100) | round(1) %}
            {% if usage >= 100 %}
              overdue
            {% elif usage >= 90 %}
              replace_soon
            {% elif usage >= 75 %}
              warning
            {% else %}
              good
            {% endif %}
          days_since_replacement: >
            {% set last_replaced = states('input_datetime.bento_box_carbon_last_replaced') %}
            {% if last_replaced not in ['unknown', 'unavailable', ''] %}
              {{ ((as_timestamp(now()) - as_timestamp(last_replaced)) / 86400) | round(0) }}
            {% else %}
              unknown
            {% endif %}
      
      # Combined filter status
      - name: "Bento Box Filter Status"
        unique_id: bento_box_filter_status
        state: >
          {% set hepa_usage = states('sensor.bento_box_hepa_filter_usage') | float(0) %}
          {% set carbon_usage = states('sensor.bento_box_carbon_filter_usage') | float(0) %}
          {% set max_usage = [hepa_usage, carbon_usage] | max %}
          {% if max_usage >= 100 %}
            Replace Now
          {% elif max_usage >= 90 %}
            Replace Soon
          {% elif max_usage >= 75 %}
            Monitor
          {% else %}
            Good
          {% endif %}
        icon: >
          {% set hepa_usage = states('sensor.bento_box_hepa_filter_usage') | float(0) %}
          {% set carbon_usage = states('sensor.bento_box_carbon_filter_usage') | float(0) %}
          {% set max_usage = [hepa_usage, carbon_usage] | max %}
          {% if max_usage >= 100 %}
            mdi:alert-circle
          {% elif max_usage >= 90 %}
            mdi:alert
          {% elif max_usage >= 75 %}
            mdi:information
          {% else %}
            mdi:check-circle
          {% endif %}
        attributes:
          hepa_status: "{{ state_attr('sensor.bento_box_hepa_filter_usage', 'status') }}"
          carbon_status: "{{ state_attr('sensor.bento_box_carbon_filter_usage', 'status') }}"
          hepa_usage_percent: "{{ states('sensor.bento_box_hepa_filter_usage') }}"
          carbon_usage_percent: "{{ states('sensor.bento_box_carbon_filter_usage') }}"

# ============================================================
# NOTES:
# ============================================================
# Default replacement intervals:
# - HEPA filter: 2000 hours (~83 days if running 24h, longer in practice)
# - Carbon filter: 1000 hours (~42 days if running 24h, longer in practice)
#
# These defaults are conservative. Adjust based on:
# - Manufacturer recommendations
# - Usage patterns (high-VOC materials reduce filter life)
# - Visual inspection of filters
# - Air quality sensor readings (if filtration efficiency drops)
#
# To reset after filter replacement:
# 1. Set runtime hours to 0
# 2. Update last replacement date to now
# 3. Use the dashboard buttons for easy reset
# ============================================================
