# Assign one project (or clear it) across a selected set of archives.
bulk_assign_print_history_project:
  alias: Bulk Assign Print History Project
  fields:
    archive_ids_csv:
      description: Comma-separated archive IDs.
      required: true
      selector:
        text:
    project_id:
      description: Project ID or __NULL__ to clear the current project.
      required: true
      selector:
        text:
    refresh_browser:
      description: Refresh the browser after assigning the project. Defaults to true.
      required: false
      selector:
        boolean:
  sequence:
    - variables:
        should_refresh_browser: "{{ refresh_browser if refresh_browser is defined else true }}"
        requested_archive_ids: "{{ archive_ids_csv | default('', true) | string | trim }}"
        resolved_project_id: "{{ project_id | default('__NULL__', true) | string | trim }}"
        archive_ids_json: >-
          {% set ns = namespace(values=[]) %}
          {% for token in requested_archive_ids.split(',') %}
            {% set cleaned = token | string | trim %}
            {% set numeric = cleaned | int(0) %}
            {% if cleaned != '' and numeric > 0 and numeric not in ns.values %}
              {% set ns.values = ns.values + [numeric] %}
            {% endif %}
          {% endfor %}
          {{ ns.values | tojson }}
    - if:
        - condition: template
          value_template: "{{ (archive_ids_json | from_json | count) > 0 }}"
      then:
        - repeat:
            for_each: "{{ archive_ids_json | from_json }}"
            sequence:
              - action: rest_command.bambuddy_update_archive
                data:
                  archive_id: "{{ repeat.item }}"
                  project_id: "{{ resolved_project_id }}"
        - if:
            - condition: template
              value_template: "{{ should_refresh_browser }}"
          then:
            - action: script.refresh_print_history_archives
  mode: queued