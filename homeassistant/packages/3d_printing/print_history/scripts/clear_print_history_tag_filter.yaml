clear_print_history_tag_filter:
  alias: Clear Print History Tag Filter
  sequence:
    - action: input_text.set_value
      data:
        entity_id: input_text.print_history_filter_tags
        value: ""
    - action: input_select.select_option
      data:
        entity_id: input_select.print_history_filter_tags_mode
        option: Any
    - action: input_boolean.turn_off
      data:
        entity_id: input_boolean.print_history_filter_tags_untagged_only
  mode: single
