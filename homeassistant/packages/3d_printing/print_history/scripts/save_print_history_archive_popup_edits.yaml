# Save popup-edited archive fields back to Bambuddy, then refresh the history cache.
save_print_history_archive_popup_edits:
  alias: Save Print History Archive Popup Edits
  sequence:
    - variables:
        enrichment_marker: "+>"
        recovery_marker: "[RECOVERY_AUDIT_V1]"
        resolved_archive_id: "{{ states('input_text.print_history_popup_archive_id') | default('', true) | string | trim }}"
        resolved_print_name: "{{ states('input_text.print_history_popup_print_name') | default('', true) | string | trim }}"
        resolved_tags: "{{ states('input_text.print_history_popup_tags') | default('', true) | string }}"
        resolved_notes: "{{ states('input_text.print_history_popup_notes') | default('', true) | string }}"
        resolved_status: "{{ states('input_select.print_history_popup_status') | default('', true) | string | trim | lower }}"
        resolved_failure_reason: >-
          {% set current_status = states('input_select.print_history_popup_status') | default('', true) | string | trim | lower %}
          {% set selected = states('input_select.print_history_popup_failure_reason') | default('', true) | string | trim %}
          {% if current_status in ['failed', 'cancelled'] %}
            {% if selected in ['', 'Unspecified'] %}
              __NULL__
            {% else %}
              {{ selected }}
            {% endif %}
          {% else %}
            __NULL__
          {% endif %}
        resolved_user_notes: >-
          {% set raw = resolved_notes %}
          {% set marker_index = raw.find(enrichment_marker) %}
          {% set recovery_index = raw.find(recovery_marker) %}
          {% if marker_index >= 0 and recovery_index >= 0 %}
            {% set cutoff = [marker_index, recovery_index] | min %}
          {% elif marker_index >= 0 %}
            {% set cutoff = marker_index %}
          {% elif recovery_index >= 0 %}
            {% set cutoff = recovery_index %}
          {% else %}
            {% set cutoff = -1 %}
          {% endif %}
          {% if cutoff >= 0 %}
            {{ raw[:cutoff] | regex_replace('\n+$', '') }}
          {% else %}
            {{ raw | regex_replace('\n+$', '') }}
          {% endif %}
        resolved_user_tags: >-
          {% set ns = namespace(result=[], seen=[]) %}
          {% for tag in resolved_tags.split(',') %}
            {% set cleaned = tag | string | trim %}
            {% set lowered = cleaned | lower %}
            {% set is_system = lowered.startswith('f:')
              or lowered.startswith('s:')
              or lowered.startswith('spoolman:')
              or lowered.startswith('vendor:')
              or lowered.startswith('material:')
              or lowered.startswith('cost:')
              or lowered.startswith('status:')
              or lowered.startswith('ha enrichment:')
              or lowered.startswith('ha_enrichment:')
              or lowered == 'ha_enriched:true' %}
            {% if cleaned | length > 0 and not is_system and lowered not in ns.seen %}
              {% set ns.result = ns.result + [cleaned] %}
              {% set ns.seen = ns.seen + [lowered] %}
            {% endif %}
          {% endfor %}
          {{ ns.result | tojson | from_json }}
    - if:
        - condition: template
          value_template: "{{ resolved_archive_id != '' }}"
      then:
        - action: rest_command.bambuddy_get_archive_detail
          data:
            archive_id: "{{ resolved_archive_id }}"
          response_variable: archive_detail_response
        - variables:
            archive_detail: >-
              {% set content = archive_detail_response.content | default({}, true) %}
              {% if content is mapping %}
                {{ content | tojson | from_json }}
              {% elif content is string and content | length > 0 %}
                {{ content | from_json({}) }}
              {% else %}
                {{ {} }}
              {% endif %}
            existing_tags_raw: "{{ archive_detail.tags | default('', true) | string }}"
            existing_notes_raw: "{{ archive_detail.notes | default('', true) | string }}"
            existing_marker_index: "{{ existing_notes_raw.find(enrichment_marker) }}"
            existing_recovery_index: "{{ existing_notes_raw.find(recovery_marker) }}"
            existing_payload_raw: >-
              {% if existing_marker_index >= 0 %}
                {{ existing_notes_raw[existing_marker_index + (enrichment_marker | length):] | trim }}
              {% else %}
                {{ '' }}
              {% endif %}
            existing_recovery_block: >-
              {% if existing_recovery_index >= 0 %}
                {% if existing_marker_index >= 0 and existing_recovery_index < existing_marker_index %}
                  {{ existing_notes_raw[existing_recovery_index:existing_marker_index] | regex_replace('\n+$', '') }}
                {% else %}
                  {{ existing_notes_raw[existing_recovery_index:] | regex_replace('\n+$', '') }}
                {% endif %}
              {% else %}
                {{ '' }}
              {% endif %}
            existing_hidden_notes_suffix: >-
              {% if existing_marker_index >= 0 and existing_recovery_index >= 0 %}
                {{ existing_notes_raw[[existing_marker_index, existing_recovery_index] | min:] | regex_replace('\n+$', '') }}
              {% elif existing_marker_index >= 0 %}
                {{ existing_notes_raw[existing_marker_index:] | regex_replace('\n+$', '') }}
              {% elif existing_recovery_index >= 0 %}
                {{ existing_notes_raw[existing_recovery_index:] | regex_replace('\n+$', '') }}
              {% else %}
                {{ '' }}
              {% endif %}
            existing_payload: >-
              {% if existing_payload_raw is mapping %}
                {{ existing_payload_raw | tojson | from_json }}
              {% elif existing_payload_raw is string and existing_payload_raw | length > 0 %}
                {{ existing_payload_raw | from_json({}) }}
              {% else %}
                {{ {} }}
              {% endif %}
            preserved_system_tags: >-
              {% set ns = namespace(result=[], seen=[]) %}
              {% for tag in existing_tags_raw.split(',') %}
                {% set cleaned = tag | string | trim %}
                {% set lowered = cleaned | lower %}
                {% set is_system = lowered.startswith('f:')
                  or lowered.startswith('s:')
                  or lowered.startswith('spoolman:')
                  or lowered.startswith('vendor:')
                  or lowered.startswith('material:')
                  or lowered.startswith('cost:')
                  or lowered.startswith('status:')
                  or lowered.startswith('ha enrichment:')
                  or lowered.startswith('ha_enrichment:')
                  or lowered == 'ha_enriched:true' %}
                {% if cleaned | length > 0 and is_system and lowered not in ns.seen %}
                  {% set ns.result = ns.result + [cleaned] %}
                  {% set ns.seen = ns.seen + [lowered] %}
                {% endif %}
              {% endfor %}
              {% if existing_payload is mapping and existing_payload.s is defined %}
                {% for item in existing_payload.F | default([], true) %}
                  {% if item.f is not none %}
                    {% set filament_tag = 'f:' ~ (item.f | string) %}
                    {% if filament_tag | lower not in ns.seen %}
                      {% set ns.result = ns.result + [filament_tag] %}
                      {% set ns.seen = ns.seen + [filament_tag | lower] %}
                    {% endif %}
                  {% endif %}
                  {% if item.s is not none %}
                    {% set spool_tag = 's:' ~ (item.s | string) %}
                    {% if spool_tag | lower not in ns.seen %}
                      {% set ns.result = ns.result + [spool_tag] %}
                      {% set ns.seen = ns.seen + [spool_tag | lower] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.result | tojson | from_json }}
            merged_tags: >-
              {% set ns = namespace(result=[], seen=[]) %}
              {% for tag in resolved_user_tags + preserved_system_tags %}
                {% set cleaned = tag | string | trim %}
                {% set lowered = cleaned | lower %}
                {% if cleaned | length > 0 and lowered not in ns.seen %}
                  {% set ns.result = ns.result + [cleaned] %}
                  {% set ns.seen = ns.seen + [lowered] %}
                {% endif %}
              {% endfor %}
              {{ ns.result | join(',') }}
            merged_notes: >-
              {% set parts = namespace(values=[]) %}
              {% if resolved_user_notes | length > 0 %}
                {% set parts.values = parts.values + [resolved_user_notes] %}
              {% endif %}
              {% if existing_payload is mapping and existing_payload.s is defined %}
                {% if existing_recovery_block | length > 0 %}
                  {% set parts.values = parts.values + [existing_recovery_block] %}
                {% endif %}
                {% set parts.values = parts.values + [enrichment_marker ~ (existing_payload | to_json)] %}
              {% elif existing_hidden_notes_suffix | length > 0 %}
                {% set parts.values = parts.values + [existing_hidden_notes_suffix] %}
              {% endif %}
              {{ parts.values | join('\n\n') }}
        - action: rest_command.bambuddy_update_archive
          data:
            archive_id: "{{ resolved_archive_id }}"
            print_name: "{{ resolved_print_name }}"
            tags: "{{ merged_tags }}"
            notes: "{{ merged_notes }}"
            status: "{{ resolved_status }}"
            failure_reason: "{{ resolved_failure_reason }}"
        - action: script.refresh_print_history_archives
        - action: browser_mod.close_popup
        - action: logbook.log
          data:
            name: Print History
            message: "Saved popup edits for archive {{ resolved_archive_id }}"
      else:
        - action: logbook.log
          data:
            name: Print History
            message: Save popup edits requested without an archive ID
  mode: queued