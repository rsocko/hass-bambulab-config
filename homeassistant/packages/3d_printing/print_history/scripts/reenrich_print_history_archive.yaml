                - action: system_log.write
                  data:
                    message: >-
                      Print History debug: archive {{ resolved_archive_id }} spool catalog normalized.
                      spool_count={{ spoolman_spools_normalized | count }},
                      candidate_status={{ candidate_payload_status_label }},
                      candidate_rows={{ candidate_filament_rows }},
                      candidate_resolved={{ candidate_resolved_rows }},
                      ambiguities={{ candidate_ambiguity_rows | count }},
                      preserve_existing={{ should_preserve_existing }},
                      elapsed_s={{ reenrich_elapsed_seconds }}.
                    level: warning
                    logger: homeassistant.components.bambulab.print_history
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ should_preserve_existing }}"
                  sequence:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ resolved_archive_cost_defined }}"
                          sequence:
                            - action: rest_command.bambuddy_update_archive
                              data:
                                archive_id: "{{ resolved_archive_id }}"
                                tags: "{{ merged_tags }}"
                                notes: "{{ merged_notes }}"
                                cost: "{{ resolved_archive_cost }}"
                      default:
                        - action: rest_command.bambuddy_update_archive
                          data:
                            archive_id: "{{ resolved_archive_id }}"
                            tags: "{{ merged_tags }}"
                            notes: "{{ merged_notes }}"
                    - action: persistent_notification.create
                      data:
                        notification_id: "print_history_reenrich_preserved_{{ resolved_archive_id }}"
                        title: "Print History Re-Enrich Preserved Existing Data"
                        message: >-
                          Archive **{{ resolved_archive_id }}** already contains richer enrichment
                          data than the current manual re-enrich candidate.

                          Existing status: `{{ existing_payload_status_label }}`
                          Candidate status: `{{ candidate_payload_status_label }}`
                          {% if resolved_archive_cost_defined %}

                          The existing enrichment payload was preserved, and the archive cost was refreshed to `${{ resolved_archive_cost | float(0) | round(2) }}`.
                          {% endif %}
                    - action: logbook.log
                      data:
                        name: Print History Re-Enrich
                        message: >-
                          Preserved existing enrichment for archive {{ resolved_archive_id }} because
                          the manual candidate was lower fidelity{% if resolved_archive_cost_defined %}, and refreshed archive cost to ${{ resolved_archive_cost | float(0) | round(2) }}{% endif %}.
                    - action: bambuddy.append_print_history_event
                      data:
                        archive_id: "{{ resolved_archive_id | int(0) }}"
                        event_type: enrichment_applied
                        event_source: ha_script
                        event_status: "{{ existing_payload_status_label | lower | trim }}"
                        payload:
                          mode: manual_reenrich
                          source: preserved_existing
                          rows: "{{ existing_filament_rows | int(0) }}"
                          ambiguities: "{{ existing_ambiguity_rows | count }}"
                          cost_refreshed: "{{ resolved_archive_cost_defined }}"
                        event_key: >-
                          manual-reenrich:{{ resolved_archive_id }}:preserved-existing:{{ existing_payload_status_label | lower | trim }}:{{ existing_filament_rows | int(0) }}:{{ resolved_archive_cost_defined }}
                      response_variable: append_event_result
                    - if:
                        - condition: template
                          value_template: "{{ should_refresh_browser }}"
                      then:
                        - action: script.refresh_print_history_archives
                    - if:
                        - condition: template
                          value_template: "{{ debug_enabled }}"
                      then:
                        - action: system_log.write
                          data:
                            message: >-
                              Print History debug: archive {{ resolved_archive_id }} kept existing enrichment.
                              existing_status={{ existing_payload_status_label }},
                              candidate_status={{ candidate_payload_status_label }},
                              cost_refreshed={{ resolved_archive_cost_defined }},
                              elapsed_s={{ reenrich_elapsed_seconds }}.
                            level: warning
                            logger: homeassistant.components.bambulab.print_history
              default:
                - if:
                    - condition: template
                      value_template: "{{ debug_enabled }}"
                  then:
                    - action: system_log.write
                      data:
                        message: >-
                          Print History debug: updating archive {{ resolved_archive_id }} from manual re-enrich.
                          effective_status={{ {'c': 'complete', 't': 'near complete', 'm': 'mostly complete', 'n': 'mostly complete', 'p': 'partially complete', 'u': 'unavailable'}.get(effective_payload.s | default('', true), effective_payload.s | default('', true)) }},
                          tags={{ effective_system_tags | count }},
                          elapsed_s={{ reenrich_elapsed_seconds }}.
                        level: warning
                        logger: homeassistant.components.bambulab.print_history
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ resolved_archive_cost_defined }}"
                      sequence:
                        - action: rest_command.bambuddy_update_archive
                          data:
                            archive_id: "{{ resolved_archive_id }}"
                            tags: "{{ merged_tags }}"
                            notes: "{{ merged_notes }}"
                            cost: "{{ resolved_archive_cost }}"
                  default:
                    - action: rest_command.bambuddy_update_archive
                      data:
                        archive_id: "{{ resolved_archive_id }}"
                        tags: "{{ merged_tags }}"
                        notes: "{{ merged_notes }}"
                - action: bambuddy.append_print_history_event
                  data:
                    archive_id: "{{ resolved_archive_id | int(0) }}"
                    event_type: enrichment_applied
                    event_source: ha_script
                    event_status: "{{ candidate_payload_status_label | lower | trim }}"
                    payload:
                      mode: manual_reenrich
                      source: "{{ archive_row_source_label | string }}"
                      rows: "{{ candidate_filament_rows | int(0) }}"
                      ambiguities: "{{ candidate_ambiguity_rows | count }}"
                    event_key: >-
                      manual-reenrich:{{ resolved_archive_id }}:{{ candidate_payload_status_label | lower | trim }}:{{ archive_row_source | default('unknown', true) | string | trim }}:{{ candidate_filament_rows | int(0) }}
                  response_variable: append_event_result
                - if:
                    - condition: template
                      value_template: "{{ should_refresh_browser }}"
                  then:
                    - action: script.refresh_print_history_archives
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ not has_candidate_payload }}"
                      sequence:
                        - action: persistent_notification.create
                          data:
                            notification_id: "print_history_reenrich_missing_{{ resolved_archive_id }}"
                            title: "Print History Re-Enrich Saved Diagnostic Only"
                            message: >-
                              Archive **{{ resolved_archive_id }}** did not produce any resolvable
                              filament rows, but the hidden enrichment payload was updated with a
                              diagnostic reason so the popup can explain why.

                              {{ archive_row_reason }}
                    - conditions:
                        - condition: template
                          value_template: "{{ candidate_ambiguity_rows | count > 0 }}"
                      sequence:
                        - action: persistent_notification.create
                          data:
                            notification_id: "print_history_reenrich_ambiguous_{{ resolved_archive_id }}"
                            title: "Print History Re-Enrich Saved With Ambiguities"
                            message: >-
                              Archive **{{ resolved_archive_id }}** was updated, but one or more
                              filament rows could not be resolved to a unique spool.

                              {% for item in candidate_ambiguity_rows %}
                              - {{ item.label | default('Unknown filament', true) }}
                                ({{ item.weight | default(0, true) }}g, {{ item.type | default('Unknown', true) }}, {{ item.color | default('Unknown', true) }}): {{ item.reason }}
                              {% endfor %}
                - action: logbook.log
                  data:
                    name: Print History Re-Enrich
                    message: >-
                      Re-enriched archive {{ resolved_archive_id }} with status {{ candidate_payload_status_label }}
                      from {{ archive_row_source_label }} and {{ candidate_filament_rows }} filament row(s)
                      with {% if resolved_archive_cost_defined %}${{ resolved_archive_cost | float(0) | round(2) }} cost{% else %}the existing Bambuddy cost preserved{% endif %}.
                - if:
                    - condition: template
                      value_template: "{{ debug_enabled }}"
                  then:
                    - action: system_log.write
                      data:
                        message: >-
                          Print History debug: archive {{ resolved_archive_id }} manual re-enrich completed.
                          status={{ candidate_payload_status_label }},
                          source={{ archive_row_source_label }},
                          rows={{ candidate_filament_rows }},
                          ambiguities={{ candidate_ambiguity_rows | count }},
                          elapsed_s={{ reenrich_elapsed_seconds }}.
                        level: warning
                        logger: homeassistant.components.bambulab.print_history
          else:
            - action: logbook.log
              data:
                name: Print History Re-Enrich
                message: Re-enrich requested without an archive ID
      else:
        - action: logbook.log
          data:
            name: Print History Re-Enrich
            message: Re-enrich skipped because Bambuddy integration is disabled
  mode: queued