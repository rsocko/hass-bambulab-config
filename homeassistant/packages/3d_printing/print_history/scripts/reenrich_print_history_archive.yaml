# Manually rebuild archive enrichment for older prints using archive detail + current Spoolman metadata.
reenrich_print_history_archive:
  alias: Re-Enrich Print History Archive
  description: >-
    Rebuilds the managed [HA_ENRICHMENT_V1] payload for an older Bambuddy archive
    while preserving user notes and user tags.
  fields:
    archive_id:
      name: Archive ID
      description: Optional archive ID override. Defaults to the popup helper value.
      example: "193"
      required: false
      selector:
        text:
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.bambuddy_integration_enabled
          state: "on"
      then:
        - variables:
            enrichment_marker: "[HA_ENRICHMENT_V1]"
            legacy_marker: "--- HA Enrichment ---"
            requested_archive_id: "{{ archive_id | string | trim if archive_id is defined else '' }}"
            resolved_archive_id: "{{ requested_archive_id | string | trim if (requested_archive_id | string | trim != '') else (states('input_text.print_history_popup_archive_id') | default('', true) | string | trim) }}"
        - if:
            - condition: template
              value_template: "{{ resolved_archive_id | string | trim != '' }}"
          then:
            - action: rest_command.bambuddy_get_archive_detail
              data:
                archive_id: "{{ resolved_archive_id }}"
              response_variable: archive_detail_response
            - variables:
                archive_detail: "{{ archive_detail_response.content | default({}, true) }}"
                existing_notes_raw: "{{ archive_detail.notes | default('', true) | string }}"
                existing_tags_raw: "{{ archive_detail.tags | default('', true) | string }}"
                existing_user_notes: >-
                  {% set raw = existing_notes_raw %}
                  {% set marker_index = raw.find(enrichment_marker) %}
                  {% set legacy_index = raw.find(legacy_marker) %}
                  {% if marker_index >= 0 and legacy_index >= 0 %}
                    {% set cutoff = [marker_index, legacy_index] | min %}
                  {% elif marker_index >= 0 %}
                    {% set cutoff = marker_index %}
                  {% elif legacy_index >= 0 %}
                    {% set cutoff = legacy_index %}
                  {% else %}
                    {% set cutoff = -1 %}
                  {% endif %}
                  {% if cutoff >= 0 %}
                    {{ raw[:cutoff] | regex_replace('\n+$', '') }}
                  {% else %}
                    {{ raw | regex_replace('\n+$', '') }}
                  {% endif %}
                existing_payload_raw: >-
                  {% set marker_index = existing_notes_raw.find(enrichment_marker) %}
                  {% if marker_index >= 0 %}
                    {{ existing_notes_raw[marker_index + (enrichment_marker | length):] | trim }}
                  {% else %}
                    {{ '' }}
                  {% endif %}
                existing_payload: >-
                  {% if existing_payload_raw | length > 0 %}
                    {{ existing_payload_raw | from_json({}) }}
                  {% else %}
                    {{ {} }}
                  {% endif %}
                existing_user_tags: >-
                  {% set ns = namespace(result=[]) %}
                  {% for tag in existing_tags_raw.split(',') %}
                    {% set cleaned = tag | string | trim %}
                    {% if cleaned | length > 0
                       and not cleaned.startswith('Filament:')
                       and not cleaned.startswith('Spool:')
                       and cleaned != 'ha_enriched:true'
                       and cleaned not in ns.result %}
                      {% set ns.result = ns.result + [cleaned] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.result | tojson | from_json }}
                archive_slot_rows: >-
                  {% set extra = archive_detail.extra_data | default({}, true) %}
                  {% set extra_slots = extra.filament_slots | default([], true) if extra is mapping else [] %}
                  {% set top_slots = archive_detail.filament_slots | default([], true) %}
                  {% set slots = extra_slots if extra_slots | count > 0 else top_slots %}
                  {% set print_data = extra.get('_print_data', {}) if extra is mapping else {} %}
                  {% set raw_data = print_data.get('raw_data', {}) if print_data is mapping else {} %}
                  {% set raw_ams = raw_data.get('ams', []) if raw_data is mapping else [] %}
                  {% set ns = namespace(tray_candidates=[], rows=[]) %}
                  {% for ams in raw_ams if ams is mapping %}
                    {% set ams_index = ams.id | default(loop.index0, true) | int(loop.index0) %}
                    {% for tray in ams.tray | default([], true) if tray is mapping %}
                      {% set tray_index = tray.id | default(loop.index0, true) | int(loop.index0) %}
                      {% if ams_index == 0 %}
                        {% set tray_code = 'A' ~ (tray_index + 1) %}
                      {% elif ams_index == 1 %}
                        {% set tray_code = 'B' ~ (tray_index + 1) %}
                      {% else %}
                        {% set tray_code = 'AMS' ~ (ams_index + 1) ~ '-' ~ (tray_index + 1) %}
                      {% endif %}
                      {% set color_raw = tray.tray_color | default('', true) | string | trim | replace('#', '') | replace('"', '') %}
                      {% if color_raw | length == 8 %}
                        {% set color_raw = color_raw[0:6] %}
                      {% endif %}
                      {% set color_value = '#' ~ color_raw.upper() if color_raw | length == 6 else none %}
                      {% set sub_brand = tray.tray_sub_brands | default('', true) | string | trim %}
                      {% set profile_name = 'Bambu ' ~ sub_brand if sub_brand | length > 0 and not sub_brand.startswith('Bambu') else sub_brand %}
                      {% set uuid_value = tray.tray_uuid | default('', true) | string | trim('"') %}
                      {% set ns.tray_candidates = ns.tray_candidates + [{
                        'tray_code': tray_code,
                        'tray_uuid': uuid_value,
                        'tray_type': tray.tray_type | default('', true) | string,
                        'color_hex': color_value,
                        'profile_name': profile_name,
                        'vendor_hint': 'Bambu Lab' if (uuid_value | length > 0 and not uuid_value | lower | regex_match('^0+$')) or profile_name.startswith('Bambu') else ''
                      }] %}
                    {% endfor %}
                  {% endfor %}
                  {% for slot in slots if slot is mapping %}
                    {% set grams = slot.used_g | default(0, true) | float(0) %}
                    {% if grams > 0 %}
                      {% set slot_id = slot.slot_id | default('', true) | string | trim %}
                      {% set slot_color = slot.color | default('', true) | string | trim | replace('#', '') | replace('"', '') %}
                      {% if slot_color | length == 8 %}
                        {% set slot_color = slot_color[0:6] %}
                      {% endif %}
                      {% set color_value = '#' ~ slot_color.upper() if slot_color | length == 6 else none %}
                      {% set type_value = slot.type | default(archive_detail.filament_type | default('', true), true) | string %}
                      {% set tray_matches = namespace(items=[]) %}
                      {% if type_value | length > 0 and color_value is not none %}
                        {% for tray_candidate in ns.tray_candidates %}
                          {% if tray_candidate.tray_type == type_value and tray_candidate.color_hex == color_value %}
                            {% set tray_matches.items = tray_matches.items + [tray_candidate] %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                      {% set unique_tray = tray_matches.items[0] if tray_matches.items | count == 1 else {} %}
                      {% set profile_name = unique_tray.profile_name if unique_tray is mapping and unique_tray.profile_name is defined else '' %}
                      {% set vendor_hint = unique_tray.vendor_hint if unique_tray is mapping and unique_tray.vendor_hint is defined else '' %}
                      {% set ambiguity_reason = 'multiple archived AMS trays matched type+color' if tray_matches.items | count > 1 else '' %}
                      {% set name_hint = profile_name if profile_name | length > 0 else ((type_value ~ ' ' ~ color_value) | trim if type_value | length > 0 and color_value is not none else ('Archive Slot ' ~ (slot_id if slot_id | length > 0 else loop.index))) %}
                      {% set ns.rows = ns.rows + [{
                        'slot_id': slot_id,
                        'tray': unique_tray.tray_code | default(none, true) if unique_tray is mapping else none,
                        'weight': grams | round(1),
                        'tray_uuid': unique_tray.tray_uuid | default('', true) if unique_tray is mapping else '',
                        'type': type_value,
                        'color_hex': color_value,
                        'profile_name': profile_name,
                        'vendor_hint': vendor_hint,
                        'name_hint': name_hint,
                        'source': 'archived_filament_slots',
                        'ambiguous': tray_matches.items | count > 1,
                        'ambiguity_reason': ambiguity_reason,
                        'archived_tray_match_count': tray_matches.items | count
                      }] %}
                    {% endif %}
                  {% endfor %}
                  {% if ns.rows | count == 0 and slots | count == 0 %}
                    {% set archive_weight = archive_detail.filament_used_grams | default(0, true) | float(0) %}
                    {% set archive_type = archive_detail.filament_type | default('', true) | string | trim %}
                    {% set archive_colors = namespace(values=[]) %}
                    {% for raw_color in (archive_detail.filament_color | default('', true) | string).split(',') %}
                      {% set parsed_color = raw_color | string | trim | replace('#', '') | replace('"', '') %}
                      {% if parsed_color | length == 8 %}
                        {% set parsed_color = parsed_color[0:6] %}
                      {% endif %}
                      {% if parsed_color | length == 6 %}
                        {% set normalized_color = '#' ~ parsed_color.upper() %}
                        {% if normalized_color not in archive_colors.values %}
                          {% set archive_colors.values = archive_colors.values + [normalized_color] %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                    {% set fallback_color = archive_colors.values[0] if archive_colors.values | count == 1 else none %}
                    {% if archive_weight > 0 and archive_type | length > 0 and fallback_color is not none %}
                      {% set tray_matches = namespace(items=[]) %}
                      {% for tray_candidate in ns.tray_candidates %}
                        {% if tray_candidate.tray_type == archive_type and tray_candidate.color_hex == fallback_color %}
                          {% set tray_matches.items = tray_matches.items + [tray_candidate] %}
                        {% endif %}
                      {% endfor %}
                      {% set unique_tray = tray_matches.items[0] if tray_matches.items | count == 1 else {} %}
                      {% set profile_name = unique_tray.profile_name if unique_tray is mapping and unique_tray.profile_name is defined else '' %}
                      {% set vendor_hint = unique_tray.vendor_hint if unique_tray is mapping and unique_tray.vendor_hint is defined else '' %}
                      {% set ambiguity_reason = 'multiple archived AMS trays matched archive-level type+color fallback' if tray_matches.items | count > 1 else '' %}
                      {% set name_hint = profile_name if profile_name | length > 0 else ((archive_type ~ ' ' ~ fallback_color) | trim) %}
                      {% set ns.rows = ns.rows + [{
                        'slot_id': 'archive_total',
                        'tray': unique_tray.tray_code | default(none, true) if unique_tray is mapping else none,
                        'weight': archive_weight | round(1),
                        'tray_uuid': unique_tray.tray_uuid | default('', true) if unique_tray is mapping else '',
                        'type': archive_type,
                        'color_hex': fallback_color,
                        'profile_name': profile_name,
                        'vendor_hint': vendor_hint,
                        'name_hint': name_hint,
                        'source': 'archive_totals_single_color',
                        'ambiguous': tray_matches.items | count > 1,
                        'ambiguity_reason': ambiguity_reason,
                        'archived_tray_match_count': tray_matches.items | count
                      }] %}
                    {% endif %}
                  {% endif %}
                  {{ ns.rows | tojson | from_json }}
                archive_row_source: >-
                  {% if archive_slot_rows | count == 0 %}
                    unavailable
                  {% elif archive_slot_rows | selectattr('source', 'equalto', 'archive_totals_single_color') | list | count == archive_slot_rows | count %}
                    archive_totals_single_color
                  {% else %}
                    archived_filament_slots
                  {% endif %}
                archive_row_reason: >-
                  {% set extra = archive_detail.extra_data | default({}, true) %}
                  {% set extra_slots = extra.filament_slots | default([], true) if extra is mapping else [] %}
                  {% set top_slots = archive_detail.filament_slots | default([], true) %}
                  {% set slots = extra_slots if extra_slots | count > 0 else top_slots %}
                  {% set print_data = extra.get('_print_data', {}) if extra is mapping else {} %}
                  {% set raw_data = print_data.get('raw_data', {}) if print_data is mapping else {} %}
                  {% set raw_ams = raw_data.get('ams', []) if raw_data is mapping else [] %}
                  {% set archive_type = archive_detail.filament_type | default('', true) | string | trim %}
                  {% set archive_weight = archive_detail.filament_used_grams | default(0, true) | float(0) %}
                  {% set archive_colors = namespace(values=[]) %}
                  {% for raw_color in (archive_detail.filament_color | default('', true) | string).split(',') %}
                    {% set parsed_color = raw_color | string | trim | replace('#', '') | replace('"', '') %}
                    {% if parsed_color | length == 8 %}
                      {% set parsed_color = parsed_color[0:6] %}
                    {% endif %}
                    {% if parsed_color | length == 6 %}
                      {% set normalized_color = '#' ~ parsed_color.upper() %}
                      {% if normalized_color not in archive_colors.values %}
                        {% set archive_colors.values = archive_colors.values + [normalized_color] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {% if archive_row_source == 'archive_totals_single_color' %}
                    This archive has no archived filament slot rows, so re-enrich used the archive-level filament total as a single-color fallback.
                  {% elif archive_slot_rows | count > 0 %}
                    {{ '' }}
                  {% elif slots | count > 0 %}
                    Archived filament slot rows were present, but none had a positive used_g value that could be re-enriched.
                  {% elif raw_ams | count > 0 and archive_colors.values | count > 1 %}
                    This archive has archived AMS tray data but no archived filament slot rows. Because the archive-level filament colors contain multiple values, a safe fallback could not be built.
                  {% elif raw_ams | count > 0 and archive_weight <= 0 %}
                    This archive has archived AMS tray data but no archived filament slot rows, and the archive-level filament weight is unavailable.
                  {% elif raw_ams | count > 0 and archive_type | length == 0 %}
                    This archive has archived AMS tray data but no archived filament slot rows, and the archive-level filament type is unavailable.
                  {% elif raw_ams | count > 0 and archive_colors.values | count == 0 %}
                    This archive has archived AMS tray data but no archived filament slot rows or usable archive-level color metadata.
                  {% elif raw_ams | count > 0 %}
                    This archive has archived AMS tray data but no archived filament slot rows, and the archive-level fallback was not specific enough to use safely.
                  {% elif archive_colors.values | count > 1 %}
                    This archive stores only aggregate multi-color usage and has no archived filament slot rows, so re-enrich could not split filament usage safely.
                  {% else %}
                    This archive does not contain enough archived filament usage detail for re-enrich to rebuild spool lineage safely.
                  {% endif %}
            - action: rest_command.spoolman_getspools
              data:
                allow_archived: "true"
              response_variable: spoolman_spools_response
            - variables:
                spoolman_spools_normalized: >-
                  {% set raw = spoolman_spools_response.content | default([], true) %}
                  {% if raw is string %}
                    {% set spools = raw | from_json([]) %}
                  {% elif raw is iterable and raw is not mapping %}
                    {% set spools = raw %}
                  {% else %}
                    {% set spools = [] %}
                  {% endif %}
                  {% set ns = namespace(rows=[]) %}
                  {% for spool in spools if spool is mapping %}
                    {% set spool_extra = spool.extra | default({}, true) if spool.extra is mapping else {} %}
                    {% set filament = spool.filament | default({}, true) if spool.filament is mapping else {} %}
                    {% set filament_vendor = filament.vendor | default({}, true) if filament.vendor is mapping else {} %}
                    {% set filament_extra = filament.extra | default({}, true) if filament.extra is mapping else {} %}
                    {% set spool_uuid = spool_extra.spool_uuid | default('', true) | string | trim('"') | lower %}
                    {% set color_raw = filament.color_hex | default('', true) | string | trim | replace('#', '') | replace('"', '') | lower %}
                    {% if color_raw | length == 8 %}
                      {% set color_raw = color_raw[0:6] %}
                    {% endif %}
                    {% set color_value = '#' ~ color_raw.upper() if color_raw | length == 6 else none %}
                    {% set filament_id_raw = filament.id | default('', true) | string | trim %}
                    {% set filament_id_value = filament_id_raw | int(0) if filament_id_raw | regex_match('^\d+$') else none %}
                    {% set multi = namespace(values=[], first='') %}
                    {% for raw_hex in (filament.multi_color_hexes | default('', true) | string | trim | replace('"', '') | lower).split(',') %}
                      {% set parsed_hex = raw_hex | string | trim | replace('#', '') %}
                      {% if parsed_hex | length == 8 %}
                        {% set parsed_hex = parsed_hex[0:6] %}
                      {% endif %}
                      {% if parsed_hex | length == 6 %}
                        {% if multi.first == '' %}
                          {% set multi.first = parsed_hex %}
                        {% endif %}
                        {% if parsed_hex not in multi.values %}
                          {% set multi.values = multi.values + [parsed_hex] %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                    {% set ns.rows = ns.rows + [{
                      'id': spool.id | int(0),
                      'filament_id': filament_id_value,
                      'display_name': filament.name | default(spool.name | default('Unknown Filament', true), true) | string,
                      'color_hex': color_value,
                      'material': filament.material | default('', true) | string,
                      'vendor': filament_vendor.name | default('', true) | string,
                      'profile_name': filament_extra.profile_name | default('', true) | string | trim('"'),
                      'spool_uuid': spool_uuid,
                      'multi_first': multi.first,
                      'multi_any': multi.values,
                      'location': spool.location | default('', true) | string,
                      'sealed': spool_extra.sealed | default('', true) | string | lower == 'true',
                      'archived': spool.archived | default(false, true)
                    }] %}
                  {% endfor %}
                  {{ ns.rows | tojson | from_json }}
                candidate_filaments: >-
                  {% set ns = namespace(rows=[]) %}
                  {% for slot in archive_slot_rows %}
                    {% set target_uuid = slot.tray_uuid | default('', true) | string | trim('"') | lower %}
                    {% set target_type = slot.type | default('', true) | string %}
                    {% set target_name = slot.profile_name | default('', true) | string | trim('"') %}
                    {% set target_color = slot.color_hex | default('', true) | string | trim | replace('#', '') | replace('"', '') | lower %}
                    {% if target_color | length == 8 %}
                      {% set target_color = target_color[0:6] %}
                    {% endif %}
                    {% set bambu_only = ((target_uuid | length > 0 and not target_uuid | regex_match('^0+$')) or target_name.startswith('Bambu')) %}
                    {% set ns_match = namespace(raw_candidates=[], matched_spool={}, ambiguity_reason=slot.ambiguity_reason | default('', true) | string) %}
                    {% if ns_match.ambiguity_reason | length == 0 and target_uuid | length > 0 and not target_uuid | regex_match('^0+$') %}
                      {% for spool in spoolman_spools_normalized %}
                        {% if not spool.sealed %}
                          {% if spool.spool_uuid == target_uuid %}
                            {% set ns_match.raw_candidates = ns_match.raw_candidates + [spool] %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}
                      {% if ns_match.raw_candidates | count == 1 %}
                        {% set ns_match.matched_spool = ns_match.raw_candidates[0] %}
                      {% elif ns_match.raw_candidates | count > 1 %}
                        {% set ns_match.ambiguity_reason = 'multiple Spoolman spools matched archived tray UUID' %}
                      {% endif %}
                    {% endif %}
                    {% if not (ns_match.matched_spool is mapping and ns_match.matched_spool.id is defined) %}
                      {% set ns_color = namespace(single=[], multi_first=[], multi_any=[]) %}
                      {% for spool in spoolman_spools_normalized %}
                        {% if spool.sealed %}
                          {% continue %}
                        {% endif %}
                        {% set vendor_ok = (spool.vendor == 'Bambu Lab') if bambu_only else (spool.vendor != 'Bambu Lab') %}
                        {% set profile_ok = (spool.profile_name == target_name) if (bambu_only and target_name | length > 0 and spool.profile_name | length > 0) else true %}
                        {% set spool_color = spool.color_hex | default('', true) | string | trim | replace('#', '') | replace('"', '') | lower %}
                        {% set base_ok = (spool.material == target_type and vendor_ok and profile_ok) %}
                        {% if base_ok and spool_color == target_color %}
                          {% set ns_color.single = ns_color.single + [spool] %}
                        {% endif %}
                        {% if base_ok and spool.multi_first == target_color %}
                          {% set ns_color.multi_first = ns_color.multi_first + [spool] %}
                        {% endif %}
                        {% if base_ok and target_color in spool.multi_any %}
                          {% set ns_color.multi_any = ns_color.multi_any + [spool] %}
                        {% endif %}
                      {% endfor %}
                      {% if ns_color.single | count > 0 %}
                        {% set ns_match.raw_candidates = ns_color.single %}
                      {% elif ns_color.multi_first | count > 0 %}
                        {% set ns_match.raw_candidates = ns_color.multi_first %}
                      {% elif ns_color.multi_any | count > 0 %}
                        {% set ns_match.raw_candidates = ns_color.multi_any %}
                      {% else %}
                        {% set ns_match.raw_candidates = [] %}
                      {% endif %}
                      {% if ns_match.ambiguity_reason | length == 0 and ns_match.raw_candidates | count == 1 %}
                        {% set ns_match.matched_spool = ns_match.raw_candidates[0] %}
                      {% elif ns_match.raw_candidates | count > 1 and ns_match.ambiguity_reason | length == 0 %}
                        {% set ns_match.ambiguity_reason = 'multiple Spoolman spools matched type+color' %}
                      {% endif %}
                    {% endif %}
                    {% set ns_row = namespace(spool_id=none, filament_id=none, display_name=slot.name_hint | default('Unknown Filament', true), color_hex=slot.color_hex | default(none, true), ambiguity_reason=ns_match.ambiguity_reason) %}
                    {% if ns_match.matched_spool is mapping and ns_match.matched_spool.id is defined %}
                      {% set ns_row.spool_id = ns_match.matched_spool.id | int(0) %}
                      {% set ns_row.filament_id = ns_match.matched_spool.filament_id | default(none, true) %}
                      {% set ns_row.display_name = ns_match.matched_spool.display_name | default(slot.name_hint | default('Unknown Filament', true), true) | string %}
                      {% set ns_row.ambiguity_reason = '' %}
                    {% else %}
                      {% set ns_candidate = namespace(filament_ids=[], first_spool={}) %}
                      {% for candidate in ns_match.raw_candidates %}
                        {% set candidate_filament = candidate.filament_id | default(none, true) %}
                        {% if not (ns_candidate.first_spool is mapping and ns_candidate.first_spool.id is defined) %}
                          {% set ns_candidate.first_spool = candidate %}
                        {% endif %}
                        {% if candidate_filament is not none and candidate_filament not in ns_candidate.filament_ids %}
                          {% set ns_candidate.filament_ids = ns_candidate.filament_ids + [candidate_filament] %}
                        {% endif %}
                      {% endfor %}
                      {% if ns_candidate.filament_ids | count == 1 %}
                        {% set ns_row.filament_id = ns_candidate.filament_ids[0] | int(0) %}
                        {% if ns_candidate.first_spool is mapping and ns_candidate.first_spool.id is defined %}
                          {% set ns_row.display_name = ns_candidate.first_spool.display_name | default(slot.name_hint | default('Unknown Filament', true), true) | string %}
                          {% set fallback_color = ns_candidate.first_spool.color_hex | default(none, true) %}
                          {% if ns_row.color_hex is none and fallback_color is not none %}
                            {% set ns_row.color_hex = fallback_color %}
                          {% endif %}
                        {% endif %}
                      {% endif %}
                    {% endif %}
                    {% set ns.rows = ns.rows + [{
                      'name': ns_row.display_name,
                      'weight': slot.weight,
                      'tray': slot.tray,
                      's': ns_row.spool_id,
                      'f': ns_row.filament_id,
                      'h': ns_row.color_hex,
                      'ambiguity': ns_row.ambiguity_reason if ns_row.ambiguity_reason | length > 0 else none
                    }] %}
                  {% endfor %}
                  {{ ns.rows | tojson | from_json }}
                candidate_ambiguities: >-
                  {% set ns = namespace(items=[]) %}
                  {% for slot in archive_slot_rows %}
                    {% set row = candidate_filaments[loop.index0] if loop.index0 < (candidate_filaments | count) else {} %}
                    {% set reason = slot.ambiguity_reason | default('', true) | string %}
                    {% if reason | length == 0 and row is mapping %}
                      {% set reason = row.ambiguity | default('', true) | string %}
                    {% endif %}
                    {% if reason | length > 0 %}
                      {% set ns.items = ns.items + [{
                        'label': row.name | default(slot.name_hint | default('Unknown filament', true), true),
                        'type': slot.type | default('', true),
                        'color': slot.color_hex | default(none, true),
                        'weight': slot.weight | default(0, true),
                        'reason': reason
                      }] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.items | tojson | from_json }}
                candidate_payload_status: >-
                  {% if candidate_filaments | count == 0 %}
                    unavailable
                  {% else %}
                    {% set ns = namespace(missing_filament=false, missing_spool=false) %}
                    {% for row in candidate_filaments %}
                      {% if row.f is none %}
                        {% set ns.missing_filament = true %}
                      {% endif %}
                      {% if row.s is none or row.h is none %}
                        {% set ns.missing_spool = true %}
                      {% endif %}
                    {% endfor %}
                    {% if ns.missing_filament %}
                      unavailable
                    {% elif ns.missing_spool or (candidate_ambiguities | count > 0) %}
                      partial
                    {% else %}
                      complete
                    {% endif %}
                  {% endif %}
                candidate_payload: >-
                  {% set payload = {
                    'status': candidate_payload_status,
                    'Filaments': candidate_filaments
                  } %}
                  {% if archive_row_source != 'unavailable' %}
                    {% set payload = dict(payload, source=archive_row_source) %}
                  {% endif %}
                  {% if archive_row_reason | length > 0 %}
                    {% set payload = dict(payload, reason=archive_row_reason) %}
                  {% endif %}
                  {% if candidate_ambiguities | count > 0 %}
                    {{ dict(payload, ambiguities=candidate_ambiguities) | tojson | from_json }}
                  {% else %}
                    {{ payload | tojson | from_json }}
                  {% endif %}
                existing_filaments: >-
                  {{ existing_payload.Filaments | default([], true) if existing_payload is mapping else [] }}
                existing_payload_status: >-
                  {% if existing_payload is mapping %}
                    {{ existing_payload.status | default('', true) | string | lower }}
                  {% else %}
                    {{ '' }}
                  {% endif %}
                candidate_resolved_rows: >-
                  {% set ns = namespace(count=0) %}
                  {% for row in candidate_filaments %}
                    {% if row.s is not none and row.f is not none and row.h is not none %}
                      {% set ns.count = ns.count + 1 %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.count }}
                existing_resolved_rows: >-
                  {% set ns = namespace(count=0) %}
                  {% for row in existing_filaments %}
                    {% if row.s is not none and row.f is not none and row.h is not none %}
                      {% set ns.count = ns.count + 1 %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.count }}
                candidate_filament_rows: "{{ candidate_filaments | count }}"
                existing_filament_rows: "{{ existing_filaments | count }}"
                candidate_payload_rank: >-
                  {% set rank = {'complete': 2, 'partial': 1, 'unavailable': 0} %}
                  {{ rank.get(candidate_payload_status, -1) }}
                existing_payload_rank: >-
                  {% set rank = {'complete': 2, 'partial': 1, 'unavailable': 0} %}
                  {{ rank.get(existing_payload_status, -1) }}
                candidate_detail_score: >-
                  {{
                    (candidate_payload_rank | int(-1)) * 1000 +
                    (candidate_resolved_rows | int(0)) * 100 +
                    (candidate_filament_rows | int(0))
                  }}
                existing_detail_score: >-
                  {{
                    (existing_payload_rank | int(-1)) * 1000 +
                    (existing_resolved_rows | int(0)) * 100 +
                    (existing_filament_rows | int(0))
                  }}
                should_preserve_existing: >-
                  {{ existing_payload is mapping and (existing_detail_score | int(-1)) > (candidate_detail_score | int(-1)) }}
                has_candidate_payload: "{{ candidate_filament_rows | int(0) > 0 }}"
                effective_payload: >-
                  {{ (existing_payload if should_preserve_existing else candidate_payload) | tojson | from_json }}
                effective_system_tags: >-
                  {% set ns = namespace(tags=['ha_enriched:true'], spool_ids=[], filament_ids=[]) %}
                  {% for item in effective_payload.Filaments | default([], true) %}
                    {% if item.f is not none %}
                      {% set filament_id = item.f | string %}
                      {% if filament_id not in ns.filament_ids %}
                        {% set ns.filament_ids = ns.filament_ids + [filament_id] %}
                        {% set ns.tags = ns.tags + ['Filament:' ~ filament_id] %}
                      {% endif %}
                    {% endif %}
                    {% if item.s is not none %}
                      {% set spool_id = item.s | string %}
                      {% if spool_id not in ns.spool_ids %}
                        {% set ns.spool_ids = ns.spool_ids + [spool_id] %}
                        {% set ns.tags = ns.tags + ['Spool:' ~ spool_id] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.tags | tojson | from_json }}
                merged_tags: >-
                  {% set ns = namespace(all=[]) %}
                  {% for tag in existing_user_tags + effective_system_tags %}
                    {% set cleaned = tag | string | trim %}
                    {% if cleaned | length > 0 and cleaned not in ns.all %}
                      {% set ns.all = ns.all + [cleaned] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.all | join(',') }}
                merged_notes: >-
                  {% set user_notes = existing_user_notes | string | trim %}
                  {% set payload_json = effective_payload | tojson %}
                  {% if user_notes | length > 0 %}
                    {{ user_notes ~ '\n\n' ~ enrichment_marker ~ '\n' ~ payload_json }}
                  {% else %}
                    {{ enrichment_marker ~ '\n' ~ payload_json }}
                  {% endif %}
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ should_preserve_existing }}"
                  sequence:
                    - action: persistent_notification.create
                      data:
                        notification_id: "print_history_reenrich_preserved_{{ resolved_archive_id }}"
                        title: "Print History Re-Enrich Preserved Existing Data"
                        message: >-
                          Archive **{{ resolved_archive_id }}** already contains richer enrichment
                          data than the current manual re-enrich candidate.

                          Existing status: `{{ existing_payload_status }}`
                          Candidate status: `{{ candidate_payload_status }}`
                    - action: logbook.log
                      data:
                        name: Print History Re-Enrich
                        message: >-
                          Preserved existing enrichment for archive {{ resolved_archive_id }} because
                          the manual candidate was lower fidelity.
              default:
                - action: rest_command.bambuddy_update_archive
                  data:
                    archive_id: "{{ resolved_archive_id }}"
                    tags: "{{ merged_tags }}"
                    notes: "{{ merged_notes }}"
                - action: script.refresh_print_history_archives
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ not has_candidate_payload }}"
                      sequence:
                        - action: persistent_notification.create
                          data:
                            notification_id: "print_history_reenrich_missing_{{ resolved_archive_id }}"
                            title: "Print History Re-Enrich Saved Diagnostic Only"
                            message: >-
                              Archive **{{ resolved_archive_id }}** did not produce any resolvable
                              filament rows, but the hidden enrichment payload was updated with a
                              diagnostic reason so the popup can explain why.

                              {{ archive_row_reason }}
                    - conditions:
                        - condition: template
                          value_template: "{{ candidate_ambiguities | count > 0 }}"
                      sequence:
                        - action: persistent_notification.create
                          data:
                            notification_id: "print_history_reenrich_ambiguous_{{ resolved_archive_id }}"
                            title: "Print History Re-Enrich Saved With Ambiguities"
                            message: >-
                              Archive **{{ resolved_archive_id }}** was updated, but one or more
                              filament rows could not be resolved to a unique spool.

                              {% for item in candidate_ambiguities %}
                              - {{ item.label | default('Unknown filament', true) }}
                                ({{ item.weight | default(0, true) }}g, {{ item.type | default('Unknown', true) }}, {{ item.color | default('Unknown', true) }}): {{ item.reason }}
                              {% endfor %}
                - action: logbook.log
                  data:
                    name: Print History Re-Enrich
                    message: >-
                      Re-enriched archive {{ resolved_archive_id }} with status {{ candidate_payload_status }}
                      from {{ archive_row_source }} and {{ candidate_filament_rows }} filament row(s).
          else:
            - action: logbook.log
              data:
                name: Print History Re-Enrich
                message: Re-enrich requested without an archive ID
      else:
        - action: logbook.log
          data:
            name: Print History Re-Enrich
            message: Re-enrich skipped because Bambuddy integration is disabled
  mode: queued