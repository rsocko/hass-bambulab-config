# Fetch a specific page of archive history from Bambuddy.
# Called by script.navigate_history or directly from dashboard buttons.
# Fires a bambuddy_history_page_loaded event for the trigger-based
# template sensor (sensor.print_history_page_archives).
# Docs: docs/features/print_history/README.md
load_history_page:
  alias: "Load History Page"
  description: >-
    Fetches a specific page of print history from Bambuddy archives API
    using offset-based pagination.
  fields:
    page:
      description: "Page number to load (1-based)"
      required: true
      selector:
        number:
          min: 1
          max: 100
  sequence:
    - variables:
        limit: "{{ states('input_number.bambuddy_history_limit') | int(10) }}"
        offset: "{{ ((page | int(1)) - 1) * (states('input_number.bambuddy_history_limit') | int(10)) }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.history_current_page
      data:
        value: "{{ page | int(1) }}"

    # Fetch the page via REST command (offset-based pagination)
    - action: rest_command.bambuddy_query_history_page
      data:
        limit: "{{ limit }}"
        offset: "{{ offset }}"
      response_variable: api_response

    - if:
        - condition: template
          value_template: "{{ api_response.status == 200 }}"
      then:
        - variables:
            # API returns a flat array: [ {archive}, ... ]
            result_archives: "{{ api_response.content | default([]) }}"
            result_count: "{{ result_archives | length }}"
            result_has_more: "{{ (result_count | int) >= (limit | int) }}"

        # Fire event for trigger-based template sensor
        - event: bambuddy_history_page_loaded
          event_data:
            page: "{{ page | int(1) }}"
            archives: "{{ result_archives }}"
            count: "{{ result_count }}"
            has_more: "{{ result_has_more }}"
      else:
        - action: logbook.log
          data:
            name: Print History
            message: "Failed to load page {{ page }}: HTTP {{ api_response.status | default('?') }}"
  mode: single
