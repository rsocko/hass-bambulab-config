# Set the current Layer 2 browser page.
# Layer 1 holds the full archive cache, and Layer 2 slices the current page.
# Called by script.navigate_history or directly from dashboard buttons.
# Docs: docs/features/print_history/filter-sort-design.md
load_history_page:
  alias: "Load History Page"
  description: >-
    Updates the current print history page for the Layer 2 browser.
  fields:
    page:
      description: "Page number to load (1-based)"
      required: true
      selector:
        number:
          min: 1
          max: 100
  sequence:
    - variables:
        total_pages: "{{ state_attr('sensor.print_history_filtered', 'total_pages') | int(1) }}"
        target_page: >-
          {% set requested = page | int(1) %}
          {% if requested < 1 %}
            1
          {% elif requested > total_pages %}
            {{ total_pages }}
          {% else %}
            {{ requested }}
          {% endif %}

    - action: input_number.set_value
      target:
        entity_id: input_number.history_current_page
      data:
        value: "{{ target_page | int(1) }}"
  mode: single
