# Add and/or remove user tags across a selected set of archives while preserving system tags.
bulk_update_print_history_user_tags:
  alias: Bulk Update Print History User Tags
  fields:
    archive_ids_csv:
      description: Comma-separated archive IDs.
      required: true
      selector:
        text:
    add_tags:
      description: Comma-separated user tags to add.
      required: false
      selector:
        text:
    remove_tags:
      description: Comma-separated user tags to remove.
      required: false
      selector:
        text:
    refresh_browser:
      description: Refresh the browser after updating tags. Defaults to true.
      required: false
      selector:
        boolean:
  sequence:
    - variables:
        should_refresh_browser: "{{ refresh_browser if refresh_browser is defined else true }}"
        archive_ids_json: >-
          {% set ns = namespace(values=[]) %}
          {% for token in (archive_ids_csv | default('', true) | string | regex_findall('\d+')) %}
            {% set numeric = token | int(0) %}
            {% if numeric > 0 and numeric not in ns.values %}
              {% set ns.values = ns.values + [numeric] %}
            {% endif %}
          {% endfor %}
          {{ ns.values | tojson }}
        add_user_tags_json: >-
          {% set ns = namespace(values=[], seen=[]) %}
          {% for token in (add_tags | default('', true) | string).split(',') %}
            {% set cleaned = token | string | trim %}
            {% set lowered = cleaned | lower %}
            {% set is_system = lowered.startswith('f:')
              or lowered.startswith('s:')
              or lowered.startswith('spoolman:')
              or lowered.startswith('vendor:')
              or lowered.startswith('material:')
              or lowered.startswith('cost:')
              or lowered.startswith('status:')
              or lowered.startswith('ha enrichment:')
              or lowered.startswith('ha_enrichment:')
              or lowered == 'ha_enriched:true' %}
            {% if cleaned != '' and not is_system and lowered not in ns.seen %}
              {% set ns.values = ns.values + [cleaned] %}
              {% set ns.seen = ns.seen + [lowered] %}
            {% endif %}
          {% endfor %}
          {{ ns.values | tojson }}
        remove_user_tags_json: >-
          {% set ns = namespace(values=[], seen=[]) %}
          {% for token in (remove_tags | default('', true) | string).split(',') %}
            {% set cleaned = token | string | trim %}
            {% set lowered = cleaned | lower %}
            {% set is_system = lowered.startswith('f:')
              or lowered.startswith('s:')
              or lowered.startswith('spoolman:')
              or lowered.startswith('vendor:')
              or lowered.startswith('material:')
              or lowered.startswith('cost:')
              or lowered.startswith('status:')
              or lowered.startswith('ha enrichment:')
              or lowered.startswith('ha_enrichment:')
              or lowered == 'ha_enriched:true' %}
            {% if cleaned != '' and not is_system and lowered not in ns.seen %}
              {% set ns.values = ns.values + [lowered] %}
              {% set ns.seen = ns.seen + [lowered] %}
            {% endif %}
          {% endfor %}
          {{ ns.values | tojson }}
    - if:
        - condition: template
          value_template: >-
            {{ (archive_ids_json | from_json | count) > 0 and ((add_user_tags_json | from_json | count) > 0 or (remove_user_tags_json | from_json | count) > 0) }}
      then:
        - repeat:
            for_each: "{{ archive_ids_json | from_json }}"
            sequence:
              - action: bambuddy.get_print_history_archive_detail
                data:
                  archive_id: "{{ repeat.item }}"
                response_variable: archive_detail_result
              - variables:
                  archive_detail: >-
                    {% set detail = archive_detail_result.get('archive', {}) if archive_detail_result is mapping else {} %}
                    {% if detail is string %}
                      {{ detail | from_json({}) }}
                    {% elif detail is mapping %}
                      {{ detail | tojson | from_json }}
                    {% else %}
                      {{ {} }}
                    {% endif %}
                  existing_tags_raw: "{{ archive_detail.tags | default('', true) | string }}"
                  preserved_system_tags: >-
                    {% set ns = namespace(result=[], seen=[]) %}
                    {% for tag in existing_tags_raw.split(',') %}
                      {% set cleaned = tag | string | trim %}
                      {% set lowered = cleaned | lower %}
                      {% set is_system = lowered.startswith('f:')
                        or lowered.startswith('s:')
                        or lowered.startswith('spoolman:')
                        or lowered.startswith('vendor:')
                        or lowered.startswith('material:')
                        or lowered.startswith('cost:')
                        or lowered.startswith('status:')
                        or lowered.startswith('ha enrichment:')
                        or lowered.startswith('ha_enrichment:')
                        or lowered == 'ha_enriched:true' %}
                      {% if cleaned != '' and is_system and lowered not in ns.seen %}
                        {% set ns.result = ns.result + [cleaned] %}
                        {% set ns.seen = ns.seen + [lowered] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.result | tojson | from_json }}
                  merged_user_tags: >-
                    {% set additions = add_user_tags_json | from_json %}
                    {% set removals = remove_user_tags_json | from_json %}
                    {% set ns = namespace(result=[], seen=[]) %}
                    {% for tag in existing_tags_raw.split(',') %}
                      {% set cleaned = tag | string | trim %}
                      {% set lowered = cleaned | lower %}
                      {% set is_system = lowered.startswith('f:')
                        or lowered.startswith('s:')
                        or lowered.startswith('spoolman:')
                        or lowered.startswith('vendor:')
                        or lowered.startswith('material:')
                        or lowered.startswith('cost:')
                        or lowered.startswith('status:')
                        or lowered.startswith('ha enrichment:')
                        or lowered.startswith('ha_enrichment:')
                        or lowered == 'ha_enriched:true' %}
                      {% if cleaned != '' and not is_system and lowered not in removals and lowered not in ns.seen %}
                        {% set ns.result = ns.result + [cleaned] %}
                        {% set ns.seen = ns.seen + [lowered] %}
                      {% endif %}
                    {% endfor %}
                    {% for tag in additions %}
                      {% set cleaned = tag | string | trim %}
                      {% set lowered = cleaned | lower %}
                      {% if cleaned != '' and lowered not in removals and lowered not in ns.seen %}
                        {% set ns.result = ns.result + [cleaned] %}
                        {% set ns.seen = ns.seen + [lowered] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.result | tojson | from_json }}
                  merged_tags: >-
                    {% set ns = namespace(result=[], seen=[]) %}
                    {% for tag in preserved_system_tags + merged_user_tags %}
                      {% set cleaned = tag | string | trim %}
                      {% set lowered = cleaned | lower %}
                      {% if cleaned != '' and lowered not in ns.seen %}
                        {% set ns.result = ns.result + [cleaned] %}
                        {% set ns.seen = ns.seen + [lowered] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.result | join(',') }}
              - action: bambuddy.update_print_history_archive
                data:
                  archive_id: "{{ repeat.item }}"
                  tags: "{{ merged_tags }}"
        - if:
            - condition: template
              value_template: "{{ should_refresh_browser }}"
          then:
            - action: script.refresh_print_history_archives
  mode: queued