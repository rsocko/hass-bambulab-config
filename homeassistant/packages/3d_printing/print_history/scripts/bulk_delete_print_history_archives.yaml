# Delete a selected set of archives from Bambuddy and the local Variant 3 store.
bulk_delete_print_history_archives:
  alias: Bulk Delete Print History Archives
  fields:
    archive_ids_csv:
      description: Comma-separated archive IDs.
      required: true
      selector:
        text:
  sequence:
    - variables:
        archive_ids: >-
          {% set ns = namespace(values=[]) %}
          {% for token in (archive_ids_csv | default('', true) | string | regex_findall('\d+')) %}
            {% set numeric = token | int(0) %}
            {% if numeric > 0 and numeric not in ns.values %}
              {% set ns.values = ns.values + [numeric] %}
            {% endif %}
          {% endfor %}
          {{ ns.values | tojson | from_json }}
    - if:
        - condition: template
          value_template: "{{ archive_ids | count > 0 }}"
      then:
        - repeat:
            for_each: "{{ archive_ids }}"
            sequence:
              - action: bambuddy.delete_print_history_archive
                data:
                  archive_id: "{{ repeat.item }}"
  mode: queued