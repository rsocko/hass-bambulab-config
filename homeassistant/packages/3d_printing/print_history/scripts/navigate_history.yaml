# Navigate print history: prev/next/first/last.
# Adjusts the current page within the Layer 2 browser bounds and delegates to
# load_history_page.
# Docs: docs/features/print_history/filter-sort-design.md
navigate_history:
  alias: "Navigate History"
  description: >-
    Navigate paginated print history. Accepts a direction and loads
    the corresponding page.
  fields:
    direction:
      description: "Navigation direction: prev, next, first, last"
      required: true
      selector:
        select:
          options:
            - prev
            - next
            - first
            - last
  sequence:
    - variables:
        current_page: "{{ states('input_number.history_current_page') | int(1) }}"
        total_pages: "{{ state_attr('sensor.bambuddy_print_history_browser_filtered', 'total_pages') | int(1) }}"
        target_page: >-
          {% if direction == 'first' %}
            1
          {% elif direction == 'last' %}
            {{ total_pages }}
          {% elif direction == 'next' %}
            {{ [current_page + 1, total_pages] | min }}
          {% else %}
            {{ [current_page - 1, 1] | max }}
          {% endif %}

    - action: script.load_history_page
      data:
        page: "{{ target_page | int(1) }}"
  mode: single
