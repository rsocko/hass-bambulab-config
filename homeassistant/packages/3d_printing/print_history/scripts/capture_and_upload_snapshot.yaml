# Multi-camera snapshot capture + multipart upload bridge.
# Called by photo capture automations with a stage parameter.
# Docs: docs/features/print_history/photo-capture-design.md
capture_and_upload_snapshot:
  alias: "Capture Snapshot"
  description: >-
    Captures photos from configured cameras, saves locally to
    /config/www/printer_snapshots/, records manifest entries,
    and attempts best-effort multipart upload to Bambuddy.
  fields:
    stage:
      description: "Capture stage: start, midprint, near_complete, error, finish"
      required: true
      selector:
        text:
  mode: queued
  max: 5
  sequence:
    - variables:
        task_name: >-
          {{ states('sensor.ntk_ryansoffice_3dprinter_task_name')
             | default('unknown') | replace(' ', '_') | replace('/', '_') }}
        timestamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
        primary_camera: "camera.ntk_ryansoffice_3dprinter_camera"
        secondary_camera: "{{ states('input_select.secondary_camera_entity') }}"
        has_secondary: >-
          {{ secondary_camera not in ['', 'unknown', 'unavailable', 'none', 'None'] }}
        primary_filename: "{{ task_name }}_{{ stage }}_{{ timestamp }}.jpg"
        secondary_filename: "{{ task_name }}_{{ stage }}_{{ timestamp }}_cam2.jpg"
        archive_id: "{{ states('input_text.bambuddy_current_archive_id') }}"
        snapshot_light: "{{ states('input_text.3dprinter_snapshot_light') }}"
        has_light: >-
          {{ snapshot_light not in ['', 'unknown', 'unavailable', 'none', 'None'] }}

    # --- Turn on snapshot light (if configured, reuses notifications helper) ---
    - if:
        - condition: template
          value_template: "{{ has_light }}"
      then:
        - action: light.turn_on
          target:
            entity_id: "{{ snapshot_light }}"
          data:
            brightness_pct: >-
              {{ states('input_number.3dprinter_snapshot_light_brightness') | int(100) }}
        - delay:
            seconds: 1

    # --- Capture primary camera ---
    - action: camera.snapshot
      target:
        entity_id: "{{ primary_camera }}"
      data:
        filename: "/config/www/printer_snapshots/{{ primary_filename }}"

    # --- Capture secondary camera (if configured) ---
    - if:
        - condition: template
          value_template: "{{ has_secondary }}"
      then:
        - action: camera.snapshot
          target:
            entity_id: "{{ secondary_camera }}"
          data:
            filename: "/config/www/printer_snapshots/{{ secondary_filename }}"

    # --- Turn off snapshot light ---
    - if:
        - condition: template
          value_template: "{{ has_light }}"
      then:
        - action: light.turn_off
          target:
            entity_id: "{{ snapshot_light }}"

    # --- Resolve archive_id if not set ---
    - if:
        - condition: template
          value_template: "{{ archive_id in ['', 'unknown', 'unavailable'] }}"
      then:
        - action: script.resolve_current_archive_id
        - variables:
            archive_id: "{{ states('input_text.bambuddy_current_archive_id') }}"

    - variables:
        has_archive_id: >-
          {{ archive_id not in ['', 'unknown', 'unavailable', 'None', none] }}

    # --- Update photo manifest ---
    - variables:
        current_manifest: >-
          {% set raw = states('input_text.bambuddy_photo_manifest') %}
          {{ raw | from_json if raw not in ['', 'unknown', 'unavailable', '[]'] else [] }}
        primary_entry: >-
          {{ {"stage": stage, "camera": "primary",
              "local_path": "/local/printer_snapshots/" ~ primary_filename,
              "file_path": "/config/www/printer_snapshots/" ~ primary_filename,
              "archive_id": archive_id,
              "timestamp": now().isoformat(),
              "uploaded": false} }}
        secondary_entry: >-
          {{ {"stage": stage, "camera": "secondary",
              "local_path": "/local/printer_snapshots/" ~ secondary_filename,
              "file_path": "/config/www/printer_snapshots/" ~ secondary_filename,
              "archive_id": archive_id,
              "timestamp": now().isoformat(),
              "uploaded": false} if has_secondary else none }}

    - action: input_text.set_value
      target:
        entity_id: input_text.bambuddy_photo_manifest
      data:
        value: >-
          {{ (current_manifest + [primary_entry] + ([secondary_entry] if has_secondary else [])) | tojson }}

    # --- Best-effort upload via shell_command bridge ---
    - if:
        - condition: template
          value_template: "{{ has_archive_id }}"
      then:
        - action: shell_command.bambuddy_upload_archive_photo
          data:
            archive_id: "{{ archive_id }}"
            file_path: "/config/www/printer_snapshots/{{ primary_filename }}"
          continue_on_error: true

    - if:
        - condition: template
          value_template: "{{ has_archive_id and has_secondary }}"
      then:
        - action: shell_command.bambuddy_upload_archive_photo
          data:
            archive_id: "{{ archive_id }}"
            file_path: "/config/www/printer_snapshots/{{ secondary_filename }}"
          continue_on_error: true

    - action: logbook.log
      data:
        name: Print History
        message: >-
          Captured {{ stage }} photo: {{ primary_filename }}
          {% if has_secondary %} + {{ secondary_filename }}{% endif %}
          (archive_id={{ archive_id }}, upload {% if has_archive_id %}attempted{% else %}skipped - missing archive_id{% endif %})
