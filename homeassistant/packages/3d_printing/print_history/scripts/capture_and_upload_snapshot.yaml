# Multi-camera snapshot capture + multipart upload bridge.
# Called by photo capture automations with a stage parameter.
# Docs: docs/features/print_history/photo-capture-design.md
capture_and_upload_snapshot:
  alias: "Capture Snapshot"
  description: >-
    Captures photos from configured cameras, saves locally to
    /config/www/printer_snapshots/, increments capture state,
    and attempts verified multipart upload to Bambuddy.
  fields:
    stage:
      description: "Capture stage: start, midprint, near_complete, error, finish"
      required: true
      selector:
        text:
  mode: queued
  max: 5
  sequence:
    - variables:
        raw_task_name: >-
         {{ states('input_text.bambuddy_archive_binding_task')
           | default(states('sensor.ntk_ryansoffice_3dprinter_task_name'), true)
           | default('unknown', true) | string | trim }}
        task_name: >-
         {{ states('input_text.bambuddy_archive_binding_task')
           | default(states('sensor.ntk_ryansoffice_3dprinter_task_name'), true)
           | default('unknown', true) | string | trim
             | replace(' ', '_') | replace('/', '_') }}
        timestamp: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
        default_camera: "camera.ntk_ryansoffice_3dprinter_camera"
        configured_cameras_raw: >-
          {{ states('input_text.bambuddy_capture_camera_entities')
             | default('', true) | string | trim }}
        archive_id: "{{ states('input_text.bambuddy_current_archive_id') }}"
        snapshot_light: "{{ states('input_text.3dprinter_snapshot_light') }}"

    - variables:
        configured_cameras_json: >-
          {% set raw = configured_cameras_raw | trim %}
          {% set ns = namespace(items=[]) %}
          {% if raw in ['', 'unknown', 'unavailable', 'None', 'none'] %}
            {{ [default_camera] | to_json }}
          {% else %}
            {% for token in raw.split(',') %}
              {% set camera = token | string | trim %}
              {% if camera.startswith('camera.') and camera not in ns.items %}
                {% set ns.items = ns.items + [camera] %}
              {% endif %}
            {% endfor %}
            {{ ns.items | to_json }}
          {% endif %}
        camera_selection_mode: >-
          {% if configured_cameras_raw in ['', 'unknown', 'unavailable', 'None', 'none'] %}default_bambu
          {% else %}custom
          {% endif %}
        active_cameras_json: >-
          {% set configured = configured_cameras_json | from_json %}
          {% set ns = namespace(items=[]) %}
          {% for camera in configured %}
            {% set camera_state = states(camera) %}
            {% if camera.startswith('camera.')
                  and camera_state not in ['', 'unknown', 'unavailable', 'none']
                  and camera not in ns.items %}
              {% set ns.items = ns.items + [camera] %}
            {% endif %}
          {% endfor %}
          {{ ns.items | to_json }}
        configured_camera_count: "{{ configured_cameras_json | from_json | count }}"
        active_camera_count: "{{ active_cameras_json | from_json | count }}"
        has_capture_cameras: "{{ active_camera_count | int(0) > 0 }}"
        has_light: >-
          {{ snapshot_light not in ['', 'unknown', 'unavailable', 'none', 'None'] }}
        printer_is_active: >-
          {{ states('sensor.ntk_ryansoffice_3dprinter_print_status') | string | lower | trim
             in ['running', 'prepare', 'pause', 'paused', 'printing', 'slicing', 'init'] }}

    # --- Turn on snapshot light (if configured, reuses notifications helper) ---
    - if:
        - condition: template
          value_template: "{{ has_light }}"
      then:
        - action: light.turn_on
          target:
            entity_id: "{{ snapshot_light }}"
          data:
            brightness_pct: >-
              {{ states('input_number.3dprinter_snapshot_light_brightness') | int(100) }}
        - delay:
            seconds: 1

    - variables:
        camera_results_json: "[]"

    # --- Capture configured cameras ---
    - if:
        - condition: template
          value_template: "{{ has_capture_cameras }}"
      then:
        - repeat:
            for_each: "{{ active_cameras_json | from_json }}"
            sequence:
              - variables:
                  camera_entity: "{{ repeat.item }}"
                  camera_suffix: "{{ '' if repeat.index == 1 else '_cam' ~ repeat.index }}"
                  camera_filename: "{{ task_name }}_{{ stage }}_{{ timestamp }}{{ camera_suffix }}.jpg"
                  camera_file_path: "/config/www/printer_snapshots/{{ task_name }}_{{ stage }}_{{ timestamp }}{{ camera_suffix }}.jpg"
              - action: camera.snapshot
                target:
                  entity_id: "{{ camera_entity }}"
                data:
                  filename: "{{ camera_file_path }}"
              - action: counter.increment
                target:
                  entity_id: counter.bambuddy_captured_photo_count
              - variables:
                  camera_results_json: >-
                    {% set captures = camera_results_json | default('[]') | from_json %}
                    {{ (captures + [{
                      'camera': camera_entity,
                      'filename': camera_filename,
                      'file_path': camera_file_path
                    }]) | to_json }}

    # --- Turn off snapshot light ---
    - if:
        - condition: template
          value_template: "{{ has_light }}"
      then:
        - action: light.turn_off
          target:
            entity_id: "{{ snapshot_light }}"

    - variables:
        had_archive_id: >-
          {{ archive_id not in ['', 'unknown', 'unavailable', 'None', none] }}

    # --- Validate stored archive_id before upload ---
    - if:
        - condition: template
          value_template: "{{ had_archive_id }}"
      then:
        - action: rest_command.bambuddy_get_archive_detail
          data:
            archive_id: "{{ archive_id }}"
          response_variable: current_archive_response

    - variables:
        current_archive_status: >-
          {% if had_archive_id
                and current_archive_response is defined
                and current_archive_response.status == 200 %}
            {{ current_archive_response.content.status | default('', true) | string | lower | trim }}
          {% else %}
            {{ '' }}
          {% endif %}
        current_archive_is_terminal: >-
          {{ current_archive_status in ['archived', 'completed', 'complete', 'failed', 'cancelled', 'canceled', 'stopped', 'success'] }}
        current_archive_matches_task: >-
          {% if had_archive_id
                and current_archive_response is defined
                and current_archive_response.status == 200 %}
            {% set current_task = raw_task_name | lower | replace('_', ' ') | replace('.3mf', '') | trim %}
            {% set archive_print_name = current_archive_response.content.print_name | default('', true) | string | lower | replace('_', ' ') | replace('.3mf', '') | trim %}
            {% set archive_filename = current_archive_response.content.filename | default('', true) | string | lower | replace('_', ' ') | replace('.3mf', '') | trim %}
            {{ current_task not in ['', 'unknown']
               and (
                 current_task in archive_print_name
                 or archive_print_name in current_task
                 or current_task in archive_filename
                 or archive_filename in current_task
               )
               and (not printer_is_active or not current_archive_is_terminal) }}
          {% else %}
            false
          {% endif %}

    # --- Resolve archive_id if missing or stale ---
    - if:
        - condition: template
          value_template: "{{ not had_archive_id or not current_archive_matches_task }}"
      then:
        - action: script.resolve_current_archive_id
        - variables:
            archive_id: "{{ states('input_text.bambuddy_current_archive_id') }}"

    - variables:
        resolved_archive_present: >-
          {{ archive_id not in ['', 'unknown', 'unavailable', 'None', none] }}

    - if:
        - condition: template
          value_template: "{{ resolved_archive_present }}"
      then:
        - action: rest_command.bambuddy_get_archive_detail
          data:
            archive_id: "{{ archive_id }}"
          response_variable: validated_archive_response

    - variables:
        validated_archive_status: >-
          {% if resolved_archive_present
                and validated_archive_response is defined
                and validated_archive_response.status == 200 %}
            {{ validated_archive_response.content.status | default('', true) | string | lower | trim }}
          {% else %}
            {{ '' }}
          {% endif %}
        validated_archive_is_terminal: >-
          {{ validated_archive_status in ['archived', 'completed', 'complete', 'failed', 'cancelled', 'canceled', 'stopped', 'success'] }}
        archive_matches_task: >-
          {% if resolved_archive_present
                and validated_archive_response is defined
                and validated_archive_response.status == 200 %}
            {% set current_task = raw_task_name | lower | replace('_', ' ') | replace('.3mf', '') | trim %}
            {% set archive_print_name = validated_archive_response.content.print_name | default('', true) | string | lower | replace('_', ' ') | replace('.3mf', '') | trim %}
            {% set archive_filename = validated_archive_response.content.filename | default('', true) | string | lower | replace('_', ' ') | replace('.3mf', '') | trim %}
            {{ current_task not in ['', 'unknown']
               and (
                 current_task in archive_print_name
                 or archive_print_name in current_task
                 or current_task in archive_filename
                 or archive_filename in current_task
               )
               and (not printer_is_active or not validated_archive_is_terminal) }}
          {% else %}
            false
          {% endif %}

    - variables:
        has_archive_id: >-
          {{ resolved_archive_present and archive_matches_task }}
        archive_lookup_status: >-
          {% if resolved_archive_present and archive_matches_task %}validated
          {% elif resolved_archive_present and validated_archive_is_terminal %}skipped_terminal_archive
          {% elif had_archive_id and not current_archive_matches_task %}skipped_stale_archive
          {% else %}skipped_no_archive
          {% endif %}
        archive_display_id: >-
          {{ archive_id if resolved_archive_present else 'missing' }}

    - variables:
        captured_camera_count: "{{ camera_results_json | from_json | count }}"
        has_captured_photos: "{{ captured_camera_count | int(0) > 0 }}"
        camera_upload_results_json: >-
          {% set captures = camera_results_json | from_json %}
          {% if has_archive_id %}
            []
          {% else %}
            {% set ns = namespace(items=[]) %}
            {% for capture in captures %}
              {% set ns.items = ns.items + [{
                'camera': capture.camera,
                'filename': capture.filename,
                'file_path': capture.file_path,
                'upload_status': archive_lookup_status
              }] %}
            {% endfor %}
            {{ ns.items | to_json }}
          {% endif %}

    # --- Upload each captured snapshot and verify via archive detail ---
    - if:
        - condition: template
          value_template: "{{ has_archive_id and has_captured_photos }}"
      then:
        - repeat:
            for_each: "{{ camera_results_json | from_json }}"
            sequence:
              - variables:
                  camera_entity: "{{ repeat.item.camera }}"
                  camera_filename: "{{ repeat.item.filename }}"
                  camera_file_path: "{{ repeat.item.file_path }}"
              - action: rest_command.bambuddy_get_archive_detail
                data:
                  archive_id: "{{ archive_id }}"
                response_variable: upload_before_response
              - variables:
                  upload_before_count: >-
                    {% if upload_before_response is defined and upload_before_response.status == 200 %}
                      {{ upload_before_response.content.photos | default([], true) | count }}
                    {% else %}
                      0
                    {% endif %}
              - action: shell_command.bambuddy_upload_archive_photo
                data:
                  archive_id: "{{ archive_id }}"
                  file_path: "{{ camera_file_path }}"
                continue_on_error: true
              - delay:
                  seconds: 2
              - action: rest_command.bambuddy_get_archive_detail
                data:
                  archive_id: "{{ archive_id }}"
                response_variable: upload_after_response
              - variables:
                  upload_after_count: >-
                    {% if upload_after_response is defined and upload_after_response.status == 200 %}
                      {{ upload_after_response.content.photos | default([], true) | count }}
                    {% else %}
                      0
                    {% endif %}
                  upload_status: >-
                    {% if upload_after_count | int(0) > upload_before_count | int(0) %}verified
                    {% else %}unverified
                    {% endif %}
                  camera_upload_results_json: >-
                    {% set uploads = camera_upload_results_json | default('[]') | from_json %}
                    {{ (uploads + [{
                      'camera': camera_entity,
                      'filename': camera_filename,
                      'file_path': camera_file_path,
                      'upload_status': upload_status
                    }]) | to_json }}

    - variables:
        verified_upload_count: >-
          {{ camera_upload_results_json | from_json
             | selectattr('upload_status', 'eq', 'verified') | list | count }}
        upload_status_summary: >-
          {% if not has_captured_photos %}no_photos_captured
          {% elif not has_archive_id %}{{ archive_lookup_status }}
          {% elif verified_upload_count | int(0) == captured_camera_count | int(0) %}verified
          {% elif verified_upload_count | int(0) > 0 %}partial
          {% else %}unverified
          {% endif %}
        captured_filenames: >-
          {% set captures = camera_results_json | from_json %}
          {{ captures | map(attribute='filename') | list | join(', ') }}
        upload_result_summary: >-
          stage={{ stage }} archive={{ archive_display_id }} archive_status={{ archive_lookup_status }}
          cameras={{ captured_camera_count }}/{{ active_camera_count }}/{{ configured_camera_count }}
          uploads={{ verified_upload_count }}/{{ captured_camera_count }}
          mode={{ camera_selection_mode }} status={{ upload_status_summary }}

    - action: input_text.set_value
      target:
        entity_id: input_text.bambuddy_last_photo_upload_result
      data:
        value: "{{ upload_result_summary[:255] }}"

    - if:
        - condition: template
          value_template: "{{ has_archive_id and has_captured_photos }}"
      then:
        - action: bambuddy.append_print_history_event
          data:
            archive_id: "{{ archive_id | int(0) }}"
            event_type: photo_captured
            event_source: ha_script
            event_status: "{{ upload_status_summary | string }}"
            payload:
              stage: "{{ stage }}"
              captured_camera_count: "{{ captured_camera_count | int(0) }}"
              verified_upload_count: "{{ verified_upload_count | int(0) }}"
              upload_status: "{{ upload_status_summary | string }}"
            event_key: >-
              photo:{{ archive_id }}:{{ stage }}:{{ captured_filenames | default('', true) | string | trim }}

    - action: logbook.log
      data:
        name: Print History
        message: >-
          Captured {{ stage }} photo{% if captured_camera_count | int(0) != 1 %}s{% endif %}:
          {% if captured_filenames not in ['', none] %}{{ captured_filenames }}{% else %}none{% endif %}
          (archive_id={{ archive_display_id }}, archive_status={{ archive_lookup_status }}, configured={{ configured_camera_count }}, active={{ active_camera_count }}, uploaded={{ verified_upload_count }}/{{ captured_camera_count }}, mode={{ camera_selection_mode }}, status={{ upload_status_summary }})
