# Set favorite state across a selected set of archives.
bulk_set_print_history_archive_favorite:
  alias: Bulk Set Print History Archive Favorite
  fields:
    archive_ids_csv:
      description: Comma-separated archive IDs.
      required: true
      selector:
        text:
    is_favorite:
      description: Target favorite state.
      required: true
      selector:
        boolean:
    refresh_browser:
      description: Refresh the browser after updating favorites. Defaults to true.
      required: false
      selector:
        boolean:
  sequence:
    - variables:
        should_refresh_browser: "{{ refresh_browser if refresh_browser is defined else true }}"
        target_favorite: "{{ is_favorite | bool }}"
        archive_ids: >-
          {% set ns = namespace(values=[]) %}
          {% for token in (archive_ids_csv | default('', true) | string | regex_findall('\d+')) %}
            {% set numeric = token | int(0) %}
            {% if numeric > 0 and numeric not in ns.values %}
              {% set ns.values = ns.values + [numeric] %}
            {% endif %}
          {% endfor %}
          {{ ns.values | tojson | from_json }}
    - if:
        - condition: template
          value_template: "{{ archive_ids | count > 0 }}"
      then:
        - repeat:
            for_each: "{{ archive_ids }}"
            sequence:
              - action: bambuddy.set_print_history_archive_favorite
                data:
                  archive_id: "{{ repeat.item }}"
                  is_favorite: "{{ target_favorite }}"
        - if:
            - condition: template
              value_template: "{{ should_refresh_browser }}"
          then:
            - action: script.refresh_print_history_archives
  mode: queued