# Print History View — dedicated tab in the 3D Printing dashboard.
#
# Layout: browser-first hero surface with popup-driven controls.
#
# See docs/features/print_history/README.md § Dashboard for the full layout spec.
title: Print History
path: print-history
icon: mdi:history
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        :host {
          display: block;
          box-sizing: border-box;
          padding-inline: max(8px, min(1.8vw, 20px));
        }
    cards:
      # Conditional photo review chip (hidden when idle)
      - !include ../dashboard_cards/photo_review_chip.yaml

      # Browser toolbar + always-visible filters/settings
      - !include ../dashboard_cards/print_history_browser.yaml

      # Daily activity heatmap with drill-in and optional filter scoping
      - !include ../dashboard_cards/print_history_activity_panel.yaml

      # Unified controls: navigation, page size, layout mode, refresh
      - !include ../dashboard_cards/print_history_top_controls.yaml

      # Archive browser rendered from the current server-side page slice
      - !include ../dashboard_cards/print_history.yaml

      # Reuse the same unified controls below the archive grid
      - !include ../dashboard_cards/print_history_top_controls.yaml
