# Print History View — dedicated tab in the 3D Printing dashboard.
#
# Layout: browser-first hero surface with popup-driven controls and lightweight
# diagnostics in a secondary column.
#
# See docs/features/print_history/README.md § Dashboard for the full layout spec.
title: Print History
path: print-history
icon: mdi:history
type: sections
max_columns: 1
sections:
  # ── Section 1: Print History (hero — left column) ──────────────────
  # All three cards in one section so masonry keeps them together.
  - type: grid
    cards:
      # Conditional photo review chip (hidden when idle)
      - !include ../dashboard_cards/photo_review_chip.yaml

      # History table + last-print summary
      - !include ../dashboard_cards/print_history.yaml

      # Browser toolbar + page navigation + popup settings
      - !include ../dashboard_cards/print_history_browser.yaml
