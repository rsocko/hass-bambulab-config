# Refresh the recent-print REST sensor and the Layer 1 browser archive cache
# when relevant events occur.
# Triggers on print_complete, print_failed, print_stopped webhooks,
# native print-canceled, and on HA startup.
# Docs: docs/features/print_history/README.md
- alias: "Print History - Refresh on Event"
  id: bambuddy_event_history_refresh
  description: >
    Refreshes the recent print sensor and archive cache when a print
    completes, fails, stops, or on HA startup.

  triggers:
    - trigger: event
      event_type: bambuddy_webhook_event
      event_data:
        event: "print_complete"
      id: print_complete

    - trigger: event
      event_type: bambuddy_webhook_event
      event_data:
        event: "print_failed"
      id: print_failed

    - trigger: event
      event_type: bambuddy_webhook_event
      event_data:
        event: "print_stopped"
      id: print_stopped

    - trigger: device
      device_id: 210dfdfa64085e8cf073e50eae757d90
      domain: bambu_lab
      type: event_print_canceled
      id: print_stopped

    - trigger: homeassistant
      event: start
      id: startup

  conditions:
    - condition: state
      entity_id: input_boolean.bambuddy_integration_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.bambuddy_history_sync_enabled
      state: "on"

  actions:
    # Delay: let Bambuddy finalize data (webhook) or helpers restore (startup)
    - delay:
        seconds: >-
          {{ 30 if trigger.id == 'startup' else 5 }}

    - action: homeassistant.update_entity
      target:
        entity_id: sensor.bambuddy_print_history

    - action: script.refresh_print_history_archives

    - action: input_number.set_value
      data:
        entity_id: input_number.history_current_page
        value: 1

    - action: logbook.log
      data:
        name: Print History
        message: >-
          History refreshed
          {% if trigger.id == 'startup' %}(startup){% else %}after {{ trigger.id | default('event') }}{% endif %}

  mode: single
