# Reset the Bambuddy Variant 3 browser state when relevant events occur.
# Triggers on print_complete, print_failed, print_stopped webhooks,
# and on HA startup.
# Docs: docs/features/print_history/README.md
- alias: "Print History - Refresh on Event"
  id: print_history_browser_refresh_on_event
  description: >
    Resets the browser page when a print completes, fails, stops, or on HA
    startup. The Bambuddy integration refreshes its own local browser store
    directly from startup and webhook listeners.

  triggers:
    - trigger: event
      event_type: bambuddy_webhook_event
      event_data:
        event: "print_complete"
      id: print_complete

    - trigger: event
      event_type: bambuddy_webhook_event
      event_data:
        event: "print_failed"
      id: print_failed

    - trigger: event
      event_type: bambuddy_webhook_event
      event_data:
        event: "print_stopped"
      id: print_stopped

    - trigger: homeassistant
      event: start
      id: startup

  conditions:
    - condition: state
      entity_id: input_boolean.bambuddy_integration_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.bambuddy_history_sync_enabled
      state: "on"

  actions:
    # Delay: let Bambuddy finalize data (webhook) or helpers restore (startup)
    - delay:
        seconds: >-
          {{ 30 if trigger.id == 'startup' else 5 }}

    - action: input_number.set_value
      data:
        entity_id: input_number.history_current_page
        value: 1

    - action: logbook.log
      data:
        name: Print History
        message: >-
          History refreshed
          {% if trigger.id == 'startup' %}(startup){% else %}after {{ trigger.id | default('event') }}{% endif %}

  mode: single
