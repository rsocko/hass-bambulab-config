# Multi-stage photo capture during normal print lifecycle.
# Stages: start (delayed), midprint (% threshold), near_complete (99%+), finish.
# Finish capture now starts from the native ha-bambulab completion event and
# reuses the finish path for a short burst to improve odds of a clear frame.
# Docs: docs/features/print_history/ui-media/photo-capture-design.md
- alias: "Print History - Capture Print Photos"
  id: bambuddy_capture_print_photos
  description: >
    Captures photos at multiple print stages using the configured capture
    camera list. Start, mid-print, and near-complete
    remain optional; finish capture always runs as a short burst.

  triggers:
    # Start: printer just began printing (delayed to show first layer)
    - trigger: state
      entity_id: sensor.ntk_ryansoffice_3dprinter_print_status
      to: "running"
      id: "start"

    # Mid-print: progress crosses configured percentage
    - trigger: numeric_state
      entity_id: sensor.ntk_ryansoffice_3dprinter_print_progress
      above: input_number.midprint_capture_percent
      id: "midprint"

    # Near-complete: progress ≥ 99%
    - trigger: numeric_state
      entity_id: sensor.ntk_ryansoffice_3dprinter_print_progress
      above: 98
      id: "near_complete"

    # Finish: native ha-bambulab completion event
    - device_id: 210dfdfa64085e8cf073e50eae757d90
      domain: bambu_lab
      type: event_print_finished
      trigger: device
      id: "finish"

  conditions:
    - condition: state
      entity_id: input_boolean.bambuddy_integration_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.bambuddy_history_sync_enabled
      state: "on"

  actions:
    - variables:
        stage: "{{ trigger.id }}"
        finish_burst_delays_seconds:
          - 0
          - 1
          - 1

    - choose:
        # Start: gate + delay for first layer visibility
        - conditions:
            - condition: trigger
              id: "start"
            - condition: state
              entity_id: input_boolean.capture_at_start
              state: "on"
          sequence:
            - delay:
                minutes: 3
            # Confirm still printing after delay
            - condition: state
              entity_id: sensor.ntk_ryansoffice_3dprinter_print_status
              state: "running"
            - action: script.capture_and_upload_snapshot
              data:
                stage: "start"

        # Mid-print: gate only
        - conditions:
            - condition: trigger
              id: "midprint"
            - condition: state
              entity_id: input_boolean.capture_at_midprint
              state: "on"
          sequence:
            - action: script.capture_and_upload_snapshot
              data:
                stage: "midprint"

        # Near-complete: gate only
        - conditions:
            - condition: trigger
              id: "near_complete"
            - condition: state
              entity_id: input_boolean.capture_near_complete
              state: "on"
          sequence:
            - action: script.capture_and_upload_snapshot
              data:
                stage: "near_complete"

        # Finish: always capture on native completion as a short burst.
        - conditions:
            - condition: trigger
              id: "finish"
          sequence:
            - repeat:
                for_each: "{{ finish_burst_delays_seconds }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ repeat.item | int(0) > 0 }}"
                    then:
                      - delay:
                          seconds: "{{ repeat.item | int(0) }}"
                  - action: script.capture_and_upload_snapshot
                    data:
                      stage: "finish"

  mode: single
