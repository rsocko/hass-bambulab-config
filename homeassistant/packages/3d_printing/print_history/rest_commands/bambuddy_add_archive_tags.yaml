# DEPRECATED: The Bambuddy API has no per-archive POST /tags endpoint.
# Tags are set via PATCH /{id} with a comma-separated tags string.
# Use rest_command.bambuddy_update_archive instead:
#   service: rest_command.bambuddy_update_archive
#   data: { "archive_id": "42", "tags": "spoolman:42,vendor:Bambu Lab" }
#
# This command is kept as a redirect wrapper for backward compatibility.
# It PATCHes the archive tags field (same as bambuddy_update_archive).
# Docs: docs/features/print_history/README.md
bambuddy_add_archive_tags:
  url: >-
    {{ states('input_text.bambuddy_api_base_url') }}/api/v1/archives/{{ archive_id }}
  method: PATCH
  headers:
    X-API-Key: !secret bambuddy_api_key
  payload: >-
    {"tags": {{ tags | default("") | tojson }}}
  content_type: "application/json"
