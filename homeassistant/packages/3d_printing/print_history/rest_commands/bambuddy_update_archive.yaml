# Update a Bambuddy archive — tags, notes, name, and optional native fields.
# Tags are a comma-separated string, not a JSON array.
# Usage: service: rest_command.bambuddy_update_archive
# Data: { "archive_id": "42", "print_name": "Benchy", "tags": "hueforge,f:34,s:123", "notes": "...", "cost": 1.23, "status": "failed", "failure_reason": "Layer shift", "project_id": "123" }
# Docs: docs/features/print_history/planning/archive-enrichment.md
bambuddy_update_archive:
  url: >-
    {{ states('input_text.bambuddy_api_base_url') }}/api/v1/archives/{{ archive_id }}
  method: PATCH
  headers:
    X-API-Key: !secret bambuddy_api_key
  payload: >-
    {% set ns = namespace(body={}) %}
    {% if tags is defined %}
      {% set ns.body = dict(ns.body, tags=(tags | default('', true))) %}
    {% endif %}
    {% if notes is defined %}
      {% set ns.body = dict(ns.body, notes=(notes | default('', true))) %}
    {% endif %}
    {% if print_name is defined %}
      {% set ns.body = dict(ns.body, print_name=print_name) %}
    {% endif %}
    {% if cost is defined %}
      {% set ns.body = dict(ns.body, cost=(cost | float(0))) %}
    {% endif %}
    {% if status is defined %}
      {% set ns.body = dict(ns.body, status=status) %}
    {% endif %}
    {% if failure_reason is defined %}
      {% if failure_reason == '__NULL__' %}
        {% set ns.body = dict(ns.body, failure_reason=none) %}
      {% else %}
        {% set ns.body = dict(ns.body, failure_reason=failure_reason) %}
      {% endif %}
    {% endif %}
    {% if project_id is defined %}
      {% if project_id == '__NULL__' %}
        {% set ns.body = dict(ns.body, project_id=none) %}
      {% else %}
        {% set ns.body = dict(ns.body, project_id=(project_id | int(0))) %}
      {% endif %}
    {% endif %}
    {% if is_favorite is defined %}
      {% set ns.body = dict(ns.body, is_favorite=(is_favorite | bool)) %}
    {% endif %}
    {{ ns.body | tojson }}
  content_type: "application/json"
