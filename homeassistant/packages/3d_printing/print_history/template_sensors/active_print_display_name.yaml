# Layer 2 projection for the currently active print title in the main dashboard.
# Resolves the bound archive directly from the Bambuddy detail service, then
# falls back to the live ha-bambulab task sensor.
- trigger:
    - trigger: state
      entity_id:
        - input_text.bambuddy_current_archive_id
        - sensor.ntk_ryansoffice_3dprinter_task_name
    - trigger: homeassistant
      event: start
  action:
    - variables:
        archive_id: "{{ states('input_text.bambuddy_current_archive_id') | string | trim }}"
    - if:
        - condition: template
          value_template: "{{ archive_id != '' }}"
      then:
        - action: bambuddy.get_print_history_archive_detail
          data:
            archive_id: "{{ archive_id }}"
          response_variable: result
  sensor:
    - name: Active Print Display Name
      unique_id: active_print_display_name
      icon: mdi:cube-outline
      state: >-
        {% set task_name = states('sensor.ntk_ryansoffice_3dprinter_task_name') | string | trim %}
        {% set task_valid = task_name not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
        {% set detail = result.get('archive', {}) if result is defined and result is mapping else {} %}
        {% if detail is string %}
          {% set detail = detail | from_json({}) %}
        {% endif %}
        {% set archive_name = detail.get('print_name', '') | string | trim if detail is mapping else '' %}
        {% if archive_name not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
          {{ archive_name }}
        {% elif task_valid %}
          {{ task_name }}
        {% else %}
          No Active Print
        {% endif %}
      attributes:
        archive_id: >-
          {% set detail = result.get('archive', {}) if result is defined and result is mapping else {} %}
          {% if detail is string %}
            {% set detail = detail | from_json({}) %}
          {% endif %}
          {{ detail.get('id', states('input_text.bambuddy_current_archive_id') | string | trim) | string | trim if detail is mapping else states('input_text.bambuddy_current_archive_id') | string | trim }}
        source: >-
          {% set task_name = states('sensor.ntk_ryansoffice_3dprinter_task_name') | string | trim %}
          {% set task_valid = task_name not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
          {% set detail = result.get('archive', {}) if result is defined and result is mapping else {} %}
          {% if detail is string %}
            {% set detail = detail | from_json({}) %}
          {% endif %}
          {% set archive_name = detail.get('print_name', '') | string | trim if detail is mapping else '' %}
          {% if archive_name not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
            bambuddy_archive_detail
          {% elif task_valid %}
            printer_task
          {% else %}
            none
          {% endif %}
        bambuddy_print_name: >-
          {% set detail = result.get('archive', {}) if result is defined and result is mapping else {} %}
          {% if detail is string %}
            {% set detail = detail | from_json({}) %}
          {% endif %}
          {{ detail.get('print_name', '') | string | trim if detail is mapping else '' }}
        archive_status: >-
          {% set detail = result.get('archive', {}) if result is defined and result is mapping else {} %}
          {% if detail is string %}
            {% set detail = detail | from_json({}) %}
          {% endif %}
          {{ detail.get('status', '') | string | trim if detail is mapping else '' }}
        fallback_task_name: >-
          {% set task_name = states('sensor.ntk_ryansoffice_3dprinter_task_name') | string | trim %}
          {{ '' if task_name in ['', 'unknown', 'unavailable', 'none', 'None'] else task_name }}
        plate_num: >-
          {{ state_attr('sensor.ntk_ryansoffice_3dprinter_task_name', 'plate_num') }}
        secondary_label: >-
          {% set detail = result.get('archive', {}) if result is defined and result is mapping else {} %}
          {% if detail is string %}
            {% set detail = detail | from_json({}) %}
          {% endif %}
          {% set archive_name = detail.get('print_name', '') | string | trim if detail is mapping else '' %}
          {% set task_name = states('sensor.ntk_ryansoffice_3dprinter_task_name') | string | trim %}
          {% set task_valid = task_name not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
          {% set plate_num = state_attr('sensor.ntk_ryansoffice_3dprinter_task_name', 'plate_num') %}
          {% if archive_name not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
            
          {% elif task_valid and plate_num is not none and plate_num | int(0) > 0 %}
            Plate {{ plate_num }}
          {% else %}
            
          {% endif %}