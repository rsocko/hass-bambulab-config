# Display string for pagination UI.
# Reads the current page helper and Layer 2 total_pages attribute.
# Docs: docs/features/print_history/filter-sort-design.md
- sensor:
    - name: Print History Page Info
      unique_id: print_history_page_info
      icon: mdi:page-layout-body
      state: >
        {% set current = states('input_number.history_current_page') | int(1) %}
        {% set total = state_attr('sensor.print_history_filtered', 'total_pages') | int(1) %}
        Page {{ [current, total] | min | max(1) }} of {{ total }}
