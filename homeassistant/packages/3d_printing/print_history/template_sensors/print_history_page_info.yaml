# Display string for pagination UI.
# Shows "Page X" when on the last known page, "Page X of Y+" when more exist.
# Docs: docs/features/print_history/README.md
- sensor:
    - name: Print History Page Info
      unique_id: print_history_page_info
      icon: mdi:page-layout-body
      state: >
        {% set current = states('input_number.history_current_page') | int(1) %}
        {% set total = states('sensor.print_history_total_pages') | int(1) %}
        {% if current < total %}
          Page {{ current }} of {{ total }}+
        {% else %}
          Page {{ current }}
        {% endif %}
