# Most recent print thumbnail/photo URL (full URL for dashboard rendering).
# Docs: docs/features/print_history/README.md
- sensor:
    - name: Bambuddy Last Print Image URL
      unique_id: bambuddy_last_print_image_url
      icon: mdi:image
      state: >
        {% set archives = state_attr('sensor.bambuddy_print_history', 'archives') %}
        {% if archives and archives | length > 0 %}
          {% set photo = archives[0].photo_url | default('') %}
          {% if photo %}
            {{ states('input_text.bambuddy_api_base_url') }}{{ photo }}
          {% else %}
            none
          {% endif %}
        {% else %}
          none
        {% endif %}
