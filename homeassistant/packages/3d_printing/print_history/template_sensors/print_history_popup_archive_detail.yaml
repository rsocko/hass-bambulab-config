# Popup-scoped archive detail cache for gallery/photo fallback.
# Fetches the selected archive detail when the popup archive id changes so
# popup-only UI can access fields omitted by the list endpoint, such as photos.
# Also refresh when the Bambuddy browser store finishes syncing so the popup
# does not keep stale archive detail after re-enrich or other repair actions.
- trigger:
    - trigger: state
      entity_id: input_text.print_history_popup_archive_id
    - trigger: state
      entity_id: input_boolean.print_history_popup_is_favorite
    - trigger: state
      entity_id: sensor.bambuddy_print_history_browser_status
      attribute: browser_revision
    - trigger: homeassistant
      event: start
  action:
    - variables:
        archive_id: "{{ states('input_text.print_history_popup_archive_id') | string | trim }}"
    - if:
        - condition: template
          value_template: "{{ archive_id != '' }}"
      then:
        - action: bambuddy.get_print_history_archive_detail
          data:
            archive_id: "{{ archive_id }}"
          response_variable: result
  sensor:
    - name: Print History Popup Archive Detail
      unique_id: print_history_popup_archive_detail
      icon: mdi:image-multiple
      state: >-
        {{ states('input_text.print_history_popup_archive_id') | string | trim }}
      attributes:
        archive_json: >-
          {% set archive_id = states('input_text.print_history_popup_archive_id') | string | trim %}
          {% if archive_id == '' %}
            {}
          {% else %}
            {% set content = result.get('archive', {}) if result is defined and result is mapping else {} %}
            {% if content is string %}
              {% set detail = content | from_json({}) %}
            {% elif content is mapping %}
              {% set detail = content %}
            {% else %}
              {% set detail = {} %}
            {% endif %}
            {{ detail | tojson }}
          {% endif %}
        storage_metrics_json: >-
          {% set archive_id = states('input_text.print_history_popup_archive_id') | string | trim %}
          {% if archive_id == '' %}
            {}
          {% else %}
            {% set content = result.get('storage_metrics', {}) if result is defined and result is mapping else {} %}
            {% if content is string %}
              {% set metrics = content | from_json({}) %}
            {% elif content is mapping %}
              {% set metrics = content %}
            {% else %}
              {% set metrics = {} %}
            {% endif %}
            {{ metrics | tojson }}
          {% endif %}
        event_timeline_json: >-
          {% set archive_id = states('input_text.print_history_popup_archive_id') | string | trim %}
          {% if archive_id == '' %}
            []
          {% else %}
            {% set content = result.get('event_timeline', []) if result is defined and result is mapping else [] %}
            {% if content is string %}
              {% set timeline = content | from_json([]) %}
            {% elif content is iterable and content is not mapping %}
              {% set timeline = content | list %}
            {% else %}
              {% set timeline = [] %}
            {% endif %}
            {{ timeline | tojson }}
          {% endif %}
        enrichment_provenance_json: >-
          {% set archive_id = states('input_text.print_history_popup_archive_id') | string | trim %}
          {% if archive_id == '' %}
            []
          {% else %}
            {% set content = result.get('enrichment_provenance', []) if result is defined and result is mapping else [] %}
            {% if content is string %}
              {% set provenance = content | from_json([]) %}
            {% elif content is iterable and content is not mapping %}
              {% set provenance = content | list %}
            {% else %}
              {% set provenance = [] %}
            {% endif %}
            {{ provenance | tojson }}
          {% endif %}
        photos_json: >-
          {% set archive_id = states('input_text.print_history_popup_archive_id') | string | trim %}
          {% if archive_id == '' %}
            []
          {% else %}
            {% set content = result.get('archive', {}) if result is defined and result is mapping else {} %}
            {% if content is string %}
              {% set detail = content | from_json({}) %}
            {% elif content is mapping %}
              {% set detail = content %}
            {% else %}
              {% set detail = {} %}
            {% endif %}
            {% set raw_photos = detail.get('photos', []) if detail is mapping and detail.get('photos') is iterable and detail.get('photos') is not string else [] %}
            {% set ns = namespace(values=[]) %}
            {% for photo in raw_photos %}
              {% set filename = photo | string | trim %}
              {% if filename != '' %}
                {% set ns.values = ns.values + [filename] %}
              {% endif %}
            {% endfor %}
            {{ ns.values | tojson }}
          {% endif %}
        photo_count: >-
          {% set raw = state_attr('sensor.print_history_popup_archive_detail', 'photos_json') | default('[]', true) %}
          {% if raw is string %}
            {% set photos = raw | from_json([]) %}
          {% elif raw is iterable %}
            {% set photos = raw | list %}
          {% else %}
            {% set photos = [] %}
          {% endif %}
          {{ photos | count }}
        source_status: >-
          {{ result.get('status', 'idle') if result is defined and result is mapping else 'idle' }}
        last_fetch: "{{ now().isoformat() }}"