# Diagnostics for the active print history browser chain.
# Variant 3 now keeps the large page/activity payloads in frontend websocket
# responses instead of Home Assistant state. This sensor confirms the light
# summary contract is still healthy and documents that the heavy payload path
# is intentionally retired.
- trigger:
    - trigger: state
      entity_id:
        - sensor.bambuddy_print_history_browser_filtered
        - sensor.bambuddy_print_history_browser_page_info
        - sensor.bambuddy_print_history_browser_status
        - input_number.print_history_max_archives
  sensor:
    - name: Print History Payload Diagnostics
      unique_id: print_history_payload_diagnostics
      icon: mdi:database-alert-outline
      state: >-
        {% set filtered = states('sensor.bambuddy_print_history_browser_filtered') | int(0) %}
        {% set page_state = states('sensor.bambuddy_print_history_browser_page_info') | string | trim %}
        {% set status = states('sensor.bambuddy_print_history_browser_status') | string | lower %}
        {% set frontend_only = true %}
        {% if not frontend_only %}
          fail
        {% elif status in ['error', 'failed', 'unavailable', 'unknown'] %}
          fail
        {% elif filtered > 0 and page_state in ['', 'unknown', 'unavailable'] %}
          warn
        {% else %}
          ok
        {% endif %}
      attributes:
        archive_count: >-
          {{ states('sensor.bambuddy_print_history_browser_filtered') | int(0) }}
        payload_chars: >-
          0
        page_payload_chars: >-
          0
        average_chars_per_archive: >-
          0
        payload_utilization_percent: >-
          0
        current_max_archives_setting: >-
          {{ states('input_number.print_history_max_archives') | int(0) }}
        soft_payload_budget_chars: 160000
        hard_payload_budget_chars: 190000
        estimated_comfortable_max_archives: >-
          {{ states('input_number.print_history_max_archives') | int(0) }}
        estimated_upper_bound_archives: >-
          {{ states('input_number.print_history_max_archives') | int(0) }}
        layer_1_status: >-
          frontend_only
        layer_2_status: >-
          {{ 'ok' if states('sensor.bambuddy_print_history_browser_filtered') not in ['unknown', 'unavailable'] else 'warn' }}
        layer_3_status: >-
          frontend_only
        frontend_query_transport: websocket
        status_message: >-
          {% set filtered = states('sensor.bambuddy_print_history_browser_filtered') | int(0) %}
          {% set page_state = states('sensor.bambuddy_print_history_browser_page_info') | string | trim %}
          {% set status = states('sensor.bambuddy_print_history_browser_status') | string | lower %}
          {% if status in ['error', 'failed', 'unavailable', 'unknown'] %}
            The lightweight Bambuddy browser summary sensors are unhealthy. Check the integration status before testing the frontend browser card.
          {% elif filtered > 0 and page_state in ['', 'unknown', 'unavailable'] %}
            The frontend-only browser path is active, but the page summary helper is unavailable. Refresh the Bambuddy browser manager and retry the dashboard.
          {% else %}
            Large print-history page and activity payloads are no longer materialized into Home Assistant state. The dashboard now queries Bambuddy directly over websocket and only keeps lightweight summary entities in HA state.
          {% endif %}
        recommended_action: >-
          {% set status = states('sensor.print_history_payload_diagnostics') | lower %}
          {% if status == 'fail' %}
            Resolve the Bambuddy browser status error, then refresh the archive cache and reload the dashboard.
          {% elif status == 'warn' %}
            Refresh the Bambuddy browser manager so the lightweight page summary entities recover before testing frontend queries again.
          {% else %}
            Re-run this self-test after dashboard changes to confirm the browser still avoids Home Assistant state materialization.
          {% endif %}