              {%- set ns.total_weight = ns.total_weight + (a.get('filament_used_grams', 0) | float(0)) -%}
                {%- set ns.total_objects = ns.total_objects + (a.get('object_count', 1) | int(1)) -%}
              {%- set ns.total_cost = ns.total_cost + (a.get('cost', 0) | float(0)) -%}
              {%- set duration_seconds = ((a.get('actual_time_seconds') if a.get('actual_time_seconds') is not none else a.get('print_time_seconds', 0)) | float(0)) -%}
              {%- set ns.total_duration_seconds = ns.total_duration_seconds + duration_seconds -%}
              {%- set slot_source = a.get('filament_slots') if a.get('filament_slots') is iterable else ((a.get('extra_data') or {}).get('filament_slots') if ((a.get('extra_data') or {}).get('filament_slots') is iterable) else []) -%}
              {%- set slot_keys = namespace(values=[]) -%}
              {%- for slot in slot_source -%}
                {%- set used = slot.get('used_g', 0) | float(0) -%}
                {%- set color = slot.get('color', '') | string | lower | trim -%}
                {%- set slot_type = slot.get('type', '') | string | lower | trim -%}
                {%- set key = (color if color else 'no-color') ~ '|' ~ (slot_type if slot_type else 'no-type') -%}
                {%- if used > 0 and key not in slot_keys.values -%}
                  {%- set slot_keys.values = slot_keys.values + [key] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if slot_keys.values | length > 0 -%}
                {%- set filament_count = slot_keys.values | length -%}
              {%- else -%}
                {%- set fallback_colors = namespace(values=[]) -%}
                {%- for color in (a.get('filament_color', '') | string | lower).split(',') -%}
                  {%- set value = color | trim -%}
                  {%- if value and value not in fallback_colors.values -%}
                    {%- set fallback_colors.values = fallback_colors.values + [value] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set filament_count = fallback_colors.values | length -%}
              {%- endif -%}
              {%- set ns.total_filaments = ns.total_filaments + filament_count -%}
            {%- endif -%}
          {%- endfor -%}
          {% if mode == 'filament weight' %}
            {{ '{:,.1f}g'.format(ns.total_weight) }}
          {% elif mode == 'number of printed objects' %}
            {{ '{:,}'.format(ns.total_objects) }} objects
          {% elif mode == 'cost of prints' %}
            {{ '{:,.2f}'.format(ns.total_cost) }}
          {% elif mode == 'filaments used' %}
            {{ '{:,}'.format(ns.total_filaments) }} filaments used
          {% elif mode == 'total time printing' %}
            {{ '{:,.1f}h'.format(ns.total_duration_seconds / 3600) }}
          {% else %}
            {{ '{:,}'.format(ns.total_prints) }} prints
          {% endif %}
        total_pages: >-
          {% set total = states('sensor.print_history_filtered') | int(0) %}
          {% set page_size = states('input_number.print_history_page_size') | int(10) %}
          {% if total <= 0 %}
            1
          {% else %}
            {{ ((total - 1) // page_size) + 1 }}
          {% endif %}
        page_json: >-
          {% set raw = state_attr('sensor.print_history_archives', 'archives_json') | default('[]', true) %}
          {% if raw is string %}
            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {%- set filter_status = states('input_select.print_history_filter_status') -%}
          {%- set filter_enrichment_status = states('input_select.print_history_filter_enrichment_status') -%}
          {%- set filter_material = states('input_select.print_history_filter_material') -%}
          {%- set filter_printer = states('input_select.print_history_filter_printer') -%}
          {%- set filter_date = states('input_select.print_history_filter_date_range') -%}
          {%- set favorites_only = is_state('input_boolean.print_history_filter_favorites_only', 'on') -%}
          {%- set filter_designer = states('input_select.print_history_filter_designer') -%}
          {%- set filter_project = states('input_select.print_history_filter_project') -%}
          {%- set filter_layer_height = states('input_select.print_history_filter_layer_height') -%}
          {%- set filter_tag = states('input_select.print_history_filter_tag') | lower -%}
          {%- set sort_by = states('input_select.print_history_sort') -%}
          {%- set search_text = states('input_text.print_history_search') | lower | trim -%}
          {%- set selected_day = states('input_text.print_history_activity_selected_date') | trim -%}
          {%- set selected_colors_raw = states('input_text.print_history_filter_colors') | lower | trim -%}
          {%- set selected_colors = selected_colors_raw.split(',') | map('trim') | reject('equalto', '') | list if selected_colors_raw not in ['', 'unknown', 'unavailable'] else [] -%}
          {%- set system_tag_prefixes = ['spool:', 'filament:', 'spoolman:', 'vendor:', 'material:', 'cost:', 'status:', 'ha enrichment:', 'ha_enrichment:', 'ha_enriched:'] -%}
          {%- set system_tag_values = ['ha enrichment', 'ha_enrichment', 'ha_enriched:true'] -%}
          {%- set now_ts = as_timestamp(now()) | float(0) -%}
          {%- set page_size = states('input_number.print_history_page_size') | int(10) -%}
          {%- set current_page = states('input_number.history_current_page') | int(1) -%}
          {%- set ns = namespace(matches=[]) -%}
          {%- for a in archives -%}
            {%- set raw_status = a.get('status', '') | string | lower -%}
            {%- if raw_status in ['completed', 'success'] -%}
              {%- set status = 'completed' -%}
            {%- elif raw_status == 'failed' -%}
              {%- set status = 'failed' -%}
            {%- elif raw_status in ['cancelled', 'aborted', 'stopped'] -%}
              {%- set status = 'cancelled' -%}
            {%- elif raw_status == 'printing' -%}
              {%- set status = 'printing' -%}
            {%- else -%}
              {%- set status = raw_status -%}
            {%- endif -%}
            {%- set enrichment_status = a.get('enrichment_status', '') | string | lower -%}
            {%- set enrichment_status = enrichment_status if enrichment_status in ['complete', 'partial', 'unavailable'] else 'not defined' -%}
            {%- set material = a.get('filament_type', '') | string -%}
            {%- set archive_colors = (a.get('filament_color', '') | string | lower).split(',') | map('trim') | reject('equalto', '') | list -%}
            {%- set printer = a.get('printer_id', '') | string -%}
            {%- set name = a.get('print_name', '') | string | lower -%}
            {%- set designer = a.get('designer', '') | string -%}
            {%- set project_name = (a.get('project_name') if a.get('project_name') is not none else '') | string | trim -%}
            {%- set layer_height = a.get('layer_height', '') | string -%}
            {%- set is_favorite = a.get('is_favorite', false) -%}
            {%- set tags = a.get('tags', '') | string | lower -%}
            {%- set tag_values = tags.split(',') | map('trim') | reject('equalto', '') | list -%}
            {%- set user_tag_values = namespace(values=[]) -%}
            {%- for tag in tag_values -%}
              {%- set system_tag = namespace(value=(tag in system_tag_values)) -%}
              {%- if not system_tag.value -%}
                {%- for prefix in system_tag_prefixes -%}
                  {%- if tag[0:(prefix | length)] == prefix -%}
                    {%- set system_tag.value = true -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {%- if not system_tag.value -%}
                {%- set user_tag_values.values = user_tag_values.values + [tag] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set started_raw = (a.get('started_at') or a.get('created_at') or '') | string -%}
            {%- set started_ts = as_timestamp(started_raw, 0) | float(0) if started_raw else 0 -%}
            {%- set started_day = started_ts | timestamp_custom('%Y-%m-%d', true) if started_ts > 0 else '' -%}
            {%- set age_days = ((now_ts - started_ts) / 86400) | float(0) if started_ts > 0 else 99999 -%}
            {%- set matches_status = filter_status == 'All' or status == filter_status | lower -%}
            {%- set matches_enrichment_status = filter_enrichment_status == 'All' or enrichment_status == filter_enrichment_status | lower -%}
            {%- set matches_material = filter_material == 'All' or material | lower == filter_material | lower -%}
            {%- set color_match = namespace(value=(selected_colors | length == 0)) -%}
            {%- if not color_match.value -%}
              {%- for selected in selected_colors -%}
                {%- if selected in archive_colors -%}
                  {%- set color_match.value = true -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set matches_color = color_match.value -%}
            {%- set matches_printer = filter_printer == 'All' or printer == filter_printer -%}
            {%- set matches_favorite = (not favorites_only) or is_favorite -%}
            {%- set matches_designer = filter_designer == 'All' or designer | lower == filter_designer | lower -%}
            {%- set matches_project = filter_project == 'All' or (filter_project == 'None' and project_name == '') or (filter_project not in ['All', 'None'] and project_name | lower == filter_project | lower) -%}
            {%- set matches_layer_height = filter_layer_height == 'All' or layer_height == filter_layer_height -%}
            {%- set matches_tag = filter_tag in ['', 'all'] or (filter_tag == 'none' and user_tag_values.values | count == 0) or filter_tag in user_tag_values.values -%}
            {%- set search_blob = (name ~ ' ' ~ (designer | lower) ~ ' ' ~ tags) -%}
            {%- set matches_search = search_text == '' or search_text in search_blob -%}
            {%- set matches_selected_day = selected_day in ['', 'unknown', 'unavailable'] or started_day == selected_day -%}
            {%- if filter_date == 'Today' -%}
              {%- set matches_date = age_days < 1 -%}
            {%- elif filter_date == 'This Week' -%}
              {%- set matches_date = age_days < 7 -%}
            {%- elif filter_date == 'This Month' -%}
              {%- set matches_date = age_days < 30 -%}
            {%- elif filter_date == 'Last 30 Days' -%}
              {%- set matches_date = age_days < 30 -%}
            {%- elif filter_date == 'Last 90 Days' -%}
              {%- set matches_date = age_days < 90 -%}
            {%- else -%}
              {%- set matches_date = true -%}
            {%- endif -%}
            {%- if matches_status and matches_enrichment_status and matches_material and matches_color and matches_printer and matches_favorite and matches_designer and matches_project and matches_layer_height and matches_tag and matches_search and matches_selected_day and matches_date -%}
              {%- set ns.matches = ns.matches + [a] -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if sort_by == 'Date (Oldest)' -%}
            {%- set sorted = ns.matches | sort(attribute='sort_started_at') -%}
          {%- elif sort_by == 'Duration (Longest)' -%}
            {%- set sorted = ns.matches | sort(attribute='actual_time_seconds', reverse=true) -%}
          {%- elif sort_by == 'Duration (Shortest)' -%}
            {%- set sorted = ns.matches | sort(attribute='actual_time_seconds') -%}
          {%- elif sort_by == 'Cost (Highest)' -%}
            {%- set sorted = ns.matches | sort(attribute='cost', reverse=true) -%}
          {%- elif sort_by == 'Cost (Lowest)' -%}
            {%- set sorted = ns.matches | sort(attribute='cost') -%}
          {%- elif sort_by == 'Filament (Most)' -%}
            {%- set sorted = ns.matches | sort(attribute='filament_used_grams', reverse=true) -%}
          {%- elif sort_by == 'Filament (Least)' -%}
            {%- set sorted = ns.matches | sort(attribute='filament_used_grams') -%}
          {%- elif sort_by == 'Name (A-Z)' -%}
            {%- set sorted = ns.matches | sort(attribute='print_name') -%}
          {%- elif sort_by == 'Name (Z-A)' -%}
            {%- set sorted = ns.matches | sort(attribute='print_name', reverse=true) -%}
          {%- else -%}
            {%- set sorted = ns.matches | sort(attribute='sort_started_at', reverse=true) -%}
          {%- endif -%}
          {%- set total_pages = (((sorted | length) - 1) // page_size) + 1 if (sorted | length) > 0 else 1 -%}
          {%- set clamped_page = [1, [current_page, total_pages] | min] | max -%}
          {%- set start = (clamped_page - 1) * page_size -%}
          {%- set end = start + page_size -%}
          {{ sorted[start:end] | list | tojson }}
        page_info: >-
          {% set total_pages = state_attr('sensor.print_history_filtered', 'total_pages') | int(1) %}
          {% set current_page = states('input_number.history_current_page') | int(1) %}
          Page {{ [1, [current_page, total_pages] | min] | max }} of {{ total_pages }}
        selected_colors_json: >-
          {% set raw = states('input_text.print_history_filter_colors') | lower | trim %}
          {% if raw in ['', 'unknown', 'unavailable'] %}
            []
          {% else %}
            {{ raw.split(',') | map('trim') | reject('equalto', '') | list | tojson }}
          {% endif %}
        available_colors_json: >-
          {% set raw = state_attr('sensor.print_history_archives', 'archives_json') | default('[]', true) %}
          {% if raw is string %}
            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {% set ns = namespace(colors=[]) %}
          {% for a in archives %}
            {% for color in (a.get('filament_color', '') | string | lower).split(',') %}
              {% set value = color | trim %}
              {% if value and value not in ns.colors %}
                {% set ns.colors = ns.colors + [value] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.colors | sort | tojson }}
        available_color_tooltips_json: >-
          {% set raw = state_attr('sensor.print_history_archives', 'archives_json') | default('[]', true) %}
          {% if raw is string %}
            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {% set enrichment_marker = '[HA_ENRICHMENT_V1]' %}
          {% set ns = namespace(entries=[]) %}
          {% for a in archives %}
            {% set notes_raw = a.get('notes', '') | string %}
            {% set marker_index = notes_raw.find(enrichment_marker) %}
            {% if marker_index >= 0 %}
              {% set payload_raw = notes_raw[marker_index + (enrichment_marker | length):] | trim %}
              {% set payload = payload_raw | from_json({}) if payload_raw | length > 0 else {} %}
              {% set rows = payload.get('Filaments', []) if payload is mapping else [] %}
            {% else %}
              {% set rows = [] %}
            {% endif %}
            {% for item in rows %}
              {% set name = item.get('name', '') | string | trim %}
              {% set color_raw = item.get('h', '') | string | trim | replace('"', '') %}
              {% if color_raw.startswith('#') %}
                {% set color_raw = color_raw[1:] %}
              {% endif %}
              {% if color_raw | length == 8 %}
                {% set color_raw = color_raw[0:6] %}
              {% endif %}
              {% if name and color_raw | regex_match('^[0-9a-fA-F]{6}$') %}
                {% set color_key = '#' ~ color_raw.lower() %}
                {% set existing_index = namespace(value=-1) %}
                {% for entry in ns.entries %}
                  {% if entry.color == color_key %}
                    {% set existing_index.value = loop.index0 %}
                  {% endif %}
                {% endfor %}
                {% if existing_index.value >= 0 %}
                  {% set current = ns.entries[existing_index.value] %}
                  {% if name not in current.names %}
                    {% set updated = dict(color=current.color, names=current.names + [name]) %}
                    {% set ns.entries = ns.entries[:existing_index.value] + [updated] + ns.entries[existing_index.value + 1:] %}
                  {% endif %}
                {% else %}
                  {% set ns.entries = ns.entries + [dict(color=color_key, names=[name])] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {% set ns_tooltips = namespace(values=[]) %}
          {% for entry in ns.entries | sort(attribute='color') %}
            {% set tooltip = (entry.names | join(' or ')) ~ ' (' ~ (entry.color | upper) ~ ')' %}
            {% set ns_tooltips.values = ns_tooltips.values + [dict(color=entry.color, tooltip=tooltip)] %}
          {% endfor %}
          {{ ns_tooltips.values | tojson }}
