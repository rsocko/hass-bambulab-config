            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {%- set mode = states('input_select.print_history_activity_metric') | lower | trim -%}
