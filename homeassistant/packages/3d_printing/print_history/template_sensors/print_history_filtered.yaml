# Layer 2 browser state: filters, sorts, and pages the projected archive cache.
# Docs: docs/features/print_history/filter-sort-design.md
- sensor:
    - name: Print History Filtered
      unique_id: print_history_filtered
      icon: mdi:filter-variant
      state: >-
        {% set raw = state_attr('sensor.print_history_archives', 'archives_json') | default('[]', true) %}
        {% if raw is string %}
          {% set archives = raw | from_json %}
        {% elif raw is iterable %}
          {% set archives = raw | list %}
        {% else %}
          {% set archives = [] %}
        {% endif %}
        {%- set filter_status = states('input_select.print_history_filter_status') -%}
        {%- set filter_material = states('input_select.print_history_filter_material') -%}
        {%- set filter_printer = states('input_select.print_history_filter_printer') -%}
        {%- set filter_date = states('input_select.print_history_filter_date_range') -%}
        {%- set favorites_only = is_state('input_boolean.print_history_filter_favorites_only', 'on') -%}
        {%- set filter_designer = states('input_select.print_history_filter_designer') -%}
        {%- set filter_layer_height = states('input_select.print_history_filter_layer_height') -%}
        {%- set search_text = states('input_text.print_history_search') | lower | trim -%}
        {%- set selected_day = states('input_text.print_history_activity_selected_date') | trim -%}
        {%- set selected_colors_raw = states('input_text.print_history_filter_colors') | lower | trim -%}
        {%- set selected_colors = selected_colors_raw.split(',') | map('trim') | reject('equalto', '') | list if selected_colors_raw not in ['', 'unknown', 'unavailable'] else [] -%}
        {%- set now_ts = as_timestamp(now()) | float(0) -%}
        {%- set ns = namespace(matches=[]) -%}
        {%- for a in archives -%}
          {%- set raw_status = a.get('status', '') | string | lower -%}
          {%- if raw_status in ['completed', 'success'] -%}
            {%- set status = 'completed' -%}
          {%- elif raw_status in ['failed', 'cancelled', 'aborted'] -%}
            {%- set status = 'failed' -%}
          {%- elif raw_status == 'stopped' -%}
            {%- set status = 'stopped' -%}
          {%- elif raw_status == 'printing' -%}
            {%- set status = 'printing' -%}
          {%- else -%}
            {%- set status = raw_status -%}
          {%- endif -%}
          {%- set material = a.get('filament_type', '') | string -%}
          {%- set archive_colors = (a.get('filament_color', '') | string | lower).split(',') | map('trim') | reject('equalto', '') | list -%}
          {%- set printer = a.get('printer_id', '') | string -%}
          {%- set name = a.get('print_name', '') | string | lower -%}
          {%- set designer = a.get('designer', '') | string -%}
          {%- set layer_height = a.get('layer_height', '') | string -%}
          {%- set is_favorite = a.get('is_favorite', false) -%}
          {%- set tags = a.get('tags', '') | string | lower -%}
          {%- set started_raw = (a.get('started_at') or a.get('created_at') or '') | string -%}
          {%- set started_ts = as_timestamp(started_raw, 0) | float(0) if started_raw else 0 -%}
          {%- set started_day = started_ts | timestamp_custom('%Y-%m-%d', true) if started_ts > 0 else '' -%}
          {%- set age_days = ((now_ts - started_ts) / 86400) | float(0) if started_ts > 0 else 99999 -%}
          {%- set matches_status = filter_status == 'All' or status == filter_status | lower -%}
          {%- set matches_material = filter_material == 'All' or material | lower == filter_material | lower -%}
          {%- set color_match = namespace(value=(selected_colors | length == 0)) -%}
          {%- if not color_match.value -%}
            {%- for selected in selected_colors -%}
              {%- if selected in archive_colors -%}
                {%- set color_match.value = true -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set matches_color = color_match.value -%}
          {%- set matches_printer = filter_printer == 'All' or printer == filter_printer -%}
          {%- set matches_favorite = (not favorites_only) or is_favorite -%}
          {%- set matches_designer = filter_designer == 'All' or designer | lower == filter_designer | lower -%}
          {%- set matches_layer_height = filter_layer_height == 'All' or layer_height == filter_layer_height -%}
          {%- set search_blob = (name ~ ' ' ~ (designer | lower) ~ ' ' ~ tags) -%}
          {%- set matches_search = search_text == '' or search_text in search_blob -%}
          {%- set matches_selected_day = selected_day in ['', 'unknown', 'unavailable'] or started_day == selected_day -%}
          {%- if filter_date == 'Today' -%}
            {%- set matches_date = age_days < 1 -%}
          {%- elif filter_date == 'This Week' -%}
            {%- set matches_date = age_days < 7 -%}
          {%- elif filter_date == 'This Month' -%}
            {%- set matches_date = age_days < 30 -%}
          {%- elif filter_date == 'Last 30 Days' -%}
            {%- set matches_date = age_days < 30 -%}
          {%- elif filter_date == 'Last 90 Days' -%}
            {%- set matches_date = age_days < 90 -%}
          {%- else -%}
            {%- set matches_date = true -%}
          {%- endif -%}
          {%- if matches_status and matches_material and matches_color and matches_printer and matches_favorite and matches_designer and matches_layer_height and matches_search and matches_selected_day and matches_date -%}
            {%- set ns.matches = ns.matches + [a] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.matches | length }}
      attributes:
        filtered_count: >-
          {{ states('sensor.print_history_filtered') | int(0) }}
        has_active_filters: >-
          {% set search = states('input_text.print_history_search') | trim %}
          {% set color_values = states('input_text.print_history_filter_colors') | trim %}
          {% set selected_day = states('input_text.print_history_activity_selected_date') | trim %}
          {{
            states('input_select.print_history_filter_status') != 'All'
            or states('input_select.print_history_filter_material') != 'All'
            or states('input_select.print_history_filter_printer') != 'All'
            or states('input_select.print_history_filter_date_range') != 'All Time'
            or is_state('input_boolean.print_history_filter_favorites_only', 'on')
            or states('input_select.print_history_filter_designer') != 'All'
            or states('input_select.print_history_filter_layer_height') != 'All'
            or search not in ['', 'unknown', 'unavailable']
            or color_values not in ['', 'unknown', 'unavailable']
            or selected_day not in ['', 'unknown', 'unavailable']
          }}
        activity_active_days_label: >-
          {% set raw = state_attr('sensor.print_history_archives', 'archives_json') | default('[]', true) %}
          {% if raw is string %}
            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {%- set filter_status = states('input_select.print_history_filter_status') -%}
          {%- set filter_material = states('input_select.print_history_filter_material') -%}
          {%- set filter_printer = states('input_select.print_history_filter_printer') -%}
          {%- set filter_date = states('input_select.print_history_filter_date_range') -%}
