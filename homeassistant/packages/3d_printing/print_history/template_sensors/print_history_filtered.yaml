            {%- set color_match = namespace(value=(selected_colors | length == 0)) -%}
            {%- if not color_match.value -%}
              {%- for selected in selected_colors -%}
                {%- if selected in archive_colors -%}
                  {%- set color_match.value = true -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set matches_color = color_match.value -%}
            {%- set matches_printer = filter_printer == 'All' or printer == filter_printer -%}
            {%- set matches_favorite = (not favorites_only) or is_favorite -%}
            {%- set matches_designer = filter_designer == 'All' or designer | lower == filter_designer | lower -%}
            {%- set matches_layer_height = filter_layer_height == 'All' or layer_height == filter_layer_height -%}
            {%- set search_blob = (name ~ ' ' ~ (designer | lower) ~ ' ' ~ tags) -%}
            {%- set matches_search = search_text == '' or search_text in search_blob -%}
            {%- set matches_selected_day = selected_day in ['', 'unknown', 'unavailable'] or started_day == selected_day -%}
            {%- if filter_date == 'Today' -%}
              {%- set matches_date = age_days < 1 -%}
            {%- elif filter_date == 'This Week' -%}
              {%- set matches_date = age_days < 7 -%}
            {%- elif filter_date == 'This Month' -%}
              {%- set matches_date = age_days < 30 -%}
            {%- elif filter_date == 'Last 30 Days' -%}
              {%- set matches_date = age_days < 30 -%}
            {%- elif filter_date == 'Last 90 Days' -%}
              {%- set matches_date = age_days < 90 -%}
            {%- else -%}
              {%- set matches_date = true -%}
            {%- endif -%}
            {%- if matches_status and matches_material and matches_color and matches_printer and matches_favorite and matches_designer and matches_layer_height and matches_search and matches_selected_day and matches_date -%}
              {%- set ns.total_prints = ns.total_prints + 1 -%}
              {%- set ns.total_weight = ns.total_weight + (a.get('filament_used_grams', 0) | float(0)) -%}
                {%- set ns.total_objects = ns.total_objects + (a.get('object_count', 1) | int(1)) -%}
              {%- set ns.total_cost = ns.total_cost + (a.get('cost', 0) | float(0)) -%}
              {%- set duration_seconds = ((a.get('actual_time_seconds') if a.get('actual_time_seconds') is not none else a.get('print_time_seconds', 0)) | float(0)) -%}
              {%- set ns.total_duration_seconds = ns.total_duration_seconds + duration_seconds -%}
              {%- set slot_source = a.get('filament_slots') if a.get('filament_slots') is iterable else ((a.get('extra_data') or {}).get('filament_slots') if ((a.get('extra_data') or {}).get('filament_slots') is iterable) else []) -%}
              {%- set slot_keys = namespace(values=[]) -%}
              {%- for slot in slot_source -%}
                {%- set used = slot.get('used_g', 0) | float(0) -%}
                {%- set color = slot.get('color', '') | string | lower | trim -%}
                {%- set slot_type = slot.get('type', '') | string | lower | trim -%}
                {%- set key = (color if color else 'no-color') ~ '|' ~ (slot_type if slot_type else 'no-type') -%}
                {%- if used > 0 and key not in slot_keys.values -%}
                  {%- set slot_keys.values = slot_keys.values + [key] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if slot_keys.values | length > 0 -%}
                {%- set filament_count = slot_keys.values | length -%}
              {%- else -%}
                {%- set fallback_colors = namespace(values=[]) -%}
                {%- for color in (a.get('filament_color', '') | string | lower).split(',') -%}
                  {%- set value = color | trim -%}
                  {%- if value and value not in fallback_colors.values -%}
                    {%- set fallback_colors.values = fallback_colors.values + [value] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set filament_count = fallback_colors.values | length -%}
              {%- endif -%}
              {%- set ns.total_filaments = ns.total_filaments + filament_count -%}
            {%- endif -%}
          {%- endfor -%}
          {% if mode == 'filament weight' %}
            {{ '%.1fg' | format(ns.total_weight) }}
          {% elif mode == 'number of printed objects' %}
            {{ ns.total_objects }} objects
          {% elif mode == 'cost of prints' %}
            {{ '$%.2f' | format(ns.total_cost) }}
          {% elif mode == 'filament uses' %}
            {{ ns.total_filaments }} filament uses
          {% elif mode == 'total time printing' %}
            {{ '%.1fh' | format(ns.total_duration_seconds / 3600) }}
          {% else %}
            {{ ns.total_prints }} prints
          {% endif %}
