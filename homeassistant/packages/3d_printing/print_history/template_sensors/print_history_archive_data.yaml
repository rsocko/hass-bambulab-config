# Reactive Layer 2 query cache for dashboard rendering.
# Materializes both the current page slice and the full filtered activity set
# from the Bambuddy query service so UI cards can stay service-backed while the
# integration summary entities remain lean.
#
# Docs: docs/features/print_history/README.md
- trigger:
    - trigger: state
      entity_id:
        - sensor.bambuddy_print_history_browser_filtered
        - sensor.bambuddy_print_history_browser_status
        - input_select.print_history_filter_status
        - input_select.print_history_filter_enrichment_status
        - input_select.print_history_filter_material
        - input_select.print_history_filter_printer
        - input_select.print_history_filter_date_range
        - input_boolean.print_history_filter_favorites_only
        - input_select.print_history_filter_designer
        - input_select.print_history_filter_project
        - input_select.print_history_filter_layer_height
        - input_select.print_history_filter_tag
        - input_select.print_history_sort
        - input_text.print_history_search
        - input_text.print_history_filter_colors
        - input_text.print_history_activity_selected_date
        - input_number.print_history_page_size
        - input_number.history_current_page
    - trigger: homeassistant
      event: start
  action:
    - variables:
        status: >-
          {% set value = states('input_select.print_history_filter_status') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable', 'none', 'None'] else value | lower }}
        enrichment_status: >-
          {% set value = states('input_select.print_history_filter_enrichment_status') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable', 'none', 'None'] else value | lower }}
        material: >-
          {% set value = states('input_select.print_history_filter_material') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable', 'none', 'None'] else value }}
        printer: >-
          {% set value = states('input_select.print_history_filter_printer') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable', 'none', 'None'] else value }}
        date_range: >-
          {% set value = states('input_select.print_history_filter_date_range') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable', 'none', 'None'] else value }}
        favorites_only: "{{ is_state('input_boolean.print_history_filter_favorites_only', 'on') }}"
        designer: >-
          {% set value = states('input_select.print_history_filter_designer') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable', 'none', 'None'] else value }}
        project: >-
          {% set value = states('input_select.print_history_filter_project') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable', 'none', 'None'] else value }}
        layer_height: >-
          {% set value = states('input_select.print_history_filter_layer_height') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable', 'none', 'None'] else value }}
        tag: >-
          {% set value = states('input_select.print_history_filter_tag') | string | trim %}
          {{ '' if value in ['', 'All', 'unknown', 'unavailable'] else value | lower }}
        search: >-
          {% set value = states('input_text.print_history_search') | string | trim %}
          {{ '' if value in ['', 'unknown', 'unavailable', 'none', 'None'] else value }}
        colors: >-
          {% set value = states('input_text.print_history_filter_colors') | string | trim %}
          {{ '' if value in ['', 'unknown', 'unavailable', 'none', 'None'] else value | lower }}
        selected_day: >-
          {% set value = states('input_text.print_history_activity_selected_date') | string | trim %}
          {{ '' if value in ['', 'unknown', 'unavailable', 'none', 'None'] else value }}
        sort: >-
          {% set value = states('input_select.print_history_sort') | string | trim %}
          {{ '' if value in ['', 'unknown', 'unavailable', 'none', 'None'] else value }}
        activity_metric: >-
          {% set value = states('input_select.print_history_activity_metric') | string | trim %}
          {{ '' if value in ['', 'unknown', 'unavailable', 'none', 'None'] else value | lower }}
        current_page: "{{ states('input_number.history_current_page') | int(1) }}"
        page_size: "{{ states('input_number.print_history_page_size') | int(10) }}"
    - action: bambuddy.query_print_history_browser
      data:
        status: "{{ status }}"
        enrichment_status: "{{ enrichment_status }}"
        material: "{{ material }}"
        printer: "{{ printer }}"
        date_range: "{{ date_range }}"
        favorites_only: "{{ favorites_only }}"
        designer: "{{ designer }}"
        project: "{{ project }}"
        layer_height: "{{ layer_height }}"
        tag: "{{ tag }}"
        search: "{{ search }}"
        colors: "{{ colors }}"
        selected_day: "{{ selected_day }}"
        sort: "{{ sort }}"
        activity_metric: "{{ activity_metric }}"
        page: "{{ current_page }}"
        page_size: "{{ page_size }}"
      response_variable: page_result
    - if:
        - condition: template
          value_template: >-
            {{ (page_result.get('query', {}).get('filtered_count', 0) | int(0)) > 0 }}
      then:
        - action: bambuddy.query_print_history_browser
          data:
            status: "{{ status }}"
            enrichment_status: "{{ enrichment_status }}"
            material: "{{ material }}"
            printer: "{{ printer }}"
            date_range: "{{ date_range }}"
            favorites_only: "{{ favorites_only }}"
            designer: "{{ designer }}"
            project: "{{ project }}"
            layer_height: "{{ layer_height }}"
            tag: "{{ tag }}"
            search: "{{ search }}"
            colors: "{{ colors }}"
            selected_day: "{{ selected_day }}"
            sort: "{{ sort }}"
            activity_metric: "{{ activity_metric }}"
            page: 1
            page_size: >-
              {{ page_result.get('query', {}).get('filtered_count', 0) | int(1) }}
          response_variable: activity_result
  sensor:
    - name: "Print History Page Archives"
      unique_id: print_history_page_archives
      icon: mdi:archive-outline
      state: >-
        {{ page_result.get('query', {}).get('filtered_count', 0) | int(0) if page_result is defined and page_result is mapping else 0 }}
      attributes:
        archives: >-
          {% set raw = page_result.get('archives', []) if page_result is defined and page_result is mapping else [] %}
          {% if raw is string %}
            {% set archives = raw | from_json([]) %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {{ archives | tojson }}
        filtered_archives: >-
          {% set raw = activity_result.get('archives', []) if activity_result is defined and activity_result is mapping else [] %}
          {% if raw is string %}
            {% set archives = raw | from_json([]) %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {{ archives | tojson }}
        archive_ids: >-
          {% set raw = page_result.get('archives', []) if page_result is defined and page_result is mapping else [] %}
          {% if raw is string %}
            {% set archives = raw | from_json([]) %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {{ archives | map(attribute='id') | list | tojson }}
        page: >-
          {{ page_result.get('query', {}).get('current_page', 1) | int(1) if page_result is defined and page_result is mapping else 1 }}
        has_more: >-
          {% set query = page_result.get('query', {}) if page_result is defined and page_result is mapping else {} %}
          {{ query.get('current_page', 1) | int(1) < query.get('total_pages', 1) | int(1) }}
        count: >-
          {{ page_result.get('query', {}).get('filtered_count', 0) | int(0) if page_result is defined and page_result is mapping else 0 }}
        total_pages: >-
          {{ page_result.get('query', {}).get('total_pages', 1) | int(1) if page_result is defined and page_result is mapping else 1 }}
        active_filters_json: >-
          {% set raw = page_result.get('query', {}).get('active_filters', {}) if page_result is defined and page_result is mapping else {} %}
          {% if raw is string %}
            {% set active_filters = raw | from_json({}) %}
          {% elif raw is mapping %}
            {% set active_filters = raw %}
          {% else %}
            {% set active_filters = {} %}
          {% endif %}
          {{ active_filters | tojson }}
        available_colors_json: >-
          {% set raw = page_result.get('query', {}).get('available_colors', []) if page_result is defined and page_result is mapping else [] %}
          {% if raw is string %}
            {% set colors = raw | from_json([]) %}
          {% elif raw is iterable %}
            {% set colors = raw | list %}
          {% else %}
            {% set colors = [] %}
          {% endif %}
          {{ colors | tojson }}
        status_message: >-
          {{ page_result.get('status', 'idle') if page_result is defined and page_result is mapping else 'idle' }}
        loaded_at: "{{ now().isoformat() }}"
