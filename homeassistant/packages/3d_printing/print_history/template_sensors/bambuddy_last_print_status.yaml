# Most recent print status (success/failed/stopped/printing).
# Docs: docs/features/print_history/README.md
- sensor:
    - name: Bambuddy Last Print Status
      unique_id: bambuddy_last_print_status
      icon: >
        {% set archives = state_attr('sensor.bambuddy_print_history', 'archives') %}
        {% set status = archives[0].status | default('unknown') if archives and archives | length > 0 else 'unknown' %}
        {% if status == 'success' %}mdi:check-circle
        {% elif status in ['failed', 'stopped'] %}mdi:alert-circle
        {% else %}mdi:help-circle{% endif %}
      state: >
        {% set archives = state_attr('sensor.bambuddy_print_history', 'archives') %}
        {% if archives and archives | length > 0 %}
          {{ archives[0].status | default('unknown') }}
        {% else %}
          unknown
        {% endif %}
