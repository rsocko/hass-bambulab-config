# Print History Card — recent-prints summary + variant-aware archive browser.
# Summary row uses individual rest: sensors (always works).
# Browser rows are derived client-side from sensor.print_history_archives so the
# UI still works even when the Layer 2 page_json attribute is unavailable.

type: vertical-stack
cards:
  # Header: title + link to Bambuddy archives UI
  - type: custom:button-card
    name: Recent Prints
    icon: mdi:history
    tap_action:
      action: url
      url_path: "[[[ return states['input_text.bambuddy_api_base_url'].state + '/archives'; ]]]"
    styles:
      card:
        - background: var(--ha-card-background)
        - border-radius: 12px 12px 0 0
        - padding: 8px 16px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 40px 1fr
      name:
        - font-size: 16px
        - font-weight: 600
        - text-align: left
      icon:
        - width: 24px
        - color: "#2196F3"

  # History browser rendered from the archive cache plus current helper state
  - type: custom:button-card
    entity: sensor.print_history_filtered
    show_name: false
    show_icon: false
    show_state: false
    custom_fields:
      history_table: |
        [[[
          const rawArchives = states['sensor.print_history_archives']?.attributes?.archives_json ?? '[]';
          const variant = states['input_select.print_history_card_variant']?.state || 'Compact';
          const pageSize = Number(states['input_number.print_history_page_size']?.state || 10);
          const currentPage = Number(states['input_number.history_current_page']?.state || 1);
          const filterStatus = states['input_select.print_history_filter_status']?.state || 'All';
          const filterMaterial = states['input_select.print_history_filter_material']?.state || 'All';
          const filterColor = states['input_select.print_history_filter_color']?.state || 'All';
          const filterPrinter = states['input_select.print_history_filter_printer']?.state || 'All';
          const filterDate = states['input_select.print_history_filter_date_range']?.state || 'All Time';
          const filterFavorites = states['input_select.print_history_filter_favorites']?.state || 'All';
          const filterDesigner = states['input_select.print_history_filter_designer']?.state || 'All';
          const filterLayerHeight = states['input_select.print_history_filter_layer_height']?.state || 'All';
          const sortBy = states['input_select.print_history_sort']?.state || 'Date (Newest)';
          const searchText = (states['input_text.print_history_search']?.state || '').trim().toLowerCase();
          let archives = [];
          if (Array.isArray(rawArchives)) {
            archives = rawArchives;
          } else if (typeof rawArchives === 'string') {
            try {
              archives = JSON.parse(rawArchives);
            } catch (error) {
              archives = [];
            }
          }
          const normalizeStatus = (status) => {
            const raw = String(status || '').toLowerCase();
            if (raw === 'completed') return 'success';
            if (raw === 'cancelled' || raw === 'aborted') return 'failed';
            return raw;
          };
          const matchesDateRange = (archive) => {
            if (filterDate === 'All Time') return true;
            const started = archive.started_at || archive.created_at;
            if (!started) return false;
            const startedTime = new Date(started).getTime();
            if (Number.isNaN(startedTime)) return false;
            const ageDays = (Date.now() - startedTime) / 86400000;
            if (filterDate === 'Today') return ageDays < 1;
            if (filterDate === 'This Week') return ageDays < 7;
            if (filterDate === 'This Month') return ageDays < 30;
            if (filterDate === 'Last 30 Days') return ageDays < 30;
            if (filterDate === 'Last 90 Days') return ageDays < 90;
            return true;
          };
          const filteredArchives = archives.filter((archive) => {
            const normalizedStatus = normalizeStatus(archive.status);
            const material = String(archive.filament_type || '');
            const color = String(archive.filament_color || '');
            const printer = String(archive.printer_id ?? '');
            const designer = String(archive.designer || '');
            const layerHeight = String(archive.layer_height ?? '');
            const tags = String(archive.tags || '');
            const name = String(archive.print_name || '');
            const searchBlob = `${name} ${designer} ${tags}`.toLowerCase();
            const matchesStatus = filterStatus === 'All' || normalizedStatus === filterStatus.toLowerCase();
            const matchesMaterial = filterMaterial === 'All' || material.toLowerCase() === filterMaterial.toLowerCase();
            const matchesColor = filterColor === 'All' || color.toLowerCase().includes(filterColor.toLowerCase());
            const matchesPrinter = filterPrinter === 'All' || printer === filterPrinter;
            const matchesFavorites = filterFavorites === 'All' || (filterFavorites === 'Favorites Only' && !!archive.is_favorite);
            const matchesDesigner = filterDesigner === 'All' || designer.toLowerCase() === filterDesigner.toLowerCase();
            const matchesLayerHeight = filterLayerHeight === 'All' || layerHeight === filterLayerHeight;
            const matchesSearch = searchText === '' || searchBlob.includes(searchText);
            return matchesStatus && matchesMaterial && matchesColor && matchesPrinter && matchesFavorites && matchesDesigner && matchesLayerHeight && matchesSearch && matchesDateRange(archive);
          });
          const compareStrings = (left, right) => String(left || '').localeCompare(String(right || ''));
          const compareNumbers = (left, right) => Number(left || 0) - Number(right || 0);
          const sortedArchives = [...filteredArchives].sort((left, right) => {
            if (sortBy === 'Date (Oldest)') return compareStrings(left.started_at || left.created_at, right.started_at || right.created_at);
            if (sortBy === 'Duration (Longest)') return compareNumbers(right.actual_time_seconds || right.print_time_seconds, left.actual_time_seconds || left.print_time_seconds);
            if (sortBy === 'Duration (Shortest)') return compareNumbers(left.actual_time_seconds || left.print_time_seconds, right.actual_time_seconds || right.print_time_seconds);
            if (sortBy === 'Cost (Highest)') return compareNumbers(right.cost, left.cost);
            if (sortBy === 'Cost (Lowest)') return compareNumbers(left.cost, right.cost);
            if (sortBy === 'Filament (Most)') return compareNumbers(right.filament_used_grams, left.filament_used_grams);
            if (sortBy === 'Filament (Least)') return compareNumbers(left.filament_used_grams, right.filament_used_grams);
            if (sortBy === 'Name (A-Z)') return compareStrings(left.print_name, right.print_name);
            if (sortBy === 'Name (Z-A)') return compareStrings(right.print_name, left.print_name);
            return compareStrings(right.started_at || right.created_at, left.started_at || left.created_at);
          });
          const totalPages = Math.max(1, Math.ceil(sortedArchives.length / Math.max(1, pageSize)));
          const clampedPage = Math.max(1, Math.min(currentPage, totalPages));
          const startIndex = (clampedPage - 1) * Math.max(1, pageSize);
          const archivesPage = sortedArchives.slice(startIndex, startIndex + Math.max(1, pageSize));
          if (archivesPage.length === 0) {
            return '<div style="padding:16px;color:var(--secondary-text-color);text-align:center">No matching archives. Adjust filters or refresh the archive cache.</div>';
          }
          const baseUrl = states['input_text.bambuddy_api_base_url']?.state || '';
          const statusLabel = (status) => {
            const raw = normalizeStatus(status);
            if (raw === 'success') return 'Completed';
            if (raw === 'failed') return 'Failed';
            if (raw === 'stopped') return 'Stopped';
            if (raw === 'printing') return 'Printing';
            return raw || 'Unknown';
          };
          const statusIcon = (status) => {
            const raw = normalizeStatus(status);
            if (raw === 'success') return '✅';
            if (raw === 'failed') return '❌';
            if (raw === 'stopped') return '⛔';
            if (raw === 'printing') return '🖨️';
            return '⏳';
          };
          const rows = archivesPage.map((a) => {
            const dateSource = a.started_at || a.created_at;
            const date = dateSource ? new Date(dateSource).toLocaleDateString('en-US', {
              month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            }) : 'Unknown date';
            const durationSource = a.actual_time_seconds || a.print_time_seconds || 0;
            const duration = durationSource
              ? Math.round((Number(durationSource) / 3600) * 10) / 10 + 'h' : '-';
            const grams = a.filament_used_grams ? `${Math.round(Number(a.filament_used_grams) * 10) / 10}g` : '-';
            const cost = a.cost ? `$${Number(a.cost).toFixed(2)}` : '-';
            const tagsRaw = typeof a.tags === 'string' ? a.tags : '';
            const tagChips = tagsRaw.split(',').filter(t => t.trim()).slice(0, variant === 'Compact' ? 2 : 5).map(t => {
              const tag = t.trim();
              let bg = '#1565C0';
              if (tag.startsWith('status:')) bg = tag.includes('success') ? '#2E7D32' : '#C62828';
              else if (tag.startsWith('vendor:')) bg = '#6A1B9A';
              else if (tag.startsWith('material:')) bg = '#00695C';
              else if (tag.startsWith('cost:')) bg = '#E65100';
              else if (tag.startsWith('spoolman:')) bg = '#0277BD';
              return `<span style="background:${bg};color:#fff;border-radius:999px;padding:2px 6px;font-size:10px;margin-right:4px;display:inline-block;margin-top:4px">${tag}</span>`;
            });
            const thumb = a.id
              ? `<img src="${baseUrl}/api/v1/archives/${a.id}/thumbnail" style="width:${variant === 'Media' ? '100%' : variant === 'Detail' ? '88px' : '44px'};height:${variant === 'Media' ? '176px' : variant === 'Detail' ? '88px' : '44px'};object-fit:cover;border-radius:${variant === 'Media' ? '10px 10px 0 0' : '8px'};display:block" loading="lazy" onerror="this.style.display='none'">`
              : `<div style="width:${variant === 'Media' ? '100%' : variant === 'Detail' ? '88px' : '44px'};height:${variant === 'Media' ? '176px' : variant === 'Detail' ? '88px' : '44px'};background:#37474F;border-radius:${variant === 'Media' ? '10px 10px 0 0' : '8px'};display:flex;align-items:center;justify-content:center;font-size:20px">🖨️</div>`;
            if (variant === 'Media') {
              return `<div style="border:1px solid var(--divider-color);border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--ha-card-background)">
                ${thumb}
                <div style="padding:12px 14px">
                  <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
                    <div>
                      <div style="font-weight:600;font-size:14px">${a.print_name || 'Unnamed'}</div>
                      <div style="font-size:12px;color:var(--secondary-text-color)">${date}</div>
                    </div>
                    <div style="font-size:22px">${statusIcon(a.status)}</div>
                  </div>
                  <div style="margin-top:8px;font-size:12px;color:var(--secondary-text-color)">${statusLabel(a.status)} · ${duration} · ${grams} · ${cost}</div>
                  ${tagChips.length ? `<div style="margin-top:6px">${tagChips.join('')}</div>` : ''}
                </div>
              </div>`;
            }
            if (variant === 'Detail') {
              return `<div style="display:grid;grid-template-columns:88px 1fr auto;gap:12px;border-bottom:1px solid var(--divider-color);padding:10px 2px;align-items:start">
                <div>${thumb}</div>
                <div>
                  <div style="font-weight:600;font-size:14px">${a.print_name || 'Unnamed'}</div>
                  <div style="font-size:12px;color:var(--secondary-text-color)">${date}</div>
                  <div style="font-size:12px;margin-top:6px">${statusLabel(a.status)} · ${duration} · ${grams} · ${cost}</div>
                  <div style="font-size:12px;color:var(--secondary-text-color);margin-top:4px">${a.filament_type || 'Unknown material'}${a.designer ? ` · ${a.designer}` : ''}${a.layer_height ? ` · ${a.layer_height}mm` : ''}</div>
                  ${tagChips.length ? `<div style="margin-top:6px">${tagChips.join('')}</div>` : ''}
                </div>
                <div style="font-size:22px;padding-top:6px">${statusIcon(a.status)}</div>
              </div>`;
            }
            return `<tr style="border-bottom:1px solid var(--divider-color)">
              <td style="padding:8px 4px;vertical-align:middle">${thumb}</td>
              <td style="padding:8px;vertical-align:middle">
                <div style="font-weight:500;font-size:13px">${a.print_name || 'Unnamed'}</div>
                <div style="font-size:11px;color:var(--secondary-text-color)">${date} · ${duration}</div>
              </td>
              <td style="padding:8px 4px;text-align:right;vertical-align:middle;font-size:20px">${statusIcon(a.status)}</td>
            </tr>`;
          }).join('');
          if (variant === 'Media' || variant === 'Detail') {
            return `<div style="padding:8px 0">${rows}</div>`;
          }
          return `<table style="width:100%;border-collapse:collapse">${rows}</table>`;
        ]]]
    styles:
      card:
        - border-radius: 0 0 12px 12px
        - padding: 0
        - overflow: hidden
      custom_fields:
        history_table:
          - width: 100%
          - display: block

  # Summary: last print quick stats
  - type: horizontal-stack
    cards:
      - type: entity
        entity: sensor.bambuddy_last_print_name
        name: Last Print
        icon: mdi:printer-3d-nozzle
      - type: entity
        entity: sensor.bambuddy_last_print_status
        name: Result
      - type: entity
        entity: sensor.bambuddy_last_print_duration
        name: Duration
