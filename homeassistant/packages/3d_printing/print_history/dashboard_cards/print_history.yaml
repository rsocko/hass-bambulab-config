# Print History Card — recent-prints summary + table.
# Summary row uses individual rest: sensors (always works).
# Table reads from sensor.print_history_page_archives (trigger-based
# template sensor populated by script.load_history_page events).

type: vertical-stack
cards:
  # Header: title + link to Bambuddy archives UI
  - type: custom:button-card
    name: Recent Prints
    icon: mdi:history
    tap_action:
      action: url
      url_path: "[[[ return states['input_text.bambuddy_api_base_url'].state + '/archives'; ]]]"
    styles:
      card:
        - background: var(--ha-card-background)
        - border-radius: 12px 12px 0 0
        - padding: 8px 16px
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 40px 1fr
      name:
        - font-size: 16px
        - font-weight: 600
        - text-align: left
      icon:
        - width: 24px
        - color: "#2196F3"

  # History table rendered from trigger-based page archives sensor
  - type: custom:button-card
    entity: sensor.print_history_page_archives
    show_name: false
    show_icon: false
    show_state: false
    custom_fields:
      history_table: |
        [[[
          const archives = entity && entity.attributes && Array.isArray(entity.attributes.archives)
            ? entity.attributes.archives : [];
          if (archives.length === 0) {
            return '<div style="padding:16px;color:var(--secondary-text-color);text-align:center">No print history available — tap Refresh below</div>';
          }
          const baseUrl = states['input_text.bambuddy_api_base_url'].state;
          const rows = archives.slice(0, 10).map(a => {
            const date = new Date(a.created_at).toLocaleDateString('en-US', {
              month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            const duration = a.print_time_seconds
              ? Math.round(a.print_time_seconds / 3600 * 10) / 10 + 'h' : '-';
            const statusIcon = a.status === 'success' ? '✅'
              : a.status === 'failed' ? '❌'
              : a.status === 'stopped' ? '⛔'
              : a.status === 'printing' ? '🖨️' : '⏳';

            // Tags: comma-separated string → styled chips
            const tagsRaw = typeof a.tags === 'string' ? a.tags : '';
            const tagChips = tagsRaw.split(',').filter(t => t.trim()).map(t => {
              const tag = t.trim();
              let bg = '#1565C0';
              if (tag.startsWith('status:')) bg = tag.includes('success') ? '#2E7D32' : '#C62828';
              else if (tag.startsWith('vendor:')) bg = '#6A1B9A';
              else if (tag.startsWith('material:')) bg = '#00695C';
              else if (tag.startsWith('cost:')) bg = '#E65100';
              else if (tag.startsWith('spoolman:')) bg = '#0277BD';
              return `<span style="background:${bg};color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;margin-right:2px">${tag}</span>`;
            }).join('');

            // Thumbnail: use /api/v1/archives/{id}/thumbnail (unauthenticated)
            const thumb = a.id
              ? `<img src="${baseUrl}/api/v1/archives/${a.id}/thumbnail" style="width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle" loading="lazy" onerror="this.style.display='none'">`
              : `<div style="width:44px;height:44px;background:#37474F;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:20px">🖨️</div>`;

            return `
              <tr style="border-bottom:1px solid var(--divider-color)">
                <td style="padding:8px 4px;vertical-align:middle">${thumb}</td>
                <td style="padding:8px;vertical-align:middle">
                  <div style="font-weight:500;font-size:13px">${a.print_name || 'Unnamed'}</div>
                  <div style="font-size:11px;color:var(--secondary-text-color)">${date} · ${duration}</div>
                  ${tagChips ? '<div style="margin-top:3px;line-height:1.6">' + tagChips + '</div>' : ''}
                </td>
                <td style="padding:8px 4px;text-align:right;vertical-align:middle;font-size:20px">${statusIcon}</td>
              </tr>`;
          }).join('');
          return `<table style="width:100%;border-collapse:collapse">${rows}</table>`;
        ]]]
    styles:
      card:
        - border-radius: 0 0 12px 12px
        - padding: 0
        - overflow: hidden
      custom_fields:
        history_table:
          - width: 100%
          - display: block

  # Summary: last print quick stats
  - type: horizontal-stack
    cards:
      - type: entity
        entity: sensor.bambuddy_last_print_name
        name: Last Print
        icon: mdi:printer-3d-nozzle
      - type: entity
        entity: sensor.bambuddy_last_print_status
        name: Result
      - type: entity
        entity: sensor.bambuddy_last_print_duration
        name: Duration
