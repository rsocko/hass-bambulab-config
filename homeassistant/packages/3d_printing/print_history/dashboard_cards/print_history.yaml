# Print History Card — full-width responsive archive grid.
# Archive cards render from the current page slice so filtering/paging stays
# server-side and the dashboard focuses on presentation.

type: vertical-stack
cards:
  - type: custom:print-history-archive-grid-card
    source_entity: sensor.print_history_page_archives
    variant_entity: input_select.print_history_card_variant
    show_images_entity: input_boolean.print_history_show_images
    api_base_entity: input_text.bambuddy_api_base_url