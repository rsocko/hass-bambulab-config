# Print History Card — full-width responsive archive grid.
# Archive cards render from the current page slice so filtering/paging stays
# server-side and the dashboard focuses on presentation.

type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: input_select.print_history_card_variant
        state: Compact
    card:
      type: custom:auto-entities
      show_empty: false
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
          grid-gap: 16px
          margin: 0
      card_param: cards
      filter:
        template: >
          {% set raw = state_attr('sensor.print_history_page_archives', 'archives') | default('[]', true) %}
          {% if raw is string %}
            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {% set cards = namespace(items=[]) %}
          {% for archive in archives %}
            {% set cards.items = cards.items + [{
              'type': 'custom:button-card',
              'template': 'print_history_archive_card_compact',
              'variables': {
                'archive_json': archive | tojson
              }
            }] %}
          {% endfor %}
          {{ cards.items | tojson }}

  - type: conditional
    conditions:
      - entity: input_select.print_history_card_variant
        state: Media
    card:
      type: custom:auto-entities
      show_empty: false
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(auto-fit, minmax(360px, 1fr))
          grid-gap: 16px
          margin: 0
      card_param: cards
      filter:
        template: >
          {% set raw = state_attr('sensor.print_history_page_archives', 'archives') | default('[]', true) %}
          {% if raw is string %}
            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {% set cards = namespace(items=[]) %}
          {% for archive in archives %}
            {% set cards.items = cards.items + [{
              'type': 'custom:button-card',
              'template': 'print_history_archive_card_media',
              'variables': {
                'archive_json': archive | tojson
              }
            }] %}
          {% endfor %}
          {{ cards.items | tojson }}

  - type: conditional
    conditions:
      - entity: input_select.print_history_card_variant
        state: Detail
    card:
      type: custom:auto-entities
      show_empty: false
      card:
        type: vertical-stack
      card_param: cards
      filter:
        template: >
          {% set raw = state_attr('sensor.print_history_page_archives', 'archives') | default('[]', true) %}
          {% if raw is string %}
            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {% set cards = namespace(items=[]) %}
          {% for archive in archives %}
            {% set cards.items = cards.items + [{
              'type': 'custom:button-card',
              'template': 'print_history_archive_card_detail',
              'variables': {
                'archive_json': archive | tojson
              }
            }] %}
          {% endfor %}
          {{ cards.items | tojson }}

  - type: conditional
    conditions:
      - entity: sensor.print_history_filtered
        state: '0'
    card:
      type: markdown
      content: >
        No matching archives. Adjust filters or refresh the archive cache.