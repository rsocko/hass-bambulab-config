# Print History Card — full-width responsive archive grid.
# Archive cards render from the current page slice so filtering/paging stays
# server-side and the dashboard focuses on presentation.

type: vertical-stack
cards:
  - type: custom:button-card
    entity: sensor.print_history_page_archives
    show_name: false
    show_icon: false
    show_state: false
    custom_fields:
      history_grid: |
        [[[
          const rawArchives = entity?.attributes?.archives ?? [];
          const variant = states['input_select.print_history_card_variant']?.state || 'Compact';
          let archives = [];
          if (Array.isArray(rawArchives)) {
            archives = rawArchives;
          } else if (typeof rawArchives === 'string') {
            try {
              archives = JSON.parse(rawArchives);
            } catch (error) {
              archives = [];
            }
          }
          const normalizeStatus = (status) => {
            const raw = String(status || '').toLowerCase();
            if (raw === 'completed') return 'success';
            if (raw === 'cancelled' || raw === 'aborted') return 'failed';
            return raw;
          };
          if (archives.length === 0) {
            return '<div style="padding:16px;color:var(--secondary-text-color);text-align:center">No matching archives. Adjust filters or refresh the archive cache.</div>';
          }
          const baseUrl = states['input_text.bambuddy_api_base_url']?.state || '';
          const statusLabel = (status) => {
            const raw = normalizeStatus(status);
            if (raw === 'success') return 'Completed';
            if (raw === 'failed') return 'Failed';
            if (raw === 'stopped') return 'Stopped';
            if (raw === 'printing') return 'Printing';
            return raw || 'Unknown';
          };
          const statusIcon = (status) => {
            const raw = normalizeStatus(status);
            if (raw === 'success') return '✅';
            if (raw === 'failed') return '❌';
            if (raw === 'stopped') return '⛔';
            if (raw === 'printing') return '🖨️';
            return '⏳';
          };
          const statusPill = (status) => {
            const raw = normalizeStatus(status);
            const color = raw === 'success'
              ? '#2E7D32'
              : raw === 'failed'
                ? '#C62828'
                : raw === 'stopped'
                  ? '#EF6C00'
                  : raw === 'printing'
                    ? '#1565C0'
                    : '#546E7A';
            return `<span style="background:${color};color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px">${statusIcon(status)} ${statusLabel(status)}</span>`;
          };
          const colorDots = (archive) => {
            const colors = String(archive.filament_color || '').split(',').map((value) => value.trim()).filter(Boolean);
            if (!colors.length) return '';
            return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${colors.slice(0, 6).map((hex) => `<span style="width:14px;height:14px;border-radius:999px;background:${hex};box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25)"></span>`).join('')}</div>`;
          };
          const rows = archives.map((a) => {
            const dateSource = a.started_at || a.created_at;
            const date = dateSource ? new Date(dateSource).toLocaleDateString('en-US', {
              month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            }) : 'Unknown date';
            const durationSource = a.actual_time_seconds || a.print_time_seconds || 0;
            const duration = durationSource
              ? Math.round((Number(durationSource) / 3600) * 10) / 10 + 'h' : '-';
            const grams = a.filament_used_grams ? `${Math.round(Number(a.filament_used_grams) * 10) / 10}g` : '-';
            const cost = a.cost ? `$${Number(a.cost).toFixed(2)}` : '-';
            const tagsRaw = typeof a.tags === 'string' ? a.tags : '';
            const tagChips = tagsRaw.split(',').filter(t => t.trim()).slice(0, variant === 'Compact' ? 2 : 4).map(t => {
              const tag = t.trim();
              let bg = '#1565C0';
              if (tag.startsWith('status:')) bg = tag.includes('success') ? '#2E7D32' : '#C62828';
              else if (tag.startsWith('vendor:')) bg = '#6A1B9A';
              else if (tag.startsWith('material:')) bg = '#00695C';
              else if (tag.startsWith('cost:')) bg = '#E65100';
              else if (tag.startsWith('spoolman:')) bg = '#0277BD';
              return `<span style="background:${bg};color:#fff;border-radius:999px;padding:3px 8px;font-size:10px;margin-right:4px;display:inline-block;margin-top:4px">${tag}</span>`;
            });
            const favorite = a.is_favorite ? '<span style="font-size:18px;color:#f5c242">★</span>' : '';
            const thumb = a.id
              ? `<img src="${baseUrl}/api/v1/archives/${a.id}/thumbnail" style="width:100%;height:${variant === 'Media' ? '220px' : '180px'};object-fit:cover;border-radius:16px;display:block" loading="lazy" onerror="this.style.display='none'">`
              : `<div style="width:100%;height:${variant === 'Media' ? '220px' : '180px'};background:#37474F;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px">🖨️</div>`;
            const metadata = [
              a.filament_type || 'Unknown material',
              a.layer_height ? `${a.layer_height}mm` : '',
              a.designer || ''
            ].filter(Boolean).join(' · ');
            const failure = a.failure_reason
              ? `<div style="margin-top:8px;font-size:12px;color:#ffb4ab;line-height:1.4">${a.failure_reason}</div>`
              : '';
            if (variant === 'Media') {
              return `<article style="width:100%;max-width:440px;margin:0 auto;border:1px solid var(--divider-color);border-radius:22px;overflow:hidden;background:var(--ha-card-background);display:flex;flex-direction:column;gap:0;box-sizing:border-box">
                ${thumb}
                <div style="padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px">
                  <div style="display:flex;justify-content:space-between;gap:10px;row-gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0">
                    <div style="min-width:0;flex:1 1 220px;max-width:100%">
                      <div style="font-weight:700;font-size:18px;line-height:1.2;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:100%">${a.print_name || 'Unnamed'}</div>
                      <div style="font-size:12px;color:var(--secondary-text-color)">${date}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;max-width:100%;margin-left:auto">${favorite}${statusPill(a.status)}</div>
                  </div>
                  <div style="font-size:13px;color:var(--secondary-text-color);overflow-wrap:anywhere">${metadata || 'No additional metadata'}</div>
                  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px">
                    <span>Duration: <strong>${duration}</strong></span>
                    <span>Filament: <strong>${grams}</strong></span>
                    <span>Cost: <strong>${cost}</strong></span>
                  </div>
                  ${colorDots(a)}
                  ${tagChips.length ? `<div style="margin-top:6px">${tagChips.join('')}</div>` : ''}
                  ${failure}
                </div>
              </article>`;
            }
            if (variant === 'Detail' || variant === 'Compact') {
              return `<article style="width:100%;max-width:${variant === 'Compact' ? '340px' : '500px'};margin:0 auto;border:1px solid var(--divider-color);border-radius:22px;background:var(--ha-card-background);padding:16px 18px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
                <div style="display:grid;grid-template-columns:${variant === 'Compact' ? '120px minmax(0, 1fr)' : '160px minmax(0, 1fr)'};gap:14px;align-items:start;min-width:0">
                  <div>${thumb}</div>
                  <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
                    <div style="display:flex;justify-content:space-between;gap:10px;row-gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0">
                      <div style="min-width:0;flex:1 1 220px;max-width:100%">
                        <div style="font-weight:700;font-size:${variant === 'Compact' ? '16px' : '18px'};line-height:1.2;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:100%">${a.print_name || 'Unnamed'}</div>
                        <div style="font-size:12px;color:var(--secondary-text-color)">${date}</div>
                      </div>
                      <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;max-width:100%;margin-left:auto">${favorite}${statusPill(a.status)}</div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;font-size:12px;min-width:0">
                      <div style="padding:8px 10px;border-radius:14px;background:rgba(255,255,255,0.04)"><div style="color:var(--secondary-text-color)">Duration</div><div style="font-weight:700">${duration}</div></div>
                      <div style="padding:8px 10px;border-radius:14px;background:rgba(255,255,255,0.04)"><div style="color:var(--secondary-text-color)">Filament</div><div style="font-weight:700">${grams}</div></div>
                      <div style="padding:8px 10px;border-radius:14px;background:rgba(255,255,255,0.04)"><div style="color:var(--secondary-text-color)">Cost</div><div style="font-weight:700">${cost}</div></div>
                    </div>
                    <div style="font-size:13px;color:var(--secondary-text-color);overflow-wrap:anywhere">${metadata || 'No additional metadata'}</div>
                    ${colorDots(a)}
                    ${tagChips.length ? `<div>${tagChips.join('')}</div>` : ''}
                    ${failure}
                  </div>
                </div>
              </article>`;
            }
            return '';
          }).join('');
          return `
            <style>
              .print-history-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, ${variant === 'Compact' ? '260px' : variant === 'Media' ? '340px' : '400px'}), 1fr));
                gap: 16px;
                justify-content: center;
                align-items: start;
              }
            </style>
            <div class="print-history-grid">${rows}</div>
          `;
        ]]]
    styles:
      card:
        - border-radius: 24px
        - padding: 16px
        - overflow: hidden
        - background: transparent
      grid:
        - grid-template-areas: '"history_grid"'
        - grid-template-columns: minmax(0, 1fr)
        - grid-template-rows: min-content
      custom_fields:
        history_grid:
          - width: 100%
          - display: block
          - min-width: 0
          - justify-self: stretch
          - align-self: stretch
