# Print History Card — responsive per-archive grid.
# Each archive is its own button-card so taps open an archive-specific popup
# instead of falling through to one more-info target for the whole section.

type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: input_select.print_history_card_variant
        state: Compact
    card:
      type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 3
        square: false
        card_mod:
          style: |
            #root {
              align-items: stretch;
              gap: 16px;
            }
            @media (max-width: 1100px) {
              #root {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              }
            }
            @media (max-width: 720px) {
              #root {
                grid-template-columns: 1fr !important;
              }
            }
      card_param: cards
      filter:
        template: >
          {% set raw = state_attr('sensor.print_history_page_archives', 'archives') | default('[]', true) %}
          {% if raw is string %}
            {% set archives = raw | from_json %}
          {% elif raw is iterable %}
            {% set archives = raw | list %}
          {% else %}
            {% set archives = [] %}
          {% endif %}
          {% set cards = namespace(items=[]) %}
          {% if archives | length == 0 %}
            {% set cards.items = cards.items + [{
              'type': 'markdown',
              'content': 'No matching archives. Adjust filters or refresh the archive cache.'
            }] %}
          {% else %}
            {% for archive in archives %}
              {% set cards.items = cards.items + [{
                'type': 'custom:button-card',
                'entity': 'sensor.print_history_page_archives',
                'template': 'print_history_archive_card',
                'variables': {
                  'archive_id': archive.id,
                  'archive_name': archive.print_name | default('Unnamed Print', true),
                  'archive_status': archive.status | default('unknown', true),
                  'archive_started': (archive.started_at or archive.created_at or 'Unknown date'),
                  'archive_duration': (((archive.actual_time_seconds or archive.print_time_seconds or 0) | float(0) / 3600) | round(1) ~ 'h') if (archive.actual_time_seconds or archive.print_time_seconds) else '-',
                  'archive_filament_used': ((archive.filament_used_grams | float(0) | round(1)) ~ 'g') if archive.filament_used_grams else '-',
                  'archive_cost': ('$' ~ ('%.2f' | format(archive.cost | float(0)))) if archive.cost else '-',
                  'archive_printer': archive.printer_id | string,
                  'archive_material': archive.filament_type | default('Unknown material', true),
                  'archive_layer_height': ((archive.layer_height | string) ~ ' mm') if archive.layer_height not in [none, ''] else '-',
                  'archive_nozzle': ((archive.nozzle_diameter | string) ~ ' mm') if archive.nozzle_diameter not in [none, ''] else '-',
                  'archive_object_count': archive.object_count | default(1, true) | string,
                  'archive_designer': archive.designer | default('', true),
                  'archive_tags': archive.tags | default('No tags', true),
                  'archive_notes': archive.notes | default('No notes', true),
                  'archive_failure_reason': archive.failure_reason | default('', true),
                  'archive_favorite': archive.is_favorite | default(false, true)
                }
              }] %}
            {% endfor %}
          {% endif %}
          {{ cards.items | tojson }}

