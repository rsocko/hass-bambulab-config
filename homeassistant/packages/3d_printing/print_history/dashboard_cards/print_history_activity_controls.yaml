type: vertical-stack
cards:
  - type: entities
    show_header_toggle: false
    entities:
      - entity: input_select.print_history_activity_metric
        name: Heatmap Mode
      - entity: input_boolean.print_history_activity_use_filters
        name: Follow Print History Filters
      - entity: input_text.print_history_activity_selected_date
        name: Selected Day (tap chart or type YYYY-MM-DD)
  - type: custom:button-card
    name: Clear Selected Day
    icon: mdi:calendar-remove-outline
    show_state: false
    tap_action:
      action: perform-action
      perform_action: input_text.set_value
      target:
        entity_id: input_text.print_history_activity_selected_date
      data:
        value: ""
    styles:
      card:
        - width: 220px
        - height: 42px
        - border-radius: 999px
        - background: var(--ha-card-background)
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 20px auto
        - column-gap: 8px
      icon:
        - width: 18px
        - color: var(--secondary-text-color)
      name:
        - justify-self: start
        - font-size: 13px
        - font-weight: 600
