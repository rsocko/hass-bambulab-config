type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Print Activity Heatmap
    icon: mdi:chart-box-outline
    sub_button:
      - entity: input_select.print_history_activity_metric
        sub_button_type: select
        name: Metric
        icon: mdi:tune-variant
        show_name: true
        show_state: true
        show_background: true
        fill_width: false
      - entity: input_select.print_history_activity_metric
        sub_button_type: select
        name: ""
        icon: mdi:tune
        show_name: false
        show_state: true
        show_background: true
        fill_width: false
      - entity: sensor.bambuddy_print_history_browser_filtered
        sub_button_type: default
        name: Active Days
        icon: mdi:calendar-range
        show_icon: true
        show_name: false
        show_attribute: true
        attribute: activity_active_days_label
        show_background: true
        state_background: false
        fill_width: false
        tap_action:
          action: none
      - entity: sensor.bambuddy_print_history_browser_filtered
        sub_button_type: default
        name: Metric Total
        icon: mdi:counter
        show_icon: true
        show_name: false
        show_attribute: true
        attribute: activity_metric_total_label
        show_background: true
        state_background: false
        fill_width: false
        tap_action:
          action: none
      - entity: sensor.bambuddy_print_history_browser_filtered
        sub_button_type: default
        name: Active Days Compact
        icon: mdi:calendar-range-outline
        show_icon: true
        show_name: false
        show_attribute: true
        attribute: activity_active_days_compact_label
        show_background: true
        state_background: false
        fill_width: false
        tap_action:
          action: none
      - entity: sensor.bambuddy_print_history_browser_filtered
        sub_button_type: default
        name: Metric Total Compact
        icon: mdi:chart-box-outline
        show_icon: true
        show_name: false
        show_attribute: true
        attribute: activity_metric_total_compact_label
        show_background: true
        state_background: false
        fill_width: false
        tap_action:
          action: none
      - entity: input_text.print_history_activity_selected_date
        sub_button_type: default
        name: Selected Day
        icon: mdi:calendar-check-outline
        show_icon: true
        show_name: false
        show_state: true
        show_background: true
        fill_width: false
        tap_action:
          action: none
        visibility:
          - condition: state
            entity: input_text.print_history_activity_selected_date
            state_not: ""
      - entity: input_text.print_history_activity_selected_date
        sub_button_type: default
        name: Clear Selected Day
        icon: mdi:calendar-remove-outline
        show_icon: true
        show_name: false
        show_state: false
        show_background: true
        fill_width: false
        visibility:
          - condition: state
            entity: input_text.print_history_activity_selected_date
            state_not: ""
        tap_action:
          action: call-service
          service: input_text.set_value
          target:
            entity_id: input_text.print_history_activity_selected_date
          data:
            value: ""
      - entity: input_boolean.print_history_show_activity_heatmap
        sub_button_type: default
        name: Collapse Heatmap
        icon: mdi:chevron-up
        show_icon: true
        show_name: false
        show_state: false
        show_background: true
        state_background: true
        state_color: true
        fill_width: false
        visibility:
          - condition: state
            entity: input_boolean.print_history_show_activity_heatmap
            state: "on"
        tap_action:
          action: toggle
      - entity: input_boolean.print_history_show_activity_heatmap
        sub_button_type: default
        name: Expand Heatmap
        icon: mdi:chevron-down
        show_icon: true
        show_name: false
        show_state: false
        show_background: true
        fill_width: false
        visibility:
          - condition: state
            entity: input_boolean.print_history_show_activity_heatmap
            state: "off"
        tap_action:
          action: toggle
    styles: |
      ha-card {
        margin-top: 8px !important;
      }
      .bubble-sub-button-container,
      .bubble-sub-buttons-container {
        gap: 6px !important;
      }
      .bubble-sub-button:has(ha-icon[icon="mdi:calendar-range-outline"]),
      .bubble-sub-button:has(ha-icon[icon="mdi:chart-box-outline"]),
      .bubble-sub-button:has(ha-icon[icon="mdi:tune"]) {
        display: none !important;
      }
      @media (max-width: 720px) {
        .bubble-name {
          display: none !important;
        }
        .bubble-sub-button:has(ha-icon[icon="mdi:tune-variant"]) {
          display: none !important;
        }
        .bubble-sub-button:has(ha-icon[icon="mdi:calendar-range"]),
        .bubble-sub-button:has(ha-icon[icon="mdi:counter"]) {
          display: none !important;
        }
        .bubble-sub-button:has(ha-icon[icon="mdi:calendar-range-outline"]),
        .bubble-sub-button:has(ha-icon[icon="mdi:chart-box-outline"]),
        .bubble-sub-button:has(ha-icon[icon="mdi:tune"]) {
          display: flex !important;
        }
      }
  - !include ../dashboard_cards/print_history_activity_heatmap.yaml
