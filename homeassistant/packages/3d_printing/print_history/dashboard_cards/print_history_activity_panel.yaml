type: vertical-stack
cards:
  - type: custom:config-template-card
    entities:
      - input_select.print_history_activity_metric
      - input_text.print_history_activity_selected_date
    card:
      type: custom:bubble-card
      card_type: separator
      name: Print Activity Heatmap
      icon: mdi:chart-box-outline
      sub_button:
        - entity: input_select.print_history_activity_metric
          sub_button_type: select
          name: Metric
          icon: mdi:tune-variant
          show_name: true
          show_state: true
          show_background: true
          fill_width: true
        - entity: input_text.print_history_activity_selected_date
          sub_button_type: default
          name: Selected Day
          icon: mdi:calendar-check-outline
          show_icon: true
          show_name: false
          show_state: true
          show_background: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity: input_text.print_history_activity_selected_date
              state_not: ""
        - entity: input_text.print_history_activity_selected_date
          sub_button_type: default
          name: Clear Selected Day
          icon: mdi:calendar-remove-outline
          show_icon: true
          show_name: false
          show_state: false
          show_background: true
          fill_width: false
          visibility:
            - condition: state
              entity: input_text.print_history_activity_selected_date
              state_not: ""
          tap_action:
            action: call-service
            service: input_text.set_value
            target:
              entity_id: input_text.print_history_activity_selected_date
            data:
              value: ""
      styles: |
        ha-card {
          margin-top: 8px !important;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 8px !important;
        }
  - !include ../dashboard_cards/print_history_activity_heatmap.yaml
