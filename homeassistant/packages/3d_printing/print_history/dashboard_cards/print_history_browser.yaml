  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: Compact
        icon: mdi:view-grid-outline
        tap_action:
          action: call-service
          service: input_select.select_option
          target:
            entity_id: input_select.print_history_card_variant
          data:
            option: Compact
        styles:
          card:
            - height: 52px
            - border-radius: 999px
            - background: >
                [[[
                  return states['input_select.print_history_card_variant']?.state === 'Compact'
                    ? 'color-mix(in srgb, var(--accent-color) 16%, var(--card-background-color))'
                    : 'var(--ha-card-background)';
                ]]]
          icon:
            - width: 18px
            - color: >
                [[[
                  return states['input_select.print_history_card_variant']?.state === 'Compact'
                    ? 'var(--accent-color)'
                    : 'var(--primary-text-color)';
                ]]]
          name:
            - font-size: 13px
            - font-weight: 600
      - type: custom:button-card
        name: Media
        icon: mdi:image-multiple-outline
        tap_action:
          action: call-service
          service: input_select.select_option
          target:
            entity_id: input_select.print_history_card_variant
          data:
            option: Media
        styles:
          card:
            - height: 52px
            - border-radius: 999px
            - background: >
                [[[
                  return states['input_select.print_history_card_variant']?.state === 'Media'
                    ? 'color-mix(in srgb, var(--accent-color) 16%, var(--card-background-color))'
                    : 'var(--ha-card-background)';
