# Print History Browser — bubble-card filter controls aligned to the
# Filament Catalog bar, with compact layout toggles and tighter color chips.

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    card_mod:
      style: |
        ha-card {
          margin-top: 8px !important;
        }
        {% set notice_state = state_attr('sensor.bambuddy_print_history_browser_status', 'limit_notice_state') %}
        {% if not state_attr('sensor.bambuddy_print_history_browser_status', 'limit_notice_show') %}
        .bubble-sub-button.cache-limit {
          display: none !important;
        }
        {% endif %}
        {% if notice_state == 'at_limit' %}
        .bubble-sub-button.cache-limit {
          background: rgba(198, 40, 40, 0.16) !important;
          box-shadow: inset 0 0 0 1px rgba(198, 40, 40, 0.32) !important;
        }
        .bubble-sub-button.cache-limit .bubble-sub-button-name-container {
          color: var(--primary-text-color) !important;
        }
        .bubble-sub-button.cache-limit ha-icon {
          color: #c62828 !important;
        }
        {% elif notice_state == 'near_limit' %}
        .bubble-sub-button.cache-limit {
          background: rgba(21, 101, 192, 0.14) !important;
          box-shadow: inset 0 0 0 1px rgba(21, 101, 192, 0.28) !important;
        }
        .bubble-sub-button.cache-limit .bubble-sub-button-name-container {
          color: var(--primary-text-color) !important;
        }
        .bubble-sub-button.cache-limit ha-icon {
          color: #1565c0 !important;
        }
        {% endif %}
    name: Print History Browser
    icon: mdi:history
    sub_button:
      - entity: sensor.bambuddy_print_history_browser_status
        sub_button_type: state
        name: Cache Limit
        icon: mdi:archive-alert-outline
        show_icon: true
        show_name: false
        show_state: false
        show_attribute: true
        attribute: limit_notice_chip_label
        show_background: true
        fill_width: false
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Print History Cache
              size: normal
              content:
                type: markdown
                content: >-
                  {{ state_attr('sensor.bambuddy_print_history_browser_status',
                  'limit_notice_popup_markdown') or 'No print history cache
                  warning is active right now.' }}
        hold_action:
          action: none
        double_tap_action:
          action: none
      - entity: sensor.print_history_filter_date_chip
        sub_button_type: default
        name: Date Range
        icon: mdi:calendar-range
        show_icon: true
        show_name: false
        show_state: true
        show_background: true
        fill_width: false
        visibility:
          - condition: state
            entity: sensor.print_history_filter_date_chip
            state_not: ""
      - entity: input_select.print_history_sort
        sub_button_type: select
        name: Sort
        icon: mdi:sort
        show_name: true
        show_state: true
        show_background: true
        fill_width: false
      - name: Open Bambuddy
        icon: mdi:open-in-new
        show_icon: true
        show_name: false
        show_state: false
        show_background: true
        fill_width: false
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.javascript
            data:
              code: |
                const base = hass.states['input_text.bambuddy_api_base_url']?.state || '';
                const normalized = base.endsWith('/') ? base.slice(0, -1) : base;
                const url = normalized ? `${normalized}/archives` : '';
                if (url) {
                  window.open(url, '_blank', 'noopener');
                }
        hold_action:
          action: none
        double_tap_action:
          action: none
      - name: Print History Settings
        icon: mdi:cog-outline
        show_icon: true
        show_name: false
        show_state: false
        show_background: true
        fill_width: false
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Print History Settings
              size: normal
              content:
                  type: vertical-stack
                  cards:
                    - type: markdown
                      content: |
                        Tune archive capture, browser retention, and debug behavior without exposing runtime-only workflow state.
                    - type: entities
                      title: Capture Timing
                      show_header_toggle: false
                      entities:
                        - entity: input_boolean.capture_at_start
                          name: Capture at Start
                        - entity: input_boolean.capture_at_midprint
                          name: Capture Mid-Print
                        - entity: input_number.midprint_capture_percent
                          name: Mid-Print Threshold (%)
                        - entity: input_boolean.capture_near_complete
                          name: Capture Near Complete
                        - entity: input_boolean.capture_on_complete
                          name: Capture on Complete
                        - entity: input_boolean.capture_on_error
                          name: Capture on Error
                    - type: entities
                      title: Cameras
                      show_header_toggle: false
                      entities:
                        - entity: input_text.bambuddy_capture_camera_entities
                          name: Capture Cameras
                        - entity: script.set_print_history_capture_cameras
                          name: Configure Capture Cameras
                    - type: entities
                      title: History Browser
                      show_header_toggle: false
                      entities:
                        - entity: input_boolean.bambuddy_history_sync_enabled
                          name: History Sync Enabled
                        - entity: input_number.print_history_max_archives
                          name: Max Cached Archives
                        - entity: input_number.print_history_related_candidate_limit
                          name: Related / Compare Candidate Limit
                        - entity: input_text.print_history_filter_start_date
                          name: Filter Start Date (YYYY-MM-DD)
                        - entity: input_text.print_history_filter_end_date
                          name: Filter End Date (YYYY-MM-DD)
                    - type: entities
                      title: Review and Diagnostics
                      show_header_toggle: false
                      entities:
                        - entity: input_number.photo_review_timeout_hours
                          name: Review Timeout (hrs)
                        - entity: input_boolean.print_history_debug_instrumentation
                          name: Debug Instrumentation
    styles: |
      .bubble-sub-button-container,
      .bubble-sub-buttons-container {
        gap: 8px !important;
      }
      .bubble-sub-button-icon {
        --mdc-icon-size: 18px !important;
      }
      @media (max-width: 720px) {
        .bubble-name {
          display: none !important;
        }
        .bubble-sub-button:has(ha-icon[icon="mdi:sort"]) .bubble-sub-button-name {
          display: none !important;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 6px !important;
        }
      }

  - type: custom:config-template-card
    entities:
      - input_select.print_history_filter_status
      - input_select.print_history_filter_archive_error
      - input_select.print_history_filter_enrichment_status
      - input_select.print_history_filter_material
      - input_select.print_history_filter_duplicates
      - input_select.print_history_filter_printer
      - input_select.print_history_filter_date_range
      - input_select.print_history_filter_designer
      - input_select.print_history_filter_project
      - input_select.print_history_filter_layer_height
      - sensor.print_history_filter_tags_summary
      - input_text.print_history_filter_tags
      - input_select.print_history_filter_tags_mode
      - input_boolean.print_history_filter_tags_untagged_only
      - input_boolean.print_history_filter_favorites_only
      - sensor.bambuddy_print_history_browser_filtered
    card:
      type: custom:bubble-card
      card_type: sub-buttons
      entity: sensor.bambuddy_print_history_browser_filtered
      hide_main_background: false
      rows: 1.84
      styles: |
        ha-card {
          overflow: visible !important;
          min-height: 104px !important;
          padding-top: 5px !important;
          padding-bottom: 5px !important;
        }
        .card-content.large,
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          min-height: 104px !important;
          height: 104px !important;
          gap: 6px !important;
          justify-content: flex-start !important;
          padding-bottom: 2px !important;
        }
        .bubble-sub-button-bottom-container {
          top: 12px !important;
          bottom: auto !important;
          margin-bottom: 0 !important;
        }
      sub_button:
        main: []
        bottom_layout: rows
        bottom:
          - group:
              - entity: input_select.print_history_filter_status
                sub_button_type: select
                name: Status
                icon: mdi:list-status
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_status']?.state !== (states['input_select.print_history_filter_status']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_status']?.state !== (states['input_select.print_history_filter_status']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_enrichment_status
                sub_button_type: select
                name: Enrichment
                icon: mdi:database-search-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_enrichment_status']?.state !== (states['input_select.print_history_filter_enrichment_status']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_enrichment_status']?.state !== (states['input_select.print_history_filter_enrichment_status']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_material
                sub_button_type: select
                name: Material
                icon: mdi:flask-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_material']?.state !== (states['input_select.print_history_filter_material']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_material']?.state !== (states['input_select.print_history_filter_material']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_duplicates
                sub_button_type: select
                name: Duplicates
                icon: mdi:content-copy
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_duplicates']?.state !== (states['input_select.print_history_filter_duplicates']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_duplicates']?.state !== (states['input_select.print_history_filter_duplicates']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_printer
                sub_button_type: select
                name: Printer
                icon: mdi:printer-3d-nozzle
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_printer']?.state !== (states['input_select.print_history_filter_printer']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_printer']?.state !== (states['input_select.print_history_filter_printer']?.attributes?.options?.[0] ?? '')}
                fill_width: true
            buttons_layout: inline
            justify_content: fill
          - group:
              - entity: input_select.print_history_filter_designer
                sub_button_type: select
                name: Designer
                icon: mdi:palette-swatch-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_designer']?.state !== (states['input_select.print_history_filter_designer']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_designer']?.state !== (states['input_select.print_history_filter_designer']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_archive_error
                sub_button_type: select
                name: Archive Issue
                icon: mdi:alert-circle-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_archive_error']?.state !== (states['input_select.print_history_filter_archive_error']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_archive_error']?.state !== (states['input_select.print_history_filter_archive_error']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_project
                sub_button_type: select
                name: Project
                icon: mdi:folder-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_project']?.state !== (states['input_select.print_history_filter_project']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_project']?.state !== (states['input_select.print_history_filter_project']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_layer_height
                sub_button_type: select
                name: Layer Height
                icon: mdi:layers-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_layer_height']?.state !== (states['input_select.print_history_filter_layer_height']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_layer_height']?.state !== (states['input_select.print_history_filter_layer_height']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: sensor.print_history_filter_tags_summary
                sub_button_type: default
                name: Tag
                icon: mdi:tag-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['sensor.print_history_filter_tags_summary']?.state !== 'All'}
                state_color: ${states['sensor.print_history_filter_tags_summary']?.state !== 'All'}
                fill_width: true
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Tag Filters
                      content:
                        type: custom:config-template-card
                        entities:
                          - input_text.print_history_filter_tags
                          - input_select.print_history_filter_tags_mode
                          - input_boolean.print_history_filter_tags_untagged_only
                          - sensor.print_history_filter_tags_summary
                        card:
                          type: vertical-stack
                          cards:
                            - type: custom:print-history-tag-editor-card
                              entity: input_text.print_history_filter_tags
                              suggestions_entity: input_select.print_history_filter_tag
                              mode_entity: input_select.print_history_filter_tags_mode
                              title: Selected Tags
                              placeholder: Filter by tag and press Enter
                              helper: Choose one or more tags. Untagged is a separate toggle.
                            - type: grid
                              columns: 2
                              square: false
                              cards:
                                - type: custom:button-card
                                  entity: input_boolean.print_history_filter_tags_untagged_only
                                  name: Untagged
                                  icon: mdi:tag-off-outline
                                  show_state: false
                                  tap_action:
                                    action: toggle
                                  styles:
                                    card:
                                      - padding: 8px 12px
                                      - border-radius: 999px
                                      - border: >-
                                          [[[ return entity && entity.state === 'on'
                                            ? '1px solid rgba(255,255,255,0.18)'
                                            : '1px solid rgba(255,255,255,0.08)'; ]]]
                                      - background: >-
                                          [[[ return entity && entity.state === 'on'
                                            ? 'rgba(239,108,0,0.24)'
                                            : 'rgba(255,255,255,0.04)'; ]]]
                                      - box-shadow: none
                                    grid:
                                      - grid-template-areas: '"i n"'
                                      - grid-template-columns: min-content 1fr
                                      - align-items: center
                                      - column-gap: 8px
                                    icon:
                                      - color: >-
                                          [[[ return entity && entity.state === 'on'
                                            ? '#ffcc80'
                                            : 'var(--secondary-text-color)'; ]]]
                                      - width: 18px
                                    name:
                                      - justify-self: start
                                      - color: var(--primary-text-color)
                                      - font-size: 12px
                                      - font-weight: 600
                                - type: custom:button-card
                                  entity: sensor.print_history_filter_tags_summary
                                  name: Clear Tags
                                  icon: mdi:tag-remove-outline
                                  show_state: false
                                  tap_action:
                                    action: call-service
                                    service: script.clear_print_history_tag_filter
                                  styles:
                                    card:
                                      - padding: 8px 12px
                                      - border-radius: 999px
                                      - border: 1px solid rgba(255,255,255,0.08)
                                      - background: rgba(255,255,255,0.04)
                                      - box-shadow: none
                                    grid:
                                      - grid-template-areas: '"i n"'
                                      - grid-template-columns: min-content 1fr
                                      - align-items: center
                                      - column-gap: 8px
                                    icon:
                                      - color: var(--secondary-text-color)
                                      - width: 16px
                                    name:
                                      - justify-self: start
                                      - color: var(--primary-text-color)
                                      - font-size: 11px
                                      - font-weight: 600
              - entity: input_boolean.print_history_filter_favorites_only
                name: Favorites
                icon: mdi:star
                show_name: true
                show_state: false
                show_background: true
                state_background: ${states['input_boolean.print_history_filter_favorites_only']?.state === 'on'}
                state_color: ${states['input_boolean.print_history_filter_favorites_only']?.state === 'on'}
                tap_action:
                  action: toggle
                fill_width: true
            buttons_layout: inline
            justify_content: fill

  - type: horizontal-stack
    cards:
      - type: entities
        show_header_toggle: false
        card_mod:
          style:
            .: |
              ha-card {
                border-radius: 999px !important;
                overflow: visible !important;
                padding: 6px 10px !important;
              }
              #states {
                padding: 0 !important;
              }
            hui-input-text-entity-row $ ha-textfield $ ha-input $ wa-input $: |
              .control::placeholder {
                color: transparent !important;
              }
              .text-field:focus-within .control::placeholder {
                color: var(--secondary-text-color) !important;
              }
        entities:
          - entity: input_text.print_history_search
            name: Search Prints
            secondary_info: none
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
      - type: custom:config-template-card
        entities:
          - input_select.print_history_filter_status
          - input_select.print_history_filter_archive_error
          - input_select.print_history_filter_enrichment_status
          - input_select.print_history_filter_material
          - input_select.print_history_filter_duplicates
          - input_select.print_history_filter_printer
          - input_select.print_history_filter_designer
          - input_select.print_history_filter_project
          - input_select.print_history_filter_layer_height
          - sensor.print_history_filter_tags_summary
          - input_text.print_history_filter_tags
          - input_select.print_history_filter_tags_mode
          - input_boolean.print_history_filter_tags_untagged_only
          - input_boolean.print_history_filter_favorites_only
          - input_text.print_history_search
          - input_text.print_history_filter_colors
          - input_text.print_history_activity_selected_date
          - sensor.bambuddy_print_history_browser_filtered
        card:
          type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.bambuddy_print_history_browser_filtered
          name: Prints
          icon: mdi:counter
          show_name: true
          show_state: true
          styles: >-
            ${(() => {
              const selectIds = ['input_select.print_history_filter_status','input_select.print_history_filter_archive_error','input_select.print_history_filter_enrichment_status','input_select.print_history_filter_material','input_select.print_history_filter_duplicates','input_select.print_history_filter_printer','input_select.print_history_filter_designer','input_select.print_history_filter_project','input_select.print_history_filter_layer_height'];
              const hasSelectFilter = selectIds.some((id) => (states[id]?.state || 'All') !== 'All');
              const hasDateRangeFilter = (states['input_select.print_history_filter_date_range']?.state || 'All Time') !== 'All Time';
              const hasTagFilter = ((states['input_text.print_history_filter_tags']?.state || '').trim().length > 0) || ((states['input_select.print_history_filter_tags_mode']?.state || 'Any') !== 'Any') || (states['input_boolean.print_history_filter_tags_untagged_only']?.state === 'on');
              const hasFavoritesFilter = states['input_boolean.print_history_filter_favorites_only']?.state === 'on';
              const hasSearchFilter = ((states['input_text.print_history_search']?.state || '').trim().length > 0);
              const hasColorFilter = ((states['input_text.print_history_filter_colors']?.state || '').trim().length > 0);
              const hasSelectedDayFilter = ((states['input_text.print_history_activity_selected_date']?.state || '').trim().length > 0);
              const active = hasSelectFilter || hasDateRangeFilter || hasTagFilter || hasFavoritesFilter || hasSearchFilter || hasColorFilter || hasSelectedDayFilter;
              return `
                .bubble-button-card-container {
                  pointer-events: none !important;
                  cursor: default !important;
                }
                .bubble-sub-button-container,
                .bubble-sub-buttons-container {
                  pointer-events: auto !important;
                  justify-content: flex-start !important;
                  gap: 6px !important;
                }
                .bubble-sub-button {
                  pointer-events: auto !important;
                }
                .bubble-sub-button.clear-status-filter,
                .bubble-sub-button.clear-archive-error-filter,
                .bubble-sub-button.clear-enrichment-filter,
                .bubble-sub-button.clear-material-filter,
                .bubble-sub-button.clear-printer-filter,
                .bubble-sub-button.clear-date-filter,
                .bubble-sub-button.clear-designer-filter,
                .bubble-sub-button.clear-project-filter,
                .bubble-sub-button.clear-layer-filter,
                .bubble-sub-button.clear-tag-filter,
                .bubble-sub-button.clear-favorites-filter,
                .bubble-sub-button.clear-search-filter,
                .bubble-sub-button.clear-colors-filter,
                .bubble-sub-button.clear-selected-day-filter {
                  background-color: color-mix(in srgb, var(--accent-color) 18%, var(--card-background-color)) !important;
                  color: var(--accent-color) !important;
                  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-color) 55%, transparent) !important;
                }
                .bubble-sub-button.clear-status-filter ha-icon,
                .bubble-sub-button.clear-archive-error-filter ha-icon,
                .bubble-sub-button.clear-enrichment-filter ha-icon,
                .bubble-sub-button.clear-material-filter ha-icon,
                .bubble-sub-button.clear-printer-filter ha-icon,
                .bubble-sub-button.clear-date-filter ha-icon,
                .bubble-sub-button.clear-designer-filter ha-icon,
                .bubble-sub-button.clear-project-filter ha-icon,
                .bubble-sub-button.clear-layer-filter ha-icon,
                .bubble-sub-button.clear-tag-filter ha-icon,
                .bubble-sub-button.clear-favorites-filter ha-icon,
                .bubble-sub-button.clear-search-filter ha-icon,
                .bubble-sub-button.clear-colors-filter ha-icon,
                .bubble-sub-button.clear-selected-day-filter ha-icon {
                  color: var(--accent-color) !important;
                }
                ${active ? `
                .bubble-sub-button:last-child {
                  background-color: color-mix(in srgb, var(--accent-color) 18%, var(--card-background-color)) !important;
                  color: var(--accent-color) !important;
                  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-color) 55%, transparent) !important;
                }
                .bubble-sub-button:last-child ha-icon {
                  color: var(--accent-color) !important;
                }
                ` : ''}
              `;
            })()}
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          sub_button:
            - entity: input_select.print_history_filter_status
              sub_button_type: default
              name: Clear Status Filter
              icon: mdi:list-status
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_select.print_history_filter_status
                  state_not: "All"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.print_history_filter_status
                data:
