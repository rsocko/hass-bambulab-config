# Print History Browser — always-visible search, filter, layout, and settings
# controls styled to align with the Filament Catalog control bar.

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Print History Browser
    icon: mdi:history
    sub_button:
      - name: Open Bambuddy
        icon: mdi:open-in-new
        show_icon: true
        show_name: false
        show_state: false
        show_background: true
        fill_width: false
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Bambuddy Archives
              size: wide
              content:
                type: custom:config-template-card
                entities:
                  - input_text.bambuddy_api_base_url
                variables:
                  _bambuddyArchivesUrl: >-
                    ${(() => {
                      const entity = states['input_text.bambuddy_api_base_url'];
                      const base = entity && entity.state ? entity.state : '';
                      if (!base) return 'about:blank';
                      return (base.endsWith('/') ? base.slice(0, -1) : base) + '/archives';
                    })()}
                card:
                  type: iframe
                  url: "${_bambuddyArchivesUrl}"
                  aspect_ratio: 75%
      - name: Print History Settings
        icon: mdi:cog-outline
        show_icon: true
        show_name: false
        show_state: false
        show_background: true
        fill_width: false
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Print History Settings
              size: normal
              content:
                type: entities
                show_header_toggle: false
                entities:
                  - entity: input_boolean.capture_at_start
                    name: At Start
                  - entity: input_boolean.capture_at_midprint
                    name: Mid-Print
                  - entity: input_boolean.capture_near_complete
                    name: Near Complete
                  - entity: input_boolean.capture_on_error
                    name: On Error
                  - type: divider
                  - entity: input_number.midprint_capture_percent
                    name: Mid-Print %
                  - entity: input_select.secondary_camera_entity
                    name: Secondary Camera
                  - type: divider
                  - entity: input_boolean.bambuddy_history_fetch_enabled
                    name: Auto-Fetch History
                  - entity: input_number.print_history_max_archives
                    name: Max Cached
                  - entity: input_number.photo_review_timeout_hours
                    name: Review Timeout (hrs)
    styles: |
      .bubble-sub-button-container,
      .bubble-sub-buttons-container {
        gap: 8px !important;
      }
      .bubble-sub-button {
        width: 36px !important;
        height: 36px !important;
        min-width: 36px !important;
        min-height: 36px !important;
      }
      .bubble-sub-button-icon {
        --mdc-icon-size: 18px !important;
      }

  - type: horizontal-stack
    cards:
      - type: entities
        show_header_toggle: false
        card_mod:
          style:
            .: |
              ha-card {
                border-radius: 999px !important;
                overflow: hidden !important;
                padding: 6px 10px !important;
              }
              #states {
                padding: 0 !important;
              }
            hui-input-text-entity-row $ ha-textfield $: |
              .mdc-text-field {
                width: 95% !important;
              }
              .mdc-text-field--filled {
                height: 45px !important;
                --mdc-filled-text-field-container-height: 45px;
                display: flex !important;
                align-items: center !important;
              }
              .mdc-text-field__input {
                padding-top: 12px !important;
                padding-bottom: 2px !important;
                margin-top: 0 !important;
                align-self: center !important;
              }
              .mdc-floating-label {
                top: 50% !important;
                transform: translateY(-50%) !important;
              }
              .mdc-floating-label--float-above {
                top: 5px !important;
                transform: translateY(0) scale(0.75) !important;
              }
        entities:
          - entity: input_text.print_history_search
            name: Search Prints
            secondary_info: none
      - type: custom:button-card
        entity: sensor.print_history_filtered
        name: Matches
        icon: mdi:counter
        show_state: true
        tap_action:
          action: none
        styles:
          card:
            - height: 58px
            - border-radius: 999px
            - padding: 0 16px
            - background: var(--ha-card-background)
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 28px 1fr
          name:
            - justify-self: start
            - align-self: end
            - font-size: 12px
            - color: var(--secondary-text-color)
          state:
            - justify-self: start
            - align-self: start
            - font-size: 16px
            - font-weight: 700
          icon:
            - width: 18px
            - color: var(--accent-color)

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        entity: input_select.print_history_filter_status
        name: Status
        icon: mdi:list-status
        show_state: true
