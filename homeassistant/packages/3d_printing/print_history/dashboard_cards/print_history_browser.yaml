          icon:
            - width: 18px
            - color: >
                [[[
                  return states['input_select.print_history_card_variant']?.state === 'Media'
                    ? 'var(--accent-color)'
                    : 'var(--primary-text-color)';
                ]]]
          name:
            - font-size: 13px
            - font-weight: 600
      - type: custom:button-card
        name: Detail
        icon: mdi:format-list-bulleted
        tap_action:
          action: call-service
          service: input_select.select_option
          target:
            entity_id: input_select.print_history_card_variant
          data:
            option: Detail
        styles:
          card:
            - height: 52px
            - border-radius: 999px
            - background: >
                [[[
                  return states['input_select.print_history_card_variant']?.state === 'Detail'
                    ? 'color-mix(in srgb, var(--accent-color) 16%, var(--card-background-color))'
                    : 'var(--ha-card-background)';
                ]]]
          icon:
            - width: 18px
            - color: >
                [[[
                  return states['input_select.print_history_card_variant']?.state === 'Detail'
                    ? 'var(--accent-color)'
                    : 'var(--primary-text-color)';
                ]]]
          name:
            - font-size: 13px
            - font-weight: 600
      - type: entities
        show_header_toggle: false
        card_mod:
          style: |
            ha-card {
              border-radius: 28px !important;
              padding: 2px 10px !important;
            }
            #states {
              padding-top: 0 !important;
              padding-bottom: 0 !important;
            }
        entities:
          - entity: input_number.print_history_page_size
            name: Items Per Page

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.print_history_filtered
        name: Clear
        icon: mdi:filter-remove-outline
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.clear_print_history_filters
        styles:
          card:
            - height: 46px
            - border-radius: 999px
            - background: >
                [[[
                  return entity?.attributes?.has_active_filters === true || entity?.attributes?.has_active_filters === 'True'
                    ? 'color-mix(in srgb, var(--accent-color) 18%, var(--card-background-color))'
                    : 'var(--ha-card-background)';
                ]]]
          icon:
            - width: 18px
            - color: >
                [[[
                  return entity?.attributes?.has_active_filters === true || entity?.attributes?.has_active_filters === 'True'
                    ? 'var(--accent-color)'
                    : 'var(--primary-text-color)';
                ]]]
          name:
            - font-size: 13px
            - font-weight: 600
      - type: custom:button-card
        name: Refresh
        icon: mdi:refresh
        tap_action:
          action: perform-action
          perform_action: script.refresh_print_history_archives
        styles:
          card:
            - height: 46px
            - border-radius: 999px
            - background: var(--ha-card-background)
          name:
            - font-size: 13px
            - font-weight: 600

  - type: custom:button-card
    entity: sensor.print_history_filtered
    name: Active Filters
    show_icon: false
    show_state: false
    custom_fields:
      summary: >
        [[[
          return entity?.attributes?.active_filters || 'No active filters';
        ]]]
    styles:
      card:
        - border-radius: 28px
        - padding: 12px 16px
        - background: var(--ha-card-background)
      name:
        - justify-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
      custom_fields:
        summary:
          - justify-self: start
          - font-size: 14px
          - font-weight: 600

  - type: custom:auto-entities
    show_empty: false
    card:
      type: grid
      columns: 8
      square: false
      card_mod:
        style: |
          @media (max-width: 768px) {
            #root {
              grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
            }
          }
    card_param: cards
    filter:
      template: >
        {% set raw = state_attr('sensor.print_history_filtered', 'available_colors_json') | default([], true) %}
        {% if raw is string %}
          {% set colors = raw | from_json %}
        {% elif raw is iterable %}
          {% set colors = raw | list %}
        {% else %}
          {% set colors = [] %}
        {% endif %}
        {% set selected = states('input_text.print_history_filter_colors').split(',') | map('trim') | reject('eq', '') | map('lower') | list %}
        {% set cards = namespace(items=[]) %}
        {% for color in colors %}
          {% if color is string and color is match('^#[0-9A-Fa-f]{6}$') %}
            {% set is_active = (color | lower) in selected %}
            {% set cards.items = cards.items + [{
              'type': 'button',
              'icon': 'mdi:circle',
              'tap_action': {
                'action': 'perform-action',
                'perform_action': 'script.toggle_print_history_color_filter',
                'data': {'color': color}
              },
              'card_mod': {
                'style': 'ha-card { min-height: 42px; border-radius: 999px; padding: 0; background: var(--ha-card-background); box-shadow: ' ~ ('0 0 0 3px var(--accent-color), inset 0 0 0 1px rgba(255,255,255,0.28)' if is_active else 'inset 0 0 0 1px rgba(255,255,255,0.18)') ~ '; } ha-state-icon { color: ' ~ color ~ ' !important; }'
              }
            }] %}
          {% endif %}
        {% endfor %}
        {{ cards.items | tojson }}
