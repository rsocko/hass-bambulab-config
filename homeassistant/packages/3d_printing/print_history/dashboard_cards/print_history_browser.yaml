# Print History Browser — bubble-card filter controls aligned to the
# Filament Catalog bar, with compact layout toggles and tighter color chips.

type: vertical-stack
cards:
  - type: custom:config-template-card
    entities:
      - input_select.print_history_sort
    card:
      type: custom:bubble-card
      card_type: separator
      name: Print History Browser
      icon: mdi:history
      sub_button:
        - entity: input_select.print_history_sort
          sub_button_type: select
          name: Sort
          icon: mdi:sort
          show_name: true
          show_state: true
          show_background: true
          fill_width: false
        - name: Open Bambuddy
          icon: mdi:open-in-new
          show_icon: true
          show_name: false
          show_state: false
          show_background: true
          fill_width: false
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: browser_mod.javascript
              data:
                code: |
                  const base = hass.states['input_text.bambuddy_api_base_url']?.state || '';
                  const normalized = base.endsWith('/') ? base.slice(0, -1) : base;
                  const url = normalized ? `${normalized}/archives` : '';
                  if (url) {
                    window.open(url, '_blank', 'noopener');
                  }
          hold_action:
            action: none
          double_tap_action:
            action: none
        - name: Print History Settings
          icon: mdi:cog-outline
          show_icon: true
          show_name: false
          show_state: false
          show_background: true
          fill_width: false
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: browser_mod.popup
              data:
                title: Print History Settings
                size: normal
                content:
                  type: entities
                  show_header_toggle: false
                  entities:
                    - entity: input_boolean.capture_at_start
                      name: At Start
                    - entity: input_boolean.capture_at_midprint
                      name: Mid-Print
                    - entity: input_boolean.capture_near_complete
                      name: Near Complete
                    - entity: input_boolean.capture_on_complete
                      name: On Complete
                    - entity: input_boolean.capture_on_error
                      name: On Error
                    - type: divider
                    - entity: input_number.midprint_capture_percent
                      name: Mid-Print %
                    - entity: input_select.secondary_camera_entity
                      name: Secondary Camera
                    - type: divider
                    - entity: input_boolean.bambuddy_history_sync_enabled
                      name: History Sync
                    - entity: input_number.print_history_max_archives
                      name: Max Cached
                    - entity: input_number.photo_review_timeout_hours
                      name: Review Timeout (hrs)
      styles: |
        ha-card {
          margin-top: 8px !important;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 8px !important;
        }
        .bubble-sub-button {
          width: 36px !important;
          height: 36px !important;
          min-width: 36px !important;
          min-height: 36px !important;
        }
        .bubble-sub-button-icon {
          --mdc-icon-size: 18px !important;
        }

  - type: custom:config-template-card
    entities:
      - input_select.print_history_filter_status
      - input_select.print_history_filter_material
      - input_select.print_history_filter_printer
      - input_select.print_history_filter_date_range
      - input_select.print_history_filter_designer
      - input_select.print_history_filter_layer_height
      - input_select.print_history_filter_tag
      - input_boolean.print_history_filter_favorites_only
      - sensor.print_history_filtered
    card:
      type: custom:bubble-card
      card_type: sub-buttons
      entity: sensor.print_history_filtered
      hide_main_background: false
      rows: 1.84
      styles: |
        ha-card {
          padding-top: 4px !important;
          padding-bottom: 6px !important;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 6px !important;
        }
      sub_button:
        main: []
        bottom_layout: rows
        bottom:
          - group:
              - entity: input_select.print_history_filter_status
                sub_button_type: select
                name: Status
                icon: mdi:list-status
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_status']?.state !== (states['input_select.print_history_filter_status']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_status']?.state !== (states['input_select.print_history_filter_status']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_material
                sub_button_type: select
                name: Material
                icon: mdi:flask-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_material']?.state !== (states['input_select.print_history_filter_material']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_material']?.state !== (states['input_select.print_history_filter_material']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_printer
                sub_button_type: select
                name: Printer
                icon: mdi:printer-3d-nozzle
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_printer']?.state !== (states['input_select.print_history_filter_printer']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_printer']?.state !== (states['input_select.print_history_filter_printer']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_date_range
                sub_button_type: select
                name: Date
                icon: mdi:calendar-range
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_date_range']?.state !== 'All Time'}
                state_color: ${states['input_select.print_history_filter_date_range']?.state !== 'All Time'}
                fill_width: true
            buttons_layout: inline
            justify_content: fill
          - group:
              - entity: input_select.print_history_filter_designer
                sub_button_type: select
                name: Designer
                icon: mdi:palette-swatch-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_designer']?.state !== (states['input_select.print_history_filter_designer']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_designer']?.state !== (states['input_select.print_history_filter_designer']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_layer_height
                sub_button_type: select
                name: Layer Height
                icon: mdi:layers-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_layer_height']?.state !== (states['input_select.print_history_filter_layer_height']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_layer_height']?.state !== (states['input_select.print_history_filter_layer_height']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.print_history_filter_tag
                sub_button_type: select
                name: Tag
                icon: mdi:tag-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.print_history_filter_tag']?.state !== (states['input_select.print_history_filter_tag']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.print_history_filter_tag']?.state !== (states['input_select.print_history_filter_tag']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_boolean.print_history_filter_favorites_only
                name: Favorites
                icon: mdi:star
                show_name: true
                show_state: false
                show_background: true
                state_background: ${states['input_boolean.print_history_filter_favorites_only']?.state === 'on'}
                state_color: ${states['input_boolean.print_history_filter_favorites_only']?.state === 'on'}
                tap_action:
                  action: toggle
                fill_width: true
            buttons_layout: inline
            justify_content: fill

  - type: horizontal-stack
    cards:
      - type: entities
        show_header_toggle: false
        card_mod:
          style:
            .: |
              ha-card {
                border-radius: 999px !important;
                overflow: hidden !important;
                padding: 6px 10px !important;
              }
              #states {
                padding: 0 !important;
              }
            hui-input-text-entity-row $ ha-textfield $: |
              .mdc-text-field {
                width: 95% !important;
              }
              .mdc-text-field--filled {
                height: 45px !important;
                --mdc-filled-text-field-container-height: 45px;
                display: flex !important;
                align-items: center !important;
              }
              .mdc-text-field__input {
                padding-top: 12px !important;
                padding-bottom: 2px !important;
                margin-top: 0 !important;
                align-self: center !important;
              }
              .mdc-floating-label {
                top: 50% !important;
                transform: translateY(-50%) !important;
              }
              .mdc-floating-label--float-above {
                top: 5px !important;
                transform: translateY(0) scale(0.75) !important;
              }
        entities:
          - entity: input_text.print_history_search
            name: Search Prints
            secondary_info: none
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
      - type: custom:config-template-card
        entities:
          - input_select.print_history_filter_status
          - input_select.print_history_filter_material
          - input_select.print_history_filter_printer
          - input_select.print_history_filter_date_range
          - input_select.print_history_filter_designer
          - input_select.print_history_filter_layer_height
          - input_select.print_history_filter_tag
          - input_boolean.print_history_filter_favorites_only
          - input_text.print_history_search
          - input_text.print_history_filter_colors
          - input_text.print_history_activity_selected_date
          - sensor.print_history_filtered
        card:
          type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.print_history_filtered
          name: Matches
          icon: mdi:counter
          show_name: true
          show_state: true
          styles: >-
            ${(() => {
              const active = states['sensor.print_history_filtered']?.attributes?.has_active_filters === true || states['sensor.print_history_filtered']?.attributes?.has_active_filters === 'True';
              return `
                .bubble-button-card-container {
                  pointer-events: none !important;
                  cursor: default !important;
                }
                .bubble-sub-button-container,
                .bubble-sub-buttons-container {
                  pointer-events: auto !important;
                  justify-content: flex-start !important;
                  gap: 6px !important;
                }
                .bubble-sub-button {
                  pointer-events: auto !important;
                }
                .bubble-sub-button.clear-status-filter,
                .bubble-sub-button.clear-material-filter,
                .bubble-sub-button.clear-printer-filter,
                .bubble-sub-button.clear-date-filter,
                .bubble-sub-button.clear-designer-filter,
                .bubble-sub-button.clear-layer-filter,
                .bubble-sub-button.clear-tag-filter,
                .bubble-sub-button.clear-favorites-filter,
                .bubble-sub-button.clear-search-filter,
                .bubble-sub-button.clear-colors-filter,
                .bubble-sub-button.clear-selected-day-filter {
                  background-color: color-mix(in srgb, var(--accent-color) 18%, var(--card-background-color)) !important;
                  color: var(--accent-color) !important;
                  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-color) 55%, transparent) !important;
                }
                .bubble-sub-button.clear-status-filter ha-icon,
                .bubble-sub-button.clear-material-filter ha-icon,
                .bubble-sub-button.clear-printer-filter ha-icon,
                .bubble-sub-button.clear-date-filter ha-icon,
                .bubble-sub-button.clear-designer-filter ha-icon,
                .bubble-sub-button.clear-layer-filter ha-icon,
                .bubble-sub-button.clear-tag-filter ha-icon,
                .bubble-sub-button.clear-favorites-filter ha-icon,
                .bubble-sub-button.clear-search-filter ha-icon,
                .bubble-sub-button.clear-colors-filter ha-icon,
                .bubble-sub-button.clear-selected-day-filter ha-icon {
                  color: var(--accent-color) !important;
                }
                ${active ? `
                .bubble-sub-button:last-child {
                  background-color: color-mix(in srgb, var(--accent-color) 18%, var(--card-background-color)) !important;
                  color: var(--accent-color) !important;
                  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-color) 55%, transparent) !important;
                }
                .bubble-sub-button:last-child ha-icon {
                  color: var(--accent-color) !important;
                }
                ` : ''}
              `;
            })()}
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          sub_button:
            - entity: input_select.print_history_filter_status
              sub_button_type: default
              name: Clear Status Filter
              icon: mdi:list-status
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_select.print_history_filter_status
                  state_not: "All"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.print_history_filter_status
                data:
                  option: "All"
            - entity: input_select.print_history_filter_material
              sub_button_type: default
              name: Clear Material Filter
              icon: mdi:flask-outline
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_select.print_history_filter_material
                  state_not: "All"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.print_history_filter_material
                data:
                  option: "All"
            - entity: input_select.print_history_filter_printer
              sub_button_type: default
              name: Clear Printer Filter
              icon: mdi:printer-3d-nozzle
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_select.print_history_filter_printer
                  state_not: "All"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.print_history_filter_printer
                data:
                  option: "All"
            - entity: input_select.print_history_filter_date_range
              sub_button_type: default
              name: Clear Date Filter
              icon: mdi:calendar-range
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_select.print_history_filter_date_range
                  state_not: "All Time"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.print_history_filter_date_range
                data:
                  option: "All Time"
            - entity: input_select.print_history_filter_designer
              sub_button_type: default
              name: Clear Designer Filter
              icon: mdi:palette-swatch-outline
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_select.print_history_filter_designer
                  state_not: "All"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.print_history_filter_designer
                data:
                  option: "All"
            - entity: input_select.print_history_filter_layer_height
              sub_button_type: default
              name: Clear Layer Filter
              icon: mdi:layers-outline
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_select.print_history_filter_layer_height
                  state_not: "All"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.print_history_filter_layer_height
                data:
                  option: "All"
            - entity: input_select.print_history_filter_tag
              sub_button_type: default
              name: Clear Tag Filter
              icon: mdi:tag-remove-outline
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity_id: input_select.print_history_filter_tag
                  state_not: "All"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.print_history_filter_tag
                data:
                  option: "All"
            - entity: input_boolean.print_history_filter_favorites_only
              sub_button_type: default
              name: Clear Favorites Filter
              icon: mdi:star-off-outline
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_boolean.print_history_filter_favorites_only
                  state: "on"
              tap_action:
                action: call-service
                service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.print_history_filter_favorites_only
            - entity: input_text.print_history_search
              sub_button_type: default
              name: Clear Search Filter
              icon: mdi:magnify-remove-outline
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_text.print_history_search
                  state_not: ""
              tap_action:
                action: call-service
                service: input_text.set_value
                target:
                  entity_id: input_text.print_history_search
                data:
                  value: ""
            - entity: input_text.print_history_filter_colors
              sub_button_type: default
              name: Clear Colors Filter
              icon: mdi:palette
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_text.print_history_filter_colors
                  state_not: ""
              tap_action:
                action: call-service
                service: input_text.set_value
                target:
                  entity_id: input_text.print_history_filter_colors
                data:
                  value: ""
            - entity: input_text.print_history_activity_selected_date
              sub_button_type: default
              name: Clear Selected Day Filter
              icon: mdi:calendar-remove-outline
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_text.print_history_activity_selected_date
                  state_not: ""
              tap_action:
                action: call-service
                service: input_text.set_value
                target:
                  entity_id: input_text.print_history_activity_selected_date
                data:
                  value: ""
            - name: Clear Filters
              icon: mdi:filter-remove
              show_name: true
              show_background: ${!!(states['sensor.print_history_filtered']?.attributes?.has_active_filters === true || states['sensor.print_history_filtered']?.attributes?.has_active_filters === 'True')}
              state_background: ${!!(states['sensor.print_history_filtered']?.attributes?.has_active_filters === true || states['sensor.print_history_filtered']?.attributes?.has_active_filters === 'True')}
              state_color: ${!!(states['sensor.print_history_filtered']?.attributes?.has_active_filters === true || states['sensor.print_history_filtered']?.attributes?.has_active_filters === 'True')}
              tap_action:
                action: call-service
                service: script.clear_print_history_filters

  - type: custom:print-history-color-filter-card
    colors_entity: sensor.print_history_filtered
    colors_attribute: available_colors_json
    selected_entity: input_text.print_history_filter_colors
    toggle_script: script.toggle_print_history_color_filter
    slot_size: 38
    ring_size: 30
    fill_size: 22
    selected_border_width: 3
    unselected_border_width: 1
    gap: 2
    mobile_gap: 2
