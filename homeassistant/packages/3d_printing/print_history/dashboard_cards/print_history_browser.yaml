# Print History Browser — toolbar, popup controls, and Layer 2 pagination.
# Uses browser_mod popups for browse/settings controls and the Layer 2 browser
# state for page navigation.

type: vertical-stack
cards:
  - type: markdown
    content: >-
      **{{ states('sensor.print_history_filtered') | int(0) }} matches**
      · Sort: {{ states('input_select.print_history_sort') }}
      · Layout: {{ states('input_select.print_history_card_variant') }}

      {{ state_attr('sensor.print_history_filtered', 'active_filters') }}
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: Filter
        icon: mdi:filter-variant
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Print History Filters
              size: normal
              content:
                type: entities
                show_header_toggle: false
                entities:
                  - entity: input_text.print_history_search
                    name: Search
                  - entity: input_select.print_history_filter_status
                    name: Status
                  - entity: input_select.print_history_filter_material
                    name: Material
                  - entity: input_select.print_history_filter_color
                    name: Color
                  - entity: input_select.print_history_filter_printer
                    name: Printer
                  - entity: input_select.print_history_filter_date_range
                    name: Date Range
                  - entity: input_select.print_history_filter_favorites
                    name: Favorites
                  - entity: input_select.print_history_filter_designer
                    name: Designer
                  - entity: input_select.print_history_filter_layer_height
                    name: Layer Height
        styles:
          card:
            - height: 40px
            - background: var(--ha-card-background)
          name:
            - font-size: 13px
      - type: custom:button-card
        name: Sort
        icon: mdi:sort
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Print History Sort
              size: normal
              content:
                type: entities
                show_header_toggle: false
                entities:
                  - entity: input_select.print_history_sort
                    name: Sort Order
                  - entity: input_number.print_history_page_size
                    name: Page Size
        styles:
          card:
            - height: 40px
            - background: var(--ha-card-background)
          name:
            - font-size: 13px
      - type: custom:button-card
        name: Layout
        icon: mdi:view-grid-outline
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Print History Layout
              size: normal
              content:
                type: entities
                show_header_toggle: false
                entities:
                  - entity: input_select.print_history_card_variant
                    name: Card Variant
        styles:
          card:
            - height: 40px
            - background: var(--ha-card-background)
          name:
            - font-size: 13px
      - type: custom:button-card
        name: Settings
        icon: mdi:cog-outline
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Print History Settings
              size: normal
              content:
                type: entities
                show_header_toggle: false
                entities:
                  - entity: input_boolean.capture_at_start
                    name: At Start
                  - entity: input_boolean.capture_at_midprint
                    name: Mid-Print
                  - entity: input_boolean.capture_near_complete
                    name: Near Complete
                  - entity: input_boolean.capture_on_error
                    name: On Error
                  - type: divider
                  - entity: input_number.midprint_capture_percent
                    name: Mid-Print %
                  - entity: input_select.secondary_camera_entity
                    name: Secondary Camera
                  - type: divider
                  - entity: input_boolean.bambuddy_history_fetch_enabled
                    name: Auto-Fetch History
                  - entity: input_number.print_history_max_archives
                    name: Max Cached
                  - entity: input_number.photo_review_timeout_hours
                    name: Review Timeout (hrs)
        styles:
          card:
            - height: 40px
            - background: var(--ha-card-background)
          name:
            - font-size: 13px

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: Clear
        icon: mdi:filter-remove-outline
        tap_action:
          action: perform-action
          perform_action: script.clear_print_history_filters
        styles:
          card:
            - height: 36px
            - background: var(--ha-card-background)
            - font-size: 12px
          icon:
            - width: 18px
      - type: custom:button-card
        name: Refresh
        icon: mdi:refresh
        tap_action:
          action: perform-action
          perform_action: script.refresh_print_history_archives
        styles:
          card:
            - height: 36px
            - background: var(--ha-card-background)
            - font-size: 12px
          icon:
            - width: 18px
      - type: entity
        entity: sensor.print_history_page_info
        name: Browser
      - type: entity
        entity: input_number.print_history_page_size
        name: Page Size

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: "⏮"
        tap_action:
          action: perform-action
          perform_action: script.navigate_history
          data:
            direction: first
        styles:
          card:
            - height: 40px
            - background: var(--ha-card-background)
          name:
            - font-size: 18px
      - type: custom:button-card
        name: "◀"
        tap_action:
          action: perform-action
          perform_action: script.navigate_history
          data:
            direction: prev
        styles:
          card:
            - height: 40px
            - background: var(--ha-card-background)
          name:
            - font-size: 18px
      - type: custom:button-card
        name: "▶"
        tap_action:
          action: perform-action
          perform_action: script.navigate_history
          data:
            direction: next
        styles:
          card:
            - height: 40px
            - background: var(--ha-card-background)
          name:
            - font-size: 18px
      - type: custom:button-card
        name: "⏭"
        tap_action:
          action: perform-action
          perform_action: script.navigate_history
          data:
            direction: last
        styles:
          card:
            - height: 40px
            - background: var(--ha-card-background)
          name:
            - font-size: 18px
