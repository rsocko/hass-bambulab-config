# Photo Review Chip — conditional chip shown when media review is pending.
# Reuses the ordinary archive popup/gallery for the next pending archive.

type: conditional
conditions:
  - condition: state
    entity: input_select.bambuddy_photo_review_state
    state_not: "idle"
card:
  type: custom:button-card
  entity: input_select.bambuddy_photo_review_state
  name: "📸 Photos to Review"
  icon: mdi:image-check
  show_state: false
  tap_action:
    action: fire-dom-event
    browser_mod:
      service: browser_mod.sequence
      data:
        sequence:
          - service: input_text.set_value
            data:
              entity_id: input_text.print_history_popup_archive_id
              value: >
                [[[ 
                  const status = states['sensor.bambuddy_print_history_browser_status'];
                  const archive = status?.attributes?.media_review_next_archive_json || {};
                  return String(archive?.id || '');
                ]]]
          - service: >
              [[[ 
                const status = states['sensor.bambuddy_print_history_browser_status'];
                const archive = status?.attributes?.media_review_next_archive_json || {};
                return archive?.is_favorite ? 'input_boolean.turn_on' : 'input_boolean.turn_off';
              ]]]
            data:
              entity_id: input_boolean.print_history_popup_is_favorite
          - service: browser_mod.popup
            data:
              title: >
                [[[ 
                  const status = states['sensor.bambuddy_print_history_browser_status'];
                  const archive = status?.attributes?.media_review_next_archive_json || {};
                  return archive?.name || archive?.project_name || 'Photos to Review';
                ]]]
              size: normal
              content:
                type: custom:button-card
                template: print_history_archive_popup_content
                variables:
                  archive_json: >
                    [[[ 
                      const status = states['sensor.bambuddy_print_history_browser_status'];
                      const archive = status?.attributes?.media_review_next_archive_json || {};
                      return JSON.stringify(archive || {});
                    ]]]
  styles:
    card:
      - background: "#1565C0"
      - color: "#FFFFFF"
      - border-radius: 20px
      - padding: 6px 16px
      - height: 40px
      - box-shadow: "0 2px 6px rgba(0,0,0,0.3)"
    name:
      - font-size: 13px
      - font-weight: 500
    icon:
      - width: 20px
      - color: "#FFFFFF"
    grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: 28px 1fr
