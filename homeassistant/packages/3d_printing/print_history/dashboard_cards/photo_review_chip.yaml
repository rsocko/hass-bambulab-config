# Photo Review Chip — conditional chip shown when media review is pending.
# Reuses the ordinary archive popup/gallery for the next pending archive.

type: conditional
conditions:
  - condition: state
    entity: input_select.bambuddy_photo_review_state
    state_not: "idle"
card:
  type: custom:button-card
  template: print_history_archive_popup
  entity: input_select.bambuddy_photo_review_state
  name: >
    [[[ 
      return entity?.state === 'reviewing' ? 'Resume Photo Review' : 'Photos to Review';
    ]]]
  icon: mdi:image-check
  show_state: false
  variables:
    archive_json: >
      [[[ 
        const status = states['sensor.bambuddy_print_history_browser_status'];
        const archive = status?.attributes?.media_review_next_archive_json || {};
        return JSON.stringify(archive || {});
      ]]]
    mark_media_review_on_open: true
  styles:
    card:
      - background: >
          [[[ 
            return entity?.state === 'reviewing' ? 'rgba(97, 97, 97, 0.92)' : '#1565C0';
          ]]]
      - color: "#FFFFFF"
      - border-radius: 20px
      - padding: 6px 16px
      - height: 40px
      - box-shadow: >
          [[[ 
            return entity?.state === 'reviewing'
              ? '0 1px 4px rgba(0,0,0,0.22)'
              : '0 2px 6px rgba(0,0,0,0.3)';
          ]]]
    name:
      - font-size: 13px
      - font-weight: 500
    icon:
      - width: 20px
      - color: "#FFFFFF"
    grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: 28px 1fr
