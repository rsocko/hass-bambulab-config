type: custom:config-template-card
entities:
  - input_number.print_history_page_size
  - input_select.print_history_card_variant
  - input_boolean.print_history_show_images
  - sensor.bambuddy_print_history_browser_page_info
  - sensor.bambuddy_print_history_browser_filtered
card:
  type: custom:bubble-card
  card_type: sub-buttons
  entity: sensor.bambuddy_print_history_browser_page_info
  hide_main_background: false
  rows: 1.06
  styles: >-
    ${(() => {
      const variant = states['input_select.print_history_card_variant']?.state || '';
      const selectedIndex = ({ Compact: 7, Media: 8, Detail: 9 })[variant];
      return `
        ha-card {
          overflow: hidden !important;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 8px !important;
          justify-content: center !important;
        }
        .bubble-sub-button {
          min-width: 0 !important;
        }
        .bubble-sub-button:nth-child(6) {
          display: none !important;
        }
        .bubble-sub-button:nth-child(11) {
          margin-left: 10px !important;
          position: relative;
        }
        .bubble-sub-button:nth-child(11)::before {
          content: '';
          position: absolute;
          left: -9px;
          top: 8px;
          bottom: 8px;
          width: 1px;
          background: color-mix(in srgb, var(--divider-color) 72%, transparent) !important;
        }
        ${selectedIndex ? `
        .bubble-sub-button:nth-child(${selectedIndex}) {
          background-color: var(--primary-color) !important;
          color: white !important;
          box-shadow: none !important;
        }
        .bubble-sub-button:nth-child(${selectedIndex}) ha-icon {
          color: white !important;
        }
        ` : ''}
        @media (max-width: 900px) {
          .bubble-sub-button-container,
          .bubble-sub-buttons-container {
            gap: 6px !important;
          }
          .bubble-sub-button {
            padding-left: 10px !important;
            padding-right: 10px !important;
          }
        }
        @media (max-width: 720px) {
          .bubble-sub-button-container,
          .bubble-sub-buttons-container {
            justify-content: flex-start !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
            padding-bottom: 2px !important;
          }
          .bubble-sub-button-container::-webkit-scrollbar,
          .bubble-sub-buttons-container::-webkit-scrollbar {
            display: none !important;
          }
          .bubble-sub-button {
            flex: 0 0 auto !important;
            padding-left: 8px !important;
            padding-right: 8px !important;
          }
          .bubble-sub-button:nth-child(4),
          .bubble-sub-button:nth-child(7),
          .bubble-sub-button:nth-child(8),
          .bubble-sub-button:nth-child(9) {
            display: none !important;
          }
          .bubble-sub-button:nth-child(6) {
            display: flex !important;
            min-width: 42px !important;
            justify-content: center !important;
            padding-left: 8px !important;
            padding-right: 8px !important;
          }
          .bubble-sub-button:nth-child(3) ha-icon,
          .bubble-sub-button:nth-child(4) ha-icon,
          .bubble-sub-button:nth-child(5) ha-icon {
            display: none !important;
          }
          .bubble-sub-button:nth-child(5) .bubble-sub-button-name,
          .bubble-sub-button:nth-child(6) .bubble-sub-button-name,
          .bubble-sub-button:nth-child(6) .bubble-sub-button-state {
            display: none !important;
          }
          .bubble-sub-button:nth-child(11) {
            margin-left: 0 !important;
          }
          .bubble-sub-button:nth-child(11)::before {
            display: none !important;
          }
        }
        @media (max-width: 560px) {
          .bubble-sub-button:nth-child(1),
          .bubble-sub-button:nth-child(13) {
            display: none !important;
          }
        }
      `;
    })()}
  sub_button:
    main: []
    bottom_layout: rows
    bottom:
      - group:
          - name: First Page
            icon: mdi:page-first
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: first
          - name: Previous Page
            icon: mdi:chevron-left
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: prev
          - entity: sensor.bambuddy_print_history_browser_page_info
            sub_button_type: default
            name: ${((states['sensor.bambuddy_print_history_browser_page_info']?.state || '').replace(/^Page\s+/, '').trim()) || '1 of 1'}
            icon: mdi:book-open-page-variant-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: none
          - entity: sensor.bambuddy_print_history_browser_filtered
            sub_button_type: default
            name: ${states['sensor.bambuddy_print_history_browser_filtered']?.state || '0'}
            icon: mdi:counter
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            state_background: false
            state_color: false
            fill_width: false
            tap_action:
              action: none
          - entity: input_number.print_history_page_size
            sub_button_type: slider
            name: PpP
            icon: mdi:format-list-numbered
            show_name: true
            show_state: true
            show_background: true
            state_background: false
            tap_to_slide: true
            fill_width: false
          - entity: input_select.print_history_card_variant
            sub_button_type: select
            name: Layout
            icon: >-
              ${(() => {
                const variant = states['input_select.print_history_card_variant']?.state || '';
                return ({
                  Compact: 'mdi:view-grid-outline',
                  Media: 'mdi:image-multiple-outline',
                  Detail: 'mdi:format-list-bulleted',
                })[variant] || 'mdi:view-dashboard-outline';
              })()}
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
          - name: Compact
            icon: mdi:view-grid-outline
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            state_background: false
            state_color: false
            fill_width: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.print_history_card_variant
              data:
                option: Compact
          - name: Media
            icon: mdi:image-multiple-outline
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            state_background: false
            state_color: false
            fill_width: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.print_history_card_variant
              data:
                option: Media
          - name: Detail
            icon: mdi:format-list-bulleted
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            state_background: false
            state_color: false
            fill_width: false
            tap_action:
              action: call-service
              service: input_select.select_option
              target:
                entity_id: input_select.print_history_card_variant
              data:
                option: Detail
          - entity: input_boolean.print_history_show_images
            sub_button_type: default
            name: Images
            icon: mdi:image-outline
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            state_background: ${states['input_boolean.print_history_show_images']?.state === 'on'}
            state_color: ${states['input_boolean.print_history_show_images']?.state === 'on'}
            fill_width: false
            tap_action:
              action: toggle
          - name: Refresh
            icon: mdi:refresh
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.refresh_print_history_archives
          - name: Next Page
            icon: mdi:chevron-right
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: next
          - name: Last Page
            icon: mdi:page-last
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: last
        buttons_layout: inline
        justify_content: center