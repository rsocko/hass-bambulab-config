type: custom:config-template-card
entities:
  - input_number.print_history_page_size
  - input_select.print_history_card_variant
  - input_boolean.print_history_show_images
  - sensor.bambuddy_print_history_browser_page_info
  - sensor.bambuddy_print_history_browser_filtered
card:
  type: custom:bubble-card
  card_type: sub-buttons
  entity: sensor.bambuddy_print_history_browser_page_info
  hide_main_background: false
  rows: 1.06
  styles: >-
    ${(() => {
      // Child-order contract for the generated `.bubble-sub-button:nth-child(...)` nodes.
      // Keep the YAML group order below aligned with this table.
      const buttonIndex = {
        first: 1,
        prev: 2,
        pageInfo: 3,
        matches: 4,
        pageSize: 5,
        layout: 6,
        images: 7,
        refresh: 8,
        next: 9,
        last: 10,
      };
      return `
        ha-card {
          overflow: hidden !important;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 8px !important;
          justify-content: center !important;
        }
        .bubble-sub-button {
          min-width: 0 !important;
        }
        .bubble-sub-button:nth-child(${buttonIndex.next}) {
          margin-left: 10px !important;
          position: relative;
        }
        .bubble-sub-button:nth-child(${buttonIndex.next})::before {
          content: '';
          position: absolute;
          left: -9px;
          top: 8px;
          bottom: 8px;
          width: 1px;
          background: color-mix(in srgb, var(--divider-color) 72%, transparent) !important;
        }
        @media (max-width: 900px) {
          .bubble-sub-button-container,
          .bubble-sub-buttons-container {
            gap: 6px !important;
          }
          .bubble-sub-button {
            padding-left: 10px !important;
            padding-right: 10px !important;
          }
        }
        @media (max-width: 720px) {
          .bubble-sub-button-container,
          .bubble-sub-buttons-container {
            justify-content: flex-start !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
            padding-bottom: 2px !important;
          }
          .bubble-sub-button-container::-webkit-scrollbar,
          .bubble-sub-buttons-container::-webkit-scrollbar {
            display: none !important;
          }
          .bubble-sub-button {
            flex: 0 0 auto !important;
            padding-left: 8px !important;
            padding-right: 8px !important;
          }
          .bubble-sub-button:nth-child(${buttonIndex.first}),
          .bubble-sub-button:nth-child(${buttonIndex.last}),
          .bubble-sub-button:nth-child(${buttonIndex.matches}) {
            display: none !important;
          }
          .bubble-sub-button:nth-child(${buttonIndex.pageSize}) .bubble-sub-button-name,
          .bubble-sub-button:nth-child(${buttonIndex.images}) .bubble-sub-button-name,
          .bubble-sub-button:nth-child(${buttonIndex.refresh}) .bubble-sub-button-name {
            display: none !important;
          }
          .bubble-sub-button:nth-child(${buttonIndex.next}) {
            margin-left: 0 !important;
          }
          .bubble-sub-button:nth-child(${buttonIndex.next})::before {
            display: none !important;
          }
        }
      `;
    })()}
  sub_button:
    main: []
    bottom_layout: rows
    bottom:
      - group:
          # Order matters. Keep aligned with buttonIndex above.
          - name: First Page
            icon: mdi:page-first
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: first
          - name: Previous Page
            icon: mdi:chevron-left
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: prev
          - entity: sensor.bambuddy_print_history_browser_page_info
            sub_button_type: default
            name: >-
              ${(() => {
                const raw = ((states['sensor.bambuddy_print_history_browser_page_info']?.state || '').replace(/^Page\s+/, '').trim()) || '1 of 1';
                return window.innerWidth <= 720 ? raw.replace(/\s+of\s+/i, '/') : `Page ${raw}`;
              })()}
            icon: mdi:book-open-page-variant-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: none
          - entity: sensor.bambuddy_print_history_browser_filtered
            sub_button_type: default
            name: Matches
            icon: mdi:counter
            show_icon: true
            show_name: true
            show_state: true
            show_background: true
            state_background: false
            state_color: false
            fill_width: false
            tap_action:
              action: none
          - entity: input_number.print_history_page_size
            sub_button_type: slider
            name: PpP
            icon: mdi:format-list-numbered
            show_name: true
            show_state: true
            show_background: true
            state_background: false
            tap_to_slide: true
            fill_width: false
          - entity: input_select.print_history_card_variant
            sub_button_type: select
            name: Layout
            icon: mdi:view-dashboard-outline
            show_name: true
            show_state: true
            show_background: true
            fill_width: false
          - entity: input_boolean.print_history_show_images
            sub_button_type: default
            name: Images
            icon: mdi:image-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            state_background: ${states['input_boolean.print_history_show_images']?.state === 'on'}
            state_color: ${states['input_boolean.print_history_show_images']?.state === 'on'}
            fill_width: false
            tap_action:
              action: toggle
          - name: Refresh
            icon: mdi:refresh
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.refresh_print_history_archives
          - name: Next Page
            icon: mdi:chevron-right
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: next
          - name: Last Page
            icon: mdi:page-last
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: last
        buttons_layout: inline
        justify_content: center