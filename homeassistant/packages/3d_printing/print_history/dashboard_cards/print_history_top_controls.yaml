type: custom:config-template-card
entities:
  - input_number.print_history_page_size
  - input_select.print_history_card_variant
  - input_boolean.print_history_show_images
  - input_boolean.print_history_multi_select_mode
  - input_number.print_history_multi_select_count
  - input_boolean.print_history_multi_select_all_favorites
  - input_text.print_history_multi_select_request
  - sensor.bambuddy_print_history_browser_status
  - sensor.bambuddy_print_history_browser_page_info
  - sensor.bambuddy_print_history_browser_filtered
card_mod:
  style: |
    :host {
      transition: none !important;
      transform: none !important;
    }
    ha-card {
      transition: none !important;
      transform: none !important;
    }
card:
  type: custom:bubble-card
  card_type: sub-buttons
  entity: sensor.bambuddy_print_history_browser_page_info
  hide_main_background: false
  rows: 1.06
  card_mod:
    style: |
      :host {
        transition: none !important;
        transform: none !important;
      }
      ha-card {
        transition: none !important;
        transform: none !important;
      }
  styles: >-
    ${(() => {
      // Use icon-based selectors instead of nth-child so mobile visibility does not
      // depend on generated sub-button DOM positions inside bubble-card.
      const byIcon = (icon) => `.bubble-sub-button:has(ha-icon[icon="${icon}"])`;
      const pageInfoAttrs = states['sensor.bambuddy_print_history_browser_page_info']?.attributes || {};
      const activeVariant = states['input_select.print_history_card_variant']?.state || '';
      const isMediaVariant = activeVariant === 'Media';
      const browserRefreshing = states['sensor.bambuddy_print_history_browser_status']?.state === 'refreshing';
      const multiSelectMode = states['input_boolean.print_history_multi_select_mode']?.state === 'on';
      const selectedCount = Math.max(0, Number(states['input_number.print_history_multi_select_count']?.state || 0) || 0);
      const hasSelection = selectedCount > 0;
      const currentPage = Math.max(1, Number(pageInfoAttrs.current_page || 1) || 1);
      const totalPages = Math.max(1, Number(pageInfoAttrs.total_pages || 1) || 1);
      const atFirstPage = currentPage <= 1;
      const atLastPage = currentPage >= totalPages;
      const firstSelector = byIcon('mdi:page-first');
      const prevSelector = byIcon('mdi:chevron-left');
      const lastSelector = byIcon('mdi:page-last');
      const matchesSelector = byIcon('mdi:counter');
      const pageInfoSelector = byIcon('mdi:book-open-page-variant-outline');
      const pageSizeSelector = byIcon('mdi:format-list-numbered');
      const layoutSelectors = [
        'mdi:view-grid-outline',
        'mdi:image-multiple-outline',
        'mdi:format-list-bulleted',
        'mdi:view-dashboard-outline',
      ].map(byIcon);
      const layoutButtonSelector = layoutSelectors.join(',\n        ');
      const layoutNameContainerSelector = layoutSelectors.map((selector) => `${selector} .bubble-sub-button-name-container`).join(',\n        ');
      const layoutNameSelector = layoutSelectors.map((selector) => `${selector} .bubble-sub-button-name`).join(',\n        ');
      const layoutStateSelector = layoutSelectors.map((selector) => `${selector} .bubble-sub-button-state`).join(',\n        ');
      const imagesSelector = byIcon('mdi:image-outline');
      const refreshSelector = byIcon('mdi:refresh');
      const nextSelector = byIcon('mdi:chevron-right');
      const selectModeSelector = byIcon('mdi:checkbox-multiple-blank-outline');
      const selectedCountSelector = byIcon('mdi:checkbox-multiple-marked-outline');
      const cancelSelector = byIcon('mdi:close');
      const selectAllSelector = byIcon('mdi:select-all');
      const tagSelector = byIcon('mdi:tag-multiple-outline');
      const projectSelector = byIcon('mdi:folder-multiple-outline');
      const favoriteSelector = byIcon('mdi:star-circle-outline');
      const deleteSelector = byIcon('mdi:trash-can-outline');
      const multiModeSelectors = [
        selectedCountSelector,
        cancelSelector,
        selectAllSelector,
        tagSelector,
        projectSelector,
        favoriteSelector,
        deleteSelector,
      ];
      const hiddenNormalSelectors = [
        firstSelector,
        prevSelector,
        pageInfoSelector,
        matchesSelector,
        pageSizeSelector,
        ...layoutSelectors,
        imagesSelector,
        refreshSelector,
        nextSelector,
        lastSelector,
        selectModeSelector,
      ];
      const disabledSelectors = [
        ...(atFirstPage ? [firstSelector, prevSelector] : []),
        ...(atLastPage ? [nextSelector, lastSelector] : []),
      ];
      const multiDisabledSelectors = hasSelection ? [] : [tagSelector, projectSelector, favoriteSelector, deleteSelector];
      return `
        ha-card {
          overflow: visible !important;
          min-height: 60px !important;
        }
        .card-content.large,
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          min-height: 60px !important;
          height: 60px !important;
          gap: 8px !important;
          justify-content: flex-start !important;
          flex-wrap: nowrap !important;
          overflow-x: auto !important;
          overflow-y: hidden !important;
          scrollbar-width: none !important;
          -ms-overflow-style: none !important;
          scrollbar-gutter: stable both-edges !important;
          padding-bottom: 2px !important;
          transition: none !important;
          animation: none !important;
        }
        .bubble-sub-button-container::-webkit-scrollbar,
        .bubble-sub-buttons-container::-webkit-scrollbar {
          display: none !important;
        }
        .bubble-wrapper,
        .bubble-content-container,
        .bubble-sub-button-group,
        .bubble-sub-button-bottom-container {
          transition: none !important;
          animation: none !important;
          transform: none !important;
        }
        .bubble-sub-button-bottom-container {
          top: 12px !important;
          bottom: auto !important;
          margin-bottom: 0 !important;
        }
        .bubble-sub-button {
          min-width: 0 !important;
          flex: 0 0 auto !important;
        }
        @keyframes printHistoryToolbarSpin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        ${multiSelectMode ? `${hiddenNormalSelectors.join(',\n        ')} {
          display: none !important;
        }` : `${multiModeSelectors.join(',\n        ')} {
          display: none !important;
        }`}
        ${browserRefreshing ? `${refreshSelector} {
          background: rgba(21, 101, 192, 0.18) !important;
          box-shadow: inset 0 0 0 1px rgba(21, 101, 192, 0.32) !important;
        }
        ${refreshSelector} ha-icon {
          color: #1565c0 !important;
          animation: printHistoryToolbarSpin 1s linear infinite;
          transform-origin: center;
        }` : ''}
        ${layoutButtonSelector},
        ${layoutButtonSelector} *,
        ${layoutButtonSelector} .bubble-dropdown-arrow,
        ${layoutButtonSelector} .bubble-dropdown-container {
          transition: none !important;
          animation: none !important;
        }
        ${selectModeSelector} {
          position: relative !important;
        }
        ${selectModeSelector} .bubble-sub-button-name,
        ${selectModeSelector} .bubble-sub-button-state {
          display: none !important;
        }
        ${selectModeSelector}:hover::after,
        ${selectModeSelector}:focus-within::after {
          content: 'Multi-Select Prints';
          position: absolute;
          left: 50%;
          bottom: calc(100% + 8px);
          transform: translateX(-50%);
          padding: 6px 10px;
          border-radius: 10px;
          background: rgba(17, 24, 39, 0.94);
          color: #f9fafb;
          font-size: 11px;
          font-weight: 600;
          line-height: 1.2;
          white-space: nowrap;
          pointer-events: none;
          z-index: 6;
          box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
        }
        ${imagesSelector} .bubble-sub-button-name,
        ${refreshSelector} .bubble-sub-button-name,
        ${layoutNameContainerSelector},
        ${layoutNameSelector},
        ${layoutStateSelector} {
          display: none !important;
        }
        ${isMediaVariant ? `${imagesSelector} {
          opacity: 0.42 !important;
          pointer-events: none !important;
          cursor: default !important;
          filter: saturate(0.35) !important;
        }
        ${imagesSelector} ha-icon {
          color: var(--disabled-text-color) !important;
        }
        ${imagesSelector} .bubble-sub-button-background {
          opacity: 0.55 !important;
        }` : ''}
        ${disabledSelectors.length ? `${disabledSelectors.join(',\n        ')} {
          opacity: 0.42 !important;
          pointer-events: none !important;
          cursor: default !important;
          filter: saturate(0.35) !important;
        }
        ${disabledSelectors.map((selector) => `${selector} ha-icon`).join(',\n        ')} {
          color: var(--disabled-text-color) !important;
        }` : ''}
        ${multiSelectMode ? `${selectedCountSelector} {
          pointer-events: none !important;
        }
        ${multiDisabledSelectors.length ? `${multiDisabledSelectors.join(',\n        ')} {
          opacity: 0.42 !important;
          pointer-events: none !important;
          cursor: default !important;
          filter: saturate(0.35) !important;
        }
        ${multiDisabledSelectors.map((selector) => `${selector} ha-icon`).join(',\n        ')} {
          color: var(--disabled-text-color) !important;
        }` : ''}
        ${deleteSelector} {
          background: rgba(198, 40, 40, 0.12) !important;
        }
        ${deleteSelector} ha-icon {
          color: #c62828 !important;
        }` : ''}
        @media (max-width: 900px) {
          .bubble-sub-button-container,
          .bubble-sub-buttons-container {
            gap: 6px !important;
          }
          .bubble-sub-button {
            padding-left: 10px !important;
            padding-right: 10px !important;
          }
        }
        @media (max-width: 720px) {
          .bubble-sub-button {
            padding-left: 8px !important;
            padding-right: 8px !important;
          }
          ${firstSelector},
          ${lastSelector},
          ${matchesSelector} {
            display: none !important;
          }
          ${selectedCountSelector} .bubble-sub-button-name {
            display: none !important;
          }
          ${pageInfoSelector} .bubble-sub-button-name {
            max-width: none !important;
          }
          ${pageInfoSelector} .bubble-sub-button-state {
            display: none !important;
          }
          ${pageSizeSelector} .bubble-sub-button-name,
          ${imagesSelector} .bubble-sub-button-name,
          ${refreshSelector} .bubble-sub-button-name {
            display: none !important;
          }
          ${pageSizeSelector} ha-icon {
            display: none !important;
          }
        }
      `;
    })()}
  sub_button:
    main: []
    bottom_layout: rows
    bottom:
      - group:
          # Controls are identified for CSS by unique icons. Do not reuse these
          # icons for a different semantic action inside this row.
          - name: First Page
            icon: mdi:page-first
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: first
          - name: Previous Page
            icon: mdi:chevron-left
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: prev
          - entity: sensor.bambuddy_print_history_browser_page_info
            sub_button_type: default
            name: >-
              ${(() => {
                const raw = ((states['sensor.bambuddy_print_history_browser_page_info']?.state || '').replace(/^Page\s+/, '').trim()) || '1 of 1';
                return `Page ${raw.replace(/\s+of\s+/i, ' / ')}`;
              })()}
            icon: mdi:book-open-page-variant-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: none
          - entity: sensor.bambuddy_print_history_browser_filtered
            sub_button_type: default
            name: Matches
            icon: mdi:counter
            show_icon: true
            show_name: true
            show_state: true
            show_background: true
            state_background: false
            state_color: false
            fill_width: false
            tap_action:
              action: none
          - entity: input_number.print_history_page_size
            sub_button_type: slider
            name: >-
              Prints / Page
            icon: mdi:format-list-numbered
            show_name: true
            show_state: true
            show_background: true
            state_background: false
            tap_to_slide: true
            fill_width: false
          - name: Multi-Select Prints
            icon: mdi:checkbox-multiple-blank-outline
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.enter_print_history_multi_select_mode
          - entity: input_select.print_history_card_variant
            sub_button_type: select
            name: Layout
            icon: >-
              ${(() => {
                const variant = states['input_select.print_history_card_variant']?.state || '';
                return ({
                  Compact: 'mdi:view-grid-outline',
                  Media: 'mdi:image-multiple-outline',
                  List: 'mdi:format-list-bulleted',
                })[variant] || 'mdi:view-dashboard-outline';
              })()}
            show_icon: true
            show_name: true
            show_state: true
            show_background: true
            fill_width: false
          - entity: input_boolean.print_history_show_images
            sub_button_type: default
            name: Images
            icon: mdi:image-outline
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            state_background: ${states['input_select.print_history_card_variant']?.state !== 'Media' && states['input_boolean.print_history_show_images']?.state === 'on'}
            state_color: ${states['input_select.print_history_card_variant']?.state !== 'Media' && states['input_boolean.print_history_show_images']?.state === 'on'}
            fill_width: false
            tap_action:
              action: toggle
          - name: Refresh
            icon: mdi:refresh
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.refresh_print_history_archives
          - name: Next Page
            icon: mdi:chevron-right
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: next
          - name: Last Page
            icon: mdi:page-last
            show_icon: true
            show_name: false
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.navigate_history
              data:
                direction: last
          - entity: input_number.print_history_multi_select_count
            sub_button_type: default
            name: >-
              ${(() => {
                const count = Math.max(0, Number(states['input_number.print_history_multi_select_count']?.state || 0) || 0);
                return `${count} selected`;
              })()}
            icon: mdi:checkbox-multiple-marked-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: none
          - name: Cancel
            icon: mdi:close
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.cancel_print_history_multi_select_mode
          - name: Select All
            icon: mdi:select-all
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.request_print_history_multi_select_action
              data:
                action: select_all
          - name: Tags
            icon: mdi:tag-multiple-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.request_print_history_multi_select_action
              data:
                action: tag
          - name: Project
            icon: mdi:folder-multiple-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.request_print_history_multi_select_action
              data:
                action: project
          - name: >-
              ${states['input_boolean.print_history_multi_select_all_favorites']?.state === 'on' ? 'Unfavorite' : 'Favorite'}
            icon: mdi:star-circle-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.request_print_history_multi_select_action
              data:
                action: favorite
          - name: Delete
            icon: mdi:trash-can-outline
            show_icon: true
            show_name: true
            show_state: false
            show_background: true
            fill_width: false
            tap_action:
              action: perform-action
              perform_action: script.request_print_history_multi_select_action
              data:
                action: delete
        buttons_layout: inline
        justify_content: center