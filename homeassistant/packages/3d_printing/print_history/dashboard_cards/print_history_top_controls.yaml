type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        icon: mdi:page-first
        show_icon: true
        show_name: false
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.navigate_history
          data:
            direction: first
        styles:
          card:
            - height: 46px
            - border-radius: 999px
            - background: var(--ha-card-background)
            - box-shadow: none
            - display: >-
                [[[ return window.innerWidth <= 720 ? 'none' : 'block'; ]]]
          icon:
            - color: var(--primary-text-color)
      - type: custom:button-card
        icon: mdi:chevron-left
        show_icon: true
        show_name: false
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.navigate_history
          data:
            direction: prev
        styles:
          card:
            - height: 46px
            - border-radius: 999px
            - background: var(--ha-card-background)
            - box-shadow: none
          icon:
            - color: var(--primary-text-color)
      - type: custom:button-card
        entity: sensor.bambuddy_print_history_browser_page_info
        icon: mdi:book-open-page-variant-outline
        show_icon: true
        show_name: true
        show_state: false
        name: >-
          [[[ const raw = String((entity && entity.state) || '1 of 1').replace(/^Page\s+/, '').trim() || '1 of 1'; return window.innerWidth <= 720 ? raw.replace(/\s+of\s+/i, '/') : `Page ${raw}`; ]]]
        tap_action:
          action: none
        styles:
          card:
            - height: 46px
            - border-radius: 999px
            - background: var(--ha-card-background)
            - box-shadow: none
            - padding-left: 12px
            - padding-right: 12px
          grid:
            - grid-template-areas: 'i n'
            - grid-template-columns: min-content 1fr
            - align-items: center
            - column-gap: 8px
          name:
            - justify-self: start
            - font-size: 14px
            - font-weight: 600
          icon:
            - width: 18px
            - color: var(--accent-color)
      - type: custom:button-card
        icon: mdi:chevron-right
        show_icon: true
        show_name: false
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.navigate_history
          data:
            direction: next
        styles:
          card:
            - height: 46px
            - border-radius: 999px
            - background: var(--ha-card-background)
            - box-shadow: none
          icon:
            - color: var(--primary-text-color)
      - type: custom:button-card
        icon: mdi:page-last
        show_icon: true
        show_name: false
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.navigate_history
          data:
            direction: last
        styles:
          card:
            - height: 46px
            - border-radius: 999px
            - background: var(--ha-card-background)
            - box-shadow: none
            - display: >-
                [[[ return window.innerWidth <= 720 ? 'none' : 'block'; ]]]
          icon:
            - color: var(--primary-text-color)

  - type: custom:config-template-card
    entities:
      - input_select.print_history_card_variant
      - input_number.print_history_page_size
      - input_boolean.print_history_show_images
      - sensor.bambuddy_print_history_browser_filtered
    card:
      type: custom:bubble-card
      card_type: sub-buttons
      entity: sensor.bambuddy_print_history_browser_filtered
      hide_main_background: false
      rows: 1.06
      styles: |
        ha-card {
          overflow: hidden !important;
        }
        .bubble-sub-button-container,
        .bubble-sub-buttons-container {
          gap: 8px !important;
          justify-content: center !important;
        }
        .bubble-sub-button {
          min-width: 0 !important;
        }
        @media (max-width: 720px) {
          .bubble-sub-button-container,
          .bubble-sub-buttons-container {
            justify-content: flex-start !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
            padding-bottom: 2px !important;
          }
          .bubble-sub-button-container::-webkit-scrollbar,
          .bubble-sub-buttons-container::-webkit-scrollbar {
            display: none !important;
          }
          .bubble-sub-button {
            flex: 0 0 auto !important;
            padding-left: 8px !important;
            padding-right: 8px !important;
          }
        }
      sub_button:
        main: []
        bottom_layout: rows
        bottom:
          - group:
              - entity: input_select.print_history_card_variant
                sub_button_type: select
                name: Layout
                icon: mdi:view-dashboard-outline
                show_name: true
                show_state: true
                show_background: true
                fill_width: false
              - entity: sensor.bambuddy_print_history_browser_filtered
                sub_button_type: default
                name: Matches
                icon: mdi:counter
                show_icon: true
                show_name: true
                show_state: true
                show_background: true
                state_background: false
                state_color: false
                fill_width: false
                tap_action:
                  action: none
              - entity: input_number.print_history_page_size
                sub_button_type: slider
                name: PpP
                icon: mdi:format-list-numbered
                show_name: true
                show_state: true
                show_background: true
                state_background: false
                tap_to_slide: true
                fill_width: false
              - entity: input_boolean.print_history_show_images
                sub_button_type: default
                name: Images
                icon: mdi:image-outline
                show_icon: true
                show_name: true
                show_state: false
                show_background: true
                state_background: ${states['input_boolean.print_history_show_images']?.state === 'on'}
                state_color: ${states['input_boolean.print_history_show_images']?.state === 'on'}
                fill_width: false
                tap_action:
                  action: toggle
              - name: Refresh
                icon: mdi:refresh
                show_icon: true
                show_name: true
                show_state: false
                show_background: true
                fill_width: false
                tap_action:
                  action: perform-action
                  perform_action: script.refresh_print_history_archives
            buttons_layout: inline
            justify_content: center