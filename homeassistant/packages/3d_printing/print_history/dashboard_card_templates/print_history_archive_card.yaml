print_history_archive_card:
  type: custom:button-card
  entity: sensor.print_history_page_archives
  icon: mdi:archive-outline
  show_icon: true
  show_name: true
  show_state: false
  show_label: true
  tap_action:
    action: none
  hold_action:
    action: none
  double_tap_action:
    action: none
  name: |
    [[[ return variables.archive_name || 'Unnamed Print'; ]]]
  label: |
    [[[ 
      const started = variables.archive_started || 'Unknown date';
      const status = variables.archive_status || 'unknown';
      const duration = variables.archive_duration || '-';
      return `${started} | ${status} | ${duration}`;
    ]]]
  styles:
    card:
      - padding: 16px
      - border-radius: 20px
      - border: 1px solid var(--divider-color)
      - background: var(--ha-card-background)
      - text-align: left
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 28px minmax(0, 1fr)
      - grid-template-rows: auto auto
      - column-gap: 12px
      - row-gap: 4px
    icon:
      - width: 22px
      - color: var(--secondary-text-color)
      - align-self: start
      - margin-top: 2px
    name:
      - justify-self: start
      - text-align: left
      - font-size: 15px
      - font-weight: 700
      - overflow-wrap: anywhere
    label:
      - justify-self: start
      - text-align: left
      - font-size: 12px
      - color: var(--secondary-text-color)
      - overflow-wrap: anywhere
