# Upload a locally captured snapshot to a Bambuddy archive using Python stdlib.
# This avoids depending on curl inside the HA Core container.
# Usage: service: shell_command.bambuddy_upload_archive_photo
# Data: { "archive_id": "42", "file_path": "/config/www/printer_snapshots/example.jpg" }
bambuddy_upload_archive_photo: >-
  python3 -c 'import mimetypes,pathlib,sys,urllib.request,uuid,yaml; file_path=pathlib.Path(r"{{ file_path }}"); secrets=yaml.safe_load(open("/config/secrets.yaml", encoding="utf-8")) or {}; api_key=str(secrets.get("bambuddy_api_key", "")); base_url="{{ states("input_text.bambuddy_api_base_url") }}".rstrip("/"); archive_id="{{ archive_id }}".strip(); file_path.is_file() or sys.exit(f"Missing file: {file_path}"); api_key or sys.exit("Missing bambuddy_api_key in /config/secrets.yaml"); archive_id or sys.exit("Missing archive_id"); file_name=file_path.name; content_type=mimetypes.guess_type(file_name)[0] or "application/octet-stream"; boundary="----ha-bambuddy-" + uuid.uuid4().hex; file_bytes=file_path.read_bytes(); body=(f"--{boundary}\r\n".encode() + f"Content-Disposition: form-data; name=\"file\"; filename=\"{file_name}\"\r\n".encode() + f"Content-Type: {content_type}\r\n\r\n".encode() + file_bytes + f"\r\n--{boundary}--\r\n".encode()); request=urllib.request.Request(url=f"{base_url}/api/v1/archives/{archive_id}/photos", data=body, method="POST", headers={"X-API-Key": api_key, "Content-Type": f"multipart/form-data; boundary={boundary}", "Content-Length": str(len(body))}); response=urllib.request.urlopen(request, timeout=30); status=getattr(response, "status", 200); response.close(); sys.exit(0 if 200 <= status < 300 else f"Upload failed with HTTP {status}")'