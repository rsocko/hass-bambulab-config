- select:
    - name: AMS 1 Tray 1 Pin Selector
      unique_id: ams_1_tray_1_pin_selector
      icon: mdi:pin
      state: >-
        {% set raw = states('input_text.ams_1_tray_1_spool_override') | default('', true) | string | trim %}
        {% if raw | length == 0 or raw | lower in ['unknown', 'unavailable', 'none', 'null'] %}
          None | Clear manual pin
        {% else %}
          {% set spool_id = raw | replace('sensor.spoolman_spool_', '') %}
          {% set entity_id = 'sensor.spoolman_spool_' ~ spool_id %}
          {% if states(entity_id) not in ['unknown', 'unavailable'] %}
            {{ spool_id }} | {{ (state_attr(entity_id, 'friendly_name') | default(entity_id, true) | string)[:96] }} ({{ (state_attr(entity_id, 'location') | default('Unknown', true) | string)[:48] }})
          {% else %}
            {{ spool_id }} | Unknown spool (not currently available)
          {% endif %}
        {% endif %}
      options: >-
        {% set search_entity = this.entity_id | replace('select.', 'input_text.') | replace('_pin_selector', '_spool_search_query') %}
        {% set query = states(search_entity) | default('', true) | lower | trim %}
        {% set terms = query.split() if query | length > 0 else [] %}
        {% set spools = state_attr('sensor.spoolman_filament_totals', 'spool_options')
          | default([], true)
          | sort(attribute='name')
          | list %}
        {% set ns = namespace(opts=['None | Clear manual pin']) %}
        {% for spool in spools %}
          {% set spool_id = spool.get('id', '') | string %}
          {% set label = spool.get('name', spool.get('entity_id', 'Unknown')) | string %}
          {% set location = spool.get('location', 'Unknown') | string %}
          {% set haystack = (spool_id ~ ' ' ~ label ~ ' ' ~ location) | lower %}
          {% set match = namespace(ok=true) %}
          {% for term in terms %}
            {% if term not in haystack %}
              {% set match.ok = false %}
            {% endif %}
          {% endfor %}
          {% if match.ok %}
            {% set ns.opts = ns.opts + [spool_id ~ ' | ' ~ label ~ ' (' ~ location ~ ')'] %}
          {% endif %}
        {% endfor %}
        {{ ns.opts }}
      select_option:
        - action: input_text.set_value
          target:
            entity_id: input_text.ams_1_tray_1_spool_override
          data:
            value: >-
              {% if option.startswith('None |') %}
                {{ '' }}
              {% else %}
                {{ option.split(' | ')[0] | string | trim }}
              {% endif %}
        - action: input_text.set_value
          target:
            entity_id: input_text.ams_1_tray_1_spool_search_query
          data:
            value: ''
        - action: browser_mod.close_popup

