# Helpers for calculating the cost of the current print.
# The default price is applied when a spool has no price set in Spoolman
# (neither on the spool itself nor on the filament type).
#
# ── Recommended installation ────────────────────────────────────────────────
# 1. Copy this file to:
#      /config/packages/bambulab/print_cost_helpers.yaml
#
# 2. Add the following to your configuration.yaml
#    (create the homeassistant.packages block if it does not already exist):
#
#      homeassistant:
#        packages:
#          bambulab_print_cost: !include packages/bambulab/print_cost_helpers.yaml
#
# 3. Restart Home Assistant (or reload the configuration).
#
# NOTE: Do NOT use `input_number: !include ...` — this file contains its own
# top-level keys and must be loaded as a package so Home Assistant can merge
# all sections correctly.
# ────────────────────────────────────────────────────────────────────────────

input_number:
  print_cost_default_per_kg:
    name: Default Filament Cost (per kg)
    min: 0
    max: 500
    step: 0.50
    initial: 20.00
    unit_of_measurement: "$"
    icon: mdi:currency-usd
    mode: box
