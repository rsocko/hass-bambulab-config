# Docs: docs/features/spoolman_sync/print_complete_update_filament_usage.md
- alias: Print Complete - Update Filament Usage
  id: print_complete_update_filament_usage
  description: >
    Updates Spoolman with filament usage when print completes.
    Includes fallback to backed-up print_weight attributes if HA restarted during print.
    Includes a guarded native print-status fallback when the device finish event is missed.
    Includes persistent error logging when a spool cannot be found in Spoolman.
  triggers:
  - device_id: 210dfdfa64085e8cf073e50eae757d90
    domain: bambu_lab
    type: event_print_finished
    trigger: device
    id: event_print_finished
  - trigger: state
    entity_id: sensor.ntk_ryansoffice_3dprinter_print_status
    to: finish
    for:
      seconds: 45
    id: status_finish
  - trigger: state
    entity_id: sensor.ntk_ryansoffice_3dprinter_print_status
    to: failed
    for:
      seconds: 45
    id: status_failed
  - trigger: state
    entity_id: sensor.ntk_ryansoffice_3dprinter_print_status
    to: idle
    for:
      seconds: 45
    id: status_idle
  - trigger: state
    entity_id: sensor.ntk_ryansoffice_3dprinter_print_status
    to: offline
    for:
      seconds: 45
    id: status_offline
  conditions: []
  actions:
  # Determine which data source to use
  - variables:
      trigger_id: "{{ trigger.id | default('unknown', true) }}"
      trigger_from_state_obj: "{{ trigger.get('from_state') if trigger is mapping else none }}"
      trigger_to_state_obj: "{{ trigger.get('to_state') if trigger is mapping else none }}"
      # Safe extraction of trigger status with fallback chain to handle state object inconsistencies
      trigger_from_status: >
        {%- if trigger_from_state_obj is not none and trigger_from_state_obj.state is defined -%}
          {{ trigger_from_state_obj.state | string | lower }}
        {%- else -%}
          ''
        {%- endif -%}
      trigger_to_status: >
        {%- if trigger_to_state_obj is not none and trigger_to_state_obj.state is defined -%}
          {{ trigger_to_state_obj.state | string | lower }}
        {%- else -%}
          ''
        {%- endif -%}
      archive_id_raw: "{{ states('input_text.bambuddy_current_archive_id') | string | trim }}"
      archive_id_valid: "{{ archive_id_raw | regex_match('^-?\\d+$') }}"
      task_name_current: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}"
      current_total_weight_raw: "{{ states('sensor.ntk_ryansoffice_3dprinter_print_weight') | string }}"
      current_has_attributes: >-
        {{ states.sensor.ntk_ryansoffice_3dprinter_print_weight.attributes.keys() |
           select('match', '^(AMS|External)') | list | length > 0 }}
      backup_raw: "{{ states('input_text.print_weight_backup') | string }}"
      backup_raw_trimmed: "{{ backup_raw | trim }}"
      backup_present: "{{ backup_raw_trimmed not in ['unknown', 'unavailable', 'none', 'None', ''] }}"
      backup_parsed: "{{ backup_raw_trimmed | from_json(None) }}"
      # NativeEnvironment may auto-parse the JSON string into a native dict,
      # so backup_raw_trimmed can be either a string or an already-parsed mapping.
      # Check both: already a mapping OR successfully parsed via from_json.
      backup_available: >-
        {{ backup_present and
           (backup_raw_trimmed is mapping or backup_parsed is mapping) }}
      backup_invalid: "{{ backup_present and not backup_available }}"
  - variables:
      backup_metadata_raw: "{{ states('input_text.print_metadata_backup') | string }}"
      backup_metadata_parts: "{{ backup_metadata_raw.split('|') }}"
      backup_metadata_task: "{{ backup_metadata_parts[0] if backup_metadata_parts | count > 0 else '' }}"
      backup_metadata_started_at_raw: "{{ backup_metadata_parts[1] if backup_metadata_parts | count > 1 else '' }}"
      backup_metadata_total_weight_raw: "{{ backup_metadata_parts[2] if backup_metadata_parts | count > 2 else '' }}"
      backup_metadata_valid: "{{ backup_metadata_parts | count >= 3 }}"
      backup_age_seconds: >-
        {% if backup_metadata_valid and backup_metadata_started_at_raw not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
          {{ (as_timestamp(now()) - as_timestamp(backup_metadata_started_at_raw, 0)) | float(0) }}
        {% else %}
          999999
        {% endif %}
      status_fallback_trigger: "{{ trigger_id in ['status_finish', 'status_failed', 'status_idle', 'status_offline'] }}"
      status_fallback_candidate: >-
        {{
          status_fallback_trigger and
          trigger_from_status in ['running', 'prepare', 'pause', 'paused', 'printing', 'slicing', 'init'] and
          (
            current_has_attributes or
            (backup_present and backup_metadata_valid)
          )
        }}
      status_fallback_skip_reason: >-
        {% if not status_fallback_trigger %}
          not_status_trigger
        {% elif trigger_from_status not in ['running', 'prepare', 'pause', 'paused', 'printing', 'slicing', 'init'] %}
          from_state_not_active
        {% elif current_has_attributes %}
          ok
        {% elif not backup_present %}
          backup_missing
        {% elif not backup_metadata_valid %}
          backup_metadata_invalid
        {% else %}
          ok
        {% endif %}
      last_processed_raw: "{{ states('input_text.spoolman_sync_last_processed_print') | string }}"
      last_processed_parts: "{{ last_processed_raw.split('|') }}"
      last_processed_task: "{{ last_processed_parts[0] if last_processed_parts | count > 0 else '' }}"
      last_processed_total_weight_raw: "{{ last_processed_parts[1] if last_processed_parts | count > 1 else '' }}"
      last_processed_processed_at_raw: "{{ last_processed_parts[2] if last_processed_parts | count > 2 else '' }}"
      last_processed_recent: >-
        {% if last_processed_processed_at_raw not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
          {{ (as_timestamp(now()) - as_timestamp(last_processed_processed_at_raw, 0)) | float(0) <= 1800 }}
        {% else %}
          false
        {% endif %}
      duplicate_recent_completion: >-
        {{
          (not backup_present) and
          last_processed_recent and
          last_processed_task == task_name_current and
          last_processed_total_weight_raw == current_total_weight_raw
        }}

  - if:
      - condition: template
        value_template: "{{ duplicate_recent_completion }}"
        alias: Ignore duplicate completion after prior successful processing
    then:
      - action: system_log.write
        metadata: {}
        data:
          message: >-
            Print Complete: Ignoring duplicate completion trigger {{ trigger_id }} for
            "{{ task_name_current }}" because this task/weight combination was already
            processed at {{ last_processed_processed_at_raw }}.
          level: info
          logger: homeassistant.components.bambulab.spoolman_sync
      - stop: Duplicate print completion ignored.

  - if:
      - condition: template
        value_template: "{{ status_fallback_trigger and not status_fallback_candidate }}"
        alias: Ignore status fallback when guard conditions are not met
    then:
      - action: system_log.write
        metadata: {}
        data:
          message: >-
            Print Complete: Ignoring status fallback trigger {{ trigger_id }}.
            Reason={{ status_fallback_skip_reason }}, from={{ trigger_from_status }},
            to={{ trigger_to_status }}, backup_present={{ backup_present }},
            backup_metadata_valid={{ backup_metadata_valid }},
            current_has_attributes={{ current_has_attributes }},
            backup_age_seconds={{ backup_age_seconds | round(0) }}.
          level: info
          logger: homeassistant.components.bambulab.spoolman_sync
      - stop: Status fallback ignored.

  # If we may need backup data, give print_weight state a short chance to repopulate after restart.
  - if:
      - condition: template
        value_template: >-
          {{
            (not current_has_attributes) and
            backup_available and
            (states('sensor.ntk_ryansoffice_3dprinter_print_weight') in ['unknown', 'unavailable', 'none', 'None', ''])
          }}
        alias: Backup candidate and current print_weight state unavailable
    then:
      - wait_template: >-
          {{ states('sensor.ntk_ryansoffice_3dprinter_print_weight') not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        timeout: "00:01:30"
        continue_on_timeout: true

  # Validate whether backup belongs to the current task and (when possible) matches total print weight.
  - variables:
      backup_task_matches: >-
        {{
          backup_metadata_valid and
          backup_metadata_task == task_name_current and
          task_name_current not in ['unknown', 'unavailable', 'none', 'None', '']
        }}
      current_total_weight_valid: >-
        {{ current_total_weight_raw is match('^-?\\d+(\\.\\d+)?$') }}
      backup_total_weight_valid: >-
        {{ backup_metadata_total_weight_raw is match('^-?\\d+(\\.\\d+)?$') }}
      current_total_weight_value: "{{ current_total_weight_raw | float(0) }}"
      backup_total_weight_value: "{{ backup_metadata_total_weight_raw | float(0) }}"
      total_weight_delta_abs: >-
        {{ (current_total_weight_value - backup_total_weight_value) | abs }}
      # Use a small tolerance to avoid floating-point/reporting jitter.
      backup_total_weight_matches: >-
        {{
          (not current_total_weight_valid) or
          (not backup_total_weight_valid) or
          (total_weight_delta_abs <= 3)
        }}
      backup_usable: >-
        {{ backup_available and backup_task_matches and backup_total_weight_matches }}
      backup_rejected_reason: >-
        {% if not backup_available %}
          backup_missing_or_invalid
        {% elif not backup_task_matches %}
          metadata_task_mismatch
        {% elif not backup_total_weight_matches %}
          total_weight_mismatch
        {% else %}
          ok
        {% endif %}
  
  # Log the data source decision to system log for debugging
  - action: system_log.write
    metadata: {}
    data:
      message: >-
        Print Complete: Checking data source for "{{
        task_name_current }}".
        Current sensor has attributes: {{ current_has_attributes }}.
        Backup available: {{ backup_available }}.
        Backup usable: {{ backup_usable }} (reason={{ backup_rejected_reason }}).
        Will use {{ 'backup data (HA was restarted during print)' if (not current_has_attributes and backup_usable) else 'current sensor data' }}.
      level: info
      logger: homeassistant.components.bambulab.spoolman_sync
  
  - if:
      - condition: template
        value_template: "{{ backup_invalid }}"
        alias: Backup payload exists but is invalid JSON object
    then:
      - action: system_log.write
        metadata: {}
        data:
          message: >-
            Print Complete WARNING: input_text.print_weight_backup contains
            invalid or non-object JSON and will be ignored. Raw value (first
            200 chars): {{ backup_raw | truncate(200, True, '') }}
          level: warning
          logger: homeassistant.components.bambulab.spoolman_sync
      - action: logbook.log
        metadata: {}
        data:
          name: Print Weight Backup Invalid
          message: >-
            Found invalid backup payload in input_text.print_weight_backup;
            ignoring backup and using current sensor data only.

  - if:
      - condition: template
        value_template: "{{ backup_available and not backup_task_matches }}"
        alias: Backup metadata task does not match current task
    then:
      - action: system_log.write
        metadata: {}
        data:
          message: >-
            Print Complete WARNING: Ignoring backup because task mismatch.
            current_task="{{ task_name_current }}", backup_task="{{ backup_metadata_task }}".
          level: warning
          logger: homeassistant.components.bambulab.spoolman_sync

  - if:
      - condition: template
        value_template: "{{ backup_available and backup_task_matches and not backup_total_weight_matches }}"
        alias: Backup total weight mismatches current total weight
    then:
      - action: system_log.write
        metadata: {}
        data:
          message: >-
            Print Complete WARNING: Ignoring backup because total print weight mismatch.
            current={{ current_total_weight_raw }}g, backup={{ backup_metadata_total_weight_raw }}g,
            delta={{ total_weight_delta_abs }}g.
          level: warning
          logger: homeassistant.components.bambulab.spoolman_sync
  
  - action: logbook.log
    metadata: {}
    data:
      name: Print Weight Data Source
      message: >
        Print complete for: {{ task_name_current }}.
        Current sensor has attributes: {{ current_has_attributes }}.
        Backup available: {{ backup_available }}, usable: {{ backup_usable }}.
        Will use {{ 'backup data' if (not current_has_attributes and backup_usable) else 'current sensor data' }}.
  
  # Extract attributes from either current sensor or backup
  - variables:
      print_weight_attributes_json: >
        {% if current_has_attributes %}
          {{ states.sensor.ntk_ryansoffice_3dprinter_print_weight.attributes | tojson }}
        {% elif backup_usable %}
          {{ backup_raw_trimmed }}
        {% else %}
          {}
        {% endif %}
  
  # Notify user and log if no per-tray data is available
  - if:
      - condition: template
        value_template: >
          {{ ((print_weight_attributes_json
               if print_weight_attributes_json is mapping
               else (print_weight_attributes_json | from_json({}))).keys()) |
             select('match', '^(AMS|External)') | list | length == 0 }}
        alias: No AMS or External Spool weight data available
    then:
      - action: persistent_notification.create
        metadata: {}
        data:
          title: "Print Job {{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }} Finished - No Filament Data"
          message: >-
            Print job **{{ states('sensor.ntk_ryansoffice_3dprinter_task_name')
            }}** completed, but no per-tray filament weight data was available
            (sensor had no AMS/External Spool attributes and no backup was found).
  
  
            Total print weight recorded: {{
            states('sensor.ntk_ryansoffice_3dprinter_print_weight') }}g.
  
  
            Spoolman filament usage was **NOT updated automatically**. Please
            update filament usage manually if required.
          notification_id: "spoolman_no_data_{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') | slugify }}"
      - action: system_log.write
        metadata: {}
        data:
          message: >-
            Print Complete WARNING: No per-tray weight data available for "{{
            states('sensor.ntk_ryansoffice_3dprinter_task_name') }}". Total
            print weight sensor value: {{
            states('sensor.ntk_ryansoffice_3dprinter_print_weight') }}g.
            current_has_attributes={{ current_has_attributes }},
            backup_available={{ backup_available }}. Spoolman NOT updated.
            Manual update required.
          level: warning
          logger: homeassistant.components.bambulab.spoolman_sync
      - action: logbook.log
        metadata: {}
        data:
          name: Print Weight - No Data
          message: >-
            WARNING: Print job "{{
            states('sensor.ntk_ryansoffice_3dprinter_task_name') }}" completed
            with no per-tray weight data. Total weight: {{
            states('sensor.ntk_ryansoffice_3dprinter_print_weight') }}g.
            Spoolman not updated - manual update required.
      - if:
          - condition: template
            value_template: "{{ archive_id_valid }}"
        then:
          - action: bambuddy.append_print_history_event
            response_variable: spool_usage_not_recorded_event_result
            data:
              archive_id: "{{ archive_id_raw | int(0) }}"
              event_type: spool_usage_not_recorded
              event_source: spoolman_sync
              event_time: "{{ now().isoformat() }}"
              event_status: not_recorded
              event_key: "spool_usage_not_recorded:{{ archive_id_raw }}:no_data"
              payload:
                reason_code: no_per_tray_weight_data
                task_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') | string | trim }}"
                total_weight_g: "{{ states('sensor.ntk_ryansoffice_3dprinter_print_weight') | string | trim }}"
                current_has_attributes: "{{ current_has_attributes }}"
                backup_available: "{{ backup_available }}"
                backup_usable: "{{ backup_usable }}"
                message: No per-tray weight data was available, so Spoolman usage was not updated.
  
  # Stop if no data is available at all
  - condition: template
    value_template: >
      {{ ((print_weight_attributes_json
           if print_weight_attributes_json is mapping
           else (print_weight_attributes_json | from_json({}))).keys()) |
         select('match', '^(AMS|External)') | list | length > 0 }}
    alias: Ensure we have AMS or External Spool print weight data
  
  # Build list of tray:weight pairs for trays with usage
  - variables:
      ams_trays_string: >
        {% set ns = namespace(result='') %}
        {% set print_weight_attributes =
          (print_weight_attributes_json
           if print_weight_attributes_json is mapping
           else (print_weight_attributes_json | from_json({}))) %}
        {% for key, value in print_weight_attributes.items() %}
          {% if key is match('^(AMS|External)') %}
            {% set ns.result = ns.result ~ key ~ ':' ~ value ~ ',' %}
          {% endif %}
        {% endfor %}
        {{ ns.result }}
      ams_tray_list: |
        {{ ams_trays_string.rstrip(',').split(',') | list }}
  
  - action: logbook.log
    metadata: {}
    data:
      name: Print Weight Processing
      message: >
        Processing {{ ams_tray_list | length }} tray(s) for "{{
        task_name_current }}".
        Data source: {{ 'Backup (HA restarted during print)' if (not current_has_attributes and backup_usable) else 'Current sensor' }}.
  
  # Process each tray
  - repeat:
      sequence:
        - variables:
            tray_info: "{{ repeat.item.strip() }}"
            tray_name: "{{ tray_info.split(':')[0].strip() }}"
            tray_print_weight: "{{ tray_info.split(':')[1] | float(0) }}"
            tray_print_weight_display: >-
              {% set weight = tray_info.split(':')[1] | float(0) %}
              {{ ('%.2f' | format(weight)).rstrip('0').rstrip('.') }}
  
        # Skip empty items and trays with zero weight
        - condition: template
          value_template: "{{ tray_print_weight > 0 and tray_name | length > 0 }}"
  
        # Determine tray entity ID
        - variables:
            tray_number: >
              {% if 'External Spool' in tray_name %}
                external
              {% else %}
                {{ tray_name.split(' ')[3] }}
              {% endif %}
            tray_ams_number: >
              {% if 'External Spool' in tray_name %}
                external
              {% else %}
                {{ tray_name.split(' ')[1] }}
              {% endif %}
            tray_entity_id: >
              {% if tray_number == 'external' %}
                sensor.ntk_ryansoffice_3dprinter_external_spool
              {% else %}
                sensor.p1s_01p00c460102350_ams_{{ tray_ams_number }}_tray_{{ tray_number }}
              {% endif %}
  
        # Get tray details for spool lookup
        - variables:
            selected_tray:
              uuid: "{{ state_attr(tray_entity_id, 'tray_uuid') }}"
              type: "{{ state_attr(tray_entity_id, 'type') }}"
              color: "{{ state_attr(tray_entity_id, 'color') | replace('#', '') }}"
              name: "{{ state_attr(tray_entity_id, 'name') | default('') }}"
            tray_uuid_normalized: "{{ (selected_tray.uuid | string | lower) }}"
  
        # If AMS tray UUID is missing, skip matching to avoid decrementing wrong spool
        - if:
            - condition: template
              value_template: >-
                {{ tray_number != 'external' and
                   tray_uuid_normalized in ['none', 'unknown', 'unavailable', ''] }}
              alias: AMS tray UUID missing (possible runout/swap)
          then:
            - action: persistent_notification.create
              metadata: {}
              data:
                notification_id: >-
                  spoolman_sync_uuid_missing_{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') | slugify }}_{{ tray_name | slugify }}
                title: "Spoolman Update Skipped: Missing Tray UUID"
                message: >-
                  **Print Job:** {{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}

                  **Tray:** {{ tray_name }}

                  **Weight:** {{ tray_print_weight_display }}g

                  **Reason:** The tray UUID is missing for {{ tray_name }}.
                  This commonly happens when a spool runs out or is swapped during print.

                  To avoid decrementing the wrong spool, automatic Spoolman update was skipped for this tray.
            - action: system_log.write
              metadata: {}
              data:
                message: >-
                  Print Complete WARNING: Skipping Spoolman update for {{ tray_name }} because tray UUID is missing
                  (entity: {{ tray_entity_id }}, task: {{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}).
                  Possible spool runout/swap during print. Weight {{ tray_print_weight_display }}g not auto-applied.
                level: warning
                logger: homeassistant.components.bambulab.spoolman_sync
            - action: logbook.log
              metadata: {}
              data:
                name: Spoolman Sync Skipped
                message: >-
                  Skipped filament update for {{ tray_name }} ({{ tray_print_weight_display }}g) because tray UUID was missing.
                  Possible spool runout/swap during print.
            - if:
                - condition: template
                  value_template: "{{ archive_id_valid }}"
              then:
                - action: bambuddy.append_print_history_event
                  response_variable: spool_usage_missing_uuid_event_result
                  data:
                    archive_id: "{{ archive_id_raw | int(0) }}"
                    event_type: spool_usage_recording_failed
                    event_source: spoolman_sync
                    event_time: "{{ now().isoformat() }}"
                    event_status: failed
                    event_key: "spool_usage_recording_failed:{{ archive_id_raw }}:{{ tray_name | slugify }}:missing_uuid"
                    payload:
                      reason_code: missing_tray_uuid
                      tray_name: "{{ tray_name }}"
                      tray_entity_id: "{{ tray_entity_id }}"
                      used_grams: "{{ tray_print_weight_display }}"
                      task_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') | string | trim }}"
                      message: Tray UUID was missing, so automatic spool usage recording was skipped for this tray.
  
        - condition: template
          value_template: >-
            {{ not (tray_number != 'external' and
                    tray_uuid_normalized in ['none', 'unknown', 'unavailable', '']) }}
          alias: Continue only when tray UUID is available (or tray is external)
  
        # Resolve matching spool from tray_map via shared resolver script
        - variables:
            tray_key: >-
              {% if tray_number == 'external' %}
                external_spool
              {% else %}
                ams_{{ tray_ams_number }}_tray_{{ tray_number }}
              {% endif %}
        - action: script.resolve_matching_spool_from_tray_map
          metadata: {}
          data:
            tray_entity_id: "{{ tray_entity_id }}"
            tray_key: "{{ tray_key }}"
          response_variable: find_spool_response
  
        # Update Spoolman if spool was found, otherwise log error
        - alias: Take action if Spool was found (or error if not)
          choose:
            - conditions:
                - condition: template
                  value_template: "{{ find_spool_response.success }}"
                  alias: Spool found (response from script)
              sequence:
                - action: spoolman.use_spool_filament
                  metadata: {}
                  data:
                    id: "{{ find_spool_response.spool.id }}"
                    use_weight: "{{ tray_print_weight }}"
                - action: system_log.write
                  metadata: {}
                  data:
                    message: >-
                      Print Complete: Successfully updated filament usage in
                      Spoolman for {{ tray_name }}. Task: {{
                      states('sensor.ntk_ryansoffice_3dprinter_task_name') }}.
                      Spool ID {{ find_spool_response.spool.id }} ({{
                      find_spool_response.spool.filament.name }}). Used {{
                      tray_print_weight_display }} grams.
                    level: info
                    logger: homeassistant.components.bambulab.spoolman_sync
                - action: logbook.log
                  metadata: {}
                  data:
                    name: Spoolman {{ tray_name }}
                    message: >-
                      Print Job complete - {{
                      states('sensor.ntk_ryansoffice_3dprinter_task_name')
                      }}     Updated Filament Usage for {{ tray_name }}. Spool
                      ID {{ find_spool_response.spool.id }} ({{
                      find_spool_response.spool.filament.name }}). Used {{
                      tray_print_weight_display }} grams.
                  alias: Log the Filament Usage
                - action: persistent_notification.create
                  metadata: {}
                  data:
                    title: >-
                      Print Job {{
                      states('sensor.ntk_ryansoffice_3dprinter_task_name') }}
                      Finished
                    message: >-
                      Print Job complete - **{{
                      states('sensor.ntk_ryansoffice_3dprinter_task_name') }}**


                      Updated Filament Usage for {{ tray_name }}.
                      {{ find_spool_response.spool.filament.name }} (Spool #{{
                      find_spool_response.spool.id }}).


                      Used {{ tray_print_weight_display }} grams.
                    notification_id: >-
                      spoolman_print_complete_{{
                      states('sensor.ntk_ryansoffice_3dprinter_task_name') |
                      slugify }}_{{ tray_name | slugify }}
                - if:
                    - condition: template
                      value_template: "{{ archive_id_valid }}"
                  then:
                    - action: bambuddy.append_print_history_event
                      response_variable: spool_usage_recorded_event_result
                      data:
                        archive_id: "{{ archive_id_raw | int(0) }}"
                        event_type: spool_usage_recorded
                        event_source: spoolman_sync
                        event_time: "{{ now().isoformat() }}"
                        event_status: recorded
                        event_key: "spool_usage_recorded:{{ archive_id_raw }}:{{ tray_name | slugify }}:{{ tray_print_weight_display }}"
                        payload:
                          tray_name: "{{ tray_name }}"
                          tray_entity_id: "{{ tray_entity_id }}"
                          spool_id: "{{ find_spool_response.spool.id }}"
                          filament_name: "{{ find_spool_response.spool.filament.name }}"
                          used_grams: "{{ tray_print_weight_display }}"
                          task_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') | string | trim }}"
                          message: Spool usage was recorded successfully for this tray.
          default:
            - variables:
                task_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}"
                error_timestamp: "{{ now().isoformat() }}"
                probable_cause: >-
                  {% set msg = (find_spool_response.message | string | lower) %}
                  {% set tray_uuid = (selected_tray.uuid | string | lower) %}
                  {% if tray_uuid in ['none', 'unknown', 'unavailable', ''] %}
                    Tray appears empty or changed (possible spool runout/swap during print).
                  {% elif 'no spool' in msg or 'not found' in msg %}
                    No matching spool found in Spoolman (possible runout/swap or tray metadata mismatch).
                  {% else %}
                    Spool matching failed due to metadata mismatch or lookup error.
                  {% endif %}
                error_details: >-
                  {{ error_timestamp }}|{{ tray_name }}|{{
                  find_spool_response.message }}|{{ tray_print_weight_display }}|{{
                  selected_tray.uuid }}|{{ selected_tray.color }}|{{
                  selected_tray.type }}|{{ tray_entity_id }}|{{ probable_cause }}
                current_error_log: "{{ state_attr('sensor.spoolman_sync_error_log_storage', 'log') | default('') }}"
            - action: input_boolean.turn_on
              data:
                entity_id: input_boolean.spoolman_sync_error_active
            - action: input_text.set_value
              data:
                entity_id: input_text.spoolman_sync_last_error
                value: "{{ error_details }}"
            - action: input_datetime.set_datetime
              data:
                entity_id: input_datetime.spoolman_sync_last_error_time
                datetime: "{{ error_timestamp }}"
            - event: bambulab_store_error_log
              event_data:
                value: >-
                  {% set log_lines = current_error_log.split('\n') if
                  current_error_log else [] %}
                  {# Keep last 9 entries + new entry = 10 total max #}
                  {% set new_log = log_lines[-9:] + [error_details] %}
                  {{ new_log | join('\n') }}
            - action: persistent_notification.create
              metadata: {}
              data:
                notification_id: >-
                  spoolman_sync_error_{{ tray_name | replace(' ', '_') }}
                title: "Spoolman Update Error: Cannot Find Spool"
                message: >-
                  **Print Job:** {{ task_name }}
  
                  **Tray:** {{ tray_name }}
  
                  **Print Weight:** {{ tray_print_weight_display }} grams
  
                  **Error:** {{ find_spool_response.message }}
  
                  **Likely Cause:** {{ probable_cause }}
  
  
                  **Tray Details for Manual Recovery:**

                  - UUID: {{ selected_tray.uuid }}

                  - Color: {{ selected_tray.color }}

                  - Type: {{ selected_tray.type }}


                  To manually update Spoolman, find the matching spool and
                  reduce its weight by {{ tray_print_weight_display }}g. You can also
                  use the Manual Recovery script from the dashboard.
            - action: system_log.write
              metadata: {}
              data:
                message: >-
                  Print Complete ERROR: Cannot find spool in Spoolman for {{
                  tray_name }}. Task: {{ task_name }}.
                  Likely cause: {{ probable_cause }}.
                  UUID: {{ selected_tray.uuid }}, Type: {{ selected_tray.type
                  }}, Color: {{ selected_tray.color }}, Entity: {{
                  tray_entity_id }}. Used {{
                  tray_print_weight_display }} grams. Error: {{
                  find_spool_response.message }}
                level: error
                logger: homeassistant.components.bambulab.spoolman_sync
            - action: logbook.log
              metadata: {}
              data:
                name: Spoolman Sync Error
                message: >-
                  Failed to update filament usage for {{ tray_name }} after
                  print "{{ task_name }}". Weight: {{ tray_print_weight_display }}g.
                  Error: {{ find_spool_response.message }}. Likely cause: {{
                  probable_cause }}
            - if:
                - condition: template
                  value_template: "{{ archive_id_valid }}"
              then:
                - action: bambuddy.append_print_history_event
                  response_variable: spool_usage_lookup_failed_event_result
                  data:
                    archive_id: "{{ archive_id_raw | int(0) }}"
                    event_type: spool_usage_recording_failed
                    event_source: spoolman_sync
                    event_time: "{{ error_timestamp }}"
                    event_status: failed
                    event_key: "spool_usage_recording_failed:{{ archive_id_raw }}:{{ tray_name | slugify }}:lookup_failed"
                    payload:
                      reason_code: spool_lookup_failed
                      tray_name: "{{ tray_name }}"
                      tray_entity_id: "{{ tray_entity_id }}"
                      tray_uuid: "{{ selected_tray.uuid }}"
                      tray_color: "{{ selected_tray.color }}"
                      tray_type: "{{ selected_tray.type }}"
                      used_grams: "{{ tray_print_weight_display }}"
                      probable_cause: "{{ probable_cause }}"
                      task_name: "{{ task_name | string | trim }}"
                      message: "{{ find_spool_response.message | string | trim }}"
      for_each: "{{ ams_tray_list }}"
  
  - action: input_text.set_value
    target:
      entity_id: input_text.spoolman_sync_last_processed_print
    data:
      value: "{{ task_name_current }}|{{ current_total_weight_raw }}|{{ now().isoformat() }}"

  # Clear the backup after processing to avoid stale data on next print
  - action: input_text.set_value
    target:
      entity_id: input_text.print_weight_backup
    data:
      value: ""
  
  - action: input_text.set_value
    target:
      entity_id: input_text.print_metadata_backup
    data:
      value: ""
  
  - action: logbook.log
    metadata: {}
    data:
      name: Print Weight Backup Cleared
      message: Print weight backup cleared after processing.
  
  mode: single
