- alias: Print Started - Capture Print Data
  description: >-
    Captures print job and AMS tray information when a print starts.
    This data is stored persistently so it can be used for manual recovery
    if the spoolman sync automation fails when the print completes.
    Also captures external spool data if in use.
  triggers:
  - device_id: 210dfdfa64085e8cf073e50eae757d90
    domain: bambu_lab
    type: event_print_started
    trigger: device
  conditions: []
  actions:
  - variables:
      task_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}"  # Update to your printer's task name sensor
      start_time: "{{ now().isoformat() }}"
  
  # Store basic print job info
  - action: input_text.set_value
    data:
      entity_id: input_text.print_job_current
      value: "{{ task_name }}|{{ start_time }}"
  
  # Capture AMS tray configuration for all 4 trays
  - variables:
      tray_data: >-
        [
        {% for tray_num in range(1, 5) %}
          {# Update the following entity prefix to match your printer's serial number #}
          {% set tray_entity = 'sensor.p1s_01p00c460102350_ams_1_tray_' ~ tray_num %}
          {
            "tray": {{ tray_num }},
            "uuid": "{{ state_attr(tray_entity, 'tray_uuid') | default('') }}",
            "color": "{{ state_attr(tray_entity, 'color') | default('') | replace('#', '') }}",
            "type": "{{ state_attr(tray_entity, 'type') | default('') }}",
            "name": "{{ state_attr(tray_entity, 'name') | default('') }}"
          }{% if not loop.last %},{% endif %}
        {% endfor %}
        ]
  
  # Fire a custom event to update the trigger-based template sensor.
  # This avoids the 255-char input_text limit — sensor attributes have no size cap.
  # The sensor (sensor.print_job_ams_tray_storage) persists across HA restarts.
  - event: bambulab_store_ams_trays
    event_data:
      value: "{{ tray_data }}"
  
  # Capture external spool data (for recovery if printing from external spool).
  # Treat active_tray='none' as external only when external_spool is explicitly active,
  # to avoid false positives during AMS transition windows.
  - variables:
      active_tray_state: "{{ states('sensor.ntk_ryansoffice_3dprinter_active_tray') }}"
      external_spool_is_active: >-
        {{ state_attr('sensor.ntk_ryansoffice_3dprinter_external_spool', 'active') is true }}
      is_external_spool: >-
        {{ active_tray_state == 'none' and external_spool_is_active }}
      external_spool_data: >-
        {
          "tray": "external",
          "uuid": "{{ state_attr('sensor.ntk_ryansoffice_3dprinter_external_spool', 'tray_uuid') | default('') }}",
          "color": "{{ state_attr('sensor.ntk_ryansoffice_3dprinter_external_spool', 'color') | default('') | replace('#', '') }}",
          "type": "{{ state_attr('sensor.ntk_ryansoffice_3dprinter_external_spool', 'type') | default('') }}",
          "name": "{{ state_attr('sensor.ntk_ryansoffice_3dprinter_external_spool', 'name') | default('') }}",
          "is_active": {{ is_external_spool | tojson }}
        }
  
  - action: input_text.set_value
    data:
      entity_id: input_text.print_job_external_spool
      value: "{{ external_spool_data }}"
  
  - action: logbook.log
    data:
      name: Print Started
      message: >-
        Print job "{{ task_name }}" started. AMS tray configuration captured for potential recovery.
        External spool active: {{ is_external_spool }}.
  - action: system_log.write
    metadata: {}
    data:
      message: >-
        Print Started: Print job "{{ task_name }}" started at {{ start_time }}.
        AMS tray configuration captured for potential recovery.
        External spool active: {{ is_external_spool }}.
      level: info
      logger: homeassistant.components.bambulab.spoolman_sync
  mode: single
