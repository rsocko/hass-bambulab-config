# Docs: docs/features/spoolman_sync/print_weight_persistence.md
- alias: Print Weight Persistence - Auto Self-Test (Optional)
  id: print_weight_persistence_auto_self_test
  description: >-
    Optional automation that runs the print weight persistence self-test script at
    active printing and print finish. Uses phase-specific notification IDs so start
    and finish diagnostics do not overwrite each other.
  triggers:
  - trigger: state
    entity_id: sensor.ntk_ryansoffice_3dprinter_print_status
    to: running
    for:
      seconds: 5
    id: start
  - trigger: device
    device_id: 210dfdfa64085e8cf073e50eae757d90
    domain: bambu_lab
    type: event_print_finished
    id: finish
  conditions: []
  actions:
  - action: script.print_weight_persistence_self_test
    data:
      phase: "{{ trigger.id }}"
  
  mode: queued
