- alias: "3D Printer - Spoolman Location Changed: Assign Tray Metadata"
  id: spoolman_location_change_assign_tray
  description: >-
    Phase 2 automation that listens for Spoolman location changes to AMS / AMS 2 /
    External Spool Holder, infers tray target when possible, and runs
    script.assign_spool_to_printer_tray.
  trigger:
    - platform: event
      event_type: state_changed
  condition:
    - condition: template
      value_template: >-
        {% set entity_id = trigger.event.data.entity_id | default('', true) | string %}
        {{ entity_id | regex_match('^select\\.spoolman_spool_\\d+_location$') }}
    - condition: template
      value_template: >-
        {% set old_state = trigger.event.data.old_state.state if trigger.event.data.old_state is not none else '' %}
        {% set new_state = trigger.event.data.new_state.state if trigger.event.data.new_state is not none else '' %}
        {{ new_state | length > 0 and new_state not in ['unknown', 'unavailable'] and new_state != old_state }}
  action:
    - variables:
        location_entity_id: "{{ trigger.event.data.entity_id | default('', true) | string }}"
        to_location: "{{ trigger.event.data.new_state.state if trigger.event.data.new_state is not none else '' }}"
        spool_id: >-
          {{ (location_entity_id | regex_findall('spoolman_spool_(\d+)_location'))[0] | default('') }}
        spool_entity_id: >-
          {{ 'sensor.spoolman_spool_' ~ spool_id if spool_id | regex_match('^\d+$') else '' }}
        target_is_ams_1: "{{ to_location == 'AMS' }}"
        target_is_ams_2: "{{ to_location == 'AMS 2' }}"
        target_is_external: "{{ to_location == 'External Spool Holder' }}"
        is_supported_target: "{{ target_is_ams_1 or target_is_ams_2 or target_is_external }}"
        ams_1_trays:
          - sensor.p1s_01p00c460102350_ams_1_tray_1
          - sensor.p1s_01p00c460102350_ams_1_tray_2
          - sensor.p1s_01p00c460102350_ams_1_tray_3
          - sensor.p1s_01p00c460102350_ams_1_tray_4
        ams_2_trays:
          - sensor.p1s_01p00c460102350_ams_2_tray_1
          - sensor.p1s_01p00c460102350_ams_2_tray_2
          - sensor.p1s_01p00c460102350_ams_2_tray_3
          - sensor.p1s_01p00c460102350_ams_2_tray_4
        candidate_trays: >-
          {% if target_is_ams_2 %}
            {{ ams_2_trays }}
          {% elif target_is_ams_1 %}
            {{ ams_1_trays }}
          {% else %}
            {{ [] }}
          {% endif %}
        empty_candidate_trays: >-
          {% set ns = namespace(trays=[]) %}
          {% for entity_id in candidate_trays %}
            {% set tray_type = state_attr(entity_id, 'type') | default('', true) | string | trim %}
            {% if tray_type | lower == 'empty' %}
              {% set ns.trays = ns.trays + [entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.trays }}
        inferred_tray_entity_id: >-
          {% if (empty_candidate_trays | count) == 1 %}
            {{ empty_candidate_trays | first }}
          {% else %}
            {{ '' }}
          {% endif %}
        target_tray_entity_id: >-
          {% if target_is_external %}
            sensor.ntk_ryansoffice_3dprinter_external_spool
          {% else %}
            {{ inferred_tray_entity_id }}
          {% endif %}
        needs_tray_selection: "{{ (target_is_ams_1 or target_is_ams_2) and inferred_tray_entity_id | length == 0 }}"
        can_assign_now: "{{ is_supported_target and spool_id | regex_match('^\\d+$') and target_tray_entity_id | length > 0 }}"
        spool_vendor: >-
          {{ state_attr(spool_entity_id, 'filament_vendor_name') | default('', true) | string | trim }}
        spool_uuid: >-
          {{ state_attr(spool_entity_id, 'extra_spool_uuid') | default('', true) | string | trim('"') | trim }}
        has_rfid_uuid: >-
          {{ spool_uuid | lower not in ['', 'none', 'unknown', 'unavailable'] and not (spool_uuid | lower | regex_match('^0+$')) }}
        spool_name: >-
          {{ state_attr(spool_entity_id, 'friendly_name') | default('Spool #' ~ spool_id, true) }}
        is_bambu_rfid_in_ams: >-
          {{ spool_vendor == 'Bambu Lab' and (has_rfid_uuid | bool) and not target_is_external and is_supported_target }}

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not is_supported_target }}"
          sequence:
            - action: logbook.log
              data:
                name: Tray Assignment
                message: >-
                  Spool {{ spool_id }} location changed to '{{ to_location }}'
                  — not a supported assignment target. No action taken.
                entity_id: automation.3d_printer_spoolman_location_changed_assign_tray_metadata
                domain: automation
            - stop: Non-assignment target location

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ is_bambu_rfid_in_ams }}"
          sequence:
            - action: logbook.log
              data:
                name: Tray Assignment
                message: >-
                  Spool {{ spool_id }} is a Bambu Lab spool with RFID UUID —
                  AMS will configure the tray automatically via RFID reader.
                  No tray assignment needed.
                entity_id: automation.3d_printer_spoolman_location_changed_assign_tray_metadata
                domain: automation
            - event: spoolman_tray_assignment_result
              event_data:
                status: skipped_bambu_rfid
                message: >-
                  Bambu Lab spool {{ spool_id }} moved to {{ to_location }} —
                  AMS will auto-configure via RFID reader.
                spool_entity_id: "{{ spool_entity_id }}"
                tray_entity_id: ""
                tray_info_idx: ""
                tray_type: ""
                tray_color: ""
            - stop: Bambu RFID spool in AMS — RFID reader is authoritative

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ can_assign_now }}"
          sequence:
            - action: logbook.log
              data:
                name: Tray Assignment
                message: >-
                  Assigning spool {{ spool_id }} ({{ spool_entity_id }})
                  → {{ target_tray_entity_id }} for location '{{ to_location }}'.
                entity_id: automation.3d_printer_spoolman_location_changed_assign_tray_metadata
                domain: automation
            - action: script.assign_spool_to_printer_tray
              data:
                spool_id: "{{ spool_id }}"
                tray_entity_id: "{{ target_tray_entity_id }}"
                force_write: true
              response_variable: assignment_response
            - action: logbook.log
              data:
                name: Tray Assignment
                message: >-
                  Spool {{ spool_id }} → {{ to_location }}: {{ assignment_response.status | default('unknown') }}.
                  {{ assignment_response.message | default('') }}
                entity_id: automation.3d_printer_spoolman_location_changed_assign_tray_metadata
                domain: automation
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ not (assignment_response.success | default(false)) }}"
                  sequence:
                    - action: persistent_notification.create
                      data:
                        title: "Tray Assignment Did Not Complete — {{ spool_name }}"
                        message: >-
                          {{ spool_name }} -> {{ to_location }} failed.
                          {{ assignment_response.message | default('Unknown tray assignment error.') }}
                        notification_id: tray_assignment_auto_failed_{{ spool_id }}

        - conditions:
            - condition: template
              value_template: "{{ is_supported_target and needs_tray_selection and spool_id | regex_match('^\\d+$') }}"
          sequence:
            - action: logbook.log
              data:
                name: Tray Assignment
                message: >-
                  Spool {{ spool_id }} moved to '{{ to_location }}' but tray inference
                  failed ({{ empty_candidate_trays | count }} empty trays). Awaiting manual selection.
                entity_id: automation.3d_printer_spoolman_location_changed_assign_tray_metadata
                domain: automation
            # Append to pending tray selections queue (dedup by spool_id)
            - variables:
                new_pending_queue: >-
                  {% set raw = states('input_text.pending_tray_selections_queue') %}
                  {% set current = (raw | from_json | default([], true)) if raw not in ['', 'unknown', 'unavailable'] else [] %}
                  {% if current is not iterable or current is string %}{% set current = [] %}{% endif %}
                  {% set ns = namespace(items=[]) %}
                  {% for item in current %}
                    {% if (item.s | int(-1)) != (spool_id | int(-1)) %}
                      {% set ns.items = ns.items + [item] %}
                    {% endif %}
                  {% endfor %}
                  {% set ns.items = ns.items + [{'s': spool_id | int}] %}
                  {{ ns.items | to_json }}
            - action: input_text.set_value
              data:
                entity_id: input_text.pending_tray_selections_queue
                value: "{{ new_pending_queue }}"
            # Keep legacy helper in sync for backward compat (first item)
            - action: input_text.set_value
              data:
                entity_id: input_text.pending_tray_assignment_spool_id
                value: "{{ ((new_pending_queue | from_json)[0].s | default('')) | string }}"
            - event: spoolman_tray_assignment_result
              event_data:
                status: needs_tray_selection
                message: >-
                  Unable to infer tray for spool {{ spool_id }} in {{ to_location }}.
                  {{ (new_pending_queue | from_json) | count }} spool(s) awaiting tray selection.
                spool_entity_id: "{{ spool_entity_id }}"
                tray_entity_id: ""
                tray_info_idx: ""
                tray_type: ""
                tray_color: ""
            - action: persistent_notification.create
              data:
                title: "Tray Selection Needed — {{ spool_name }}"
                message: >-
                  {{ spool_name }} moved to {{ to_location }}, but tray inference
                  could not pick one tray automatically
                  ({{ empty_candidate_trays | count }} empty tray{{ 's' if (empty_candidate_trays | count) != 1 else '' }} found).

                  Open any 3D Printing dashboard tab (Home, Spool, or Filament Catalog)
                  to see the tray picker and select the correct tray.
                notification_id: tray_assignment_needs_selection_{{ spool_id }}

      default: []
  mode: parallel
  max: 150
