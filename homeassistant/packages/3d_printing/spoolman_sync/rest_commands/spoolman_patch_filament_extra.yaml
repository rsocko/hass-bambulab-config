# Patch filament-level extra fields in Spoolman.
# Uses Spoolman API v1 endpoint: PATCH /api/v1/filament/{filament_id}
# Note: Spoolman replaces the entire `extra` object when provided.
spoolman_patch_filament_extra:
  url: "http://spoolman.socko.us/api/v1/filament/{{ filament_id }}"
  method: PATCH
  headers:
    accept: "application/json, text/html"
    Content-Type: "application/json"
  payload: >-
    {% set ns = namespace(encoded=dict()) %}
    {% for key, value in (extra | default({}, true)).items() %}
      {% if value is sameas true %}
        {% set encoded_value = 'true' %}
      {% elif value is sameas false %}
        {% set encoded_value = 'false' %}
      {% elif value is string %}
        {% set raw_value = value | trim %}
        {% if raw_value | regex_match('^(".*"|\[.*\]|\{.*\}|null)$') %}
          {% set encoded_value = raw_value %}
        {% else %}
          {% set encoded_value = raw_value | tojson %}
        {% endif %}
      {% else %}
        {% set encoded_value = value | tojson %}
      {% endif %}
      {% set ns.encoded = ns.encoded | combine({ key: encoded_value }) %}
    {% endfor %}
    {
      "extra": {{ ns.encoded | tojson }}
    }
  content_type: "application/json"
