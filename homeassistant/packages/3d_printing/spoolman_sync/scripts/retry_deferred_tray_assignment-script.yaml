retry_deferred_tray_assignment:
  alias: Retry Deferred Tray Assignment
  description: >-
    Pops the first item from the deferred tray assignment queue and
    re-runs the assignment script with force_write. If the printer is
    still busy the assign script will re-append the item to the queue.
    Intended for manual retry from the dashboard popup.
  icon: mdi:refresh
  mode: single
  sequence:
    - variables:
        first: >-
          {% set raw = states('input_text.deferred_tray_assignments_queue') %}
          {% set queue = raw | from_json([]) if raw is string and raw not in ['', 'unknown', 'unavailable'] else (raw if raw is list else []) %}
          {% if queue is iterable and queue is not string and queue | count > 0 %}{{ queue[0] }}{% else %}{{ none }}{% endif %}
        has_item: "{{ first is mapping }}"
        spool_id: "{{ first.s | default('') | string if has_item else '' }}"
        tray_code: "{{ first.t | default(0) | int if has_item else 0 }}"
        is_rfid_entry: "{{ (first.r | default(0) | int) == 1 if has_item else false }}"
        tray_entity_id: >-
          {% if not has_item %}{{ '' }}
          {% elif tray_code | int == 0 %}sensor.ntk_ryansoffice_3dprinter_external_spool
          {% else %}sensor.p1s_01p00c460102350_ams_{{ (tray_code | int / 10) | int }}_tray_{{ tray_code | int % 10 }}{% endif %}
        remaining_json: >-
          {% set raw = states('input_text.deferred_tray_assignments_queue') %}
          {% set queue = raw | from_json([]) if raw is string and raw not in ['', 'unknown', 'unavailable'] else (raw if raw is list else []) %}
          {% if queue is iterable and queue is not string %}{{ queue[1:] | to_json }}{% else %}[]{% endif %}

    - condition: template
      value_template: "{{ has_item and spool_id | regex_match('^\\d+$') }}"

    # Pop first item from queue before processing
    - action: input_text.set_value
      data:
        entity_id: input_text.deferred_tray_assignments_queue
        value: "{{ remaining_json }}"

    - choose:
        # RFID entry: AMS re-reads tag now that printer is idle
        - conditions:
            - condition: template
              value_template: "{{ is_rfid_entry }}"
          sequence:
            - event: spoolman_tray_assignment_result
              event_data:
                status: skipped_bambu_rfid
                message: >-
                  Bambu RFID spool {{ spool_id }} — printer now idle,
                  AMS will auto-configure via RFID reader.
                spool_entity_id: "sensor.spoolman_spool_{{ spool_id }}"
                tray_entity_id: "{{ tray_entity_id }}"
                tray_info_idx: ""
                tray_type: ""
                tray_color: ""
      default:
        # Normal entry: retry the assignment
        - action: script.turn_on
          target:
            entity_id: script.assign_spool_to_printer_tray
          data:
            variables:
              spool_id: "{{ spool_id }}"
              tray_entity_id: "{{ tray_entity_id }}"
              force_write: true
