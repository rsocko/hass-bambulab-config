# Docs: docs/features/spoolman_sync/find_matching_spools.md
match_inserted_tray_spool_in_spoolman:
  alias: Match Inserted Tray Spool in Spoolman
  description: >-
    Attempts to match the current tray data to a Spoolman spool using the shared
    matching logic. If a Bambu spool UUID is present on the tray and the matched
    spool has no UUID yet, updates Spoolman extra.spool_uuid.
  icon: mdi:link-variant-plus
  fields:
    tray_entity_id:
      name: Tray Entity
      description: Sensor entity for the tray (AMS slot or external spool).
      required: true
      selector:
        entity:
          domain: sensor
    tray_label:
      name: Tray Label
      description: Optional human-friendly tray label used in logs and notifications.
      required: false
    tray_key:
      name: Tray Key
      description: Optional internal tray key (for notification IDs).
      required: false
  sequence:
  - variables:
      label: "{{ tray_label | default(tray_entity_id) }}"
      key: "{{ tray_key | default(tray_entity_id | slugify) }}"
      active_tray:
        uuid: "{{ state_attr(tray_entity_id, 'tray_uuid') | default('') }}"
        type: "{{ state_attr(tray_entity_id, 'type') | default('') }}"
        color: "{{ state_attr(tray_entity_id, 'color') | default('') | replace('#', '') }}"
        name: "{{ state_attr(tray_entity_id, 'name') | default('') }}"
        remain: "{{ state_attr(tray_entity_id, 'remain') | default('') }}"
      tray_has_valid_uuid: >-
        {{ active_tray.uuid | length > 0 and not active_tray.uuid | regex_match('^0+$') }}
      tray_has_matchable_attributes: >-
        {{ active_tray.color | length > 0 and active_tray.type | length > 0 and active_tray.name | length > 0 }}
      has_matchable_data: "{{ tray_has_valid_uuid or tray_has_matchable_attributes }}"
  - if:
      - condition: template
        value_template: "{{ not has_matchable_data }}"
    then:
      - action: system_log.write
        metadata: {}
        data:
          message: >-
            Manual Tray Match: Skipping {{ label }} because tray data is
            incomplete. UUID: {{ active_tray.uuid }}, Type: {{ active_tray.type
            }}, Color: {{ active_tray.color }}, Name: {{ active_tray.name }}.
          level: warning
          logger: homeassistant.components.bambulab.spoolman_sync
      - action: persistent_notification.create
        metadata: {}
        data:
          title: "Manual Spool Match Skipped: Incomplete Tray Data"
          message: >-
            Tray {{ label }} does not have enough data to match a spool.

            UUID: `{{ active_tray.uuid }}`
            Type: `{{ active_tray.type }}`
            Color: `{{ active_tray.color }}`
            Name: `{{ active_tray.name }}`
          notification_id: "spoolman_manual_match_incomplete_{{ key }}"
      - variables:
          response_object:
            success: false
            skipped: true
            message: Incomplete tray data
            tray:
              entity_id: "{{ tray_entity_id }}"
              label: "{{ label }}"
              key: "{{ key }}"
              uuid: "{{ active_tray.uuid }}"
              type: "{{ active_tray.type }}"
              color: "{{ active_tray.color }}"
              name: "{{ active_tray.name }}"
            spool: null
      - stop: Skip incomplete tray data
        response_variable: response_object
  - action: script.find_matching_spool_in_spoolman
    metadata: {}
    data:
      parameters:
        target_color_hex: "{{ active_tray.color }}"
        target_type: "{{ active_tray.type }}"
        target_uuid: "{{ active_tray.uuid }}"
        target_name: "{{ active_tray.name }}"
        remaining_enabled: false
        remaining_percent: "{{ active_tray.remain }}"
        tray_weight: 1000
    response_variable: find_spool_response
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ find_spool_response.success }}"
        sequence:
          - variables:
              should_update_uuid: >-
               {{ tray_has_valid_uuid and
                 (find_spool_response.spool.extra.spool_uuid | default('') | string | replace('"', '') | trim | length == 0) and
                 find_spool_response.spool.filament.vendor.name == 'Bambu Lab' }}
          - if:
              - condition: template
                value_template: "{{ should_update_uuid }}"
            then:
              - action: spoolman.patch_spool
                metadata: {}
                data:
                  id: "{{ find_spool_response.spool.id }}"
                  extra:
                    spool_uuid: "{{ active_tray.uuid }}"
            else:
              - action: system_log.write
                metadata: {}
                data:
                  message: >-
                    Manual Tray Match: Matched spool ID {{
                    find_spool_response.spool.id }} for {{ label }}. UUID update
                    not required.
                  level: info
                  logger: homeassistant.components.bambulab.spoolman_sync
          - action: logbook.log
            metadata: {}
            data:
              name: Spoolman Manual Tray Match
              message: >-
                Matched tray {{ label }} to spool ID {{
                find_spool_response.spool.id }} ({{
                find_spool_response.spool.filament.name }}).{% if should_update_uuid %}
                Updated UUID.{% else %} UUID update not needed.{% endif %}
          - action: persistent_notification.create
            metadata: {}
            data:
              title: "Manual Spool Match Successful"
              message: >-
                Tray {{ label }} matched to spool ID {{
                find_spool_response.spool.id }} ({{
                find_spool_response.spool.filament.name }}).

                {% if should_update_uuid %}
                Updated `extra.spool_uuid` to `{{ active_tray.uuid }}`.
                {% else %}
                No UUID update was required.
                {% endif %}
              notification_id: "spoolman_manual_match_success_{{ key }}"
          - variables:
              response_object:
                success: true
                skipped: false
                message: >-
                  {% if should_update_uuid %}
                  Spool matched and UUID updated.
                  {% else %}
                  Spool matched. UUID update not required.
                  {% endif %}
                tray:
                  entity_id: "{{ tray_entity_id }}"
                  label: "{{ label }}"
                  key: "{{ key }}"
                  uuid: "{{ active_tray.uuid }}"
                  type: "{{ active_tray.type }}"
                  color: "{{ active_tray.color }}"
                  name: "{{ active_tray.name }}"
                spool: "{{ find_spool_response.spool }}"
                uuid_updated: "{{ should_update_uuid }}"
                match_message: "{{ find_spool_response.message }}"
          - stop: Manual tray match success
            response_variable: response_object
      - conditions:
          - condition: template
            value_template: "{{ not find_spool_response.success }}"
        sequence:
          - action: system_log.write
            metadata: {}
            data:
              message: >-
                Manual Tray Match ERROR: Cannot find a unique spool for {{
                label }}. UUID: {{ active_tray.uuid }}, Type: {{ active_tray.type
                }}, Color: {{ active_tray.color }}, Name: {{ active_tray.name }}.
                Error: {{ find_spool_response.message }}
              level: error
              logger: homeassistant.components.bambulab.spoolman_sync
          - action: persistent_notification.create
            metadata: {}
            data:
              title: "Manual Spool Match Failed"
              message: >-
                Could not find a unique spool for tray {{ label }}.

                Error: {{ find_spool_response.message }}

                UUID: `{{ active_tray.uuid }}`
                Type: `{{ active_tray.type }}`
                Color: `{{ active_tray.color }}`
                Name: `{{ active_tray.name }}`
              notification_id: "spoolman_manual_match_failed_{{ key }}"
          - variables:
              response_object:
                success: false
                skipped: false
                message: "{{ find_spool_response.message }}"
                tray:
                  entity_id: "{{ tray_entity_id }}"
                  label: "{{ label }}"
                  key: "{{ key }}"
                  uuid: "{{ active_tray.uuid }}"
                  type: "{{ active_tray.type }}"
                  color: "{{ active_tray.color }}"
                  name: "{{ active_tray.name }}"
                spool: null
                all_matches: "{{ find_spool_response.all_matches | default(none) }}"
          - stop: Manual tray match failed
            response_variable: response_object
