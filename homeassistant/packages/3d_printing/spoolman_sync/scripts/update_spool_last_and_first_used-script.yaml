# Docs: docs/features/spoolman_sync/README.md
update_spool_last_and_first_used:
  sequence:
  - if:
      - condition: template
        value_template: >-
          {% set spool_id = spool.id | default(0) | int(0) %}
          {{ spool_id <= 0
             or states('sensor.spoolman_health') | lower
                in ['unknown', 'unavailable', 'none', '']
             or state_attr('sensor.spoolman_filament_totals', 'available') is not true
             or states('sensor.spoolman_spool_' ~ spool_id) | lower
                in ['unknown', 'unavailable', 'none', ''] }}
    then:
      - stop: Spoolman or target spool unavailable
        error: true
  - action: spoolman.patch_spool
    metadata: {}
    data:
      id: "{{ spool.id }}"
      last_used: "{{ now().isoformat() }}"
      first_used: |
        {{ spool.first_used if 'first_used' in spool else now().isoformat() }}
    alias: Update Spoolman Last Used (and First Used if empty)
  - action: system_log.write
    metadata: {}
    data:
      message: >-
        Spool last/first used updated in Spoolman for spool ID {{ spool.id }}.
      level: info
      logger: homeassistant.components.bambulab.spoolman_sync
  - action: logbook.log
    metadata: {}
    data:
      name: Spoolman Spool Updated
      message: >-
        Updated last used (and first used if empty) for spool ID {{ spool.id }}.
  alias: Update Spool Last and First Used in Spoolman
  description: >-
    Taking a Spool object as input (with at least an id property) and optionally a
    first_used property - will update Spoolman with the current time as last used
    and update first used if not already populated.
  icon: fapro:filament-1
