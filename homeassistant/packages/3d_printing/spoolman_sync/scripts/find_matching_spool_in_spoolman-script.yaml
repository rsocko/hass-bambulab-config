# Docs: docs/features/spoolman_sync/find_matching_spools.md
find_matching_spool_in_spoolman:
  sequence:
  - variables:
      spool_found: false
      matching_spool: null
      match_tier: null
  - action: rest_command.spoolman_getspools
    metadata: {}
    data: {}
    response_variable: spools
    alias: Get all Spools from Spoolman API (exclude Archived)
  - alias: Target_uuid is provided (and valid)
    if:
      - alias: target_uuid is provided (and valid)
        condition: template
        value_template: >
          {% if parameters.target_uuid is none or parameters.target_uuid == ''
          or parameters.target_uuid | regex_match('^0+$') %}
            false
          {% else %}
            true
          {% endif %}
    then:
      - variables:
          bambu_only: true
          matched_spools: >-
            {{ spools.content | selectattr('extra.spool_uuid', 'equalto', '"' ~
            parameters.target_uuid ~ '"') | list }}
          count: "{{ matched_spools | length }}"
          matched_spools_in_ams: >-
            {{ matched_spools | selectattr('location', 'equalto', 'AMS') | list
            }}
          count_in_ams: "{{ matched_spools_in_ams | length }}"
          matched_spools_unsealed: >-
            {{ matched_spools | selectattr('extra.sealed', 'equalto', 'false') |
            list }}
          count_unsealed: "{{ matched_spools_unsealed | length }}"
      - choose:
          - conditions:
              - alias: Exactly 1 match found (by UUID)
                condition: template
                value_template: "{{ count == 1 }}"
            sequence:
              - variables:
                  spool_found: true
                  match_tier: uuid
                  response_object:
                    spool: "{{ matched_spools[0] }}"
                    success: true
                    message: Exact match found by UUID
                    match_strategy: uuid
                    all_matches: null
              - stop: Success
                response_variable: response_object
          - conditions:
              - alias: More than one spool have same UUID (error)
                condition: template
                value_template: "{{ count > 1 }}"
            sequence:
              - action: persistent_notification.create
                metadata: {}
                data:
                  message: "Issue: There are {{ count }} spools with the same UUID"
                enabled: false
              - action: system_log.write
                metadata: {}
                data:
                  message: >-
                    Find Matching Spool ERROR: Multiple spools ({{ count }}) have
                    the same UUID {{ parameters.target_uuid }}. This is a data
                    integrity issue that needs to be resolved.
                  level: error
                  logger: homeassistant.components.bambulab.spoolman_sync
              - variables:
                  spool_found: false
                  match_tier: null
                  response_object:
                    spool: null
                    success: false
                    message: Mutiple spools have the same matching UUID
                    match_strategy: null
                    all_matches: "{{ matched_spools }}"
              - stop: Mutiple UUID Matches
                response_variable: response_object
  - variables:
      bambu_only: >-
        {{ bambu_only | default(false) or parameters.target_name | default('', true) | string | trim | regex_match('^Bambu', ignorecase=false) | bool }}
      target_type_normalized: >-
        {% set m = parameters.target_type | default('', true) | string | upper | regex_replace('[\s]*[\+].*$', '') | regex_replace('[\s]+\d.*$', '') | trim %}
        {% if m == 'NYLON' %}
          PA
        {% elif m in ['PLA-S', 'PLA-S (PLA FOR SUPPORT)'] %}
          PLA
        {% else %}
          {{ m }}
        {% endif %}
  - variables:
      spools_lower: |-
        [ {% for spool in spools.content %}
          {"id": "{{ spool.id }}", "color_hex_lower": "{{ (spool.filament.color_hex | default('', true) | string | trim | replace('#', '') | replace('"', '') | lower)[:6] }}", "multi_first_hex_lower": "{{ (((spool.filament.multi_color_hexes | default('', true) | string | trim | replace('"', '') | lower).split(',')) | map('trim') | map('replace', '#', '') | list | first | default('', true))[:6] }}", "multi_hexes_lower": [{% set ns_multi = namespace(vals=[]) %}{% for hex in (spool.filament.multi_color_hexes | default('', true) | string | trim | replace('"', '') | lower).split(',') %}{% set parsed = hex | trim | replace('#', '') %}{% if parsed | length >= 6 %}{% set ns_multi.vals = ns_multi.vals + [parsed[:6]] %}{% endif %}{% endfor %}{% for v in ns_multi.vals %}"{{ v }}"{% if not loop.last %}, {% endif %}{% endfor %}], "profile_name": "{{ spool.filament.extra.profile_name | trim('"') }}", "sealed": "{{ spool.extra.sealed }}", "vendor": "{{ spool.filament.vendor.name }}", "material": "{{ spool.filament.material }}", "material_normalized": "{% set m = spool.filament.material | default('', true) | string | upper | regex_replace('[\s]*[\+].*$', '') | regex_replace('[\s]+\d.*$', '') | trim %}{% if m == 'NYLON' %}PA{% elif m in ['PLA-S', 'PLA-S (PLA FOR SUPPORT)'] %}PLA{% else %}{{ m }}{% endif %}", "location": "{{ spool.location }}"}
          {% if not loop.last %},{% endif %}
        {% endfor %} ]
      enable_multi_any_hex_fallback: true
      query_hex_lower: >-
        {{
          (parameters.target_color_hex | default('', true) | string | trim | replace('#', '') | replace('"', '') | lower)[:6]
        }}
      matched_spools_single: >-
        {{ spools_lower | selectattr('color_hex_lower', 'equalto',
        query_hex_lower | string)
            | selectattr('material_normalized', 'equalto', target_type_normalized)
              | selectattr('profile_name', 'equalto', parameters.target_name)
              | selectattr('vendor', 'equalto', 'Bambu Lab') | list if bambu_only else 
              spools_lower | selectattr('color_hex_lower', 'equalto', query_hex_lower | string)
              | selectattr('vendor', 'ne', 'Bambu Lab') 
            | selectattr('material_normalized', 'equalto', target_type_normalized) | list }}
      matched_spools_multi_first: >-
        {{ spools_lower | selectattr('multi_first_hex_lower', 'equalto',
        query_hex_lower | string)
            | selectattr('material_normalized', 'equalto', target_type_normalized)
              | selectattr('profile_name', 'equalto', parameters.target_name)
              | selectattr('vendor', 'equalto', 'Bambu Lab') | list if bambu_only else
              spools_lower | selectattr('multi_first_hex_lower', 'equalto', query_hex_lower | string)
              | selectattr('vendor', 'ne', 'Bambu Lab')
            | selectattr('material_normalized', 'equalto', target_type_normalized) | list }}
      matched_spools_multi_any: >-
        {% if enable_multi_any_hex_fallback %}
        {{ spools_lower
              | selectattr('multi_hexes_lower', 'contains', query_hex_lower | string)
            | selectattr('material_normalized', 'equalto', target_type_normalized)
              | selectattr('profile_name', 'equalto', parameters.target_name)
              | selectattr('vendor', 'equalto', 'Bambu Lab') | list if bambu_only else
              spools_lower
              | selectattr('multi_hexes_lower', 'contains', query_hex_lower | string)
              | selectattr('vendor', 'ne', 'Bambu Lab')
            | selectattr('material_normalized', 'equalto', target_type_normalized) | list }}
        {% else %}
        {{ [] }}
        {% endif %}
      match_tier: >-
        {% if (matched_spools_single | length) > 0 %}
          color_type
        {% elif (matched_spools_multi_first | length) > 0 %}
          multicolor_first_hex
        {% elif (matched_spools_multi_any | length) > 0 %}
          multicolor_any_hex
        {% else %}
          none
        {% endif %}
      matched_spools: >-
        {% if match_tier == 'color_type' %}
          {{ matched_spools_single }}
        {% elif match_tier == 'multicolor_first_hex' %}
          {{ matched_spools_multi_first }}
        {% elif match_tier == 'multicolor_any_hex' %}
          {{ matched_spools_multi_any }}
        {% else %}
          {{ [] }}
        {% endif %}
      count: "{{ matched_spools | length }}"
      matched_spools_in_ams: "{{ matched_spools | selectattr('location', 'equalto', 'AMS') | list }}"
      count_in_ams: "{{ matched_spools_in_ams | length }}"
      matched_spools_unsealed: "{{ matched_spools | selectattr('sealed', 'equalto', 'false') | list }}"
      count_unsealed: "{{ matched_spools_unsealed | length }}"
    alias: Match on other attributes (Color & Type)
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ count == 1 }}"
            alias: Exactly 1 Matching Spool Found
        sequence:
          - variables:
              matchedID: "{{ matched_spools[0].id | int }}"
              matching_spool: >-
                {{ spools.content | selectattr('id', 'equalto', matchedID) |
                list | first }}
            alias: Update matching_spool variable with matched spool
          - variables:
              spool_found: true
              response_object:
                spool: "{{ matching_spool }}"
                success: true
                message: "Exact match found by {{ match_tier }}"
                match_strategy: "{{ match_tier }}"
                all_matches: null
          - stop: Success
            response_variable: response_object
      - conditions:
          - condition: template
            value_template: "{{ count == 0 }}"
            alias: No Matching Spools Found
        sequence:
          - action: persistent_notification.create
            metadata: {}
            data:
              message: No Matching Spool Found
            enabled: false
            alias: "Notify: No Match Found"
          - action: system_log.write
            metadata: {}
            data:
              message: >-
                Find Matching Spool: No spools found. Target Type: {{
                parameters.target_type }}, Color: {{ parameters.target_color_hex
                }}, Name: {{ parameters.target_name }}
              level: warning
              logger: homeassistant.components.bambulab.spoolman_sync
          - variables:
              spool_found: false
              response_object:
                spool: null
                success: false
                message: No spools found by color/type or multi-color tiers
                match_strategy: null
                all_matches: null
          - stop: No spools found by Color & Type
            response_variable: response_object
      - conditions:
          - condition: template
            value_template: "{{ count > 1 and count_in_ams == 1 }}"
            alias: Multiple matches, but only 1 match is in the AMS
        sequence:
          - variables:
              matchedID: "{{ matched_spools_in_ams[0].id | int }}"
              matching_spool: >-
                {{ spools.content | selectattr('id', 'equalto', matchedID) |
                list | first }}
            alias: Update matching_spool from matched spool in AMS
          - variables:
              effective_match_tier: >-
                {% if match_tier == 'none' %}color_type{% else %}{{ match_tier }}_ams_preference{% endif %}
              spool_found: true
              response_object:
                spool: "{{ matching_spool }}"
                success: true
                message: >-
                  Found multiple matching spools by {{ match_tier }}, but only 1 is in the AMS
                match_strategy: "{{ effective_match_tier }}"
                all_matches: matched_spools
          - stop: Success
            response_variable: response_object
      - conditions:
          - condition: template
            value_template: "{{ count > 1 and count_in_ams > 1 }}"
            alias: Multiple matches and more than 1 match in the AMS
        sequence:
          - action: persistent_notification.create
            metadata: {}
            data:
              message: Multiple matches found in the AMS - please fix.
            enabled: false
            alias: "Notify: Multiple matches found in AMS - cannot choose"
          - action: system_log.write
            metadata: {}
            data:
              message: >-
                Find Matching Spool ERROR: Multiple spools ({{ count_in_ams }})
                found in the AMS with matching criteria. Type: {{
                parameters.target_type }}, Color: {{ parameters.target_color_hex
                }}, Name: {{ parameters.target_name }}. Cannot determine which
                spool to use.
              level: error
              logger: homeassistant.components.bambulab.spoolman_sync
          - variables:
              in_ams_ids: "{{ matched_spools | map(attribute='id') | list }}"
              multiple_matches: "{{ spools.content | selectattr('id', 'in', in_ams_ids) | list }}"
            alias: Update matching_spools from matched spools in AMS
          - variables:
              spool_found: false
              response_object:
                spool: null
                success: false
                message: >-
                  Multiple spools found by {{ match_tier }}, but more than 1 is in
                  the AMS
                match_strategy: null
                all_matches: multiple_matches
          - stop: Multiple Matches with Multiple in AMS
            response_variable: response_object
      - conditions:
          - alias: >-
              Multiple matches, none in the AMS, but only 1 spool is unsealed
              (eg could be used)
            condition: template
            value_template: "{{ count > 1 and count_in_ams == 0 and count_unsealed == 1 }}"
        sequence:
          - action: persistent_notification.create
            metadata: {}
            data:
              message: Spool in use but not in AMS - move to AMS?
            alias: "Notify: Spool in use but not in AMS - update?"
            enabled: false
          - variables:
              matchedID: "{{ matched_spools_unsealed[0].id | int }}"
              matching_spool: >-
                {{ spools.content | selectattr('id', 'equalto', matchedID) |
                list | first }}
            alias: Update matched spool from unsealed spool
          - variables:
              effective_match_tier: >-
                {% if match_tier == 'none' %}color_type{% else %}{{ match_tier }}_ams_preference{% endif %}
              spool_found: true
              response_object:
                spool: "{{ matching_spool }}"
                success: true
                message: >-
                  More than 1 spool found by {{ match_tier }}, none are in the AMS,
                  but only 1 is unsealed/open
                match_strategy: "{{ effective_match_tier }}"
                all_matches: matched_spools
          - stop: Success
            response_variable: response_object
      - conditions:
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ count > 0 and count_in_ams == 0 and count_unsealed > 1 }}"
                alias: >-
                  Multiple matches, none in the AMS and more than 1 are open
                  (unsealed)
              - condition: template
                value_template: "{{ count > 0 and count_in_ams == 0 and count_unsealed == 0 }}"
                alias: Multiple matches, none in the AMS and none open/unsealed
        sequence:
          - action: persistent_notification.create
            metadata: {}
            data:
              message: >-
                More than one match, and mutple opened or none opened - need
                help
            enabled: false
          - action: system_log.write
            metadata: {}
            data:
              message: >-
                Find Matching Spool ERROR: Multiple spools ({{ count }}) found
                with matching criteria, none in AMS. Either multiple are
                open/unsealed ({{ count_unsealed }}) or none are open. Type: {{
                parameters.target_type }}, Color: {{ parameters.target_color_hex
                }}, Name: {{ parameters.target_name }}. Cannot determine which
                spool to use.
              level: error
              logger: homeassistant.components.bambulab.spoolman_sync
          - variables:
              spool_found: false
              response_object:
                spool: null
                success: false
                message: >-
                  Multiple spools found by {{ match_tier }}, none in AMS and more
                  than 1 open OR none open
                match_strategy: null
                all_matches: matched_spools
          - stop: Multiple Matches but cannot determine single match
            response_variable: response_object
          - variables:
              in_ams_ids: "{{ matched_spools | map(attribute='id') | list }}"
              multiple_matches: "{{ spools.content | selectattr('id', 'in', in_ams_ids) | list }}"
            alias: Update matching_spools from unsealed spools
        alias: >-
          More than 1 match unsealed or more than 1 match and none are
          opened/unsealed
  alias: Find Matching Spool in Spoolman
  description: Find a spool in Spoolman based on UUID or Color (hex code) and Type (eg PLA).
  icon: fapro:filament-1
