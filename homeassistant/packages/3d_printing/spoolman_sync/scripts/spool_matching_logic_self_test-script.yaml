# Docs: docs/features/spoolman_sync/spool-matching-validation-self-test.md
spool_matching_logic_self_test:
  alias: Spool Matching Logic Self-Test
  description: >-
    Smoke-test for spool matching readiness. Validates that tray_map contains
    entries for expected trays and reports a pass/warn summary.
  icon: mdi:test-tube
  mode: single
  sequence:
  - variables:
      tray_map: "{{ state_attr('sensor.spoolman_tray_map', 'tray_map') | default({}, true) }}"
      expected_tray_keys:
      - ams_1_tray_1
      - ams_1_tray_2
      - ams_1_tray_3
      - ams_1_tray_4
      - ams_2_tray_1
      - ams_2_tray_2
      - ams_2_tray_3
      - ams_2_tray_4
      - external_spool

  - variables:
      missing_keys: >-
        {% set ns = namespace(missing=[]) %}
        {% for key in expected_tray_keys %}
          {% if tray_map.get(key) is not mapping %}
            {% set ns.missing = ns.missing + [key] %}
          {% endif %}
        {% endfor %}
        {{ ns.missing }}
      available_count: "{{ expected_tray_keys | count - (missing_keys | count) }}"
      overall_status: "{{ 'PASS' if (missing_keys | count) == 0 else 'WARN' }}"
      details: >-
        {% if (missing_keys | count) == 0 %}
          All expected tray_map keys are present.
        {% else %}
          Missing tray_map keys: {{ missing_keys | join(', ') }}
        {% endif %}
      parity_tray_1_key: ams_1_tray_1
      parity_tray_1_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_1
      parity_tray_2_key: external_spool
      parity_tray_2_entity_id: sensor.ntk_ryansoffice_3dprinter_external_spool

  - variables:
      parity_tray_1_map_entry: "{{ tray_map.get(parity_tray_1_key, {}) }}"
      parity_tray_1_uuid: "{{ state_attr(parity_tray_1_entity_id, 'tray_uuid') | default('', true) | string }}"
      parity_tray_1_color: "{{ state_attr(parity_tray_1_entity_id, 'color') | default('', true) | string | replace('#', '') }}"
      parity_tray_1_type: "{{ state_attr(parity_tray_1_entity_id, 'type') | default('', true) | string }}"
      parity_tray_1_name: "{{ state_attr(parity_tray_1_entity_id, 'name') | default('', true) | string }}"
      parity_tray_1_has_matchable_data: >-
        {% set uuid_norm = parity_tray_1_uuid | lower %}
        {{ (parity_tray_1_uuid | length > 0 and not uuid_norm | regex_match('^0+$'))
           or (parity_tray_1_color | length > 0 and parity_tray_1_type | length > 0 and parity_tray_1_name | length > 0) }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ parity_tray_1_has_matchable_data }}"
        sequence:
          - action: script.find_matching_spool_in_spoolman
            metadata: {}
            data:
              parameters:
                target_color_hex: "{{ parity_tray_1_color }}"
                target_type: "{{ parity_tray_1_type }}"
                target_uuid: "{{ parity_tray_1_uuid }}"
                target_name: "{{ parity_tray_1_name }}"
            response_variable: legacy_response_1
    default:
      - variables:
          legacy_response_1:
            success: false
            message: "Phase 3 parity check skipped for ams_1_tray_1 (insufficient tray metadata)."
            spool:
              id: null

  - variables:
      parity_tray_1_template_success: "{{ parity_tray_1_map_entry.spool_id is not none and parity_tray_1_map_entry.spool_id | string | length > 0 }}"
      parity_tray_1_template_spool_id: "{{ parity_tray_1_map_entry.spool_id if parity_tray_1_template_success else none }}"
      parity_tray_1_legacy_success: "{{ legacy_response_1.success | default(false) }}"
      parity_tray_1_legacy_spool_id: "{{ legacy_response_1.spool.id if parity_tray_1_legacy_success else none }}"
      parity_tray_1_match: >-
        {{ (parity_tray_1_template_success == parity_tray_1_legacy_success)
           and ((parity_tray_1_template_spool_id | string) == (parity_tray_1_legacy_spool_id | string)) }}
      parity_tray_1_summary: >-
        {% if not parity_tray_1_has_matchable_data %}
          SKIP ams_1_tray_1 parity (insufficient tray metadata).
        {% elif parity_tray_1_match %}
          PASS ams_1_tray_1 parity: template_success={{ parity_tray_1_template_success }}, template_spool={{ parity_tray_1_template_spool_id | string }}, legacy_success={{ parity_tray_1_legacy_success }}, legacy_spool={{ parity_tray_1_legacy_spool_id | string }}.
        {% else %}
          FAIL ams_1_tray_1 parity: template_success={{ parity_tray_1_template_success }}, template_spool={{ parity_tray_1_template_spool_id | string }}, legacy_success={{ parity_tray_1_legacy_success }}, legacy_spool={{ parity_tray_1_legacy_spool_id | string }}.
        {% endif %}

  - variables:
      parity_tray_2_map_entry: "{{ tray_map.get(parity_tray_2_key, {}) }}"
      parity_tray_2_uuid: "{{ state_attr(parity_tray_2_entity_id, 'tray_uuid') | default('', true) | string }}"
      parity_tray_2_color: "{{ state_attr(parity_tray_2_entity_id, 'color') | default('', true) | string | replace('#', '') }}"
      parity_tray_2_type: "{{ state_attr(parity_tray_2_entity_id, 'type') | default('', true) | string }}"
      parity_tray_2_name: "{{ state_attr(parity_tray_2_entity_id, 'name') | default('', true) | string }}"
      parity_tray_2_has_matchable_data: >-
        {% set uuid_norm = parity_tray_2_uuid | lower %}
        {{ (parity_tray_2_uuid | length > 0 and not uuid_norm | regex_match('^0+$'))
           or (parity_tray_2_color | length > 0 and parity_tray_2_type | length > 0 and parity_tray_2_name | length > 0) }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ parity_tray_2_has_matchable_data }}"
        sequence:
          - action: script.find_matching_spool_in_spoolman
            metadata: {}
            data:
              parameters:
                target_color_hex: "{{ parity_tray_2_color }}"
                target_type: "{{ parity_tray_2_type }}"
                target_uuid: "{{ parity_tray_2_uuid }}"
                target_name: "{{ parity_tray_2_name }}"
            response_variable: legacy_response_2
    default:
      - variables:
          legacy_response_2:
            success: false
            message: "Phase 3 parity check skipped for external_spool (insufficient tray metadata)."
            spool:
              id: null

  - variables:
      parity_tray_2_template_success: "{{ parity_tray_2_map_entry.spool_id is not none and parity_tray_2_map_entry.spool_id | string | length > 0 }}"
      parity_tray_2_template_spool_id: "{{ parity_tray_2_map_entry.spool_id if parity_tray_2_template_success else none }}"
      parity_tray_2_legacy_success: "{{ legacy_response_2.success | default(false) }}"
      parity_tray_2_legacy_spool_id: "{{ legacy_response_2.spool.id if parity_tray_2_legacy_success else none }}"
      parity_tray_2_match: >-
        {{ (parity_tray_2_template_success == parity_tray_2_legacy_success)
           and ((parity_tray_2_template_spool_id | string) == (parity_tray_2_legacy_spool_id | string)) }}
      parity_tray_2_summary: >-
        {% if not parity_tray_2_has_matchable_data %}
          SKIP external_spool parity (insufficient tray metadata).
        {% elif parity_tray_2_match %}
          PASS external_spool parity: template_success={{ parity_tray_2_template_success }}, template_spool={{ parity_tray_2_template_spool_id | string }}, legacy_success={{ parity_tray_2_legacy_success }}, legacy_spool={{ parity_tray_2_legacy_spool_id | string }}.
        {% else %}
          FAIL external_spool parity: template_success={{ parity_tray_2_template_success }}, template_spool={{ parity_tray_2_template_spool_id | string }}, legacy_success={{ parity_tray_2_legacy_success }}, legacy_spool={{ parity_tray_2_legacy_spool_id | string }}.
        {% endif %}

  - variables:
      any_parity_failure: >-
        {{ (parity_tray_1_has_matchable_data and not parity_tray_1_match)
           or (parity_tray_2_has_matchable_data and not parity_tray_2_match) }}
      overall_status: >-
        {% if any_parity_failure %}
          FAIL
        {% elif (missing_keys | count) == 0 %}
          PASS
        {% else %}
          WARN
        {% endif %}
      details: "{{ details ~ ' ' ~ parity_tray_1_summary ~ ' ' ~ parity_tray_2_summary }}"

  - action: system_log.write
    metadata: {}
    data:
      message: >-
        Spool Matching Parity Debug: tray1_key={{ parity_tray_1_key }}, tray1_has_data={{ parity_tray_1_has_matchable_data }}, tray1_match={{ parity_tray_1_match }}, tray1_template_success={{ parity_tray_1_template_success }}, tray1_template_spool={{ parity_tray_1_template_spool_id | string }}, tray1_legacy_success={{ parity_tray_1_legacy_success }}, tray1_legacy_spool={{ parity_tray_1_legacy_spool_id | string }}; tray2_key={{ parity_tray_2_key }}, tray2_has_data={{ parity_tray_2_has_matchable_data }}, tray2_match={{ parity_tray_2_match }}, tray2_template_success={{ parity_tray_2_template_success }}, tray2_template_spool={{ parity_tray_2_template_spool_id | string }}, tray2_legacy_success={{ parity_tray_2_legacy_success }}, tray2_legacy_spool={{ parity_tray_2_legacy_spool_id | string }}
      level: info
      logger: homeassistant.components.bambulab.spoolman_sync

  - action: system_log.write
    metadata: {}
    data:
      message: >-
        Spool Matching Self-Test {{ overall_status }}: available_keys={{ available_count }}/{{ expected_tray_keys | count }}. {{ details }}
      level: "{{ 'info' if overall_status == 'PASS' else 'warning' }}"
      logger: homeassistant.components.bambulab.spoolman_sync

  - action: persistent_notification.create
    data:
      notification_id: spool_matching_logic_self_test
      title: "Spool Matching Logic Self-Test: {{ overall_status }}"
      message: >-
        Status: {{ overall_status }}

        Expected keys: {{ expected_tray_keys | count }}
        Available keys: {{ available_count }}

        {{ details }}

  - variables:
      response_object:
        success: "{{ overall_status == 'PASS' }}"
        status: "{{ overall_status }}"
        available_count: "{{ available_count }}"
        expected_count: "{{ expected_tray_keys | count }}"
        missing_keys: "{{ missing_keys }}"
        parity_tray_1_key: "{{ parity_tray_1_key }}"
        parity_tray_1_match: "{{ parity_tray_1_match }}"
        parity_tray_1_template_success: "{{ parity_tray_1_template_success }}"
        parity_tray_1_template_spool_id: "{{ parity_tray_1_template_spool_id }}"
        parity_tray_1_legacy_success: "{{ parity_tray_1_legacy_success }}"
        parity_tray_1_legacy_spool_id: "{{ parity_tray_1_legacy_spool_id }}"
        parity_tray_2_key: "{{ parity_tray_2_key }}"
        parity_tray_2_match: "{{ parity_tray_2_match }}"
        parity_tray_2_template_success: "{{ parity_tray_2_template_success }}"
        parity_tray_2_template_spool_id: "{{ parity_tray_2_template_spool_id }}"
        parity_tray_2_legacy_success: "{{ parity_tray_2_legacy_success }}"
        parity_tray_2_legacy_spool_id: "{{ parity_tray_2_legacy_spool_id }}"
        report: "{{ details }}"

  - stop: Spool matching self-test complete
    response_variable: response_object
