# tray_assignment_status_and_picker.yaml
# Reusable include: tray assignment status chip with popup tray picker.
# Included in view_main, view_filament_tags, and view_filament_catalog
# so the pending-assignment prompt is available on every dashboard tab.
#
# Driven by:
#   - sensor.last_tray_assignment_result  (chip visibility + status)
#   - input_text.pending_tray_assignment_spool_id  (tray picker in popup)
#
# The chip is zero-footprint when inactive. When a tray selection is
# pending, tapping the chip opens a browser_mod popup with the tray picker.
type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: sensor.last_tray_assignment_result
        state_not: idle
      - entity: sensor.last_tray_assignment_result
        state_not: unknown
      - entity: sensor.last_tray_assignment_result
        state_not: unavailable
    card:
      type: custom:config-template-card
      entities:
        - sensor.last_tray_assignment_result
        - input_text.pending_tray_assignment_spool_id
      variables:
        result_state: "states['sensor.last_tray_assignment_result']?.state || 'idle'"
        result_msg: "(states['sensor.last_tray_assignment_result']?.attributes?.message || '').substring(0, 100)"
        has_pending_spool: "!['', 'unknown', 'unavailable'].includes(states['input_text.pending_tray_assignment_spool_id']?.state || '')"
        pending_id: "states['input_text.pending_tray_assignment_spool_id']?.state || ''"
      card:
        type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            entity: sensor.last_tray_assignment_result
            icon: >-
              ${ result_state === 'success' ? 'mdi:check-circle' :
                 result_state === 'needs_tray_selection' ? 'mdi:alert-circle' :
                 result_state === 'failed' || result_state === 'overwrite_required' ? 'mdi:close-circle' :
                 result_state === 'skipped' ? 'mdi:skip-next-circle' :
                 result_state === 'deferred' ? 'mdi:clock-outline' : 'mdi:information' }
            icon_color: >-
              ${ result_state === 'success' ? 'green' :
                 result_state === 'needs_tray_selection' ? 'orange' :
                 result_state === 'failed' || result_state === 'overwrite_required' ? 'red' :
                 result_state === 'skipped' ? 'blue' :
                 result_state === 'deferred' ? 'amber' : 'grey' }
            content: >-
              ${ result_state === 'success' ? '✓ ' + result_msg :
                 result_state === 'needs_tray_selection' && has_pending_spool ? '⚠ Tap to select tray' :
                 result_state === 'needs_tray_selection' ? '⚠ Tray selection needed — re-scan spool to retry' :
                 result_state === 'failed' ? '✗ ' + result_msg :
                 result_state === 'overwrite_required' ? '⚠ Overwrite needed — use Set on Printer' :
                 result_state === 'skipped' ? 'ℹ ' + result_msg :
                 result_state === 'deferred' ? '⏳ ' + result_msg : result_msg }
            tap_action:
              action: >-
                ${ result_state === 'needs_tray_selection' && has_pending_spool ? 'fire-dom-event' : 'none' }
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Select Tray
                  size: normal
                  content:
                    type: vertical-stack
                    cards:
                      - type: custom:mushroom-template-card
                        primary: "Spool #${ pending_id } — which tray was it loaded into?"
                        icon: mdi:printer-3d-nozzle-alert
                        icon_color: orange
                        layout: horizontal
                        fill_container: true
                      - type: custom:bubble-card
                        card_type: sub-buttons
                        hide_main_background: false
                        name: AMS 1
                        rows: 0.938
                        sub_button:
                          main: []
                          bottom:
                            - tap_action:
                                action: fire-dom-event
                                browser_mod:
                                  service: browser_mod.sequence
                                  data:
                                    sequence:
                                      - service: script.assign_spool_to_printer_tray
                                        data:
                                          spool_id: "${ pending_id }"
                                          tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_1
                                      - service: browser_mod.delay
                                        data:
                                          time: 2000
                                      - service: browser_mod.close_popup
                              name: T1
                              show_name: true
                              icon: mdi:numeric-1-box
                              state_background: false
                            - tap_action:
