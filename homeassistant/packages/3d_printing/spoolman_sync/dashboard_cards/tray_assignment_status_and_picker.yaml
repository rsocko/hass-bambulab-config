# tray_assignment_status_and_picker.yaml
# Reusable include: tray assignment status chip with popup tray picker.
# Included in view_main, view_filament_tags, and view_filament_catalog
# so the pending-assignment prompt is available on every dashboard tab.
#
# Driven by:
#   - sensor.last_tray_assignment_result  (chip visibility + status)
#   - input_text.pending_tray_assignment_spool_id  (tray picker in popup)
#
# The chip is zero-footprint when inactive. When a tray selection is
# pending, tapping the chip opens a browser_mod popup with the tray picker.
type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: sensor.last_tray_assignment_result
        state_not: idle
      - entity: sensor.last_tray_assignment_result
        state_not: unknown
      - entity: sensor.last_tray_assignment_result
        state_not: unavailable
    card:
      type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: template
          entity: sensor.last_tray_assignment_result
          icon: >-
            {% set s = states('sensor.last_tray_assignment_result') %}
            {% if s == 'success' %}mdi:check-circle
            {% elif s == 'needs_tray_selection' %}mdi:alert-circle
            {% elif s in ['failed', 'overwrite_required'] %}mdi:close-circle
            {% elif s == 'skipped' %}mdi:skip-next-circle
            {% elif s == 'deferred' %}mdi:clock-outline
            {% else %}mdi:information{% endif %}
          icon_color: >-
            {% set s = states('sensor.last_tray_assignment_result') %}
            {% if s == 'success' %}green
            {% elif s == 'needs_tray_selection' %}orange
            {% elif s in ['failed', 'overwrite_required'] %}red
            {% elif s == 'skipped' %}blue
            {% elif s == 'deferred' %}amber
            {% else %}grey{% endif %}
          content: >-
            {% set s = states('sensor.last_tray_assignment_result') %}
            {% set msg = state_attr('sensor.last_tray_assignment_result', 'message') | default('', true) %}
            {% set pending = states('input_text.pending_tray_assignment_spool_id') %}
            {% set has_pending = pending not in ['', 'unknown', 'unavailable'] %}
            {% if s == 'success' %}✓ {{ msg[:100] }}
            {% elif s == 'needs_tray_selection' and has_pending %}⚠ Tap to select tray
            {% elif s == 'needs_tray_selection' %}⚠ Tray selection needed — re-scan spool to retry
            {% elif s == 'failed' %}✗ {{ msg[:100] }}
            {% elif s == 'overwrite_required' %}⚠ Overwrite needed — use Set on Printer
            {% elif s == 'skipped' %}ℹ {{ msg[:100] }}
            {% elif s == 'deferred' %}⏳ {{ msg[:100] }}
            {% else %}{{ msg[:100] }}{% endif %}
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: browser_mod.popup
              data:
                title: Select Tray
                size: normal
                content:
                  type: vertical-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: >-
                        {% set pending = states('input_text.pending_tray_assignment_spool_id') %}
                        {% if pending not in ['', 'unknown', 'unavailable'] %}
                        Spool #{{ pending }} — which tray was it loaded into?
                        {% else %}
                        No pending tray assignment
                        {% endif %}
                      icon: mdi:printer-3d-nozzle-alert
                      icon_color: orange
                      layout: horizontal
                      fill_container: true
                    - type: custom:mushroom-chips-card
                      alignment: center
                      chips:
                        - type: template
                          content: AMS 1
                          tap_action:
                            action: none
                    - type: grid
                      columns: 4
                      square: false
                      cards:
                        - type: custom:mushroom-template-card
                          primary: T1
                          icon: mdi:numeric-1-box
                          icon_color: blue
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_spool_to_printer_tray
                            data:
                              spool_id: >-
                                {{ states('input_text.pending_tray_assignment_spool_id') }}
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_1
                        - type: custom:mushroom-template-card
                          primary: T2
                          icon: mdi:numeric-2-box
                          icon_color: blue
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_spool_to_printer_tray
                            data:
                              spool_id: >-
                                {{ states('input_text.pending_tray_assignment_spool_id') }}
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_2
                        - type: custom:mushroom-template-card
                          primary: T3
                          icon: mdi:numeric-3-box
                          icon_color: blue
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_spool_to_printer_tray
                            data:
                              spool_id: >-
                                {{ states('input_text.pending_tray_assignment_spool_id') }}
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_3
                        - type: custom:mushroom-template-card
                          primary: T4
                          icon: mdi:numeric-4-box
                          icon_color: blue
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_spool_to_printer_tray
                            data:
                              spool_id: >-
                                {{ states('input_text.pending_tray_assignment_spool_id') }}
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_4
                    - type: custom:mushroom-chips-card
                      alignment: center
                      chips:
                        - type: template
                          content: AMS 2
                          tap_action:
                            action: none
                    - type: grid
                      columns: 4
                      square: false
                      cards:
                        - type: custom:mushroom-template-card
                          primary: T1
                          icon: mdi:numeric-1-box
                          icon_color: teal
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_spool_to_printer_tray
                            data:
                              spool_id: >-
                                {{ states('input_text.pending_tray_assignment_spool_id') }}
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_2_tray_1
                        - type: custom:mushroom-template-card
                          primary: T2
                          icon: mdi:numeric-2-box
                          icon_color: teal
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_spool_to_printer_tray
                            data:
                              spool_id: >-
                                {{ states('input_text.pending_tray_assignment_spool_id') }}
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_2_tray_2
                        - type: custom:mushroom-template-card
                          primary: T3
                          icon: mdi:numeric-3-box
                          icon_color: teal
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_spool_to_printer_tray
                            data:
                              spool_id: >-
                                {{ states('input_text.pending_tray_assignment_spool_id') }}
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_2_tray_3
                        - type: custom:mushroom-template-card
                          primary: T4
                          icon: mdi:numeric-4-box
                          icon_color: teal
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_spool_to_printer_tray
                            data:
                              spool_id: >-
                                {{ states('input_text.pending_tray_assignment_spool_id') }}
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_2_tray_4
