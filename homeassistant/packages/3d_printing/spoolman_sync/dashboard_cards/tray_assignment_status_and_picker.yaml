# tray_assignment_status_and_picker.yaml
# Reusable include: tray assignment status chip with popup tray picker.
# Included in view_main, view_filament_tags, and view_filament_catalog
# so the pending-assignment prompt is available on every dashboard tab.
#
# Driven by:
#   - sensor.last_tray_assignment_result  (chip visibility + status)
#   - input_text.pending_tray_assignment_spool_id  (tray picker in popup)
#
# The chip is zero-footprint when inactive. When a tray selection is
# pending, tapping the chip opens a browser_mod popup with the tray picker.
type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: sensor.last_tray_assignment_result
        state_not: idle
      - entity: sensor.last_tray_assignment_result
        state_not: unknown
      - entity: sensor.last_tray_assignment_result
        state_not: unavailable
    card:
      type: custom:mushroom-chips-card
      alignment: center
      card_mod:
        style: >
          {% set s = states('sensor.last_tray_assignment_result') %}
          {% if s in ['needs_tray_selection', 'overwrite_required', 'success_awaiting_rfid'] %}
          @keyframes tray-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.04); }
          }
          ha-card { animation: tray-pulse 2s ease-in-out infinite; }
          {% elif s == 'failed' %}
          @keyframes tray-error-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
          }
          ha-card { animation: tray-error-pulse 2.5s ease-in-out infinite; }
          {% endif %}
      chips:
        - type: template
          entity: sensor.last_tray_assignment_result
          icon: >-
            {% set s = states('sensor.last_tray_assignment_result') %}
            {% if s == 'success' %}mdi:check-circle
            {% elif s == 'success_awaiting_rfid' %}mdi:contactless-payment-circle-outline
            {% elif s == 'needs_tray_selection' %}mdi:alert-circle
            {% elif s in ['failed', 'overwrite_required'] %}mdi:close-circle
            {% elif s == 'skipped' %}mdi:skip-next-circle
            {% elif s == 'deferred' %}mdi:clock-outline
            {% else %}mdi:information{% endif %}
          icon_color: >-
            {% set s = states('sensor.last_tray_assignment_result') %}
            {% if s == 'success' %}green
            {% elif s == 'success_awaiting_rfid' %}amber
            {% elif s == 'needs_tray_selection' %}orange
            {% elif s in ['failed', 'overwrite_required'] %}red
            {% elif s == 'skipped' %}blue
            {% elif s == 'deferred' %}amber
            {% else %}grey{% endif %}
          content: >-
            {% set s = states('sensor.last_tray_assignment_result') %}
            {% set msg = state_attr('sensor.last_tray_assignment_result', 'message') | default('', true) %}
            {% set pending = states('input_text.pending_tray_assignment_spool_id') %}
            {% set has_pending = pending not in ['', 'unknown', 'unavailable'] %}
            {% if s == 'success' %}{{ msg[:100] }}
            {% elif s == 'success_awaiting_rfid' %}⚠ Tray set but AMS RFID not confirmed — tap to refresh
            {% elif s == 'needs_tray_selection' and has_pending %}Tap to select tray
            {% elif s == 'needs_tray_selection' %}Tray selection needed — re-scan spool to retry
            {% elif s == 'failed' %}{{ msg[:100] }}
            {% elif s == 'overwrite_required' %}⚠ Overwrite needed — use Update Tray Settings
            {% elif s == 'skipped' %}{{ msg[:100] }}
            {% elif s == 'deferred' %}{{ msg[:100] }}
            {% else %}{{ msg[:100] }}{% endif %}
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: browser_mod.popup
              data:
                title: Select Tray
                size: normal
                content:
                  type: vertical-stack
                  cards:
                    - type: conditional
                      conditions:
                        - entity: sensor.last_tray_assignment_result
                          state: success_awaiting_rfid
                      card:
                        type: custom:mushroom-template-card
                        primary: AMS RFID Not Yet Confirmed
                        secondary: >-
                          Tray metadata was written but the AMS hasn't read the spool's RFID tag.
                          Tap to request a data refresh from the printer.
                        icon: mdi:contactless-payment-circle-outline
                        icon_color: amber
                        layout: horizontal
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.ntk_ryansoffice_3dprinter_force_refresh_data
                        card_mod:
                          style: |
                            ha-card {
                              border: 1px solid var(--warning-color, #ffc107);
                              background: rgba(255, 193, 7, 0.08);
                            }
                    - type: custom:mushroom-template-card
                      entity: >-
                        {% set pending = states('input_text.pending_tray_assignment_spool_id') %}
                        {% if pending not in ['', 'unknown', 'unavailable'] %}
                        sensor.spoolman_spool_{{ pending }}
                        {% else %}sensor.last_tray_assignment_result{% endif %}
                      primary: >-
                        {% set pending = states('input_text.pending_tray_assignment_spool_id') %}
                        {% if pending not in ['', 'unknown', 'unavailable'] %}
                        {% set spool_eid = 'sensor.spoolman_spool_' ~ pending %}
                        {% set fname = state_attr(spool_eid, 'friendly_name') | default('', true) %}
                        {{ fname if fname | length > 0 else 'Spool #' ~ pending }}
                        {% else %}
                        No pending tray assignment
                        {% endif %}
                      secondary: >-
                        {% set pending = states('input_text.pending_tray_assignment_spool_id') %}
                        {% if pending not in ['', 'unknown', 'unavailable'] %}
                        Which tray was it loaded into?
                        {% endif %}
                      picture: >-
                        {% set pending = states('input_text.pending_tray_assignment_spool_id') %}
                        {% if pending not in ['', 'unknown', 'unavailable'] %}
                        {{ state_attr('sensor.spoolman_spool_' ~ pending, 'entity_picture') | default('', true) }}
                        {% endif %}
                      layout: horizontal
                      fill_container: true
                    - type: custom:mushroom-template-card
                      primary: AMS 1
                      icon: fapro:filament-2
                      icon_color: blue
                      tap_action:
                        action: none
                      card_mod:
                        style: |
                          ha-card {
                            background: none !important;
                            box-shadow: none !important;
                            --card-primary-font-size: 18px;
                          }
                          .container .primary {
                            font-size: 18px !important;
                            font-weight: 600 !important;
                            letter-spacing: 0.5px;
                          }
                    - type: grid
                      columns: 4
                      square: false
                      cards:
                        - type: custom:mushroom-template-card
                          primary: A1
                          icon: mdi:numeric-1-box
                          icon_color: blue
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_pending_spool_to_tray
                            data:
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_1
                        - type: custom:mushroom-template-card
                          primary: A2
                          icon: mdi:numeric-2-box
                          icon_color: blue
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_pending_spool_to_tray
                            data:
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_2
                        - type: custom:mushroom-template-card
                          primary: A3
                          icon: mdi:numeric-3-box
                          icon_color: blue
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_pending_spool_to_tray
                            data:
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_3
                        - type: custom:mushroom-template-card
                          primary: A4
                          icon: mdi:numeric-4-box
                          icon_color: blue
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_pending_spool_to_tray
                            data:
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_1_tray_4
                    - type: custom:mushroom-template-card
                      primary: AMS 2
                      icon: fapro:filament-2
                      icon_color: teal
                      tap_action:
                        action: none
                      card_mod:
                        style: |
                          ha-card {
                            background: none !important;
                            box-shadow: none !important;
                            --card-primary-font-size: 18px;
                          }
                          .container .primary {
                            font-size: 18px !important;
                            font-weight: 600 !important;
                            letter-spacing: 0.5px;
                          }
                    - type: grid
                      columns: 4
                      square: false
                      cards:
                        - type: custom:mushroom-template-card
                          primary: B1
                          icon: mdi:numeric-1-box
                          icon_color: teal
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_pending_spool_to_tray
                            data:
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_2_tray_1
                        - type: custom:mushroom-template-card
                          primary: B2
                          icon: mdi:numeric-2-box
                          icon_color: teal
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_pending_spool_to_tray
                            data:
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_2_tray_2
                        - type: custom:mushroom-template-card
                          primary: B3
                          icon: mdi:numeric-3-box
                          icon_color: teal
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_pending_spool_to_tray
                            data:
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_2_tray_3
                        - type: custom:mushroom-template-card
                          primary: B4
                          icon: mdi:numeric-4-box
                          icon_color: teal
                          layout: vertical
                          tap_action:
                            action: perform-action
                            perform_action: script.assign_pending_spool_to_tray
                            data:
                              tray_entity_id: sensor.p1s_01p00c460102350_ams_2_tray_4
