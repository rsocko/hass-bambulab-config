# Printer control row: Speed | Skip Objects | Pause/Start | Stop | Movement | Power toggle
# Replaces the ha-bambulab-print_control-card with individual compact buttons.
# Uses a dedicated helper (input_boolean.show_power_controls) and includes power-controls.yaml.
type: vertical-stack
cards:
  - type: horizontal-stack
    card_mod:
      style: |
        #root {
          align-items: stretch;
        }
    cards:
      - !include speed-control-button.yaml
      - !include skip-objects-launcher.yaml
      - !include pause-start-button.yaml
      - !include stop-print-button.yaml
      - !include printer-movement-controls-with-toggle.yaml
      - type: custom:button-card
        entity: input_boolean.show_power_controls
        show_name: false
        show_state: false
        show_label: false
        show_icon: true
        icon: mdi:power
        tap_action:
          action: toggle
        styles:
          card:
            - min-width: 46px
            - width: 46px
            - height: 100%
            - padding: 8px 4px
            - border-radius: 16px
            - justify-self: end
          icon:
            - color: |
                [[[ 
                  const entities = [
                    'switch.tp_link_power_strip_ab64_ams_heater',
                    'switch.tp_link_power_strip_ab64_3d_printer_camera',
                    'switch.tp_link_power_strip_ab64_3d_printer'
                  ];
                  const statesList = entities.map(id => states[id]?.state || 'unavailable');
                  const onCount = statesList.filter(s => s === 'on').length;
                  const availableCount = statesList.filter(s => !['unavailable', 'unknown'].includes(s)).length;
                  if (onCount > 0) return '#F44336';
                  if (availableCount === 0) return '#9E9E9E';
                  return '#4CAF50';
                ]]]
            - width: 26px
          grid:
            - grid-template-areas: "'i'"
        card_mod:
          style: |
            :host {
              display: flex;
              flex: 0 0 46px !important;
              max-width: 46px;
              align-self: stretch;
            }
            ha-card {
              height: 100%;
            }
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.show_power_controls
        state: "on"
    card: !include power-controls.yaml
