# Printer control row with compact power summary button and expandable power controls
# Uses a dedicated helper (input_boolean.show_power_controls) and includes power-controls.yaml.
type: vertical-stack
cards:
  - type: horizontal-stack
    card_mod:
      style: |
        #root {
          align-items: stretch;
        }
    cards:
      - type: custom:ha-bambulab-print_control-card
        printer: 210dfdfa64085e8cf073e50eae757d90
        card_mod:
          style: |
            :host {
              flex: 1 1 auto !important;
              min-width: 0;
            }
      - type: custom:button-card
        entity: input_boolean.show_power_controls
        show_name: false
        show_state: false
        show_label: false
        show_icon: true
        icon: mdi:power
        tap_action:
          action: toggle
        custom_fields:
          badge: |
            [[[ 
              const entities = [
                'switch.tp_link_power_strip_ab64_ams_heater',
                'switch.tp_link_power_strip_ab64_3d_printer_camera',
                'switch.tp_link_power_strip_ab64_3d_printer'
              ];
              const onCount = entities.reduce((count, id) => {
                const st = states[id]?.state;
                return count + (st === 'on' ? 1 : 0);
              }, 0);
              return `<span>${onCount}</span>`;
            ]]]
        styles:
          card:
            - min-width: 58px
            - width: 58px
            - height: 100%
            - padding: 8px 4px
            - border-radius: 16px
            - justify-self: end
          icon:
            - color: |
                [[[ 
                  const entities = [
                    'switch.tp_link_power_strip_ab64_ams_heater',
                    'switch.tp_link_power_strip_ab64_3d_printer_camera',
                    'switch.tp_link_power_strip_ab64_3d_printer'
                  ];
                  const statesList = entities.map(id => states[id]?.state || 'unavailable');
                  const onCount = statesList.filter(s => s === 'on').length;
                  const availableCount = statesList.filter(s => !['unavailable', 'unknown'].includes(s)).length;
                  if (onCount > 0) return '#F44336';
                  if (availableCount === 0) return '#9E9E9E';
                  return '#4CAF50';
                ]]]
            - width: 26px
          custom_fields:
            badge:
              - position: absolute
              - top: 4px
              - right: 4px
              - width: 18px
              - height: 18px
              - border-radius: 50%
              - background: var(--card-background-color)
              - border: 1px solid var(--divider-color)
              - display: flex
              - align-items: center
              - justify-content: center
              - font-size: 10px
              - font-weight: 700
          grid:
            - grid-template-areas: "'i'"
        card_mod:
          style: |
            :host {
              display: flex;
              flex: 0 0 58px !important;
              max-width: 58px;
              align-self: stretch;
            }
            ha-card {
              height: 100%;
            }
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.show_power_controls
        state: "on"
    card: !include power-controls.yaml
