# ============================================================
# Stop Print Button — Compact Icon Button
# ============================================================
# A small, icon-only stop button for halting the active print.
#
# Behavior:
#   - Active/Paused print → red button (#f44336) with white stop icon
#   - No active print     → greyed-out (#444444), disabled (clicks blocked)
#   - Tap shows a confirmation dialog before stopping
#   - Hover: button brightens when enabled
#
# State logic (matches ha_bambulab_cards):
#   Checks the actual HA entity availability of the stop button
#   entity rather than a hardcoded smart_status list.
#   The ha-bambulab integration marks the entity available/
#   unavailable based on the printer's real state, covering
#   ALL stages automatically.
#
#   can_stop = stop entity is not 'unavailable'
#
# Entity:  button.ntk_ryansoffice_3dprinter_stop_printing
#
# Prerequisites:
#   - custom:button-card (HACS)
#   - card_mod (HACS) for hover effect & disabled pointer-events
#
# Include from any view:
#   - !include ../../printer_controls/dashboard_cards/stop-print-button.yaml
# ============================================================

type: custom:button-card
entity: button.ntk_ryansoffice_3dprinter_stop_printing
show_name: false
show_state: false
show_icon: true
icon: mdi:stop
tap_action:
  action: call-service
  service: button.press
  service_data:
    entity_id: button.ntk_ryansoffice_3dprinter_stop_printing
  confirmation:
    text: "Stop the print?"
    exemptions: []
styles:
  card:
    - width: 46px
    - min-width: 46px
    - height: 46px
    - padding: 0
    - margin: 0
    - border-radius: 16px
    - display: flex
    - align-items: center
    - justify-content: center
    - background-color: |
        [[[
          const stop = states['button.ntk_ryansoffice_3dprinter_stop_printing'];
          const canStop = stop?.state !== 'unavailable';
          return canStop ? '#f44336' : '#444444';
        ]]]
    - opacity: |
        [[[
          const stop = states['button.ntk_ryansoffice_3dprinter_stop_printing'];
          const canStop = stop?.state !== 'unavailable';
          return canStop ? '1' : '0.5';
        ]]]
    - transition: background-color 0.2s, opacity 0.2s, filter 0.2s
    - box-shadow: none
  icon:
    - width: 26px
    - height: 26px
    - color: |
        [[[
          const stop = states['button.ntk_ryansoffice_3dprinter_stop_printing'];
          const canStop = stop?.state !== 'unavailable';
          return canStop ? '#ffffff' : '#888888';
        ]]]
  grid:
    - grid-template-areas: '"i"'
card_mod:
  style: |
    {% set can_stop = not is_state('button.ntk_ryansoffice_3dprinter_stop_printing', 'unavailable') %}
    ha-card {
      overflow: visible;
      transition: background-color 0.2s ease, transform 0.15s ease, filter 0.2s ease;
      {% if not can_stop %}
        pointer-events: none;
        cursor: default;
      {% endif %}
    }
    ha-card:hover {
      {% if can_stop %}
        filter: brightness(1.2);
        background-color: #d32f2f !important;
        transform: scale(1.1);
      {% endif %}
    }
