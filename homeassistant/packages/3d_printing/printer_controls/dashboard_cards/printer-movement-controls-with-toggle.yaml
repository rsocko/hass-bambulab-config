# ============================================================
# Printer Movement Controls — Popup Launcher Button
# ============================================================
# A compact icon-only button that opens the full printer
# movement controls (printer-movement-controls.yaml) in a
# browser_mod popup dialog.
#
# Designed to sit alongside other printer control buttons in
# a horizontal-stack row. Matches size/style of other buttons
# (skip-objects, stop, power, etc.).
#
# Required:
#   - custom:button-card (HACS)
#   - browser_mod (HACS) for popup action
#   - card_mod (HACS)
#
# Include from any view or card:
#   - !include ../../printer_controls/dashboard_cards/printer-movement-controls-with-toggle.yaml
# ============================================================

type: custom:button-card
show_name: false
show_state: false
show_label: false
show_icon: true
icon: mdi:camera-control
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: Printer Movement Controls
      size: normal
      content: !include printer-movement-controls.yaml
styles:
  card:
    - min-width: 46px
    - width: 46px
    - height: 46px
    - padding: 8px 4px
    - border-radius: 16px
    - display: flex
    - align-items: center
    - justify-content: center
    - transition: background 0.2s ease, transform 0.15s ease
  icon:
    - color: var(--primary-text-color)
    - width: 26px
  grid:
    - grid-template-areas: "'i'"
card_mod:
  style: |
    :host {
      display: flex;
      flex: 0 0 46px !important;
      max-width: 46px;
      min-width: 46px;
      justify-content: center;
      align-items: center;
    }
    ha-card {
      height: 46px;
      width: 46px;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    ha-card:hover {
      background: rgba(var(--rgb-primary-text-color), 0.12) !important;
      transform: scale(1.1);
    }
