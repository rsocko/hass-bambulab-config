# Docs: docs/features/printer_controls/README.md
# ============================================================
# Power Controls Dashboard Card
# ============================================================
# Stable single-card-per-entity approach to avoid conditional swap timing issues.
# Confirmation is always shown before toggling (safe default = Cancel).
# ============================================================

type: horizontal-stack
cards:
  - type: custom:mushroom-template-card
    entity: switch.tp_link_power_strip_ab64_ams_heater
    layout: vertical
    primary: 3D Printer
    secondary: ""
    icon: mdi:printer-3d
    icon_color: >-
      {% if is_state('switch.tp_link_power_strip_ab64_ams_heater', 'on') %}
        red
      {% elif states('switch.tp_link_power_strip_ab64_ams_heater') in ['unavailable', 'unknown'] %}
        grey
      {% else %}
        green
      {% endif %}
    tap_action:
      action: call-service
      service: switch.toggle
      target:
        entity_id: switch.tp_link_power_strip_ab64_ams_heater
      confirmation:
        text: Confirm power change for 3D Printer?
        exemptions: []
    icon_tap_action:
      action: call-service
      service: switch.toggle
      target:
        entity_id: switch.tp_link_power_strip_ab64_ams_heater
      confirmation:
        text: Confirm power change for 3D Printer?
        exemptions: []
    hold_action:
      action: more-info
    card_mod:
      style: |
        ha-card {
          position: relative;
          padding: 6px 4px !important;
          border-radius: 16px;
          min-height: 84px;
          background: {% if is_state('switch.tp_link_power_strip_ab64_ams_heater', 'on') %}rgba(244, 67, 54, 0.12){% elif states('switch.tp_link_power_strip_ab64_ams_heater') in ['unavailable', 'unknown'] %}rgba(158, 158, 158, 0.14){% else %}rgba(76, 175, 80, 0.12){% endif %};
          border: 1px solid {% if is_state('switch.tp_link_power_strip_ab64_ams_heater', 'on') %}rgba(244, 67, 54, 0.4){% elif states('switch.tp_link_power_strip_ab64_ams_heater') in ['unavailable', 'unknown'] %}rgba(158, 158, 158, 0.45){% else %}rgba(76, 175, 80, 0.4){% endif %};
        }
        mushroom-state-info {
          text-align: center;
          align-items: center;
        }
        .container {
          justify-content: center;
          gap: 4px;
        }
        .primary {
          font-size: 10px !important;
          line-height: 1.2 !important;
          text-align: center !important;
          white-space: normal !important;
        }

