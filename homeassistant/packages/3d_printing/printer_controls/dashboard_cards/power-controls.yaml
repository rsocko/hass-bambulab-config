# ============================================================
# Power Controls Dashboard Card
# ============================================================
# Three compact power cards with:
# - Label centered below icon (smaller font)
# - Standalone power icon in top-right (not a badge)
# - Confirmation shown only when turning OFF
# - Gray visual state for unavailable/unknown entities
# ============================================================

type: horizontal-stack
cards:
  # ── 3D PRINTER ──────────────────────────────────────────
  - type: vertical-stack
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: switch.tp_link_power_strip_ab64_ams_heater
            state: "on"
        card:
          type: custom:mushroom-template-card
          entity: switch.tp_link_power_strip_ab64_ams_heater
          layout: vertical
          primary: 3D Printer
          secondary: ""
          icon: mdi:printer-3d
          icon_color: red
          tap_action:
            action: call-service
            service: switch.turn_off
            target:
              entity_id: switch.tp_link_power_strip_ab64_ams_heater
            confirmation:
              text: Turn off the 3D Printer?
              exemptions: []
          hold_action:
            action: more-info
          card_mod:
            style: |
              ha-card {
                position: relative;
                padding: 6px 4px !important;
                border-radius: 16px;
                min-height: 84px;
                background: rgba(244, 67, 54, 0.12);
                border: 1px solid rgba(244, 67, 54, 0.4);
              }
              ha-card::after {
                content: "\23FB";
                position: absolute;
                top: 6px;
                right: 8px;
                font-size: 13px;
                line-height: 1;
                color: #F44336;
              }
              mushroom-state-info {
                text-align: center;
                align-items: center;
              }
              .container {
                justify-content: center;
                gap: 4px;
              }
              .primary {
                font-size: 10px !important;
                line-height: 1.2 !important;
                text-align: center !important;
                white-space: normal !important;
              }
      - type: conditional
        conditions:
          - condition: state
            entity: switch.tp_link_power_strip_ab64_ams_heater
            state: "off"
        card:
          type: custom:mushroom-template-card
          entity: switch.tp_link_power_strip_ab64_ams_heater
          layout: vertical
          primary: 3D Printer
          secondary: ""
          icon: mdi:printer-3d
