# Docs: docs/features/printer_controls/README.md
# ============================================================
# Pause / Start (Resume) Print Button — Compact Icon Button
# ============================================================
# A small, icon-only button that toggles between Pause and Start
# (resume) depending on the current print state.
#
# Behavior:
#   - Actively printing → orange pause button (#fb8c00)
#   - Paused            → green play button (#43a047)
#   - Neither           → disabled play button (greyed-out, clicks blocked)
#
# State logic (matches ha_bambulab_cards):
#   Checks the actual HA entity availability of the pause/resume
#   button entities rather than a hardcoded smart_status list.
#   The ha-bambulab integration marks these entities available/
#   unavailable based on the printer's real state, so this
#   automatically covers ALL stages (printing, bed leveling,
#   nozzle cleaning, print head alignment, calibration, etc.).
#
#   can_pause  = pause entity is not 'unavailable'
#   can_resume = resume entity is not 'unavailable'
#   enabled    = can_pause or can_resume
#
# Colors:
#   Pause  — bg: #fb8c00 (orange), hover: #e65100
#   Resume — bg: #43a047 (green),  hover: #1b5e20
#
# Entities:
#   - button.ntk_ryansoffice_3dprinter_pause_printing
#   - button.ntk_ryansoffice_3dprinter_resume_printing
#
# Prerequisites:
#   - custom:button-card (HACS)
#   - card_mod (HACS) for hover effect & disabled pointer-events
#
# Include from any view:
#   - !include ../../printer_controls/dashboard_cards/pause-start-button.yaml
# ============================================================

type: custom:button-card
entity: button.ntk_ryansoffice_3dprinter_pause_printing
show_name: false
show_state: false
show_icon: true
icon: |
  [[[
    const pause = states['button.ntk_ryansoffice_3dprinter_pause_printing'];
    const canPause = pause?.state !== 'unavailable';
    return canPause ? 'mdi:pause' : 'mdi:play';
  ]]]
tap_action:
  action: |
    [[[
      const pause = states['button.ntk_ryansoffice_3dprinter_pause_printing'];
      const resume = states['button.ntk_ryansoffice_3dprinter_resume_printing'];
      const canPause = pause?.state !== 'unavailable';
      const canResume = resume?.state !== 'unavailable';
      return (canPause || canResume) ? 'call-service' : 'none';
    ]]]
  service: button.press
  service_data:
    entity_id: |
      [[[
        const pause = states['button.ntk_ryansoffice_3dprinter_pause_printing'];
        const canPause = pause?.state !== 'unavailable';
        return canPause
          ? 'button.ntk_ryansoffice_3dprinter_pause_printing'
          : 'button.ntk_ryansoffice_3dprinter_resume_printing';
      ]]]
  confirmation:
    text: |
      [[[
        const pause = states['button.ntk_ryansoffice_3dprinter_pause_printing'];
        const canPause = pause?.state !== 'unavailable';
        return canPause ? 'Pause the print?' : 'Resume the print?';
      ]]]
    exemptions: []
styles:
  card:
    - width: 46px
    - min-width: 46px
    - height: 46px
    - padding: 0
    - margin: 0
    - border-radius: 16px
    - display: flex
    - align-items: center
    - justify-content: center
    - background-color: |
        [[[
          const pause = states['button.ntk_ryansoffice_3dprinter_pause_printing'];
          const resume = states['button.ntk_ryansoffice_3dprinter_resume_printing'];
          const canPause = pause?.state !== 'unavailable';
          const canResume = resume?.state !== 'unavailable';
          if (canPause) return '#fb8c00';
          if (canResume) return '#43a047';
          return '#444444';
        ]]]
    - opacity: |
        [[[
          const pause = states['button.ntk_ryansoffice_3dprinter_pause_printing'];
          const resume = states['button.ntk_ryansoffice_3dprinter_resume_printing'];
          const canPause = pause?.state !== 'unavailable';
          const canResume = resume?.state !== 'unavailable';
          return (canPause || canResume) ? '1' : '0.5';
        ]]]
    - transition: background-color 0.2s, opacity 0.2s, filter 0.2s
    - box-shadow: none
  icon:
    - width: 26px
    - height: 26px
    - color: |
        [[[
          const pause = states['button.ntk_ryansoffice_3dprinter_pause_printing'];
          const resume = states['button.ntk_ryansoffice_3dprinter_resume_printing'];
          const canPause = pause?.state !== 'unavailable';
          const canResume = resume?.state !== 'unavailable';
          return (canPause || canResume) ? '#ffffff' : '#888888';
        ]]]
  grid:
    - grid-template-areas: '"i"'
card_mod:
  style: |
    {% set can_pause = not is_state('button.ntk_ryansoffice_3dprinter_pause_printing', 'unavailable') %}
    {% set can_resume = not is_state('button.ntk_ryansoffice_3dprinter_resume_printing', 'unavailable') %}
    {% set enabled = can_pause or can_resume %}
    ha-card {
      overflow: visible;
      transition: background-color 0.2s ease, transform 0.15s ease, filter 0.2s ease;
      {% if not enabled %}
        pointer-events: none;
        cursor: default;
      {% endif %}
    }
    ha-card:hover {
      {% if can_pause %}
        filter: brightness(1.2);
        background-color: #e65100 !important;
        transform: scale(1.1);
      {% elif can_resume %}
        filter: brightness(1.2);
        background-color: #1b5e20 !important;
        transform: scale(1.1);
      {% endif %}
    }
