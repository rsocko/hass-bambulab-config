# Skip Objects launcher card (one-click)
#
# Purpose:
# - Open a direct multi-select Skip Objects picker popup with one click.
# - Avoid manual object-ID entry.
#
# Required:
# - browser_mod (for popup action)
# - Custom resource: /local/3d_printing/printer_controls/skip-objects-direct-card.js
#
# Replace these values for your environment:
# - device_id
# - printable_entity
# - skipped_entity

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Skip Objects
    icon: mdi:debug-step-over
    card_layout: large

  - type: custom:button-card
    variables:
      is_available: >-
        [[[ 
          const printable = states['sensor.ntk_ryansoffice_3dprinter_printable_objects'];
          const attrObjects = printable?.attributes?.objects;
          const attrCount = (attrObjects && typeof attrObjects === 'object') ? Object.keys(attrObjects).length : 0;
          const stateCount = parseInt(printable?.state || '0', 10);
          const count = attrCount > 0 ? attrCount : (Number.isFinite(stateCount) ? stateCount : 0);
          const stopState = states['button.ntk_ryansoffice_3dprinter_stop_print']?.state;
          const stopAvailable = stopState !== 'unavailable';
          return stopAvailable && count >= 2 && count <= 64;
        ]]]
    name: >-
      [[[ 
        return variables.is_available ? 'Skip Objects' : 'Skip Objects unavailable';
      ]]]
    label: >-
      [[[ 
        const printable = states['sensor.ntk_ryansoffice_3dprinter_printable_objects'];
        const attrObjects = printable?.attributes?.objects;
        const attrCount = (attrObjects && typeof attrObjects === 'object') ? Object.keys(attrObjects).length : 0;
        const stateCount = parseInt(printable?.state || '0', 10);
        const count = attrCount > 0 ? attrCount : (Number.isFinite(stateCount) ? stateCount : 0);
        return variables.is_available
          ? `${count} printable objects detected`
          : 'Start an active print with at least 2 objects to enable';
      ]]]
    show_label: true
    icon: mdi:shape-outline
    show_state: false
    tap_action:
      action: >-
        [[[ return variables.is_available ? 'fire-dom-event' : 'none'; ]]]
      browser_mod:
        service: browser_mod.popup
        data:
          title: Skip Objects
          size: wide
          content:
            type: custom:skip-objects-direct-card
            device_id: 210dfdfa64085e8cf073e50eae757d90
            printable_entity: sensor.ntk_ryansoffice_3dprinter_printable_objects
            skipped_entity: sensor.ntk_ryansoffice_3dprinter_skipped_objects
            title: Skip Objects
    styles:
      card:
        - padding: 12px
        - border-radius: 12px
        - opacity: >-
            [[[ return variables.is_available ? 1 : 0.65; ]]]
      name:
        - font-size: 14px
        - font-weight: 600
      label:
        - font-size: 11px
        - color: var(--secondary-text-color)
