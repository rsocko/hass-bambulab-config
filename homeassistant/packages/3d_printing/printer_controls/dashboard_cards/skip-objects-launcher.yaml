# Skip Objects launcher card (one-click)
#
# Purpose:
# - Open a direct multi-select Skip Objects picker popup with one click.
# - Avoid manual object-ID entry.
#
# Required:
# - browser_mod (for popup action)
# - Custom resource: /local/3d_printing/printer_controls/skip-objects-direct-card.js
#
# Replace these values for your environment:
# - device_id
# - printable_entity
# - skipped_entity

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Skip Objects
    icon: mdi:debug-step-over
    card_layout: large

  - type: custom:button-card
    name: >-
      [[[ 
        const count = parseInt(states['sensor.ntk_ryansoffice_3dprinter_printable_objects']?.state || '0', 10);
        const stopState = states['button.ntk_ryansoffice_3dprinter_stop_print']?.state;
        const available = stopState !== 'unavailable' && count >= 2 && count <= 64;
        return available ? 'Skip Objects' : 'Skip Objects unavailable';
      ]]]
    label: >-
      [[[ 
        const count = parseInt(states['sensor.ntk_ryansoffice_3dprinter_printable_objects']?.state || '0', 10);
        const stopState = states['button.ntk_ryansoffice_3dprinter_stop_print']?.state;
        const available = stopState !== 'unavailable' && count >= 2 && count <= 64;
        return available
          ? `${count} printable objects detected`
          : 'Start an active print with at least 2 objects to enable';
      ]]]
    show_label: true
    icon: mdi:shape-outline
    show_state: false
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Skip Objects
          size: wide
          content:
            type: custom:skip-objects-direct-card
            device_id: 210dfdfa64085e8cf073e50eae757d90
            printable_entity: sensor.ntk_ryansoffice_3dprinter_printable_objects
            skipped_entity: sensor.ntk_ryansoffice_3dprinter_skipped_objects
            title: Skip Objects
    state:
      - operator: template
        value: >-
          [[[ 
            const count = parseInt(states['sensor.ntk_ryansoffice_3dprinter_printable_objects']?.state || '0', 10);
            const stopState = states['button.ntk_ryansoffice_3dprinter_stop_print']?.state;
            return !(stopState !== 'unavailable' && count >= 2 && count <= 64);
          ]]]
        styles:
          card:
            - opacity: 0.65
    styles:
      card:
        - padding: 12px
        - border-radius: 12px
      name:
        - font-size: 14px
        - font-weight: 600
      label:
        - font-size: 11px
        - color: var(--secondary-text-color)
    lock:
      enabled: >-
        [[[ 
          const count = parseInt(states['sensor.ntk_ryansoffice_3dprinter_printable_objects']?.state || '0', 10);
          const stopState = states['button.ntk_ryansoffice_3dprinter_stop_print']?.state;
          return !(stopState !== 'unavailable' && count >= 2 && count <= 64);
        ]]]
