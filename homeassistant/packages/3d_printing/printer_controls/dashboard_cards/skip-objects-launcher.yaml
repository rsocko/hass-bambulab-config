# Skip Objects launcher card (one-click)
#
# Purpose:
# - Open a direct multi-select Skip Objects picker popup with one click.
# - Avoid manual object-ID entry.
#
# Required:
# - browser_mod (for popup action)
# - Custom resource: /local/3d_printing/printer_controls/skip-objects-direct-card.js
#
# Replace these values for your environment:
# - device_id
# - printable_entity
# - skipped_entity

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Skip Objects
    icon: mdi:debug-step-over
    card_layout: large

  - type: conditional
    conditions:
      - condition: template
        value_template: >-
          {% set count = states('sensor.ntk_ryansoffice_3dprinter_printable_objects') | int(0) %}
          {% set stop_avail = not is_state('button.ntk_ryansoffice_3dprinter_stop_print', 'unavailable') %}
          {{ stop_avail and count >= 2 and count <= 64 }}
    card:
      type: custom:button-card
      name: Skip Objects
      icon: mdi:shape-outline
      show_state: false
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Skip Objects
            size: wide
            content:
              type: custom:skip-objects-direct-card
              device_id: 210dfdfa64085e8cf073e50eae757d90
              printable_entity: sensor.ntk_ryansoffice_3dprinter_printable_objects
              skipped_entity: sensor.ntk_ryansoffice_3dprinter_skipped_objects
              title: Skip Objects
      styles:
        card:
          - padding: 12px
          - border-radius: 12px
        name:
          - font-size: 14px
          - font-weight: 600

  - type: conditional
    conditions:
      - condition: template
        value_template: >-
          {% set count = states('sensor.ntk_ryansoffice_3dprinter_printable_objects') | int(0) %}
          {% set stop_avail = not is_state('button.ntk_ryansoffice_3dprinter_stop_print', 'unavailable') %}
          {{ not (stop_avail and count >= 2 and count <= 64) }}
    card:
      type: markdown
      content: >-
        **Skip Objects unavailable**

        Start an active print with at least 2 printable objects to enable this control.
