# Docs: docs/features/printer_controls/skip-objects.md
# Skip Objects launcher button (compact, reusable)
#
# A small icon button that opens the Skip Objects popup via browser_mod.
# Designed to sit alongside other printer control buttons.
#
# Required:
#   - browser_mod (for popup action)
#   - Custom resource: /local/3d_printing/printer_controls/skip-objects-card.js

type: custom:button-card
entity: sensor.3d_printer_printable_objects
show_name: false
show_state: false
show_label: false
show_icon: true
icon: mdi:debug-step-over
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: Skip Objects
      size: normal
      content:
        type: custom:skip-objects-card
        title: Skip Objects
        subtitle: Protect active prints by excluding failed parts
        device_id: 210dfdfa64085e8cf073e50eae757d90
        printable_entity: sensor.3d_printer_printable_objects
        skipped_entity: sensor.3d_printer_skipped_objects
        pick_image_entity: image.3d_printer_pick_image
        stop_entity: button.ntk_ryansoffice_3dprinter_stop_printing
        min_objects: 2
        max_objects: 64
styles:
  card:
    - min-width: 46px
    - width: 46px
    - height: 46px
    - padding: 8px 4px
    - border-radius: 16px
    - display: flex
    - align-items: center
    - justify-content: center
    - transition: background 0.2s ease, transform 0.15s ease
  icon:
    - color: var(--primary-text-color)
    - width: 26px
  grid:
    - grid-template-areas: "'i'"
card_mod:
  style: |
    :host {
      display: flex;
      flex: 0 0 46px !important;
      max-width: 46px;
      min-width: 46px;
      justify-content: center;
      align-items: center;
    }
    ha-card {
      height: 46px;
      width: 46px;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    ha-card:hover {
      background: rgba(var(--rgb-primary-text-color), 0.12) !important;
      transform: scale(1.1);
    }
