                    - background: rgba(158, 158, 158, 0.28)
                    - border: 1px solid rgba(158, 158, 158, 0.35)
                    - clip-path: polygon(100% 18%, 100% 82%, 42% 100%, 0% 50%, 42% 0%)
                    - display: flex
                    - justify-content: flex-start
                    - align-items: center
                    - padding-left: 8px
                  icon:
                    - color: var(--primary-text-color)
                    - width: 22px
                extra_styles: |
                  ha-card { transition: transform 0.12s, background-color 0.12s, border-color 0.12s; cursor: pointer; }
                  ha-card:hover { transform: scale(1.03); background-color: rgba(158, 158, 158, 0.5) !important; border-color: rgba(196, 196, 196, 0.75) !important; }
                  ha-card:active { transform: scale(0.98); }
              - type: custom:button-card
                icon: mdi:chevron-right
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
                  service: bambu_lab.move_axis
                  service_data:
                    device_id: "210dfdfa64085e8cf073e50eae757d90"
                    axis: "X"
                    distance: 1
                style:
                  left: 74%
                  top: 50%
                  width: 20%
                  height: 50%
                  transform: translate(-50%, -50%)
                styles:
                  card:
                    - border-radius: 0
                    - background: rgba(158, 158, 158, 0.28)
                    - border: 1px solid rgba(158, 158, 158, 0.35)
                    - clip-path: polygon(0% 18%, 0% 82%, 58% 100%, 100% 50%, 58% 0%)
                    - display: flex
                    - justify-content: flex-end
                    - align-items: center
                    - padding-right: 8px
                  icon:
                    - color: var(--primary-text-color)
                    - width: 22px
                extra_styles: |
                  ha-card { transition: transform 0.12s, background-color 0.12s, border-color 0.12s; cursor: pointer; }
                  ha-card:hover { transform: scale(1.03); background-color: rgba(158, 158, 158, 0.5) !important; border-color: rgba(196, 196, 196, 0.75) !important; }
                  ha-card:active { transform: scale(0.98); }

              # Home in center
              - type: custom:button-card
                icon: mdi:home
                show_name: false
                show_state: false
                aspect_ratio: 1/1
                tap_action:
                  action: call-service
                  service: bambu_lab.move_axis
                  service_data:
                    device_id: "210dfdfa64085e8cf073e50eae757d90"
                    axis: "HOME"
                    distance: 0
                  confirmation:
                    text: >-
                      Home the printer? This brings the heat bed to the nozzle —
                      remove any model from the bed first to avoid damage.
                style:
                  left: 50%
                  top: 50%
                  width: 30%
                styles:
                  card:
                    - border-radius: 50%
                    - background: rgba(33, 150, 243, 0.15)
                    - border: 1px solid rgba(33, 150, 243, 0.45)
                  icon:
                    - color: '#2196F3'
                    - width: 34px
                extra_styles: |
                  ha-card { transition: transform 0.15s, background-color 0.15s, border-color 0.15s; cursor: pointer; }
                  ha-card:hover { transform: scale(1.08); background-color: rgba(33, 150, 243, 0.32) !important; border-color: rgba(33, 150, 243, 0.78) !important; }
                  ha-card:active { transform: scale(0.93); }

      # ── Z-axis (Bed) Controls ──────────────────────────────
      - type: vertical-stack
