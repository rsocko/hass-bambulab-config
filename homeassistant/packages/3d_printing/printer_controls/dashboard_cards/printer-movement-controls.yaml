                    device_id: "210dfdfa64085e8cf073e50eae757d90"
                    axis: "Y"
                    distance: 10
                style:
                  left: 50%
                  top: 50%
                  width: 96%
                  height: 96%
                  transform: translate(-50%, -50%) rotate(0deg)
                styles:
