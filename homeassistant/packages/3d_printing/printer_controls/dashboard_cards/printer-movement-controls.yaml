            show_name: false
            show_state: false
            icon: mdi:train-car-flatbed
            tap_action:
              action: none
            styles:
              card:
                - padding: 0
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 48px
              icon:
                - color: var(--primary-text-color)
                - opacity: '0.6'
                - width: 22px
          # Z -1 (gray)
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-down
            tap_action:
              action: call-service
              service: bambu_lab.move_axis
              service_data:
