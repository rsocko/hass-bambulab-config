                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(66, 165, 245, 0.25)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(66, 165, 245, 0.45) !important; }
