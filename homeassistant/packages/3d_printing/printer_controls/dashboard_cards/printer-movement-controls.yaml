# Docs: docs/features/printer_controls/README.md
# ============================================================
# Printer Movement Controls Card
# ============================================================
# SVG path-based XY movement + Z/Extruder controls.
#
# Services:
#   - bambu_lab.move_axis  { device_id, axis: X|Y|Z|HOME, distance }
#   - bambu_lab.extrude_retract  { device_id, type: retract|extrude }
# ============================================================

type: vertical-stack
cards:
  #  Active-print warning 
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: none
    custom_fields:
      content: |
        [[[ 
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state ?? '';
          const isPrinting = ['printing', 'running', 'prepare', 'init'].includes(stage.toLowerCase());
          return isPrinting
            ? `<div class="warn-wrap"><div class="warn">Printer is active - use movement controls with caution</div></div>`
            : '';
        ]]]
    styles:
      card:
        - padding: 4px 12px
        - background: transparent
        - box-shadow: none
        - border: none
      custom_fields:
        content:
          - width: 100%
          - display: flex
          - justify-content: center
    extra_styles: |
      .warn {
        display: block;
        font-size: 14px;
        color: #ff9800;
        text-align: center;
      }
      .warn-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
      }

  #  Main controls: [ XY ] | [ Z ] | [ Extruder ] 
  - type: horizontal-stack
    card_mod:
      style: |
        #root {
          display: grid !important;
          grid-template-columns: minmax(0, 4fr) minmax(68px, 1fr) minmax(68px, 1fr);
          align-items: center;
          column-gap: 12px;
          row-gap: 12px;
          padding: 0 6px;
        }
        #root > * {
          min-width: 0 !important;
          max-width: none !important;
          width: auto !important;
        }
        @media (max-width: 1024px) {
          #root {
            grid-template-columns: 1fr 1fr;
          }
          #root > *:first-child {
            grid-column: 1 / -1;
            grid-row: 1;
          }
          #root > *:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
            align-self: start;
          }
          #root > *:last-child {
            grid-column: 2;
            grid-row: 2;
            align-self: start;
          }
        }
    cards:
      #  XY Joypad (SVG path-based card) 
      - type: vertical-stack
        cards:
          - type: custom:button-card
            name: X / Y Axis
            show_name: true
            show_state: false
            show_icon: false
            tap_action:
              action: none
            styles:
              card:
                - padding: 2px
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 32px
              name:
                - font-size: 15px
                - font-weight: 600
                - opacity: '0.7'
                - white-space: nowrap
                - justify-self: center
          - type: custom:bambu-move-axis-card
            device_id: "210dfdfa64085e8cf073e50eae757d90"
            home_confirmation: >-
              Home the printer? This brings the heat bed to the nozzle -
              remove any model from the bed first to avoid damage.

      #  Z-axis (Bed) Controls 
      - type: vertical-stack
        cards:
          - type: custom:button-card
            name: Bed (Z)
            show_name: true
            show_state: false
            show_icon: false
            tap_action:
              action: none
            styles:
              card:
                - padding: 2px
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 32px
              name:
                - font-size: 15px
                - font-weight: 600
                - opacity: '0.7'
                - white-space: nowrap
                - justify-self: center
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-double-up
            tap_action:
              action: call-service
              service: bambu_lab.move_axis
              service_data:
                device_id: "210dfdfa64085e8cf073e50eae757d90"
                axis: "Z"
                distance: -10
            styles:
              card:
                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(66, 165, 245, 0.25)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(66, 165, 245, 0.45) !important; }
              ha-card:active { transform: scale(0.93); }
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-up
            tap_action:
              action: call-service
              service: bambu_lab.move_axis
              service_data:
                device_id: "210dfdfa64085e8cf073e50eae757d90"
                axis: "Z"
                distance: -1
            styles:
              card:
                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(158, 158, 158, 0.3)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(158, 158, 158, 0.5) !important; }
              ha-card:active { transform: scale(0.93); }
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:train-car-flatbed
            tap_action:
              action: none
            styles:
              card:
                - padding: 0
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 48px
              icon:
                - color: var(--primary-text-color)
                - opacity: '0.6'
                - width: 22px
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-down
            tap_action:
              action: call-service
              service: bambu_lab.move_axis
              service_data:
                device_id: "210dfdfa64085e8cf073e50eae757d90"
                axis: "Z"
                distance: 1
            styles:
              card:
                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(158, 158, 158, 0.3)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(158, 158, 158, 0.5) !important; }
              ha-card:active { transform: scale(0.93); }
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-double-down
            tap_action:
              action: call-service
              service: bambu_lab.move_axis
              service_data:
                device_id: "210dfdfa64085e8cf073e50eae757d90"
                axis: "Z"
                distance: 10
            styles:
              card:
                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(66, 165, 245, 0.25)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(66, 165, 245, 0.45) !important; }
              ha-card:active { transform: scale(0.93); }

      #  Extruder Controls 
      - type: vertical-stack
        cards:
          - type: custom:button-card
            name: Extruder
            show_name: true
            show_state: false
            show_icon: false
            tap_action:
              action: none
            styles:
              card:
                - padding: 2px
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 32px
              name:
                - font-size: 15px
                - font-weight: 600
                - opacity: '0.7'
                - white-space: nowrap
                - justify-self: center
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            tap_action:
              action: none
            styles:
              card:
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 48px
                - padding: 0
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-up
            tap_action:
              action: call-service
              service: bambu_lab.extrude_retract
              service_data:
                device_id: "210dfdfa64085e8cf073e50eae757d90"
                type: "retract"
            styles:
              card:
                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(158, 158, 158, 0.3)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(158, 158, 158, 0.5) !important; }
              ha-card:active { transform: scale(0.93); }
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:printer-3d-nozzle-outline
            tap_action:
              action: none
            styles:
              card:
                - padding: 0
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 48px
              icon:
                - color: var(--primary-text-color)
                - opacity: '0.6'
                - width: 22px
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-down
            tap_action:
              action: call-service
              service: bambu_lab.extrude_retract
              service_data:
                device_id: "210dfdfa64085e8cf073e50eae757d90"
                type: "extrude"
            styles:
              card:
                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(158, 158, 158, 0.3)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(158, 158, 158, 0.5) !important; }
              ha-card:active { transform: scale(0.93); }
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            tap_action:
              action: none
            styles:
              card:
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 48px
                - padding: 0

  #  Legend 
  - type: custom:button-card
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: none
    custom_fields:
      legend: |
        [[[return `
          <div class="legend">
            <span><span class="swatch blue"></span> = 10 mm&ensp;&ensp;<span class="swatch gray"></span> = 1 mm</span>
            <span><ha-icon icon="mdi:home" style="--mdc-icon-size:14px;"></ha-icon> = Home axes (requires confirmation)</span>
          </div>
        `]]]
    styles:
      card:
        - padding: 4px 12px 8px
        - background: transparent
        - box-shadow: none
        - border: none
      custom_fields:
        legend:
          - width: 100%
    extra_styles: |
      .legend { display:flex; flex-direction:column; gap:2px; font-size:10px; opacity:0.5; text-align:center; }
      .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; vertical-align:middle; }
      .swatch.blue { background:rgba(66,165,245,0.5); }
      .swatch.gray { background:rgba(158,158,158,0.5); }