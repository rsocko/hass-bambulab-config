                    - border-radius: 0
                    - background: rgba(158, 158, 158, 0.28)
                    - border: 1px solid rgba(158, 158, 158, 0.35)
                    - clip-path: polygon(18% 100%, 82% 100%, 100% 42%, 50% 0%, 0% 42%)
