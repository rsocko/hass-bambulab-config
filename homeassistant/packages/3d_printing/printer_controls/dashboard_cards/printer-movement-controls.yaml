          </div>
        `]]]
    styles:
      card:
        - padding: 4px 12px 8px
        - background: transparent
        - box-shadow: none
        - border: none
      custom_fields:
        legend:
          - width: 100%
    extra_styles: |
      .legend { display:flex; flex-direction:column; gap:2px; font-size:10px; opacity:0.5; text-align:center; }
      .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; vertical-align:middle; }
      .swatch.blue { background:rgba(66,165,245,0.5); }
      .swatch.gray { background:rgba(158,158,158,0.5); }
