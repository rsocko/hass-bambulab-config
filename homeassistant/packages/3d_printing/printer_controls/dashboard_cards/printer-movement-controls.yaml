                  ha-card:hover { transform: scale(1.03); background-color: rgba(66, 165, 245, 0.42) !important; border-color: rgba(66, 165, 245, 0.68) !important; }
                  ha-card:active { transform: scale(0.98); }
              - type: custom:button-card
                icon: mdi:chevron-double-right
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
                  service: bambu_lab.move_axis
                  service_data:
                    device_id: "210dfdfa64085e8cf073e50eae757d90"
                    axis: "X"
                    distance: 10
                style:
                  left: 87%
                  top: 50%
                  width: 27%
                  height: 72%
                  transform: translate(-50%, -50%)
                styles:
                  card:
                    - border-radius: 0
                    - background: rgba(66, 165, 245, 0.22)
                    - border: 1px solid rgba(66, 165, 245, 0.32)
                    - clip-path: polygon(0% 13%, 0% 87%, 62% 100%, 100% 50%, 62% 0%)
                    - display: flex
                    - justify-content: flex-end
                    - align-items: center
                    - padding-right: 10px
                  icon:
                    - color: var(--primary-text-color)
                    - width: 24px
                extra_styles: |
                  ha-card { transition: transform 0.12s, background-color 0.12s, border-color 0.12s; cursor: pointer; }
