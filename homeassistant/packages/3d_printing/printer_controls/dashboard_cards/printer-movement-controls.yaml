                  ha-card:active { transform: scale(0.98); }

              # Inner ring sectors: +/- 1 mm
              - type: custom:button-card
                icon: mdi:chevron-up
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
                  service: bambu_lab.move_axis
                  service_data:
                    device_id: "210dfdfa64085e8cf073e50eae757d90"
                    axis: "Y"
                    distance: 1
                style:
                  left: 50%
                  top: 26%
                  width: 50%
                  height: 20%
                  transform: translate(-50%, -50%)
                styles:
