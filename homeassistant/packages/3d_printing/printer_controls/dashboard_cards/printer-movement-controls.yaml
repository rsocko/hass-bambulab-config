                  ha-card:hover { transform: scale(1.08); background-color: rgba(66, 165, 245, 0.45) !important; border-color: rgba(66, 165, 245, 0.65) !important; }
                  ha-card:active { transform: scale(0.93); }

              # Inner ring wedges: +/- 1 mm
              - type: custom:button-card
                icon: mdi:chevron-up
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
                  service: bambu_lab.move_axis
