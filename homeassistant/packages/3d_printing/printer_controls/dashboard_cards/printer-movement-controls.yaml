                    - border-radius: 0
                    - background: rgba(66, 165, 245, 0.22)
                    - border: 1px solid rgba(66, 165, 245, 0.32)
                    - clip-path: polygon(100% 13%, 100% 87%, 38% 100%, 0% 50%, 38% 0%)
                    - display: flex
