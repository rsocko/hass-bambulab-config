                  ha-card:active { transform: scale(0.93); }
              - type: custom:button-card
                icon: mdi:chevron-double-up
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
                  service: bambu_lab.move_axis
                  service_data:
                    device_id: "210dfdfa64085e8cf073e50eae757d90"
                    axis: "X"
                    distance: 10
                style:
                  left: 50%
                  top: 50%
                  width: 96%
                  height: 96%
                  transform: translate(-50%, -50%) rotate(90deg)
                styles:
