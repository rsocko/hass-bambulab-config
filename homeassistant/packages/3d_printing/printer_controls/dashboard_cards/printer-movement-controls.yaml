# ============================================================
# Printer Movement Controls Card
# ============================================================
# Replicates the "Show Controls" page from ha-bambulab-cards (a1-screen-card)
# independently of the full Print Status card.
#
# Uses two bambu_lab services (from the ha-bambulab integration):
#   - bambu_lab.move_axis  { device_id, axis: X|Y|Z|HOME, distance: number }
#   - bambu_lab.extrude_retract  { device_id, type: retract|extrude }
#
# Layout (circular XY joypad):
#   [ XY Joypad ] | [ Z-axis (Bed) ] | [ Extruder ]
#
# Color scheme:
#   ±1 mm buttons  — medium gray  rgba(158,158,158,0.3)
#   ±10 mm buttons — blue tint    rgba(66,165,245,0.25)
#   HOME button    — blue accent   rgba(33,150,243,0.15)
#
# ⚠ WARNING: Moving axes while a print is in progress can damage your model
# or printer.  These controls are only safe when the printer is idle.
# ============================================================

type: vertical-stack
cards:
  # ── Active-print warning ───────────────────────────────────
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: none
    custom_fields:
      content: |
        [[[
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state ?? '';
          const isPrinting = ['printing', 'running', 'prepare', 'init'].includes(stage.toLowerCase());
          return isPrinting
            ? `<div class="warn-wrap"><div class="warn">⚠️ Printer is active - use movement controls with caution</div></div>`
            : '';
        ]]]
    styles:
      card:
        - padding: 4px 12px
        - background: transparent
        - box-shadow: none
        - border: none
      custom_fields:
        content:
          - width: 100%
          - display: flex
          - justify-content: center
    extra_styles: |
      .warn {
        display: block;
        font-size: 14px;
        color: #FF9800;
        text-align: center;
      }
      .warn-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
      }

  # ── Main controls: [ XY ] | [ Z ] | [ Extruder ] ──────────
  - type: horizontal-stack
    card_mod:
      style: |
        #root {
          display: grid !important;
          grid-template-columns: minmax(0, 4fr) minmax(68px, 1fr) minmax(68px, 1fr);
          align-items: start;
          column-gap: 12px;
          row-gap: 12px;
          padding: 0 6px;
        }
        #root > * {
          min-width: 0 !important;
          max-width: none !important;
          width: auto !important;
        }
        @media (max-width: 1024px) {
          #root {
            grid-template-columns: 1fr 1fr;
          }
          #root > *:first-child {
            grid-column: 1 / -1;
            grid-row: 1;
          }
          #root > *:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
          }
          #root > *:last-child {
            grid-column: 2;
            grid-row: 2;
          }
        }
    cards:
      # ── XY Joypad (circular layout) ───────────────────────
      - type: vertical-stack
        cards:
          - type: custom:button-card
            name: X / Y Axis
            show_name: true
            show_state: false
            show_icon: false
            tap_action:
              action: none
            styles:
              card:
                - padding: 2px
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 32px
              name:
                - font-size: 15px
                - font-weight: 600
                - opacity: '0.7'
                - white-space: nowrap
                - justify-self: center
          - type: picture-elements
            aspect_ratio: 1/1
            image: /local/3d_printing/printer_controls/printer_xy_control.svg
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  box-shadow: none;
                }
            elements:
              # Outer ring sectors: +/- 10 mm
              - type: custom:button-card
                icon: mdi:chevron-double-up
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
                  service: bambu_lab.move_axis
                  service_data:
                    device_id: "210dfdfa64085e8cf073e50eae757d90"
                    axis: "Y"
                    distance: 10
                style:
                  left: 50%
                  top: 13%
                  width: 72%
                  height: 27%
                  transform: translate(-50%, -50%)
                styles:
                  card:
                    - border-radius: 0
                    - background: rgba(66, 165, 245, 0.22)
                    - border: 1px solid rgba(66, 165, 245, 0.32)
                    - clip-path: polygon(13% 100%, 87% 100%, 100% 38%, 50% 0%, 0% 38%)
                    - display: flex
                    - justify-content: center
                    - align-items: flex-start
                    - padding-top: 10px
                  icon:
                    - color: var(--primary-text-color)
                    - width: 24px
                extra_styles: |
                  ha-card { transition: transform 0.12s, background-color 0.12s, border-color 0.12s; cursor: pointer; }
                  ha-card:hover { transform: scale(1.03); background-color: rgba(66, 165, 245, 0.42) !important; border-color: rgba(66, 165, 245, 0.68) !important; }
                  ha-card:active { transform: scale(0.98); }
              - type: custom:button-card
                icon: mdi:chevron-double-down
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
                  service: bambu_lab.move_axis
                  service_data:
                    device_id: "210dfdfa64085e8cf073e50eae757d90"
                    axis: "Y"
                    distance: -10
                style:
                  left: 50%
                  top: 87%
                  width: 72%
                  height: 27%
                  transform: translate(-50%, -50%)
                styles:
                  card:
                    - border-radius: 0
                    - background: rgba(66, 165, 245, 0.22)
                    - border: 1px solid rgba(66, 165, 245, 0.32)
                    - clip-path: polygon(13% 0%, 87% 0%, 100% 62%, 50% 100%, 0% 62%)
                    - display: flex
                    - justify-content: center
                    - align-items: flex-end
                    - padding-bottom: 10px
                  icon:
                    - color: var(--primary-text-color)
                    - width: 24px
                extra_styles: |
                  ha-card { transition: transform 0.12s, background-color 0.12s, border-color 0.12s; cursor: pointer; }
                  ha-card:hover { transform: scale(1.03); background-color: rgba(66, 165, 245, 0.42) !important; border-color: rgba(66, 165, 245, 0.68) !important; }
                  ha-card:active { transform: scale(0.98); }
              - type: custom:button-card
                icon: mdi:chevron-double-left
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
