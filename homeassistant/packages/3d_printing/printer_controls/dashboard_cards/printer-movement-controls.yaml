# ============================================================
# Printer Movement Controls Card
# ============================================================
# Replicates the "Show Controls" page from ha-bambulab-cards (a1-screen-card)
# independently of the full Print Status card.
#
# Uses two bambu_lab services (from the ha-bambulab integration):
#   - bambu_lab.move_axis  { device_id, axis: X|Y|Z|HOME, distance: number }
#   - bambu_lab.extrude_retract  { device_id, type: retract|extrude }
#
# Layout (+ sign XY joypad):
#   [ Z-axis (Bed) ] | [ XY Joypad ] | [ Extruder ]
#
# Color scheme:
#   ±1 mm buttons  — medium gray  rgba(158,158,158,0.3)
#   ±10 mm buttons — blue tint    rgba(66,165,245,0.25)
#   HOME button    — blue accent   rgba(33,150,243,0.15)
#
# ⚠ WARNING: Moving axes while a print is in progress can damage your model
# or printer.  These controls are only safe when the printer is idle.
# ============================================================

type: vertical-stack
cards:
  # ── Active-print warning ───────────────────────────────────
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: none
    custom_fields:
      content: |
        [[[
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state ?? '';
          const isPrinting = ['printing', 'running', 'prepare', 'init'].includes(stage.toLowerCase());
          return isPrinting
            ? `<div class="warn">⚠️ Printer is active — use movement controls with caution</div>`
            : '';
        ]]]
    styles:
      card:
        - padding: 4px 12px
        - background: transparent
        - box-shadow: none
        - border: none
      custom_fields:
        content:
          - width: 100%
    extra_styles: |
      .warn {
        font-size: 14px;
        color: #FF9800;
        width: 100%;
        text-align: center;
      }

  # ── Main controls: [ Z ] | [ XY ] | [ Extruder ] ──────────
  - type: horizontal-stack
    card_mod:
      style: |
        #root {
          align-items: flex-start;
          gap: 24px;
          padding: 0 8px;
        }
        #root > *:first-child {
          flex: 0 0 70px !important;
          max-width: 70px;
        }
        #root > *:nth-child(2) {
          flex: 1 1 auto !important;
        }
        #root > *:last-child {
          flex: 0 0 70px !important;
          max-width: 70px;
        }
    cards:
      # ── Z-axis (Bed) Controls ──────────────────────────────
      - type: vertical-stack
        cards:
          - type: custom:button-card
            name: Bed (Z)
            show_name: true
            show_state: false
            show_icon: false
            tap_action:
              action: none
            styles:
              card:
                - padding: 2px
                - background: transparent
                - box-shadow: none
                - border: none
                - height: 32px
              name:
                - font-size: 15px
                - font-weight: 600
                - opacity: '0.7'
                - white-space: nowrap
                - justify-self: center
          # Z +10 (blue tint)
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-double-up
            tap_action:
              action: call-service
              service: bambu_lab.move_axis
              service_data:
                device_id: "210dfdfa64085e8cf073e50eae757d90"
                axis: "Z"
                distance: -10
            styles:
              card:
                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(66, 165, 245, 0.25)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(66, 165, 245, 0.45) !important; }
              ha-card:active { transform: scale(0.93); }
          # Z +1 (gray)
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:chevron-up
            tap_action:
              action: call-service
              service: bambu_lab.move_axis
              service_data:
                device_id: "210dfdfa64085e8cf073e50eae757d90"
                axis: "Z"
                distance: -1
            styles:
              card:
                - padding: 4px
                - border-radius: 12px
                - height: 48px
                - background-color: rgba(158, 158, 158, 0.3)
              icon:
                - color: var(--primary-text-color)
                - width: 20px
            extra_styles: |
              ha-card { transition: transform 0.15s, background-color 0.15s; cursor: pointer; }
              ha-card:hover { transform: scale(1.08); background-color: rgba(158, 158, 158, 0.5) !important; }
              ha-card:active { transform: scale(0.93); }
          # Bed icon (centered)
          - type: custom:button-card
            show_name: false
            show_state: false
            icon: mdi:train-car-flatbed
            tap_action:
