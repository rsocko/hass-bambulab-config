# Bambuddy Webhook Receiver — ingests webhooks from Bambuddy and fires a
# normalized HA event (`bambuddy_webhook_event`) for downstream features.
#
# Configure in Bambuddy → Settings → Notifications → Webhook (Custom):
#   URL: http(s)://<ha-host>/api/webhook/bambuddy_events
#
# Handles Bambuddy payload formats:
#   1. API format (structured): { "event": "...", "data": { "archive_id": ..., ... } }
#   2. Legacy generic notifications: { "title": "...", "message": "...", "timestamp": "...", "source": "..." }
#   3. v0.2.3+ generic notifications: legacy generic fields plus top-level
#      structured event/variables such as { "event": "print_start", "filename": "...", "printer": "..." }
#
# Downstream automations listen for `bambuddy_webhook_event` — NOT raw webhooks.
# Docs: docs/features/bambuddy_common/README.md
- alias: "Bambuddy - Webhook Receiver"
  id: bambuddy_webhook_receiver
  description: >
    Receives webhook events from Bambuddy, normalizes both API and notification
    payload formats, and fires a consistent bambuddy_webhook_event HA event.

  triggers:
    - trigger: webhook
      webhook_id: "bambuddy_events"
      allowed_methods:
        - POST
      local_only: false

  conditions:
    - condition: state
      entity_id: input_boolean.bambuddy_integration_enabled
      state: "on"

  actions:
    # Detect which format we received and extract fields consistently.
    # API format puts details inside a `data` object; notification format is flat.
    # Bambuddy v0.2.3 generic webhook notifications now include structured
    # event data as top-level flattened variables without nesting them under
    # `data`, so keep the receiver tolerant of both shapes.
    - variables:
        is_api_format: "{{ trigger.json.data is defined and trigger.json.data is mapping }}"
        raw_event_name: >-
          {% if trigger.json.event is defined and trigger.json.event not in ['', none] %}
            {{ trigger.json.event }}
          {% elif is_api_format and trigger.json.data.event is defined and trigger.json.data.event not in ['', none] %}
            {{ trigger.json.data.event }}
          {% else %}
            {{ '' }}
          {% endif %}
        generic_title: "{{ trigger.json.title | default('', true) | string | trim }}"
        generic_message: "{{ trigger.json.message | default('', true) | string | trim }}"
        generic_source: "{{ trigger.json.source | default('', true) | string | trim }}"
        generic_text: >-
          {{ (generic_title ~ ' ' ~ generic_message) | lower | trim }}
        event_name: >-
          {% set raw = raw_event_name | string | lower | trim %}
          {% if raw in ['print_complete', 'print_completed', 'print_finished', 'print_finish', 'print_done'] %}
            print_complete
          {% elif raw in ['print_failed', 'print_failure', 'print_error'] %}
            print_failed
          {% elif raw in ['print_stopped', 'print_stop', 'print_cancelled', 'print_canceled'] %}
            print_stopped
          {% elif raw in ['print_started', 'print_start'] %}
            print_started
          {% elif raw == 'queue_ready' %}
            queue_ready
          {% elif 'print started' in generic_text or 'started printing' in generic_text %}
            print_started
          {% elif 'print complete' in generic_text or 'print completed' in generic_text or 'print finished' in generic_text or 'has finished printing' in generic_text %}
            print_complete
          {% elif 'print failed' in generic_text or 'failed printing' in generic_text or 'encountered an error during' in generic_text %}
            print_failed
          {% elif 'print stopped' in generic_text or 'print cancelled' in generic_text or 'print canceled' in generic_text or 'stopped printing' in generic_text %}
            print_stopped
          {% elif 'queue ready' in generic_text %}
            queue_ready
          {% else %}
            unknown
          {% endif %}
        archive_id: >-
          {% if is_api_format %}
            {{ trigger.json.data.archive_id | default('') }}
          {% else %}
            {{ trigger.json.archive_id
               | default(trigger.json.id, true)
               | default('') }}
          {% endif %}
        print_name: >-
          {% if is_api_format %}
            {{ trigger.json.data.print_name | default(trigger.json.data.name, true) | default('') }}
          {% elif trigger.json.print_name is defined and trigger.json.print_name not in ['', none] %}
            {{ trigger.json.print_name }}
          {% elif trigger.json.task_name is defined and trigger.json.task_name not in ['', none] %}
            {{ trigger.json.task_name }}
          {% elif trigger.json.filename is defined and trigger.json.filename not in ['', none] %}
            {{ trigger.json.filename }}
          {% elif trigger.json.name is defined and trigger.json.name not in ['', none] %}
            {{ trigger.json.name }}
          {% else %}
            {{ '' }}
          {% endif %}
        printer_name: >-
          {% if is_api_format %}
            {{ trigger.json.data.printer_name | default('') }}
          {% elif trigger.json.printer_name is defined and trigger.json.printer_name not in ['', none] %}
            {{ trigger.json.printer_name }}
          {% elif trigger.json.printer is defined and trigger.json.printer not in ['', none] %}
            {{ trigger.json.printer }}
          {% else %}
            {{ generic_source }}
          {% endif %}
        status: >-
          {% if is_api_format %}
            {{ trigger.json.data.status | default('') }}
          {% else %}
            {{ trigger.json.status
               | default(trigger.json.state, true)
               | default('') }}
          {% endif %}
        printer_id: >-
          {% if is_api_format %}
            {{ trigger.json.data.printer_id | default('') }}
          {% else %}
            {{ trigger.json.printer_id
               | default(trigger.json.printerId, true)
               | default('') }}
          {% endif %}

    - action: logbook.log
      data:
        name: Bambuddy Webhook
        message: >-
          Received event '{{ event_name }}' for '{{ print_name }}'
          on {{ printer_name }} (archive_id={{ archive_id }})

    # Fire normalized event for all downstream features to consume
    - event: bambuddy_webhook_event
      event_data:
        event: "{{ event_name }}"
        archive_id: "{{ archive_id }}"
        print_name: "{{ print_name }}"
        printer_name: "{{ printer_name }}"
        printer_id: "{{ printer_id }}"
        status: "{{ status }}"
        raw_title: "{{ generic_title }}"
        raw_message: "{{ generic_message }}"
        raw_payload: "{{ trigger.json }}"

  mode: queued
  max: 10
