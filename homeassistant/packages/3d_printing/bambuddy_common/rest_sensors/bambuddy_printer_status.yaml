# Bambuddy Printer Status — polls Bambuddy for live printer state.
# Docs: docs/features/bambuddy_common/README.md
#
# Actual API response fields (GET /api/v1/printers/{id}/status):
#   id, name, connected, state, current_print, subtask_name, gcode_file,
#   progress, remaining_time, layer_num, total_layers, temperatures{},
#   cover_url, hms_errors[], ams[]
- platform: rest
  name: "Bambuddy Printer Status"
  unique_id: bambuddy_printer_status
  resource_template: >-
    {{ states('input_text.bambuddy_api_base_url') }}/api/v1/printers/{{
      states('input_text.bambuddy_printer_id')
    }}/status
  headers:
    X-API-Key: !secret bambuddy_api_key
    Content-Type: application/json
  method: GET
  value_template: >-
    {{ value_json.state | default('unknown') }}
  json_attributes:
    - name
    - connected
    - state
    - current_print
    - subtask_name
    - gcode_file
    - progress
    - remaining_time
    - layer_num
    - total_layers
    - temperatures
    - cover_url
    - hms_errors
    - ams
  scan_interval: 30
  icon: mdi:printer-3d
