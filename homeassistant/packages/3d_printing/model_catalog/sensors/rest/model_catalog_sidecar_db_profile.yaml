- resource: >-
    {{
      states('input_text.model_catalog_sidecar_base_url')
      if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
      else 'http://model-catalog-sidecar:8314'
    }}/config
  scan_interval: 30
  timeout: 10
  sensor:
    - name: Model Catalog Sidecar DB Profile
      unique_id: model_catalog_sidecar_db_profile
      value_template: "{{ value_json.db_profile | default('unknown', true) | lower }}"
      icon: mdi:database-switch
      attributes:
        db_path: "{{ value_json.db_path | default('', true) }}"
        db_path_prod: "{{ value_json.db_path_prod | default('', true) }}"
        db_path_test: "{{ value_json.db_path_test | default('', true) }}"
