model_catalog_group_intake_item:
  url: >-
    {{ (
      states('input_text.model_catalog_sidecar_base_url')
      if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
      else 'http://model-catalog-sidecar:8314'
    ) }}/api/intake/items/{{ item_id }}/group
  method: POST
  content_type: application/json
  payload: >-
    {{ {
      'action': (action | default('create_working_group', true) | string),
      'title': (title | default('', true) | string),
      'stage': (stage | default('draft', true) | string),
      'working_group_id': (working_group_id | default(0, true) | int(0))
    } | tojson }}