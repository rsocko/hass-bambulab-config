model_catalog_remove_working_group_item:
  url: >-
    {{ (
      states('input_text.model_catalog_sidecar_base_url')
      if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
      else 'http://model-catalog-sidecar:8314'
    ) }}/api/working-groups/{{ group_id }}/items/{{ item_id }}
  method: DELETE