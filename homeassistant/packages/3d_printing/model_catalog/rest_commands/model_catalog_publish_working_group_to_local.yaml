model_catalog_publish_working_group_to_local:
  url: >-
    {{ (
      states('input_text.model_catalog_sidecar_base_url')
      if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
      else 'http://model-catalog-sidecar:8314'
    ) }}/api/working-groups/{{ group_id }}/publish-to-local
  method: POST
  content_type: application/json
  payload: >-
    {% set ns = namespace(body={}) %}
    {% if publish_outcome is defined and (publish_outcome | string | trim) != '' %}
      {% set ns.body = dict(ns.body, publish_outcome=(publish_outcome | string)) %}
    {% endif %}
    {% if model_name is defined and (model_name | string | trim) != '' %}
      {% set ns.body = dict(ns.body, model_name=(model_name | string)) %}
    {% endif %}
    {% if target_model_ref is defined and (target_model_ref | string | trim) != '' %}
      {% set ns.body = dict(ns.body, target_model_ref=(target_model_ref | string)) %}
    {% endif %}
    {% if description is defined and (description | string | trim) != '' %}
      {% set ns.body = dict(ns.body, description=(description | string)) %}
    {% endif %}
    {% if project_id is defined and (project_id | string | trim) != '' %}
      {% set ns.body = dict(ns.body, project_id=(project_id | int)) %}
    {% endif %}
    {% if lineage_type is defined and (lineage_type | string | trim) != '' %}
      {% set ns.body = dict(ns.body, lineage_type=(lineage_type | string)) %}
    {% endif %}
    {% if reconciliation_notes is defined and (reconciliation_notes | string | trim) != '' %}
      {% set ns.body = dict(ns.body, reconciliation_notes=(reconciliation_notes | string)) %}
    {% endif %}
    {% if create_project_title is defined and (create_project_title | string | trim) != '' %}
      {% set ns.body = dict(ns.body, create_project={
        'title': (create_project_title | string),
        'description': (create_project_description | default('', true) | string)
      }) %}
    {% endif %}
    {{ ns.body | to_json }}