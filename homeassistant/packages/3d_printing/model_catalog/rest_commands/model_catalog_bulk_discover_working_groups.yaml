# Bulk discover working-group proposals from a local folder tree.
# Calls sidecar endpoint without committing writes.
model_catalog_bulk_discover_working_groups:
  url: >-
    {{
      (
        states('input_text.model_catalog_sidecar_base_url')
        if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
        else 'http://model-catalog-sidecar:8314'
      )
    }}/working-groups/bulk-discover
  method: POST
  headers:
    Content-Type: application/json
  payload: >-
    {% set ns = namespace(body={}) %}
    {% set ns.body = dict(ns.body, folder_path=(folder_path | string)) %}
    {% if grouping_strategy is defined and (grouping_strategy | string | trim) != '' %}
      {% set ns.body = dict(ns.body, grouping_strategy=(grouping_strategy | string)) %}
    {% endif %}
    {{ ns.body | to_json }}
