model_catalog_update_working_group:
  url: >-
    {{ (
      states('input_text.model_catalog_sidecar_base_url')
      if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
      else 'http://model-catalog-sidecar:8314'
    ) }}/api/working-groups/{{ group_id }}
  method: PATCH
  content_type: application/json
  payload: >-
    {%- set ns = namespace(payload={}) -%}
    {%- if title is defined -%}
      {%- set ns.payload = ns.payload | combine({'title': (title | string)}) -%}
    {%- endif -%}
    {%- if stage is defined -%}
      {%- set ns.payload = ns.payload | combine({'stage': (stage | string)}) -%}
    {%- endif -%}
    {%- if notes is defined -%}
      {%- set ns.payload = ns.payload | combine({'notes': (notes | string)}) -%}
    {%- endif -%}
    {%- if primary_file_path is defined -%}
      {%- set ns.payload = ns.payload | combine({'primary_file_path': (primary_file_path | string)}) -%}
    {%- endif -%}
    {%- if folder_hint is defined -%}
      {%- set ns.payload = ns.payload | combine({'folder_hint': (folder_hint | string)}) -%}
    {%- endif -%}
    {%- if project_id is defined -%}
      {%- set ns.payload = ns.payload | combine({'project_id': project_id}) -%}
    {%- endif -%}
    {{ ns.payload | tojson }}