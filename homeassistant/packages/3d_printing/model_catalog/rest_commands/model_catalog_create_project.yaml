model_catalog_create_project:
  url: >-
    {{ (
      states('input_text.model_catalog_sidecar_base_url')
      if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
      else 'http://model-catalog-sidecar:8314'
    ) }}/api/projects
  method: POST
  content_type: application/json
  payload: >-
    {{ {
      'title': (title | string),
      'description': (description | default('', true) | string),
      'notes': (notes | default('', true) | string),
      'bambuddy_project_id': (bambuddy_project_id | default(None, true))
    } | tojson }}