# Delete a photo from a model.
# Docs: docs/features/model_catalog/implementation-plan.md
model_catalog_delete_photo:
  url: "{{ states('input_text.model_catalog_sidecar_base_url') if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', ''] else 'http://model-catalog-sidecar:8314' }}/api/models/{{ model_ref }}/photos/{{ photo_id }}"
  method: DELETE
  timeout: 10
