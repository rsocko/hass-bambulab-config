# Search curated model catalog with optional filters and pagination.
# Routes browser UI requests through Home Assistant to avoid direct browser-to-sidecar CORS/network issues.
model_catalog_search_models:
  url: >-
    {%- set ns = namespace(params=[]) -%}
    {%- if q is defined and (q | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['q=' ~ ((q | string) | urlencode)] -%}
    {%- endif -%}
    {%- if collection is defined and (collection | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['collection=' ~ ((collection | string) | urlencode)] -%}
    {%- endif -%}
    {%- if creator is defined and (creator | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['creator=' ~ ((creator | string) | urlencode)] -%}
    {%- endif -%}
    {%- if tag is defined and (tag | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['tag=' ~ ((tag | string) | urlencode)] -%}
    {%- endif -%}
    {%- if sort is defined and (sort | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['sort=' ~ ((sort | string) | urlencode)] -%}
    {%- endif -%}
    {%- if favorites_only is defined -%}
      {%- set ns.params = ns.params + ['favorites_only=' ~ ((favorites_only | bool) | string | lower)] -%}
    {%- endif -%}
    {%- if frequents_only is defined -%}
      {%- set ns.params = ns.params + ['frequents_only=' ~ ((frequents_only | bool) | string | lower)] -%}
    {%- endif -%}
    {%- set configured_frequent_window_days = states('input_number.model_catalog_frequent_window_days') | int(90) -%}
    {%- set configured_frequent_min_prints = states('input_number.model_catalog_frequent_min_prints') | int(3) -%}
    {%- if frequent_window_days is defined -%}
      {%- set ns.params = ns.params + ['frequent_window_days=' ~ ((frequent_window_days | int(configured_frequent_window_days)) | string)] -%}
    {%- else -%}
      {%- set ns.params = ns.params + ['frequent_window_days=' ~ (configured_frequent_window_days | string)] -%}
    {%- endif -%}
    {%- if frequent_min_prints is defined -%}
      {%- set ns.params = ns.params + ['frequent_min_prints=' ~ ((frequent_min_prints | int(configured_frequent_min_prints)) | string)] -%}
    {%- else -%}
      {%- set ns.params = ns.params + ['frequent_min_prints=' ~ (configured_frequent_min_prints | string)] -%}
    {%- endif -%}
    {%- if frequent_backfill_weight is defined -%}
      {%- set ns.params = ns.params + ['frequent_backfill_weight=' ~ ((frequent_backfill_weight | float(0.5)) | string)] -%}
    {%- endif -%}
    {%- if has_other_files is defined -%}
      {%- set ns.params = ns.params + ['has_other_files=' ~ ((has_other_files | bool) | string | lower)] -%}
    {%- endif -%}
    {%- if show_archived is defined -%}
      {%- set ns.params = ns.params + ['show_archived=' ~ ((show_archived | bool) | string | lower)] -%}
    {%- endif -%}
    {%- if refresh is defined -%}
      {%- set ns.params = ns.params + ['refresh=' ~ ((refresh | bool) | string | lower)] -%}
    {%- endif -%}
    {%- if include_supplements is defined -%}
      {%- set ns.params = ns.params + ['include_supplements=' ~ ((include_supplements | bool) | string | lower)] -%}
    {%- endif -%}
    {%- set ns.params = ns.params + ['page=' ~ ((page | default(1)) | int(1) | string)] -%}
    {%- set ns.params = ns.params + ['per_page=' ~ ((per_page | default(10)) | int(10) | string)] -%}
    {{- (
        states('input_text.model_catalog_sidecar_base_url')
        if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
        else 'http://model-catalog-sidecar:8314'
      ) -}}/api/models/search{%- if ns.params | count > 0 %}?{{ ns.params | join('&') }}{%- endif -%}
  method: GET
