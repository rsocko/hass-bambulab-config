# Search curated model catalog with optional filters and pagination.
# Routes browser UI requests through Home Assistant to avoid direct browser-to-sidecar CORS/network issues.
model_catalog_search_models:
  url: >-
    {%- set ns = namespace(params=[]) -%}
    {%- if q is defined and (q | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['q=' ~ ((q | string) | urlencode)] -%}
    {%- endif -%}
    {%- if collection is defined and (collection | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['collection=' ~ ((collection | string) | urlencode)] -%}
    {%- endif -%}
    {%- if creator is defined and (creator | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['creator=' ~ ((creator | string) | urlencode)] -%}
    {%- endif -%}
    {%- if tag is defined and (tag | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['tag=' ~ ((tag | string) | urlencode)] -%}
    {%- endif -%}
    {%- if to_print_status is defined and (to_print_status | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['to_print_status=' ~ ((to_print_status | string) | urlencode)] -%}
    {%- endif -%}
    {%- if to_print_priority is defined and (to_print_priority | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['to_print_priority=' ~ ((to_print_priority | string) | urlencode)] -%}
    {%- endif -%}
    {%- if to_print_priority_min is defined and (to_print_priority_min | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['to_print_priority_min=' ~ ((to_print_priority_min | string) | urlencode)] -%}
    {%- endif -%}
    {%- if to_print_priority_max is defined and (to_print_priority_max | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['to_print_priority_max=' ~ ((to_print_priority_max | string) | urlencode)] -%}
    {%- endif -%}
    {%- if sort is defined and (sort | string | trim) != '' -%}
      {%- set ns.params = ns.params + ['sort=' ~ ((sort | string) | urlencode)] -%}
    {%- endif -%}
    {%- if refresh is defined -%}
      {%- set ns.params = ns.params + ['refresh=' ~ ((refresh | bool) | string | lower)] -%}
    {%- endif -%}
    {%- set ns.params = ns.params + ['page=' ~ ((page | default(1)) | int(1) | string)] -%}
    {%- set ns.params = ns.params + ['per_page=' ~ ((per_page | default(10)) | int(10) | string)] -%}
    {{- (
        states('input_text.model_catalog_sidecar_base_url')
        if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
        else 'http://model-catalog-sidecar:8314'
      ) -}}/api/models/search{%- if ns.params | count > 0 %}?{{ ns.params | join('&') }}{%- endif -%}
  method: GET
