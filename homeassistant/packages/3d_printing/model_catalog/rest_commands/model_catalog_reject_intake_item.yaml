model_catalog_reject_intake_item:
  url: >-
    {{ (
      states('input_text.model_catalog_sidecar_base_url')
      if states('input_text.model_catalog_sidecar_base_url') not in ['unknown', 'unavailable', 'none', '']
      else 'http://model-catalog-sidecar:8314'
    ) }}/api/intake/items/{{ item_id }}/reject
  method: POST
  content_type: application/json
  payload: >-
    {{ {
      'note': (note | default('Rejected by operator', true) | string)
    } | tojson }}