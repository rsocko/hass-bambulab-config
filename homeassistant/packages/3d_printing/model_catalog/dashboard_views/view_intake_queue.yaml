# Intake Queue Dashboard View
# Upload files to the model queue, verify uploads, and manage cleanup

title: Intake Queue
path: intake-queue
icon: mdi:upload
panel: false

cards:
  # Header and description
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          # Intake Queue
          Upload files and folders to the model catalog, verify imports, and manage cleanup.

  # Source mode and settings
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          ## Source Configuration
          Configure upload source and cleanup behavior.

      - type: horizontal-stack
        cards:
          - type: entities
            title: Source Mode
            entities:
              - entity: input_select.intake_source_mode
                header: "Select Source"

          - type: entities
            title: Cleanup Policy
            entities:
              - entity: input_select.intake_cleanup_policy
                header: "After Upload"

  # File browser (filesystem)
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          ## File Browser
          Browse your filesystem to select files for upload.

      - type: custom:intake-browser-card
        entity: input_text.intake_browse_path
        sidecar_base_url: "http://localhost:8314"

      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: Browse
            icon: mdi:folder-open
            tap_action:
              action: call-service
              service: homeassistant.reload_core_config
              data: {}
            styles:
              card:
                - background-color: '#1976D2'

          - type: custom:button-card
            name: Upload
            icon: mdi:upload
            tap_action:
              action: call-service
              service: model_catalog.upload_to_queue
              data:
                source_type: browser
                source_path: "{{ states('input_text.intake_browse_path') }}"
                entry_type: file
                cleanup_policy: "{{ states('input_select.intake_cleanup_policy') }}"
            styles:
              card:
                - background-color: '#388E3C'

  # Server browse (Manyfold)
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          ## Manyfold Server
          Browse your Manyfold server to upload models directly.

      - type: markdown
        content: |
          **Server Upload**
          - Import models from your Manyfold server
          - Direct streaming for large files
          - Automatic enrichment with source metadata

      - type: custom:button-card
        name: Browse Manyfold
        icon: mdi:cloud-search
        styles:
          card:
            - background-color: '#7B1FA2'

  # Queue status
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          ## Queue Status
          Monitor active uploads and verification progress.

      - type: markdown
        content: |
          **Upload Status Sensors**
          - Pending uploads
          - Currently uploading
          - Verified and ready
          - Failed uploads

      - type: custom:button-card
        name: Verify and Cleanup
        icon: mdi:check-circle
        tap_action:
          action: call-service
          service: model_catalog.verify_and_cleanup
          data:
            force_cleanup: false
            keep_failed: false
        styles:
          card:
            - background-color: '#D32F2F'
