title: Model Catalog
path: model-catalog
icon: mdi:bookshelf
panel: true
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          # Model Catalog

          Top-level dashboard tabs stay visible here. Use the local workspace nav below to move between Curated, Working, Intake, Job History, and the launch pad.
      - type: grid
        columns: 5
        square: false
        cards:
          - type: custom:button-card
            entity: input_select.model_catalog_workspace_view
            name: Launch Pad
            icon: mdi:view-dashboard-outline
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.model_catalog_workspace_view
                option: home
            styles:
              card:
                - padding: 14px 12px
                - border-radius: 18px
              name:
                - font-size: 14px
                - font-weight: 700
            state:
              - value: home
                styles:
                  card:
                    - background: rgba(30, 64, 175, 0.18)
                    - border: 1px solid rgba(96, 165, 250, 0.42)
          - type: custom:button-card
            entity: input_select.model_catalog_workspace_view
            name: Curated
            icon: mdi:bookshelf
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.model_catalog_workspace_view
                option: curated
            styles:
              card:
                - padding: 14px 12px
                - border-radius: 18px
              name:
                - font-size: 14px
                - font-weight: 700
            state:
              - value: curated
                styles:
                  card:
                    - background: rgba(30, 64, 175, 0.18)
                    - border: 1px solid rgba(96, 165, 250, 0.42)
          - type: custom:button-card
            entity: input_select.model_catalog_workspace_view
            name: Working
            icon: mdi:briefcase-outline
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.model_catalog_workspace_view
                option: working
            styles:
              card:
                - padding: 14px 12px
                - border-radius: 18px
              name:
                - font-size: 14px
                - font-weight: 700
            state:
              - value: working
                styles:
                  card:
                    - background: rgba(30, 64, 175, 0.18)
                    - border: 1px solid rgba(96, 165, 250, 0.42)
          - type: custom:button-card
            entity: input_select.model_catalog_workspace_view
            name: Intake
            icon: mdi:upload-outline
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.model_catalog_workspace_view
                option: intake
            styles:
              card:
                - padding: 14px 12px
                - border-radius: 18px
              name:
                - font-size: 14px
                - font-weight: 700
            state:
              - value: intake
                styles:
                  card:
                    - background: rgba(30, 64, 175, 0.18)
                    - border: 1px solid rgba(96, 165, 250, 0.42)
          - type: custom:button-card
            entity: input_select.model_catalog_workspace_view
            name: Job History
            icon: mdi:history
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.model_catalog_workspace_view
                option: inbox
            styles:
              card:
                - padding: 14px 12px
                - border-radius: 18px
              name:
                - font-size: 14px
                - font-weight: 700
            state:
              - value: inbox
                styles:
                  card:
                    - background: rgba(30, 64, 175, 0.18)
                    - border: 1px solid rgba(96, 165, 250, 0.42)
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: home
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |
                **Workspace overview**

                Keep the 3D Printing dashboard tabs visible while switching between the Model Catalog work areas below.
            - type: grid
              columns: 2
              square: false
              cards:
                - type: custom:button-card
                  name: Curated
                  icon: mdi:bookshelf
                  show_label: true
                  label: Browse the catalog without leaving the main dashboard view.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: curated
                  styles:
                    card:
                      - padding: 18px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Working
                  icon: mdi:briefcase-outline
                  show_label: true
                  label: Explore working files and group review while keeping top-level navigation visible.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: working
                  styles:
                    card:
                      - padding: 18px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Intake
                  icon: mdi:upload-outline
                  show_label: true
                  label: Run intake discovery and import tools in the same Model Catalog workspace.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: intake
                  styles:
                    card:
                      - padding: 18px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Job History
                  icon: mdi:history
                  show_label: true
                  label: Review completed intake outcomes and jump back into Working or Curated from the shared workspace shell.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: inbox
                  styles:
                    card:
                      - padding: 18px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
            - type: markdown
              content: |
                **Workspace shell**

                - The Model Catalog launcher now stays inside the main 3D Printing dashboard.
                - Use the workspace nav above to jump between sections at any time.
                - Other top-level dashboard tabs remain available throughout.
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: curated
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |
                ## Catalog

                Browse the curated authority without leaving the main dashboard shell.
            - type: custom:model-catalog-browser-card
              title: Catalog Browser
              per_page: 12
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: working
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |
                ## Working

                Inspect working files and manage group candidates inside the shared workspace shell.
            - type: custom:model-catalog-working-files-explorer-card
              title: Working Files
              per_page: 200
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: intake
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |
                ## Intake

                Queue intake work here, then jump to Job History from the local workspace controls.
            - type: custom:model-catalog-intake-home-card
              title: Model Catalog Intake
              sectionEntity: input_select.model_catalog_workspace_view
              inboxSection: inbox
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: inbox
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |
                ## Job History

                Review completed intake outcomes here. Active Queue remains a background/admin path, while this view is the primary operator outcome surface.
            - type: custom:model-catalog-inbox-review-card
              title: Job History
              defaultView: job_history
              historyOnly: true
              sectionEntity: input_select.model_catalog_workspace_view
              workingSection: working
              curatedSection: curated
