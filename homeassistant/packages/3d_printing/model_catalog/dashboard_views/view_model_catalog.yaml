            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: none
            hold_action:
              action: none
            styles:
              card:
                - padding: 0
                - margin: 0
                - border-radius: 0
                - border: none
                - border-bottom: 1px solid rgba(148, 163, 184, 0.22)
                - background: transparent
                - box-shadow: none
                - min-height: 48px
                - height: 48px
                - width: 100%
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: home
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |
                **Workspace overview**

                Keep the 3D Printing dashboard tabs visible while switching between the Model Catalog work areas below.
            - type: grid
              columns: 2
              square: false
              cards:
                - type: custom:button-card
                  name: Curated
                  icon: mdi:bookshelf
                  show_label: true
                  label: Browse the catalog without leaving the main dashboard view.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: curated
                  styles:
                    card:
                      - padding: 18px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Working
                  icon: mdi:briefcase-outline
                  show_label: true
                  label: Explore working files and group review while keeping top-level navigation visible.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: working
                  styles:
                    card:
                      - padding: 18px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Intake
                  icon: mdi:upload-outline
                  show_label: true
                  label: Run intake discovery and import tools in the same Model Catalog workspace.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: intake
                  styles:
                    card:
                      - padding: 18px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Job History
                  icon: mdi:history
                  show_label: true
                  label: Review completed intake outcomes and jump back into Working or Curated from the shared workspace shell.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: inbox
                  styles:
                    card:
                      - padding: 18px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
            - type: markdown
              content: |
                **Workspace shell**

                - The Model Catalog launcher now stays inside the main 3D Printing dashboard.
                - Use the workspace nav above to jump between sections at any time.
                - Other top-level dashboard tabs remain available throughout.
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: curated
        card:
          type: vertical-stack
          cards:
            - type: custom:model-catalog-browser-card
              title: Catalog Browser
              per_page: 12
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: working
        card:
          type: vertical-stack
          cards:
            - type: custom:model-catalog-working-files-explorer-card
              title: Working Files
              per_page: 200
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: intake
        card:
          type: vertical-stack
          cards:
            - type: custom:model-catalog-intake-home-card
              title: Model Catalog Intake
              sectionEntity: input_select.model_catalog_workspace_view
              inboxSection: inbox
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: inbox
        card:
          type: vertical-stack
          cards:
            - type: custom:model-catalog-inbox-review-card
              title: Job History
              defaultView: job_history
              historyOnly: true
              sectionEntity: input_select.model_catalog_workspace_view
              workingSection: working
              curatedSection: curated
