            entity: input_select.model_catalog_db_profile_target
            name: DB
            icon: mdi:database
            show_name: true
            show_state: true
            show_icon: true
            size: 18px
            tap_action:
              action: more-info
            hold_action:
              action: none
            styles:
              card:
                - padding: 8px 12px
                - border-radius: 999px
                - border: 1px solid rgba(125, 125, 125, 0.35)
                - background: rgba(96, 165, 250, 0.12)
                - box-shadow: none
                - height: 36px
                - min-height: 36px
                - margin: 6px 8px 6px auto
                - width: max-content
                - flex: 0 0 auto
              grid:
                - grid-template-areas: '"i n s"'
                - grid-template-columns: 18px min-content min-content
                - column-gap: 6px
                - align-items: center
              name:
                - font-size: 11px
                - font-weight: 700
                - color: var(--secondary-text-color)
                - justify-self: start
              state:
                - font-size: 12px
                - font-weight: 700
                - text-transform: uppercase
                - color: var(--primary-text-color)
                - justify-self: start
              img_cell:
                - width: 18px
                - height: 18px
                - position: relative
                - align-self: center
                - justify-self: center
              icon:
                - width: 18px
                - height: 18px
                - color: var(--primary-color)
            state:
              - value: prod
                styles:
                  card:
                    - background: rgba(59, 130, 246, 0.15)
              - value: test
                styles:
                  card:
                    - background: rgba(245, 158, 11, 0.18)
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: home
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |
                <div style="padding:0 14px;">

                **Workspace overview**

                Keep the 3D Printing dashboard tabs visible while switching between the Model Catalog work areas below.

                </div>
            - type: grid
              columns: 2
              square: false
              cards:
                - type: custom:button-card
                  name: Catalog
                  icon: mdi:cube-outline
                  show_label: true
                  label: Browse the catalog without leaving the main dashboard view.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: curated
                  styles:
                    card:
                      - padding: 18px
                      - margin: 0 10px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Working Files
                  icon: mdi:briefcase-outline
                  show_label: true
                  label: Explore working files and group review while keeping top-level navigation visible.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: working
                  styles:
                    card:
                      - padding: 18px
                      - margin: 0 10px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Intake
                  icon: mdi:upload-outline
                  show_label: true
                  label: Run intake discovery and import tools in the same Model Catalog workspace.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: intake
                  styles:
                    card:
                      - padding: 18px
                      - margin: 0 10px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
                - type: custom:button-card
                  name: Queue Review
                  icon: mdi:history
                  show_label: true
                  label: Review active queue items, complete publish decisions, and inspect finished outcomes from the shared workspace shell.
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    service_data:
                      entity_id: input_select.model_catalog_workspace_view
                      option: inbox
                  styles:
                    card:
                      - padding: 18px
                      - margin: 0 10px
                      - border-radius: 20px
                      - text-align: left
                    name:
                      - justify-self: start
                      - font-size: 18px
                      - font-weight: 700
                    label:
                      - justify-self: start
                      - white-space: normal
                      - color: var(--secondary-text-color)
            - type: markdown
              content: |
                <div style="padding:0 14px;">

                **Workspace shell**

                - The Model Catalog launcher now stays inside the main 3D Printing dashboard.
                - Use the workspace nav above to jump between sections at any time.
                - Other top-level dashboard tabs remain available throughout.

                </div>
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: curated
        card:
          type: vertical-stack
          cards:
            - type: custom:model-catalog-browser-card
              title: Catalog Browser
              per_page: 12
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: working
        card:
          type: vertical-stack
          cards:
            - type: custom:model-catalog-working-files-explorer-card
              title: Working Files
              per_page: 200
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: intake
        card:
          type: vertical-stack
          cards:
            - type: custom:model-catalog-intake-home-card
              title: Model Catalog Intake
              sectionEntity: input_select.model_catalog_workspace_view
              inboxSection: inbox
      - type: conditional
        conditions:
          - entity: input_select.model_catalog_workspace_view
            state: inbox
        card:
          type: vertical-stack
          cards:
            - type: custom:model-catalog-inbox-review-card
              title: Queue Review
              defaultView: active_queue
              sectionEntity: input_select.model_catalog_workspace_view
              workingSection: working
              curatedSection: curated
