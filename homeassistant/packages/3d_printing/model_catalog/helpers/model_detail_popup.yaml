# Model Catalog Detail Popup Support Helpers
# These helpers support opening the model detail popup from the model catalog browser

# Helper to store the model reference for the detail popup
input_text:
  model_catalog_detail_ref:
    name: Model Catalog Detail Reference
    icon: mdi:package-variant
    unit_of_measurement: ""

# Helper to store the model sidecar URL for the popup
input_text:
  model_catalog_sidecar_url:
    name: Model Catalog Sidecar URL
    icon: mdi:server
    initial: "http://localhost:8314"
