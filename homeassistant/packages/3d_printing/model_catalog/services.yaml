homeassistant:
  services:
    model_catalog.update_model:
      name: Update Model
      description: Update model metadata and enrichment fields
      fields:
        model_ref:
          name: Model Reference
          description: Model reference (public_id or model_id)
          required: true
          example: "gridfinity-bin"
        model_name:
          name: Model Name
          description: Model display name
          example: "Gridfinity Bin"
        description:
          name: Description
          description: Model description
          example: "A parametric binning system"
        tags:
          name: Tags
          description: Comma-separated tags
          example: "organization, storage, 3d-printing"
        collection:
          name: Collection
          description: Collection ID or name
          example: "my-collection"
        enrichment:
          name: Enrichment Fields
          description: Enrichment data (print time, support type, difficulty, notes)
          example:
            print_time_estimate: 3600
            support_type_hint: "tree"
            difficulty_level: "beginner"
            print_notes: "Print with support"

    model_catalog.upload_photo:
      name: Upload Model Photo
      description: Upload a photo to a model
      fields:
        model_ref:
          name: Model Reference
          description: Model reference (public_id or model_id)
          required: true
          example: "gridfinity-bin"
        photo_file:
          name: Photo File
          description: Base64-encoded photo data or file path
          required: true
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRg..."
        set_as_preview:
          name: Set as Preview
          description: Set this photo as the model preview/thumbnail
          default: false
          example: true

    model_catalog.navigate_to_model:
      name: Navigate to Model Detail
      description: Open model detail popup in Home Assistant
      fields:
        model_ref:
          name: Model Reference
          description: Model reference (public_id or model_id)
          required: true
          example: "gridfinity-bin"
        source:
          name: Navigation Source
          description: Where navigation originated (for logging)
          example: "archive_detail"

    model_catalog.queue_model_for_print:
      name: Queue Model for Print
      description: Add model to print queue
      fields:
        model_ref:
          name: Model Reference
          description: Model reference (public_id or model_id)
          required: true
          example: "gridfinity-bin"
        file_id:
          name: File ID
          description: Specific file to print (optional)
          example: "gridfinity-bin.stl"
        settings:
          name: Print Settings
          description: Print settings override (optional)
          example:
            bed_temp: 60
            nozzle_temp: 210

    model_catalog.bulk_discover_working_groups:
      name: Bulk Discover Working Groups
      description: Scan a folder and propose working groups without committing writes
      fields:
        folder_path:
          name: Folder Path
          description: Root folder path to scan
          required: true
          example: "D:/3D Printing"
        grouping_strategy:
          name: Grouping Strategy
          description: Grouping mode (by-folder, by-root, flat)
          example: "by-folder"
        max_depth:
          name: Max Depth
          description: Optional maximum folder depth to scan
          example: 3

    model_catalog.bulk_import_working_groups:
      name: Bulk Import Working Groups
      description: Import reviewed bulk-discovery proposals into working groups/items
      fields:
        proposals:
          name: Proposals
          description: Reviewed proposal objects with files/actions
          required: true
          example:
            - proposal_id: "tools"
              title: "Tools"
              action: "import"
              files:
                - path: "D:/3D Printing/Tools/pliers.3mf"
        source_folder:
          name: Source Folder
          description: Original folder used for discovery
          example: "D:/3D Printing"
        grouping_strategy:
          name: Grouping Strategy
          description: Grouping mode used during discovery
          example: "by-folder"
        discovery_timestamp:
          name: Discovery Timestamp
          description: Timestamp captured during discovery
          example: "2026-04-26T12:00:00Z"
        stage:
          name: Stage
          description: Default stage for newly created working groups
          example: "draft"

    model_catalog.upload_to_queue:
      name: Upload to Queue
      description: Upload files or folders to the intake queue for verification
      fields:
        source_type:
          name: Source Type
          description: "Source mode: 'browser' (filesystem), 'server' (Manyfold), or 'mixed' (both)"
          required: true
          example: "browser"
        source_path:
          name: Source Path
          description: Path to upload (filesystem path for browser mode, model URL for server mode)
          required: true
          example: "/models/gridfinity-bin"
        entry_type:
          name: Entry Type
          description: "Type of entry: 'file' for single file, 'folder' for directory"
          required: true
          example: "file"
        cleanup_policy:
          name: Cleanup Policy
          description: "How to handle source after upload: 'keep', 'delete_on_verified', 'replace_with_stub'"
          example: "keep"
        tags:
          name: Tags
          description: Comma-separated tags to apply to uploaded files
          example: "gridfinity, organization"
        notes:
          name: Notes
          description: Optional user notes for the upload batch
          example: "Bulk upload from workspace"

    model_catalog.verify_and_cleanup:
      name: Verify and Cleanup Queue
      description: Verify uploaded files and apply cleanup policy
      fields:
        upload_ids:
          name: Upload IDs
          description: List of upload IDs to verify (optional; if empty, verify all pending)
          example: ["upload-001", "upload-002"]
        force_cleanup:
          name: Force Cleanup
          description: Force cleanup of all pending uploads regardless of verification status
          default: false
          example: false
        keep_failed:
          name: Keep Failed Uploads
          description: Keep uploaded files even if verification fails
          default: false
          example: false
