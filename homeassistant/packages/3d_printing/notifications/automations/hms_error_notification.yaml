# Docs: docs/features/notifications/README.md
# Notify on HMS hardware/firmware errors via mobile push, persistent notification,
# and optional TTS — using the same delivery helpers as the other print notifications.
- alias: "HMS Error Notification with Snapshot"
  id: hms_error_notification_with_snapshot
  description: >
    Sends a notification with camera snapshot when the printer reports one or more
    HMS errors (filament runout, cutter jam, fan fault, etc.).
    Critical/serious errors use critical push interruption and always-on TTS.
  triggers:
    - entity_id: binary_sensor.hms_alert_display_wrapper
      to: "on"
      trigger: state

  conditions:
    - condition: state
      entity_id: input_boolean.3dprinter_notifications_enabled
      state: "on"
    # Only notify on real printer errors, not test-mode scenarios
    - condition: template
      value_template: >-
        {{ state_attr('binary_sensor.hms_alert_display_wrapper', 'source') == 'real' }}

  actions:
    - variables:
        printer_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_printer_name') }}"
        task_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}"
        print_status: "{{ states('sensor.ntk_ryansoffice_3dprinter_print_status') }}"
        camera_entity: "camera.ntk_ryansoffice_3dprinter_camera"
        snapshot_light: "{{ states('input_text.3dprinter_snapshot_light') }}"
        notification_service: "{{ states('input_text.3dprinter_notification_service') }}"
        snapshot_filename: "{{ now().strftime('%Y%m%d_%H%M%S') }}_HMS_ERROR.jpg"
        error_count: >-
          {{ state_attr('binary_sensor.hms_alert_display_wrapper', 'Count') | int(0) }}
        timestamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

    # Determine worst severity across all reported errors
    - variables:
        worst_severity: >-
          {% set sevs = [] %}
          {% for i in range(1, error_count + 1) %}
            {% set s = state_attr('binary_sensor.hms_alert_display_wrapper',
                        i ~ '-Severity') | default('unknown') %}
            {% set sevs = sevs + [s] %}
          {% endfor %}
          {% if 'critical' in sevs %}critical
          {% elif 'serious' in sevs %}serious
          {% elif 'medium' in sevs %}medium
          {% elif 'minor' in sevs %}minor
          {% else %}unknown{% endif %}
        is_urgent: "{{ worst_severity in ['critical', 'serious'] }}"

    # Build a summary of all HMS errors for the notification body
    - variables:
        error_summary: >-
          {% for i in range(1, error_count + 1) %}
          {{ i }}. [{{ state_attr('binary_sensor.hms_alert_display_wrapper', i ~ '-Severity') | upper }}] {{ state_attr('binary_sensor.hms_alert_display_wrapper', i ~ '-Code') }} — {{ state_attr('binary_sensor.hms_alert_display_wrapper', i ~ '-Error') }}
          {% set w = state_attr('binary_sensor.hms_alert_display_wrapper', i ~ '-Wiki') %}
          {% if w %}   Troubleshoot: {{ w }}
          {% endif %}
          {% endfor %}

    # Turn on snapshot light if configured
    - if:
        - condition: template
          value_template: "{{ snapshot_light != '' and snapshot_light != 'unavailable' }}"
      then:
        - action: light.turn_on
          target:
            entity_id: "{{ snapshot_light }}"
          data:
            brightness_pct: "{{ states('input_number.3dprinter_snapshot_light_brightness') | int }}"
        - delay:
            seconds: 1

    # Capture camera snapshot
    - action: camera.snapshot
      target:
        entity_id: "{{ camera_entity }}"
      data:
        filename: "/config/www/printer_snapshots/{{ snapshot_filename }}"

    # Restore light state
    - if:
        - condition: template
          value_template: "{{ snapshot_light != '' and snapshot_light != 'unavailable' }}"
      then:
        - delay:
            seconds: 1
        - action: light.turn_off
          target:
            entity_id: "{{ snapshot_light }}"

    # Send mobile notification with snapshot
    - action: "{{ notification_service }}"
      data:
        title: >-
          {% if worst_severity == 'critical' %}🔴 Critical HMS Error
          {% elif worst_severity == 'serious' %}🟠 Serious HMS Error
          {% elif worst_severity == 'medium' %}🟡 HMS Warning
          {% else %}⚪ HMS Notice{% endif %}
        message: >-
          {{ printer_name }} reported {{ error_count }} HMS error{{ 's' if error_count > 1 }}
          (worst: {{ worst_severity }})

          {{ error_summary }}
        data:
          image: "/local/printer_snapshots/{{ snapshot_filename }}"
          push:
            interruption-level: "{{ 'critical' if is_urgent else 'active' }}"
          actions:
            - action: "URI"
              title: "View Printer"
              uri: "/lovelace/3d-printing"

    # Create persistent notification for critical/serious
    - if:
        - condition: template
          value_template: "{{ is_urgent }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: "hms_error_{{ now().timestamp() | int }}"
            title: >-
              {% if worst_severity == 'critical' %}🔴 Critical HMS Error{% else %}🟠 Serious HMS Error{% endif %}
            message: >
              **{{ printer_name }} — {{ error_count }} HMS error{{ 's' if error_count > 1 }}**

              {{ error_summary }}

              Task: {{ task_name }}
              Status: {{ print_status }}
              Time: {{ timestamp }}

              ![Printer Snapshot](/local/printer_snapshots/{{ snapshot_filename }})

    # Log to logbook
    - action: logbook.log
      data:
        name: HMS Error Notification
        message: >-
          Sent {{ worst_severity }} HMS notification — {{ error_count }} error{{ 's' if error_count > 1 }}.

    # TTS announcement — always for critical/serious, respect quiet hours otherwise
    - if:
        - condition: state
          entity_id: input_boolean.3dprinter_tts_enabled
          state: "on"
        - condition: template
          value_template: "{{ states('input_text.3dprinter_tts_media_player') != '' }}"
        - condition: or
          conditions:
            # Always announce critical/serious
            - condition: template
              value_template: "{{ is_urgent }}"
            # For medium/minor, respect quiet hours
            - condition: template
              value_template: >-
                {% set now_time = now().strftime('%H:%M:%S') %}
                {% set quiet_start = states('input_datetime.3dprinter_quiet_hours_start') %}
                {% set quiet_end = states('input_datetime.3dprinter_quiet_hours_end') %}
                {% if quiet_start > quiet_end %}
                  {{ not (now_time >= quiet_start or now_time < quiet_end) }}
                {% else %}
                  {{ not (now_time >= quiet_start and now_time < quiet_end) }}
                {% endif %}
      then:
        - action: tts.speak
          target:
            entity_id: "{{ states('input_text.3dprinter_tts_media_player') }}"
          data:
            message: >-
              Attention! {{ printer_name }} has {{ error_count }} H M S
              error{{ 's' if error_count > 1 }}. Worst severity is {{ worst_severity }}.
            options:
              volume_level: "{{ states('input_number.3dprinter_tts_volume') | float / 100 }}"

  mode: queued
  max: 5
