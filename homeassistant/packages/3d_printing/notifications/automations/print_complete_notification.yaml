# Docs: docs/features/notifications/README.md
- alias: Print Complete - Notification with Snapshot
  id: print_complete_notification_with_snapshot
  description: >
    Sends a notification with camera snapshot when a print completes successfully.
    Optionally enables a light for better photo quality and supports TTS announcements.
  triggers:
    - device_id: 210dfdfa64085e8cf073e50eae757d90
      domain: bambu_lab
      type: event_print_finished
      trigger: device

  conditions:
    - condition: state
      entity_id: input_boolean.3dprinter_notifications_enabled
      state: "on"

  actions:
    - variables:
        printer_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_printer_name') }}"
        task_name: "{{ states('sensor.ntk_ryansoffice_3dprinter_task_name') }}"
        print_weight: "{{ states('sensor.ntk_ryansoffice_3dprinter_print_weight') }}"
        camera_entity: "camera.ntk_ryansoffice_3dprinter_camera"
        snapshot_light: "{{ states('input_text.3dprinter_snapshot_light') }}"
        success_message_template: "{{ states('input_text.3dprinter_success_message') }}"
        snapshot_filename: "{{ now().strftime('%Y%m%d_%H%M%S') }}_{{ task_name | replace(' ', '_') }}.jpg"

    # Turn on snapshot light if configured
    - if:
        - condition: template
          value_template: "{{ snapshot_light != '' and snapshot_light != 'unavailable' }}"
      then:
        - action: light.turn_on
          target:
            entity_id: "{{ snapshot_light }}"
          data:
            brightness_pct: "{{ states('input_number.3dprinter_snapshot_light_brightness') | int }}"

        # Wait for light to reach full brightness
        - delay:
            seconds: 1

    # Capture camera snapshot
    - action: camera.snapshot
      target:
        entity_id: "{{ camera_entity }}"
      data:
        filename: "/config/www/printer_snapshots/{{ snapshot_filename }}"

    # Restore light state if it was turned on
    - if:
        - condition: template
          value_template: "{{ snapshot_light != '' and snapshot_light != 'unavailable' }}"
      then:
        - delay:
            seconds: 1
        - action: light.turn_off
          target:
            entity_id: "{{ snapshot_light }}"

    # Build notification message with template support
    - variables:
        notification_message: >
          {% set msg = success_message_template %}
          {% set msg = msg | replace('{{printer_name}}', printer_name) %}
          {% set msg = msg | replace('{{task_name}}', task_name) %}
          {% set msg = msg | replace('{{print_weight}}', print_weight) %}
          {{ msg }}

    # Send mobile notification with snapshot to Ryan's devices
    - action: notify.mobile_app_ryphone16
      data:
        title: "Print Complete ✓"
        message: "{{ notification_message }}"
        data:
          url: "/lovelace/3d-printing"
          clickAction: "/lovelace/3d-printing"
          image: "/local/printer_snapshots/{{ snapshot_filename }}"
          push:
            interruption-level: "{{ 'critical' if is_state('input_boolean.3dprinter_critical_notifications', 'on') else 'active' }}"
          actions:
            - action: "URI"
              title: "View Printer"
              uri: "/lovelace/3d-printing"

    - action: notify.mobile_app_rypad10
      data:
        title: "Print Complete ✓"
        message: "{{ notification_message }}"
        data:
          url: "/lovelace/3d-printing"
          clickAction: "/lovelace/3d-printing"
          image: "/local/printer_snapshots/{{ snapshot_filename }}"
          push:
            interruption-level: "{{ 'critical' if is_state('input_boolean.3dprinter_critical_notifications', 'on') else 'active' }}"
          actions:
            - action: "URI"
              title: "View Printer"
              uri: "/lovelace/3d-printing"

    # Log completion
    - action: logbook.log
      data:
        name: Print Notification
        message: "Sent completion notification for {{ task_name }}. Weight: {{ print_weight }}g"

    # TTS announcement if enabled and not in quiet hours
    - if:
        - condition: state
          entity_id: input_boolean.3dprinter_tts_enabled
          state: "on"
        - condition: template
          value_template: >
            {% set now_time = now().time() %}
            {% set quiet_start_seconds = state_attr('input_datetime.3dprinter_quiet_hours_start', 'timestamp') | int %}
            {% set quiet_end_seconds = state_attr('input_datetime.3dprinter_quiet_hours_end', 'timestamp') | int %}
            {% set current_seconds = now_time.hour * 3600 + now_time.minute * 60 + now_time.second %}
            {% if quiet_start_seconds < quiet_end_seconds %}
              {{ current_seconds < quiet_start_seconds or current_seconds > quiet_end_seconds }}
            {% else %}
              {{ current_seconds < quiet_start_seconds and current_seconds > quiet_end_seconds }}
            {% endif %}
        - condition: template
          value_template: "{{ states('input_text.3dprinter_tts_media_player') != '' }}"
      then:
        - action: tts.speak
          target:
            entity_id: "{{ states('input_text.3dprinter_tts_media_player') }}"
          data:
            message: "{{ notification_message }}"
            options:
              volume_level: "{{ states('input_number.3dprinter_tts_volume') | float / 100 }}"

  mode: single
