- trigger:
    - platform: state
      entity_id:
        - sensor.filament_catalog_metrics
  sensor:
    - name: Filament Catalog Alert Low Stock
      unique_id: filament_catalog_alert_low_stock
      icon: mdi:archive-alert-outline
      unit_of_measurement: spools
      state: >-
        {% set raw = state_attr('sensor.filament_catalog_metrics', 'alert_counts_json') %}
        {% set obj = raw if raw is mapping else (raw | default('{}', true) | from_json) %}
        {{ obj.get('low_stock', 0) | int(0) }}
    - name: Filament Catalog Alert Nearly Empty
      unique_id: filament_catalog_alert_nearly_empty
