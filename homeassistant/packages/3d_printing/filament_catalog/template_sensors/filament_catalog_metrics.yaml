            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set remaining = a.get('remaining_weight', 0) | float(0) -%}
              {%- set initial = a.get('initial_weight', 0) | float(0) -%}
              {%- set price = (a.get('price', 0) or a.get('filament_price', 0)) | float(0) -%}
              {%- if initial > 0 and price > 0 and remaining > 0 -%}
                {%- set ns.value = ns.value + ((remaining / initial) * price) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.value | round(2) }}
        avg_cost_per_kg: >-
          {%- set ns = namespace(total=0, count=0) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set price = (a.get('price', 0) or a.get('filament_price', 0)) | float(0) -%}
              {%- set initial = a.get('initial_weight', 0) | float(0) -%}
              {%- if price > 0 and initial > 0 -%}
                {%- set ns.total = ns.total + ((price / initial) * 1000) -%}
                {%- set ns.count = ns.count + 1 -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ (ns.total / ns.count) | round(2) if ns.count > 0 else 0 }}
