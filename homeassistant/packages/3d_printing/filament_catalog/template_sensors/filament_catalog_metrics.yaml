- trigger:
    - platform: state
      entity_id:
        - sensor.spoolman_filament_totals
  sensor:
    - name: Filament Catalog Metrics
      unique_id: filament_catalog_metrics
      icon: mdi:chart-box-outline
      state: >-
        {%- set ns = namespace(total=0) -%}
        {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
          {%- set archived_raw = spool.attributes.get('archived', false) -%}
          {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
          {%- if not archived -%}
            {%- set ns.total = ns.total + 1 -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.total }}
      attributes:
        inventory_summary_json: >-
          {%- set summary = namespace(spool_count=0, filament_count=0, total_weight=0.0, priced_cost_total=0.0, priced_spool_count=0) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set summary.spool_count = summary.spool_count + 1 -%}
              {%- set summary.total_weight = summary.total_weight + (spool.attributes.get('remaining_weight', 0) | float(0)) -%}
              {%- set price = (spool.attributes.get('price', spool.attributes.get('filament_price', 0)) or 0) | float(0) -%}
              {%- set initial_weight = spool.attributes.get('initial_weight', 1000) | float(0) -%}
              {%- if price > 0 and initial_weight > 0 -%}
                {%- set summary.priced_cost_total = summary.priced_cost_total + ((price / initial_weight) * 1000) -%}
                {%- set summary.priced_spool_count = summary.priced_spool_count + 1 -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for filament in states.sensor if filament.entity_id is match('^sensor\.spoolman_filament_\d+$') -%}
            {%- set summary.filament_count = summary.filament_count + 1 -%}
          {%- endfor -%}
          {{ {
            'spool_count': summary.spool_count,
            'filament_count': summary.filament_count,
            'total_weight_grams': summary.total_weight | round(1),
            'average_cost_per_kg': ((summary.priced_cost_total / summary.priced_spool_count) | round(2)) if summary.priced_spool_count > 0 else none
          } | tojson }}
        weight_by_material_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set key = spool.attributes.get('filament_material', 'Unknown') | string | trim -%}
              {%- set key = key if key not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set grams = spool.attributes.get('remaining_weight', 0) | float(0) -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | float(0)) + grams}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        weight_by_vendor_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set key = spool.attributes.get('filament_vendor_name', 'Unknown') | string | trim -%}
              {%- set key = key if key not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set grams = spool.attributes.get('remaining_weight', 0) | float(0) -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | float(0)) + grams}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        weight_by_color_family_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set key = spool.attributes.get('filament_extra_color_family', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set key = key if key not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set grams = spool.attributes.get('remaining_weight', 0) | float(0) -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | float(0)) + grams}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        count_by_material_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set key = spool.attributes.get('filament_material', 'Unknown') | string | trim -%}
              {%- set key = key if key not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | int(0)) + 1}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        count_by_vendor_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set key = spool.attributes.get('filament_vendor_name', 'Unknown') | string | trim -%}
              {%- set key = key if key not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | int(0)) + 1}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        count_by_type_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set raw = spool.attributes.get('filament_extra_type_details', '') | string -%}
              {%- set cleaned = raw | replace('[', '') | replace(']', '') | replace('"', '') -%}
              {%- set flags = namespace(has_type=false) -%}
              {%- for t in cleaned.split(',') -%}
                {%- set key = t | trim -%}
                {%- if key and key not in ['unknown', 'unavailable', 'None', 'none'] -%}
                  {%- set flags.has_type = true -%}
                  {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | int(0)) + 1}) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if not flags.has_type -%}
                {%- set buckets.data = buckets.data | combine({'Unknown': (buckets.data.get('Unknown', 0) | int(0)) + 1}) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        count_by_color_family_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set key = spool.attributes.get('filament_extra_color_family', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set key = key if key not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | int(0)) + 1}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        count_by_spool_type_clip_type_stack_segments_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set spool_type = a.get('extra_spool_type', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set spool_type = spool_type if spool_type not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set clip_type = a.get('extra_clip_type', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set clip_type = clip_type if clip_type not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set key = spool_type ~ '###' ~ clip_type -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | int(0)) + 1}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set segs = namespace(items=[]) -%}
          {%- for key, cnt in buckets.data.items() -%}
            {%- set parts = key.split('###') -%}
            {%- set clip_name = parts[1] | lower -%}
            {%- if clip_name in ['slot insert v2', 'slot insert'] -%}
              {%- set clip_hex = '#42A5F5' -%}
            {%- elif clip_name in ['built-in', 'builtin'] -%}
              {%- set clip_hex = '#66BB6A' -%}
            {%- elif clip_name in ['removable'] -%}
              {%- set clip_hex = '#FFA726' -%}
            {%- elif clip_name in ['unknown', 'none', ''] -%}
              {%- set clip_hex = '#90A4AE' -%}
            {%- else -%}
              {%- set clip_hex = '#AB47BC' -%}
            {%- endif -%}
            {%- set segs.items = segs.items + [{
              'spool_type': parts[0],
              'clip_type': parts[1],
              'count': cnt | int(0),
              'hex': clip_hex
            }] -%}
          {%- endfor -%}
          {{ segs.items | sort(attribute='count', reverse=true) | tojson }}
        count_by_primary_color_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set key = spool.attributes.get('filament_extra_primary_color', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set key = key if key not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | int(0)) + 1}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        primary_color_weight_segments_json: >-
          {%- set names = namespace(weights={}, hexes={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set name = a.get('filament_extra_primary_color', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set name = name if name not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set grams = a.get('remaining_weight', 0) | float(0) -%}
              {%- set hx = a.get('filament_color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- set hx = '#' ~ hx[0:6] if hx | length >= 6 else '#9e9e9e' -%}
              {%- set names.weights = names.weights | combine({name: (names.weights.get(name, 0) | float(0)) + grams}) -%}
              {%- if names.hexes.get(name) in [none, ''] -%}
                {%- set names.hexes = names.hexes | combine({name: hx}) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set segs = namespace(items=[]) -%}
          {%- for name, grams in names.weights.items() -%}
            {%- set segs.items = segs.items + [{
              'name': name,
              'weight': grams | round(1),
              'hex': names.hexes.get(name, '#9e9e9e')
            }] -%}
          {%- endfor -%}
          {{ segs.items | sort(attribute='weight', reverse=true) | tojson }}
        primary_color_count_segments_json: >-
          {%- set names = namespace(counts={}, hexes={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set name = a.get('filament_extra_primary_color', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set name = name if name not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set hx = a.get('filament_color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- set hx = '#' ~ hx[0:6] if hx | length >= 6 else '#9e9e9e' -%}
              {%- set names.counts = names.counts | combine({name: (names.counts.get(name, 0) | int(0)) + 1}) -%}
              {%- if names.hexes.get(name) in [none, ''] -%}
                {%- set names.hexes = names.hexes | combine({name: hx}) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set segs = namespace(items=[]) -%}
          {%- for name, cnt in names.counts.items() -%}
            {%- set segs.items = segs.items + [{
              'name': name,
              'count': cnt | int(0),
              'hex': names.hexes.get(name, '#9e9e9e')
            }] -%}
          {%- endfor -%}
          {{ segs.items | sort(attribute='count', reverse=true) | tojson }}
        primary_color_weight_stack_segments_json: >-
          {%- set stacks = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set primary = a.get('filament_extra_primary_color', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set primary = primary if primary not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set hx_raw = a.get('filament_color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- set hx = '#' ~ hx_raw[0:6] if hx_raw | length >= 6 else '#9e9e9e' -%}
              {%- set filament_name = a.get('filament_name', a.get('friendly_name', spool.name)) | string | replace('"', '') | replace('###', '-') | trim -%}
              {%- set filament_name = filament_name if filament_name not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown Filament' -%}
              {%- set segment_label = filament_name ~ ' (' ~ hx ~ ')' -%}
              {%- set grams = a.get('remaining_weight', 0) | float(0) -%}
              {%- set key = primary ~ '###' ~ segment_label ~ '###' ~ hx -%}
              {%- set stacks.data = stacks.data | combine({key: (stacks.data.get(key, 0) | float(0)) + grams}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set segs = namespace(items=[]) -%}
          {%- for key, grams in stacks.data.items() -%}
            {%- set parts = key.split('###') -%}
            {%- set segs.items = segs.items + [{
              'primary': parts[0],
              'segment_label': parts[1],
              'hex': parts[2],
              'weight': grams | round(1)
            }] -%}
          {%- endfor -%}
          {%- set sorted_segs = segs.items | sort(attribute='weight', reverse=true) -%}
          {{ sorted_segs[:20] | tojson }}
        primary_color_count_stack_segments_json: >-
          {%- set stacks = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set primary = a.get('filament_extra_primary_color', 'Unknown') | string | replace('"', '') | trim -%}
              {%- set primary = primary if primary not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set hx_raw = a.get('filament_color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- set hx = '#' ~ hx_raw[0:6] if hx_raw | length >= 6 else '#9e9e9e' -%}
              {%- set filament_name = a.get('filament_name', a.get('friendly_name', spool.name)) | string | replace('"', '') | replace('###', '-') | trim -%}
              {%- set filament_name = filament_name if filament_name not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown Filament' -%}
              {%- set segment_label = filament_name ~ ' (' ~ hx ~ ')' -%}
              {%- set key = primary ~ '###' ~ segment_label ~ '###' ~ hx -%}
              {%- set stacks.data = stacks.data | combine({key: (stacks.data.get(key, 0) | int(0)) + 1}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set segs = namespace(items=[]) -%}
          {%- for key, cnt in stacks.data.items() -%}
            {%- set parts = key.split('###') -%}
            {%- set segs.items = segs.items + [{
              'primary': parts[0],
              'segment_label': parts[1],
              'hex': parts[2],
              'count': cnt | int(0)
            }] -%}
          {%- endfor -%}
          {%- set sorted_segs = segs.items | sort(attribute='count', reverse=true) -%}
          {{ sorted_segs[:20] | tojson }}
        spools_by_location_json: >-
          {%- set buckets = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set key = spool.attributes.get('location', 'Unknown') | string | trim -%}
              {%- set key = key if key not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown' -%}
              {%- set buckets.data = buckets.data | combine({key: (buckets.data.get(key, 0) | int(0)) + 1}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ buckets.data | tojson }}
        qty_to_order_by_filament_json: >-
          {%- set rows = namespace(items=[]) -%}
          {%- for filament in states.sensor if filament.entity_id is match('^sensor\.spoolman_filament_\d+$') -%}
            {%- set attrs = filament.attributes -%}
            {%- set qty = attrs.get('extra_purchase_qty', 0) | int(0) -%}
            {%- if qty > 0 -%}
              {%- set filament_name = attrs.get('name', filament.name) | string | trim -%}
              {%- set filament_name = filament_name if filament_name not in ['', 'unknown', 'unavailable', 'None', 'none'] else 'Unknown Filament' -%}
              {%- set raw_hex = attrs.get('color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- set hex = '#' ~ raw_hex[0:6] if raw_hex | length >= 6 else '#9e9e9e' -%}
              {%- set rows.items = rows.items + [{
                'name': (hex | upper) ~ ' - ' ~ filament_name,
                'qty': qty,
                'hex': hex
              }] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows.items | sort(attribute='qty', reverse=true) | tojson }}
        alert_counts_json: >-
          {%- set now_ts = as_timestamp(now()) | float(0) -%}
          {%- set stock_threshold = states('input_number.filament_catalog_stock_threshold') | float(150) -%}
          {%- set des_yellow_thresh = states('input_number.desiccant_threshold_yellow_days') | float(45) -%}
          {%- set des_orange_thresh = states('input_number.desiccant_threshold_orange_days') | float(60) -%}
          {%- set des_red_thresh = states('input_number.desiccant_threshold_red_days') | float(75) -%}
          {%- set filament_counts = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set fid = spool.attributes.get('filament_id') -%}
              {%- if fid not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set key = fid | string -%}
                {%- set filament_counts.data = filament_counts.data | combine({key: (filament_counts.data.get(key, 0) | int(0)) + 1}) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set counts = namespace(low_stock=0, nearly_empty=0, needs_repurchase=0, desiccant_overdue=0, desiccant_red=0, desiccant_orange=0, desiccant_yellow=0, desiccant_undefined=0, missing_desiccant=0, needs_drying=0, stale=0, multiple_unsealed_duplicates=0, duplicate_hex_colors=0, missing_uuid=0, tag_uuid_mismatch=0, missing_profile=0) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set remaining = a.get('remaining_weight', 0) | float(0) -%}
              {%- set sealed = a.get('extra_sealed') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- set has_desiccant = a.get('extra_desiccant_in_spool') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- set fid = a.get('filament_id') | string -%}
              {%- set des_raw = a.get('extra_desiccant_filled', '') -%}
              {%- set dry_raw = a.get('extra_last_dried', '') -%}
              {%- set used_raw = a.get('last_used', '') -%}
              {%- set des_has_date = des_raw not in [none, '', 'unknown', 'unavailable'] -%}
              {%- if des_has_date -%}
                {%- set des_ts = as_timestamp(des_raw, 0) | float(0) -%}
                {%- set des_days = ((now_ts - des_ts) / 86400) | float(0) if des_ts > 0 else 0 -%}
              {%- else -%}
                {%- set des_days = 0 -%}
              {%- endif -%}
              {%- if dry_raw not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set dry_ts = as_timestamp(dry_raw, 0) | float(0) -%}
                {%- set dry_days = ((now_ts - dry_ts) / 86400) | float(0) if dry_ts > 0 else 0 -%}
              {%- else -%}
                {%- set dry_days = 0 -%}
              {%- endif -%}
              {%- if used_raw not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set used_ts = as_timestamp(used_raw, 0) | float(0) -%}
                {%- set used_days = ((now_ts - used_ts) / 86400) | float(0) if used_ts > 0 else 99999 -%}
              {%- else -%}
                {%- set used_days = 99999 -%}
              {%- endif -%}
              {%- if remaining < stock_threshold -%}
                {%- set counts.low_stock = counts.low_stock + 1 -%}
              {%- endif -%}
              {%- if remaining < 50 -%}
                {%- set counts.nearly_empty = counts.nearly_empty + 1 -%}
              {%- endif -%}
              {%- if remaining < stock_threshold and (filament_counts.data.get(fid, 0) | int(0)) == 1 -%}
                {%- set counts.needs_repurchase = counts.needs_repurchase + 1 -%}
              {%- endif -%}
              {%- if not sealed -%}
                {%- if des_has_date and des_days > des_red_thresh -%}
                  {%- set counts.desiccant_overdue = counts.desiccant_overdue + 1 -%}
                  {%- set counts.desiccant_red = counts.desiccant_red + 1 -%}
                {%- elif des_has_date and des_days > des_orange_thresh -%}
                  {%- set counts.desiccant_overdue = counts.desiccant_overdue + 1 -%}
                  {%- set counts.desiccant_orange = counts.desiccant_orange + 1 -%}
                {%- elif des_has_date and des_days > des_yellow_thresh -%}
                  {%- set counts.desiccant_overdue = counts.desiccant_overdue + 1 -%}
                  {%- set counts.desiccant_yellow = counts.desiccant_yellow + 1 -%}
                {%- elif not des_has_date -%}
                  {%- set counts.desiccant_undefined = counts.desiccant_undefined + 1 -%}
                {%- endif -%}
              {%- endif -%}
              {%- if not sealed and not has_desiccant -%}
                {%- set counts.missing_desiccant = counts.missing_desiccant + 1 -%}
              {%- endif -%}
              {%- if not sealed and dry_days > 90 -%}
                {%- set counts.needs_drying = counts.needs_drying + 1 -%}
              {%- endif -%}
              {%- if used_days > 180 -%}
                {%- set counts.stale = counts.stale + 1 -%}
              {%- endif -%}
              {%- set vendor = a.get('filament_vendor_name', '') | string -%}
              {%- set is_bambu = vendor == 'Bambu Lab' -%}
              {%- set spool_uuid_raw = a.get('extra_spool_uuid', '') | string | trim | trim('"') -%}
              {%- set has_uuid = spool_uuid_raw not in ['', 'None', 'none', 'unknown', 'unavailable'] and not spool_uuid_raw is match('^0+$') -%}
              {%- set tag_raw = a.get('extra_tag', '') | string | trim | trim('"') -%}
              {%- set has_tag = tag_raw not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
              {%- set profile_raw = a.get('filament_extra_profile_name', '') | string | trim | trim('"') -%}
              {%- set has_profile = profile_raw not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
              {%- if is_bambu and not sealed and not has_uuid -%}
                {%- set counts.missing_uuid = counts.missing_uuid + 1 -%}
              {%- endif -%}
              {%- if (has_tag != has_uuid) or (has_tag and has_uuid and tag_raw != spool_uuid_raw) -%}
                {%- set counts.tag_uuid_mismatch = counts.tag_uuid_mismatch + 1 -%}
              {%- endif -%}
              {%- if is_bambu and not has_profile -%}
                {%- set counts.missing_profile = counts.missing_profile + 1 -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set unsealed_by_filament = namespace(data={}) -%}
          {%- set hex_to_filaments = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set fid = a.get('filament_id') | string -%}
              {%- set sealed = a.get('extra_sealed') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- if not sealed and fid not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
                {%- set existing = unsealed_by_filament.data.get(fid, []) -%}
                {%- set unsealed_by_filament.data = unsealed_by_filament.data | combine({fid: existing + [spool.entity_id]}) -%}
              {%- endif -%}
              {%- set hx = a.get('filament_color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- if hx | length >= 6 and fid not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
                {%- set hex_existing = hex_to_filaments.data.get(hx[0:6], []) -%}
                {%- if fid not in hex_existing -%}
                  {%- set hex_to_filaments.data = hex_to_filaments.data | combine({hx[0:6]: hex_existing + [fid]}) -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for entities in unsealed_by_filament.data.values() -%}
            {%- if entities | count > 1 -%}
              {%- set counts.multiple_unsealed_duplicates = counts.multiple_unsealed_duplicates + 1 -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for filament_ids in hex_to_filaments.data.values() -%}
            {%- if filament_ids | count > 1 -%}
              {%- set counts.duplicate_hex_colors = counts.duplicate_hex_colors + 1 -%}
            {%- endif -%}
          {%- endfor -%}
          {{ {
            'low_stock': counts.low_stock,
            'nearly_empty': counts.nearly_empty,
            'needs_repurchase': counts.needs_repurchase,
            'desiccant_overdue': counts.desiccant_overdue,
            'desiccant_red': counts.desiccant_red,
            'desiccant_orange': counts.desiccant_orange,
            'desiccant_yellow': counts.desiccant_yellow,
            'desiccant_undefined': counts.desiccant_undefined,
            'missing_desiccant': counts.missing_desiccant,
            'needs_drying': counts.needs_drying,
            'stale': counts.stale,
            'multiple_unsealed_duplicates': counts.multiple_unsealed_duplicates,
            'duplicate_hex_colors': counts.duplicate_hex_colors,
            'missing_uuid': counts.missing_uuid,
            'tag_uuid_mismatch': counts.tag_uuid_mismatch,
            'missing_profile': counts.missing_profile
          } | tojson }}
        alert_entity_ids_json: >-
          {%- set now_ts = as_timestamp(now()) | float(0) -%}
          {%- set stock_threshold = states('input_number.filament_catalog_stock_threshold') | float(150) -%}
          {%- set des_yellow_thresh = states('input_number.desiccant_threshold_yellow_days') | float(45) -%}
          {%- set des_orange_thresh = states('input_number.desiccant_threshold_orange_days') | float(60) -%}
          {%- set des_red_thresh = states('input_number.desiccant_threshold_red_days') | float(75) -%}
          {%- set filament_counts = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set archived_raw = spool.attributes.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set fid = spool.attributes.get('filament_id') -%}
              {%- if fid not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set key = fid | string -%}
                {%- set filament_counts.data = filament_counts.data | combine({key: (filament_counts.data.get(key, 0) | int(0)) + 1}) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set ids = namespace(
            low_stock=[], nearly_empty=[], needs_repurchase=[], desiccant_overdue=[], desiccant_red=[],
            desiccant_orange=[], desiccant_yellow=[], desiccant_undefined=[],
            missing_desiccant=[], needs_drying=[], stale=[],
            multiple_unsealed_duplicates=[], duplicate_hex_colors=[],
            missing_uuid=[], tag_uuid_mismatch=[], missing_profile=[]
          ) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set eid = spool.entity_id -%}
              {%- set remaining = a.get('remaining_weight', 0) | float(0) -%}
              {%- set sealed = a.get('extra_sealed') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- set has_desiccant = a.get('extra_desiccant_in_spool') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- set fid = a.get('filament_id') | string -%}
              {%- set des_raw = a.get('extra_desiccant_filled', '') -%}
              {%- set dry_raw = a.get('extra_last_dried', '') -%}
              {%- set used_raw = a.get('last_used', '') -%}
              {%- set des_has_date = des_raw not in [none, '', 'unknown', 'unavailable'] -%}
              {%- if des_has_date -%}
                {%- set des_ts = as_timestamp(des_raw, 0) | float(0) -%}
                {%- set des_days = ((now_ts - des_ts) / 86400) | float(0) if des_ts > 0 else 0 -%}
              {%- else -%}
                {%- set des_days = 0 -%}
              {%- endif -%}
              {%- if dry_raw not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set dry_ts = as_timestamp(dry_raw, 0) | float(0) -%}
                {%- set dry_days = ((now_ts - dry_ts) / 86400) | float(0) if dry_ts > 0 else 0 -%}
              {%- else -%}
                {%- set dry_days = 0 -%}
              {%- endif -%}
              {%- if used_raw not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set used_ts = as_timestamp(used_raw, 0) | float(0) -%}
                {%- set used_days = ((now_ts - used_ts) / 86400) | float(0) if used_ts > 0 else 99999 -%}
              {%- else -%}
                {%- set used_days = 99999 -%}
              {%- endif -%}
              {%- if remaining < stock_threshold -%}{%- set ids.low_stock = ids.low_stock + [eid] -%}{%- endif -%}
              {%- if remaining < 50 -%}{%- set ids.nearly_empty = ids.nearly_empty + [eid] -%}{%- endif -%}
              {%- if remaining < stock_threshold and (filament_counts.data.get(fid, 0) | int(0)) == 1 -%}
                {%- set ids.needs_repurchase = ids.needs_repurchase + [eid] -%}
              {%- endif -%}
              {%- if not sealed -%}
                {%- if des_has_date and des_days > des_red_thresh -%}{%- set ids.desiccant_overdue = ids.desiccant_overdue + [eid] -%}{%- set ids.desiccant_red = ids.desiccant_red + [eid] -%}
                {%- elif des_has_date and des_days > des_orange_thresh -%}{%- set ids.desiccant_overdue = ids.desiccant_overdue + [eid] -%}{%- set ids.desiccant_orange = ids.desiccant_orange + [eid] -%}
                {%- elif des_has_date and des_days > des_yellow_thresh -%}{%- set ids.desiccant_overdue = ids.desiccant_overdue + [eid] -%}{%- set ids.desiccant_yellow = ids.desiccant_yellow + [eid] -%}
                {%- elif not des_has_date -%}{%- set ids.desiccant_undefined = ids.desiccant_undefined + [eid] -%}
                {%- endif -%}
              {%- endif -%}
              {%- if not sealed and not has_desiccant -%}{%- set ids.missing_desiccant = ids.missing_desiccant + [eid] -%}{%- endif -%}
              {%- if not sealed and dry_days > 90 -%}{%- set ids.needs_drying = ids.needs_drying + [eid] -%}{%- endif -%}
              {%- if used_days > 180 -%}{%- set ids.stale = ids.stale + [eid] -%}{%- endif -%}
              {%- set vendor = a.get('filament_vendor_name', '') | string -%}
              {%- set is_bambu = vendor == 'Bambu Lab' -%}
              {%- set spool_uuid_raw = a.get('extra_spool_uuid', '') | string | trim | trim('"') -%}
              {%- set has_uuid = spool_uuid_raw not in ['', 'None', 'none', 'unknown', 'unavailable'] and not spool_uuid_raw is match('^0+$') -%}
              {%- set tag_raw = a.get('extra_tag', '') | string | trim | trim('"') -%}
              {%- set has_tag = tag_raw not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
              {%- set profile_raw = a.get('filament_extra_profile_name', '') | string | trim | trim('"') -%}
              {%- set has_profile = profile_raw not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
              {%- if is_bambu and not sealed and not has_uuid -%}{%- set ids.missing_uuid = ids.missing_uuid + [eid] -%}{%- endif -%}
              {%- if (has_tag != has_uuid) or (has_tag and has_uuid and tag_raw != spool_uuid_raw) -%}{%- set ids.tag_uuid_mismatch = ids.tag_uuid_mismatch + [eid] -%}{%- endif -%}
              {%- if is_bambu and not has_profile -%}{%- set ids.missing_profile = ids.missing_profile + [eid] -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set unsealed_by_filament = namespace(data={}) -%}
          {%- set hex_to_filaments = namespace(data={}) -%}
          {%- set hex_to_entities = namespace(data={}) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\.spoolman_spool_\d+$') -%}
            {%- set a = spool.attributes -%}
            {%- set archived_raw = a.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set fid = a.get('filament_id') | string -%}
              {%- set sealed = a.get('extra_sealed') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- set hx = a.get('filament_color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- if not sealed and fid not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
                {%- set existing = unsealed_by_filament.data.get(fid, []) -%}
                {%- set unsealed_by_filament.data = unsealed_by_filament.data | combine({fid: existing + [spool.entity_id]}) -%}
              {%- endif -%}
              {%- if hx | length >= 6 -%}
                {%- set hex_key = hx[0:6] -%}
                {%- set hex_entities = hex_to_entities.data.get(hex_key, []) -%}
                {%- if spool.entity_id not in hex_entities -%}
                  {%- set hex_to_entities.data = hex_to_entities.data | combine({hex_key: hex_entities + [spool.entity_id]}) -%}
                {%- endif -%}
                {%- if fid not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
                  {%- set hex_filaments = hex_to_filaments.data.get(hex_key, []) -%}
                  {%- if fid not in hex_filaments -%}
                    {%- set hex_to_filaments.data = hex_to_filaments.data | combine({hex_key: hex_filaments + [fid]}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for entities in unsealed_by_filament.data.values() -%}
            {%- if entities | count > 1 -%}
              {%- for dup_eid in entities -%}
                {%- if dup_eid not in ids.multiple_unsealed_duplicates -%}
                  {%- set ids.multiple_unsealed_duplicates = ids.multiple_unsealed_duplicates + [dup_eid] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for hx, filament_ids in hex_to_filaments.data.items() -%}
            {%- if filament_ids | count > 1 -%}
              {%- for dup_eid in hex_to_entities.data.get(hx, []) -%}
                {%- if dup_eid not in ids.duplicate_hex_colors -%}
                  {%- set ids.duplicate_hex_colors = ids.duplicate_hex_colors + [dup_eid] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ {
            'low_stock': ids.low_stock,
            'nearly_empty': ids.nearly_empty,
            'needs_repurchase': ids.needs_repurchase,
            'desiccant_overdue': ids.desiccant_overdue,
            'desiccant_red': ids.desiccant_red,
            'desiccant_orange': ids.desiccant_orange,
            'desiccant_yellow': ids.desiccant_yellow,
            'desiccant_undefined': ids.desiccant_undefined,
            'missing_desiccant': ids.missing_desiccant,
            'needs_drying': ids.needs_drying,
            'stale': ids.stale,
            'multiple_unsealed_duplicates': ids.multiple_unsealed_duplicates,
            'duplicate_hex_colors': ids.duplicate_hex_colors,
            'missing_uuid': ids.missing_uuid,
            'tag_uuid_mismatch': ids.tag_uuid_mismatch,
            'missing_profile': ids.missing_profile
          } | tojson }}
