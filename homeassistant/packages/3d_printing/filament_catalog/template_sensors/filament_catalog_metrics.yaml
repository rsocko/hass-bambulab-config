                'filament_ids': filament_ids
              }] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ {
            'multiple_unsealed_duplicates': multiple_unsealed.items,
            'duplicate_hex_colors': duplicate_hex.items,
            'missing_uuid': dq_missing_uuid.items,
            'tag_uuid_mismatch': dq_tag_uuid_mismatch.items,
