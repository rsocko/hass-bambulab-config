- sensor:
    - name: Filament Catalog Filtered Spools
      unique_id: filament_catalog_filtered_spools
      icon: mdi:filter-variant
      state: >
        {% set ej = state_attr('sensor.filament_catalog_filtered_spools', 'entity_ids_json') | default('[]', true) %}
        {% if ej in [none, '', 'unknown', 'unavailable'] %}
          0
        {% elif ej is string %}
          {{ (ej | from_json) | length }}
        {% elif ej is iterable %}
          {{ ej | list | length }}
        {% else %}
          0
        {% endif %}
      attributes:
        # ================================================================
        # Primary computation: filter, sort, and group all catalog entries.
        # This is intentionally hybrid and server-side:
        # - spool entities for in-stock / historical spool cards
        # - filament entities for zero-spool filament records only
        # Output: list of {name, count, entities} group objects.
        # For non-grouped tabs (All), a single group with name "".
        # ================================================================
        grouped_entity_ids_json: >-
          {%- set spool_entities = states.sensor
            | selectattr('entity_id', 'match', 'sensor\\.spoolman_spool_\\d+$')
            | list -%}
          {%- set filament_entities = states.sensor
            | selectattr('entity_id', 'match', 'sensor\\.spoolman_filament_\\d+$')
            | list -%}
          {%- set filament_inventory_rules = namespace(data={}) -%}
          {%- for filament in filament_entities -%}
            {%- set filament_id = filament.attributes.get('id') -%}
            {%- if filament_id not in [none, '', 'unknown', 'unavailable'] -%}
              {%- set rule = filament.attributes.get('extra_inventory_rule', '') | string | trim -%}
              {%- set filament_inventory_rules.data = filament_inventory_rules.data | combine({(filament_id | string): rule}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set filter_material = states('input_select.filament_catalog_filter_material') -%}
          {%- set filter_vendor = states('input_select.filament_catalog_filter_vendor') -%}
          {%- set filter_color = states('input_select.filament_catalog_filter_color') -%}
          {%- set filter_color_family = states('input_select.filament_catalog_filter_color_family') -%}
          {%- set filter_type = states('input_select.filament_catalog_filter_type') -%}
          {%- set filter_location = states('input_select.filament_catalog_filter_location') -%}
          {%- set filter_spool_type = states('input_select.filament_catalog_filter_spool_type') | default('All', true) -%}
          {%- set filter_clip_type = states('input_select.filament_catalog_filter_clip_type') | default('All', true) -%}
          {%- set filter_inventory_rule = states('input_select.filament_catalog_filter_inventory_rule') | default('All', true) -%}
          {%- set filter_scope = states('input_select.filament_catalog_filter_scope') | default('In-Stock Spools', true) -%}
          {%- set filter_qty_to_purchase = is_state('input_boolean.filament_catalog_filter_qty_to_purchase', 'on') -%}
          {%- set filter_sealed = states('input_select.filament_catalog_filter_sealed') -%}
          {%- set filter_data_quality = states('input_select.filament_catalog_filter_data_quality') | default('All', true) -%}
          {%- set search_text = states('input_text.filament_catalog_search') | lower | trim -%}
          {%- set stock_threshold = states('input_number.filament_catalog_stock_threshold') | float(150) -%}
          {%- set filter_desiccant = states('input_select.filament_catalog_filter_desiccant') | default('All', true) -%}
          {%- set des_yellow_thresh = states('input_number.desiccant_threshold_yellow_days') | float(45) -%}
          {%- set des_orange_thresh = states('input_number.desiccant_threshold_orange_days') | float(60) -%}
          {%- set des_red_thresh = states('input_number.desiccant_threshold_red_days') | float(75) -%}
          {%- set filter_stock_level = states('input_select.filament_catalog_filter_stock_level') -%}
          {%- set filter_nearly_empty = is_state('input_boolean.filament_catalog_filter_nearly_empty', 'on') -%}
          {%- set filter_needs_repurchase = is_state('input_boolean.filament_catalog_filter_needs_repurchase', 'on') -%}
          {%- set filter_needs_drying = is_state('input_boolean.filament_catalog_filter_needs_drying', 'on') -%}
          {%- set filter_stale = is_state('input_boolean.filament_catalog_filter_stale', 'on') -%}
          {%- set filter_missing_desiccant = is_state('input_boolean.filament_catalog_filter_missing_desiccant', 'on') -%}
          {%- set tab = states('input_select.filament_catalog_tab') | default('By Location', true) -%}
          {%- set sort_option = states('input_select.filament_catalog_sort') | default('Name (A-Z)', true) -%}
          {# Phase 2 Optimization: Load pre-computed totals and shortage from helper sensor #}
          {%- set totals_and_shortage_raw = state_attr('sensor.filament_shortage_status', 'totals_and_shortage_json') | default('{}', true) -%}
          {%- if totals_and_shortage_raw is string -%}
            {%- set totals_and_shortage = totals_and_shortage_raw | from_json -%}
          {%- elif totals_and_shortage_raw is mapping -%}
            {%- set totals_and_shortage = totals_and_shortage_raw -%}
          {%- else -%}
            {%- set totals_and_shortage = {} -%}
          {%- endif -%}
          {%- set dq_unsealed_ids = namespace(items=[]) -%}
          {%- set dq_hexes = namespace(items=[]) -%}
          {%- set dq_missing_uuid_ids = namespace(items=[]) -%}
          {%- set dq_tag_uuid_mismatch_ids = namespace(items=[]) -%}
          {%- set dq_missing_profile_ids = namespace(items=[]) -%}
          {%- if filter_data_quality != 'All' -%}
            {%- set quality_raw = state_attr('sensor.filament_catalog_metrics', 'data_quality_json') | default('{}', true) -%}
            {%- if quality_raw is string -%}
              {%- set quality_data = quality_raw | from_json -%}
            {%- elif quality_raw is mapping -%}
              {%- set quality_data = quality_raw -%}
            {%- else -%}
              {%- set quality_data = {} -%}
            {%- endif -%}
            {%- for issue in quality_data.get('multiple_unsealed_duplicates', []) if issue is mapping -%}
              {%- for issue_eid in issue.get('entity_ids', []) -%}
                {%- if issue_eid not in dq_unsealed_ids.items -%}
                  {%- set dq_unsealed_ids.items = dq_unsealed_ids.items + [issue_eid] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- for issue in quality_data.get('duplicate_hex_colors', []) if issue is mapping -%}
              {%- set issue_hex = issue.get('hex', '') | string | replace('#', '') | lower | trim -%}
              {%- if issue_hex | length >= 6 and issue_hex[0:6] not in dq_hexes.items -%}
                {%- set dq_hexes.items = dq_hexes.items + [issue_hex[0:6]] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for issue in quality_data.get('missing_uuid', []) if issue is mapping -%}
              {%- set issue_eid = issue.get('entity_id', '') -%}
              {%- if issue_eid and issue_eid not in dq_missing_uuid_ids.items -%}
                {%- set dq_missing_uuid_ids.items = dq_missing_uuid_ids.items + [issue_eid] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for issue in quality_data.get('tag_uuid_mismatch', []) if issue is mapping -%}
              {%- set issue_eid = issue.get('entity_id', '') -%}
              {%- if issue_eid and issue_eid not in dq_tag_uuid_mismatch_ids.items -%}
                {%- set dq_tag_uuid_mismatch_ids.items = dq_tag_uuid_mismatch_ids.items + [issue_eid] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for issue in quality_data.get('missing_profile', []) if issue is mapping -%}
              {%- set issue_eid = issue.get('entity_id', '') -%}
              {%- if issue_eid and issue_eid not in dq_missing_profile_ids.items -%}
                {%- set dq_missing_profile_ids.items = dq_missing_profile_ids.items + [issue_eid] -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set now_ts = as_timestamp(now()) | float(0) -%}
          {%- set group_attr_map = {'By Location': 'location', 'By Material': 'filament_material', 'By Vendor': 'filament_vendor_name', 'By Filament': 'filament_group_name', 'By Color Family': 'filament_extra_color_family', 'By Hex Color': 'filament_color_hex'} -%}
          {%- set group_attr = group_attr_map.get(tab, '') -%}
          {%- set sort_reverse = sort_option in ['Name (Z-A)', 'Weight (High to Low)', 'Last Used (Recent)', 'Purchase Date (Newest)', 'Desiccant Filled Date (Newest)', 'Qty to Purchase (Descending)', 'Cost (High to Low)'] -%}
          {%- set include_archived_spools = filter_scope == 'Include Archived Spools' -%}
          {%- set filament_summary_mode = filter_scope == 'All Filaments' -%}
          {%- set ns = namespace(matches=[]) -%}

           {# -----------------------------------------------------------------
             Spool-backed catalog entries
             ----------------------------------------------------------------- #}
          {%- for spool in spool_entities -%}
            {%- set attrs = spool.attributes -%}
            {%- set archived_raw = attrs.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if (not filament_summary_mode) and (include_archived_spools or not archived) -%}
              {%- set material = attrs.get('filament_material', '') | string -%}
              {%- set vendor = attrs.get('filament_vendor_name', '') | string -%}
              {%- set friendly_name = attrs.get('friendly_name', spool.name) | string -%}
              {%- set filament_name = attrs.get('filament_name', '') | string -%}
              {%- set filament_display_name = filament_name if filament_name not in ['', 'unknown', 'unavailable', 'None', 'none'] else friendly_name -%}
              {%- set filament_group_parts = namespace(items=[]) -%}
              {%- if vendor not in ['', 'unknown', 'unavailable', 'None', 'none'] -%}
                {%- set filament_group_parts.items = filament_group_parts.items + [vendor] -%}
              {%- endif -%}
              {%- if material not in ['', 'unknown', 'unavailable', 'None', 'none'] -%}
                {%- set filament_group_parts.items = filament_group_parts.items + [material] -%}
              {%- endif -%}
              {%- if filament_display_name not in ['', 'unknown', 'unavailable', 'None', 'none'] and filament_display_name not in filament_group_parts.items -%}
                {%- set filament_group_parts.items = filament_group_parts.items + [filament_display_name] -%}
              {%- endif -%}
              {%- set filament_group_name = filament_group_parts.items | join(' • ') if filament_group_parts.items | count > 0 else 'Unknown' -%}
              {%- set location = attrs.get('location', '') | string -%}
              {%- set primary_color = attrs.get('filament_extra_primary_color', '') | string | replace('"', '') -%}
              {%- set spool_hex = attrs.get('filament_color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- set color_family = attrs.get('filament_extra_color_family', '') | string | replace('"', '') -%}
              {%- set type_details = attrs.get('filament_extra_type_details', '') | string | replace('[', '') | replace(']', '') | replace('"', '') | lower -%}
              {%- set spool_type = attrs.get('extra_spool_type', '') | string | replace('"', '') | trim -%}
              {%- set clip_type = attrs.get('extra_clip_type', '') | string | replace('"', '') | trim -%}
              {%- set clip_type_defined = clip_type not in ['', 'None', 'none', 'unknown', 'unavailable'] -%}
              {%- set remaining_weight = attrs.get('remaining_weight', 0) | float(0) -%}
              {%- set filament_id = attrs.get('filament_id') -%}
              {%- set inventory_rule_source = attrs.get('filament_extra_inventory_rule', '') | string | trim -%}
              {%- if inventory_rule_source in ['', 'None', 'none', 'unknown', 'unavailable'] and filament_id not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set inventory_rule_source = filament_inventory_rules.data.get(filament_id | string, '') | string | trim -%}
              {%- endif -%}
              {%- set inventory_rule_clean = inventory_rule_source | regex_replace('^"|"$', '') | lower -%}
              {%- set inventory_rule_aliases = {
                'not defined': 'Not Defined',
                'keep in stock': 'Keep In Stock',
                'maintain backup spool': 'Maintain Backup Spool',
                'max inventory': 'Max Inventory',
                'as needed': 'As Needed',
                'do not stock': 'Do Not Stock'
              } -%}
              {%- if inventory_rule_clean in ['', 'none', 'null', 'unknown', 'unavailable'] -%}
                {%- set inventory_rule = 'Not Defined' -%}
              {%- else -%}
                {%- set inventory_rule = inventory_rule_aliases.get(inventory_rule_clean, inventory_rule_source | regex_replace('^"|"$', '')) -%}
              {%- endif -%}
              {%- set spool_filled = attrs.get('extra_desiccant_filled', '') -%}
              {%- set purchase_date_raw = attrs.get('extra_purchase_date', '') -%}
              {%- set last_dried_raw = attrs.get('extra_last_dried', '') -%}
              {%- set last_used_raw = attrs.get('last_used', '') -%}
              {%- set has_desiccant = attrs.get('extra_desiccant_in_spool') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- set is_sealed = attrs.get('extra_sealed') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- set purchase_qty = attrs.get('filament_extra_purchase_qty', 0) | int(0) -%}
              {%- set has_qty_to_purchase = purchase_qty > 0 -%}
              {%- set is_low_stock = remaining_weight < stock_threshold -%}
              {%- set is_nearly_empty = remaining_weight < 50 -%}
              {# Phase 2: Look up pre-computed shortage status from helper #}
              {%- set ts_entry = totals_and_shortage.get(filament_id | string, {}) -%}
              {%- set is_rule_shortage = ts_entry.get('shortage', false) if ts_entry is mapping else false -%}
              {%- set is_needs_repurchase = has_qty_to_purchase or is_rule_shortage -%}
              {%- if spool_filled not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set spool_filled_ts = as_timestamp(spool_filled, 0) | float(0) -%}
                {%- set desiccant_age_days = ((now_ts - spool_filled_ts) / 86400) | float(0) if spool_filled_ts > 0 else 0 -%}
              {%- else -%}
                {%- set desiccant_age_days = 0 -%}
              {%- endif -%}
              {%- if last_dried_raw not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set last_dried_ts = as_timestamp(last_dried_raw, 0) | float(0) -%}
                {%- set days_since_dried = ((now_ts - last_dried_ts) / 86400) | float(0) if last_dried_ts > 0 else 0 -%}
              {%- else -%}
                {%- set days_since_dried = 0 -%}
              {%- endif -%}
              {%- set purchase_date_ts = as_timestamp(purchase_date_raw, 0) | float(0) if purchase_date_raw not in [none, '', 'unknown', 'unavailable'] else 0 -%}
              {%- if last_used_raw not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set last_used_ts = as_timestamp(last_used_raw, 0) | float(0) -%}
                {%- set days_since_used = ((now_ts - last_used_ts) / 86400) | float(0) if last_used_ts > 0 else 99999 -%}
              {%- else -%}
                {%- set days_since_used = 99999 -%}
              {%- endif -%}
              {%- set has_old_desiccant = desiccant_age_days > des_yellow_thresh -%}
              {%- set des_has_date = spool_filled not in [none, '', 'unknown', 'unavailable'] -%}
              {%- set has_undefined_desiccant = (not is_sealed) and (not des_has_date) -%}
              {%- set is_needs_drying = (not is_sealed) and (days_since_dried > 90) -%}
              {%- set is_stale = days_since_used > 180 -%}
              {%- set is_missing_desiccant = (not is_sealed) and (not has_desiccant) -%}
              {%- set search_blob = (friendly_name ~ ' ' ~ filament_name ~ ' ' ~ vendor ~ ' ' ~ primary_color ~ ' ' ~ color_family) | lower -%}
              {%- set matches_material = filter_material == 'All' or material | lower == filter_material | lower -%}
              {%- set matches_vendor = filter_vendor == 'All' or vendor | lower == filter_vendor | lower -%}
              {%- set matches_color = filter_color == 'All' or primary_color | lower == filter_color | lower -%}
              {%- set matches_color_family = filter_color_family == 'All' or color_family | lower == filter_color_family | lower -%}
              {%- set matches_type = filter_type == 'All' or filter_type | lower in type_details -%}
              {%- set matches_location = filter_location == 'All' or location | lower == filter_location | lower -%}
              {%- set matches_spool_type = filter_spool_type == 'All' or spool_type | lower == filter_spool_type | lower -%}
              {%- set matches_clip_type = filter_clip_type == 'All' or (filter_clip_type == 'None' and (not clip_type_defined)) or (clip_type_defined and clip_type | lower == filter_clip_type | lower) -%}
              {%- set matches_inventory_rule = filter_inventory_rule == 'All' or inventory_rule == filter_inventory_rule -%}
              {%- set matches_qty_to_purchase = (not filter_qty_to_purchase) or has_qty_to_purchase -%}
              {%- set matches_sealed = filter_sealed == 'All' or (filter_sealed == 'Sealed' and is_sealed) or (filter_sealed == 'Unsealed' and (not is_sealed)) -%}
              {%- set matches_search = search_text == '' or search_text in search_blob -%}
              {%- if filter_data_quality == 'Multiple Unsealed Duplicates' -%}
                {%- set matches_data_quality = spool.entity_id in dq_unsealed_ids.items -%}
              {%- elif filter_data_quality == 'Duplicate Hex Colors' -%}
                {%- set matches_data_quality = spool_hex | length >= 6 and spool_hex[0:6] in dq_hexes.items -%}
              {%- elif filter_data_quality == 'Missing UUID' -%}
                {%- set matches_data_quality = spool.entity_id in dq_missing_uuid_ids.items -%}
              {%- elif filter_data_quality == 'Tag != UUID' -%}
                {%- set matches_data_quality = spool.entity_id in dq_tag_uuid_mismatch_ids.items -%}
              {%- elif filter_data_quality == 'Missing Profile' -%}
                {%- set matches_data_quality = spool.entity_id in dq_missing_profile_ids.items -%}
              {%- else -%}
                {%- set matches_data_quality = true -%}
              {%- endif -%}
              {%- set matches_low_stock = filter_stock_level == 'Any Stock Level' or (filter_stock_level == 'Low Stock' and is_low_stock) or (filter_stock_level == 'Low Stock (by Filament)' and filament_agg_weight < stock_threshold) or (filter_stock_level == 'Needs Purchase' and is_needs_repurchase) -%}
              {%- if filter_desiccant == 'All' -%}
                {%- set matches_desiccant = true -%}
              {%- elif filter_desiccant == 'Needs Desiccant (Any Age)' -%}
                {%- set matches_desiccant = has_old_desiccant -%}
              {%- elif filter_desiccant is search('^Red') -%}
                {%- set matches_desiccant = desiccant_age_days > des_red_thresh -%}
              {%- elif filter_desiccant is search('^Orange') -%}
                {%- set matches_desiccant = desiccant_age_days > des_orange_thresh and desiccant_age_days <= des_red_thresh -%}
              {%- elif filter_desiccant is search('^Yellow') -%}
                {%- set matches_desiccant = desiccant_age_days > des_yellow_thresh and desiccant_age_days <= des_orange_thresh -%}
              {%- elif filter_desiccant == 'Undefined' -%}
                {%- set matches_desiccant = has_undefined_desiccant -%}
              {%- elif filter_desiccant == 'Missing Desiccant' -%}
                {%- set matches_desiccant = is_missing_desiccant -%}
              {%- else -%}
                {%- set matches_desiccant = true -%}
              {%- endif -%}
              {%- set matches_nearly_empty = (not filter_nearly_empty) or is_nearly_empty -%}
              {%- set matches_needs_repurchase = (not filter_needs_repurchase) or is_needs_repurchase -%}
              {%- set matches_needs_drying = (not filter_needs_drying) or is_needs_drying -%}
              {%- set matches_stale = (not filter_stale) or is_stale -%}
              {%- set matches_missing_desiccant = (filter_desiccant != 'All' and filter_desiccant != 'Missing Desiccant') or (not filter_missing_desiccant) or is_missing_desiccant -%}
              {%- if matches_material and matches_vendor and matches_color and matches_color_family and matches_type and matches_location and matches_spool_type and matches_clip_type and matches_inventory_rule and matches_qty_to_purchase and matches_sealed and matches_search and matches_data_quality and matches_desiccant and matches_low_stock and matches_nearly_empty and matches_needs_repurchase and matches_needs_drying and matches_stale and matches_missing_desiccant -%}
                {%- if group_attr == 'location' -%}
                  {%- set gv = location if location else 'Unknown' -%}
                {%- elif group_attr == 'filament_material' -%}
                  {%- set gv = material if material else 'Unknown' -%}
                {%- elif group_attr == 'filament_vendor_name' -%}
                  {%- set gv = vendor if vendor else 'Unknown' -%}
                {%- elif group_attr == 'filament_group_name' -%}
                  {%- set gv = filament_group_name -%}
                {%- elif group_attr == 'filament_extra_color_family' -%}
                  {%- set gv = color_family if color_family else 'Unknown' -%}
                {%- elif group_attr == 'filament_color_hex' -%}
                  {%- set gv = ('#' ~ spool_hex[0:6]) if spool_hex | length >= 6 else 'Unknown' -%}
                {%- else -%}
                  {%- set gv = '' -%}
                {%- endif -%}
                {%- if sort_option in ['Name (A-Z)', 'Name (Z-A)'] -%}
                  {%- set sk = (filament_name if filament_name else friendly_name) | lower -%}
                {%- elif sort_option in ['Weight (Low to High)', 'Weight (High to Low)'] -%}
                  {%- set sk = remaining_weight -%}
                {%- elif sort_option in ['Last Used (Recent)', 'Last Used (Oldest)'] -%}
                  {%- set lu_raw = attrs.get('last_used', '') -%}
                  {%- set sk = as_timestamp(lu_raw, 0) | float(0) if lu_raw not in [none, '', 'unknown', 'unavailable'] else 0.0 -%}
                {%- elif sort_option in ['Purchase Date (Newest)', 'Purchase Date (Oldest)'] -%}
                  {%- set sk = purchase_date_ts -%}
                {%- elif sort_option in ['Desiccant Filled Date (Newest)', 'Desiccant Filled Date (Oldest)'] -%}
                  {%- set sk = spool_filled_ts -%}
                {%- elif sort_option in ['Qty to Purchase (Ascending)', 'Qty to Purchase (Descending)'] -%}
                  {%- set sk = purchase_qty -%}
                {%- elif sort_option in ['Cost (High to Low)', 'Cost (Low to High)'] -%}
                  {%- set sk = (attrs.get('price', 0) or 0) | float(0) -%}
                {%- elif sort_option == 'Vendor then Name' -%}
                  {%- set sk = (vendor ~ ' ' ~ (filament_name if filament_name else friendly_name)) | lower -%}
                {%- elif sort_option == 'Hue' -%}
                  {%- set hx = (primary_color | default('')) | replace('#', '') | lower -%}
                  {%- if hx | length >= 6 -%}
                    {%- set r_f = (hx[0:2] | int(0, 16)) / 255.0 -%}
                    {%- set g_f = (hx[2:4] | int(0, 16)) / 255.0 -%}
                    {%- set b_f = (hx[4:6] | int(0, 16)) / 255.0 -%}
                    {%- set cmax = [r_f, g_f, b_f] | max -%}
                    {%- set cmin = [r_f, g_f, b_f] | min -%}
                    {%- set delta = cmax - cmin -%}
                    {%- if delta < 0.001 -%}
                      {%- set hue_val = 0.0 -%}
                      {%- set sat_val = 0.0 -%}
                    {%- elif (cmax - r_f) | abs < 0.001 -%}
                      {%- set hue_val = 60.0 * (((g_f - b_f) / delta) % 6) -%}
                      {%- set sat_val = delta / cmax -%}
                    {%- elif (cmax - g_f) | abs < 0.001 -%}
                      {%- set hue_val = 60.0 * (((b_f - r_f) / delta) + 2) -%}
                      {%- set sat_val = delta / cmax -%}
                    {%- else -%}
                      {%- set hue_val = 60.0 * (((r_f - g_f) / delta) + 4) -%}
                      {%- set sat_val = delta / cmax -%}
                    {%- endif -%}
                    {%- set hue_norm = hue_val if hue_val >= 0 else hue_val + 360.0 -%}
                    {%- if sat_val < 0.08 -%}
                      {%- set sk = 361.0 + cmax -%}
                    {%- else -%}
                      {%- set sk = hue_norm -%}
                    {%- endif -%}
                  {%- else -%}
                    {%- set sk = 999.0 -%}
                  {%- endif -%}
                {%- else -%}
                  {%- set sk = (filament_name if filament_name else friendly_name) | lower -%}
                {%- endif -%}
                {%- set ns.matches = ns.matches + [{'eid': spool.entity_id, 'gv': gv, 'sk': sk}] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}

          {# -----------------------------------------------------------------
             Filament-backed catalog entries for zero-spool filament records only.
             We treat a filament as zero-spool when it has no totals entry/count,
             while still using the filament entity as the canonical source.
             ----------------------------------------------------------------- #}
          {%- for filament in filament_entities -%}
            {%- set attrs = filament.attributes -%}
            {%- set filament_id = attrs.get('id') -%}
            {%- set ts_entry = totals_and_shortage.get(filament_id | string, {}) if filament_id is not none else {} -%}
            {%- set filament_count = ts_entry.get('count', 0) | int(0) if ts_entry is mapping else 0 -%}
            {%- set current_weight = states(filament.entity_id) | float(0) -%}
            {%- if filament_summary_mode or (filament_count == 0 and current_weight <= 0) -%}
              {%- set material = attrs.get('material', '') | string -%}
              {%- set vendor = attrs.get('vendor_name', '') | string -%}
              {%- set friendly_name = attrs.get('friendly_name', filament.name) | string -%}
              {%- set filament_name = attrs.get('name', '') | string -%}
              {%- set filament_display_name = filament_name if filament_name not in ['', 'unknown', 'unavailable', 'None', 'none'] else friendly_name -%}
              {%- set filament_group_parts = namespace(items=[]) -%}
              {%- if vendor not in ['', 'unknown', 'unavailable', 'None', 'none'] -%}
                {%- set filament_group_parts.items = filament_group_parts.items + [vendor] -%}
              {%- endif -%}
              {%- if material not in ['', 'unknown', 'unavailable', 'None', 'none'] -%}
                {%- set filament_group_parts.items = filament_group_parts.items + [material] -%}
              {%- endif -%}
              {%- if filament_display_name not in ['', 'unknown', 'unavailable', 'None', 'none'] and filament_display_name not in filament_group_parts.items -%}
                {%- set filament_group_parts.items = filament_group_parts.items + [filament_display_name] -%}
              {%- endif -%}
              {%- set filament_group_name = filament_group_parts.items | join(' • ') if filament_group_parts.items | count > 0 else 'Unknown' -%}
              {%- set location = 'No Spools' if filament_count == 0 else 'In Inventory' -%}
              {%- set primary_color = attrs.get('extra_primary_color', '') | string | replace('"', '') | trim -%}
              {%- set spool_hex = attrs.get('color_hex', '') | string | replace('#', '') | lower | trim -%}
              {%- set color_family = attrs.get('extra_color_family', '') | string | replace('"', '') | trim -%}
              {%- set type_raw = attrs.get('extra_type_details', []) -%}
              {%- if type_raw is string -%}
                {%- set type_details = type_raw | replace('[', '') | replace(']', '') | replace('"', '') | lower -%}
              {%- elif type_raw is iterable -%}
                {%- set type_details = type_raw | join(', ') | lower -%}
              {%- else -%}
                {%- set type_details = '' -%}
              {%- endif -%}
              {%- set inventory_rule_source = attrs.get('extra_inventory_rule', '') | string | trim -%}
              {%- set inventory_rule_clean = inventory_rule_source | regex_replace('^"|"$', '') | lower -%}
              {%- set inventory_rule_aliases = {
                'not defined': 'Not Defined',
                'keep in stock': 'Keep In Stock',
                'maintain backup spool': 'Maintain Backup Spool',
                'max inventory': 'Max Inventory',
                'as needed': 'As Needed',
                'do not stock': 'Do Not Stock'
              } -%}
              {%- if inventory_rule_clean in ['', 'none', 'null', 'unknown', 'unavailable'] -%}
                {%- set inventory_rule = 'Not Defined' -%}
              {%- else -%}
                {%- set inventory_rule = inventory_rule_aliases.get(inventory_rule_clean, inventory_rule_source | regex_replace('^"|"$', '')) -%}
              {%- endif -%}
              {%- set purchase_qty = attrs.get('extra_purchase_qty', 0) | int(0) -%}
              {%- set has_qty_to_purchase = purchase_qty > 0 -%}
              {%- set is_low_stock = current_weight < stock_threshold -%}
              {%- set is_nearly_empty = current_weight < 50 -%}
              {%- set filament_agg_weight = current_weight -%}
              {%- set is_rule_shortage = ((inventory_rule in ['Keep In Stock', 'Not Defined']) and (filament_count < 1 or filament_agg_weight < stock_threshold)) or (inventory_rule == 'Maintain Backup Spool' and (filament_count < 2 or filament_agg_weight < stock_threshold)) -%}
              {%- set is_needs_repurchase = has_qty_to_purchase or is_rule_shortage -%}
              {%- set purchase_date_raw = attrs.get('registered', '') -%}
              {%- set purchase_date_ts = as_timestamp(purchase_date_raw, 0) | float(0) if purchase_date_raw not in [none, '', 'unknown', 'unavailable'] else 0 -%}
              {%- set search_blob = (friendly_name ~ ' ' ~ filament_name ~ ' ' ~ vendor ~ ' ' ~ primary_color ~ ' ' ~ color_family) | lower -%}
              {%- set matches_material = filter_material == 'All' or material | lower == filter_material | lower -%}
              {%- set matches_vendor = filter_vendor == 'All' or vendor | lower == filter_vendor | lower -%}
              {%- set matches_color = filter_color == 'All' or primary_color | lower == filter_color | lower -%}
              {%- set matches_color_family = filter_color_family == 'All' or color_family | lower == filter_color_family | lower -%}
              {%- set matches_type = filter_type == 'All' or filter_type | lower in type_details -%}
              {%- set matches_location = filter_location == 'All' or filter_location == location -%}
              {%- set matches_spool_type = filter_spool_type == 'All' -%}
              {%- set matches_clip_type = filter_clip_type == 'All' -%}
              {%- set matches_inventory_rule = filter_inventory_rule == 'All' or inventory_rule == filter_inventory_rule -%}
              {%- set matches_qty_to_purchase = (not filter_qty_to_purchase) or has_qty_to_purchase -%}
              {%- set matches_sealed = filter_sealed == 'All' -%}
              {%- set matches_search = search_text == '' or search_text in search_blob -%}
              {%- set matches_data_quality = filter_data_quality == 'All' -%}
              {%- set matches_low_stock = filter_stock_level == 'Any Stock Level' or (filter_stock_level == 'Low Stock' and is_low_stock) or (filter_stock_level == 'Low Stock (by Filament)' and filament_agg_weight < stock_threshold) or (filter_stock_level == 'Needs Purchase' and is_needs_repurchase) -%}
              {%- set matches_desiccant = filter_desiccant == 'All' -%}
              {%- set matches_nearly_empty = (not filter_nearly_empty) or is_nearly_empty -%}
              {%- set matches_needs_repurchase = (not filter_needs_repurchase) or is_needs_repurchase -%}
              {%- set matches_needs_drying = not filter_needs_drying -%}
              {%- set matches_stale = not filter_stale -%}
              {%- set matches_missing_desiccant = not filter_missing_desiccant -%}
              {%- if matches_material and matches_vendor and matches_color and matches_color_family and matches_type and matches_location and matches_spool_type and matches_clip_type and matches_inventory_rule and matches_qty_to_purchase and matches_sealed and matches_search and matches_data_quality and matches_desiccant and matches_low_stock and matches_nearly_empty and matches_needs_repurchase and matches_needs_drying and matches_stale and matches_missing_desiccant -%}
                {%- if group_attr == 'location' -%}
                  {%- set gv = location -%}
                {%- elif group_attr == 'filament_material' -%}
                  {%- set gv = material if material else 'Unknown' -%}
                {%- elif group_attr == 'filament_vendor_name' -%}
                  {%- set gv = vendor if vendor else 'Unknown' -%}
                {%- elif group_attr == 'filament_group_name' -%}
                  {%- set gv = filament_group_name -%}
                {%- elif group_attr == 'filament_extra_color_family' -%}
                  {%- set gv = color_family if color_family else 'Unknown' -%}
                {%- elif group_attr == 'filament_color_hex' -%}
                  {%- set gv = ('#' ~ spool_hex[0:6]) if spool_hex | length >= 6 else 'Unknown' -%}
                {%- else -%}
                  {%- set gv = '' -%}
                {%- endif -%}
                {%- if sort_option in ['Name (A-Z)', 'Name (Z-A)'] -%}
                  {%- set sk = filament_display_name | lower -%}
                {%- elif sort_option in ['Weight (Low to High)', 'Weight (High to Low)'] -%}
                  {%- set sk = current_weight -%}
                {%- elif sort_option in ['Last Used (Recent)', 'Last Used (Oldest)'] -%}
                  {%- set sk = 0.0 -%}
                {%- elif sort_option in ['Purchase Date (Newest)', 'Purchase Date (Oldest)'] -%}
                  {%- set sk = purchase_date_ts -%}
                {%- elif sort_option in ['Desiccant Filled Date (Newest)', 'Desiccant Filled Date (Oldest)'] -%}
                  {%- set sk = 0.0 -%}
                {%- elif sort_option in ['Qty to Purchase (Ascending)', 'Qty to Purchase (Descending)'] -%}
                  {%- set sk = purchase_qty -%}
                {%- elif sort_option in ['Cost (High to Low)', 'Cost (Low to High)'] -%}
                  {%- set sk = (attrs.get('price', 0) or 0) | float(0) -%}
                {%- elif sort_option == 'Vendor then Name' -%}
                  {%- set sk = (vendor ~ ' ' ~ filament_display_name) | lower -%}
                {%- elif sort_option == 'Hue' -%}
                  {%- if spool_hex | length >= 6 -%}
                    {%- set r_f = (spool_hex[0:2] | int(0, 16)) / 255.0 -%}
                    {%- set g_f = (spool_hex[2:4] | int(0, 16)) / 255.0 -%}
                    {%- set b_f = (spool_hex[4:6] | int(0, 16)) / 255.0 -%}
                    {%- set cmax = [r_f, g_f, b_f] | max -%}
                    {%- set cmin = [r_f, g_f, b_f] | min -%}
                    {%- set delta = cmax - cmin -%}
                    {%- if delta < 0.001 -%}
                      {%- set hue_val = 0.0 -%}
                      {%- set sat_val = 0.0 -%}
                    {%- elif (cmax - r_f) | abs < 0.001 -%}
                      {%- set hue_val = 60.0 * (((g_f - b_f) / delta) % 6) -%}
                      {%- set sat_val = delta / cmax -%}
                    {%- elif (cmax - g_f) | abs < 0.001 -%}
                      {%- set hue_val = 60.0 * (((b_f - r_f) / delta) + 2) -%}
                      {%- set sat_val = delta / cmax -%}
                    {%- else -%}
                      {%- set hue_val = 60.0 * (((r_f - g_f) / delta) + 4) -%}
                      {%- set sat_val = delta / cmax -%}
                    {%- endif -%}
                    {%- set hue_norm = hue_val if hue_val >= 0 else hue_val + 360.0 -%}
                    {%- if sat_val < 0.08 -%}
                      {%- set sk = 361.0 + cmax -%}
                    {%- else -%}
                      {%- set sk = hue_norm -%}
                    {%- endif -%}
                  {%- else -%}
                    {%- set sk = 999.0 -%}
                  {%- endif -%}
                {%- else -%}
                  {%- set sk = filament_display_name | lower -%}
                {%- endif -%}
                {%- set ns.matches = ns.matches + [{'eid': filament.entity_id, 'gv': gv, 'sk': sk}] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set step1 = ns.matches | sort(attribute='sk', reverse=sort_reverse) -%}
          {%- set sorted_items = step1 | sort(attribute='gv') if group_attr else step1 -%}
          {%- set res = namespace(groups=[], curr='__SENTINEL__', ents=[], cnt=0) -%}
          {%- for item in sorted_items -%}
            {%- if item.gv != res.curr -%}
              {%- if res.curr != '__SENTINEL__' -%}
                {%- set res.groups = res.groups + [{'name': res.curr, 'count': res.cnt, 'entities': res.ents}] -%}
              {%- endif -%}
              {%- set res.curr = item.gv -%}
              {%- set res.ents = [item.eid] -%}
              {%- set res.cnt = 1 -%}
            {%- else -%}
              {%- set res.ents = res.ents + [item.eid] -%}
              {%- set res.cnt = res.cnt + 1 -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if res.curr != '__SENTINEL__' -%}
            {%- set res.groups = res.groups + [{'name': res.curr, 'count': res.cnt, 'entities': res.ents}] -%}
          {%- endif -%}
          {{ res.groups | tojson }}
        # ================================================================
        # Flat entity ID list derived from grouped output (for count & compat)
        # ================================================================
        entity_ids_json: >-
          {%- set gj = state_attr('sensor.filament_catalog_filtered_spools', 'grouped_entity_ids_json') | default('[]', true) -%}
          {%- if gj is string -%}
            {%- set groups = gj | from_json -%}
          {%- elif gj is iterable -%}
            {%- set groups = gj | list -%}
          {%- else -%}
            {%- set groups = [] -%}
          {%- endif -%}
          {%- set ns = namespace(ids=[]) -%}
          {%- for g in groups -%}
            {%- for eid in g.get('entities', []) -%}
              {%- set ns.ids = ns.ids + [eid] -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ ns.ids | tojson }}
        entity_ids: >
          {% set ej = state_attr('sensor.filament_catalog_filtered_spools', 'entity_ids_json') | default('[]', true) %}
          {% if ej in [none, '', 'unknown', 'unavailable'] %}
            []
          {% elif ej is string %}
            {{ ej | from_json | tojson }}
          {% elif ej is iterable %}
            {{ ej | list | tojson }}
          {% else %}
            []
          {% endif %}
        active_filter_summary: >-
          {%- set active = [] -%}
          {%- if states('input_select.filament_catalog_filter_material') != 'All' -%}{%- set active = active + ['Material'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_scope') != 'In-Stock Spools' -%}{%- set active = active + ['Scope'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_vendor') != 'All' -%}{%- set active = active + ['Vendor'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_color') != 'All' -%}{%- set active = active + ['Color'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_color_family') != 'All' -%}{%- set active = active + ['Color Family'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_type') != 'All' -%}{%- set active = active + ['Type'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_location') != 'All' -%}{%- set active = active + ['Location'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_spool_type') != 'All' -%}{%- set active = active + ['Spool Type'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_clip_type') != 'All' -%}{%- set active = active + ['Clip Type'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_inventory_rule') != 'All' -%}{%- set active = active + ['Inventory Rule'] -%}{%- endif -%}
          {%- if is_state('input_boolean.filament_catalog_filter_qty_to_purchase', 'on') -%}{%- set active = active + ['Qty To Purchase'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_sealed') != 'All' -%}{%- set active = active + ['Sealed State'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_data_quality') != 'All' -%}{%- set active = active + ['Data Quality'] -%}{%- endif -%}
          {%- if states('input_text.filament_catalog_search') | trim != '' -%}{%- set active = active + ['Search'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_desiccant') not in ['All', 'unknown', 'unavailable', ''] -%}{%- set active = active + ['Desiccant: ' ~ states('input_select.filament_catalog_filter_desiccant')] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_stock_level') not in ['Any Stock Level', 'unknown', 'unavailable', ''] -%}{%- set active = active + [states('input_select.filament_catalog_filter_stock_level')] -%}{%- endif -%}
          {%- if is_state('input_boolean.filament_catalog_filter_nearly_empty', 'on') -%}{%- set active = active + ['Nearly Empty'] -%}{%- endif -%}
          {%- if is_state('input_boolean.filament_catalog_filter_needs_repurchase', 'on') -%}{%- set active = active + ['Needs Repurchase'] -%}{%- endif -%}
          {%- if is_state('input_boolean.filament_catalog_filter_needs_drying', 'on') -%}{%- set active = active + ['Needs Drying'] -%}{%- endif -%}
          {%- if is_state('input_boolean.filament_catalog_filter_stale', 'on') -%}{%- set active = active + ['Stale'] -%}{%- endif -%}
          {%- if is_state('input_boolean.filament_catalog_filter_missing_desiccant', 'on') -%}{%- set active = active + ['Missing Desiccant'] -%}{%- endif -%}
          {{ active | join(', ') if active | count > 0 else 'None' }}
