- sensor:
    - name: Filament Catalog Filtered Spools
      unique_id: filament_catalog_filtered_spools
      icon: mdi:filter-variant
      state: >
        {% set entity_ids_json = state_attr('sensor.filament_catalog_filtered_spools', 'entity_ids_json') | default('[]', true) %}
        {% if entity_ids_json in [none, '', 'unknown', 'unavailable'] %}
          0
        {% else %}
          {% set entity_ids = entity_ids_json | from_json %}
          {{ entity_ids | length }}
        {% endif %}
      attributes:
        entity_ids_json: >
          {% set filter_material = states('input_select.filament_catalog_filter_material') %}
          {% set filter_vendor = states('input_select.filament_catalog_filter_vendor') %}
          {% set filter_color = states('input_select.filament_catalog_filter_color') %}
          {% set filter_color_family = states('input_select.filament_catalog_filter_color_family') %}
          {% set filter_type = states('input_select.filament_catalog_filter_type') %}
          {% set search_text = states('input_text.filament_catalog_search') | lower | trim %}
          {% set repurchase_threshold = states('input_number.filament_catalog_repurchase_threshold') | float(150) %}

          {% set filter_needs_repurchase = is_state('input_boolean.filament_catalog_filter_needs_repurchase', 'on') %}
          {% set filter_desiccant_old = is_state('input_boolean.filament_catalog_filter_desiccant_old', 'on') %}
          {% set filter_low_stock = is_state('input_boolean.filament_catalog_filter_low_stock', 'on') %}
          {% set filter_unsealed_only = is_state('input_boolean.filament_catalog_filter_unsealed_only', 'on') %}

          {% set filament_totals = state_attr('sensor.spoolman_filament_totals', 'totals') | default({}, true) %}
          {% set ns = namespace(matches=[]) %}

          {% for spool in states.sensor %}
            {% if spool.entity_id.startswith('sensor.spoolman_spool_') %}
              {% set archived_raw = spool.attributes.archived | default(false) %}
              {% set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] %}
              {% if not archived %}
              {% set material = spool.attributes.filament_material | default('') | string %}
              {% set vendor = spool.attributes.filament_vendor_name | default('') | string %}
              {% set friendly_name = spool.attributes.friendly_name | default(spool.name) | string %}
              {% set filament_name = spool.attributes.filament_name | default('') | string %}
              {% set primary_color = spool.attributes.filament_extra_primary_color | default('') | string | regex_replace('^"|"$', '') %}
              {% set color_family = spool.attributes.filament_extra_color_family | default('') | string | regex_replace('^"|"$', '') %}
              {% set type_details = spool.attributes.filament_extra_type_details | default('') | string | replace('[', '') | replace(']', '') | replace('"', '') | lower %}

              {% set remaining_weight = spool.attributes.remaining_weight | float(0) %}
              {% set spool_filled = spool.attributes.extra_desiccant_filled | default('') %}
              {% set is_unsealed = spool.attributes.extra_sealed in [false, 'false', 'False', 0, '0'] %}

              {% set filament_id = spool.attributes.filament_id | default('') %}
              {% set filament_key = filament_id | string %}
              {% set filament_total = filament_totals[filament_key] if filament_totals[filament_key] is defined else (filament_totals[filament_id] if filament_totals[filament_id] is defined else {}) %}
              {% set filament_count = filament_total.count | default(1) | int(1) %}
              {% set needs_repurchase = filament_count <= 1 and remaining_weight < repurchase_threshold %}

              {% if spool_filled not in [none, '', 'unknown', 'unavailable'] %}
                {% set desiccant_age_days = ((as_timestamp(now()) - as_timestamp(spool_filled, 0)) / 86400) | float(0) %}
              {% else %}
                {% set desiccant_age_days = 0 %}
              {% endif %}
              {% set has_old_desiccant = desiccant_age_days > 45 %}

              {% set search_blob = (friendly_name ~ ' ' ~ filament_name ~ ' ' ~ vendor ~ ' ' ~ primary_color ~ ' ' ~ color_family) | lower %}

              {% set matches_material = filter_material == 'All' or material | lower == filter_material | lower %}
              {% set matches_vendor = filter_vendor == 'All' or vendor | lower == filter_vendor | lower %}
              {% set matches_color = filter_color == 'All' or primary_color | lower == filter_color | lower %}
              {% set matches_color_family = filter_color_family == 'All' or color_family | lower == filter_color_family | lower %}
              {% set matches_type = filter_type == 'All' or filter_type | lower in type_details %}
              {% set matches_search = search_text == '' or search_text in search_blob %}

              {% set matches_state_filters =
                (not filter_needs_repurchase or needs_repurchase) and
                (not filter_desiccant_old or has_old_desiccant) and
                (not filter_low_stock or remaining_weight < 100) and
                (not filter_unsealed_only or is_unsealed)
              %}

              {% if matches_material and matches_vendor and matches_color and matches_color_family and matches_type and matches_search and matches_state_filters %}
                {% set ns.matches = ns.matches + [spool.entity_id] %}
              {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {{ ns.matches | tojson }}
        active_filter_summary: >
          {% set active = [] %}
          {% if states('input_select.filament_catalog_filter_material') != 'All' %}
            {% set active = active + ['Material'] %}
          {% endif %}
          {% if states('input_select.filament_catalog_filter_vendor') != 'All' %}
            {% set active = active + ['Vendor'] %}
          {% endif %}
          {% if states('input_select.filament_catalog_filter_color') != 'All' %}
            {% set active = active + ['Color'] %}
          {% endif %}
          {% if states('input_select.filament_catalog_filter_color_family') != 'All' %}
            {% set active = active + ['Color Family'] %}
          {% endif %}
          {% if states('input_select.filament_catalog_filter_type') != 'All' %}
            {% set active = active + ['Type'] %}
          {% endif %}
          {% if states('input_text.filament_catalog_search') | trim != '' %}
            {% set active = active + ['Search'] %}
          {% endif %}
          {% if is_state('input_boolean.filament_catalog_filter_needs_repurchase', 'on') %}
            {% set active = active + ['Needs Repurchase'] %}
          {% endif %}
          {% if is_state('input_boolean.filament_catalog_filter_desiccant_old', 'on') %}
            {% set active = active + ['Desiccant Old'] %}
          {% endif %}
          {% if is_state('input_boolean.filament_catalog_filter_low_stock', 'on') %}
            {% set active = active + ['Low Stock'] %}
          {% endif %}
          {% if is_state('input_boolean.filament_catalog_filter_unsealed_only', 'on') %}
            {% set active = active + ['Unsealed Only'] %}
          {% endif %}
          {{ active | join(', ') if active | count > 0 else 'None' }}
