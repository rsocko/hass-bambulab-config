- sensor:
    - name: Filament Catalog Filtered Spools
      unique_id: filament_catalog_filtered_spools
      icon: mdi:filter-variant
      state: >
        {% set entity_ids_json = state_attr('sensor.filament_catalog_filtered_spools', 'entity_ids_json') | default('[]', true) %}
        {% if entity_ids_json in [none, '', 'unknown', 'unavailable'] %}
          0
        {% elif entity_ids_json is string %}
          {{ (entity_ids_json | from_json) | length }}
        {% elif entity_ids_json is iterable %}
          {{ entity_ids_json | list | length }}
        {% else %}
          0
        {% endif %}
      attributes:
        entity_ids_json: >-
          {%- set filter_material = states('input_select.filament_catalog_filter_material') -%}
          {%- set filter_vendor = states('input_select.filament_catalog_filter_vendor') -%}
          {%- set filter_color = states('input_select.filament_catalog_filter_color') -%}
          {%- set filter_color_family = states('input_select.filament_catalog_filter_color_family') -%}
          {%- set filter_type = states('input_select.filament_catalog_filter_type') -%}
          {%- set filter_location = states('input_select.filament_catalog_filter_location') -%}
          {%- set filter_sealed = states('input_select.filament_catalog_filter_sealed') -%}
          {%- set search_text = states('input_text.filament_catalog_search') | lower | trim -%}
          {%- set stock_threshold = states('input_number.filament_catalog_stock_threshold') | float(150) -%}
          {%- set filter_desiccant_old = is_state('input_boolean.filament_catalog_filter_desiccant_old', 'on') -%}
          {%- set filter_low_stock = is_state('input_boolean.filament_catalog_filter_low_stock', 'on') -%}
          {%- set ns = namespace(matches=[]) -%}
          {%- for spool in states.sensor if spool.entity_id is match('^sensor\\.spoolman_spool_\\d+$') -%}
            {%- set attrs = spool.attributes -%}
            {%- set archived_raw = attrs.get('archived', false) -%}
            {%- set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
            {%- if not archived -%}
              {%- set material = attrs.get('filament_material', '') | string -%}
              {%- set vendor = attrs.get('filament_vendor_name', '') | string -%}
              {%- set friendly_name = attrs.get('friendly_name', spool.name) | string -%}
              {%- set filament_name = attrs.get('filament_name', '') | string -%}
              {%- set location = attrs.get('location', '') | string -%}
              {%- set primary_color = attrs.get('filament_extra_primary_color', '') | string | replace('"', '') -%}
              {%- set color_family = attrs.get('filament_extra_color_family', '') | string | replace('"', '') -%}
              {%- set type_details = attrs.get('filament_extra_type_details', '') | string | replace('[', '') | replace(']', '') | replace('"', '') | lower -%}
              {%- set remaining_weight = attrs.get('remaining_weight', 0) | float(0) -%}
              {%- set spool_filled = attrs.get('extra_desiccant_filled', '') -%}
              {%- set is_sealed = attrs.get('extra_sealed') in [true, 'true', 'True', 1, '1', 'on', 'On'] -%}
              {%- set is_low_stock = remaining_weight < stock_threshold -%}
              {%- if spool_filled not in [none, '', 'unknown', 'unavailable'] -%}
                {%- set spool_filled_ts = as_timestamp(spool_filled, 0) | float(0) -%}
                {%- set desiccant_age_days = ((as_timestamp(now()) - spool_filled_ts) / 86400) | float(0) if spool_filled_ts > 0 else 0 -%}
              {%- else -%}
                {%- set desiccant_age_days = 0 -%}
              {%- endif -%}
              {%- set has_old_desiccant = desiccant_age_days > 45 -%}
              {%- set search_blob = (friendly_name ~ ' ' ~ filament_name ~ ' ' ~ vendor ~ ' ' ~ primary_color ~ ' ' ~ color_family) | lower -%}
              {%- set matches_material = filter_material == 'All' or material | lower == filter_material | lower -%}
              {%- set matches_vendor = filter_vendor == 'All' or vendor | lower == filter_vendor | lower -%}
              {%- set matches_color = filter_color == 'All' or primary_color | lower == filter_color | lower -%}
              {%- set matches_color_family = filter_color_family == 'All' or color_family | lower == filter_color_family | lower -%}
              {%- set matches_type = filter_type == 'All' or filter_type | lower in type_details -%}
              {%- set matches_location = filter_location == 'All' or location | lower == filter_location | lower -%}
              {%- set matches_sealed = filter_sealed == 'All' or (filter_sealed == 'Sealed' and is_sealed) or (filter_sealed == 'Unsealed' and (not is_sealed)) -%}
              {%- set matches_search = search_text == '' or search_text in search_blob -%}
              {%- set matches_low_stock = (not filter_low_stock) or is_low_stock -%}
              {%- set matches_desiccant = (not filter_desiccant_old) or has_old_desiccant -%}
              {%- if matches_material and matches_vendor and matches_color and matches_color_family and matches_type and matches_location and matches_sealed and matches_search and matches_desiccant and matches_low_stock -%}
                {%- set ns.matches = ns.matches + [spool.entity_id] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.matches | tojson }}
        entity_ids: >
          {% set entity_ids_json = state_attr('sensor.filament_catalog_filtered_spools', 'entity_ids_json') | default('[]', true) %}
          {% if entity_ids_json in [none, '', 'unknown', 'unavailable'] %}
            []
          {% elif entity_ids_json is string %}
            {{ entity_ids_json | from_json | tojson }}
          {% elif entity_ids_json is iterable %}
            {{ entity_ids_json | list | tojson }}
          {% else %}
            []
          {% endif %}
        active_filter_summary: >-
          {%- set active = [] -%}
          {%- if states('input_select.filament_catalog_filter_material') != 'All' -%}{%- set active = active + ['Material'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_vendor') != 'All' -%}{%- set active = active + ['Vendor'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_color') != 'All' -%}{%- set active = active + ['Color'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_color_family') != 'All' -%}{%- set active = active + ['Color Family'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_type') != 'All' -%}{%- set active = active + ['Type'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_location') != 'All' -%}{%- set active = active + ['Location'] -%}{%- endif -%}
          {%- if states('input_select.filament_catalog_filter_sealed') != 'All' -%}{%- set active = active + ['Sealed State'] -%}{%- endif -%}
          {%- if states('input_text.filament_catalog_search') | trim != '' -%}{%- set active = active + ['Search'] -%}{%- endif -%}
          {%- if is_state('input_boolean.filament_catalog_filter_desiccant_old', 'on') -%}{%- set active = active + ['Desiccant Old'] -%}{%- endif -%}
          {%- if is_state('input_boolean.filament_catalog_filter_low_stock', 'on') -%}{%- set active = active + ['Low Stock'] -%}{%- endif -%}
          {{ active | join(', ') if active | count > 0 else 'None' }}
