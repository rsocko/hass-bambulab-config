type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: input_boolean.filament_catalog_show_insights
    name: Insights
    icon: mdi:chart-box-outline
    show_state: true
    tap_action:
      action: toggle
  - type: conditional
    conditions:
      - entity: input_boolean.filament_catalog_show_insights
        state: "on"
    card:
      type: custom:apexcharts-card
      chart_type: donut
      header:
        show: true
        title: Count by Material
      apex_config:
        chart:
          height: 240
          animations:
            enabled: false
          toolbar:
            show: false
        legend:
          show: true
          position: bottom
      series:
        - entity: sensor.filament_catalog_count_material_pla
          name: PLA
          color: '#42A5F5'
        - entity: sensor.filament_catalog_count_material_petg
          name: PETG
          color: '#66BB6A'
        - entity: sensor.filament_catalog_count_material_abs
          name: ABS/ASA
          color: '#FFA726'
        - entity: sensor.filament_catalog_count_material_tpu
          name: TPU
          color: '#AB47BC'
        - entity: sensor.filament_catalog_count_material_other
          name: Other
          color: '#90A4AE'
