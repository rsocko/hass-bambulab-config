type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: input_boolean.filament_catalog_show_insights
    name: Insights
    icon: mdi:chart-box-outline
    show_state: true
    tap_action:
      action: toggle
  - type: conditional
    conditions:
      - entity: input_boolean.filament_catalog_show_insights
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: markdown
          content: >-
            **Insights are running in safe mode while we isolate UI performance.**
            This card intentionally avoids heavy client-side data generators.
        - !include insights/chart_count_by_material.yaml
        - type: entities
          title: Metrics Snapshot
          show_header_toggle: false
          entities:
            - entity: sensor.filament_catalog_metrics
              name: Total Active Spools
