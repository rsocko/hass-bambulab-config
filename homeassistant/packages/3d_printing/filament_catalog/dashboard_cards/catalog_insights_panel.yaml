type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: input_boolean.filament_catalog_show_insights
    name: Insights
    icon: mdi:chart-box-outline
    show_state: true
    tap_action:
      action: toggle
  - type: conditional
    conditions:
      - entity: input_boolean.filament_catalog_show_insights
        state: "on"
    card:
      type: custom:apexcharts-card
      graph_span: 24h
      header:
        show: true
        title: Total Active Spools (24h)
      apex_config:
        chart:
          height: 240
          animations:
            enabled: false
          toolbar:
            show: false
      series:
        - entity: sensor.filament_catalog_metrics
          name: Total spools
          type: line
          stroke_width: 3
          group_by:
            func: max
            duration: 1h
