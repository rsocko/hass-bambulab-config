type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: input_boolean.filament_catalog_show_insights
    name: Insights
    icon: mdi:chart-box-outline
    show_state: true
    tap_action:
      action: toggle
  - type: conditional
    conditions:
      - entity: input_boolean.filament_catalog_show_insights
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: horizontal-stack
          cards:
            - !include insights/chart_weight_by_material.yaml
            - !include insights/chart_count_by_material.yaml
        - type: horizontal-stack
          cards:
            - !include insights/chart_weight_by_vendor.yaml
            - !include insights/chart_count_by_vendor.yaml
        - type: horizontal-stack
          cards:
            - !include insights/chart_weight_by_color_family.yaml
            - !include insights/chart_count_by_color_family.yaml
        - type: horizontal-stack
          cards:
            - !include insights/chart_weight_by_primary_color_stacked.yaml
            - !include insights/chart_count_by_primary_color.yaml
        - !include insights/chart_alert_counts.yaml
        - !include insights/card_data_quality_reports.yaml
