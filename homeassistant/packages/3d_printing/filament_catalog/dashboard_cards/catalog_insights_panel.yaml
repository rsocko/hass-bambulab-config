type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: input_boolean.filament_catalog_show_insights
    name: Insights
    icon: mdi:chart-box-outline
    show_state: true
    tap_action:
      action: toggle
  - type: conditional
    conditions:
      - entity: input_boolean.filament_catalog_show_insights
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: markdown
          content: >-
            **Insights are running in safe mode while we isolate UI performance.**
            This card intentionally avoids heavy client-side data generators.
        - type: custom:apexcharts-card
          graph_span: 24h
          header:
            show: true
            title: Total Spools (24h Trend)
          apex_config:
            chart:
              height: 240
              animations:
                enabled: false
              toolbar:
                show: false
          series:
            - entity: sensor.filament_catalog_metrics
              name: Total spools
              type: line
              stroke_width: 3
              group_by:
                func: max
                duration: 1h
        - type: entities
          title: Metrics Snapshot
          show_header_toggle: false
          entities:
            - entity: sensor.filament_catalog_metrics
              name: Total Active Spools
