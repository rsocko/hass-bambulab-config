type: custom:apexcharts-card
header:
  show: true
  title: Weight by Material
graph_span: 1d
apex_config:
  chart:
    type: bar
    height: 260
    animations:
      enabled: false
    toolbar:
      show: false
  plotOptions:
    bar:
      horizontal: true
      borderRadius: 4
  xaxis:
    title:
      text: kg
  legend:
    show: false
series:
  - entity: sensor.filament_catalog_metrics
    name: kg
    color: '#42A5F5'
    data_generator: |
      const raw = entity?.attributes?.weight_by_material_json;
      const obj = (raw && typeof raw === 'object') ? raw : {};
      return Object.entries(obj)
        .map(([k, v]) => ({ x: k, y: Number(v || 0) / 1000 }))
        .filter(p => p.y > 0)
        .sort((a, b) => b.y - a.y)
        .slice(0, 12);
