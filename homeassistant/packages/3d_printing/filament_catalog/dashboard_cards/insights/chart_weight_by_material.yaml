type: custom:apexcharts-card
chart_type: donut
header:
  show: true
  title: Weight by Material
apex_config:
  chart:
    height: 260
    animations:
      enabled: false
    toolbar:
      show: false
  plotOptions:
    pie:
      donut:
        size: 55%
  legend:
    show: true
series:
  - entity: sensor.filament_catalog_metrics
    name: kg
    color: '#42A5F5'
    data_generator: |
      const raw = entity?.attributes?.weight_by_material_json;
      let obj = {};
      if (raw && typeof raw === 'object') {
        obj = raw;
      } else if (typeof raw === 'string' && raw.trim()) {
        try { obj = JSON.parse(raw); } catch (e) { obj = {}; }
      }
      return Object.entries(obj)
        .map(([k, v]) => [k, Number(v || 0) / 1000])
        .filter(p => p[1] > 0)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 12);
