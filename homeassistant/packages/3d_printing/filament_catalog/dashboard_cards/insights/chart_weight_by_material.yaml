type: custom:button-card
entity: sensor.filament_catalog_metrics
triggers_update: sensor.filament_catalog_metrics
show_icon: false
show_name: false
show_state: false
styles:
  card:
    - padding: 12px
    - border-radius: 12px
  custom_fields:
    chart:
      - text-align: left
custom_fields:
  chart: |
    [[[ 
      const raw = entity?.attributes?.weight_by_material_json || '{}';
      let data = {};
      try { data = JSON.parse(raw); } catch (e) { data = {}; }
      const rows = Object.entries(data)
        .map(([k, v]) => [k, Number(v) || 0])
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);
      const max = rows.length ? rows[0][1] : 1;
      const line = (name, grams) => {
        const pct = Math.max(4, Math.round((grams / max) * 100));
        const kg = (grams / 1000).toFixed(1);
        return `<div style="margin:5px 0;"><div style="display:flex;justify-content:space-between;font-size:11px;"><span>${name}</span><span>${kg} kg</span></div><div style="height:6px;background:rgba(120,120,120,0.2);border-radius:99px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:#42A5F5;"></div></div></div>`;
      };
      const body = rows.length ? rows.map(([name, grams]) => line(name, grams)).join('') : '<div style="opacity:0.7;font-size:12px;">No data</div>';
      return `<div><div style="font-weight:700;font-size:13px;margin-bottom:6px;">Weight by Material</div>${body}</div>`;
    ]]]
