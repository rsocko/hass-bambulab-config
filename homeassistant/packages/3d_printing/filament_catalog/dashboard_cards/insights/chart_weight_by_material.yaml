type: custom:apexcharts-card
chart_type: bar
header:
  show: true
  title: Weight by Material
apex_config:
  chart:
    height: 260
    animations:
      enabled: false
    toolbar:
      show: false
  plotOptions:
    bar:
      horizontal: false
      borderRadius: 4
  xaxis:
    type: category
    labels:
      rotate: -35
    title:
      text: Material
  yaxis:
    title:
      text: kg
  legend:
    show: false
series:
  - entity: sensor.filament_catalog_metrics
    name: kg
    color: '#42A5F5'
    data_generator: |
      const raw = entity?.attributes?.weight_by_material_json;
      let obj = {};
      if (raw && typeof raw === 'object') {
        obj = raw;
      } else if (typeof raw === 'string' && raw.trim()) {
        try { obj = JSON.parse(raw); } catch (e) { obj = {}; }
      }
      return Object.entries(obj)
        .map(([k, v]) => ({ x: k, y: Number(v || 0) / 1000 }))
        .filter(p => p.y > 0)
        .sort((a, b) => b.y - a.y)
        .slice(0, 12);
