type: custom:apexcharts-card
header:
  show: true
  title: Count by Color Family
apex_config:
  chart:
    type: bar
    height: 260
    animations:
      enabled: false
    toolbar:
      show: false
  plotOptions:
    bar:
      horizontal: false
      borderRadius: 4
  xaxis:
    type: category
    labels:
      rotate: -35
    title:
      text: Color Family
  yaxis:
    title:
      text: spools
  legend:
    show: false
series:
  - entity: sensor.filament_catalog_metrics
    name: spools
    color: '#8E24AA'
    data_generator: |
      const raw = entity?.attributes?.count_by_color_family_json;
      const obj = (raw && typeof raw === 'object') ? raw : {};
      return Object.entries(obj)
        .map(([k, v]) => [k, Number(v || 0)])
        .filter(p => p[1] > 0)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 12);
