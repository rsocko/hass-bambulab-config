type: custom:apexcharts-card
chart_type: bar
header:
  show: true
  title: Weight by Primary Color
apex_config:
  chart:
    height: 300
    animations:
      enabled: false
    toolbar:
      show: false
  plotOptions:
    bar:
      horizontal: false
      distributed: true
      borderRadius: 4
  xaxis:
    type: category
    labels:
      rotate: -45
    title:
      text: Primary Color
  yaxis:
    title:
      text: kg
  legend:
    show: false
series:
  - entity: sensor.filament_catalog_metrics
    name: kg
    type: bar
    data_generator: |
      const raw = entity?.attributes?.primary_color_weight_segments_json;
      let segs = [];
      if (Array.isArray(raw)) {
        segs = raw;
      } else if (typeof raw === 'string' && raw.trim()) {
        try { segs = JSON.parse(raw); } catch (e) { segs = []; }
      }
      return segs
        .filter(s => Number(s?.weight || 0) > 0)
        .slice(0, 15)
        .map(s => {
          const color = /^#([0-9a-f]{6})$/i.test(String(s?.hex || '')) ? s.hex : '#9e9e9e';
          return { x: s.name || 'Unknown', y: Number(s.weight || 0) / 1000, fillColor: color };
        });
