type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Alert Analytics
    icon: mdi:alert-decagram-outline
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.filament_catalog_metrics
        triggers_update: sensor.filament_catalog_metrics
        name: Low Stock
        icon: mdi:archive-alert-outline
        show_state: true
        state_display: |
          [[[ 
            const raw = entity?.attributes?.alert_counts_json || '{}';
            try { return (JSON.parse(raw).low_stock || 0) + ' spools'; } catch (e) { return '0 spools'; }
          ]]]
        tap_action:
          action: call-service
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.filament_catalog_filter_low_stock
      - type: custom:button-card
