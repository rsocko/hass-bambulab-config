type: custom:apex-direct-bar-card
title: Analytics Alerts (Tap Bars to Filter)
height: 320
value_name: spools
source_entity: sensor.filament_catalog_metrics
source_attribute: alert_counts_json
horizontal: true
show_xaxis_labels: false
max_items: 14
default_color: '#EF5350'
label_map:
  low_stock: Low Stock
  nearly_empty: Nearly Empty
  needs_repurchase: Needs Repurchase
  desiccant_overdue: Desiccant Overdue
  desiccant_red: "Desiccant Red (>75d)"
  desiccant_orange: "Desiccant Orange (>60d)"
  desiccant_yellow: "Desiccant Yellow (>45d)"
  desiccant_undefined: Desiccant Undefined
  missing_desiccant: Missing Desiccant
  needs_drying: Needs Drying
  stale: Stale
  multiple_unsealed_duplicates: Multiple Unsealed Duplicates
  duplicate_hex_colors: Duplicate Hex Colors
color_map:
  low_stock: '#EF5350'
  nearly_empty: '#F06292'
  needs_repurchase: '#43A047'
  desiccant_overdue: '#1E88E5'
  desiccant_red: '#E53935'
  desiccant_orange: '#FB8C00'
  desiccant_yellow: '#FDD835'
  desiccant_undefined: '#78909C'
  missing_desiccant: '#26C6DA'
  needs_drying: '#FFA726'
  stale: '#A1887F'
  multiple_unsealed_duplicates: '#F57C00'
  duplicate_hex_colors: '#8E24AA'
tap_actions:
  low_stock:
    action: call-service
    service: input_select.select_option
    data:
      option: Low Stock
    target:
      entity_id: input_select.filament_catalog_filter_stock_level
  nearly_empty:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_nearly_empty
  needs_repurchase:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_needs_repurchase
  desiccant_overdue:
    action: call-service
    service: input_select.select_option
    data:
      option: Needs Desiccant (Any Age)
    target:
      entity_id: input_select.filament_catalog_filter_desiccant
  desiccant_red:
    action: call-service
    service: input_select.select_option
    data:
      option: "Red (>75 days)"
    target:
      entity_id: input_select.filament_catalog_filter_desiccant
  desiccant_orange:
    action: call-service
    service: input_select.select_option
    data:
      option: "Orange (>60 \u2013 \u226475 days)"
    target:
      entity_id: input_select.filament_catalog_filter_desiccant
  desiccant_yellow:
    action: call-service
    service: input_select.select_option
    data:
      option: "Yellow (>45 \u2013 \u226460 days)"
    target:
      entity_id: input_select.filament_catalog_filter_desiccant
  desiccant_undefined:
    action: call-service
    service: input_select.select_option
    data:
      option: Undefined
    target:
      entity_id: input_select.filament_catalog_filter_desiccant
  missing_desiccant:
    action: call-service
    service: input_select.select_option
    data:
      option: Missing Desiccant
    target:
      entity_id: input_select.filament_catalog_filter_desiccant
  needs_drying:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_needs_drying
  stale:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_stale
  multiple_unsealed_duplicates:
    action: call-service
    service: script.filament_catalog_apply_quality_filter
    data:
      quality_filter: Multiple Unsealed Duplicates
      group_by_hex: false
  duplicate_hex_colors:
    action: call-service
    service: script.filament_catalog_apply_quality_filter
    data:
      quality_filter: Duplicate Hex Colors
      group_by_hex: true
