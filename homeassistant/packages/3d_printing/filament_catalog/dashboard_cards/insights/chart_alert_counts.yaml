type: custom:apex-direct-bar-card
title: Alert Analytics (Tap Bars to Filter)
height: 320
value_name: spools
source_entity: sensor.filament_catalog_metrics
source_attribute: alert_counts_json
horizontal: true
max_items: 12
default_color: '#EF5350'
label_map:
  low_stock: Low Stock
  nearly_empty: Nearly Empty
  needs_repurchase: Needs Repurchase
  desiccant_overdue: Desiccant Overdue
  missing_desiccant: Missing Desiccant
  needs_drying: Needs Drying
  stale: Stale
color_map:
  low_stock: '#EF5350'
  nearly_empty: '#F06292'
  needs_repurchase: '#FF7043'
  desiccant_overdue: '#29B6F6'
  missing_desiccant: '#26C6DA'
  needs_drying: '#FFA726'
  stale: '#9E9E9E'
tap_actions:
  low_stock:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_low_stock
  nearly_empty:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_nearly_empty
  needs_repurchase:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_needs_repurchase
  desiccant_overdue:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_desiccant_old
  missing_desiccant:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_missing_desiccant
  needs_drying:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_needs_drying
  stale:
    action: call-service
    service: input_boolean.turn_on
    target:
      entity_id: input_boolean.filament_catalog_filter_stale
