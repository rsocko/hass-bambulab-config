type: vertical-stack
cards:
  - type: custom:apexcharts-card
    header:
      show: true
      title: Alert Analytics
    graph_span: 1d
    apex_config:
      chart:
        type: bar
        height: 300
        animations:
          enabled: false
        toolbar:
          show: false
      plotOptions:
        bar:
          horizontal: true
          borderRadius: 4
      xaxis:
        title:
          text: spools
      legend:
        show: false
    series:
      - entity: sensor.filament_catalog_metrics
        name: spools
        color: '#EF5350'
        data_generator: |
          const raw = entity?.attributes?.alert_counts_json;
          const obj = (raw && typeof raw === 'object') ? raw : {};
          const labelMap = {
            low_stock: 'Low Stock',
            nearly_empty: 'Nearly Empty',
            needs_repurchase: 'Needs Repurchase',
            desiccant_overdue: 'Desiccant Overdue',
            missing_desiccant: 'Missing Desiccant',
            needs_drying: 'Needs Drying',
            stale: 'Stale'
          };
          return Object.entries(obj)
            .map(([k, v]) => ({ x: labelMap[k] || k, y: Number(v || 0) }))
            .filter(p => p.y > 0)
            .sort((a, b) => b.y - a.y);
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        name: Low Stock
        icon: mdi:archive-alert-outline
        tap_action:
          action: call-service
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.filament_catalog_filter_low_stock
      - type: custom:button-card
        name: Nearly Empty
        icon: mdi:archive-alert
        tap_action:
          action: call-service
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.filament_catalog_filter_nearly_empty
      - type: custom:button-card
        name: Repurchase
        icon: mdi:cart-alert
        tap_action:
          action: call-service
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.filament_catalog_filter_needs_repurchase
      - type: custom:button-card
        name: Desiccant
        icon: mdi:water-alert
        tap_action:
          action: call-service
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.filament_catalog_filter_desiccant_old
