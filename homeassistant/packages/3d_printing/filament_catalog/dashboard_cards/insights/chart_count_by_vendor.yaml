type: custom:apexcharts-card
header:
  show: true
  title: Count by Vendor
graph_span: 1d
apex_config:
  chart:
    type: bar
    height: 260
    animations:
      enabled: false
    toolbar:
      show: false
  plotOptions:
    bar:
      horizontal: true
      borderRadius: 4
  xaxis:
    title:
      text: spools
  legend:
    show: false
series:
  - entity: sensor.filament_catalog_metrics
    name: spools
    color: '#43A047'
    data_generator: |
      const raw = entity?.attributes?.count_by_vendor_json;
      const obj = (raw && typeof raw === 'object') ? raw : {};
      return Object.entries(obj)
        .map(([k, v]) => ({ x: k, y: Number(v || 0) }))
        .filter(p => p.y > 0)
        .sort((a, b) => b.y - a.y)
        .slice(0, 12);
