type: custom:apexcharts-card
header:
  show: true
  title: Count by Vendor
apex_config:
  chart:
    type: donut
    height: 260
    animations:
      enabled: false
    toolbar:
      show: false
  plotOptions:
    pie:
      donut:
        size: 55%
  legend:
    show: true
series:
  - entity: sensor.filament_catalog_metrics
    name: spools
    color: '#43A047'
    data_generator: |
      const raw = entity?.attributes?.count_by_vendor_json;
      let obj = {};
      if (raw && typeof raw === 'object') {
        obj = raw;
      } else if (typeof raw === 'string' && raw.trim()) {
        try { obj = JSON.parse(raw); } catch (e) { obj = {}; }
      }
      return Object.entries(obj)
        .map(([k, v]) => ({ x: k, y: Number(v || 0) }))
        .filter(p => p.y > 0)
        .sort((a, b) => b.y - a.y)
        .slice(0, 12);
