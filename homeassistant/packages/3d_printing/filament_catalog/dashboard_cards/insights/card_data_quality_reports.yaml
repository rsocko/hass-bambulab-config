type: custom:button-card
entity: sensor.filament_catalog_metrics
triggers_update: sensor.filament_catalog_metrics
show_icon: false
show_name: false
show_state: false
styles:
  card:
    - padding: 12px
    - border-radius: 12px
  custom_fields:
    body:
      - text-align: left
custom_fields:
  body: |
    [[[ 
      const safeParse = (raw, fallback) => {
        if (raw && typeof raw === 'object') return raw;
        if (typeof raw === 'string' && raw.trim()) {
          try { return JSON.parse(raw); } catch (e) { return fallback; }
        }
        return fallback;
      };
      const quality = safeParse(entity?.attributes?.data_quality_json, {});
      const duplicates = (quality.multiple_unsealed_duplicates || []).length;
      const orphans = (quality.orphan_filaments || []).length;
      const hexDupes = (quality.duplicate_hex_colors || []).length;
      const row = (label, count, color) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(120,120,120,0.15);">
          <span style="font-size:12px;">${label}</span>
          <span style="font-size:12px;font-weight:700;color:${color};">${count}</span>
        </div>`;
      return `
        <div>
          <div style="font-weight:700;font-size:13px;margin-bottom:6px;">Data Quality Reports</div>
          ${row('Multiple Unsealed Duplicates', duplicates, duplicates ? '#FF9800' : 'var(--secondary-text-color)')}
          ${row('Orphan Filaments', orphans, orphans ? '#FF9800' : 'var(--secondary-text-color)')}
          ${row('Duplicate Hex Colors', hexDupes, hexDupes ? '#FF9800' : 'var(--secondary-text-color)')}
          <div style="font-size:11px;opacity:0.7;padding-top:6px;">Derived from sensor.filament_catalog_metrics.</div>
        </div>`;
    ]]]
