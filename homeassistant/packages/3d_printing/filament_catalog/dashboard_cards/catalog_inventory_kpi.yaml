# catalog_inventory_kpi.yaml
# Filament Catalog separator header with inventory KPI sub-buttons.
# Keeps the Insights toggle in the same bar to match Print History.

type: custom:config-template-card
entities:
  - sensor.spoolman_filament_totals
  - input_boolean.filament_catalog_show_insights
card:
  type: custom:bubble-card
  card_type: separator
  name: Filament Catalog
  icon: fapro:filament-2
  entity: sensor.spoolman_filament_totals
  sub_button:
    - entity: sensor.spoolman_filament_totals
      sub_button_type: default
      name: >-
        ${(() => {
          const allSpools = Object.values(states).filter((entry) =>
            /^sensor\.spoolman_spool_\d+$/.test(entry.entity_id) &&
            !entry.attributes.archived
          );
          return `${allSpools.length} spools`;
        })()}
      icon: fapro:filament-2
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
    - entity: sensor.spoolman_filament_totals
      sub_button_type: default
      name: >-
        ${(() => {
          const allSpools = Object.values(states).filter((entry) =>
            /^sensor\.spoolman_spool_\d+$/.test(entry.entity_id) &&
            !entry.attributes.archived
          );
          const filamentIds = new Set(allSpools.map((spool) => spool.attributes.filament_id).filter(Boolean));
          return `${filamentIds.size} filaments`;
        })()}
      icon: mdi:layers-triple
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
    - entity: sensor.spoolman_filament_totals
      sub_button_type: default
      name: >-
        ${(() => {
          const allSpools = Object.values(states).filter((entry) =>
            /^sensor\.spoolman_spool_\d+$/.test(entry.entity_id) &&
            !entry.attributes.archived
          );
          const totalWeight = allSpools.reduce((sum, spool) => sum + (spool.attributes.remaining_weight || 0), 0);
          return `${(totalWeight / 1000).toFixed(1)} kg`;
        })()}
      icon: mdi:weight-gram
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
    - entity: sensor.spoolman_filament_totals
      sub_button_type: default
      name: >-
        ${(() => {
          const allSpools = Object.values(states).filter((entry) =>
            /^sensor\.spoolman_spool_\d+$/.test(entry.entity_id) &&
            !entry.attributes.archived
          );
          let totalCostPerKg = 0;
          let pricedSpoolCount = 0;
          allSpools.forEach((spool) => {
            const price = spool.attributes.price || spool.attributes.filament_price || 0;
            const initialWeight = spool.attributes.initial_weight || 1000;
            if (price > 0 && initialWeight > 0) {
              totalCostPerKg += (price / initialWeight) * 1000;
              pricedSpoolCount += 1;
            }
          });
          const average = pricedSpoolCount > 0 ? `$${(totalCostPerKg / pricedSpoolCount).toFixed(2)}/kg` : 'N/A';
          return `Avg ${average}`;
        })()}
      icon: mdi:currency-usd
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
    - entity: input_boolean.filament_catalog_show_insights
      sub_button_type: default
      name: >-
        ${states['input_boolean.filament_catalog_show_insights']?.state === 'on' ? 'Hide Insights' : 'Show Insights'}
      icon: mdi:chart-box-outline
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      state_background: ${states['input_boolean.filament_catalog_show_insights']?.state === 'on'}
      state_color: ${states['input_boolean.filament_catalog_show_insights']?.state === 'on'}
      tap_action:
        action: toggle
  styles: |
    ha-card {
      margin-top: 8px !important;
    }
    .bubble-sub-button-container,
    .bubble-sub-buttons-container {
      gap: 8px !important;
      flex-wrap: wrap !important;
    }
    .bubble-sub-button {
      width: auto !important;
      min-width: 0 !important;
      padding: 0 10px !important;
    }
    .bubble-sub-button-icon {
      --mdc-icon-size: 16px !important;
    }
    .bubble-sub-button-text {
      font-size: 12px !important;
      font-weight: 600 !important;
      white-space: nowrap !important;
    }
    .bubble-sub-button:nth-child(1) ha-icon {
      color: #42A5F5 !important;
    }
    .bubble-sub-button:nth-child(2) ha-icon {
      color: #7E57C2 !important;
    }
    .bubble-sub-button:nth-child(3) ha-icon {
      color: #26A69A !important;
    }
    .bubble-sub-button:nth-child(4) ha-icon {
      color: #66BB6A !important;
    }
