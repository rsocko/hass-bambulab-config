# catalog_inventory_kpi.yaml
# Filament Catalog separator header with inventory KPI sub-buttons.
# Keeps the Insights toggle in the same bar to match Print History.

type: custom:config-template-card
entities:
  - sensor.filament_catalog_metrics
  - input_boolean.filament_catalog_show_insights
card:
  type: custom:bubble-card
  card_type: separator
  name: Filament Catalog
  icon: fapro:filament-2
  entity: sensor.filament_catalog_metrics
  sub_button:
    - entity: sensor.filament_catalog_metrics
      sub_button_type: default
      name: >-
        ${(() => {
          const raw = states['sensor.filament_catalog_metrics']?.attributes?.inventory_summary_json;
          let summary = raw || {};
          if (typeof raw === 'string') {
            try { summary = JSON.parse(raw || '{}'); } catch (e) { summary = {}; }
          }
          return `${Number(summary?.spool_count || 0)} spools`;
        })()}
      icon: fapro:filament-2
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
    - entity: sensor.filament_catalog_metrics
      sub_button_type: default
      name: >-
        ${(() => {
          const raw = states['sensor.filament_catalog_metrics']?.attributes?.inventory_summary_json;
          let summary = raw || {};
          if (typeof raw === 'string') {
            try { summary = JSON.parse(raw || '{}'); } catch (e) { summary = {}; }
          }
          return `${Number(summary?.filament_count || 0)} filaments`;
        })()}
      icon: mdi:layers-triple
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
    - entity: sensor.filament_catalog_metrics
      sub_button_type: default
      name: >-
        ${(() => {
          const raw = states['sensor.filament_catalog_metrics']?.attributes?.inventory_summary_json;
          let summary = raw || {};
          if (typeof raw === 'string') {
            try { summary = JSON.parse(raw || '{}'); } catch (e) { summary = {}; }
          }
          return `${(Number(summary?.total_weight_grams || 0) / 1000).toFixed(1)} kg`;
        })()}
      icon: mdi:weight-gram
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
    - entity: sensor.filament_catalog_metrics
      sub_button_type: default
      name: >-
        ${(() => {
          const raw = states['sensor.filament_catalog_metrics']?.attributes?.inventory_summary_json;
          let summary = raw || {};
          if (typeof raw === 'string') {
            try { summary = JSON.parse(raw || '{}'); } catch (e) { summary = {}; }
          }
          const avgCost = Number(summary?.average_cost_per_kg);
          const average = Number.isFinite(avgCost) ? `$${avgCost.toFixed(2)}/kg` : 'N/A';
          return `Avg ${average}`;
        })()}
      icon: mdi:currency-usd
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      tap_action:
        action: none
    - entity: input_boolean.filament_catalog_show_insights
      sub_button_type: default
      name: >-
        ${states['input_boolean.filament_catalog_show_insights']?.state === 'on' ? 'Hide Insights' : 'Show Insights'}
      icon: mdi:chart-box-outline
      show_icon: true
      show_name: true
      show_state: false
      show_background: true
      fill_width: false
      state_background: ${states['input_boolean.filament_catalog_show_insights']?.state === 'on'}
      state_color: ${states['input_boolean.filament_catalog_show_insights']?.state === 'on'}
      tap_action:
        action: toggle
  styles: |
    ha-card {
      margin-top: 8px !important;
    }
    .bubble-sub-button-container,
    .bubble-sub-buttons-container {
      gap: 8px !important;
      flex-wrap: wrap !important;
    }
    .bubble-sub-button {
      width: auto !important;
      min-width: 0 !important;
      padding: 0 10px !important;
    }
    .bubble-sub-button-icon {
      --mdc-icon-size: 16px !important;
    }
    .bubble-sub-button-text {
      font-size: 12px !important;
      font-weight: 600 !important;
      white-space: nowrap !important;
    }
    .bubble-sub-button:nth-child(2) ha-icon {
      color: #42A5F5 !important;
    }
    .bubble-sub-button:nth-child(3) ha-icon {
      color: #7E57C2 !important;
    }
    .bubble-sub-button:nth-child(4) ha-icon {
      color: #42A5F5 !important;
    }
    .bubble-sub-button:nth-child(5) ha-icon {
      color: #66BB6A !important;
    }
    .bubble-sub-button:nth-child(6) ha-icon {
      color: var(--primary-color) !important;
    }
    .bubble-sub-button:nth-child(6) {
      background-color: color-mix(in srgb, var(--primary-color) 20%, var(--card-background-color)) !important;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary-color) 55%, transparent) !important;
      color: var(--primary-text-color) !important;
    }
    .bubble-sub-button:nth-child(6) .bubble-sub-button-text {
      color: var(--primary-text-color) !important;
    }
