# catalog_filter_bar.yaml
# Filter controls for the Filament Catalog phase 2 experience.

type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_text.filament_catalog_search
            name: Search Filament
            secondary_info: none
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.filament_catalog_filtered_spools
        name: Matches
        icon: mdi:counter
        show_name: true
        show_state: true
        tap_action:
          action: more-info

  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.filament_catalog_filtered_spools
    name: Catalog Filters
    icon: mdi:filter-variant
    show_state: false
    card_layout: large-sub-buttons-grid
    rows: 2
    styles: |
      .bubble-sub-button {
        min-height: 36px !important;
      }
      .bubble-sub-button-text {
        font-size: 12px !important;
      }
      /* Repurchase slider: keep it interactive but visually neutral (no bright blue fill). */
      .bubble-sub-button-6 .bubble-range-fill {
        background: rgba(140, 140, 140, 0.55) !important;
        opacity: 1 !important;
      }
      .bubble-sub-button-6 {
        --bubble-sub-slider-background-color: rgba(120, 120, 120, 0.18) !important;
      }
    sub_button:
      - entity: input_select.filament_catalog_filter_material
        sub_button_type: select
        name: Material
        icon: mdi:flask-outline
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_vendor
        sub_button_type: select
        name: Vendor
        icon: mdi:factory
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_color
        sub_button_type: select
        name: Color
        icon: mdi:palette-outline
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_color_family
        sub_button_type: select
        name: Family
        icon: mdi:format-color-fill
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_type
        sub_button_type: select
        name: Type
        icon: mdi:shape-outline
        show_name: true
        show_state: true
      - entity: input_number.filament_catalog_repurchase_threshold
        sub_button_type: slider
        name: Repurchase g
        icon: mdi:weight-gram
        show_name: true
        show_state: true
        tap_to_slide: true
      - entity: input_boolean.filament_catalog_filter_needs_repurchase
        name: Repurchase
        icon: mdi:alert-circle-outline
        show_name: true
        show_state: false
        tap_action:
          action: toggle
      - entity: input_boolean.filament_catalog_filter_desiccant_old
        name: Desiccant
        icon: mdi:water-alert
        show_name: true
        show_state: false
        tap_action:
          action: toggle
      - entity: input_boolean.filament_catalog_filter_low_stock
        name: Low Stock
        icon: mdi:archive-alert-outline
        show_name: true
        show_state: false
        tap_action:
          action: toggle
      - entity: input_boolean.filament_catalog_filter_unsealed_only
        name: Unsealed
        icon: mdi:lock-open-variant
        show_name: true
        show_state: false
        tap_action:
          action: toggle
      - name: Clear All
        icon: mdi:filter-remove
        show_name: true
        tap_action:
          action: call-service
          service: script.filament_catalog_clear_filters
