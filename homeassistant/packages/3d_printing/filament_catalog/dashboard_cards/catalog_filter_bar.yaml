          - input_select.filament_catalog_filter_vendor
          - input_select.filament_catalog_filter_color
          - input_select.filament_catalog_filter_color_family
          - input_select.filament_catalog_filter_type
          - input_select.filament_catalog_filter_location
          - input_select.filament_catalog_filter_spool_type
          - input_select.filament_catalog_filter_clip_type
          - input_select.filament_catalog_filter_inventory_rule
          - input_boolean.filament_catalog_filter_qty_to_purchase
          - input_select.filament_catalog_filter_stock_level
          - input_select.filament_catalog_filter_sealed
          - input_select.filament_catalog_filter_desiccant
          - input_select.filament_catalog_filter_data_quality
          - input_text.filament_catalog_search
          - sensor.filament_catalog_filtered_spools
        card:
          type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.filament_catalog_filtered_spools
          name: Matches
          icon: mdi:counter
          show_name: true
          show_state: true
          styles: >-
            ${(() => {
              const active = ['input_select.filament_catalog_filter_scope','input_select.filament_catalog_filter_material','input_select.filament_catalog_filter_vendor','input_select.filament_catalog_filter_color','input_select.filament_catalog_filter_color_family','input_select.filament_catalog_filter_type','input_select.filament_catalog_filter_location','input_select.filament_catalog_filter_spool_type','input_select.filament_catalog_filter_clip_type','input_select.filament_catalog_filter_inventory_rule','input_select.filament_catalog_filter_stock_level','input_select.filament_catalog_filter_sealed','input_select.filament_catalog_filter_desiccant','input_select.filament_catalog_filter_data_quality'].some((id) => {
                const stateObj = states[id];
                if (id === 'input_select.filament_catalog_filter_scope') {
                  return (stateObj?.state || 'In-Stock Spools') !== 'In-Stock Spools';
                }
                return !!(stateObj && stateObj.attributes && stateObj.attributes.options && stateObj.state !== stateObj.attributes.options[0]);
              }) || (states['input_boolean.filament_catalog_filter_qty_to_purchase']?.state === 'on') || ((states['input_text.filament_catalog_search']?.state || '').trim().length > 0);
              return `
                .bubble-button-card-container {
                  pointer-events: none !important;
                  cursor: default !important;
                }
                .bubble-sub-button-container,
                .bubble-sub-buttons-container {
                  pointer-events: auto !important;
                  justify-content: flex-start !important;
                  gap: 6px !important;
                }
                .bubble-sub-button {
                  pointer-events: auto !important;
                }
                .bubble-sub-button.clear-scope-filter,
                .bubble-sub-button.clear-material-filter,
                .bubble-sub-button.clear-vendor-filter,
                .bubble-sub-button.clear-color-filter,
                .bubble-sub-button.clear-family-filter,
                .bubble-sub-button.clear-type-filter,
                .bubble-sub-button.clear-location-filter,
                .bubble-sub-button.clear-spool-type-filter,
                .bubble-sub-button.clear-clip-type-filter,
                .bubble-sub-button.clear-inventory-rule-filter,
                .bubble-sub-button.clear-qty-to-purchase-filter,
                .bubble-sub-button.clear-stock-level-filter,
                .bubble-sub-button.clear-sealed-filter,
                .bubble-sub-button.clear-desiccant-filter,
                .bubble-sub-button.clear-data-quality-filter,
                .bubble-sub-button.clear-search-filter {
                  background-color: color-mix(in srgb, var(--accent-color) 18%, var(--card-background-color)) !important;
                  color: var(--accent-color) !important;
                  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-color) 55%, transparent) !important;
                }
                .bubble-sub-button.clear-scope-filter ha-icon,
                .bubble-sub-button.clear-material-filter ha-icon,
                .bubble-sub-button.clear-vendor-filter ha-icon,
                .bubble-sub-button.clear-color-filter ha-icon,
                .bubble-sub-button.clear-family-filter ha-icon,
                .bubble-sub-button.clear-type-filter ha-icon,
                .bubble-sub-button.clear-location-filter ha-icon,
                .bubble-sub-button.clear-spool-type-filter ha-icon,
                .bubble-sub-button.clear-clip-type-filter ha-icon,
                .bubble-sub-button.clear-inventory-rule-filter ha-icon,
                .bubble-sub-button.clear-qty-to-purchase-filter ha-icon,
                .bubble-sub-button.clear-stock-level-filter ha-icon,
                .bubble-sub-button.clear-sealed-filter ha-icon,
                .bubble-sub-button.clear-desiccant-filter ha-icon,
                .bubble-sub-button.clear-data-quality-filter ha-icon,
                .bubble-sub-button.clear-search-filter ha-icon {
                  color: var(--accent-color) !important;
                }
                ${active ? `
                .bubble-sub-button:last-child {
                  background-color: color-mix(in srgb, var(--accent-color) 18%, var(--card-background-color)) !important;
                  color: var(--accent-color) !important;
                  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-color) 55%, transparent) !important;
                }
                .bubble-sub-button:last-child ha-icon {
                  color: var(--accent-color) !important;
                }
                ` : ''}
              `;
            })()}
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          sub_button:
            - entity: input_select.filament_catalog_filter_scope
              sub_button_type: default
              name: Clear Scope Filter
              icon: mdi:view-grid
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
              visibility:
                - condition: state
                  entity: input_select.filament_catalog_filter_scope
                  state_not: "In-Stock Spools"
              tap_action:
                action: call-service
                service: input_select.select_option
                target:
                  entity_id: input_select.filament_catalog_filter_scope
                data:
                  option: "In-Stock Spools"
            - entity: input_select.filament_catalog_filter_material
              sub_button_type: default
              name: Clear Material Filter
              icon: mdi:flask-outline
              show_icon: true
              show_name: false
              show_state: false
              show_background: true
              fill_width: false
