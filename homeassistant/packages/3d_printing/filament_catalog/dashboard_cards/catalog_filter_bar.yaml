type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Filter Spools
    icon: mdi:filter-variant
  - type: custom:bubble-card
    card_type: sub-buttons
    entity: sensor.filament_catalog_filtered_spools
    hide_main_background: false
    rows: 2.313
    sub_button:
      main: []
      bottom_layout: rows
      bottom:
        - group:
            - entity: input_select.filament_catalog_filter_material
              sub_button_type: select
              name: Material
              icon: mdi:flask-outline
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_select.filament_catalog_filter_vendor
              sub_button_type: select
              name: Vendor
              icon: mdi:factory
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_select.filament_catalog_filter_color
              sub_button_type: select
              name: Color
              icon: mdi:palette-outline
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_select.filament_catalog_filter_color_family
              sub_button_type: select
              name: Family
              icon: mdi:format-color-fill
              show_name: true
              show_state: true
              fill_width: true
          buttons_layout: inline
          justify_content: fill
        - group:
            - entity: input_select.filament_catalog_filter_type
              sub_button_type: select
              name: Type
              icon: mdi:shape-outline
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_select.filament_catalog_filter_location
              sub_button_type: select
              name: Location
              icon: mdi:map-marker
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_number.filament_catalog_stock_threshold
              sub_button_type: slider
              name: Stock Threshold
              icon: mdi:weight-gram
              show_name: true
              show_state: true
              tap_to_slide: true
              fill_width: true
            - entity: input_boolean.filament_catalog_filter_low_stock
              name: Low Stock
              icon: mdi:archive-alert-outline
              show_name: true
              show_state: false
              tap_action:
                action: toggle
              fill_width: true
          buttons_layout: inline
          justify_content: fill
        - group:
            - entity: input_select.filament_catalog_filter_sealed
              sub_button_type: select
              name: Sealed
              icon: mdi:package-variant-closed
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_boolean.filament_catalog_filter_desiccant_old
              name: Desiccant
              icon: mdi:water-alert
              show_name: true
              show_state: false
              tap_action:
                action: toggle
              fill_width: true
            - entity: input_boolean.filament_catalog_large_cards
              name: Large Cards
              icon: mdi:view-grid-plus
              show_name: true
              show_state: false
              tap_action:
                action: toggle
              fill_width: true
          buttons_layout: inline
          justify_content: fill
  - type: horizontal-stack
    cards:
      - type: entities
        show_header_toggle: false
        card_mod:
          style:
            .: |
              ha-card {
                border-radius: 999px !important;
                overflow: hidden !important;
                padding: 6px 10px !important;
              }
              #states {
                padding: 0 !important;
              }
            hui-input-text-entity-row $ ha-textfield $: |
              .mdc-text-field {
                width: 95% !important;
              }
              .mdc-text-field--filled {
                height: 45px !important;
                --mdc-filled-text-field-container-height: 45px;
                display: flex !important;
                align-items: center !important;
              }
              .mdc-text-field__input {
                padding-top: 12px !important;
                padding-bottom: 2px !important;
                margin-top: 0 !important;
                align-self: center !important;
              }
              .mdc-floating-label {
                top: 50% !important;
                transform: translateY(-50%) !important;
              }
              .mdc-floating-label--float-above {
                top: 5px !important;
                transform: translateY(0) scale(0.75) !important;
              }
        entities:
          - entity: input_text.filament_catalog_search
            name: Search Filament
            secondary_info: none
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.filament_catalog_filtered_spools
        name: Matches
        icon: mdi:counter
        show_name: true
        show_state: true
        tap_action:
          action: more-info
        sub_button:
          - name: Clear All
            icon: mdi:filter-remove
            show_name: true
            tap_action:
              action: call-service
              service: script.filament_catalog_clear_filters
grid_options:
  columns: full
