type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Filter Spools
    icon: mdi:filter-variant
  - type: custom:config-template-card
    entities:
      - input_select.filament_catalog_tab
      - input_select.filament_catalog_sort
      - input_select.filament_catalog_filter_material
      - input_select.filament_catalog_filter_vendor
      - input_select.filament_catalog_filter_color
      - input_select.filament_catalog_filter_color_family
      - input_select.filament_catalog_filter_type
      - input_select.filament_catalog_filter_location
      - input_select.filament_catalog_filter_stock_level
      - input_select.filament_catalog_filter_sealed
      - input_select.filament_catalog_filter_desiccant
      - input_select.filament_catalog_filter_data_quality
      - input_boolean.filament_catalog_large_cards
      - sensor.filament_catalog_filtered_spools
    card:
      type: custom:bubble-card
      card_type: sub-buttons
      entity: sensor.filament_catalog_filtered_spools
      hide_main_background: false
      rows: 3.08
      styles: |
        .bubble-sub-button-container {
          border: 1px solid transparent;
          border-bottom-width: 2px;
          border-radius: 10px;
          transition: border-color 160ms ease, box-shadow 160ms ease;
        }
        .bubble-sub-button-container:nth-child(3) {
          border-color: ${states['input_select.filament_catalog_filter_material']?.state !== (states['input_select.filament_catalog_filter_material']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_material']?.state !== (states['input_select.filament_catalog_filter_material']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(4) {
          border-color: ${states['input_select.filament_catalog_filter_vendor']?.state !== (states['input_select.filament_catalog_filter_vendor']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_vendor']?.state !== (states['input_select.filament_catalog_filter_vendor']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(5) {
          border-color: ${states['input_select.filament_catalog_filter_color']?.state !== (states['input_select.filament_catalog_filter_color']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_color']?.state !== (states['input_select.filament_catalog_filter_color']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(6) {
          border-color: ${states['input_select.filament_catalog_filter_color_family']?.state !== (states['input_select.filament_catalog_filter_color_family']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_color_family']?.state !== (states['input_select.filament_catalog_filter_color_family']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(7) {
          border-color: ${states['input_select.filament_catalog_filter_type']?.state !== (states['input_select.filament_catalog_filter_type']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_type']?.state !== (states['input_select.filament_catalog_filter_type']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(8) {
          border-color: ${states['input_select.filament_catalog_filter_location']?.state !== (states['input_select.filament_catalog_filter_location']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_location']?.state !== (states['input_select.filament_catalog_filter_location']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(10) {
          border-color: ${states['input_select.filament_catalog_filter_stock_level']?.state !== (states['input_select.filament_catalog_filter_stock_level']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_stock_level']?.state !== (states['input_select.filament_catalog_filter_stock_level']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(11) {
          border-color: ${states['input_select.filament_catalog_filter_sealed']?.state !== (states['input_select.filament_catalog_filter_sealed']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_sealed']?.state !== (states['input_select.filament_catalog_filter_sealed']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(12) {
          border-color: ${states['input_select.filament_catalog_filter_desiccant']?.state !== (states['input_select.filament_catalog_filter_desiccant']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_desiccant']?.state !== (states['input_select.filament_catalog_filter_desiccant']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
        .bubble-sub-button-container:nth-child(13) {
          border-color: ${states['input_select.filament_catalog_filter_data_quality']?.state !== (states['input_select.filament_catalog_filter_data_quality']?.attributes?.options?.[0] ?? '') ? 'var(--accent-color)' : 'transparent'} !important;
          box-shadow: ${states['input_select.filament_catalog_filter_data_quality']?.state !== (states['input_select.filament_catalog_filter_data_quality']?.attributes?.options?.[0] ?? '') ? '0 0 0 1px color-mix(in srgb, var(--accent-color) 35%, transparent)' : 'none'};
        }
      sub_button:
        main: []
        bottom_layout: rows
        bottom:
          - group:
              - entity: input_select.filament_catalog_tab
                sub_button_type: select
                name: View
                icon: mdi:tab
                show_name: true
                show_state: true
                fill_width: true
              - entity: input_select.filament_catalog_sort
                sub_button_type: select
                name: Sort
                icon: mdi:sort
                show_name: true
                show_state: true
                fill_width: true
            buttons_layout: inline
            justify_content: fill
          - group:
              - entity: input_select.filament_catalog_filter_material
                sub_button_type: select
                name: Material
                icon: mdi:flask-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_material']?.state !== (states['input_select.filament_catalog_filter_material']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_material']?.state !== (states['input_select.filament_catalog_filter_material']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.filament_catalog_filter_vendor
                sub_button_type: select
                name: Vendor
                icon: mdi:factory
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_vendor']?.state !== (states['input_select.filament_catalog_filter_vendor']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_vendor']?.state !== (states['input_select.filament_catalog_filter_vendor']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.filament_catalog_filter_color
                sub_button_type: select
                name: Color
                icon: mdi:palette-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_color']?.state !== (states['input_select.filament_catalog_filter_color']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_color']?.state !== (states['input_select.filament_catalog_filter_color']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.filament_catalog_filter_color_family
                sub_button_type: select
                name: Family
                icon: mdi:format-color-fill
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_color_family']?.state !== (states['input_select.filament_catalog_filter_color_family']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_color_family']?.state !== (states['input_select.filament_catalog_filter_color_family']?.attributes?.options?.[0] ?? '')}
                fill_width: true
            buttons_layout: inline
            justify_content: fill
          - group:
              - entity: input_select.filament_catalog_filter_type
                sub_button_type: select
                name: Type
                icon: mdi:shape-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_type']?.state !== (states['input_select.filament_catalog_filter_type']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_type']?.state !== (states['input_select.filament_catalog_filter_type']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.filament_catalog_filter_location
                sub_button_type: select
                name: Location
                icon: mdi:map-marker
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_location']?.state !== (states['input_select.filament_catalog_filter_location']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_location']?.state !== (states['input_select.filament_catalog_filter_location']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_number.filament_catalog_stock_threshold
                sub_button_type: slider
                name: Stock Threshold
                icon: mdi:weight-gram
                show_name: true
                show_state: true
                tap_to_slide: true
                fill_width: true
              - entity: input_select.filament_catalog_filter_stock_level
                sub_button_type: select
                name: Stock Level
                icon: mdi:archive-alert-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_stock_level']?.state !== (states['input_select.filament_catalog_filter_stock_level']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_stock_level']?.state !== (states['input_select.filament_catalog_filter_stock_level']?.attributes?.options?.[0] ?? '')}
                fill_width: true
            buttons_layout: inline
            justify_content: fill
          - group:
              - entity: input_select.filament_catalog_filter_sealed
                sub_button_type: select
                name: Sealed
                icon: mdi:package-variant-closed
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_sealed']?.state !== (states['input_select.filament_catalog_filter_sealed']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_sealed']?.state !== (states['input_select.filament_catalog_filter_sealed']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.filament_catalog_filter_desiccant
                sub_button_type: select
                name: Desiccant
                icon: mdi:water-alert
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_desiccant']?.state !== (states['input_select.filament_catalog_filter_desiccant']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_desiccant']?.state !== (states['input_select.filament_catalog_filter_desiccant']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_select.filament_catalog_filter_data_quality
                sub_button_type: select
                name: Data Quality
                icon: mdi:clipboard-alert-outline
                show_name: true
                show_state: true
                show_background: true
                state_background: ${states['input_select.filament_catalog_filter_data_quality']?.state !== (states['input_select.filament_catalog_filter_data_quality']?.attributes?.options?.[0] ?? '')}
                state_color: ${states['input_select.filament_catalog_filter_data_quality']?.state !== (states['input_select.filament_catalog_filter_data_quality']?.attributes?.options?.[0] ?? '')}
                fill_width: true
              - entity: input_boolean.filament_catalog_large_cards
                name: Large Cards
                icon: mdi:view-grid-plus
                show_name: true
                show_state: false
                tap_action:
                  action: toggle
                fill_width: true
            buttons_layout: inline
            justify_content: fill
  - type: horizontal-stack
    cards:
      - type: entities
        show_header_toggle: false
        card_mod:
          style:
            .: |
              ha-card {
                border-radius: 999px !important;
                overflow: hidden !important;
                padding: 6px 10px !important;
              }
              #states {
                padding: 0 !important;
              }
            hui-input-text-entity-row $ ha-textfield $: |
              .mdc-text-field {
                width: 95% !important;
              }
              .mdc-text-field--filled {
                height: 45px !important;
                --mdc-filled-text-field-container-height: 45px;
                display: flex !important;
                align-items: center !important;
              }
              .mdc-text-field__input {
                padding-top: 12px !important;
                padding-bottom: 2px !important;
                margin-top: 0 !important;
                align-self: center !important;
              }
              .mdc-floating-label {
                top: 50% !important;
                transform: translateY(-50%) !important;
              }
              .mdc-floating-label--float-above {
                top: 5px !important;
                transform: translateY(0) scale(0.75) !important;
              }
        entities:
          - entity: input_text.filament_catalog_search
            name: Search Filament
            secondary_info: none
      - type: custom:config-template-card
        entities:
          - input_select.filament_catalog_filter_material
          - input_select.filament_catalog_filter_vendor
          - input_select.filament_catalog_filter_color
          - input_select.filament_catalog_filter_color_family
          - input_select.filament_catalog_filter_type
          - input_select.filament_catalog_filter_location
          - input_select.filament_catalog_filter_stock_level
          - input_select.filament_catalog_filter_sealed
          - input_select.filament_catalog_filter_desiccant
          - input_select.filament_catalog_filter_data_quality
          - sensor.filament_catalog_filtered_spools
        card:
          type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.filament_catalog_filtered_spools
          name: Matches
          icon: mdi:counter
          show_name: true
          show_state: true
          tap_action:
            action: more-info
          sub_button:
            - name: Clear Filters
              icon: mdi:filter-remove
              show_name: true
              show_background: true
              state_background: ${(['input_select.filament_catalog_filter_material','input_select.filament_catalog_filter_vendor','input_select.filament_catalog_filter_color','input_select.filament_catalog_filter_color_family','input_select.filament_catalog_filter_type','input_select.filament_catalog_filter_location','input_select.filament_catalog_filter_stock_level','input_select.filament_catalog_filter_sealed','input_select.filament_catalog_filter_desiccant','input_select.filament_catalog_filter_data_quality'].some((id) => states[id]?.state !== (states[id]?.attributes?.options?.[0] ?? '')))}
              state_color: ${(['input_select.filament_catalog_filter_material','input_select.filament_catalog_filter_vendor','input_select.filament_catalog_filter_color','input_select.filament_catalog_filter_color_family','input_select.filament_catalog_filter_type','input_select.filament_catalog_filter_location','input_select.filament_catalog_filter_stock_level','input_select.filament_catalog_filter_sealed','input_select.filament_catalog_filter_desiccant','input_select.filament_catalog_filter_data_quality'].some((id) => states[id]?.state !== (states[id]?.attributes?.options?.[0] ?? '')))}
              tap_action:
                action: call-service
                service: script.filament_catalog_clear_filters
grid_options:
  columns: full
