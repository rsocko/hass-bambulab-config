# catalog_filter_bar.yaml
# Filter controls for the Filament Catalog phase 2 experience.

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: sub-buttons
    entity: sensor.filament_catalog_filtered_spools
    name: Filter Spools
    icon: mdi:filter-variant
    show_name: true
    show_icon: true
    show_state: false
    hide_main_background: false
    rows: 3
    sub_button:
      main: []
      bottom_layout: rows
      bottom:
        - group:
            - entity: input_select.filament_catalog_filter_material
              sub_button_type: select
              name: Material
              icon: mdi:flask-outline
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_select.filament_catalog_filter_vendor
              sub_button_type: select
              name: Vendor
              icon: mdi:factory
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_select.filament_catalog_filter_color
              sub_button_type: select
              name: Color
              icon: mdi:palette-outline
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_select.filament_catalog_filter_color_family
              sub_button_type: select
              name: Family
              icon: mdi:format-color-fill
              show_name: true
              show_state: true
              fill_width: true
          buttons_layout: inline
          justify_content: fill
        - group:
            - entity: input_select.filament_catalog_filter_type
              sub_button_type: select
              name: Type
              icon: mdi:shape-outline
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_select.filament_catalog_filter_location
              sub_button_type: select
              name: Location
              icon: mdi:map-marker
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_number.filament_catalog_stock_threshold
              sub_button_type: slider
              name: Stock Threshold
              icon: mdi:weight-gram
              show_name: true
              show_state: true
              tap_to_slide: true
              fill_width: true
            - entity: input_boolean.filament_catalog_filter_low_stock
              name: Low Stock
              icon: mdi:archive-alert-outline
              show_name: true
              show_state: false
              tap_action:
                action: toggle
              fill_width: true
          buttons_layout: inline
          justify_content: fill
        - group:
            - entity: input_select.filament_catalog_filter_sealed
              sub_button_type: select
              name: Sealed
              icon: mdi:package-variant-closed
              show_name: true
              show_state: true
              fill_width: true
            - entity: input_boolean.filament_catalog_filter_desiccant_old
              name: Desiccant
              icon: mdi:water-alert
              show_name: true
              show_state: false
              tap_action:
                action: toggle
              fill_width: true
          buttons_layout: inline
          justify_content: fill

  - type: horizontal-stack
    cards:
      - type: entities
        show_header_toggle: false
        card_mod:
          style:
            .: |
              ha-card {
                padding-top: 0 !important;
                padding-bottom: 0 !important;
              }
              #states {
                padding-top: 0 !important;
                padding-bottom: 0 !important;
              }
            hui-input-text-entity-row $: |
              .mdc-text-field,
              ha-textfield {
                --mdc-filled-text-field-container-height: 44px;
                min-height: 44px !important;
                height: 44px !important;
              }
        entities:
          - entity: input_text.filament_catalog_search
            name: Search Filament
            secondary_info: none
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.filament_catalog_filtered_spools
        name: Matches
        icon: mdi:counter
        show_name: true
        show_state: true
        tap_action:
          action: more-info
        sub_button:
          - name: Clear All
            icon: mdi:filter-remove
            show_name: true
            tap_action:
              action: call-service
              service: script.filament_catalog_clear_filters
