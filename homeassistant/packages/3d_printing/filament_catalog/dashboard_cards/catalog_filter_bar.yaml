    card:
      type: custom:bubble-card
      card_type: separator
      name: Filters
      icon: mdi:filter-variant
      sub_button:
        - entity: input_select.filament_catalog_tab
          sub_button_type: select
          name: View
          icon: mdi:format-list-group
          show_name: true
          show_state: true
          show_background: true
          fill_width: false
        - entity: input_select.filament_catalog_sort
          sub_button_type: select
          name: Sort
          icon: mdi:sort
          show_name: true
          show_state: true
          show_background: true
          fill_width: false
        - entity: input_boolean.filament_catalog_compact_cards
          sub_button_type: default
          name: Compact
          icon: mdi:arrow-collapse
          show_name: true
          show_state: false
          show_background: true
          fill_width: false
          state_background: ${(states['input_boolean.filament_catalog_compact_cards']?.state ?? 'off') === 'on'}
          state_color: ${(states['input_boolean.filament_catalog_compact_cards']?.state ?? 'off') === 'on'}
          tap_action:
            action: toggle
  - type: custom:config-template-card
