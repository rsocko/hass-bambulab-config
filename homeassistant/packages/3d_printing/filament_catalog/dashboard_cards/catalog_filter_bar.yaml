# catalog_filter_bar.yaml
# Filter controls for the Filament Catalog phase 2 experience.

type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_text.filament_catalog_search
            name: Search Filament
            secondary_info: none
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.filament_catalog_filtered_spools
        name: Matches
        icon: mdi:counter
        show_name: true
        show_state: true
        tap_action:
          action: more-info
        sub_button:
          - name: Clear All
            icon: mdi:filter-remove
            show_name: true
            tap_action:
              action: call-service
              service: script.filament_catalog_clear_filters

  - type: custom:bubble-card
    card_type: sub-buttons
    hide_main_background: true
    styles: |
      ha-card {
        margin-top: 8px !important;
      }
      .bubble-sub-button-container {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 8px !important;
        width: 100% !important;
      }
      .bubble-sub-button {
        min-height: 36px !important;
        flex: 1 1 calc(25% - 8px) !important;
        min-width: 170px !important;
      }
      .bubble-sub-button-text {
        font-size: 12px !important;
      }
      /* Neutralize stock-threshold slider chip while keeping slider behavior. */
      .bubble-sub-button-7 .bubble-sub-button-background,
      .bubble-sub-button-7 .bubble-sub-button {
        background: rgba(40, 40, 40, 0.95) !important;
      }
      .bubble-sub-button-7 .bubble-range-fill,
      .bubble-sub-button-7 .bubble-sub-slider .bubble-range-fill {
        background: rgba(130, 130, 130, 0.45) !important;
        opacity: 1 !important;
      }
      .bubble-sub-button-7 .bubble-sub-slider,
      .bubble-sub-button-7 .bubble-sub-button-slider-1 {
        --bubble-sub-slider-background-color: rgba(120, 120, 120, 0.18) !important;
      }
    sub_button:
      - entity: input_select.filament_catalog_filter_material
        sub_button_type: select
        name: Material
        icon: mdi:flask-outline
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_vendor
        sub_button_type: select
        name: Vendor
        icon: mdi:factory
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_color
        sub_button_type: select
        name: Color
        icon: mdi:palette-outline
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_color_family
        sub_button_type: select
        name: Family
        icon: mdi:format-color-fill
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_type
        sub_button_type: select
        name: Type
        icon: mdi:shape-outline
        show_name: true
        show_state: true
      - entity: input_select.filament_catalog_filter_location
        sub_button_type: select
        name: Location
        icon: mdi:map-marker
        show_name: true
        show_state: true
      - entity: input_number.filament_catalog_stock_threshold
        sub_button_type: slider
        name: Stock Threshold
        icon: mdi:weight-gram
        show_name: true
        show_state: true
        tap_to_slide: true
      - entity: input_boolean.filament_catalog_filter_low_stock
        name: Low Stock
        icon: mdi:archive-alert-outline
        show_name: true
        show_state: false
        tap_action:
          action: toggle
      - entity: input_select.filament_catalog_filter_sealed
        sub_button_type: select
        name: Sealed
        icon: mdi:package-variant-closed
        show_name: true
        show_state: true
      - entity: input_boolean.filament_catalog_filter_desiccant_old
        name: Desiccant
        icon: mdi:water-alert
        show_name: true
        show_state: false
        tap_action:
          action: toggle
