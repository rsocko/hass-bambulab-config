# catalog_filter_bar.yaml
# Filter controls for the Filament Catalog phase 2 experience.

type: vertical-stack
cards:
  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: input_text.filament_catalog_search
        name: Search
      - type: tile
        entity: input_select.filament_catalog_filter_material
        name: Material
      - type: tile
        entity: input_select.filament_catalog_filter_vendor
        name: Vendor
      - type: tile
        entity: input_select.filament_catalog_filter_color
        name: Color
      - type: tile
        entity: input_select.filament_catalog_filter_color_family
        name: Family
      - type: tile
        entity: input_select.filament_catalog_filter_type
        name: Type
  - type: custom:mushroom-chips-card
    chips:
      - type: entity
        entity: input_number.filament_catalog_repurchase_threshold
        name: Repurchase g
        content_info: state
        tap_action:
          action: more-info
      - type: action
        icon: mdi:filter-remove
        icon_color: green
        tap_action:
          action: call-service
          service: script.filament_catalog_clear_filters
        hold_action:
          action: more-info
          entity: sensor.filament_catalog_filtered_spools
  - type: custom:mushroom-chips-card
    chips:
      - type: entity
        entity: input_boolean.filament_catalog_filter_needs_repurchase
        name: Needs Repurchase
        icon_color: red
        content_info: none
        tap_action:
          action: toggle
      - type: entity
        entity: input_boolean.filament_catalog_filter_desiccant_old
        name: Desiccant Old
        icon_color: orange
        content_info: none
        tap_action:
          action: toggle
      - type: entity
        entity: input_boolean.filament_catalog_filter_low_stock
        name: Low Stock
        icon_color: amber
        content_info: none
        tap_action:
          action: toggle
      - type: entity
        entity: input_boolean.filament_catalog_filter_unsealed_only
        name: Unsealed
        icon_color: blue
        content_info: none
        tap_action:
          action: toggle
      - type: action
        icon: mdi:filter-remove
        icon_color: green
        tap_action:
          action: call-service
          service: script.filament_catalog_clear_filters
        hold_action:
          action: more-info
          entity: sensor.filament_catalog_filtered_spools
