# catalog_filter_bar.yaml
# Filter controls for the Filament Catalog phase 2 experience.

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: sub-buttons-only
    rows: 2
    sub_button:
      bottom:
        - entity: input_select.filament_catalog_filter_material
          name: Material
          icon: mdi:flask-outline
          show_name: true
          show_state: true
          show_background: true
        - entity: input_select.filament_catalog_filter_vendor
          name: Vendor
          icon: mdi:factory
          show_name: true
          show_state: true
          show_background: true
        - entity: input_select.filament_catalog_filter_color
          name: Color
          icon: mdi:palette-outline
          show_name: true
          show_state: true
          show_background: true
        - entity: input_select.filament_catalog_filter_color_family
          name: Family
          icon: mdi:format-color-fill
          show_name: true
          show_state: true
          show_background: true
        - entity: input_select.filament_catalog_filter_type
          name: Type
          icon: mdi:shape-outline
          show_name: true
          show_state: true
          show_background: true
        - entity: sensor.filament_catalog_filtered_spools
          name: Matches
          icon: mdi:counter
          show_name: true
          show_state: true
          show_background: false

  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: input_text.filament_catalog_search
    name: Search
    icon: mdi:magnify
    tap_action:
      action: more-info
    sub_button:
      bottom:
        - icon: mdi:close-circle-outline
          name: Clear
          show_name: true
          tap_action:
            action: call-service
            service: input_text.set_value
            target:
              entity_id: input_text.filament_catalog_search
            data:
              value: ""

  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: input_number.filament_catalog_repurchase_threshold
    name: Repurchase Threshold (g)
    icon: mdi:weight-gram
    sub_button:
      bottom:
        - icon: mdi:minus
          name: "-"
          show_name: true
          tap_action:
            action: call-service
            service: input_number.decrement
            target:
              entity_id: input_number.filament_catalog_repurchase_threshold
        - icon: mdi:plus
          name: "+"
          show_name: true
          tap_action:
            action: call-service
            service: input_number.increment
            target:
              entity_id: input_number.filament_catalog_repurchase_threshold

  - type: custom:bubble-card
    card_type: sub-buttons-only
    sub_button:
      bottom:
        - entity: input_boolean.filament_catalog_filter_needs_repurchase
          name: Repurchase
          icon: mdi:alert-circle-outline
          show_name: true
          show_state: false
          show_background: true
          tap_action:
            action: toggle
        - entity: input_boolean.filament_catalog_filter_desiccant_old
          name: Desiccant
          icon: mdi:water-alert
          show_name: true
          show_state: false
          show_background: true
          tap_action:
            action: toggle
        - entity: input_boolean.filament_catalog_filter_low_stock
          name: Low Stock
          icon: mdi:archive-alert-outline
          show_name: true
          show_state: false
          show_background: true
          tap_action:
            action: toggle
        - entity: input_boolean.filament_catalog_filter_unsealed_only
          name: Unsealed
          icon: mdi:package-variant-open
          show_name: true
          show_state: false
          show_background: true
          tap_action:
            action: toggle
        - icon: mdi:filter-remove
          name: Clear All
          show_name: true
          show_background: true
          tap_action:
            action: call-service
            service: script.filament_catalog_clear_filters
