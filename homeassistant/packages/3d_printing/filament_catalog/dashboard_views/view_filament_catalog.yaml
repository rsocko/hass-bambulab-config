# view_filament_catalog.yaml
# Filament Catalog view - Default/Compact spool grid with
# tabbed grouping (By Location/Material/Vendor/Color Family/Alerts/All)
# and configurable sort order.
#
# Group headers are catalog_group_header button-cards in the same flat
# grid. They span all columns via JS DOM traversal in the template
# (sets grid-column: 1/-1 on the parent grid-item wrapper).
#
# Still only ONE auto-entities visible at a time (critical perf constraint).
#
# Uses conditional cards to switch between default and compact card styles
# based on input_boolean.filament_catalog_compact_cards toggle.
# Both grids: 4 columns on desktop, 2 columns on mobile (via card_mod).
#
# Docs: docs/features/filament_catalog/filament-catalog.md

title: Filament Catalog
path: filament-catalog
icon: mdi:format-list-bulleted
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        :host {
          overflow-x: hidden !important;
        }
    cards:
      # ============================================================
      # Inventory KPI Summary + Insights Toggle (#695)
      # ============================================================
      - !include ../dashboard_cards/catalog_inventory_kpi.yaml

      # ============================================================
      # Insights Charts (conditionally shown)
      # ============================================================
      - !include ../dashboard_cards/catalog_insights_panel.yaml

      # ============================================================
      # Phase 3: Tray assignment status + inline tray picker
      # ============================================================
      - !include ../../spoolman_sync/dashboard_cards/tray_assignment_status_and_picker.yaml

      # ============================================================
      # Filters, Tabs & Sort (Phase 2 + Phase 4)
      # ============================================================
      - !include ../dashboard_cards/catalog_filter_bar.yaml

      # ============================================================
      # All Spools — Default grid (4 columns desktop, 2 mobile)
      # Group headers use catalog_group_header template which
      # spans all columns via JS DOM traversal.
      # ============================================================
      - type: conditional
        conditions:
          - entity: input_boolean.filament_catalog_compact_cards
            state_not: "on"
        card:
          type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            columns: 4
            square: false
            card_mod:
              style: |
                @media (max-width: 768px) {
                  #root {
                    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                  }
                }
          card_param: cards
          filter:
            template: >
              {% set sensor_state = states('sensor.filament_catalog_filtered_spools') %}
              {% set cards = namespace(items=[]) %}
              {% if sensor_state in ['unknown', 'unavailable', 'none', 'None', ''] %}
                {% for spool in states.sensor %}
                  {% if spool.entity_id is match('^sensor\\.spoolman_spool_\\d+$') %}
                    {% set archived_raw = spool.attributes.get('archived', false) %}
                    {% set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] %}
                    {% if not archived %}
                      {% set cards.items = cards.items + [{
                        'entity': spool.entity_id,
                        'type': 'custom:button-card',
                        'template': 'catalog_spool_card'
                      }] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% else %}
                {% set gj = state_attr('sensor.filament_catalog_filtered_spools', 'grouped_entity_ids_json') | default('[]', true) %}
                {% if gj is string %}
                  {% set groups = gj | from_json %}
                {% elif gj is iterable %}
                  {% set groups = gj | list %}
                {% else %}
                  {% set groups = [] %}
                {% endif %}
                {% for group in groups %}
                  {% if group.get('name', '') != '' %}
                    {% set cards.items = cards.items + [{
                      'type': 'custom:button-card',
                      'template': 'catalog_group_header',
                      'entity': 'sensor.filament_catalog_filtered_spools',
                      'triggers_update': 'sensor.filament_catalog_filtered_spools',
                      'variables': {
                        'groupName': group.name,
                        'groupCount': group.count
                      }
                    }] %}
                  {% endif %}
                  {% for entity_id in group.get('entities', []) %}
                    {% set template_name = 'catalog_filament_card' if entity_id is match('^sensor\\.spoolman_filament_\\d+$') else 'catalog_spool_card' %}
                    {% set cards.items = cards.items + [{
                      'entity': entity_id,
                      'type': 'custom:button-card',
                      'template': template_name
                    }] %}
                  {% endfor %}
                {% endfor %}
              {% endif %}
              {{ cards.items | tojson }}

      # ============================================================
      # All Spools — Compact grid (4 columns desktop, 2 mobile)
      # Vertically-oriented cards with fewer details.
      # ============================================================
      - type: conditional
        conditions:
          - entity: input_boolean.filament_catalog_compact_cards
            state: "on"
        card:
          type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            columns: 4
            square: false
            card_mod:
              style: |
                @media (max-width: 768px) {
                  #root {
                    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                  }
                }
          card_param: cards
          filter:
            template: >
              {% set sensor_state = states('sensor.filament_catalog_filtered_spools') %}
              {% set cards = namespace(items=[]) %}
              {% if sensor_state in ['unknown', 'unavailable', 'none', 'None', ''] %}
                {% for spool in states.sensor %}
                  {% if spool.entity_id is match('^sensor\\.spoolman_spool_\\d+$') %}
                    {% set archived_raw = spool.attributes.get('archived', false) %}
                    {% set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] %}
                    {% if not archived %}
                      {% set cards.items = cards.items + [{
                        'entity': spool.entity_id,
                        'type': 'custom:button-card',
                        'template': 'catalog_spool_card_compact'
                      }] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% else %}
                {% set gj = state_attr('sensor.filament_catalog_filtered_spools', 'grouped_entity_ids_json') | default('[]', true) %}
                {% if gj is string %}
                  {% set groups = gj | from_json %}
                {% elif gj is iterable %}
                  {% set groups = gj | list %}
                {% else %}
                  {% set groups = [] %}
                {% endif %}
                {% for group in groups %}
                  {% if group.get('name', '') != '' %}
                    {% set cards.items = cards.items + [{
                      'type': 'custom:button-card',
                      'template': 'catalog_group_header',
                      'entity': 'sensor.filament_catalog_filtered_spools',
                      'triggers_update': 'sensor.filament_catalog_filtered_spools',
                      'variables': {
                        'groupName': group.name,
                        'groupCount': group.count
                      }
                    }] %}
                  {% endif %}
                  {% for entity_id in group.get('entities', []) %}
                    {% set template_name = 'catalog_filament_card_compact' if entity_id is match('^sensor\\.spoolman_filament_\\d+$') else 'catalog_spool_card_compact' %}
                    {% set cards.items = cards.items + [{
                      'entity': entity_id,
                      'type': 'custom:button-card',
                      'template': template_name
                    }] %}
                  {% endfor %}
                {% endfor %}
              {% endif %}
              {{ cards.items | tojson }}
