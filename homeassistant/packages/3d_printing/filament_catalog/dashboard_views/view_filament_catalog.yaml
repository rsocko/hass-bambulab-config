# view_filament_catalog.yaml
# Filament Catalog view - Phase 1: Compact spool grid.
#
# Displays all non-archived spools sorted by location,
# with an inventory KPI summary at the top.
#
# Uses a SINGLE auto-entities instance (not per-location) to minimize
# state-change processing and keep the main thread responsive.
#
# Docs: docs/features/filament_catalog/filament-catalog.md

title: Filament Catalog
path: filament-catalog
icon: mdi:format-list-bulleted
panel: true
cards:
  - type: vertical-stack
    cards:
      # ============================================================
      # Inventory KPI Summary
      # ============================================================
      - !include ../dashboard_cards/catalog_inventory_kpi.yaml

      # ============================================================
      # Filters & Search (Phase 2)
      # ============================================================
      - !include ../dashboard_cards/catalog_filter_bar.yaml

      # ============================================================
      # All Spools (single auto-entities, sorted by location)
      # ============================================================
      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 5
          square: false
        card_param: cards
        filter:
          template: >
            {% set sensor_state = states('sensor.filament_catalog_filtered_spools') %}
            {% set cards = namespace(items=[]) %}
            {% if sensor_state in ['unknown', 'unavailable', 'none', 'None', ''] %}
              {% for spool in states.sensor %}
                {% if spool.entity_id is match('^sensor\\.spoolman_spool_\\d+$') %}
                  {% set archived_raw = spool.attributes.get('archived', false) %}
                  {% set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] %}
                  {% if not archived %}
                    {% set cards.items = cards.items + [{
                      'entity': spool.entity_id,
                      'type': 'custom:button-card',
                      'template': 'catalog_spool_card'
                    }] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% else %}
              {% set filtered_json = state_attr('sensor.filament_catalog_filtered_spools', 'entity_ids_json') | default('[]', true) %}
              {% if filtered_json is string %}
                {% set filtered = filtered_json | from_json %}
              {% elif filtered_json is iterable %}
                {% set filtered = filtered_json | list %}
              {% else %}
                {% set filtered = [] %}
              {% endif %}
              {% for entity_id in filtered %}
                {% set cards.items = cards.items + [{
                  'entity': entity_id,
                  'type': 'custom:button-card',
                  'template': 'catalog_spool_card'
                }] %}
              {% endfor %}
            {% endif %}
            {{ cards.items | tojson }}
        sort:
          method: attribute
          attribute: location
