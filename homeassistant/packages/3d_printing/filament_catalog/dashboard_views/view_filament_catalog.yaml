# view_filament_catalog.yaml
# Filament Catalog view - Phase 1: Location-grouped compact spool grid.
#
# Displays all non-archived spools grouped by physical location,
# with an inventory KPI summary at the top.
# Location headers self-hide when empty (count === 0).
# Grid auto-entities hide when empty (show_empty: false).
#
# Uses native sections view type (max_columns: 1) for reliable
# navigation and full-width rendering.
#
# Docs: docs/features/filament_catalog/filament-catalog.md

title: Filament Catalog
path: filament-catalog
icon: mdi:format-list-bulleted
type: sections
max_columns: 1
sections:
  # ============================================================
  # KPI Summary Section
  # ============================================================
  - type: grid
    cards:
      - !include ../dashboard_cards/catalog_inventory_kpi.yaml

  # ============================================================
  # Spool Grid Section
  # All location headers + grids inside a single layout-card
  # (layout-card is needed for auto-entities compatibility).
  # ============================================================
  - type: grid
    cards:
      - type: custom:layout-card
        layout_type: custom:vertical-layout
        cards:

          # --- AMS ---
          - type: custom:button-card
            template: catalog_location_header
            entity: sensor.spoolman_filament_totals
            variables:
              locationName: "AMS"
              locationIcon: "fapro:filament-2"
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 5
              square: false
            card_param: cards
            filter:
              include:
                - entity_id: /^sensor\.spoolman_spool_\d+$/
                  attributes:
                    location: "AMS"
                  options:
                    type: custom:button-card
                    template: catalog_spool_card
              exclude:
                - attributes:
                    archived: true
            sort:
              method: friendly_name

