# view_filament_catalog.yaml
# Filament Catalog view — Phase 1: Location-grouped compact spool grid.
#
# Displays all non-archived spools grouped by physical location,
# with an inventory KPI summary at the top.
# Each location section auto-hides when empty (show_empty: false).
#
# Uses custom:vertical-layout (layout-card) for efficient DOM handling.
# Docs: docs/features/filament_catalog/filament-catalog.md

title: Filament Catalog
path: filament-catalog
icon: mdi:format-list-bulleted
type: custom:vertical-layout
cards:
  # ============================================================
  # Inventory KPI Summary
  # ============================================================
  - !include ../dashboard_cards/catalog_inventory_kpi.yaml

  # ============================================================
  # Location Sections (ordered by preference)
  # Each location has a header + grid pair.
  # Both use show_empty: false so they auto-hide when empty.
  # ============================================================

  # --- AMS ---
  - type: custom:auto-entities
    show_empty: false
    card:
      type: custom:button-card
      template: catalog_location_header
      entity: sensor.spoolman_filament_totals
      variables:
        locationName: "AMS"
        locationIcon: "fapro:filament-2"
    filter:
      include:
        - entity_id: /^sensor\.spoolman_spool_\d+$/
          attributes:
            location: "AMS"
      exclude:
        - attributes:
            archived: true
  - type: custom:auto-entities
    show_empty: false
    card:
      type: grid
      columns: 5
      square: false
    card_param: cards
    filter:
      include:
        - entity_id: /^sensor\.spoolman_spool_\d+$/
          attributes:
            location: "AMS"
          options:
            type: custom:button-card
            template: catalog_spool_card
      exclude:
        - attributes:
            archived: true
    sort:
      method: friendly_name

