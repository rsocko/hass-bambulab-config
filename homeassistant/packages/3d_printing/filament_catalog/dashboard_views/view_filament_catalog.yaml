# view_filament_catalog.yaml
# Filament Catalog view - Phase 1-4: Compact/Large spool grid with
# tabbed grouping (By Location/Material/Vendor/Color Family/Alerts/All)
# and configurable sort order.
#
# Group headers use type:markdown cards inside the same flat grid.
# card_mod on the grid uses CSS :has() to make markdown card wrappers
# span all columns (grid-column: 1 / -1). This avoids nested card
# structures that auto-entities can't handle.
#
# Still only ONE auto-entities visible at a time (critical perf constraint).
#
# Uses conditional cards to switch between compact (5 col) and large (3 col)
# grid based on input_boolean.filament_catalog_large_cards toggle.
#
# Docs: docs/features/filament_catalog/filament-catalog.md

title: Filament Catalog
path: filament-catalog
icon: mdi:format-list-bulleted
panel: true
cards:
  - type: vertical-stack
    cards:
      # ============================================================
      # Inventory KPI Summary
      # ============================================================
      - !include ../dashboard_cards/catalog_inventory_kpi.yaml

      # ============================================================
      # Filters, Tabs & Sort (Phase 2 + Phase 4)
      # ============================================================
      - !include ../dashboard_cards/catalog_filter_bar.yaml

      # ============================================================
      # All Spools — Compact grid (5 columns, default)
      # Group headers are type:markdown cards that span all columns
      # via card_mod CSS :has() on the grid card.
      # ============================================================
      - type: conditional
        conditions:
          - entity: input_boolean.filament_catalog_large_cards
            state_not: "on"
        card:
          type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            columns: 5
            square: false
            card_mod:
              style: |
                div:has(> hui-markdown-card) {
                  grid-column: 1 / -1 !important;
                }
          card_param: cards
          filter:
            template: >
              {% set sensor_state = states('sensor.filament_catalog_filtered_spools') %}
              {% set cards = namespace(items=[]) %}
              {% if sensor_state in ['unknown', 'unavailable', 'none', 'None', ''] %}
                {% for spool in states.sensor %}
                  {% if spool.entity_id is match('^sensor\\.spoolman_spool_\\d+$') %}
                    {% set archived_raw = spool.attributes.get('archived', false) %}
                    {% set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] %}
                    {% if not archived %}
                      {% set cards.items = cards.items + [{
                        'entity': spool.entity_id,
                        'type': 'custom:button-card',
                        'template': 'catalog_spool_card'
                      }] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% else %}
                {% set gj = state_attr('sensor.filament_catalog_filtered_spools', 'grouped_entity_ids_json') | default('[]', true) %}
                {% if gj is string %}
                  {% set groups = gj | from_json %}
                {% elif gj is iterable %}
                  {% set groups = gj | list %}
                {% else %}
                  {% set groups = [] %}
                {% endif %}
                {% for group in groups %}
                  {% if group.get('name', '') != '' %}
                    {% set hc = '<div style="display:flex;align-items:center;width:100%"><span style="font-size:13px;font-weight:600;color:var(--primary-text-color)">' ~ (group.name | e) ~ '</span><span style="font-size:11px;color:var(--secondary-text-color);margin-left:6px">(' ~ group.count ~ ')</span><div style="flex:1;height:1px;background:var(--divider-color,rgba(255,255,255,0.12));margin-left:10px"></div></div>' %}
                    {% set cards.items = cards.items + [{
                      'type': 'markdown',
                      'content': hc,
                      'card_mod': {
                        'style': 'ha-card { background:none !important; border:none !important; box-shadow:none !important; padding:6px 4px 0 4px !important; margin:0 !important; }'
                      }
                    }] %}
                  {% endif %}
                  {% for entity_id in group.get('entities', []) %}
                    {% set cards.items = cards.items + [{
                      'entity': entity_id,
                      'type': 'custom:button-card',
                      'template': 'catalog_spool_card'
                    }] %}
                  {% endfor %}
                {% endfor %}
              {% endif %}
              {{ cards.items | tojson }}

      # ============================================================
      # All Spools — Large grid (3 columns)
      # Same grouped logic, wider cards.
      # ============================================================
      - type: conditional
        conditions:
          - entity: input_boolean.filament_catalog_large_cards
            state: "on"
        card:
          type: custom:auto-entities
          show_empty: false
          card:
            type: grid
            columns: 3
            square: false
            card_mod:
              style: |
                div:has(> hui-markdown-card) {
                  grid-column: 1 / -1 !important;
                }
          card_param: cards
          filter:
            template: >
              {% set sensor_state = states('sensor.filament_catalog_filtered_spools') %}
              {% set cards = namespace(items=[]) %}
              {% if sensor_state in ['unknown', 'unavailable', 'none', 'None', ''] %}
                {% for spool in states.sensor %}
                  {% if spool.entity_id is match('^sensor\\.spoolman_spool_\\d+$') %}
                    {% set archived_raw = spool.attributes.get('archived', false) %}
                    {% set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] %}
                    {% if not archived %}
                      {% set cards.items = cards.items + [{
                        'entity': spool.entity_id,
                        'type': 'custom:button-card',
                        'template': 'catalog_spool_card'
                      }] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% else %}
                {% set gj = state_attr('sensor.filament_catalog_filtered_spools', 'grouped_entity_ids_json') | default('[]', true) %}
                {% if gj is string %}
                  {% set groups = gj | from_json %}
                {% elif gj is iterable %}
                  {% set groups = gj | list %}
                {% else %}
                  {% set groups = [] %}
                {% endif %}
                {% for group in groups %}
                  {% if group.get('name', '') != '' %}
                    {% set hc = '<div style="display:flex;align-items:center;width:100%"><span style="font-size:13px;font-weight:600;color:var(--primary-text-color)">' ~ (group.name | e) ~ '</span><span style="font-size:11px;color:var(--secondary-text-color);margin-left:6px">(' ~ group.count ~ ')</span><div style="flex:1;height:1px;background:var(--divider-color,rgba(255,255,255,0.12));margin-left:10px"></div></div>' %}
                    {% set cards.items = cards.items + [{
                      'type': 'markdown',
                      'content': hc,
                      'card_mod': {
                        'style': 'ha-card { background:none !important; border:none !important; box-shadow:none !important; padding:6px 4px 0 4px !important; margin:0 !important; }'
                      }
                    }] %}
                  {% endif %}
                  {% for entity_id in group.get('entities', []) %}
                    {% set cards.items = cards.items + [{
                      'entity': entity_id,
                      'type': 'custom:button-card',
                      'template': 'catalog_spool_card'
                    }] %}
                  {% endfor %}
                {% endfor %}
              {% endif %}
              {{ cards.items | tojson }}
