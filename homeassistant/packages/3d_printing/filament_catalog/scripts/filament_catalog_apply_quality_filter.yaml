# Docs: docs/features/filament_catalog/filament-catalog.md
filament_catalog_apply_quality_filter:
  alias: Filament Catalog Apply Quality Filter
  description: Apply a data quality filter and optionally switch grouping to hex color.
  fields:
    quality_filter:
      description: All, Multiple Unsealed Duplicates, or Duplicate Hex Colors
      example: Duplicate Hex Colors
    group_by_hex:
      description: When true, switches the catalog tab to By Hex Color.
      example: true
  sequence:
    - variables:
        quality_option: >-
          {% set valid = ['All', 'Multiple Unsealed Duplicates', 'Duplicate Hex Colors'] %}
          {{ quality_filter if quality_filter in valid else 'All' }}
        should_group_by_hex: "{{ group_by_hex | default(false) in [true, 'true', 'True', 1, '1', 'on', 'On'] }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.filament_catalog_filter_data_quality
      data:
        option: "{{ quality_option }}"
    - if:
        - condition: template
          value_template: "{{ should_group_by_hex and quality_option == 'Duplicate Hex Colors' }}"
      then:
        - action: input_select.select_option
          target:
            entity_id: input_select.filament_catalog_tab
          data:
            option: By Hex Color
