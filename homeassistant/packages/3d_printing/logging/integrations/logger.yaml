# Docs: docs/features/logging/README.md
# Home Assistant Logger Configuration
# This file configures logging levels and filters for Home Assistant
# Include this in your configuration.yaml with: logger: !include logging/logger.yaml

# Default logging level for all components
default: info

# Specific component logging levels
logs:
  # Bambuddy print-history browser integration (temporary diagnostics)
  custom_components.bambuddy: debug
  custom_components.bambuddy.manager: debug

  # Spoolman dynamic extra-field entity callbacks (temporary diagnostics)
  custom_components.spoolman: debug
  custom_components.spoolman.sensor: debug

  # Coordinator callback tracing for the startup warning investigation
  homeassistant.helpers.update_coordinator: debug

  # Bambu Lab Spoolman Sync - All automation logs
  homeassistant.components.bambulab.spoolman_sync: info
  
  # Bambu Lab Printer Integration
  homeassistant.components.bambulab: info
  custom_components.bambulab: info
    custom_components.bambu_lab: debug
    custom_components.bambu_lab.pybambu: debug
    paho.mqtt.client: debug
  
  # Spoolman Integration
  homeassistant.components.spoolman: info
  custom_components.spoolman: info
  
  # WLED Integration (for printer status LEDs)
  homeassistant.components.wled: warning
  
  # Automation and Script execution
  homeassistant.components.automation: info
  homeassistant.components.script: info
  
  # REST API calls (Spoolman API)
  homeassistant.components.rest: warning
  homeassistant.components.rest_command: warning
  
  # Template sensors
  homeassistant.components.template: warning
  
  # Event system (for print events)
  homeassistant.core: warning
  homeassistant.components.event: info

# Log filtering options:
# - critical: Critical failures only
# - error: Errors and above
# - warning: Warnings and above
# - info: Info messages and above
# - debug: All messages including debug
# - notset: Inherit from parent logger

# To enable debug logging for troubleshooting, change specific component to 'debug'
# Example: homeassistant.components.bambulab.spoolman_sync: debug
