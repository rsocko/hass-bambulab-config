# Docs: docs/features/openhasp_display/README.md
- alias: OpenHASP Printer Controls (Stop/Pause/Resume)
  id: openhasp_printer_controls_stop_pause_resume
  description: >
    Handles top-right printer control button presses from the ESP32-S3 5" OpenHASP
    dashboard. Follows xTouch 2.8" pattern: only Pause OR Resume is visible at a
    time (never both), and the Stop button is always visible but only active when
    printing or paused.

    Stop button shows a confirmation dialog before executing. The dialog auto-dismisses
    after 15 seconds if no response (treating it as NO). Tapping the dark overlay
    background also dismisses (same as NO). Inspired by xTouch 2.8" Confirm Panel
    overlay pattern but with inverted button colors (YES = red/destructive).

    Button layout (printer2.jsonl):
      - p1b84: Stop button (btn) - always visible
      - p1b86: Pause button (btn) - shown when actively printing
      - p1b88: Resume button (btn) - shown when paused
    Icons (p1b85/87/89) are img objects with click:false, so touches pass through
    to the btn underneath.

    Stop confirmation dialog (printer2.jsonl):
      - p1b90: Full-screen dim overlay (click captures touch to block objects below)
      - p1b91: Dialog box container
      - p1b92: "Stop the print?" title label
      - p1b93: NO button (default/safe - neutral gray)
      - p1b94: YES - STOP button (destructive - bright red)

  triggers:
    - trigger: mqtt
      topic: hasp/officetouch5/state/p1b84
      payload: '{"event":"up"}'
      id: stop
    - trigger: mqtt
      topic: hasp/officetouch5/state/p1b86
      payload: '{"event":"up"}'
      id: pause
    - trigger: mqtt
      topic: hasp/officetouch5/state/p1b88
      payload: '{"event":"up"}'
      id: start

  conditions: []

  actions:
    - variables:
        smart_status: "{{ states('sensor.ntk_ryansoffice_3dprinter_smart_status') | lower }}"
        status_class: "{{ state_attr('sensor.ntk_ryansoffice_3dprinter_smart_status', 'status_class') | default('', true) | lower }}"
        is_paused: "{{ status_class == 'paused' or smart_status == 'paused' }}"
        is_active: >-
          {{
            status_class in ['printing', 'active'] or
            smart_status in ['printing', 'preparing', 'heating', 'leveling']
          }}
        can_stop: "{{ is_active or is_paused }}"
        can_pause: "{{ is_active and not is_paused }}"
        can_start: "{{ is_paused }}"

    - choose:
        # Stop: show confirmation dialog, wait for response
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'stop' and can_stop }}"
          sequence:
            # Show the confirmation overlay (all 5 objects)
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b90.hidden"
                payload: "0"
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b91.hidden"
                payload: "0"
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b92.hidden"
                payload: "0"
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b93.hidden"
                payload: "0"
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b94.hidden"
                payload: "0"

            # Wait for YES, NO, overlay tap, or 15-second timeout
            - wait_for_trigger:
                - trigger: mqtt
                  topic: "hasp/officetouch5/state/p1b94"
                  payload: '{"event":"up"}'
                  id: confirm_yes
                - trigger: mqtt
                  topic: "hasp/officetouch5/state/p1b93"
                  payload: '{"event":"up"}'
                  id: confirm_no
                - trigger: mqtt
                  topic: "hasp/officetouch5/state/p1b90"
                  payload: '{"event":"up"}'
                  id: confirm_overlay_dismiss
              timeout:
                seconds: 15

            # If user confirmed YES, execute the stop
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none and wait.trigger.id == 'confirm_yes' }}"
              then:
                - action: button.press
                  target:
                    entity_id: button.ntk_ryansoffice_3dprinter_stop_printing

            # Always hide the confirmation overlay (whether YES, NO, overlay tap, or timeout)
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b90.hidden"
                payload: "1"
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b91.hidden"
                payload: "1"
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b92.hidden"
                payload: "1"
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b93.hidden"
                payload: "1"
            - action: mqtt.publish
              data:
                topic: "hasp/officetouch5/command/p1b94.hidden"
                payload: "1"

        # Pause
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'pause' and can_pause }}"
          sequence:
            - action: button.press
              target:
                entity_id: button.ntk_ryansoffice_3dprinter_pause_printing

        # Resume
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'start' and can_start }}"
          sequence:
            - action: button.press
              target:
                entity_id: button.ntk_ryansoffice_3dprinter_resume_printing

  mode: single
