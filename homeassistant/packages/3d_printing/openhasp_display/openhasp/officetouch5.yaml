  - obj: p1b19 # Spool B3
    properties:
      "bg_color": '{{ state_attr("sensor.p1s_01p00c460102350_ams_2_tray_3", "color")[:7] }}'
      "border_width": '{{ 10 if state_attr("sensor.p1s_01p00c460102350_ams_2_tray_3", "active") else 2 }}'
      "border_color": '{{ "#2097f3" if state_attr("sensor.p1s_01p00c460102350_ams_2_tray_3", "active") else "#1a1a1a" }}'
  - obj: p1b20 # Spool B4
