objects:
  - obj: p1b2 # Arc
    properties:
      "val": '{{ states("sensor.ntk_ryansoffice_3dprinter_print_progress")  }}'
  - obj: p1b3 # Arc
    properties:
      "val": '{{ states("sensor.ntk_ryansoffice_3dprinter_current_layer")  }}'
      "max": '{{ states("sensor.ntk_ryansoffice_3dprinter_total_layer_count")  }}'
  - obj: p1b4 # Arc
    properties:
      "val": '{{ states("sensor.ntk_ryansoffice_3dprinter_remaining_time")  }}'
      "max": '{{ states("sensor.total_estimated_print_time")  }}'
  - obj: p1b5 # Label
    properties:
      "text": '{{ states("sensor.ntk_ryansoffice_3dprinter_print_progress")  }}%'
  - obj: p1b7 # Label
    properties:
      "text": '{{ states("sensor.ntk_ryansoffice_3dprinter_current_layer")  }}/{{ states("sensor.ntk_ryansoffice_3dprinter_total_layer_count")  }}'
  - obj: p1b14 # Label
    properties:
      "text": '{{ states("sensor.print_time_remaining_formatted")  }}'
  - obj: p1b29 # Label of end time
    properties:
      "text": '{{ states("sensor.print_end_time_friendly")  }}'
  - obj: p3b53 # Weight panel total label
    properties:
      "text": 'Total: {{ states("sensor.ntk_ryansoffice_3dprinter_print_weight") | float(0) | round(1) }}g'
  - obj: p3b54 # Cost panel total label
    properties:
      "text": 'Total: ${{ states("sensor.print_cost") | float(0) | round(2) }}'
  - obj: p3b71 # Weight panel legend/detail
    properties:
      "text": >
        {% set a1 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 1') | float(0) %}
        {% set a2 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 2') | float(0) %}
        {% set a3 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 3') | float(0) %}
        {% set a4 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 4') | float(0) %}
        {% set b1 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 2 Tray 1') | float(0) %}
        {% set b2 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 2 Tray 2') | float(0) %}
        {% set b3 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 2 Tray 3') | float(0) %}
        {% set b4 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 2 Tray 4') | float(0) %}
        {% set ext = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'External Spool') | float(0) %}
        {% set total = a1 + a2 + a3 + a4 + b1 + b2 + b3 + b4 + ext %}
        A1: {{ a1 | round(1) }}g ({{ ((a1 / total) * 100) | round(1) if total > 0 else 0 }}%)
        A2: {{ a2 | round(1) }}g ({{ ((a2 / total) * 100) | round(1) if total > 0 else 0 }}%)
        A3: {{ a3 | round(1) }}g ({{ ((a3 / total) * 100) | round(1) if total > 0 else 0 }}%)
        A4: {{ a4 | round(1) }}g ({{ ((a4 / total) * 100) | round(1) if total > 0 else 0 }}%)
        B1: {{ b1 | round(1) }}g ({{ ((b1 / total) * 100) | round(1) if total > 0 else 0 }}%)
        B2: {{ b2 | round(1) }}g ({{ ((b2 / total) * 100) | round(1) if total > 0 else 0 }}%)
        B3: {{ b3 | round(1) }}g ({{ ((b3 / total) * 100) | round(1) if total > 0 else 0 }}%)
        B4: {{ b4 | round(1) }}g ({{ ((b4 / total) * 100) | round(1) if total > 0 else 0 }}%)
        Ext: {{ ext | round(1) }}g ({{ ((ext / total) * 100) | round(1) if total > 0 else 0 }}%)
  - obj: p3b72 # Cost panel legend/detail
    properties:
      "text": >
        {% set breakdown = state_attr('sensor.print_cost', 'breakdown') %}
        {% if breakdown is mapping %}
        {% set c1 = (breakdown.get('ams_1_tray_1', {}).get('cost', 0) | float(0)) %}
        {% set c2 = (breakdown.get('ams_1_tray_2', {}).get('cost', 0) | float(0)) %}
        {% set c3 = (breakdown.get('ams_1_tray_3', {}).get('cost', 0) | float(0)) %}
        {% set c4 = (breakdown.get('ams_1_tray_4', {}).get('cost', 0) | float(0)) %}
        {% set c5 = (breakdown.get('ams_2_tray_1', {}).get('cost', 0) | float(0)) %}
        {% set c6 = (breakdown.get('ams_2_tray_2', {}).get('cost', 0) | float(0)) %}
        {% set c7 = (breakdown.get('ams_2_tray_3', {}).get('cost', 0) | float(0)) %}
        {% set c8 = (breakdown.get('ams_2_tray_4', {}).get('cost', 0) | float(0)) %}
        {% set c9 = (breakdown.get('external_spool', {}).get('cost', 0) | float(0)) %}
        {% set w1 = (breakdown.get('ams_1_tray_1', {}).get('weight', 0) | float(0)) %}
        {% set w2 = (breakdown.get('ams_1_tray_2', {}).get('weight', 0) | float(0)) %}
        {% set w3 = (breakdown.get('ams_1_tray_3', {}).get('weight', 0) | float(0)) %}
        {% set w4 = (breakdown.get('ams_1_tray_4', {}).get('weight', 0) | float(0)) %}
        {% set w5 = (breakdown.get('ams_2_tray_1', {}).get('weight', 0) | float(0)) %}
        {% set w6 = (breakdown.get('ams_2_tray_2', {}).get('weight', 0) | float(0)) %}
        {% set w7 = (breakdown.get('ams_2_tray_3', {}).get('weight', 0) | float(0)) %}
        {% set w8 = (breakdown.get('ams_2_tray_4', {}).get('weight', 0) | float(0)) %}
        {% set w9 = (breakdown.get('external_spool', {}).get('weight', 0) | float(0)) %}
        {% set p1 = (breakdown.get('ams_1_tray_1', {}).get('price_per_kg', 0) | float(0)) %}
        {% set p2 = (breakdown.get('ams_1_tray_2', {}).get('price_per_kg', 0) | float(0)) %}
        {% set p3 = (breakdown.get('ams_1_tray_3', {}).get('price_per_kg', 0) | float(0)) %}
        {% set p4 = (breakdown.get('ams_1_tray_4', {}).get('price_per_kg', 0) | float(0)) %}
        {% set p5 = (breakdown.get('ams_2_tray_1', {}).get('price_per_kg', 0) | float(0)) %}
        {% set p6 = (breakdown.get('ams_2_tray_2', {}).get('price_per_kg', 0) | float(0)) %}
        {% set p7 = (breakdown.get('ams_2_tray_3', {}).get('price_per_kg', 0) | float(0)) %}
        {% set p8 = (breakdown.get('ams_2_tray_4', {}).get('price_per_kg', 0) | float(0)) %}
        {% set p9 = (breakdown.get('external_spool', {}).get('price_per_kg', 0) | float(0)) %}
        {% set s1 = breakdown.get('ams_1_tray_1', {}).get('price_source', '') %}
        {% set s2 = breakdown.get('ams_1_tray_2', {}).get('price_source', '') %}
        {% set s3 = breakdown.get('ams_1_tray_3', {}).get('price_source', '') %}
        {% set s4 = breakdown.get('ams_1_tray_4', {}).get('price_source', '') %}
        {% set s5 = breakdown.get('ams_2_tray_1', {}).get('price_source', '') %}
        {% set s6 = breakdown.get('ams_2_tray_2', {}).get('price_source', '') %}
        {% set s7 = breakdown.get('ams_2_tray_3', {}).get('price_source', '') %}
        {% set s8 = breakdown.get('ams_2_tray_4', {}).get('price_source', '') %}
        {% set s9 = breakdown.get('external_spool', {}).get('price_source', '') %}
        {% set has_default = s1 == 'default' or s2 == 'default' or s3 == 'default' or s4 == 'default' or s5 == 'default' or s6 == 'default' or s7 == 'default' or s8 == 'default' or s9 == 'default' %}
        {% set total = c1 + c2 + c3 + c4 + c5 + c6 + c7 + c8 + c9 %}
        A1: ${{ c1 | round(2) }} ({{ w1 | round(1) }}g @ ${{ p1 | round(2) }}/kg{{ ' *' if s1 == 'default' else '' }})
        A2: ${{ c2 | round(2) }} ({{ w2 | round(1) }}g @ ${{ p2 | round(2) }}/kg{{ ' *' if s2 == 'default' else '' }})
        A3: ${{ c3 | round(2) }} ({{ w3 | round(1) }}g @ ${{ p3 | round(2) }}/kg{{ ' *' if s3 == 'default' else '' }})
        A4: ${{ c4 | round(2) }} ({{ w4 | round(1) }}g @ ${{ p4 | round(2) }}/kg{{ ' *' if s4 == 'default' else '' }})
        B1: ${{ c5 | round(2) }} ({{ w5 | round(1) }}g @ ${{ p5 | round(2) }}/kg{{ ' *' if s5 == 'default' else '' }})
        B2: ${{ c6 | round(2) }} ({{ w6 | round(1) }}g @ ${{ p6 | round(2) }}/kg{{ ' *' if s6 == 'default' else '' }})
        B3: ${{ c7 | round(2) }} ({{ w7 | round(1) }}g @ ${{ p7 | round(2) }}/kg{{ ' *' if s7 == 'default' else '' }})
        B4: ${{ c8 | round(2) }} ({{ w8 | round(1) }}g @ ${{ p8 | round(2) }}/kg{{ ' *' if s8 == 'default' else '' }})
        Ext: ${{ c9 | round(2) }} ({{ w9 | round(1) }}g @ ${{ p9 | round(2) }}/kg{{ ' *' if s9 == 'default' else '' }})
        {{ '* default price in use for one or more spools' if has_default else '' }}
        {% else %}
        No print active or no cost data available
        {% endif %}
  - obj: p1b10 # Spool A1
    properties:
      "bg_color": '{{ state_attr("sensor.p1s_01p00c460102350_ams_1_tray_1", "color")[:7] }}'
      "border_width": '{{ 10 if state_attr("sensor.p1s_01p00c460102350_ams_1_tray_1", "active") else 2 }}'
      "border_color": '{{ "#2097f3" if state_attr("sensor.p1s_01p00c460102350_ams_1_tray_1", "active") else "#1a1a1a" }}'
