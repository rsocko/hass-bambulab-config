        {% set w8 = ((c8 / total) * 320) | round(0) | int if total > 0 else 0 %}
        {{ 422 + w1 + w2 + w3 + w4 + w5 + w6 + w7 + w8 }}
      "w": >
        {% set breakdown = state_attr('sensor.print_cost', 'breakdown') %}
        {% set c1 = (breakdown.get('ams_1_tray_1', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set c2 = (breakdown.get('ams_1_tray_2', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set c3 = (breakdown.get('ams_1_tray_3', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set c4 = (breakdown.get('ams_1_tray_4', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set c5 = (breakdown.get('ams_2_tray_1', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set c6 = (breakdown.get('ams_2_tray_2', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set c7 = (breakdown.get('ams_2_tray_3', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set c8 = (breakdown.get('ams_2_tray_4', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set c9 = (breakdown.get('external_spool', {}).get('cost', 0) | float(0)) if breakdown is mapping else 0 %}
        {% set total = c1 + c2 + c3 + c4 + c5 + c6 + c7 + c8 + c9 %}
        {{ ((c9 / total) * 320) | round(0) | int if total > 0 else 0 }}
