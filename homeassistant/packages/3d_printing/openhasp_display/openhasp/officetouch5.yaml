        {% set w1 = ((a1 / total) * 320) | round(0) | int if total > 0 else 0 %}
        {{ bar_x + w1 }}
      "w": >
        {% set bar_w = 320 %}
        {% set a1 = state_attr('sensor.ntk_ryansoffice_3dprinter_print_weight', 'AMS 1 Tray 1') | float(0) %}
