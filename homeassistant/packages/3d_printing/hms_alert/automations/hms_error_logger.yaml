# Docs: docs/features/hms_alert/hms-error-alert-implementation.md
# Log HMS errors to logbook and system_log when the printer reports them.
# This automation fires when the display wrapper transitions to 'on' (real
# errors only — test-mode changes are excluded).  Each concurrent error is
# iterated and logged individually so that every code, severity, and wiki
# link is captured for later triage.
- alias: "HMS Alert: Log Errors"
  id: hms_alert_log_errors
  description: >-
    Write HMS hardware/firmware errors to logbook and system_log
    for persistent, searchable records.
  mode: queued
  max: 10

  trigger:
    - platform: state
      entity_id: binary_sensor.hms_alert_display_wrapper
      to: "on"

  condition:
    # Only log real printer errors, never test-mode scenarios
    - condition: template
      value_template: >-
        {{ state_attr('binary_sensor.hms_alert_display_wrapper', 'source') == 'real' }}

  action:
    - variables:
        error_count: >-
          {{ state_attr('binary_sensor.hms_alert_display_wrapper', 'Count')
             | int(0) }}
        timestamp: "{{ now().isoformat() }}"

    # --- Iterate over each reported error (up to 3) ---
    - repeat:
        count: "{{ error_count }}"
        sequence:
          - variables:
              idx: "{{ repeat.index }}"
              error_text: >-
                {{ state_attr('binary_sensor.hms_alert_display_wrapper',
                   idx ~ '-Error') | default('Unknown error') }}
              error_code: >-
                {{ state_attr('binary_sensor.hms_alert_display_wrapper',
                   idx ~ '-Code') | default('N/A') }}
              severity: >-
                {{ state_attr('binary_sensor.hms_alert_display_wrapper',
                   idx ~ '-Severity') | default('unknown') }}
              wiki: >-
                {{ state_attr('binary_sensor.hms_alert_display_wrapper',
                   idx ~ '-Wiki') | default('') }}

          # Persistent logbook entry (survives restarts, visible in entity history)
          - service: logbook.log
            data:
              name: "HMS Alert"
              message: >-
                [{{ severity | upper }}] {{ error_code }} — {{ error_text }}{% if wiki %} ({{ wiki }}){% endif %}
              entity_id: binary_sensor.hms_alert_display_wrapper

          # System log entry (visible in Settings > System > Logs)
          - service: system_log.write
            data:
              message: >-
                HMS Alert: [{{ severity | upper }}] {{ error_code }} — {{ error_text }}{% if wiki %} Wiki: {{ wiki }}{% endif %}
              level: >-
                {% if severity in ['critical', 'serious'] %}error{% else %}warning{% endif %}
              logger: homeassistant.components.bambulab.hms_alerts

    # Note: persistent_notification and mobile push are handled by the
    # notifications feature (hms_error_notification.yaml).  This automation
    # is responsible only for logbook + system_log records.
