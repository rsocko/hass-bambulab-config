# Unified HMS Error Alert Section
# Responsive card that works on both mobile and desktop.
# - Single header banner: tap to expand/collapse, hold for more-info
# - CSS chevron indicator on the right shows expand/collapse state
# - Expanded details use a single button-card renderer with wrapped per-error cards
# - Minimal-performance variant: no pulsing/glow animations
# - Details visibility controlled by input_boolean.hms_alert_show_details
type: grid
visibility:
  - condition: state
    entity: binary_sensor.hms_alert_display_wrapper
    state: 'on'
cards:
  - type: vertical-stack
    cards:
      # ── Header Banner ──────────────────────────────────────────
      - type: custom:mushroom-template-card
        entity: input_boolean.hms_alert_show_details
        primary: HMS ERROR ALERT
        secondary: >-
          {%- set entity = 'binary_sensor.hms_alert_display_wrapper' -%}
          {%- set count = state_attr(entity, 'Count') -%}
          {%- if count is none -%}
            {%- set count = state_attr(entity, 'count') -%}
          {%- endif -%}
          {%- set c = count | int(0) -%}
          {%- if c == 1 -%}
            {%- set legacy = state_attr(entity, 'errors') -%}
            {%- if legacy is iterable and legacy is not string and (legacy | count > 0) -%}
              {{ legacy[0].attr | default(legacy[0].text | default('1 Error')) }}
            {%- else -%}
              {{ state_attr(entity, '1-Error') | default('1 Error') }}
            {%- endif -%}
          {%- elif c > 1 -%}
            {{ c }} Errors
          {%- else -%}
            Error Detected
          {%- endif -%}
        icon: mdi:alert-circle
        icon_color: red
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
          entity: binary_sensor.hms_alert_display_wrapper
        card_mod:
          style:
            ha-card: |
              ha-card {
                background: rgba(183, 28, 28, 0.22);
                border: 2px solid rgba(244,67,54,0.9);
                border-radius: 14px;
                --card-mod-icon-color: red;
                position: relative;
              }
              ha-card::after {
                content: '{% if is_state("input_boolean.hms_alert_show_details", "on") %}▲{% else %}▼{% endif %}';
                position: absolute;
                right: 18px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 1.2rem;
                color: rgba(255,255,255, {% if is_state("input_boolean.hms_alert_show_details", "on") %}0.9{% else %}0.45{% endif %});
                pointer-events: none;
              }
            mushroom-card$mushroom-state-info$: |
              .primary {
                font-size: 1.5rem !important;
                font-weight: 900 !important;
                letter-spacing: 0.04em;
              }
              .secondary {
                font-size: 1rem !important;
                font-weight: 600 !important;
                white-space: normal !important;
                line-height: 1.35 !important;
                opacity: 0.92;
              }
              @media (max-width: 600px) {
                .primary  { font-size: 1.2rem !important; }
                .secondary { font-size: 0.92rem !important; }
              }
      # ── Error Details (Conditional) ────────────────────────────
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.hms_alert_show_details
            state: "on"
        card:
          type: custom:button-card
          entity: binary_sensor.hms_alert_display_wrapper
          show_name: false
          show_state: false
          show_icon: false
          tap_action:
            action: none
          custom_fields:
            details: |
              [[[ 
                var entity = states['binary_sensor.hms_alert_display_wrapper'];
                if (!entity) {
                  return '<div class="hms-empty">No error details available.</div>';
                }

                var attrs = entity.attributes || {};
                var legacy = Array.isArray(attrs.errors) ? attrs.errors : [];
                var items = [];

                if (legacy.length > 0) {
                  for (var li = 0; li < legacy.length; li += 1) {
                    var le = legacy[li] || {};
                    items.push({
                      text: le.attr || le.text || 'No description available',
                      code: le.code || 'Unknown',
                      severity: le.severity || 'unknown',
                      wiki: le.wiki || ''
                    });
                  }
                } else {
                  var rawCount = (attrs.Count !== undefined && attrs.Count !== null) ? attrs.Count : attrs.count;
                  var count = parseInt(rawCount || 0, 10) || 0;
                  for (var i = 1; i <= count; i += 1) {
                    items.push({
                      text: attrs[i + '-Error'] || 'No description available',
                      code: attrs[i + '-Code'] || 'Unknown',
                      severity: attrs[i + '-Severity'] || 'unknown',
                      wiki: attrs[i + '-Wiki'] || ''
                    });
                  }
                }

                if (items.length === 0) {
                  return '<div class="hms-empty">No error details available.</div>';
                }

                var escapeHtml = function(value) {
                  return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                };

                var getIcon = function(raw) {
                  var sev = String(raw || 'unknown').toLowerCase();
                  if (sev.indexOf('critical') !== -1 || sev.indexOf('serious') !== -1 || sev.indexOf('fatal') !== -1 || sev.indexOf('high') !== -1) return '🔴';
                  if (sev.indexOf('medium') !== -1 || sev.indexOf('warn') !== -1) return '🟠';
                  if (sev.indexOf('minor') !== -1 || sev.indexOf('low') !== -1) return '🟡';
                  return '⚪';
                };

                var html = '<div class="hms-list">';
                for (var idx = 0; idx < items.length; idx += 1) {
                  var it = items[idx];
                  var icon = getIcon(it.severity);
                  var severity = escapeHtml(it.severity || 'unknown');
                  var text = escapeHtml(it.text);
                  var code = escapeHtml(it.code);
                  var wiki = String(it.wiki || '');
                  var wikiHtml = wiki ? ' - <a href="' + wiki + '" target="_blank" rel="noopener noreferrer">Troubleshooting Wiki</a>' : '';

                  html += '<div class="hms-line">';
                  html += '<div><strong>' + icon + ' Error ' + (idx + 1) + '</strong> (' + severity + ')</div>';
                  html += '<div>' + text + '</div>';
                  html += '<div><code>' + code + '</code>' + wikiHtml + '</div>';
                  html += '</div>';
                }
                html += '</div>';
                return html;
              ]]]
          styles:
            card:
              - background: var(--card-background-color, var(--ha-card-background, #1c1c1c))
              - border: 2px solid rgba(244,67,54,0.9)
              - border-top: none
              - border-radius: 0 0 14px 14px
              - box-shadow: none
              - padding: 12px 16px 16px 16px
              - margin-top: -8px
            custom_fields:
              details:
                - width: 100%
                - text-align: left
                - justify-self: start
                - align-self: start
          extra_styles: |
            .hms-list {
              text-align: left;
            }
            .hms-line {
              margin-bottom: 12px;
              line-height: 1.5;
            }
            .hms-line:last-child {
              margin-bottom: 0;
            }
            .hms-line code {
              font-size: 0.88em;
            }
            .hms-line a {
              color: #64b5f6;
            }
            .hms-empty {
              color: var(--secondary-text-color);
              text-align: left;
            }
    grid_options:
      columns: full
column_span: 3
