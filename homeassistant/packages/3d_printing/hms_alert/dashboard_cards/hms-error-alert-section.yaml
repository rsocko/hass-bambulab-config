# Unified HMS Error Alert Section
# Responsive card that works on both mobile and desktop.
# - Single header banner: tap to expand/collapse, hold for more-info
# - CSS chevron indicator on the right shows expand/collapse state
# - Error detail cards rendered via button-card JavaScript for better performance
# - Details visibility controlled by input_boolean.hms_alert_show_details
type: grid
visibility:
  - condition: state
    entity: binary_sensor.hms_alert_display_wrapper
    state: 'on'
cards:
  - type: vertical-stack
    cards:
      # ── Header Banner ──────────────────────────────────────────
      - type: custom:mushroom-template-card
        entity: input_boolean.hms_alert_show_details
        primary: HMS ERROR ALERT
        secondary: >-
          {%- set entity = 'binary_sensor.hms_alert_display_wrapper' -%}
          {%- set count = state_attr(entity, 'Count') -%}
          {%- if count is none -%}
            {%- set count = state_attr(entity, 'count') -%}
          {%- endif -%}
          {%- set c = count | int(0) -%}
          {%- if c == 1 -%}
            {%- set legacy = state_attr(entity, 'errors') -%}
            {%- if legacy is iterable and legacy is not string and (legacy | count > 0) -%}
              {{ legacy[0].attr | default(legacy[0].text | default('1 Error')) }}
            {%- else -%}
              {{ state_attr(entity, '1-Error') | default('1 Error') }}
            {%- endif -%}
          {%- elif c > 1 -%}
            {{ c }} Errors
          {%- else -%}
            Error Detected
          {%- endif -%}
        icon: mdi:alert-circle
        icon_color: red
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
          entity: binary_sensor.hms_alert_display_wrapper
        card_mod:
          style:
            ha-card: |
              @keyframes hms-pulse {
                0%, 100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.6); }
                50%  { box-shadow: 0 0 25px 6px rgba(244,67,54,0.35),
                                   0 0 60px 14px rgba(244,67,54,0.10); }
              }
              ha-card {
                background: linear-gradient(
                  135deg,
                  rgba(244,67,54,0.35) 0%,
                  rgba(183,28,28,0.22) 45%,
                  rgba(244,67,54,0.28) 100%
                );
                border: 2px solid rgba(244,67,54,0.9);
                border-radius: 14px;
                --card-mod-icon-color: red;
                animation: hms-pulse 2s ease-in-out infinite;
                position: relative;
              }
              ha-card::after {
                content: '{% if is_state("input_boolean.hms_alert_show_details", "on") %}▲{% else %}▼{% endif %}';
                position: absolute;
                right: 18px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 1.2rem;
                color: rgba(255,255,255, {% if is_state("input_boolean.hms_alert_show_details", "on") %}0.9{% else %}0.45{% endif %});
              }
            mushroom-card$: |
              @keyframes hms-icon-glow {
                0%, 100% {
                  filter: drop-shadow(0 0 4px rgba(255,220,80,0.7));
                  transform: scale(1);
                }
                50% {
                  filter: drop-shadow(0 0 12px rgba(255,200,50,1))
                         drop-shadow(0 0 22px rgba(255,160,0,0.5));
                  transform: scale(1.12);
                }
              }
              mushroom-shape-icon {
                animation: hms-icon-glow 2s ease-in-out infinite;
                --shape-color: rgba(255,240,210,0.18) !important;
              }
            mushroom-card$mushroom-state-info$: |
              .primary {
                font-size: 1.8rem !important;
                font-weight: 900 !important;
                letter-spacing: 0.06em;
              }
              .secondary {
                font-size: 1.05rem !important;
                font-weight: 600 !important;
                white-space: normal !important;
                line-height: 1.35 !important;
                opacity: 0.92;
              }
              @media (max-width: 600px) {
                .primary  { font-size: 1.35rem !important; }
                .secondary { font-size: 0.95rem !important; }
              }
      # ── Error Details (Conditional) ────────────────────────────
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.hms_alert_show_details
            state: "on"
        card:
          type: custom:button-card
          entity: binary_sensor.hms_alert_display_wrapper
          show_name: false
          show_state: false
          show_icon: false
          tap_action:
            action: none
          custom_fields:
            details: |
              [[[ 
                const entity = states['binary_sensor.hms_alert_display_wrapper'];
                if (!entity) {
                  return '<div class="hms-empty">No error details available</div>';
                }

                const attrs = entity.attributes || {};
                const toTitle = (value) => {
                  const text = String(value || 'unknown').trim();
                  return text ? text.charAt(0).toUpperCase() + text.slice(1) : 'Unknown';
                };
                const toSeverityClass = (value) => String(value || 'unknown').toLowerCase().replace(/\s+/g, '-');
                const getSeverityIcon = (value) => {
                  const sev = String(value || '').toLowerCase();
                  if (sev.includes('serious') || sev.includes('critical') || sev.includes('fatal') || sev.includes('high')) return 'mdi:alert-octagon';
                  if (sev.includes('medium') || sev.includes('warn')) return 'mdi:alert';
                  if (sev.includes('low') || sev.includes('minor')) return 'mdi:alert-circle-outline';
                  return 'mdi:information';
                };

                let items = [];
                const legacy = Array.isArray(attrs.errors) ? attrs.errors : [];
                if (legacy.length > 0) {
                  items = legacy.map((error, index) => ({
                    index: index + 1,
                    text: error?.attr || error?.text || 'No description available',
                    code: error?.code || 'Unknown',
                    severity: error?.severity || 'unknown',
                    wiki: error?.wiki || ''
                  }));
                } else {
                  const count = parseInt(attrs.Count ?? attrs.count ?? 0, 10) || 0;
                  for (let i = 1; i <= count; i += 1) {
                    items.push({
                      index: i,
                      text: attrs[`${i}-Error`] || 'No description available',
                      code: attrs[`${i}-Code`] || 'Unknown',
                      severity: attrs[`${i}-Severity`] || 'unknown',
                      wiki: attrs[`${i}-Wiki`] || ''
                    });
                  }
                }

                if (items.length === 0) {
                  return '<div class="hms-empty">No error details available</div>';
                }

                const cards = items.map((item) => {
                  const severityClass = toSeverityClass(item.severity);
                  const severityText = toTitle(item.severity);
                  const severityIcon = getSeverityIcon(item.severity);
                  const safeText = String(item.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                  const safeCode = String(item.code || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                  const wikiHtml = item.wiki
                    ? `<a class="hms-link" href="${item.wiki}" target="_blank" rel="noopener noreferrer">Troubleshooting Wiki</a>`
                    : '';

                  return `
                    <div class="hms-error-item">
                      <div class="hms-main">
                        <div class="hms-title">Error ${item.index}</div>
                        <div class="hms-text">${safeText}</div>
                      </div>
                      <div class="hms-meta">
                        <div class="hms-severity severity-${severityClass}">
                          <ha-icon icon="${severityIcon}"></ha-icon>
                          <span>${severityText}</span>
                        </div>
                        <div class="hms-code">${safeCode}</div>
                        ${wikiHtml}
                      </div>
                    </div>`;
                }).join('');

                return `<div class="hms-error-grid">${cards}</div>`;
              ]]]
          styles:
            card:
              - background: rgba(244, 67, 54, 0.07)
              - border: 2px solid rgba(244,67,54,0.9)
              - border-top: none
              - border-radius: 0 0 14px 14px
              - box-shadow: none
              - padding: 12px
              - margin-top: -8px
            custom_fields:
              details:
                - width: 100%
                - text-align: left
          extra_styles: |
            .hms-error-grid {
              display: grid;
              grid-template-columns: 1fr;
              gap: 10px;
            }
            .hms-error-item {
              display: grid;
              grid-template-columns: 2.1fr minmax(220px, 1fr);
              gap: 12px;
              padding: 10px;
              border-radius: 10px;
              background: rgba(0, 0, 0, 0.2);
              border: 1px solid rgba(244, 67, 54, 0.22);
            }
            .hms-title {
              font-size: 1.03rem;
              font-weight: 700;
              color: var(--primary-text-color);
              margin-bottom: 4px;
            }
            .hms-text {
              font-size: 0.98rem;
              line-height: 1.45;
              color: var(--primary-text-color);
            }
            .hms-meta {
              display: flex;
              flex-direction: column;
              align-items: flex-end;
              justify-content: center;
              gap: 7px;
              text-align: right;
            }
            .hms-severity {
              display: inline-flex;
              align-items: center;
              gap: 6px;
              padding: 3px 9px;
              border-radius: 999px;
              font-size: 0.88rem;
              font-weight: 700;
              background: rgba(120, 120, 120, 0.25);
            }
            .hms-severity ha-icon {
              --mdc-icon-size: 15px;
            }
            .hms-severity[class*='serious'],
            .hms-severity[class*='critical'],
            .hms-severity[class*='fatal'],
            .hms-severity[class*='high'] {
              color: #ff8a80;
              background: rgba(244, 67, 54, 0.22);
            }
            .hms-severity[class*='medium'],
            .hms-severity[class*='warn'] {
              color: #ffd180;
              background: rgba(255, 152, 0, 0.24);
            }
            .hms-severity[class*='low'],
            .hms-severity[class*='minor'] {
              color: #fff59d;
              background: rgba(255, 235, 59, 0.2);
            }
            .hms-code {
              font-family: var(--code-font-family, monospace);
              font-size: 0.9rem;
              font-weight: 700;
              color: #ffb4ab;
            }
            .hms-link {
              color: #64b5f6;
              font-weight: 600;
              text-decoration: none;
            }
            .hms-link:hover {
              text-decoration: underline;
            }
            .hms-empty {
              font-size: 0.98rem;
              color: var(--secondary-text-color);
            }
            @media (max-width: 850px) {
              .hms-error-item {
                grid-template-columns: 1fr;
              }
              .hms-meta {
                align-items: flex-start;
                text-align: left;
              }
            }
    grid_options:
      columns: full
column_span: 3
