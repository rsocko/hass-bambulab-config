# Unified HMS Error Alert Section
# Responsive card that works on both mobile and desktop.
# - Single header banner: tap to expand/collapse, hold for more-info
# - CSS chevron indicator on the right shows expand/collapse state
# - Error detail cards coloured by severity, horizontal wrapping layout
# - Details visibility controlled by input_boolean.hms_alert_show_details
type: grid
visibility:
  - condition: state
    entity: binary_sensor.hms_alert_display_wrapper
    state: 'on'
cards:
  - type: vertical-stack
    cards:
      # ── Header Banner ──────────────────────────────────────────
      - type: custom:mushroom-template-card
        entity: input_boolean.hms_alert_show_details
        primary: HMS ERROR ALERT
        secondary: >-
          {%- set entity = 'binary_sensor.hms_alert_display_wrapper' -%}
          {%- set count = state_attr(entity, 'Count') -%}
          {%- if count is none -%}
            {%- set count = state_attr(entity, 'count') -%}
          {%- endif -%}
          {%- set c = count | int(0) -%}
          {%- if c == 1 -%}
            {%- set legacy = state_attr(entity, 'errors') -%}
            {%- if legacy is iterable and legacy is not string and (legacy | count > 0) -%}
              {{ legacy[0].attr | default(legacy[0].text | default('1 Error')) }}
            {%- else -%}
              {{ state_attr(entity, '1-Error') | default('1 Error') }}
            {%- endif -%}
          {%- elif c > 1 -%}
            {{ c }} Errors
          {%- else -%}
            Error Detected
          {%- endif -%}
        icon: mdi:alert-circle
        icon_color: red
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
          entity: binary_sensor.hms_alert_display_wrapper
        card_mod:
          style:
            ha-card: |
              @keyframes hms-pulse {
                0%, 100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.6); }
                50%  { box-shadow: 0 0 25px 6px rgba(244,67,54,0.35),
                                   0 0 60px 14px rgba(244,67,54,0.10); }
              }
              ha-card {
                background: linear-gradient(
                  135deg,
                  rgba(244,67,54,0.35) 0%,
                  rgba(183,28,28,0.22) 45%,
                  rgba(244,67,54,0.28) 100%
                );
                border: 2px solid rgba(244,67,54,0.9);
                border-radius: 14px;
                --card-mod-icon-color: red;
                animation: hms-pulse 2s ease-in-out infinite;
                position: relative;
              }
              ha-card::after {
                content: '{% if is_state("input_boolean.hms_alert_show_details", "on") %}▲{% else %}▼{% endif %}';
                position: absolute;
                right: 18px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 1.2rem;
                color: rgba(255,255,255, {% if is_state("input_boolean.hms_alert_show_details", "on") %}0.9{% else %}0.45{% endif %});
              }
            mushroom-card$: |
              @keyframes hms-icon-glow {
                0%, 100% {
                  filter: drop-shadow(0 0 4px rgba(255,220,80,0.7));
                  transform: scale(1);
                }
                50% {
                  filter: drop-shadow(0 0 12px rgba(255,200,50,1))
                         drop-shadow(0 0 22px rgba(255,160,0,0.5));
                  transform: scale(1.12);
                }
              }
              mushroom-shape-icon {
                animation: hms-icon-glow 2s ease-in-out infinite;
                --shape-color: rgba(255,240,210,0.18) !important;
              }
            mushroom-card$mushroom-state-info$: |
              .primary {
                font-size: 1.8rem !important;
                font-weight: 900 !important;
                letter-spacing: 0.06em;
              }
              .secondary {
                font-size: 1.05rem !important;
                font-weight: 600 !important;
                white-space: normal !important;
                line-height: 1.35 !important;
                opacity: 0.92;
              }
              @media (max-width: 600px) {
                .primary  { font-size: 1.35rem !important; }
                .secondary { font-size: 0.95rem !important; }
              }
      # ── Error Details (Conditional) ────────────────────────────
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.hms_alert_show_details
            state: "on"
        card:
          type: markdown
          content: |
            {%- set entity = 'binary_sensor.hms_alert_display_wrapper' -%}
            {%- set attrs = states[entity].attributes -%}
            {%- set legacy_errors = state_attr(entity, 'errors') -%}
            {%- set use_legacy = legacy_errors is iterable and legacy_errors is not string and (legacy_errors | count > 0) -%}
            {%- set count_raw = attrs['Count'] if attrs['Count'] is defined else (attrs['count'] if attrs['count'] is defined else 0) -%}
            {%- set error_count = count_raw | int(0) -%}
            {%- set ns = namespace(errors=[]) -%}
            {%- if use_legacy -%}
              {%- for err in legacy_errors -%}
                {%- set ns.errors = ns.errors + [{'text': err.attr | default(err.text | default('No description available')), 'code': err.code | default('Unknown'), 'severity': err.severity | default('unknown'), 'wiki': err.wiki | default('')}] -%}
              {%- endfor -%}
            {%- elif error_count > 0 -%}
              {%- for i in range(1, error_count + 1) -%}
                {%- set ns.errors = ns.errors + [{'text': attrs[i ~ '-Error'] | default('No description available'), 'code': attrs[i ~ '-Code'] | default('Unknown'), 'severity': attrs[i ~ '-Severity'] | default('unknown'), 'wiki': attrs[i ~ '-Wiki'] | default('')}] -%}
              {%- endfor -%}
            {%- endif -%}
            <div style="display:flex;flex-wrap:wrap;gap:12px;padding:6px 0 2px 0;">
            {%- for err in ns.errors -%}
              {%- set sev = (err.severity | default('unknown')) | lower -%}
              {%- if 'critical' in sev or 'serious' in sev or 'fatal' in sev or 'high' in sev -%}
                {%- set bcolor = '#f44336' -%}{%- set bgcolor = 'rgba(244,67,54,0.08)' -%}{%- set sev_icon = '🔴' -%}
              {%- elif 'medium' in sev or 'warn' in sev -%}
                {%- set bcolor = '#ff9800' -%}{%- set bgcolor = 'rgba(255,152,0,0.08)' -%}{%- set sev_icon = '🟠' -%}
              {%- elif 'minor' in sev or 'low' in sev -%}
                {%- set bcolor = '#ffc107' -%}{%- set bgcolor = 'rgba(255,193,7,0.08)' -%}{%- set sev_icon = '🟡' -%}
              {%- else -%}
                {%- set bcolor = '#9e9e9e' -%}{%- set bgcolor = 'rgba(158,158,158,0.08)' -%}{%- set sev_icon = '⚪' -%}
              {%- endif -%}
            <div style="flex:1 1 280px;max-width:100%;border:2px solid {{ bcolor }};border-radius:10px;background:{{ bgcolor }};padding:14px 16px;">
            <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px;">{{ sev_icon }} Error {{ loop.index }} <span style="opacity:0.75;font-weight:500;font-size:0.92rem;">({{ (err.severity | default('unknown')) | title }})</span></div>
            <div style="margin-bottom:8px;line-height:1.5;">{{ err.text }}</div>
            <div style="font-size:0.85rem;opacity:0.8;">Code: <code>{{ err.code }}</code>{% if err.wiki %} · <a href="{{ err.wiki }}">Troubleshooting Wiki ↗</a>{% endif %}</div>
            </div>
            {%- endfor -%}
            </div>
          card_mod:
            style:
              ha-card: |
                ha-card {
                  background: var(--card-background-color, var(--ha-card-background, #1c1c1c));
                  border: 2px solid rgba(244,67,54,0.9);
                  border-top: none;
                  border-radius: 0 0 14px 14px;
                  box-shadow: none;
                  padding: 4px 8px;
                  margin-top: -8px;
                }
    grid_options:
      columns: full
column_span: 3
