type: grid
visibility:
  - condition: state
    entity: binary_sensor.hms_alert_display_wrapper
    state: 'on'
  - condition: screen
    media_query: "(min-width: 601px)"
cards:
  - type: vertical-stack
    cards:
      - type: custom:mushroom-template-card
        primary: HMS ERROR ALERT
        secondary: >-
          {% set count = state_attr('binary_sensor.hms_alert_display_wrapper', 'Count') %}
          {% if count is none %}
            {% set count = state_attr('binary_sensor.hms_alert_display_wrapper', 'count') %}
          {% endif %}
          {{ count | int(0) }} Error(s)
        icon: mdi:alert-circle
        icon_color: red
        fill_container: false
        tap_action:
          action: more-info
        card_mod:
          style: |
            : |
              @keyframes hms-alert-pulse {
                0%, 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.45); }
                50% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0.10); }
              }
              @keyframes hms-icon-breathe {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.1); opacity: 0.85; }
              }
              ha-card {
                background: linear-gradient(90deg, rgba(244, 67, 54, 0.26), rgba(244, 67, 54, 0.10));
                border: 2px solid var(--red-color);
                border-radius: 14px;
                --card-mod-icon-color: red;
                animation: hms-alert-pulse 2.2s ease-in-out infinite;
              }
              .primary {
                font-size: 1.35rem !important;
                font-weight: 800 !important;
                letter-spacing: 0.045em;
              }
              .secondary {
                font-size: 1.02rem !important;
                font-weight: 600 !important;
              }
              mushroom-shape-icon {
                animation: hms-icon-breathe 1.1s ease-in-out infinite;
              }
      - type: custom:button-card
        entity: binary_sensor.hms_alert_display_wrapper
        show_name: false
        show_state: false
        show_icon: false
        tap_action:
          action: none
        custom_fields:
          details: |
            [[[
              var entity = states['binary_sensor.hms_alert_display_wrapper'];
              if (!entity || !entity.attributes) {
                return '<div class="hms-empty">No error details available</div>';
              }
              var attrs = entity.attributes || {};

              function esc(value) {
                if (value === null || value === undefined) {
                  return '';
                }
                return String(value)
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
              }

              function toTitle(value) {
                var text = String(value || 'unknown').trim();
                return text ? text.charAt(0).toUpperCase() + text.slice(1) : 'Unknown';
              }

              function toSeverityClass(value) {
                return String(value || 'unknown').toLowerCase().replace(/\s+/g, '-');
              }

              function getSeverityIcon(value) {
                var sev = String(value || '').toLowerCase();
                if (sev.indexOf('serious') !== -1 || sev.indexOf('critical') !== -1 || sev.indexOf('high') !== -1) {
                  return 'mdi:alert-octagon';
                }
                if (sev.indexOf('medium') !== -1 || sev.indexOf('warn') !== -1) {
                  return 'mdi:alert';
                }
                if (sev.indexOf('low') !== -1 || sev.indexOf('minor') !== -1) {
                  return 'mdi:alert-circle-outline';
                }
                return 'mdi:information';
              }

              var items = [];
              var legacy = attrs.errors;
              if (legacy && typeof legacy !== 'string' && legacy.length && legacy.forEach) {
                for (var l = 0; l < legacy.length; l += 1) {
                  var error = legacy[l] || {};
                  items.push({
                    index: l + 1,
                    text: (error.attr || error.text || 'No description available'),
                    code: (error.code || 'Unknown'),
                    severity: (error.severity || 'unknown'),
                    wiki: (error.wiki || '')
                  });
                }
              } else {
                var countVal = (attrs.Count !== undefined && attrs.Count !== null) ? attrs.Count : attrs.count;
                var count = parseInt(countVal || 0, 10);
                if (isNaN(count)) {
                  count = 0;
                }
                for (var i = 1; i <= count; i += 1) {
                  items.push({
                    index: i,
                    text: attrs[i + '-Error'] || 'No description available',
                    code: attrs[i + '-Code'] || 'Unknown',
                    severity: attrs[i + '-Severity'] || 'unknown',
                    wiki: attrs[i + '-Wiki'] || ''
                  });
                }
              }

              if (items.length === 0) {
                return '<div class="hms-empty">No error details available</div>';
              }

              var html = '<div class="hms-error-grid">';
              for (var j = 0; j < items.length; j += 1) {
                var item = items[j];
                var severityClass = toSeverityClass(item.severity);
                var severityText = toTitle(item.severity);
                var severityIcon = getSeverityIcon(item.severity);
                var wikiHtml = '';
                if (item.wiki) {
                  wikiHtml = '<a class="hms-link" href="' + esc(item.wiki) + '" target="_blank" rel="noopener noreferrer">Troubleshooting Wiki</a>';
                }
                html += '<div class="hms-error-item">';
                html += '<div class="hms-main">';
                html += '<div class="hms-title">Error ' + esc(item.index) + '</div>';
                html += '<div class="hms-text">' + esc(item.text) + '</div>';
                html += '</div>';
                html += '<div class="hms-meta">';
                html += '<div class="hms-severity severity-' + esc(severityClass) + '">';
                html += '<ha-icon icon="' + esc(severityIcon) + '"></ha-icon>';
                html += '<span>' + esc(severityText) + '</span>';
                html += '</div>';
                html += '<div class="hms-code">' + esc(item.code) + '</div>';
                html += wikiHtml;
                html += '</div>';
                html += '</div>';
              }
              html += '</div>';
              return html;
            ]]]
        styles:
          card:
            - background: rgba(244, 67, 54, 0.07)
            - border: 1px solid rgba(244, 67, 54, 0.35)
            - border-left: 6px solid var(--red-color)
            - border-radius: 12px
            - padding: 10px 12px
          custom_fields:
            details:
              - width: 100%
              - text-align: left
        extra_styles: |
          .hms-error-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
          }
          .hms-error-item {
            display: grid;
            grid-template-columns: 2.1fr minmax(220px, 1fr);
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.22);
          }
          .hms-title {
            font-size: 1.03rem;
            font-weight: 700;
            color: var(--primary-text-color);
            margin-bottom: 4px;
          }
          .hms-text {
            font-size: 0.98rem;
            line-height: 1.45;
            color: var(--primary-text-color);
          }
          .hms-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 7px;
            text-align: right;
          }
          .hms-severity {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 700;
            background: rgba(120, 120, 120, 0.25);
          }
          .hms-severity ha-icon {
            --mdc-icon-size: 15px;
          }
          .hms-severity[class*='serious'],
          .hms-severity[class*='critical'],
          .hms-severity[class*='high'] {
            color: #ff8a80;
            background: rgba(244, 67, 54, 0.22);
          }
          .hms-severity[class*='medium'],
          .hms-severity[class*='warn'] {
            color: #ffd180;
            background: rgba(255, 152, 0, 0.24);
          }
          .hms-severity[class*='low'],
          .hms-severity[class*='minor'] {
            color: #fff59d;
            background: rgba(255, 235, 59, 0.2);
          }
          .hms-code {
            font-family: var(--code-font-family, monospace);
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffb4ab;
          }
          .hms-link {
            color: #64b5f6;
            font-weight: 600;
            text-decoration: none;
          }
          .hms-link:hover {
            text-decoration: underline;
          }
          .hms-empty {
            font-size: 0.98rem;
            color: var(--secondary-text-color);
          }
          @media (max-width: 850px) {
            .hms-error-item {
              grid-template-columns: 1fr;
            }
            .hms-meta {
              align-items: flex-start;
              text-align: left;
            }
          }
    grid_options:
      columns: full
column_span: 3
