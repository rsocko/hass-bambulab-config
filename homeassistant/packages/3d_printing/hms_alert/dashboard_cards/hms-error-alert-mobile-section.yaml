type: grid
visibility:
  - condition: state
    entity: binary_sensor.ntk_ryansoffice_3dprinter_hms_errors
    state: 'on'
  - condition: screen
    media_query: "(max-width: 600px)"
cards:
  - type: custom:mushroom-template-card
    primary: HMS ERROR ALERT
    secondary: >-
      {% set count = state_attr('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors', 'Count') %}
      {% if count is none %}
        {% set count = state_attr('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors', 'count') %}
      {% endif %}
      {{ count | int(0) }} Error(s)
    icon: mdi:alert-circle
    icon_color: red
    fill_container: false
    tap_action:
      action: more-info
    card_mod:
      style: |
        : |
          @keyframes hms-alert-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.45); }
            50% { box-shadow: 0 0 0 8px rgba(244, 67, 54, 0.08); }
          }
          @keyframes hms-icon-breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
          }
          ha-card {
            background: linear-gradient(90deg, rgba(244, 67, 54, 0.22), rgba(244, 67, 54, 0.08));
            border: 2px solid var(--red-color);
            border-radius: 14px;
            --card-mod-icon-color: red;
            animation: hms-alert-pulse 2.3s ease-in-out infinite;
          }
          .primary {
            font-size: 1.28rem !important;
            font-weight: 800 !important;
            letter-spacing: 0.04em;
          }
          .secondary {
            font-size: 0.98rem !important;
            font-weight: 600 !important;
          }
          mushroom-shape-icon {
            animation: hms-icon-breathe 1.2s ease-in-out infinite;
          }
    grid_options:
      columns: full
column_span: 3
