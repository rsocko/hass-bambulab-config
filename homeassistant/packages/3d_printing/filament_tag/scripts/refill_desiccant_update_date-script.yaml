# Docs: docs/features/filament_tag/README.md
refill_desiccant_update_date:
  alias: Refill Desiccant (Update Date)
  description: ""
  mode: single
  icon: fas:droplet
  fields:
    spool_id:
      description: Spool ID to update
      example: 123
  sequence:
    - if:
        - condition: template
          value_template: >-
            {% set id = spool_id | default(0) | int(0) %}
            {{ id <= 0
               or states('sensor.spoolman_health') | lower
                  in ['unknown', 'unavailable', 'none', '']
               or state_attr('sensor.spoolman_filament_totals', 'available') is not true
               or states('sensor.spoolman_spool_' ~ id) | lower
                  in ['unknown', 'unavailable', 'none', ''] }}
      then:
        - stop: Spoolman or target spool unavailable
          error: true
    - action: spoolman.patch_spool
      metadata: {}
      data:
        id: "{{ spool_id }}"
        extra:
          desiccant_filled: "{{ now().isoformat() }}"
          desiccant_in_spool: true
