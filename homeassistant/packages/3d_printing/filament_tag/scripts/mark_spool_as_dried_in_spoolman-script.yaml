# Docs: docs/features/filament_tag/README.md
mark_spool_as_dried_in_spoolman:
  sequence:
    - if:
        - condition: template
          value_template: >-
            {% set id = spool_id | default(0) | int(0) %}
            {{ id <= 0
               or states('sensor.spoolman_health') | lower
                  in ['unknown', 'unavailable', 'none', '']
               or state_attr('sensor.spoolman_filament_totals', 'available') is not true
               or states('sensor.spoolman_spool_' ~ id) | lower
                  in ['unknown', 'unavailable', 'none', ''] }}
      then:
        - stop: Spoolman or target spool unavailable
          error: true
    - action: spoolman.patch_spool
      metadata: {}
      data:
        id: "{{ spool_id }}"
        extra:
          last_dried: "{{ now().isoformat() }}"
      alias: Update Spoolman Last Dried Date
    - action: system_log.write
      metadata: {}
      data:
        message: >-
          Spool {{ spool_id }} marked as dried in Spoolman at {{ now().isoformat() }}.
        level: info
        logger: homeassistant.components.bambulab.spoolman_sync
    - action: logbook.log
      metadata: {}
      data:
        name: Spoolman Spool Dried
        message: "Spool {{ spool_id }} marked as dried."
  alias: Mark Spool as Dried in Spoolman
  description: >-
    Takes a spool_id as input and updates Spoolman with the current time as the
    last dried date (extra field: last_dried).
  fields:
    spool_id:
      selector:
        number:
          min: 1
      required: true
      name: Spool ID
      description: The numeric ID of the spool to update in Spoolman.
  icon: mdi:heat-wave
