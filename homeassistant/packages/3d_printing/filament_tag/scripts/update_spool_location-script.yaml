# Docs: docs/features/filament_tag/README.md
update_spool_location:
  alias: Update Spool Location
  description: ""
  mode: single
  icon: mdi:map-marker-distance
  fields:
    spool_id:
      description: Spool ID to update
      example: 123
    location:
      description: new location for the spool
      example: AMS
  sequence:
    - condition: template
      value_template: >-
        {{ state_attr('sensor.spoolman_filament_totals', 'available') is true }}
    - action: spoolman.patch_spool
      metadata: {}
      data:
        id: "{{ spool_id }}"
        location: "{{ location }}"
