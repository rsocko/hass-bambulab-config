# Docs: docs/features/filament_tag/README.md
- name: "selected_spool"
  unique_id: "filament_tag_selected_spool"
  icon: fapro:filament-2
  state: >
    {% set fid = states('input_text.filament_id') | int(0) %}
    {% set totals = state_attr('sensor.spoolman_filament_totals', 'totals') | default({}, true) %}
    {% set entry = totals.get(fid | string, {}) if totals is mapping and fid > 0 else {} %}
    {{ entry.get('preferred_spool_entity_id', '') if entry is mapping else '' }}
