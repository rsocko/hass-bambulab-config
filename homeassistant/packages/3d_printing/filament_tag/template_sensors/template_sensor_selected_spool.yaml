- name: "selected_spool"
  unique_id: "filament_tag_selected_spool"
  icon: fapro:filament-2
  state: >
    {% set fid = states('input_text.filament_id') | int %}

    {% for s in states.sensor %}
      {% if s.entity_id.startswith('sensor.spoolman_spool_') %}
        {% set filament = state_attr(s.entity_id, 'filament_id') %}
        {% if filament and filament == fid %}
          {{ s.entity_id }}
          {% break %}
        {% endif %}
      {% endif %}
    {% endfor %}
