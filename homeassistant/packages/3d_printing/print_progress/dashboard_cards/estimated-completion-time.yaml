# Docs: docs/features/print_progress/README.md
# Estimated Completion Time KPI card (mushroom)
# Primary: just the time (e.g. "4:34 PM")
# Secondary: day descriptor (if not today) on first line, start info on second line
# - Same day: "Start 5:37 PM"
# - Tomorrow: "Tomorrow\nStart 11:22 AM"
# - Within week: "Wednesday\nStart Yesterday @ 10:15 AM"
# - 1 week+: "1/21/26\nStart 1/14/26 @ 9:05 AM"

type: custom:mushroom-template-card
primary: |-
  {% set end = states('sensor.ntk_ryansoffice_3dprinter_end_time') %}
  {% if end not in ['unknown', 'unavailable', '', none] %}
    {% set ts = as_timestamp(end, 0) %}
    {% if ts > 0 %}
      {% set nbsp = '\u00a0' %}
      {{ ts | timestamp_custom('%-I:%M', true) ~ nbsp ~ ts | timestamp_custom('%p', true) }}
    {% else %}
      N/A
    {% endif %}
  {% else %}
    N/A
  {% endif %}
secondary: |-
  {% set ns = namespace(day_line='', start_line='') %}
  {% set now_ts = now().timestamp() %}
  {% set today = now().strftime('%Y-%m-%d') %}
  {% set end = states('sensor.ntk_ryansoffice_3dprinter_end_time') %}
  {% if end not in ['unknown', 'unavailable', '', none] %}
    {% set ts = as_timestamp(end, 0) %}
    {% if ts > 0 %}
      {% set tomorrow = (now_ts + 86400) | timestamp_custom('%Y-%m-%d', true) %}
      {% set end_day = ts | timestamp_custom('%Y-%m-%d', true) %}
      {% if end_day == tomorrow %}
        {% set ns.day_line = 'Tomorrow' %}
      {% elif end_day != today %}
        {% set diff_days = ((ts - now_ts) / 86400) | int %}
        {% if diff_days < 7 %}
          {% set ns.day_line = ts | timestamp_custom('%A', true) %}
        {% else %}
          {% set ns.day_line = ts | timestamp_custom('%-m/%-d/%y', true) %}
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}
  {% set start = states('sensor.ntk_ryansoffice_3dprinter_start_time') %}
  {% if start not in ['unknown', 'unavailable', '', none] %}
    {% set ts = as_timestamp(start, 0) %}
    {% if ts > 0 %}
      {% set yesterday = (now_ts - 86400) | timestamp_custom('%Y-%m-%d', true) %}
      {% set start_day = ts | timestamp_custom('%Y-%m-%d', true) %}
      {% set time_str = ts | timestamp_custom('%-I:%M %p', true) %}
      {% if start_day == today %}
        {% set ns.start_line = 'Start ' ~ time_str %}
      {% elif start_day == yesterday %}
        {% set ns.start_line = 'Start Yesterday @ ' ~ time_str %}
      {% else %}
        {% set diff_days = ((now_ts - ts) / 86400) | int %}
        {% if diff_days < 7 %}
          {% set ns.start_line = 'Start ' ~ ts | timestamp_custom('%A', true) ~ ' @ ' ~ time_str %}
        {% else %}
          {% set ns.start_line = 'Start ' ~ ts | timestamp_custom('%-m/%-d/%y', true) ~ ' @ ' ~ time_str %}
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}
  {{ (ns.day_line ~ '\n' if ns.day_line else '') ~ ns.start_line }}
icon: mdi:flag-checkered
icon_color: |-
  {% set status = states('sensor.ntk_ryansoffice_3dprinter_print_status') | lower %}
  {% set stage = states('sensor.ntk_ryansoffice_3dprinter_current_stage') | lower %}
  {% if status == 'finish' %}
    green
  {% elif status in ['running', 'printing', 'prepare', 'slicing', 'init'] or stage == 'printing' %}
    purple
  {% elif status == 'pause' or stage == 'pause' %}
    orange
  {% else %}
    grey
  {% endif %}
tap_action:
  action: more-info
  entity: sensor.ntk_ryansoffice_3dprinter_end_time
card_mod:
  style: |
    [slot="primary"] {
      font-size: 28px !important;
      font-weight: 700 !important;
    }
    [slot="secondary"] {
      font-size: 11px !important;
      white-space: pre-line !important;
      overflow: visible !important;
      text-overflow: unset !important;
      opacity: 0.7 !important;
    }
grid_options:
  columns: 6
