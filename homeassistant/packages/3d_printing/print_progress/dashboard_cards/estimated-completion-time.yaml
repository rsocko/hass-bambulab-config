# Docs: docs/features/print_progress/README.md
# Estimated Completion Time KPI card (mushroom)
# Shows estimated end time with relative start time subtitle
# - Same day: just time
# - Yesterday: "Yesterday @ <time>"
# - Within past week: "<DayOfWeek> @ <time>"
# - 1 week+: "<M/D/YY> @ <time>"

type: custom:mushroom-template-card
primary: |-
  {% set end = states('sensor.ntk_ryansoffice_3dprinter_end_time') %}
  {% if end not in ['unknown', 'unavailable', '', none] %}
    {% set ts = as_timestamp(end, 0) %}
    {% if ts > 0 %}
      {% set now_ts = now().timestamp() %}
      {% set today = now().strftime('%Y-%m-%d') %}
      {% set tomorrow = (now_ts + 86400) | timestamp_custom('%Y-%m-%d', true) %}
      {% set end_day = ts | timestamp_custom('%Y-%m-%d', true) %}
      {% set time_str = ts | timestamp_custom('%-I:%M %p', true) %}
      {% if end_day == tomorrow %}
        {{ time_str }} tomorrow
      {% elif end_day != today %}
        {% set diff_days = ((ts - now_ts) / 86400) | int %}
        {% if diff_days < 7 %}
          {{ time_str }} {{ ts | timestamp_custom('%A', true) }}
        {% else %}
          {{ time_str }} {{ ts | timestamp_custom('%-m/%-d/%y', true) }}
        {% endif %}
      {% else %}
        {{ time_str }}
      {% endif %}
    {% else %}
      N/A
    {% endif %}
  {% else %}
    N/A
  {% endif %}
secondary: |-
  {% set start = states('sensor.ntk_ryansoffice_3dprinter_start_time') %}
  {% if start not in ['unknown', 'unavailable', '', none] %}
    {% set ts = as_timestamp(start, 0) %}
    {% if ts > 0 %}
      {% set now_ts = now().timestamp() %}
      {% set today = now().strftime('%Y-%m-%d') %}
      {% set yesterday = (now_ts - 86400) | timestamp_custom('%Y-%m-%d', true) %}
      {% set start_day = ts | timestamp_custom('%Y-%m-%d', true) %}
      {% set time_str = ts | timestamp_custom('%-I:%M %p', true) %}
      {% if start_day == today %}
        Start {{ time_str }}
      {% elif start_day == yesterday %}
        Start Yesterday @ {{ time_str }}
      {% else %}
        {% set diff_days = ((now_ts - ts) / 86400) | int %}
        {% if diff_days < 7 %}
          Start {{ ts | timestamp_custom('%A', true) }} @ {{ time_str }}
        {% else %}
          Start {{ ts | timestamp_custom('%-m/%-d/%y', true) }} @ {{ time_str }}
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}
icon: mdi:flag-checkered
icon_color: |-
  {% set status = states('sensor.ntk_ryansoffice_3dprinter_print_status') | lower %}
  {% set stage = states('sensor.ntk_ryansoffice_3dprinter_current_stage') | lower %}
  {% if status == 'finish' %}
    green
  {% elif status in ['running', 'printing', 'prepare', 'slicing', 'init'] or stage == 'printing' %}
    purple
  {% elif status == 'pause' or stage == 'pause' %}
    orange
  {% else %}
    grey
  {% endif %}
tap_action:
  action: more-info
  entity: sensor.ntk_ryansoffice_3dprinter_end_time
card_mod:
  style: |
    .primary {
      font-size: 28px !important;
      font-weight: 700;
    }
    .secondary {
      font-size: 11px !important;
    }
grid_options:
  columns: 6
