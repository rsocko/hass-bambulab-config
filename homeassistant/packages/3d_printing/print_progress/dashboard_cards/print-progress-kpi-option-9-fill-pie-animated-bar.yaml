# Docs: docs/features/print_progress/README.md
# Issue #516 - Option 9
# Layer: Full-card vertical fill from bottom to top + animated bottom bar.
# Print: Pie chart that grows proportionally + animated bottom bar.

type: horizontal-stack
cards:
  # --- Layer Progress: bottom-up fill + animated bottom bar ---
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_current_layer
    triggers_update:
      - sensor.ntk_ryansoffice_3dprinter_total_layer_count
      - sensor.ntk_ryansoffice_3dprinter_print_status
      - sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[
          const currentLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_current_layer']?.state);
          const totalLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_total_layer_count']?.state);
          const hasLayerData = Number.isFinite(currentLayer) && Number.isFinite(totalLayer) && totalLayer > 0;
          const value = hasLayerData ? `${Math.round(currentLayer)}/${Math.round(totalLayer)}` : 'N/A';
          const pct = hasLayerData ? Math.max(0, Math.min(100, (currentLayer / totalLayer) * 100)) : 0;

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isActive = ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing';
          const isPaused = status === 'pause' || stage === 'pause';
          const isFinished = ['finish', 'finished', 'complete', 'completed', 'success'].includes(status) || ['finish', 'finished', 'complete', 'completed'].includes(stage);
          const color = (isActive || isFinished) ? '#2196F3' : isPaused ? '#FF9800' : '#9E9E9E';
          const lineClass = isActive ? 'opt9-anim-line' : '';

          return `<div class="opt9-fill-wrap">
            <div class="opt9-fill-layer" style="height:${pct}%; --opt9-color:${color};"></div>
            <div class="opt9-fill-content">
              <div class="opt9-fill-value">${value}</div>
              <div class="opt9-fill-footer">
                <span class="opt9-fill-label">Layer Progress</span>
                <ha-icon icon="mdi:layers-triple" class="opt9-fill-icon" style="color:${color};"></ha-icon>
              </div>
            </div>
            <div class="opt9-bottom-track">
              <div class="opt9-bottom-fill ${lineClass}" style="width:${pct}%; --opt9-line-color:${color};"></div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 0
        - min-height: 102px
        - overflow: hidden
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
      custom_fields:
        body:
          - width: 100%
          - height: 100%
    extra_styles: |
      .opt9-fill-wrap { position:relative; display:flex; flex-direction:column; width:100%; min-height:102px; overflow:hidden; }
      .opt9-fill-layer { position:absolute; left:0; right:0; bottom:0; background: color-mix(in srgb, var(--opt9-color) 28%, transparent); transition: height 0.4s ease; z-index:0; }
      .opt9-fill-content { position:relative; z-index:1; display:flex; flex-direction:column; flex-grow:1; padding:12px 12px 8px; }
      .opt9-fill-value { font-size:34px; font-weight:700; text-align:center; line-height:1; padding:8px 0; flex-grow:1; display:flex; align-items:center; justify-content:center; }
      .opt9-fill-footer { display:grid; grid-template-columns:18px 1fr 18px; align-items:center; }
      .opt9-fill-label { grid-column:2; text-align:center; font-size:11px; font-weight:500; opacity:0.8; }
      .opt9-fill-icon { grid-column:3; justify-self:end; --mdc-icon-size:18px; }
      .opt9-bottom-track { position:relative; z-index:2; width:100%; height:10px; background:rgba(120,120,120,0.2); overflow:hidden; flex-shrink:0; }
      .opt9-bottom-fill { height:100%; background:var(--opt9-line-color); }
      .opt9-anim-line {
        background: linear-gradient(90deg,
          color-mix(in srgb, var(--opt9-line-color) 55%, white) 0%,
          var(--opt9-line-color) 35%,
          color-mix(in srgb, var(--opt9-line-color) 45%, white) 50%,
          var(--opt9-line-color) 70%,
          color-mix(in srgb, var(--opt9-line-color) 55%, white) 100%);
        background-size: 180% 100%;
        animation: opt9-line-shift 3.5s linear infinite;
      }
      @keyframes opt9-line-shift { from { background-position: 100% 0; } to { background-position: -80% 0; } }
    grid_options:
      columns: 6

  # --- Print Progress: pie chart + animated bottom bar ---
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_print_progress
    triggers_update:
      - sensor.ntk_ryansoffice_3dprinter_print_status
      - sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[
          const progress = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_print_progress']?.state);
          const hasProgress = Number.isFinite(progress);
          const pct = hasProgress ? Math.max(0, Math.min(100, progress)) : 0;
          const value = hasProgress ? `${Math.round(pct)}%` : 'N/A';

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isActive = ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing';
          const isPaused = status === 'pause' || stage === 'pause';
          const isFinished = ['finish', 'finished', 'complete', 'completed', 'success'].includes(status) || ['finish', 'finished', 'complete', 'completed'].includes(stage);
          const color = (isActive || isFinished) ? '#4CAF50' : isPaused ? '#FF9800' : '#9E9E9E';
          const lineClass = isActive ? 'opt9p-anim-line' : '';
          const pieCls = isFinished ? ' opt9p-pie-finished' : '';

          return `<div class="opt9p-wrap">
            <div class="opt9p-main">
              <div class="opt9p-left">
                <div class="opt9p-pie${pieCls}" style="background: conic-gradient(${color} ${pct}%, rgba(128,128,128,0.12) ${pct}%);"></div>
              </div>
              <div class="opt9p-right">
                <div class="opt9p-value">${value}</div>
                <div class="opt9p-footer">
                  <span class="opt9p-label">Print Progress</span>
                </div>
              </div>
            </div>
            <div class="opt9p-bottom-track">
              <div class="opt9p-bottom-fill ${lineClass}" style="width:${pct}%; --opt9p-line-color:${color};"></div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 0
        - min-height: 102px
        - overflow: hidden
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
      custom_fields:
        body:
          - width: 100%
          - height: 100%
    extra_styles: |
      .opt9p-wrap { display:flex; flex-direction:column; width:100%; min-height:102px; overflow:hidden; }
      .opt9p-main { display:flex; flex-grow:1; align-items:center; min-height:0; }
      .opt9p-left { display:flex; align-items:center; justify-content:center; width:45%; padding:8px; }
      .opt9p-pie { width:64px; height:64px; border-radius:50%; transition: background 0.35s ease; }
      .opt9p-pie-finished { width:56px; height:56px; box-shadow: 0 0 8px color-mix(in srgb, #4CAF50 65%, transparent), 0 0 14px color-mix(in srgb, #4CAF50 45%, transparent); }
      .opt9p-right { display:flex; flex-direction:column; width:55%; justify-content:center; padding:8px 8px 8px 0; }
      .opt9p-value { font-size:34px; font-weight:700; text-align:center; line-height:1; flex-grow:1; display:flex; align-items:center; justify-content:center; padding:4px 0; }
      .opt9p-footer { display:flex; align-items:center; justify-content:center; }
      .opt9p-label { text-align:center; font-size:11px; font-weight:500; opacity:0.75; }
      .opt9p-bottom-track { width:100%; height:10px; background:rgba(120,120,120,0.2); overflow:hidden; flex-shrink:0; }
      .opt9p-bottom-fill { height:100%; background:var(--opt9p-line-color); }
      .opt9p-anim-line {
        background: linear-gradient(90deg,
          color-mix(in srgb, var(--opt9p-line-color) 55%, white) 0%,
          var(--opt9p-line-color) 35%,
          color-mix(in srgb, var(--opt9p-line-color) 45%, white) 50%,
          var(--opt9p-line-color) 70%,
          color-mix(in srgb, var(--opt9p-line-color) 55%, white) 100%);
        background-size: 180% 100%;
        animation: opt9p-line-shift 3.5s linear infinite;
      }
      @keyframes opt9p-line-shift { from { background-position: 100% 0; } to { background-position: -80% 0; } }
    grid_options:
      columns: 6
