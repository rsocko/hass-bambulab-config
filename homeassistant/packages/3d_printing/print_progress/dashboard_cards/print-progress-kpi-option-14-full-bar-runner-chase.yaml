# Issue #516 - Option 14
# Derived from option 13.
# Layer: Full-card vertical fill + single-segment runner chase across ALL segments (filled + unfilled).
# Print: Pie chart + single-segment runner chase across ALL segments (filled + unfilled).
#
# Key difference from Option 13:
#   - The runner travels across the ENTIRE segment bar, not just the filled portion.
#   - Filled segments: bright pulse sweeps left-to-right on top of their base lit state.
#   - Unfilled segments: a dim colored glow sweeps through, then fades back to dark.
#   - Only one segment is highlighted at a time, creating a clear traveling chase effect.

type: horizontal-stack
cards:
  # --- Layer Progress: bottom-up fill + full-bar runner chase ---
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_current_layer
    triggers_update:
      - sensor.ntk_ryansoffice_3dprinter_total_layer_count
      - sensor.ntk_ryansoffice_3dprinter_print_status
      - sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[ 
          const currentLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_current_layer']?.state);
          const totalLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_total_layer_count']?.state);
          const hasLayerData = Number.isFinite(currentLayer) && Number.isFinite(totalLayer) && totalLayer > 0;
          const value = hasLayerData ? `${Math.round(currentLayer)}/${Math.round(totalLayer)}` : 'N/A';
          const pct = hasLayerData ? Math.max(0, Math.min(100, (currentLayer / totalLayer) * 100)) : 0;

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isActive = ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing';
          const isPaused = status === 'pause' || stage === 'pause';
          const isFinished = ['finish', 'finished', 'complete', 'completed', 'success'].includes(status) || ['finish', 'finished', 'complete', 'completed'].includes(stage);
          const color = (isActive || isFinished) ? '#2196F3' : isPaused ? '#FF9800' : '#9E9E9E';

          const segCount = 20;
          const filled = Math.round((pct / 100) * segCount);
          const segs = Array.from({ length: segCount }, (_, idx) => {
            const on = idx < filled;
            const runnerCls = isActive ? (on ? ' o14-runner-on' : ' o14-runner-off') : '';
            const delay = `--o14-delay:${idx * 0.18}s`;
            return `<span class="o14-seg${on ? ' o14-seg-on' : ''}${runnerCls}" style="--o14-color:${color}; ${delay}"></span>`;
          }).join('');

          return `<div class="o14-fill-wrap">
            <div class="o14-fill-layer" style="height:${pct}%; --o14-color:${color};"></div>
            <div class="o14-fill-content">
              <div class="o14-fill-value">${value}</div>
              <div class="o14-fill-footer">
                <span class="o14-fill-label">Layer Progress</span>
                <ha-icon icon="mdi:layers-triple" class="o14-fill-icon" style="color:${color};"></ha-icon>
              </div>
            </div>
            <div class="o14-seg-track">${segs}</div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 0
        - min-height: 104px
        - height: 104px
        - overflow: hidden
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
      custom_fields:
        body:
          - width: 100%
          - height: 100%
    extra_styles: |
      .o14-fill-wrap { position:relative; display:flex; flex-direction:column; width:100%; min-height:104px; height:100%; overflow:hidden; }
      .o14-fill-layer { position:absolute; left:0; right:0; bottom:0; background: color-mix(in srgb, var(--o14-color) 28%, transparent); transition: height 0.4s ease; z-index:0; }
      .o14-fill-content { position:relative; z-index:1; display:flex; flex-direction:column; flex-grow:1; padding:12px 12px 8px; }
      .o14-fill-value { font-size:34px; font-weight:700; text-align:center; line-height:1; padding:8px 0; flex-grow:1; display:flex; align-items:center; justify-content:center; }
      .o14-fill-footer { display:grid; grid-template-columns:18px 1fr 18px; align-items:center; }
      .o14-fill-label { grid-column:2; text-align:center; font-size:11px; font-weight:500; opacity:0.8; }
      .o14-fill-icon { grid-column:3; justify-self:end; --mdc-icon-size:18px; }
      .o14-seg-track { position:relative; z-index:2; display:grid; grid-template-columns:repeat(20, minmax(0, 1fr)); gap:2px; padding:0 4px 4px; flex-shrink:0; }
      .o14-seg { height:8px; background:rgba(120,120,120,0.25); border-radius:2px; }
      .o14-seg-on { background:var(--o14-color); box-shadow: 0 0 4px color-mix(in srgb, var(--o14-color) 50%, transparent); }
      /* Runner on filled segments: bright pulse traveling over the base lit color */
      .o14-runner-on { animation: o14-chase-on 3.6s linear infinite; animation-delay: var(--o14-delay); }
      @keyframes o14-chase-on {
        0%, 7%, 100% { filter: brightness(1); box-shadow: 0 0 4px color-mix(in srgb, var(--o14-color) 50%, transparent); }
        3.5% { filter: brightness(1.6); box-shadow: 0 0 14px color-mix(in srgb, var(--o14-color) 90%, transparent); }
      }
      /* Runner on unfilled segments: dim colored glow traveling over dark background */
      .o14-runner-off { animation: o14-chase-off 3.6s linear infinite; animation-delay: var(--o14-delay); }
      @keyframes o14-chase-off {
        0%, 7%, 100% { background: rgba(120,120,120,0.25); box-shadow: none; }
        3.5% { background: color-mix(in srgb, var(--o14-color) 35%, transparent); box-shadow: 0 0 8px color-mix(in srgb, var(--o14-color) 30%, transparent); }
      }
    grid_options:
      columns: 6

  # --- Print Progress: pie chart + full-bar runner chase ---
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_print_progress
    triggers_update:
      - sensor.ntk_ryansoffice_3dprinter_print_status
      - sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[ 
          const progress = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_print_progress']?.state);
          const hasProgress = Number.isFinite(progress);
          const pct = hasProgress ? Math.max(0, Math.min(100, progress)) : 0;
          const value = hasProgress ? `${Math.round(pct)}%` : 'N/A';

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isActive = ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing';
          const isPaused = status === 'pause' || stage === 'pause';
          const isFinished = ['finish', 'finished', 'complete', 'completed', 'success'].includes(status) || ['finish', 'finished', 'complete', 'completed'].includes(stage);
          const color = (isActive || isFinished) ? '#4CAF50' : isPaused ? '#FF9800' : '#9E9E9E';
          const pieCls = isFinished ? ' o14p-pie-finished' : '';

          const segCount = 20;
          const filled = Math.round((pct / 100) * segCount);
          const segs = Array.from({ length: segCount }, (_, idx) => {
            const on = idx < filled;
            const runnerCls = isActive ? (on ? ' o14p-runner-on' : ' o14p-runner-off') : '';
            const delay = `--o14p-delay:${idx * 0.18}s`;
            return `<span class="o14p-seg${on ? ' o14p-seg-on' : ''}${runnerCls}" style="--o14p-color:${color}; ${delay}"></span>`;
          }).join('');

          return `<div class="o14p-wrap">
            <div class="o14p-main">
              <div class="o14p-left">
                <div class="o14p-pie${pieCls}" style="background: conic-gradient(${color} ${pct}%, rgba(128,128,128,0.12) ${pct}%);"></div>
              </div>
              <div class="o14p-right">
                <div class="o14p-value">${value}</div>
                <div class="o14p-footer">
                  <span class="o14p-label">Print Progress</span>
                </div>
              </div>
            </div>
            <div class="o14p-seg-track">${segs}</div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 0
        - min-height: 104px
        - height: 104px
        - overflow: hidden
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
      custom_fields:
        body:
          - width: 100%
          - height: 100%
    extra_styles: |
      .o14p-wrap { display:flex; flex-direction:column; width:100%; min-height:104px; height:100%; overflow:hidden; }
      .o14p-main { display:flex; flex-grow:1; align-items:center; min-height:0; }
      .o14p-left { display:flex; align-items:center; justify-content:center; width:45%; padding:8px; }
      .o14p-pie { width:64px; height:64px; border-radius:50%; transition: background 0.35s ease; }
      .o14p-pie-finished { width:56px; height:56px; box-shadow: 0 0 8px color-mix(in srgb, #4CAF50 65%, transparent), 0 0 14px color-mix(in srgb, #4CAF50 45%, transparent); }
      .o14p-right { display:flex; flex-direction:column; width:55%; justify-content:center; padding:8px 8px 8px 0; }
      .o14p-value { font-size:34px; font-weight:700; text-align:center; line-height:1; flex-grow:1; display:flex; align-items:center; justify-content:center; padding:4px 0; }
      .o14p-footer { display:flex; align-items:center; justify-content:center; }
      .o14p-label { text-align:center; font-size:11px; font-weight:500; opacity:0.75; }
      .o14p-seg-track { display:grid; grid-template-columns:repeat(20, minmax(0, 1fr)); gap:2px; padding:0 4px 4px; flex-shrink:0; }
      .o14p-seg { height:8px; background:rgba(120,120,120,0.25); border-radius:2px; }
      .o14p-seg-on { background:var(--o14p-color); box-shadow: 0 0 4px color-mix(in srgb, var(--o14p-color) 50%, transparent); }
      /* Runner on filled segments: bright pulse traveling over the base lit color */
      .o14p-runner-on { animation: o14p-chase-on 3.6s linear infinite; animation-delay: var(--o14p-delay); }
      @keyframes o14p-chase-on {
        0%, 7%, 100% { filter: brightness(1); box-shadow: 0 0 4px color-mix(in srgb, var(--o14p-color) 50%, transparent); }
        3.5% { filter: brightness(1.6); box-shadow: 0 0 14px color-mix(in srgb, var(--o14p-color) 90%, transparent); }
      }
      /* Runner on unfilled segments: dim colored glow traveling over dark background */
      .o14p-runner-off { animation: o14p-chase-off 3.6s linear infinite; animation-delay: var(--o14p-delay); }
      @keyframes o14p-chase-off {
        0%, 7%, 100% { background: rgba(120,120,120,0.25); box-shadow: none; }
        3.5% { background: color-mix(in srgb, var(--o14p-color) 35%, transparent); box-shadow: 0 0 8px color-mix(in srgb, var(--o14p-color) 30%, transparent); }
      }
    grid_options:
      columns: 6
