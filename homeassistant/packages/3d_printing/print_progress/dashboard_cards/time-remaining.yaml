# Docs: docs/features/print_progress/README.md
# Time Remaining KPI card (mushroom)
# Shows formatted remaining time with "Xd Xh Xm elapsed of Yd Yh Ym total" subtitle
# Elapsed = total_estimated_print_time - remaining_time

type: custom:mushroom-template-card
primary: "{{ states('sensor.print_time_remaining_formatted') }}"
secondary: |-
  {% set total = states('sensor.total_estimated_print_time') | int(0) %}
  {% set remain = states('sensor.ntk_ryansoffice_3dprinter_remaining_time') | int(0) %}
  {% set elapsed = [total - remain, 0] | max %}
  {% if total > 0 %}
    {% set ed = elapsed // 1440 %}{% set eh = (elapsed % 1440) // 60 %}{% set em = elapsed % 60 %}
    {% set td = total // 1440 %}{% set th = (total % 1440) // 60 %}{% set tm = total % 60 %}
    {{ (ed ~ 'd ' if ed > 0 else '') ~ (eh ~ 'h ' if ed > 0 or eh > 0 else '') ~ em ~ 'm' }} elapsed of {{ (td ~ 'd ' if td > 0 else '') ~ (th ~ 'h ' if td > 0 or th > 0 else '') ~ tm ~ 'm' }} total
  {% endif %}
icon: mdi:clock-time-four
icon_color: |-
  {% set status = states('sensor.ntk_ryansoffice_3dprinter_print_status') | lower %}
  {% set stage = states('sensor.ntk_ryansoffice_3dprinter_current_stage') | lower %}
  {% if status in ['running', 'printing', 'prepare', 'slicing', 'init'] or stage == 'printing'
     or status in ['finish', 'finished', 'complete', 'completed', 'success']
     or stage in ['finish', 'finished', 'complete', 'completed'] %}
    orange
  {% elif status == 'pause' or stage == 'pause' %}
    amber
  {% else %}
    grey
  {% endif %}
tap_action:
  action: more-info
  entity: sensor.print_time_remaining_formatted
card_mod:
  style:
    mushroom-template-card$ha-tile-info$: |
      .primary {
        font-size: 28px !important;
        font-weight: 700 !important;
      }
      .secondary {
        font-size: 11px !important;
      }
grid_options:
  columns: 6
