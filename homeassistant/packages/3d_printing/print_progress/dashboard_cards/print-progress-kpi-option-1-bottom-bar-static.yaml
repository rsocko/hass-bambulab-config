# Docs: docs/features/print_progress/README.md
# Issue #516 - Option 1
# Horizontal bar across the bottom of each KPI card.
# Bar color matches icon color for each card state.

type: horizontal-stack
cards:
  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_current_layer
    triggers_update:
      - sensor.ntk_ryansoffice_3dprinter_total_layer_count
      - sensor.ntk_ryansoffice_3dprinter_print_status
      - sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[ 
          const currentLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_current_layer']?.state);
          const totalLayer = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_total_layer_count']?.state);
          const hasLayerData = Number.isFinite(currentLayer) && Number.isFinite(totalLayer) && totalLayer > 0;
          const value = hasLayerData ? `${Math.round(currentLayer)}/${Math.round(totalLayer)}` : 'N/A';
          const pct = hasLayerData ? Math.max(0, Math.min(100, (currentLayer / totalLayer) * 100)) : 0;

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isActive = ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing';
          const isPaused = status === 'pause' || stage === 'pause';
          const isFinished = ['finish', 'finished', 'complete', 'completed', 'success'].includes(status) || ['finish', 'finished', 'complete', 'completed'].includes(stage);
          const color = (isActive || isFinished) ? '#2196F3' : isPaused ? '#FF9800' : '#9E9E9E';

          return `<div class="opt-card-wrap">
            <div class="opt-card-value">${value}</div>
            <div class="opt-card-footer">
              <span class="opt-card-label">Layer Progress</span>
              <ha-icon icon="mdi:layers-triple" class="opt-card-icon" style="color:${color};"></ha-icon>
            </div>
            <div class="opt-bottom-track">
              <div class="opt-bottom-fill" style="width:${pct}%; background:${color};"></div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 0
        - min-height: 102px
        - overflow: hidden
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
      custom_fields:
        body:
          - width: 100%
    extra_styles: |
      .opt-card-wrap { display:flex; flex-direction:column; width:100%; min-height:102px; }
      .opt-card-value { font-size:34px; font-weight:700; text-align:center; line-height:1; padding:8px 0; flex-grow:1; display:flex; align-items:center; justify-content:center; }
      .opt-card-footer { display:grid; grid-template-columns:18px 1fr 18px; align-items:center; margin-bottom:8px; padding:0 12px; }
      .opt-card-label { grid-column:2; text-align:center; font-size:11px; font-weight:500; opacity:0.75; }
      .opt-card-icon { grid-column:3; justify-self:end; --mdc-icon-size:18px; }
      .opt-bottom-track { width:100%; height:4px; background:rgba(120,120,120,0.2); overflow:hidden; }
      .opt-bottom-fill { height:100%; }
    grid_options:
      columns: 6

  - type: custom:button-card
    entity: sensor.ntk_ryansoffice_3dprinter_print_progress
    triggers_update:
      - sensor.ntk_ryansoffice_3dprinter_print_status
      - sensor.ntk_ryansoffice_3dprinter_current_stage
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[ 
          const progress = parseFloat(states['sensor.ntk_ryansoffice_3dprinter_print_progress']?.state);
          const hasProgress = Number.isFinite(progress);
          const pct = hasProgress ? Math.max(0, Math.min(100, progress)) : 0;
          const value = hasProgress ? `${Math.round(pct)}%` : 'N/A';

          const status = states['sensor.ntk_ryansoffice_3dprinter_print_status']?.state?.toLowerCase() || '';
          const stage = states['sensor.ntk_ryansoffice_3dprinter_current_stage']?.state?.toLowerCase() || '';
          const isActive = ['running', 'printing', 'prepare', 'slicing', 'init'].includes(status) || stage === 'printing';
          const isPaused = status === 'pause' || stage === 'pause';
          const isFinished = ['finish', 'finished', 'complete', 'completed', 'success'].includes(status) || ['finish', 'finished', 'complete', 'completed'].includes(stage);
          const color = (isActive || isFinished) ? '#4CAF50' : isPaused ? '#FF9800' : '#9E9E9E';

          return `<div class="opt-card-wrap">
            <div class="opt-card-value">${value}</div>
            <div class="opt-card-footer">
              <span class="opt-card-label">Print Progress</span>
              <ha-icon icon="mdi:rotate-right" class="opt-card-icon" style="color:${color};"></ha-icon>
            </div>
            <div class="opt-bottom-track">
              <div class="opt-bottom-fill" style="width:${pct}%; background:${color};"></div>
            </div>
          </div>`;
        ]]]
    styles:
      card:
        - padding: 0
        - min-height: 102px
        - overflow: hidden
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
      custom_fields:
        body:
          - width: 100%
    extra_styles: |
      .opt-card-wrap { display:flex; flex-direction:column; width:100%; min-height:102px; }
      .opt-card-value { font-size:34px; font-weight:700; text-align:center; line-height:1; padding:8px 0; flex-grow:1; display:flex; align-items:center; justify-content:center; }
      .opt-card-footer { display:grid; grid-template-columns:18px 1fr 18px; align-items:center; margin-bottom:8px; padding:0 12px; }
      .opt-card-label { grid-column:2; text-align:center; font-size:11px; font-weight:500; opacity:0.75; }
      .opt-card-icon { grid-column:3; justify-self:end; --mdc-icon-size:18px; }
      .opt-bottom-track { width:100%; height:4px; background:rgba(120,120,120,0.2); overflow:hidden; }
      .opt-bottom-fill { height:100%; }
    grid_options:
      columns: 6
