# Docs: docs/features/wled/README.md
wled_3dprinter_apply_active_tray_overlay:
  alias: WLED 3D Printer - Apply Active Tray Overlay
  description: >-
    During S3_PRINTING, override the active tray tag segment with the active
    filament color from sensor.ntk_ryansoffice_3dprinter_active_tray.
  mode: restart
  sequence:
    - variables:
        active_tray_entity: sensor.ntk_ryansoffice_3dprinter_active_tray
        active_tray_state: "{{ states(active_tray_entity) | string | trim }}"
        ams_index_attr: >-
          {{ state_attr(active_tray_entity, 'AMS Index') | default(state_attr(active_tray_entity, 'ams_index'), true) }}
        tray_index_attr: >-
          {{ state_attr(active_tray_entity, 'Tray Index') | default(state_attr(active_tray_entity, 'tray_index'), true) }}
        color_hex_raw: >-
          {{ state_attr(active_tray_entity, 'Color') | default(state_attr(active_tray_entity, 'color'), true) | string | trim }}
        ams_index_from_state: >-
          {% set s = active_tray_state | upper %}
          {% if s | length >= 2 and s[0] in ['A', 'B'] and s[1] in ['1', '2', '3', '4'] %}
            {{ 1 if s[0] == 'A' else 2 }}
          {% else %}
            0
          {% endif %}
        tray_slot_from_state: >-
          {% set s = active_tray_state | upper %}
          {% if s | length >= 2 and s[0] in ['A', 'B'] and s[1] in ['1', '2', '3', '4'] %}
            {{ s[1] | int(0) }}
          {% else %}
            0
          {% endif %}
        ams_index: >-
          {% set a = ams_index_attr | int(-1) %}
          {% if a in [0, 1] %}
            {{ a + 1 }}
          {% else %}
            {{ ams_index_from_state | int(0) }}
          {% endif %}
        tray_slot: >-
          {% set t = tray_index_attr | int(-1) %}
          {% if t in [0, 1, 2, 3] %}
            {{ t + 1 }}
          {% elif (tray_slot_from_state | int(0)) in [1, 2, 3, 4] %}
            {{ tray_slot_from_state | int(0) }}
          {% else %}
            0
          {% endif %}
        tag_segment: >-
          {% if ams_index | int(0) == 1 and tray_slot | int(0) in [1, 2, 3, 4] %}
            {{ 4 + (tray_slot | int(0)) }}
          {% elif ams_index | int(0) == 2 and tray_slot | int(0) in [1, 2, 3, 4] %}
            {{ 9 + (tray_slot | int(0)) }}
          {% else %}
            0
          {% endif %}
        color_hex_clean: >-
          {{ color_hex_raw | replace('#', '') | replace('"', '') | lower }}
        color_hex: >-
          {% if color_hex_clean | regex_match('^[0-9a-f]{8}$') %}
            {{ color_hex_clean[0:6] }}
          {% elif color_hex_clean | regex_match('^[0-9a-f]{6}$') %}
            {{ color_hex_clean }}
          {% else %}
            
          {% endif %}
        has_valid_color: >-
          {{ color_hex | regex_match('^[0-9a-f]{6}$') }}
        base_r: "{{ color_hex[0:2] | int(0, 16) if has_valid_color else 0 }}"
        base_g: "{{ color_hex[2:4] | int(0, 16) if has_valid_color else 0 }}"
        base_b: "{{ color_hex[4:6] | int(0, 16) if has_valid_color else 0 }}"
        luminance: >-
          {{ (0.2126 * (base_r | float(0))) + (0.7152 * (base_g | float(0))) + (0.0722 * (base_b | float(0))) }}
        is_black_like: >-
          {{ (base_r | int(0) <= 20 and base_g | int(0) <= 20 and base_b | int(0) <= 20) or (luminance | float(0) < 18) }}
        is_too_light: >-
          {{ luminance | float(0) > 235 }}
        boost_scale: >-
          {% if luminance | float(0) > 0 and luminance | float(0) < 80 %}
            {{ 80 / (luminance | float(0)) }}
          {% else %}
            1
          {% endif %}
        color_policy: >-
          {% if not has_valid_color %}
            fallback_invalid
          {% elif is_black_like %}
            fallback_black
          {% elif is_too_light %}
            fallback_light
          {% elif luminance | float(0) < 80 %}
            boosted_dark
          {% else %}
            exact
          {% endif %}
        color_r: >-
          {% if color_policy in ['fallback_invalid', 'fallback_black'] %}
            79
          {% elif color_policy == 'fallback_light' %}
            255
          {% elif color_policy == 'boosted_dark' %}
            {{ [((base_r | float(0)) * (boost_scale | float(1))) | round(0) | int, 255] | min }}
          {% else %}
            {{ base_r | int(0) }}
          {% endif %}
        color_g: >-
          {% if color_policy in ['fallback_invalid', 'fallback_black'] %}
            163
          {% elif color_policy == 'fallback_light' %}
            179
          {% elif color_policy == 'boosted_dark' %}
            {{ [((base_g | float(0)) * (boost_scale | float(1))) | round(0) | int, 255] | min }}
          {% else %}
            {{ base_g | int(0) }}
          {% endif %}
        color_b: >-
          {% if color_policy in ['fallback_invalid', 'fallback_black'] %}
            255
          {% elif color_policy == 'fallback_light' %}
            71
          {% elif color_policy == 'boosted_dark' %}
            {{ [((base_b | float(0)) * (boost_scale | float(1))) | round(0) | int, 255] | min }}
          {% else %}
            {{ base_b | int(0) }}
          {% endif %}
    - condition: state
      entity_id: input_select.wled_3dprinter_core_state
      state: S3_PRINTING
    - condition: template
      value_template: >-
        {{ states('input_text.wled_3dprinter_digquad_ip') | length > 0 }}
    - condition: template
      value_template: >-
        {{ tag_segment | int(0) > 0 }}
    - action: rest_command.wled_3dprinter_digquad_update_state
      data:
        payload: >-
          {{ {'seg': [{'id': tag_segment | int, 'col': [[color_r | int, color_g | int, color_b | int]], 'fx': 0}]} | tojson }}
    - action: logbook.log
      data:
        name: WLED 3D Printer Active Tray Overlay
        message: >-
          Applied active tray overlay - tray={{ active_tray_state }},
          segment={{ tag_segment }}, source=#{{ color_hex_clean }},
          rgb={{ color_r }},{{ color_g }},{{ color_b }}, policy={{ color_policy }}
