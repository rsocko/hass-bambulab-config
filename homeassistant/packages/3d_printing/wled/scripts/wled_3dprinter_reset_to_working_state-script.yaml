# Nuclear reset: re-reads sensors, force-sets core state, re-applies
# base layout + state preset + all applicable overlays.
# Use when the state machine is stuck or WLED segments are corrupted.
wled_3dprinter_reset_to_working_state:
  alias: WLED 3D Printer - Reset To Working State
  description: >-
    Full reset of the WLED state machine. Re-applies SM Base Layout
    to restore 15-segment boundaries, recomputes the correct core state
    from current printer sensors, forces the input_select, then applies
    the matching preset and overlays. Use when force-resync alone
    doesn't fix display issues.
  icon: mdi:restart-alert
  mode: single
  sequence:
    # ── 1. Restore 15-segment boundaries ──
    - action: logbook.log
      data:
        name: WLED 3D Printer State Machine
        message: "Reset To Working State: starting full reset"
    - action: select.select_option
      target:
        entity_id: select.dig_quad_v3_preset
      data:
        option: "SM Base Layout"
    - delay:
        seconds: 3

    # ── 2. Compute correct state from live sensors ──
    - variables:
        smart_status: "{{ states('sensor.ntk_ryansoffice_3dprinter_smart_status') }}"
        stage: "{{ states('sensor.ntk_ryansoffice_3dprinter_current_stage') | lower }}"
        hms_errors: "{{ states('binary_sensor.ntk_ryansoffice_3dprinter_hms_errors') | lower }}"
        show_mode: "{{ is_state('input_boolean.wled_3dprinter_show_mode_enabled', 'on') }}"
        current_state: "{{ states('input_select.wled_3dprinter_core_state') }}"
        maintenance_stages: >-
          {{ [
            'cleaning_nozzle_tip', 'filament_loading', 'filament_unloading',
            'calibrating_extrusion', 'calibrating_extrusion_flow',
            'calibrating_micro_lidar', 'calibrating_motor_noise',
            'absolute_accuracy_calibration',
            'check_absolute_accuracy_before_calibration',
            'check_absolute_accuracy_after_calibration',
            'calibrate_nozzle_offset', 'laser_calibration',
            'calibrate_birdeye_camera', 'motor_noise_showoff',
            'check_door_and_cover', 'check_quick_release',
            'check_plaform', 'check_birdeye_camera_position'
          ] }}
        correct_state: >-
          {% set smart_lc = smart_status | lower %}
          {% if smart_status in ['unavailable', 'unknown'] %}
            S0_OFFLINE
          {% elif smart_status == 'Offline' %}
            S0_OFFLINE
          {% elif show_mode and smart_status == 'Idle' %}
            S8_SHOW
          {% elif smart_status == 'Print Finished' %}
            S6_FINISHING
          {% elif smart_status.startswith('Paused') %}
            {% if 'runout' in smart_lc or 'clog' in smart_lc or 'ams lost' in smart_lc or 'first layer error' in smart_lc or hms_errors == 'on' %}
              S5_PAUSED_ERROR
            {% else %}
              S4_PAUSED_USER
            {% endif %}
          {% elif smart_status == 'Printing' %}
            S3_PRINTING
          {% elif stage in maintenance_stages and smart_status not in ['Printing', 'Preparing Print'] %}
            S7_MAINTENANCE
          {% elif smart_status in ['Preparing Print', 'Heating Bed', 'Heating Nozzle', 'Heating Chamber', 'Cooling Chamber', 'Bed Leveling', 'Homing / Checks', 'Nozzle Prep', 'Filament Change', 'Calibration', 'Identifying Build Plate', 'Printing Calibration Lines', 'Inspecting First Layer'] %}
            S2_PREP
          {% elif smart_status == 'Idle' %}
            S1_IDLE
          {% else %}
            S1_IDLE
          {% endif %}

    # ── 3. Force-set core state ──
    - action: input_select.select_option
      data:
        entity_id: input_select.wled_3dprinter_core_state
        option: "{{ correct_state | trim }}"
    - action: input_text.set_value
      data:
        entity_id: input_text.wled_3dprinter_last_event
        value: "RESET"
    - action: input_text.set_value
      data:
        entity_id: input_text.wled_3dprinter_last_transition_reason
        value: >-
          {{ ('manual_reset; was=' ~ current_state ~ '; now=' ~ correct_state | trim ~ '; smart_status=' ~ smart_status ~ '; stage=' ~ stage)[:255] }}

    # ── 4. Apply state preset ──
    - action: script.wled_3dprinter_apply_core_state_to_presets
      data:
        override_state: "{{ correct_state | trim }}"

    # ── 5. Apply overlays for the resolved state ──
    - delay:
        milliseconds: 500
    - if:
        - condition: template
          value_template: "{{ correct_state | trim == 'S3_PRINTING' }}"
      then:
        - action: script.wled_3dprinter_apply_active_tray_overlay
          data: {}
        - action: script.wled_3dprinter_apply_progress_overlay
          data: {}
    - if:
        - condition: template
          value_template: "{{ correct_state | trim == 'S1_IDLE' }}"
      then:
        - action: script.wled_3dprinter_apply_idle_telemetry_overlays
          data: {}
    - if:
        - condition: template
          value_template: "{{ correct_state | trim in ['S4_PAUSED_USER', 'S5_PAUSED_ERROR'] }}"
      then:
        - action: script.wled_3dprinter_apply_progress_overlay
          data: {}
    - if:
        - condition: template
          value_template: "{{ correct_state | trim == 'S5_PAUSED_ERROR' }}"
      then:
        - action: script.wled_3dprinter_apply_error_tray_overlay
          data: {}

    # ── 6. Log completion ──
    - action: logbook.log
      data:
        name: WLED 3D Printer State Machine
        message: >-
          Reset To Working State complete: {{ current_state }} → {{ correct_state | trim }} (smart_status={{ smart_status }})
