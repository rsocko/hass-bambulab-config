# Docs: docs/features/wled/ha-state-machine-package.md
wled_3dprinter_apply_core_state_to_presets:
  alias: WLED 3D Printer - Apply Core State To Presets
  description: Map current core state to DigQuad/MagWLED preset IDs and apply.
  mode: restart
  fields:
    override_state:
      name: 3D Printer Override State
      description: Optional core state to apply instead of input_select value.
      required: false
      selector:
        text:
  sequence:
    - variables:
        digquad_preset_entity: select.dig_quad_v3_preset
        magwled_preset_entity: select.magwled_preset
        core_state: >-
          {% if override_state is defined and (override_state | string | trim) | length > 0 %}
            {{ override_state }}
          {% else %}
            {{ states('input_select.wled_3dprinter_core_state') }}
          {% endif %}
        digquad_preset: >-
          {% if core_state == 'S0_OFFLINE' %}SM S0 Offline
          {% elif core_state == 'S1_IDLE' %}SM S1 Idle
          {% elif core_state == 'S2_PREP' %}SM S2 Prep
          {% elif core_state == 'S3_PRINTING' %}SM S3 Printing
          {% elif core_state == 'S4_PAUSED_USER' %}SM S4 Paused User
          {% elif core_state == 'S5_PAUSED_ERROR' %}SM S5 Paused Error
          {% elif core_state == 'S6_FINISHING' %}SM S6 Finishing
          {% elif core_state == 'S7_MAINTENANCE' %}SM S7 Maintenance
          {% elif core_state == 'S8_SHOW' %}SM S8 Show
          {% else %}SM S1 Idle
          {% endif %}
        magwled_preset: >-
          {% if core_state in ['S0_OFFLINE', 'S5_PAUSED_ERROR'] %}Idle Standby
          {% else %}Normal Printing
          {% endif %}
        magwled_available_options: >-
          {{ state_attr(magwled_preset_entity, 'options') | default([], true) }}
        magwled_preset_supported: >-
          {{
            states(magwled_preset_entity) not in ['unavailable', 'unknown']
            and (magwled_available_options | count) > 0
            and (magwled_preset | trim) in magwled_available_options
          }}
    - action: select.select_option
      target:
        entity_id: "{{ digquad_preset_entity }}"
      data:
        option: "{{ digquad_preset | trim }}"
    - if:
        - condition: template
          value_template: "{{ magwled_preset_supported }}"
      then:
        - action: select.select_option
          target:
            entity_id: "{{ magwled_preset_entity }}"
          data:
            option: "{{ magwled_preset | trim }}"
    - action: logbook.log
      data:
        name: WLED 3D Printer State Machine
        message: >-
          Applied presets - DigQuad: {{ digquad_preset | trim }},
          MagWLED: {% if magwled_preset_supported %}{{ magwled_preset | trim }}{% else %}skipped (entity unavailable or preset unsupported){% endif %}
          ({{ core_state }})
