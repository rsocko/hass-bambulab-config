# Docs: docs/features/wled/README.md
wled_3dprinter_apply_error_tray_overlay:
  alias: WLED 3D Printer - Apply Error Tray Overlay
  description: >-
    During S5_PAUSED_ERROR, highlight the affected tray/tag based on current
    paused-error context (runout, clog/jam, AMS lost). This begins Phase 4.1
    affected-tray targeting.
  mode: restart
  sequence:
    - variables:
        active_tray_entity: sensor.ntk_ryansoffice_3dprinter_active_tray
        active_tray_state: "{{ (states(active_tray_entity) | string | trim) ~ '' }}"
        smart_status_lc: "{{ (states('sensor.ntk_ryansoffice_3dprinter_smart_status') | string | lower) ~ '' }}"
        stage_lc: "{{ (states('sensor.ntk_ryansoffice_3dprinter_current_stage') | string | lower) ~ '' }}"
        parse_text_lc: "{{ ((smart_status_lc ~ ' ' ~ stage_lc) | lower) ~ '' }}"
        ams_index_attr: >-
          {{ state_attr(active_tray_entity, 'AMS Index') | default(state_attr(active_tray_entity, 'ams_index'), true) }}
        tray_index_attr: >-
          {{ state_attr(active_tray_entity, 'Tray Index') | default(state_attr(active_tray_entity, 'tray_index'), true) }}
        ams_index_from_state: >-
          {% set s = (active_tray_state ~ '') | upper %}
          {% if s | length >= 2 and s[0] in ['A', 'B'] and s[1] in ['1', '2', '3', '4'] %}
            {{ 1 if s[0] == 'A' else 2 }}
          {% else %}
            0
          {% endif %}
        tray_slot_from_state: >-
          {% set s = (active_tray_state ~ '') | upper %}
          {% if s | length >= 2 and s[0] in ['A', 'B'] and s[1] in ['1', '2', '3', '4'] %}
            {{ s[1] | int(0) }}
          {% else %}
            0
          {% endif %}
        ams_index: >-
          {% set a = ams_index_attr | int(-1) %}
          {% if a in [0, 1] %}
            {{ a + 1 }}
          {% else %}
            {{ ams_index_from_state | int(0) }}
          {% endif %}
        tray_slot: >-
          {% set t = tray_index_attr | int(-1) %}
          {% if t in [0, 1, 2, 3] %}
            {{ t + 1 }}
          {% elif (tray_slot_from_state | int(0)) in [1, 2, 3, 4] %}
            {{ tray_slot_from_state | int(0) }}
          {% else %}
            0
          {% endif %}
        tray_from_active: >-
          {% if ams_index | int(0) == 1 and tray_slot | int(0) in [1, 2, 3, 4] %}
            {{ 'A' ~ (tray_slot | int(0)) }}
          {% elif ams_index | int(0) == 2 and tray_slot | int(0) in [1, 2, 3, 4] %}
            {{ 'B' ~ (tray_slot | int(0)) }}
          {% else %}
            {{ '' }}
          {% endif %}
        error_class: >-
          {% if 'runout' in smart_status_lc or 'runout' in stage_lc %}
            runout
          {% elif 'clog' in smart_status_lc or 'jam' in smart_status_lc or 'clog' in stage_lc or 'jam' in stage_lc %}
            jam
          {% elif 'ams lost' in smart_status_lc or 'ams_lost' in stage_lc %}
            ams_lost
          {% elif 'first layer error' in smart_status_lc or 'first_layer_error' in stage_lc %}
            first_layer
          {% else %}
            generic
          {% endif %}
        trays_from_context_json: >-
          {% set ns = namespace(trays=[]) %}
          {% for t in ['A1', 'A2', 'A3', 'A4', 'B1', 'B2', 'B3', 'B4'] %}
            {% if (t | lower) in parse_text_lc and t not in ns.trays %}
              {% set ns.trays = ns.trays + [t] %}
            {% endif %}
          {% endfor %}
          {% if (ns.trays | count) == 0 and (tray_from_active | trim | length) > 0 %}
            {% set ns.trays = ns.trays + [tray_from_active] %}
          {% endif %}
          {% if error_class == 'ams_lost' and (ns.trays | count) == 0 %}
            {% if ams_index | int(0) == 1 %}
              {% set ns.trays = ['A1', 'A2', 'A3', 'A4'] %}
            {% elif ams_index | int(0) == 2 %}
              {% set ns.trays = ['B1', 'B2', 'B3', 'B4'] %}
            {% endif %}
          {% endif %}
          {{ ns.trays }}
        tag_segments_json: >-
          {% set ns = namespace(seg=[]) %}
          {% for t in trays_from_context_json %}
            {% if t == 'A1' %}
              {% set ns.seg = ns.seg + [5] %}
            {% elif t == 'A2' %}
              {% set ns.seg = ns.seg + [6] %}
            {% elif t == 'A3' %}
              {% set ns.seg = ns.seg + [7] %}
            {% elif t == 'A4' %}
              {% set ns.seg = ns.seg + [8] %}
            {% elif t == 'B1' %}
              {% set ns.seg = ns.seg + [10] %}
            {% elif t == 'B2' %}
              {% set ns.seg = ns.seg + [11] %}
            {% elif t == 'B3' %}
              {% set ns.seg = ns.seg + [12] %}
            {% elif t == 'B4' %}
              {% set ns.seg = ns.seg + [13] %}
            {% endif %}
          {% endfor %}
          {{ ns.seg }}
        ams_segments_json: >-
          {% set ns = namespace(seg=[]) %}
          {% for t in trays_from_context_json %}
            {% if t.startswith('A') and 3 not in ns.seg %}
              {% set ns.seg = ns.seg + [3] %}
            {% elif t.startswith('B') and 4 not in ns.seg %}
              {% set ns.seg = ns.seg + [4] %}
            {% endif %}
          {% endfor %}
          {% if error_class == 'ams_lost' and (ns.seg | count) == 0 %}
            {% if ams_index | int(0) == 1 %}
              {% set ns.seg = [3] %}
            {% elif ams_index | int(0) == 2 %}
              {% set ns.seg = [4] %}
            {% else %}
              {% set ns.seg = [3, 4] %}
            {% endif %}
          {% endif %}
          {{ ns.seg }}
        overlay_segments_json: >-
          {% set ns = namespace(seg=[]) %}
          {% for seg_id in tag_segments_json %}
            {% if error_class == 'runout' %}
              {% set ns.seg = ns.seg + [{'id': seg_id | int(0), 'col': [[255, 0, 0]], 'fx': 1, 'sx': 190, 'ix': 195}] %}
            {% elif error_class == 'jam' %}
              {% set ns.seg = ns.seg + [{'id': seg_id | int(0), 'col': [[255, 140, 0]], 'fx': 1, 'sx': 170, 'ix': 185}] %}
            {% elif error_class == 'ams_lost' %}
              {% set ns.seg = ns.seg + [{'id': seg_id | int(0), 'col': [[0, 180, 255]], 'fx': 2, 'sx': 105, 'ix': 170}] %}
            {% elif error_class == 'first_layer' %}
              {% set ns.seg = ns.seg + [{'id': seg_id | int(0), 'col': [[255, 40, 40]], 'fx': 2, 'sx': 130, 'ix': 170}] %}
            {% else %}
              {% set ns.seg = ns.seg + [{'id': seg_id | int(0), 'col': [[255, 0, 0]], 'fx': 1, 'sx': 175, 'ix': 180}] %}
            {% endif %}
          {% endfor %}
          {% if error_class in ['runout', 'jam'] and (ams_segments_json | count) > 0 %}
            {% for seg_id in ams_segments_json %}
              {% if error_class == 'runout' %}
                {% set ns.seg = ns.seg + [{'id': seg_id | int(0), 'col': [[120, 0, 0]], 'fx': 1, 'sx': 140, 'ix': 90}] %}
              {% else %}
                {% set ns.seg = ns.seg + [{'id': seg_id | int(0), 'col': [[120, 60, 0]], 'fx': 1, 'sx': 130, 'ix': 95}] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if error_class == 'ams_lost' and (ams_segments_json | count) > 0 %}
            {% for seg_id in ams_segments_json %}
              {% set ns.seg = ns.seg + [{'id': seg_id | int(0), 'col': [[160, 64, 255]], 'fx': 2, 'sx': 90, 'ix': 180}] %}
            {% endfor %}
          {% endif %}
          {{ ns.seg | tojson }}
    - condition: state
      entity_id: input_select.wled_3dprinter_core_state
      state: S5_PAUSED_ERROR
    - condition: template
      value_template: >-
        {{ states('input_text.wled_3dprinter_digquad_ip') | length > 0 }}
    - condition: template
      value_template: >-
        {{ overlay_segments_json | count > 0 }}
    - action: rest_command.wled_3dprinter_digquad_update_state
      data:
        payload: >-
          {{ {'seg': overlay_segments_json} | tojson }}
    - action: logbook.log
      data:
        name: WLED 3D Printer Error Tray Overlay
        message: >-
          error_class={{ error_class }}; smart_status={{ states('sensor.ntk_ryansoffice_3dprinter_smart_status') }};
          stage={{ states('sensor.ntk_ryansoffice_3dprinter_current_stage') }};
          active_tray={{ active_tray_state }}; trays={{ trays_from_context_json }};
          segments={{ overlay_segments_json | map(attribute='id') | list | join(',') }}
