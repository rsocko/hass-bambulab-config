      {% elif is_state('light.dig_quad_v3', 'on') %}
      green
      {% else %}
      grey
      {% endif %}
    icon_color: >-
      {% if is_state('light.dig_quad_v3', 'on') %}
        {% set rgb = state_attr('light.dig_quad_v3', 'rgb_color') %}
        {% if rgb %}rgb({{ rgb | join(', ') }}){% else %}green{% endif %}
      {% else %}grey{% endif %}
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: more-info
    card_mod:
      style:
        ha-card: |
          {% set effect = state_attr('light.dig_quad_v3', 'effect') %}
          {% if is_state('light.dig_quad_v3', 'on') and effect not in ['Solid', 'None', none, ''] %}
          box-shadow: 0 0 10px 3px rgba(138, 43, 226, 0.7);
          {% elif is_state('light.dig_quad_v3', 'on') %}
          {% set rgb = state_attr('light.dig_quad_v3', 'rgb_color') %}
          {% if rgb %}box-shadow: 0 0 10px 3px rgba({{ rgb | join(', ') }}, 0.5);{% endif %}
          {% endif %}
        mushroom-card$: |
          .container {
            justify-content: center;
            align-items: center;
          }
          .info {
            display: none;
          }
  # DigQuad segment 1 status LED (outside front-left/top of printer)
  - type: custom:mushroom-template-card
    entity: light.dig_quad_v3_segment_1
    primary: ""
    secondary: ""
    icon: mdi:led-strip-variant
    badge_icon: >-
      {% set effect = state_attr('light.dig_quad_v3_segment_1', 'effect') %}
      {% if is_state('light.dig_quad_v3_segment_1', 'on') and effect not in ['Solid', 'None', none, ''] %}
      mdi:auto-fix
      {% else %}
      mdi:list-status
      {% endif %}
    badge_color: >-
      {% set effect = state_attr('light.dig_quad_v3_segment_1', 'effect') %}
      {% if is_state('light.dig_quad_v3_segment_1', 'on') and effect not in ['Solid', 'None', none, ''] %}
      purple
      {% elif is_state('light.dig_quad_v3_segment_1', 'on') %}
      cyan
      {% else %}
      grey
      {% endif %}
    icon_color: >-
      {% if is_state('light.dig_quad_v3_segment_1', 'on') %}
        {% set rgb = state_attr('light.dig_quad_v3_segment_1', 'rgb_color') %}
        {% if rgb %}rgb({{ rgb | join(', ') }}){% else %}cyan{% endif %}
      {% else %}grey{% endif %}
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: more-info
    card_mod:
      style:
        ha-card: |
          {% set effect = state_attr('light.dig_quad_v3_segment_1', 'effect') %}
          {% if is_state('light.dig_quad_v3_segment_1', 'on') and effect not in ['Solid', 'None', none, ''] %}
          box-shadow: 0 0 10px 3px rgba(138, 43, 226, 0.7);
          {% elif is_state('light.dig_quad_v3_segment_1', 'on') %}
          {% set rgb = state_attr('light.dig_quad_v3_segment_1', 'rgb_color') %}
          {% if rgb %}box-shadow: 0 0 10px 3px rgba({{ rgb | join(', ') }}, 0.5);{% endif %}
          {% endif %}
        mushroom-card$: |
          .container {
            justify-content: center;
            align-items: center;
          }
          .info {
            display: none;
          }
  # Show/Hide Printer Controls toggle chip
  - type: custom:mushroom-template-card
    entity: input_boolean.show_printer_controls
    primary: ""
    secondary: ""
    icon: >-
      {% if is_state('input_boolean.show_printer_controls', 'on') %}
      mdi:chevron-up
      {% else %}
      mdi:chevron-down
      {% endif %}
    icon_color: >-
      {% if is_state('input_boolean.show_printer_controls', 'on') %}
      blue
      {% else %}
      grey
      {% endif %}
    tap_action:
      action: toggle
    card_mod:
      style:
        ha-card: |
          {% if is_state('input_boolean.show_printer_controls', 'on') %}
          box-shadow: 0 0 10px 3px rgba(33, 150, 243, 0.5);
          {% endif %}
        mushroom-card$: |
