# Docs: docs/features/printer_led/LED_CONTROLS_README.md
# Printer LED Controls Row (canonical)
#
# A compact horizontal row of LED control buttons for the 3D printer dashboard.
# This file is the canonical source used by the Home dashboard view via:
#   !include ../../printer_led/dashboard_cards/printer-led-controls.yaml
#
# Button order (left to right):
#   1. Chamber Light     - light.ntk_ryansoffice_3dprinter_chamber_light
#   2. MagWLED (top)     - light.magwled
#   3. Reset MagWLED     - script.reset_interior_light_to_white
#   4. DigQuad progress  - light.dig_quad_v3
#   5. DigQuad status    - light.dig_quad_v3_segment_1
#   6. Controls toggle   - input_boolean.show_printer_controls
#
# Actions:
#   - Tap: Toggle light (or toggle controls boolean on button 6)
#   - Hold: More-info (light buttons)
#   - Double-tap: More-info (light buttons)
#
# Notes:
#   - This compact row intentionally matches the in-use UI from `view_main.yaml`.
#   - The expanded/alternative card is `led-controls-expanded.yaml`.
#
# Requirements:
#   - custom:mushroom-template-card (HACS)
#   - card_mod (HACS)
#   - script.reset_interior_light_to_white

type: horizontal-stack
cards:
  # Chamber Light (built-in printer chamber LED)
  - type: custom:mushroom-template-card
    entity: light.ntk_ryansoffice_3dprinter_chamber_light
    primary: ""
    secondary: ""
    icon: mdi:led-strip-variant
    badge_icon: mdi:cube-outline
    badge_color: >-
      {% if is_state('light.ntk_ryansoffice_3dprinter_chamber_light', 'on') %}amber{% else %}grey{% endif %}
    icon_color: >-
      {% if is_state('light.ntk_ryansoffice_3dprinter_chamber_light', 'on') %}amber{% else %}grey{% endif %}
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: more-info
    card_mod:
      style:
        ha-card: |
          {% if is_state('light.ntk_ryansoffice_3dprinter_chamber_light', 'on') %}
          box-shadow: 0 0 10px 3px rgba(255, 180, 0, 0.6);
          {% endif %}
        mushroom-card$: |
          .container {
            justify-content: center;
            align-items: center;
          }
          .info {
            display: none;
          }
  # MagWLED (interior top LED strip)
  - type: custom:mushroom-template-card
    entity: light.magwled
    primary: ""
    secondary: ""
    icon: mdi:led-strip-variant
    badge_icon: >-
      {% set effect = state_attr('light.magwled', 'effect') %}
      {% if is_state('light.magwled', 'on') and effect not in ['Solid', 'None', none, ''] %}
      mdi:auto-fix
      {% else %}
      mdi:arrow-up-bold-box-outline
      {% endif %}
    badge_color: >-
      {% set effect = state_attr('light.magwled', 'effect') %}
      {% if is_state('light.magwled', 'on') and effect not in ['Solid', 'None', none, ''] %}
      purple
      {% elif is_state('light.magwled', 'on') %}
      white
      {% else %}
      grey
      {% endif %}
    icon_color: >-
      {% if is_state('light.magwled', 'on') %}
        {% set rgb = state_attr('light.magwled', 'rgb_color') %}
        {% if rgb %}rgb({{ rgb | join(', ') }}){% else %}white{% endif %}
      {% else %}grey{% endif %}
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    double_tap_action:
      action: more-info
    card_mod:
      style:
        ha-card: |
          {% set effect = state_attr('light.magwled', 'effect') %}
          {% if is_state('light.magwled', 'on') and effect not in ['Solid', 'None', none, ''] %}
          box-shadow: 0 0 10px 3px rgba(138, 43, 226, 0.7);
          {% elif is_state('light.magwled', 'on') %}
          {% set rgb = state_attr('light.magwled', 'rgb_color') %}
          {% if rgb %}box-shadow: 0 0 10px 3px rgba({{ rgb | join(', ') }}, 0.5);{% endif %}
          {% endif %}
        mushroom-card$: |
          .container {
            justify-content: center;
            align-items: center;
          }
          .info {
            display: none;
          }
  # Reset MagWLED to white (uses existing script)
  - type: custom:mushroom-template-card
    primary: ""
    secondary: ""
    icon: mdi:restore
    icon_color: white
    tap_action:
      action: perform-action
      perform_action: script.reset_interior_light_to_white
    card_mod:
      style:
        ha-card: |
          background: rgba(255, 255, 255, 0.08);
          border: 1px solid rgba(255, 255, 255, 0.35);
        mushroom-card$: |
          .container {
            justify-content: center;
            align-items: center;
          }
          .info {
            display: none;
          }
  # DigQuad bottom progress LED (outside front-bottom of printer)
