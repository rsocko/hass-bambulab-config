printer_led_magwled_photo_lighting:
  alias: "Printer LED - MagWLED Photo Lighting"
  description: >-
    Snapshots MagWLED into a temporary scene, verifies a solid cool-white
    photo state before capture, then restores the saved scene on request.
  mode: queued
  max: 10
  fields:
    action:
      name: Action
      description: activate or restore the temporary photo-lighting override.
      required: true
      selector:
        select:
          options:
            - activate
            - restore
    restore_scene_id:
      name: Restore Scene ID
      description: Temporary scene_id used to snapshot and restore MagWLED.
      required: true
      selector:
        text:
    light_entity:
      name: Light Entity
      description: WLED light to override during photo capture.
      required: false
      selector:
        entity:
          domain: light
    settle_delay_seconds:
      name: Settle Delay Seconds
      description: Delay before activating white photo lighting.
      required: false
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: box
  sequence:
    - variables:
        requested_action: "{{ action | default('activate', true) | string | lower | trim }}"
        requested_light_entity: >-
          {% if light_entity is defined and (light_entity | string | trim) | length > 0 %}
            {{ light_entity | string | trim }}
          {% else %}
            light.magwled
          {% endif %}
        requested_scene_id: >-
          {{ restore_scene_id | default('', true) | string | lower | trim
             | replace(' ', '_') | replace('-', '_') }}
        restore_scene_entity_id: "{{ 'scene.' ~ requested_scene_id }}"
        settle_seconds: "{{ settle_delay_seconds | default(0, true) | int(0) }}"
        white_state_ready_template: >-
          {% set effect = state_attr(requested_light_entity, 'effect') | default('', true) | string %}
          {% set rgbw = state_attr(requested_light_entity, 'rgbw_color') %}
          {% set rgb = state_attr(requested_light_entity, 'rgb_color') %}
          {% set rgbw_ready = rgbw is sequence and (rgbw | count) >= 4 and (rgbw[3] | int(0) >= 200) %}
          {% set rgb_ready = rgb is sequence and (rgb | count) >= 3 and (rgb[0] | int(0) >= 240) and (rgb[1] | int(0) >= 240) and (rgb[2] | int(0) >= 240) %}
          {{ is_state(requested_light_entity, 'on') and effect == 'Solid' and (rgbw_ready or rgb_ready) }}
        light_available: >-
          {{ states(requested_light_entity) not in ['unknown', 'unavailable', 'none', 'None'] }}
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ requested_action == 'activate' and light_available and requested_scene_id | length > 0 }}
          sequence:
            - action: scene.create
              data:
                scene_id: "{{ requested_scene_id }}"
                snapshot_entities:
                  - "{{ requested_light_entity }}"
            - if:
                - condition: template
                  value_template: "{{ settle_seconds > 0 }}"
              then:
                - delay:
                    seconds: "{{ settle_seconds }}"
            - action: light.turn_on
              target:
                entity_id: "{{ requested_light_entity }}"
              data:
                brightness: 255
                effect: Solid
                rgbw_color: [0, 0, 0, 255]
            - wait_template: "{{ white_state_ready_template }}"
              timeout:
                seconds: 5
              continue_on_timeout: true
            - delay:
                seconds: 5
            - action: light.turn_on
              target:
                entity_id: "{{ requested_light_entity }}"
              data:
                brightness: 255
                effect: Solid
                rgbw_color: [0, 0, 0, 255]
            - wait_template: "{{ white_state_ready_template }}"
              timeout:
                seconds: 2
              continue_on_timeout: true
        - conditions:
            - condition: template
              value_template: >-
                {{ requested_action == 'restore' and requested_scene_id | length > 0 }}
          sequence:
            - action: scene.turn_on
              target:
                entity_id: "{{ restore_scene_entity_id }}"
      default:
        - stop: No MagWLED photo-lighting action required