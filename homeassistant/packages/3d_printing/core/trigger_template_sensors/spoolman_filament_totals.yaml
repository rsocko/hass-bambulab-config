# Docs: docs/features/core/README.md
- name: "spoolman_filament_totals"
  unique_id: spoolman_filament_totals
  state: >-
    {% set health = states('sensor.spoolman_health') | lower %}
    {% set source_count = integration_entities('spoolman')
      | select('match', '^sensor\\.spoolman_spool_\\d+$')
      | list
      | count %}
    {{ 'degraded' if health in ['unknown', 'unavailable', 'none', '']
       else 'truncated' if source_count > 1500
       else 'ok' }}
  attributes:
    available: >-
      {% set health = states('sensor.spoolman_health') | lower %}
      {{ health not in ['unknown', 'unavailable', 'none', ''] }}
    source_entity_count: >-
      {% set health = states('sensor.spoolman_health') | lower %}
      {% if health in ['unknown', 'unavailable', 'none', ''] %}
        0
      {% else %}
        {{ integration_entities('spoolman')
          | select('match', '^sensor\\.spoolman_spool_\\d+$')
          | list
          | count }}
      {% endif %}
    projected_entity_count: >-
      {% set health = states('sensor.spoolman_health') | lower %}
      {% if health in ['unknown', 'unavailable', 'none', ''] %}
        0
      {% else %}
        {{ [
          integration_entities('spoolman')
            | select('match', '^sensor\\.spoolman_spool_\\d+$')
            | list
            | count,
          1500
        ] | min }}
      {% endif %}
    projection_limit: 1500
    projection_truncated: >-
      {% set health = states('sensor.spoolman_health') | lower %}
      {{ false if health in ['unknown', 'unavailable', 'none', '']
         else integration_entities('spoolman')
           | select('match', '^sensor\\.spoolman_spool_\\d+$')
           | list
           | count > 1500 }}
    spool_options_limit: 750
    spool_options_truncated: >-
      {% set health = states('sensor.spoolman_health') | lower %}
      {{ false if health in ['unknown', 'unavailable', 'none', '']
         else integration_entities('spoolman')
           | select('match', '^sensor\\.spoolman_spool_\\d+$')
           | list
           | count > 750 }}
    spool_options: >-
      {% set ns = namespace(items=[]) %}
      {% set health = states('sensor.spoolman_health') | lower %}
      {% if health not in ['unknown', 'unavailable', 'none', ''] %}
        {% set ids = (integration_entities('spoolman')
          | select('match', '^sensor\\.spoolman_spool_\\d+$')
          | list
          | sort)[:750] %}
        {% for spool in expand(ids) %}
          {% if spool.state | lower not in ['unknown', 'unavailable', 'none', ''] %}
            {% set ns.items = ns.items + [{
              'id': spool.entity_id | replace('sensor.spoolman_spool_', ''),
              'name': (spool.attributes.get('friendly_name') | default(spool.entity_id, true) | string)[:96],
              'location': (spool.attributes.get('location') | default('Unknown', true) | string)[:48]
            }] %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.items | tojson | from_json }}
    totals: >
      {% set ns = namespace(result={}) %}
      {% set health = states('sensor.spoolman_health') | lower %}
      {% if health not in ['unknown', 'unavailable', 'none', ''] %}
        {% set spool_entity_ids = (integration_entities('spoolman')
          | select('match', '^sensor\\.spoolman_spool_\\d+$')
          | list
          | sort)[:1500] %}
        {% for spool in expand(spool_entity_ids) %}
          {% if spool.state | lower not in ['unknown', 'unavailable', 'none', ''] %}
            {% set fid_raw = spool.attributes.get('filament_id') %}
            {% set fid = fid_raw | string | trim if fid_raw is not none else '' %}
            {% set archived_raw = spool.attributes.get('archived', false) %}
            {% set archived = archived_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] %}
            {% if fid not in ['', 'None', 'none', 'unknown', 'unavailable'] and not archived %}
              {% set w = spool.attributes.get('remaining_weight', 0) | float(0) %}
              {% set sealed_raw = spool.attributes.get('extra_sealed', false) %}
              {% set sealed = sealed_raw in [true, 'true', 'True', 1, '1', 'on', 'On'] %}
              {% set existing = ns.result.get(fid, {
                'weight': 0,
                'count': 0,
                'preferred_spool_entity_id': none
              }) %}
              {% set preferred = existing.get('preferred_spool_entity_id') %}
              {% if preferred is none or not sealed %}
                {% set preferred = spool.entity_id %}
              {% endif %}
              {% set ns.result = ns.result | combine({
                fid: {
                  'weight': existing.get('weight', 0) + w,
                  'count': existing.get('count', 0) + 1,
                  'preferred_spool_entity_id': preferred
                }
              }) %}
            {% endif %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.result | tojson | from_json }}
