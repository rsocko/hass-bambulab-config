  # ---------------------------------------------------------------------------
  # Total Estimated Print Time
  # ---------------------------------------------------------------------------
  # Calculates the total estimated print duration (in minutes) from the
  # printer's reported start and end times. Used as the arc maximum so the
  # remaining-time arc (p1b4) scales proportionally.
  #
  # Source: sensor.ntk_ryansoffice_3dprinter_start_time
  #         sensor.ntk_ryansoffice_3dprinter_end_time
  # Used by: officetouch5.yaml -> p1b4 (arc max value)
- name: "Total Estimated Print Time"
  unique_id: total_estimated_print_time
  unit_of_measurement: "min"
  state: >
    {% set start = states('sensor.ntk_ryansoffice_3dprinter_start_time') %}
    {% set end_time = states('sensor.ntk_ryansoffice_3dprinter_end_time') %}
    {% if start not in ['unknown', 'unavailable', '', none] and end_time not in ['unknown', 'unavailable', '', none] %}
      {% set start_ts = as_timestamp(start, 0) %}
      {% set end_ts = as_timestamp(end_time, 0) %}
      {{ ((end_ts - start_ts) / 60) | round(0) if start_ts > 0 and end_ts > 0 else 0 }}
    {% else %}
      0
    {% endif %}
