# Docs: docs/features/core/README.md
- name: "spoolman_tray_map"
  state: "ok"
  attributes:
    tray_map: >
      {% set trays = {
        'ams_1_tray_1': 'sensor.p1s_01p00c460102350_ams_1_tray_1',
        'ams_1_tray_2': 'sensor.p1s_01p00c460102350_ams_1_tray_2',
        'ams_1_tray_3': 'sensor.p1s_01p00c460102350_ams_1_tray_3',
        'ams_1_tray_4': 'sensor.p1s_01p00c460102350_ams_1_tray_4',

        'ams_2_tray_1': 'sensor.p1s_01p00c460102350_ams_2_tray_1',
        'ams_2_tray_2': 'sensor.p1s_01p00c460102350_ams_2_tray_2',
        'ams_2_tray_3': 'sensor.p1s_01p00c460102350_ams_2_tray_3',
        'ams_2_tray_4': 'sensor.p1s_01p00c460102350_ams_2_tray_4',

        'external_spool' : 'sensor.ntk_ryansoffice_3dprinter_external_spool'
      } %}
      {% set tray_override_helpers = {
        'ams_1_tray_1': 'input_text.ams_1_tray_1_spool_override',
        'ams_1_tray_2': 'input_text.ams_1_tray_2_spool_override',
        'ams_1_tray_3': 'input_text.ams_1_tray_3_spool_override',
        'ams_1_tray_4': 'input_text.ams_1_tray_4_spool_override',
        'ams_2_tray_1': 'input_text.ams_2_tray_1_spool_override',
        'ams_2_tray_2': 'input_text.ams_2_tray_2_spool_override',
        'ams_2_tray_3': 'input_text.ams_2_tray_3_spool_override',
        'ams_2_tray_4': 'input_text.ams_2_tray_4_spool_override',
        'external_spool': 'input_text.external_spool_spool_override'
      } %}

      {% set spool_entity_ids = integration_entities('spoolman')
        | select('match', '^sensor\\.spoolman_spool_\\d+$')
        | list
      %}
      {% set spool_entities = expand(spool_entity_ids)
        | rejectattr('attributes.extra_sealed', 'equalto', true)
        | list
      %}

      {% set EMPTY_UUID = '00000000000000000000000000000000' %}
      {% set EMPTY_COLOR = 'none' %}
      {% set ENABLE_MULTI_ANY_HEX_FALLBACK = true %}

      {% set ns = namespace(result={}) %}
      {% set now_ts = now().timestamp() %}

      {% for tray_name, tray_entity in trays.items() %}
        {% set tray_type = state_attr(tray_entity, 'type') %}
        {% set tray_uuid = state_attr(tray_entity, 'tray_uuid') | default('', true) | string %}
        {% set tray_uuid_normalized = tray_uuid | trim('"') | lower %}
        {% set tray_color = state_attr(tray_entity, 'color') | default('', true) | string | lower %}
        {% set tray_profile_name = state_attr(tray_entity, 'name') | default('', true) | string %}
        {% set tray_material = tray_type | default('', true) | string %}
        {% set override_entity = tray_override_helpers.get(tray_name, '') %}
        {% set raw_pin_value = states(override_entity) | default('', true) | string | trim %}
        {% if raw_pin_value.startswith('sensor.spoolman_spool_') %}
          {% set pin_spool_candidate = raw_pin_value | replace('sensor.spoolman_spool_', '') %}
        {% else %}
          {% set pin_spool_candidate = raw_pin_value %}
        {% endif %}
        {% set ns_pin = namespace(matches=[]) %}
        {% if pin_spool_candidate | length > 0 and pin_spool_candidate | lower not in ['unknown', 'unavailable', 'none', 'null'] %}
          {% set target_entity_id = 'sensor.spoolman_spool_' ~ pin_spool_candidate %}
          {% for s in spool_entities %}
            {% if s.entity_id == target_entity_id %}
              {% set ns_pin.matches = ns_pin.matches + [s] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set pin_active = (ns_pin.matches | length == 1) %}
        {% set pin_spool_id = pin_spool_candidate if pin_active else none %}
        {% set pin_applied = false %}
        {% set candidate_spool_ids = [] %}
        {% set candidate_count = 0 %}
        {% set match_state = 'unmatched' %}

        {# --- EMPTY TRAY HANDLING --- #}
        {# If the tray is Empty but has an active pin, fall through to matching #}
        {# so the pinned spool is resolved and shown in the popup.            #}
        {% if tray_type == 'Empty' and not pin_active %}
          {% set ns.result = ns.result | combine({
            tray_name: {
              'spool_entity_id': none,
              'spool_id': none,
              'name': 'Empty',
              'desiccant': none,
              'filled': none,
              'status': 'empty',
              'color': none,
              'reason': none,
              'match_strategy': none,
              'match_tier': none,
              'match_state': 'empty',
              'candidate_count': 0,
              'candidate_spool_ids': [],
              'pin_active': false,
              'pin_spool_id': none,
              'pin_applied': false
            }
          }) %}
          {% continue %}
        {% endif %}

        {# --- EMPTY EXTERNAL SPOOL HANDLING --- #}
        {# External spool does not have 'type' attribute like AMS trays do #}
        {# Detection signals: name='Empty', UUID=all zeros, color alpha=00 #}
        {% if tray_name.startswith('external_spool') %}
          {% set ext_name = state_attr(tray_entity, 'name') %}
          {% set has_zero_alpha = (tray_color | length >= 8 and tray_color[-2:] == '00')
                or (tray_color | replace('#','') | length == 8 and tray_color[-2:] == '00') %}
          {% set is_uuid_empty = (not tray_uuid_normalized or tray_uuid_normalized == '' or tray_uuid_normalized == EMPTY_UUID) %}
          {% set is_color_empty = (not tray_color or tray_color == '' or tray_color == EMPTY_COLOR or has_zero_alpha) %}
          {% if (ext_name == 'Empty' or (is_uuid_empty and is_color_empty)) and not pin_active %}
            {% set ns.result = ns.result | combine({
              tray_name: {
                'spool_entity_id': none,
                'spool_id': none,
                'name': 'Empty',
                'desiccant': none,
                'filled': none,
                'status': 'empty',
                'color': none,
                'reason': none,
                'match_strategy': none,
                'match_tier': none,
                'match_state': 'empty',
                'candidate_count': 0,
                'candidate_spool_ids': [],
                'pin_active': false,
                'pin_spool_id': none,
                'pin_applied': false
              }
            }) %}
            {% continue %}
          {% endif %}
        {% endif %}
        {# -------------------------------- #}

        {# Normalize tray color: remove '#' and strip transparency characters if 8 hex digits #}
        {% if tray_color %}
          {% if tray_color.startswith('#') %}
            {% set tray_color = tray_color[1:] %}
          {% endif %}
          {% if tray_color | length == 8 %}
            {% set tray_color = tray_color[0:6] %}
          {% endif %}
        {% endif %}

        {% set match = [] %}
        {% set spool_entity = none %}
        {% set match_reason = none %}
        {% set match_strategy = none %}
        {% set match_tier = none %}
        {% set tried_uuid = false %}
        {% set is_bambu_path = false %}

        {% if tray_uuid_normalized and tray_uuid_normalized != '' and tray_uuid_normalized != EMPTY_UUID and not tray_uuid_normalized | regex_match('^0+$') %}
          {% set tried_uuid = true %}
          {% set is_bambu_path = true %}
          {# Match by tray_uuid #}
          {% set ns_uuid = namespace(spools=[]) %}
          {% for s in spool_entities %}
            {% set spool_uuid = s.attributes.extra_spool_uuid | default('', true) | string | trim('"') | lower %}
            {% if spool_uuid == tray_uuid_normalized %}
              {% set ns_uuid.spools = ns_uuid.spools + [s] %}
            {% endif %}
          {% endfor %}
          {% set match = ns_uuid.spools %}
          {% if match | length > 1 %}
            {% set match_reason = 'Multiple spools with UUID ' ~ tray_uuid_normalized ~ ' - ensure UUIDs are unique' %}
            {% set ns_candidate = namespace(vals=[]) %}
            {% for cand in match %}
              {% set ns_candidate.vals = ns_candidate.vals + [cand.entity_id.split('_')[-1]] %}
            {% endfor %}
            {% set candidate_spool_ids = ns_candidate.vals %}
            {% set candidate_count = candidate_spool_ids | length %}
            {% set match_state = 'ambiguous' %}
            {% set match = [] %}
          {% elif match | length == 1 %}
            {% set match_state = 'matched' %}
            {% set match_tier = 'uuid' %}
            {% set match_strategy = 'uuid' %}
          {% endif %}
        {% endif %}

        {# Detect Bambu path from profile name when UUID is unavailable (e.g., external spool) #}
        {% if not is_bambu_path and tray_profile_name.startswith('Bambu') %}
          {% set is_bambu_path = true %}
        {% endif %}

        {% if match | length == 0 and match_reason is none %}
          {% if pin_active %}
            {% set match = ns_pin.matches %}
            {% set pin_applied = true %}
            {% set match_state = 'matched' %}
            {% set match_tier = 'manual_pin' %}
            {% set match_strategy = 'manual_pin' %}
          {% endif %}
        {% endif %}

        {% if match | length == 0 and match_reason is none %}
          {# Fallback tiers: single-color -> multi-color first-hex -> optional multi-color any-hex #}
          {% set ns_color = namespace(single=[], multi_first=[], multi_any=[]) %}
          {% for s in spool_entities %}
            {% set spool_color = s.attributes.filament_color_hex | default('', true) | string | lower %}
            {% set spool_multi_raw = s.attributes.filament_multi_color_hexes | default('', true) | string %}
            {% set spool_material = s.attributes.filament_material | default('', true) | string %}
            {% set spool_vendor = s.attributes.filament_vendor_name | default('', true) | string %}
            {% set spool_profile = s.attributes.filament_extra_profile_name
              | default(s.attributes.extra_profile_name | default('', true), true)
              | string
              | trim('"') %}
            {% if spool_color.startswith('#') %}
              {% set spool_color = spool_color[1:] %}
            {% endif %}
            {% if spool_color | length == 8 %}
              {% set spool_color = spool_color[0:6] %}
            {% endif %}

            {% set ns_multi = namespace(list=[], first='') %}
            {% if spool_multi_raw | length > 0 %}
              {% for raw_hex in spool_multi_raw.split(',') %}
                {% set parsed_hex = raw_hex | string | trim | lower %}
                {% if parsed_hex.startswith('#') %}
                  {% set parsed_hex = parsed_hex[1:] %}
                {% endif %}
                {% if parsed_hex | length == 8 %}
                  {% set parsed_hex = parsed_hex[0:6] %}
                {% endif %}
                {% if parsed_hex | length == 6 %}
                  {% if ns_multi.first == '' %}
                    {% set ns_multi.first = parsed_hex %}
                  {% endif %}
                  {% set ns_multi.list = ns_multi.list + [parsed_hex] %}
                {% endif %}
              {% endfor %}
            {% endif %}

            {% set vendor_ok = (spool_vendor == 'Bambu Lab') if is_bambu_path else (spool_vendor != 'Bambu Lab') %}
            {% set profile_ok = (spool_profile == tray_profile_name) if (is_bambu_path and tray_profile_name | length > 0 and spool_profile | length > 0) else true %}
            {% set base_ok = spool_material == tray_material and vendor_ok and profile_ok %}

            {% if base_ok and spool_color == tray_color %}
              {% set ns_color.single = ns_color.single + [s] %}
            {% endif %}
            {% if base_ok and ns_multi.first == tray_color %}
              {% set ns_color.multi_first = ns_color.multi_first + [s] %}
            {% endif %}
            {% if base_ok and ENABLE_MULTI_ANY_HEX_FALLBACK and (tray_color in ns_multi.list) %}
              {% set ns_color.multi_any = ns_color.multi_any + [s] %}
            {% endif %}
          {% endfor %}

          {% set tier_strategy = none %}
          {% if ns_color.single | length > 0 %}
            {% set match = ns_color.single %}
            {% set tier_strategy = 'color_type' %}
          {% elif ns_color.multi_first | length > 0 %}
            {% set match = ns_color.multi_first %}
            {% set tier_strategy = 'multicolor_first_hex' %}
          {% elif ns_color.multi_any | length > 0 %}
            {% set match = ns_color.multi_any %}
            {% set tier_strategy = 'multicolor_any_hex' %}
          {% else %}
            {% set match = [] %}
          {% endif %}

          {% if match | length > 1 %}
            {# Prefer spools marked as in AMS location if exactly one candidate is in AMS #}
            {% set ams_matches = match | selectattr('attributes.location', 'equalto', 'AMS') | list %}
            {% if ams_matches | length == 1 %}
              {% set match = ams_matches %}
              {% set match_state = 'matched' %}
              {% set match_tier = tier_strategy ~ '_ams_preference' %}
              {% set match_strategy = tier_strategy ~ '_ams_preference' %}
            {% elif ams_matches | length > 1 %}
              {% set ns_candidate = namespace(vals=[]) %}
              {% for cand in ams_matches %}
                {% set ns_candidate.vals = ns_candidate.vals + [cand.entity_id.split('_')[-1]] %}
              {% endfor %}
              {% set candidate_spool_ids = ns_candidate.vals %}
              {% set candidate_count = candidate_spool_ids | length %}
              {% set match_state = 'ambiguous' %}
              {% set match_reason = 'Multiple unsealed spools with color #' ~ tray_color ~ ' and type ' ~ tray_material ~ ' found in AMS' %}
              {% set match = [] %}
            {% else %}
              {% set ns_candidate = namespace(vals=[]) %}
              {% for cand in match %}
                {% set ns_candidate.vals = ns_candidate.vals + [cand.entity_id.split('_')[-1]] %}
              {% endfor %}
              {% set candidate_spool_ids = ns_candidate.vals %}
              {% set candidate_count = candidate_spool_ids | length %}
              {% set match_state = 'ambiguous' %}
              {% set match_reason = 'Multiple unsealed spools with color #' ~ tray_color ~ ' and type ' ~ tray_material ~ ', none in AMS' %}
              {% set match = [] %}
            {% endif %}
          {% elif match | length == 0 %}
            {% set match_state = 'unmatched' %}
            {% if tried_uuid %}
              {% set match_reason = 'No unsealed Bambu spool matched UUID ' ~ tray_uuid_normalized ~ ' or color #' ~ tray_color ~ ' and type ' ~ tray_material %}
            {% else %}
              {% set match_reason = 'No unsealed spool with color #' ~ tray_color ~ ' and type ' ~ tray_material %}
            {% endif %}
          {% else %}
            {% set match_state = 'matched' %}
            {% set match_tier = tier_strategy %}
            {% set match_strategy = tier_strategy %}
          {% endif %}
        {% endif %}

        {% if match %}
          {% set spool_entity = match[0] %}
          {% set spool_id = spool_entity.entity_id.split('_')[-1] %}
          {% set spool_name = spool_entity.attributes.friendly_name %}

          {% set desiccant = spool_entity.attributes.extra_desiccant_in_spool | default(None) %}
          {% set filled = spool_entity.attributes.extra_desiccant_filled | default(None) %}
          {% if filled is string
            and filled != ''
            and filled != 'unknown'
            and as_timestamp(filled | default(0)) is number
            and as_timestamp(filled | default(0)) > 0
            and as_timestamp(filled | default(0)) < now_ts %}

            {% set filled_ts = as_timestamp(filled) %}
          {% else %}
            {% set filled_ts = none %}
          {% endif %}

          {% set des_yellow = states('input_number.desiccant_threshold_yellow_days') | float(45) %}
          {% set des_orange = states('input_number.desiccant_threshold_orange_days') | float(60) %}
          {% set des_red = states('input_number.desiccant_threshold_red_days') | float(75) %}
          {% if not desiccant or not filled_ts %}
            {% set status = 'undefined' %}
          {% else %}
            {% set age = (now_ts - filled_ts) / 86400 %}
            {% if age < des_yellow %}
              {% set status = 'green' %}
            {% elif age < des_orange %}
              {% set status = 'yellow' %}
            {% elif age < des_red %}
              {% set status = 'orange' %}
            {% else %}
              {% set status = 'red' %}
            {% endif %}
          {% endif %}

          {% set ns.result = ns.result | combine({
            tray_name: {
              'spool_entity_id': spool_entity.entity_id,
              'spool_id': spool_id,
              'name': spool_name,
              'desiccant': desiccant,
              'filled': filled,
              'status': status,
              'color': tray_color,
              'reason': none,
              'match_strategy': match_strategy,
              'match_tier': match_tier,
              'match_state': match_state,
              'candidate_count': candidate_count,
              'candidate_spool_ids': candidate_spool_ids,
              'pin_active': pin_active,
              'pin_spool_id': pin_spool_id,
              'pin_applied': pin_applied
            }
          }) %}
        {% else %}
          {% set ns.result = ns.result | combine({
            tray_name: {
              'spool_entity_id': none,
              'spool_id': none,
              'name': 'Unknown Filament',
              'desiccant': none,
              'filled': none,
              'status': 'undefined',
              'color': tray_color,
              'reason': match_reason,
              'match_strategy': none,
              'match_tier': none,
              'match_state': match_state,
              'candidate_count': candidate_count,
              'candidate_spool_ids': candidate_spool_ids,
              'pin_active': pin_active,
              'pin_spool_id': pin_spool_id,
              'pin_applied': false
            }
          }) %}
        {% endif %}
      {% endfor %}

      {{ ns.result | tojson | from_json }}
