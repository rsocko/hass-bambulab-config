# Docs: docs/features/bambuddy_integration/README.md
- alias: Bambuddy - Upload Print Snapshot on Completion
  id: bambuddy_upload_print_snapshot_on_completion
  description: >
    Optional automation to upload printer snapshot to Bambuddy archive.
    Requires Bambuddy server setup and configuration.
    See docs/features/bambuddy_integration/BAMBUDDY_INTEGRATION.md for setup instructions.
    
    Note: This automation waits 5 seconds after print completion to ensure
    the snapshot from print_complete_notification is ready.
  triggers:
    - device_id: 210dfdfa64085e8cf073e50eae757d90
      domain: bambu_lab
      type: event_print_finished
      trigger: device

  conditions:
    - condition: state
      entity_id: input_boolean.bambuddy_integration_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.bambuddy_history_sync_enabled
      state: "off"
    - condition: template
      value_template: "{{ states('input_text.current_print_archive_id') != '' }}"

  actions:
    # Legacy bridge: delegate finish capture/upload to the active print-history flow.
    - delay:
        seconds: 5

    - variables:
        archive_id: "{{ states('input_text.current_print_archive_id') | string | trim }}"

    - action: input_text.set_value
      target:
        entity_id: input_text.bambuddy_current_archive_id
      data:
        value: "{{ archive_id }}"

    - action: script.capture_and_upload_snapshot
      data:
        stage: "finish"
      continue_on_error: true

    # Log the upload attempt
    - action: logbook.log
      data:
        name: Bambuddy Upload
        message: "Delegated finish snapshot capture/upload to print-history flow for archive {{ archive_id }}"

    # Clear both the legacy helper and the active archive-binding helper after upload.
    - action: text.set_value
      target:
        entity_id: input_text.current_print_archive_id
      data:
        value: ""

    - action: input_text.set_value
      target:
        entity_id: input_text.bambuddy_current_archive_id
      data:
        value: ""

  mode: single
