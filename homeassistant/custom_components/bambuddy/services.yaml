refresh_print_history_browser:
  name: Refresh Print History Browser
  description: Refresh the Bambuddy print history browser cache from the API and local store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to refresh. Leave blank to refresh all Bambuddy entries.
      required: false
      selector:
        text:

query_print_history_browser:
  name: Query Print History Browser
  description: Return a paged query response from the Bambuddy local materialized store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    status:
      name: Status
      required: false
      selector:
        text:
    archive_error:
      name: Archive Error
      description: Filter by archive health state such as Any Error, Missing Core 3MF, Source 3MF Only, or Missing Thumbnail.
      required: false
      selector:
        text:
    enrichment_status:
      name: Enrichment Status
      required: false
      selector:
        text:
    material:
      name: Material
      required: false
      selector:
        text:
    duplicates:
      name: Duplicates
      description: Filter by duplicate role such as Originals Only or Duplicates Only.
      required: false
      selector:
        text:
    printer:
      name: Printer
      required: false
      selector:
        text:
    date_range:
      name: Date Range
      required: false
      selector:
        text:
    designer:
      name: Designer
      required: false
      selector:
        text:
    project:
      name: Project
      required: false
      selector:
        text:
    layer_height:
      name: Layer Height
      required: false
      selector:
        text:
    tag:
      name: Tag
      required: false
      selector:
        text:
    favorites_only:
      name: Favorites Only
      required: false
      selector:
        boolean:
    search:
      name: Search
      required: false
      selector:
        text:
    colors:
      name: Colors
      description: Comma-separated hex colors or a list of colors.
      required: false
      selector:
        text:
    selected_day:
      name: Selected Day
      description: ISO date such as 2026-04-09.
      required: false
      selector:
        text:
    sort:
      name: Sort
      required: false
      selector:
        text:
    activity_metric:
      name: Activity Metric
      required: false
      selector:
        text:
    page:
      name: Page
      required: false
      selector:
        number:
          min: 1
          mode: box
    page_size:
      name: Page Size
      required: false
      selector:
        number:
          min: 1
          mode: box
    include_activity_rows:
      name: Include Activity Rows
      description: Return the full activity-scope archive rows that ignore selected-day narrowing.
      required: false
      selector:
        boolean:

get_print_history_archive_detail:
  name: Get Print History Archive Detail
  description: Return one archive plus local sync and provenance metadata from the Bambuddy store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to load from the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box

append_print_history_event:
  name: Append Print History Event
  description: Append one local per-archive timeline event to the Bambuddy Variant 3 store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    event_type:
      name: Event Type
      description: Normalized event identifier such as print_started, photo_captured, or enrichment_applied.
      required: true
      selector:
        text:
    event_source:
      name: Event Source
      description: Provenance label such as bambuddy_webhook, bambu_lab, ha_script, or ha_service.
      required: true
      selector:
        text:
    event_time:
      name: Event Time
      description: Optional ISO timestamp override. Defaults to now.
      required: false
      selector:
        text:
    event_status:
      name: Event Status
      description: Optional normalized archive-status snapshot.
      required: false
      selector:
        text:
    payload:
      name: Payload
      description: Optional compact JSON-like context for diagnostics or popup hover metadata.
      required: false
      selector:
        object:
    derived_from:
      name: Derived From
      description: Fill only when the event was inferred or backfilled rather than directly emitted.
      required: false
      selector:
        text:
    event_key:
      name: Event Key
      description: Optional idempotence key override. Leave blank to let the integration derive one.
      required: false
      selector:
        text:

set_print_history_review_state:
  name: Set Print History Review State
  description: Create or update local review metadata for one archive in the Bambuddy store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    review_status:
      name: Review Status
      description: Local review state such as unreviewed, needs_review, or reviewed.
      required: true
      selector:
        text:
    mismatch_flags:
      name: Mismatch Flags
      description: Optional comma-separated mismatch flags or list of flags.
      required: false
      selector:
        text:
    review_note:
      name: Review Note
      required: false
      selector:
        text:
    reviewed_at:
      name: Reviewed At
      description: Optional ISO timestamp override. Defaults to now.
      required: false
      selector:
        text:

set_print_history_repair_lineage:
  name: Set Print History Repair Lineage
  description: Create or update a local provenance relationship between two Bambuddy archives.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Source archive identifier in the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box
    related_archive_id:
      name: Related Archive ID
      description: Related archive identifier in the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box
    relation_type:
      name: Relation Type
      description: Relationship label such as derived_from or reprint_of.
      required: true
      selector:
        text:
    note:
      name: Note
      required: false
      selector:
        text:
    created_at:
      name: Created At
      description: Optional ISO timestamp override. Defaults to now.
      required: false
      selector:
        text:

delete_print_history_repair_lineage:
  name: Delete Print History Repair Lineage
  description: Remove one local provenance relationship from the Bambuddy store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Source archive identifier in the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box
    related_archive_id:
      name: Related Archive ID
      description: Related archive identifier in the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box
    relation_type:
      name: Relation Type
      description: Relationship label to delete.
      required: true
      selector:
        text:

estimate_partial_usage:
  name: Estimate Partial Usage
  description: Request a review-oriented failed-print partial-usage estimate through the Bambuddy runtime-repair sidecar configured on the integration entry.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to estimate from.
      required: true
      selector:
        number:
          min: 1
          mode: box
    print_status:
      name: Print Status
      description: Terminal print status such as failed or stopped.
      required: true
      selector:
        text:
    printer_id:
      name: Printer ID
      required: false
      selector:
        number:
          min: 1
          mode: box
    last_layer_num:
      name: Last Layer Number
      required: false
      selector:
        number:
          min: 0
          mode: box
    last_progress:
      name: Last Progress
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
    resolve_spoolman_matches:
      name: Resolve Spoolman Matches
      required: false
      selector:
        boolean:
    keep_tracking_row:
      name: Keep Tracking Row
      required: false
      selector:
        boolean: