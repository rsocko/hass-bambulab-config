refresh_print_history_browser:
  name: Refresh Print History Browser
  description: Refresh the Bambuddy print history browser cache from the API and local store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID to refresh. Leave blank to refresh all Bambuddy entries.
      required: false
      selector:
        text:
    immediate:
      name: Immediate
      description: Run the refresh immediately instead of using the normal coalesced delay.
      required: false
      selector:
        boolean:

query_print_history_browser:
  name: Query Print History Browser
  description: Return a paged query response from the Bambuddy local materialized store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    status:
      name: Status
      required: false
      selector:
        text:
    archive_error:
      name: Archive Error
      description: Filter by archive health state such as Any Error, Missing Core 3MF, Source 3MF Only, or Missing Thumbnail.
      required: false
      selector:
        text:
    enrichment_status:
      name: Enrichment Status
      required: false
      selector:
        text:
    material:
      name: Material
      required: false
      selector:
        text:
    duplicates:
      name: Duplicates
      description: Filter by duplicate role such as Originals Only or Duplicates Only.
      required: false
      selector:
        text:
    printer:
      name: Printer
      required: false
      selector:
        text:
    date_range:
      name: Date Range
      required: false
      selector:
        text:
    start_date:
      name: Start Date
      description: Inclusive lower bound in YYYY-MM-DD format.
      required: false
      selector:
        text:
    end_date:
      name: End Date
      description: Inclusive upper bound in YYYY-MM-DD format.
      required: false
      selector:
        text:
    designer:
      name: Designer
      required: false
      selector:
        text:
    project:
      name: Project
      required: false
      selector:
        text:
    layer_height:
      name: Layer Height
      required: false
      selector:
        text:
    tag:
      name: Tag
      required: false
      selector:
        text:
    favorites_only:
      name: Favorites Only
      required: false
      selector:
        boolean:
    search:
      name: Search
      required: false
      selector:
        text:
    colors:
      name: Colors
      description: Comma-separated hex colors or a list of colors.
      required: false
      selector:
        text:
    selected_day:
      name: Selected Day
      description: ISO date such as 2026-04-09.
      required: false
      selector:
        text:
    sort:
      name: Sort
      required: false
      selector:
        text:
    activity_metric:
      name: Activity Metric
      required: false
      selector:
        text:
    page:
      name: Page
      required: false
      selector:
        number:
          min: 1
          mode: box
    page_size:
      name: Page Size
      required: false
      selector:
        number:
          min: 1
          mode: box
    include_activity_rows:
      name: Include Activity Rows
      description: Return the full activity-scope archive rows that ignore selected-day narrowing.
      required: false
      selector:
        boolean:

get_print_history_archive_detail:
  name: Get Print History Archive Detail
  description: Return one archive plus local sync and provenance metadata from the Bambuddy store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to load from the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box

get_print_history_archive_enrichment_metadata:
  name: Get Print History Archive Enrichment Metadata
  description: Return the system-managed enrichment tags and hidden note payload for one archive, plus a filtered row view for operator review.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to inspect.
      required: true
      selector:
        number:
          min: 1
          mode: box
    mode:
      name: Mode
      description: Row filter for the returned hidden payload rows. Use ALL, ANY_MISSING_DATA, MISSING_SPOOL, or MISSING_FILAMENT.
      required: false
      selector:
        text:

update_print_history_archive:
  name: Update Print History Archive
  description: Update one Bambuddy archive through the integration connection, then refresh the local Variant 3 store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    print_name:
      name: Print Name
      required: false
      selector:
        text:
    tags:
      name: Tags
      description: Comma-separated archive tags.
      required: false
      selector:
        text:
    notes:
      name: Notes
      required: false
      selector:
        text:
    cost:
      name: Cost
      required: false
      selector:
        number:
          min: 0
          mode: box
    status:
      name: Status
      required: false
      selector:
        text:
    failure_reason:
      name: Failure Reason
      description: Leave blank to clear the current value.
      required: false
      selector:
        text:
    project_id:
      name: Project ID
      description: Project ID to assign. Leave blank to clear the current project.
      required: false
      selector:
        text:

update_print_history_archive_enrichment_metadata:
  name: Update Print History Archive Enrichment Metadata
  description: Replace the system-managed enrichment tag set and or hidden note payload for one archive while preserving operator-managed tags and notes.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    tag_metadata:
      name: Tag Metadata (JSON Object)
      description: Full replacement for the system-managed enrichment tags. Pass a JSON object containing system_tags.
      required: false
      selector:
        text:
    note_metadata:
      name: Note Metadata (JSON Object)
      description: Full replacement for the system-managed hidden note data. Pass a JSON object containing payload and optionally recovery_block and slot_overrides.
      required: false
      selector:
        text:
    slot_overrides:
      name: Slot Overrides (JSON Array)
      description: Optional JSON array of slot override rows such as [{"slot_id":"1","tray":"B2"}]. Each row must include slot_id and at least one of tray, spool_id, or filament_id.
      required: false
      selector:
        text:

set_print_history_archive_favorite:
  name: Set Print History Archive Favorite
  description: Ensure one Bambuddy archive is favorited or unfavorited through the integration connection.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    is_favorite:
      name: Favorite State
      required: true
      selector:
        boolean:

refresh_print_history_archive_detail:
  name: Refresh Print History Archive Detail
  description: Fetch one archive from Bambuddy and immediately upsert it into the local Variant 3 store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to refresh from the upstream API.
      required: true
      selector:
        number:
          min: 1
          mode: box

append_print_history_event:
  name: Append Print History Event
  description: Append one local per-archive timeline event to the Bambuddy Variant 3 store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    event_type:
      name: Event Type
      description: Normalized intermediate event identifier such as print_paused, photo_captured, or enrichment_applied. Start and terminal timeline anchors come from the archive record itself.
      required: true
      selector:
        text:
    event_source:
      name: Event Source
      description: Provenance label such as bambuddy_webhook, bambu_lab, ha_script, or ha_service.
      required: true
      selector:
        text:
    event_time:
      name: Event Time
      description: Optional ISO timestamp override. Defaults to now.
      required: false
      selector:
        text:
    event_status:
      name: Event Status
      description: Optional normalized archive-status snapshot.
      required: false
      selector:
        text:
    payload:
      name: Payload
      description: Optional compact JSON-like context for diagnostics or popup hover metadata.
      required: false
      selector:
        object:
    derived_from:
      name: Derived From
      description: Fill only when the event was inferred or backfilled rather than directly emitted.
      required: false
      selector:
        text:
    event_key:
      name: Event Key
      description: Optional idempotence key override. Leave blank to let the integration derive one.
      required: false
      selector:
        text:

set_print_history_review_state:
  name: Set Print History Review State
  description: Create or update local review metadata for one archive in the Bambuddy store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    review_status:
      name: Review Status
      description: Local review state such as unreviewed, needs_review, or reviewed.
      required: true
      selector:
        text:
    mismatch_flags:
      name: Mismatch Flags
      description: Optional comma-separated mismatch flags or list of flags.
      required: false
      selector:
        text:
    review_note:
      name: Review Note
      required: false
      selector:
        text:
    reviewed_at:
      name: Reviewed At
      description: Optional ISO timestamp override. Defaults to now.
      required: false
      selector:
        text:

set_print_history_primary_photo:
  name: Set Print History Primary Photo
  description: Store or clear the local primary photo override used for list and preview rendering in the Bambuddy store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    photo_path:
      name: Photo Path
      description: Archive photo filename/path to promote. Leave blank to clear the local override and fall back to the default preview order.
      required: false
      selector:
        text:

delete_print_history_photo:
  name: Delete Print History Photo
  description: Delete one archive photo in Bambuddy, then refresh the local print-history store detail snapshot.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    photo_path:
      name: Photo Path
      description: Archive photo filename/path to delete. The integration uses the basename when calling Bambuddy.
      required: true
      selector:
        text:

set_print_history_media_review_state:
  name: Set Print History Media Review State
  description: Create or update local photo-review workflow state for one archive in the Bambuddy store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    review_status:
      name: Review Status
      description: Local media review state such as pending, reviewing, completed, dismissed, or idle.
      required: true
      selector:
        text:
    requested_at:
      name: Requested At
      description: Optional ISO timestamp for when media review was requested.
      required: false
      selector:
        text:
    started_at:
      name: Started At
      description: Optional ISO timestamp for when review work began.
      required: false
      selector:
        text:
    completed_at:
      name: Completed At
      description: Optional ISO timestamp for when review was completed.
      required: false
      selector:
        text:
    dismissed_at:
      name: Dismissed At
      description: Optional ISO timestamp for when review was dismissed.
      required: false
      selector:
        text:
    photo_count:
      name: Photo Count
      description: Optional photo count snapshot for the archive at review time.
      required: false
      selector:
        number:
          min: 0
          mode: box
    last_action:
      name: Last Action
      description: Optional action label such as delete, upload, primary_photo, or dismissed.
      required: false
      selector:
        text:
    review_note:
      name: Review Note
      required: false
      selector:
        text:

dismiss_print_history_media_review:
  name: Dismiss Print History Media Review
  description: Mark one archive's local media-review workflow as dismissed.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to dismiss.
      required: true
      selector:
        number:
          min: 1
          mode: box

set_print_history_repair_lineage:
  name: Set Print History Repair Lineage
  description: Create or update a local provenance relationship between two Bambuddy archives.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Source archive identifier in the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box
    related_archive_id:
      name: Related Archive ID
      description: Related archive identifier in the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box
    relation_type:
      name: Relation Type
      description: Relationship label such as derived_from or reprint_of.
      required: true
      selector:
        text:
    note:
      name: Note
      required: false
      selector:
        text:
    created_at:
      name: Created At
      description: Optional ISO timestamp override. Defaults to now.
      required: false
      selector:
        text:

delete_print_history_repair_lineage:
  name: Delete Print History Repair Lineage
  description: Remove one local provenance relationship from the Bambuddy store.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Source archive identifier in the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box
    related_archive_id:
      name: Related Archive ID
      description: Related archive identifier in the local store.
      required: true
      selector:
        number:
          min: 1
          mode: box
    relation_type:
      name: Relation Type
      description: Relationship label to delete.
      required: true
      selector:
        text:

estimate_partial_usage:
  name: Estimate Partial Usage
  description: Request a review-oriented failed-print partial-usage estimate through the Bambuddy runtime-repair sidecar configured on the integration entry.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to estimate from.
      required: true
      selector:
        number:
          min: 1
          mode: box
    print_status:
      name: Print Status
      description: Terminal print status such as failed or stopped.
      required: true
      selector:
        text:
    printer_id:
      name: Printer ID
      required: false
      selector:
        number:
          min: 1
          mode: box
    last_layer_num:
      name: Last Layer Number
      required: false
      selector:
        number:
          min: 0
          mode: box
    last_progress:
      name: Last Progress
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
    resolve_spoolman_matches:
      name: Resolve Spoolman Matches
      required: false
      selector:
        boolean:
    keep_tracking_row:
      name: Keep Tracking Row
      required: false
      selector:
        boolean:

repair_print_history_archive_from_start:
  name: Repair Print History Archive From Start
  description: Compute completed and created timestamps from a provided historical start time, then send the repair through the Bambuddy runtime-repair sidecar configured on the integration entry.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    archive_id:
      name: Archive ID
      description: Bambuddy archive identifier to repair.
      required: true
      selector:
        number:
          min: 1
          mode: box
    started_at:
      name: Started At
      description: ISO timestamp to treat as the historical print start.
      required: true
      selector:
        text:
    duration_seconds:
      name: Duration Seconds Override
      description: Optional explicit duration override. When omitted, the service uses print_time_seconds first, then actual_time_seconds.
      required: false
      selector:
        number:
          min: 1
          mode: box
    created_at:
      name: Created At Override
      description: Optional ISO timestamp override. Defaults to the provided started_at timestamp to match normal Bambuddy archive creation behavior.
      required: false
      selector:
        text:
    status:
      name: Status Override
      description: Optional status such as completed, failed, or cancelled.
      required: false
      selector:
        text:
    set_status_completed:
      name: Set Status Completed
      description: When true and status is omitted, send completed as the repaired status.
      required: false
      selector:
        boolean:
    failure_reason:
      name: Failure Reason
      description: Optional failure reason to write with the repair.
      required: false
      selector:
        text:
    audit_note:
      name: Audit Note
      description: Optional audit note appended by the runtime-repair sidecar.
      required: false
      selector:
        text:
    dry_run:
      name: Dry Run
      description: Preview the computed timestamps without applying the repair.
      required: false
      selector:
        boolean:
    response_detail:
      name: Response Detail
      description: Choose full or summary sidecar response detail.
      required: false
      selector:
        select:
          options:
            - full
            - summary

get_print_history_archive_restore_workflow:
  name: Get Print History Archive Restore Workflow
  description: Return the transient HA-managed replacement-upload and restore workflow state for one source or target archive.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    source_archive_id:
      name: Source Archive ID
      description: Original Bambuddy archive identifier being repaired.
      required: false
      selector:
        number:
          min: 1
          mode: box
    target_archive_id:
      name: Target Archive ID
      description: Optional replacement archive identifier if already created.
      required: false
      selector:
        number:
          min: 1
          mode: box

create_print_history_archive_replacement_from_upload:
  name: Create Print History Archive Replacement From Upload
  description: Create a new Bambuddy replacement archive from a staged browser-upload session without moving the file through websocket or helper state.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry ID. Leave blank when only one Bambuddy entry is configured.
      required: false
      selector:
        text:
    source_archive_id:
      name: Source Archive ID
      description: Original Bambuddy archive identifier being repaired.
      required: true
      selector:
        number:
          min: 1
          mode: box
    upload_session_id:
      name: Upload Session ID
      description: Session identifier returned by the multipart upload endpoint after the replacement `.gcode.3mf` file is staged on disk.
      required: true
      selector:
        text:
    printer_id:
      name: Printer ID
      description: Optional printer override. Defaults to the printer ID captured when the upload was staged.
      required: false
      selector:
        number:
          min: 1
          mode: box

plan_print_history_archive_restore:
  name: Plan Print History Archive Restore
  description: Call the Bambuddy runtime-repair sidecar in dry-run mode to preview a source-to-target restore plan.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    source_archive_id:
      name: Source Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    target_archive_id:
      name: Target Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box

apply_print_history_archive_restore:
  name: Apply Print History Archive Restore
  description: Apply the planned source-to-target restore through the Bambuddy runtime-repair sidecar.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    source_archive_id:
      name: Source Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    target_archive_id:
      name: Target Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    audit_note:
      name: Audit Note
      required: false
      selector:
        text:

verify_print_history_archive_restore:
  name: Verify Print History Archive Restore
  description: Verify a source-to-target restore pair through the Bambuddy runtime-repair sidecar without removing the original archive.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    source_archive_id:
      name: Source Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    target_archive_id:
      name: Target Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box

finish_print_history_archive_restore:
  name: Finish Print History Archive Restore
  description: Refresh the replacement archive, optionally attempt re-enrichment, and move the restore workflow to verify-complete or pending-reenrich state.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    source_archive_id:
      name: Source Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    target_archive_id:
      name: Target Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    attempt_reenrich:
      name: Attempt Re-Enrich
      required: false
      selector:
        boolean:
    retain_original:
      name: Retain Original
      required: false
      selector:
        boolean:

remove_print_history_restored_source_archive:
  name: Remove Print History Restored Source Archive
  description: Remove the original source archive after a clean verify pass has marked the restore pair as removable.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    source_archive_id:
      name: Source Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    target_archive_id:
      name: Target Archive ID
      required: true
      selector:
        number:
          min: 1
          mode: box

clear_print_history_archive_restore:
  name: Clear Print History Archive Restore
  description: Clear transient HA-managed restore workflow state and discard any staged upload session for the selected pair.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    source_archive_id:
      name: Source Archive ID
      required: false
      selector:
        number:
          min: 1
          mode: box
    target_archive_id:
      name: Target Archive ID
      required: false
      selector:
        number:
          min: 1
          mode: box