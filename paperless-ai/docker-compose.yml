services:
  # Ollama service for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Paperless-AI service for document processing
  paperless-ai:
    image: clusterzx/paperless-ai:latest
    container_name: paperless-ai
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "3000:3000"
    volumes:
      - paperless_ai_data:/app/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PAPERLESS_AI_PORT=${PAPERLESS_AI_PORT:-3000}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://paperless-ai:8000}
      - RAG_SERVICE_ENABLED=${RAG_SERVICE_ENABLED:-true}
      # Paperless-ngx connection
      - PAPERLESS_API_URL=${PAPERLESS_API_URL}
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - PAPERLESS_USERNAME=${PAPERLESS_USERNAME}
      # AI Provider configuration
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # Processing configuration
      - SCAN_INTERVAL=${SCAN_INTERVAL:-*/30 * * * *}
      - PROCESS_PREDEFINED_DOCUMENTS=${PROCESS_PREDEFINED_DOCUMENTS:-yes}
      - TAGS=${TAGS:-pre-process}
      - ADD_AI_PROCESSED_TAG=${ADD_AI_PROCESSED_TAG:-no}
      - AI_PROCESSED_TAG_NAME=${AI_PROCESSED_TAG_NAME:-ai-processed}
      - USE_PROMPT_TAGS=${USE_PROMPT_TAGS:-no}
      - USE_EXISTING_DATA=${USE_EXISTING_DATA:-no}
      # System prompt
      - SYSTEM_PROMPT=${SYSTEM_PROMPT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ollama_data:
    driver: local
  paperless_ai_data:
    driver: local

networks:
  default:
    name: paperless-ai-network
