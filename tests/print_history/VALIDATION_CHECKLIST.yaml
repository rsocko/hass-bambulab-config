# C. END-TO-END SMOKE TEST — FULL PRINT LIFECYCLE
# ═══════════════════════════════════════════════════════════════════════════════
#
# Prerequisites:
#   [ ] Bambuddy server running and reachable from HA
#   [ ] API key configured in secrets.yaml
#   [ ] input_boolean.bambuddy_integration_enabled = ON
#   [ ] input_boolean.bambuddy_history_fetch_enabled = ON
#   [ ] At least one capture toggle ON (e.g., capture_at_start, capture_on_error)
#   [ ] Bambuddy webhook configured to POST to HA
#   [ ] Printer connected and idle
#
# Steps:
#   1. [ ] Start a short test print (~5 min benchy/cube)
#   2. [ ] VERIFY: Bambuddy fires print_started webhook
#   3. [ ] VERIFY: bambuddy_current_archive_id is populated
#   4. [ ] VERIFY: bambuddy_tray_map_snapshot has tray:spool CSV
#   5. [ ] VERIFY: bambuddy_photo_manifest reset to "[]"
#   6. [ ] VERIFY: Start photo captured after 3-min delay (if toggle on)
#   7. [ ] Wait for print to reach midprint threshold
#   8. [ ] VERIFY: Midprint photo captured (if toggle on + threshold crossed)
#   9. [ ] Wait for print to reach >94% progress
#   10. [ ] VERIFY: Near-complete photo captured (if toggle on)
#   11. [ ] Wait for print to complete
#   12. [ ] VERIFY: Bambuddy fires print_complete webhook
#   13. [ ] VERIFY: Finish photo captured
#   14. [ ] VERIFY: Enrichment automation runs (check traces)
#   15. [ ] VERIFY: Archive in Bambuddy has HA-enriched tags + notes
#   16. [ ] VERIFY: History sensor refreshes (5s delay then update)
#   17. [ ] VERIFY: Template sensors show latest print data
#   18. [ ] VERIFY: bambuddy_current_archive_id cleared
#   19. [ ] VERIFY: Photo review state = "pending" (if photos captured)
#   20. [ ] VERIFY: Dashboard shows the completed print in history table
#
# Error Path Variant:
#   1. [ ] Start a print and deliberately cancel/stop it mid-print
#   2. [ ] VERIFY: print_failed/print_stopped webhook fires
#   3. [ ] VERIFY: Error photo captured (if capture_on_error is ON)
#   4. [ ] VERIFY: Enrichment runs with status:failed or status:stopped
#   5. [ ] VERIFY: Archive in Bambuddy reflects error state in tags/notes

# ═══════════════════════════════════════════════════════════════════════════════
# D. REGRESSION CHECKS — KNOWN PITFALLS
# ═══════════════════════════════════════════════════════════════════════════════
#
# D1. Tags must be comma-separated strings, NOT JSON arrays
#     The Bambuddy PATCH /archives/{id} expects: "tags": "a,b,c"
#     NOT: "tags": ["a", "b", "c"]
#     Verified in: test_enrichment_builds_comma_separated_tags (pytest)
#     Verified in: test_update_archive_payload_uses_tojson_for_strings (pytest)
#
# D2. Tray map snapshot must fit 255-char input_text limit
#     Uses compact format: ams_1_tray_1:25,ams_1_tray_2:72,...
#     Verified live: 130 chars for 8 trays mapped (safe margin)
#     Risk: > ~20 trays or very long tray names could exceed limit
#
# D3. YAML automations must NOT use 'enabled:' key
#     Only UI-managed automations support this. YAML uses condition hack.
#     Verified in: test_automations_do_not_use_enabled_key (pytest)
#
# D4. No 'initial:' on state-persistence helpers
#     Prevents recorder restore on HA restart.
#     Verified in: test_state_persistence_helpers_have_no_initial (pytest)
#     OK on config helpers: history_limit, midprint_capture_percent, etc.
#
# D5. No hardcoded device_id values
#     Legacy bambuddy had device_id 210dfdfa... hardcoded.
#     Verified in: test_no_device_id_in_print_history (pytest)
#
# D6. REST sensor scan_interval must be reasonable (60s-3600s)
#     Currently 300s (5 min). Too aggressive hammers Bambuddy API.
#     Verified in: test_has_reasonable_scan_interval (pytest)
#
# D7. Vendor tags may be empty from current enrichment sources
#     Neither cost_breakdown.vendor nor tray_map.vendor is populated.
#     Material names include vendor prefix as workaround.
#     FUTURE: Parse vendor from material name or enhance data sources.
