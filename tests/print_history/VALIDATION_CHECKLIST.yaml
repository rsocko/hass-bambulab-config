# ── B1. WEBHOOK END-TO-END ───────────────────────────────────────────────────
#
# B1.1  Webhook Delivery (API Format)
#       POST to http://<ha-host>/api/webhook/bambuddy_events
#       Body: {"event":"print_started","data":{"archive_id":"999","name":"Test Print","printer_id":"1"}}
#       VERIFY: Check logbook for "Received event 'print_started'"
#       VERIFY: input_text.bambuddy_current_archive_id = "999"
#       VERIFY: input_text.bambuddy_photo_manifest = "[]"
#       VERIFY: input_text.bambuddy_tray_map_snapshot = <tray map CSV>
#       VERIFY: input_select.bambuddy_photo_review_state = "idle"
#
# B1.2  Webhook Delivery (Notification Format)
#       POST to http://<ha-host>/api/webhook/bambuddy_events
#       Body: {"event":"print_complete","print_name":"Test Print","printer_id":"1","archive_id":"999"}
#       VERIFY: Enrichment automation fires (check traces)
#       VERIFY: rest_command.bambuddy_update_archive called with tags string
#
# B1.3  Webhook with Missing Archive ID
#       POST: {"event":"print_started","data":{"name":"Test Print","printer_id":"1"}}
#       VERIFY: script.resolve_current_archive_id is called (fallback)
#       VERIFY: Logbook shows fallback resolution attempt
#
# ── B2. PHOTO CAPTURE (requires active print) ────────────────────────────────
#
# B2.1  Enable Capture Toggles
#       Turn ON: input_boolean.capture_at_start
