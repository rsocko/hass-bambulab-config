- alias: "Logging: Error Alert Handler"
  description: "Monitor system logs for critical errors and trigger alerts"
  mode: queued
  max: 20
  trigger:
    # Trigger on ERROR level log entries
    - platform: event
      event_type: system_log_event
      event_data:
        level: ERROR
  
  condition:
    # Only process logs from Bambu Lab components
    - condition: template
      value_template: >-
        {{ trigger.event.data.name is defined and 
           'bambulab' in trigger.event.data.name | lower }}
  
  action:
    - variables:
        log_message: "{{ trigger.event.data.message[0] if trigger.event.data.message is defined else 'Unknown error' }}"
        log_source: "{{ trigger.event.data.name }}"
        timestamp: "{{ now().isoformat() }}"
        
    # Store error in input_text for dashboard display
    - service: text.set_value
      target:
        entity_id: input_text.last_bambulab_error
      data:
        value: "[{{ timestamp }}] {{ log_source }}: {{ log_message }}"
    
    # Update error counter
    - service: counter.increment
      target:
        entity_id: counter.bambulab_error_count
    
    # Send notification for critical errors
    - choose:
        # Print completion errors
        - conditions:
            - condition: template
              value_template: "{{ 'Print Complete ERROR' in log_message }}"
          sequence:
            - service: notify.persistent_notification
              data:
                title: "🚨 Print Completion Error"
                message: |
                  **Print job failed to update in Spoolman**
                  
                  {{ log_message }}
                  
                  Time: {{ timestamp }}
                  
                  Check logs for details: Settings > System > Logs
                notification_id: "print_complete_error_{{ now().timestamp() | int }}"
            
            # Flash WLED red for visual alert (if configured)
            - service: light.turn_on
              target:
                entity_id: light.bambu_lab_wled
              data:
                effect: "Solid"
                rgb_color: [255, 0, 0]
                brightness: 255
              continue_on_error: true
        
        # Spool matching errors
        - conditions:
            - condition: template
              value_template: "{{ 'Find Matching Spool ERROR' in log_message }}"
          sequence:
            - service: notify.persistent_notification
              data:
                title: "⚠️ Spool Matching Issue"
                message: |
                  **Unable to match spool in Spoolman**
                  
                  {{ log_message }}
                  
                  Time: {{ timestamp }}
                  
                  This may indicate duplicate UUIDs or ambiguous spool data.
                notification_id: "spool_match_error_{{ now().timestamp() | int }}"
        
        # UUID conflict errors (data integrity)
        - conditions:
            - condition: template
              value_template: "{{ 'same UUID' in log_message }}"
          sequence:
            - service: notify.persistent_notification
              data:
                title: "🔴 Data Integrity Alert"
                message: |
                  **CRITICAL: Duplicate UUID detected in Spoolman**
                  
                  {{ log_message }}
                  
                  Time: {{ timestamp }}
                  
                  **Action Required**: Review and fix duplicate UUIDs in Spoolman database.
                notification_id: "uuid_conflict_{{ now().timestamp() | int }}"
      
      # Default: Send generic error notification
      default:
        - service: notify.persistent_notification
          data:
            title: "⚠️ Bambu Lab Error"
            message: |
              **{{ log_source }}**
              
              {{ log_message }}
              
              Time: {{ timestamp }}
            notification_id: "bambulab_error_{{ now().timestamp() | int }}"

- alias: "Logging: Warning Alert Handler"
  description: "Monitor system logs for warnings that may need attention"
  mode: queued
  max: 20
  trigger:
    # Trigger on WARNING level log entries
    - platform: event
      event_type: system_log_event
      event_data:
        level: WARNING
  
  condition:
    # Only process logs from Bambu Lab components
    - condition: template
      value_template: >-
        {{ trigger.event.data.name is defined and 
           'bambulab' in trigger.event.data.name | lower }}
  
  action:
    - variables:
        log_message: "{{ trigger.event.data.message[0] if trigger.event.data.message is defined else 'Unknown warning' }}"
        log_source: "{{ trigger.event.data.name }}"
        timestamp: "{{ now().isoformat() }}"
    
    # Store warning in input_text for dashboard display
    - service: text.set_value
      target:
        entity_id: input_text.last_bambulab_warning
      data:
        value: "[{{ timestamp }}] {{ log_source }}: {{ log_message }}"
    
    # Update warning counter
    - service: counter.increment
      target:
        entity_id: counter.bambulab_warning_count
    
    # Only notify for repeated warnings (potential issues)
    - condition: template
      value_template: >-
        {{ states('counter.bambulab_warning_count') | int > 5 }}
    
    - service: notify.persistent_notification
      data:
        title: "⚠️ Multiple Warnings Detected"
        message: |
          **{{ states('counter.bambulab_warning_count') }} warnings in recent history**
          
          Latest: {{ log_message }}
          
          Time: {{ timestamp }}
          
          Source: {{ log_source }}
        notification_id: "bambulab_warnings"

- alias: "Logging: Reset Error Counters Daily"
  description: "Reset error and warning counters at midnight"
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - service: counter.reset
      target:
        entity_id:
          - counter.bambulab_error_count
          - counter.bambulab_warning_count
