# Input Helpers for Logging System
# These helpers store log data and error states for dashboard display
# Add to configuration.yaml with: input_text: !include logging/helpers/input_helpers.yaml

# Store the last error message
last_bambulab_error:
  name: "Last Bambu Lab Error"
  initial: "No errors"
  max: 255
  icon: mdi:alert-circle

# Store the last warning message
last_bambulab_warning:
  name: "Last Bambu Lab Warning"
  initial: "No warnings"
  max: 255
  icon: mdi:alert

# Store aggregated log data (for webhook forwarding)
log_aggregation_buffer:
  name: "Log Aggregation Buffer"
  initial: "[]"
  max: 65535
  icon: mdi:text-box-multiple
