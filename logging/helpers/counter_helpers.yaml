# Counter Helpers for Logging System
# Track error and warning counts
# Add to configuration.yaml with: counter: !include logging/helpers/counter_helpers.yaml

bambulab_error_count:
  name: "Bambu Lab Error Count"
  initial: 0
  step: 1
  icon: mdi:counter

bambulab_warning_count:
  name: "Bambu Lab Warning Count"
  initial: 0
  step: 1
  icon: mdi:alert-outline
